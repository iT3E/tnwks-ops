body: 'homelab-wsl runs kube-proxy again: the kernel NFS client (the sites volume and the sites-builder runner) mounts the nfs-server ClusterIP, which Cilium''s kube-proxy replacement doesn''t translate for in-kernel clients, so the sites pages were down after a node restart.'
