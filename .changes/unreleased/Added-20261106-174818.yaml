body: 'Plausible can move between the WSL sites: its Postgres runs as a CNPG replica cluster on homelab-wsl-02 (cnpg-standby), its Service is global with service-upstream Ingresses, and bin/site-failover moves its ClickHouse volume with a transfer-only kopiur policy.'
