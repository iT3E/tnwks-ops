kind: Added
body: 'Agent platform: the finance app as a tool of the finance agent, read and write and never delete. A proxy in agents-finance holds the token of the agent at the app and lets through only an allow list of calls (GET, POST and PUT on the paths of the kept tools; each delete, trigger, rule write, export, attachment and setting refused). The MCP server of the app (fireflyiii-mcp 1.0.1, pinned by digest, 7 days of release age and a review for each update) calls the app through it with no token, and the sandboxes of the agent reach it with no credential by one rule of their sandbox policy. The agent filters and denies the same tools. A daily probe tests both clients of the proxy. The token is a placeholder until the owner puts it in (docs/apps/agent-platform.md, "The finance app").'
