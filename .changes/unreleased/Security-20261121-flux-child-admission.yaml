kind: Security
body: 'Flux: the admission policy flux-child-scope (kubernetes/apps/flux-system/admission, docs/operations/flux-admission.md) limits what a Flux child outside the "ask first" class may apply: no cluster object, no object in a namespace of the class, no RBAC, no Flux Kustomization, no privileged pod spec, and no change of an object of the class; Kustomizations and HelmReleases of the class must come from their parents in git. Its lists come from git (classlist.py, checked in CI), its rules run on a throwaway API server in CI, each rule switched off once to show its test fails, and both sites keep its audit and deny counts. The binding starts with Audit and Warn'
