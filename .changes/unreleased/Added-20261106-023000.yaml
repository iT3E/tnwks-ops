kind: Added
body: 'Cilium BGP on homelab-wsl-02: every node peers with its distro''s FRR and announces its pod CIDR (and, later, shared VIPs from a new `shared-vip` pool), so the router learns the site''s pods. The control plane is off by default (`CILIUM_BGP_ENABLED`); homelab-ms-01 is unchanged.'
