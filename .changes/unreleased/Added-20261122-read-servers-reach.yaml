body: 'agents: the gateway probes of main and finance try the cluster, Flux and Terraform servers of main straight each day: only the gateway may reach them. A time out passes (a policy drop is silent); a refusal (no ready backend or a closed port), an answer and a name that does not resolve each fail. The probes use no key on a read route.'
