body: 'monitoring: the logs of some long-running pods of the agent platform go to Loki, on an allowlist (the pod label logs.home.arpa/ship=true): the run receiver and the sandbox gateway of the workflows trust domain, its sandbox supervisors, the backup, sandbox-start and init containers of the pilot agent pod, and the model bridge. The Vector agent drops command previews and query strings on the node. New alerts: AgentInstructionFileChanged, AgentInstructionCheckStale and ModelBridgeRateLimited.'
