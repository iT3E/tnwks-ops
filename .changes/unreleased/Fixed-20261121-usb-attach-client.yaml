kind: Fixed
body: 'wsl: the USB attach unit of the distro attaches with the usbip client of usbipd-win against the usbipd service of the host, as usbipd attach needs rights at the Windows service control manager that a batch logon of a standard account does not hold; with no elevation the Windows backup task hands the attach to the distro and the watchdog skips its USB attach'
