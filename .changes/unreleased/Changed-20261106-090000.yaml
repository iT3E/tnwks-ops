body: 'Home Assistant''s trusted proxies are in git: the init container adds every WSL site''s pod CIDR (10.42, 10.44, 10.46) to HA''s HTTP settings store before it starts, so a switchover to homelab-wsl-02, or homelab-wsl''s move to Cilium, keeps the ingress trusted with no UI step.'
