kind: Added
body: "Cluster definition for `homelab-wsl-02` (Talos in Docker on WSL-02): `talos/wsl-02` (multi-document patches for talosctl >= 1.14), `kubernetes/clusters/wsl-02` with Cilium as CNI and LoadBalancer (LB IPAM + L2 announcements, no MetalLB), local-path on the distro's ext4 vhdx, its own SOPS age recipient, and Flux applied from committed manifests over HTTPS (no `flux bootstrap`, nothing pushed to main). The bootstrap playbooks take any Docker-provisioned cluster from `talos_clusters`, and `02-cni-bootstrap.yml` installs Cilium with the HelmRelease's own values. The shared Cilium HelmRelease drops `CAP_SYS_MODULE` (Talos' Cilium values), which is what kept Cilium off WSL; the docs that said it can't run there are corrected. `task bootstrap:wsl-02`."
time: 2026-11-05T03:00:00.000000000-08:00
