kind: Added
body: 'Ansible: the roles windows_host_mcp_user and wsl_host_mcp_user make the local user of the host server of the main agent on the Windows host and in the distro of a site, with no admin group, a key for the source address of the cluster only, and startup files and a key file that only an admin changes; windows_sshd gives it a Match block of its own. Off on each site until the owner turns it on, so this change makes no change on a host'
