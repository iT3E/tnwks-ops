kind: Added
body: 'security: the Wazuh server for step 2 of the security platform (task 8.3, 8.4 and 8.5), written and not listed by any cluster, so Flux applies none of it. An overlay on the vendor manifests of wazuh-kubernetes at v5.0.0-rc2 (images by digest): one manager, one indexer with single-node discovery and no privileged init container, and the dashboard, each with a node selector and the memory line of the security README. The overlay adds certificates from a CA of the server in cert-manager, the manager configuration (HTTPS on 1517 only, no legacy listener or legacy enrollment, no remote upgrade), the egress of the indexer to its content feed, the LoadBalancer of the agents, and the settings of the indexer from git in two steps: a Job that applies the accounts that carry its mark, with each hash from a SOPS Secret, only when its files change, and a Job at each change of its files plus a daily CronJob that apply the ISM retention of tnwks, move each index to it, start no move in the hour before a certificate renewal, and write the count of indices not on a policy of tnwks for the converter. A CI test pins each age, so a merge that lowers one needs an edit of the pin. To prove at the first run on site 2: the indexer reaches its feed through its egress rule only, step 2 needs no ISM action beyond the five of its role, a backing index made by a rollover takes the policy of tnwks, and which audit and alert files the image writes.'
