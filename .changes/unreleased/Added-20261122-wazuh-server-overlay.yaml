kind: Added
body: 'security: the Wazuh server for step 2 of the security platform (task 8.3, 8.4 and 8.5), written and not listed by any cluster, so Flux applies none of it. An overlay on the vendor manifests of wazuh-kubernetes at v5.0.0-rc2 (images by digest): one manager, one indexer with single-node discovery and no privileged init container, and the dashboard, each with a node selector and the memory line of the security README. The overlay adds certificates from a CA of the server in cert-manager, the manager configuration (HTTPS on 1517 only, no legacy listener or legacy enrollment, no remote upgrade), the egress of the indexer to its content feed, the LoadBalancer of the agents, and a settings job that applies the accounts and the ISM retention of tnwks from git. Not yet proven on a cluster: the test cluster of task 8.2 runs it first.'
