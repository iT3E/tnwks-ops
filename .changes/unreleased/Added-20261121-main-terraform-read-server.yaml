body: 'agents: the Terraform server of main (task 6.19, not live until the owner sets the order of go-live). The Terraform MCP server 1.4.1 of HashiCorp (pinned by digest) in agents-main with the registry toolset and no token, no account at the API server, and egress to the public registry only. The route main-terraform on the central MCP gateway takes the key of the main agent only and names the nine registry tools, from the dump tools/terraform.json.'
