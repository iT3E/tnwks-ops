kind: Added
body: 'security: the Prowler runs for Cloudflare and GitHub (`kubernetes/apps/security/prowler`), each day with the scan list of the registry, and network policies for `api.cloudflare.com` and `api.github.com`. Neither runs until the owner adds its read-only token as a SOPS Secret and names it in the app; the README has the steps and the least scope of each token. The new alert `SecurityTokenExpiring` fires 30 days before the end date that the owner writes to the Lease of a token. The run for GitHub stays out until the owner decides how the registry checks that account'
