kind: Added
body: "Windows hosts, the rehearsal of the move: a boot run of the group test. The phase interrupt with -e wsl_move_rehearsal_boot_group_steps=true writes a boot request after its window, and the boot run then takes the group steps and the group test from it, for that one run: A joins Administrators at way back step 1, after the restart, and the end of the run takes it out whatever the result, after A's stop task ended a VM that the import back started. A boot run after a power loss takes A out first. The procedure refuses the group test with the restart on, with a config of the rehearsal, group steps and a group test that are not equal (in each mode, from a request or from the config), and a boot request that is not two equal booleans; only the boot mode reads the boot request. The phase after-boot checks this case with the same switch, removes an icon of the shortcut that A does not own, compares the count of the VM processes with the baseline, starts A's start task and reads A's tokens. The check play accepts the group moments of such a boot run."
