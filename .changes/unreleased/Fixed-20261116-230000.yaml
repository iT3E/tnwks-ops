kind: Fixed
body: 'Windows: the tasks of the rehearsal account register. Microsoft asks an administrator, SYSTEM included, for the password of a different account to register an S4U task for it. With s4u_user, tnwks_win_scheduled_task now makes a new random password on the host, sets it on the account, registers the task with it and drops it; it does so only when the task must be registered, never in check mode, and the password is in no argument, result, diff or failure text. Only for an account whose password nobody needs: the temporary account of the rehearsal. The probe and the import name a task that fails to log on at its start.'
time: 2026-11-16T23:00:00.000000000Z
