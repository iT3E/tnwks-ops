kind: Security
body: 'CI: the gates that run code of a branch ask pr-trust.yaml first, which runs owner-label-check.py --trust of main. For anyone but the owner or Renovate alone, the job Changes runs bin/ci-changes and .github/ci of main, the rendered diff runs the scripts of main, the Terraform plan waits for the owner, the EdgeOS plan does not run, and the host check waits for the approval of the owner. The host workflow and the link check run a hand start on main only, and an apply of the host workflow waits in the environment prod. The privacy check runs on each push to a branch under agent/. A new workflow, merge-notice.yaml, posts each merge of the App of the main agent to the owner. Test: .github/scripts/test_ci_gates.py.'
time: 2026-11-21T12:00:00.000000+00:00
