kind: Added
body: "Windows hosts, the window procedure of the move: before the present account leaves Administrators at window step 7, a read as SYSTEM through the API of the Host Compute Service (computecore.dll, HcsEnumerateComputeSystems) that no compute system with the owner WSL runs, then the check that no WSL process of the present account runs; a fail sends the window back while the account is still a member. The check is on with no key; only a config of the rehearsal may turn it off (vm_check: false), as the host's own distro runs during a rehearsal. A test shows that each mode of the procedure, the boot run and a forward run that goes back among them, runs the group step of the way back with a config that is not the rehearsal's."
