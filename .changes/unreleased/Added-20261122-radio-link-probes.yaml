kind: Added
body: 'monitoring: smokeping pings the LiteAP radio (liteap-gps) and the LiteBeam radio (litebeam-5ac) behind the EP-R6 (role radio), and the radio link has one alert per hop: RadioAPUnreachable when the LiteAP stops answering while the EP-R6 answers, RadioStationUnreachable when the LiteBeam stops answering while the LiteAP answers (RadioLinkProbeMissing when nothing probes them). The Network & Routing tab Radio gateway becomes Radio link: a state per hop (Unknown behind a hop that is down), loss and latency per hop. The airCube rejects pings and is not watched'
