kind: Security
body: 'Flux: the children outside the "ask first" class substitute from the reduced Secret cluster-secrets-apps, and only the direct children of the class get the full cluster-secrets; the parent of the apps no longer substitutes from it, and the admission policy flux-child-scope allows only the reduced Secret outside the class. A names-only check for the owner lists the variables of the encrypted files outside the class that the reduced Secret would not fill, with no value'
