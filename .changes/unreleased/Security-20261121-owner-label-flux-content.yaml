kind: Security
body: 'Owner label: a pull request of the App of the main agent outside the "ask first" class also waits for owner/approved when its content reaches past the class: a link or a submodule, a file under kubernetes/ that holds a Flux object or an admission object, or a path with ".." that leaves the folder of its file. A file it can not read holds the pull request too'
