kind: Breaking
body: 'Two WSL sites, one platform. homelab-wsl and homelab-wsl-02 both run Cilium (homelab-wsl moved in place from Flannel) with no kube-proxy and no MetalLB: LB IPAM with L2 announcements, BGP to the router over per-site WireGuard, and Cluster Mesh with global Services. Shared VIPs (internal ingress, MQTT) fail over between sites. Every app has its own CNPG cluster and the shared databases/postgres cluster is retired; movable apps keep a warm standby on the other site, and bin/site-failover moves them (UniFi, Ombi, Wizarr, Jellyfin, Plausible and the transcriber now run on homelab-wsl-02).'
