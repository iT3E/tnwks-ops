kind: Added
body: 'agents: step 1 of the move of the main agent: the state volume of agents-main and its inbox pod, on the node of the agent pods, with no product code, no secret and no network. The backup policy of the volume is in git and not applied until the backup repository agents-main exists and is Ready; the network policy of the backup movers of agents-main selects no pod until then. The runbook has a draft of the cutover of the main agent: Telegram first, Signal later with its own go, and the steps that wait for the owner'
