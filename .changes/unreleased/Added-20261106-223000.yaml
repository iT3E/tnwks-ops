body: 'Public names follow their apps between the WSL sites: Mealie''s Service is global, and Home Assistant''s and Mealie''s public Ingresses go through the Service, so cloudflared and the public ingress on homelab-wsl reach the app over Cluster Mesh when it runs on homelab-wsl-02.'
