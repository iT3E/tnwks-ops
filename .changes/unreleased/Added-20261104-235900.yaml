kind: Added
body: "Ansible site `site_wsl02` for WSL-02, the second WSL host, managed from the DESKTOP-HKE05KI workstation through the distro's sshd (LAN 2222, from that workstation only). New distro role `wsl_docker` installs Docker Engine from Docker's apt repository (pinned to 28.3.1, a no-op on DESKTOP-HKE05KI). Roles for hardware a host doesn't have (Coral, Z-Stick, UDP relays, backups, the watchdog) are skipped when their per-host list is empty, and `windows_host_settings` can skip the Ethernet checks on a Wi-Fi host and check that Fast Startup is off."
time: 2026-11-04T23:59:00.000000000-08:00
