kind: Added
body: 'agents: the cluster server of main (task 6.19, not live until the owner sets the order of go-live). The Kubernetes MCP server v0.1.3 (pinned by digest) in agents-main, read only, as its own service account with the role view in each namespace of this cluster but agents-finance and ai and the list of the namespaces, with Secrets and exposed-secret reports refused. The route main-cluster on the central MCP gateway takes the key of the main agent only and names eight reads, from the dump tools/cluster.json. Only the gateway and the kubelet reach the pod; it reaches the API server and DNS for its name only. Renovate waits 7 days and a person reviews each update. A test, observability/tests/test_main_read_servers.py, checks the files and runs the pinned gateway and server in containers.'
