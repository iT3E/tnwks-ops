kind: Added
body: "Windows hosts, the window procedure of the move: reads of the icon of the distro (shortcut.ico) before each import, for the account of that import, with no delete. Window step 1 reads both folders and stops with nothing changed; after window step 5 no icon may be left in the old folder; before window step 6 the folder of the new account is read again; before way back step 5 the old folder is read, and a fail stops the way back before the import. A read passes with no icon, or one with none of the attributes read-only, hidden and system, no deny entry, and a rule that gives the account of the import the right to write it (and to delete it where its unregister does). Tests use test icons for each read."
