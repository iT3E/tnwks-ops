kind: Added
body: Grafana grades each site's WSL VM next to its Windows host (WSL CPU, memory, disk space and I/O stall on the Hosts tile and Host state rows), adds a WSL VM tab to Host (CPU, memory, swap and disk against the .wslconfig limits, and pressure stall) and WSL VM CPU and memory graphs to Hosts & Capacity
