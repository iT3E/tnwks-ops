kind: Added
body: 'security: the host check on each Windows host (Ansible role `windows_host_check`, source `host-check`). A SYSTEM scheduled task reads Defender, the updates and the firewall every 6 hours and writes the result for the textfile collector of windows_exporter. A query that fails gives no result, so the late alert fires. Both Windows hosts list `host-check` in their sources'
