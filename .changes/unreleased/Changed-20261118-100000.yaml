kind: Changed
body: "Windows hosts, the rehearsal of the move: the rehearsal ended, and its switch (wsl_move_rehearsal) is off on the site 2 host until the next rehearsal. A run of the playbook no longer includes the role there. The check play of the rehearsal now says of each host with the switch off that it checked nothing there, and fails when no host of the run has the switch on; after a rehearsal, -e wsl_move_rehearsal=true gives the switch for one run."
