kind: Added
body: 'renovate-review.yaml: a second review job that asks the run receiver of the workflow agents for the review (`POST /runs`), with the retry rule of a caller: the key `renovate-review-<pr>-<sha7>-<n>`, a new attempt only after a failed or timed out answer, and 3 attempts at the most for one head over all the runs. It runs only when the repository variable `RENOVATE_REVIEW_ROUTE` is `platform`; until then each review goes to the hook of the host, as before.'
time: 2026-11-16T14:10:00.000000+00:00
