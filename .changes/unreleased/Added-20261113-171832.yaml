kind: Added
body: 'security: homelab-wsl-02 starts the AWS credential refresher (`kubernetes/apps/security/aws-credentials`). The cluster settings get the two Roles Anywhere profiles, the two client certificates come as SOPS Secrets that end on 2027-11-14, and the cluster lists its Flux Kustomization. Every 30 minutes it writes a 4-hour read-only session to `aws-security-audit-sts` and `aws-security-trail-sts`, and the end of each certificate to its Lease for `SecurityCertificateExpiring`'
