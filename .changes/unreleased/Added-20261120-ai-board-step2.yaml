body: 'litellm, observability: the series of the model gateway (step 2 of task 5.23). The Prometheus callback with a keep list (5 metrics; the key name, the name asked for, the provider and the status) and a cap of 100 label sets for each metric; a scrape with a key of its own (metrics-scrape: no model, the route /metrics only, pinned in ensure_keys.py), which writes undeclared for a key name that is not declared; the daily CronJob litellm-key-check, which fails when that key can call a model name; the Model calls tab of the AI board (calls, the share that failed, the time of a call, tokens by key, name and day); and the alert ModelGatewayCallsFailing with its runbook section and promtool cases.'
