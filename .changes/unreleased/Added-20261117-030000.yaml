kind: Added
body: 'Agent platform: the tools of the finance agent, in git and not applied yet: reads of money data of the finance app through a provider of its sandbox gateway (profile with a list of read paths, providers job, network policy), web search with a key of its own, and the notes vault in its state volume, read through its memory search. A daily provider probe in agents-finance tests the rule of the profile with a dummy credential, and Alertmanager drops KubeJobFailed for it and for the providers job. The steps of the owner are in docs/apps/agent-platform.md, "The finance agent".'
