kind: Fixed
body: "Windows hosts, the rehearsal of the move: window step 1 also stops, with nothing changed, on a disk file with a rule that the check of the way back refuses (a deny rule, explicit or inherited; more than one rule of the capability of the VM; an explicit rule of a VM SID or a capability SID that is not in WSL's form); what a folder gives a file names the file's own group for CREATOR GROUP; the read of the live parts is one of the role's scripts with its SHA-256, and each read copies it first; a failed write of the older form of A's disk file puts its owner back; the message of a copy that differs in the middle of a window says to end it with the release that started it. The account task strip-rules writes the rules of its disk file with .NET and an object that has the rules section only, so a standard account with no privilege can write them (Set-Acl tried to write the audit section too); an error that a step of the account task does not handle ends it with exit 1 and a result that holds the text of the error. The stops of the procedure keep a line on stderr of their powershell.exe as text and make their test folder inside the try; each read of a log or state line takes a line with no time or no text as empty, so a text over two lines breaks no read and no check; and the model of the output of win_powershell in the tests gives an enum, a date and an enumerable that is not a list as the module does, and a script that writes an error record fails its test."
