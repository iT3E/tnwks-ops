kind: Added
body: 'security: the converter sends each finding that fails in the newest file of a system as one line of the security stream `findings` in the Loki of homelab-wsl-02 (labels `security_stream`, `source`, `system`; kept 90 days by the rule of the security streams). A line is a part of the OCSF record: what failed, where and why, with no data, tag or label of a resource. The lines of a file go one time, wait for the next cycle when Loki does not answer, and `homelab_security_converter_findings_pending` shows them'
