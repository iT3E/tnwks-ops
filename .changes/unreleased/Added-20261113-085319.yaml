body: 'monitoring: a path on which homelab-wsl writes to the Loki of homelab-wsl-02, which keeps the security streams: the global Service `security-loki`, a TLS proxy on homelab-wsl-02 that asks for a client certificate of the shared CA and passes only the push of log lines, the two certificates, and a network policy for the proxy. `kubernetes/apps/monitoring/security-loki-proxy/README.md` has the address for a sender on each site'
