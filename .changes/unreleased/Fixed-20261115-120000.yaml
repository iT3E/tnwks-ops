kind: Fixed
body: 'agents-workflows: the run jobs and the sweep can read the Sandbox records, so that a record the sandbox gateway left after a delete is seen. The run job lists records (Role workflow-run, token on in the Job template, grace 150 s), the sweep runs as its own service account workflow-sweep with list and delete, an admission policy (workflow-sweep-deletes) holds its deletes to run records, and the network policy of both adds the API server. The run Job admission rule no longer asks for no token.'
