kind: Added
body: 'Ombi, Ombi-f and Wizarr can move between the WSL sites: replica toggles, global Services and Service-upstream public Ingresses (cloudflared reaches them over Cluster Mesh), transfer-only kopiur policies, site-failover entries, and homelab-wsl-02 deploying them at 0. The production namespace allows root kopiur movers (Wizarr''s root-owned database).'
