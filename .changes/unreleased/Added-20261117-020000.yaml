body: 'Backups: a Kopia repository of its own for the finance trust domain (prefix `kopiur-finance/`, its own role, certificate, password and refresher), the deny of the bucket policy for that prefix, and the mover policy and backup policy of the finance agent. The refresher, the repository and the policy are applied in later steps, in the order of docs/operations/backups.md.'
