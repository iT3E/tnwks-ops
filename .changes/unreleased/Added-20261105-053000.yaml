kind: Added
body: "Runtime switchover hook (`docs/wsl/multi-site.md`, \"Switching an app\"): every app Kustomization on both WSL clusters reads an optional ConfigMap `flux-system/site-overrides` after `cluster-settings` and `cluster-secrets`, so a value there wins. Nothing in git creates it; `SiteOverrideLingering` fires when one exists for more than a day. No effect until one is created."
