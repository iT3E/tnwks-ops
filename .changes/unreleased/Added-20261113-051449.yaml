kind: Added
body: 'security: the converter of the security platform (`security/converter`), with its stream source. Each 5 minutes it asks Loki for the time of the newest line of each security stream, for each system, and serves it as the time of the last result. With no line, an error or no answer it serves no time, so the rule for a late result reads the stream as late. The generator writes the stream map from the registry (`system_label` in `sources.yaml`), and `security/converter/README.md` has the contract of the files of results'
