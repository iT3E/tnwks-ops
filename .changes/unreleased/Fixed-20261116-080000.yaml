kind: Fixed
body: 'Alerting: the Telegram message of an alert leaves out the graph link when it is longer than 2048 characters (the link of SecurityResultLate holds its whole expression, about 5 KB), and a group of more than three alerts prints the text of the first three only, so a group of eight stays within the 4096 characters that Telegram takes. A test renders each alert of the repository through the template with amtool and checks the tags, the text length, the size and the links.'
