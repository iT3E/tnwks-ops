body: 'Alerting: Telegram answered ENTITIES_TOO_LONG for the message of SecurityResultLate, whose graph link (its whole expression, about 5 KB) went into the message once for each alert. The Telegram message now has one graph link, on the first alert, and only up to 1600 characters; the text and the other links of the first three alerts of a group only, and the labels of the next five. A test renders each alert of the repository through the template with amtool and checks the tags, the number of entities, the text length, the size and the link text.'
