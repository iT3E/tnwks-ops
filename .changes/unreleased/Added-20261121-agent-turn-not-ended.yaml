kind: Added
body: 'agents: the alert AgentTurnNotEnded fires when a personal agent took a message and has not ended its turn for 30 minutes (its count of messages in is higher than its count of messages that ended, from the metrics of the product). It catches a turn that never ends (a model call, a tool or a streamed part that hangs), not a final reply that hangs after the turn ended; a quiet evening has no message and does not fire. The AI board has the row Messages with no end on its Messages tab, and the runbook has a section.'
