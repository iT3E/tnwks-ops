kind: Changed
body: 'Security: the host check of each WSL distro writes a JSON document into an inbox, C:\ProgramData\tnwks-host-check-distro, that only SYSTEM, the Administrators and the account of the distro may change. A relay on its Windows host, a SYSTEM task each hour, checks the document and writes the .prom file of the distro; a document that does not fit gives no result. The distro account loses its right on the textfile directory, and its directory wsl-distro goes.'
