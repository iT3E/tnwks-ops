kind: Changed
body: 'Security: the firmware test of the API checks job counts an age that it does not know as old. A router that runs a version older than each release that the job has seen fails at once, and a release that the job sees first is dated by its last read of the feed, or by the date of the feed if that is earlier, so a stop of the job never moves a fail late. The list of releases keeps the time of the last read (version 2).'
