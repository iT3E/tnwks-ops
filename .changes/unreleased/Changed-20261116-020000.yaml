kind: Changed
body: 'Security: the host check of each WSL distro writes a JSON document into an inbox, C:\ProgramData\tnwks-host-check-distro, where the account of the distro may make and change files but not change the folder itself. A relay on its Windows host, a SYSTEM task each hour, checks the document and writes the .prom file of the distro; a document that does not fit, a repeated series, or a link on the way gives no result. The relay logs each run to C:\ProgramData\tnwks-host-check\relay.log. The distro account loses its right on the textfile directory, and its directory wsl-distro goes.'
