kind: Added
body: 'Windows hosts: the rehearsal of the move of a distro to another account (role windows_wsl_move_rehearsal, site 2 only, Design Doc 0004, section 9, step 0). Two temporary standard accounts and a small distro of their own run the scripts of the move window: the procedure as SYSTEM, with its forward steps, its way back and its boot task, and the stop, unregister and import tasks of each account. Each phase runs only when given by hand, and a restart needs the owner''s go. The scripts refuse any name or path outside the rehearsal, and the live distro by name. A check play reads the groups, each moment in Administrators and the live parts, and the exit check after the removal. The task module takes keep_task_enabled_state, off by default, so a start task keeps the state that the window gives it (docs/wsl/windows-ansible.md, "The rehearsal of the move").'
