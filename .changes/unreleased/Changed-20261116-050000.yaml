kind: Changed
body: 'Windows hosts: a per-host switch, wsl_start_unelevated (on for WSL-02 first), runs each task that starts a process in the WSL distro with no elevation, and moves the steps that need admin rights to tasks that start none: tnwks-wsl-service (SYSTEM) for the WSL service, and tnwks-lan-bridge-sync as SYSTEM with the VM address from the new task tnwks-lan-bridge-ip. The compaction no longer starts the distro itself under the switch. The services of a distro take the change at its next start, a step by hand with a runbook (docs/wsl/windows-ansible.md). A second switch, wsl_start_unelevated_done, goes on after that step and its read, and only then can the write test of the distro fail its play.'
