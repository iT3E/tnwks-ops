kind: Fixed
body: 'security: a vulnerability report of Trivy Operator counts for a running container by its digest, or, when no report has that digest, by the same namespace, container and image reference, so an image whose pod and report show different digests of the same reference (a tag that moved, or an image index and a platform image) is not counted as not scanned, and its critical vulnerabilities count once in image-vulnerabilities (when two reports have the reference and neither has the running digest, the one with the most critical vulnerabilities); the security board shows the number of containers matched by reference only'
