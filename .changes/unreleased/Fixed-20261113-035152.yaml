kind: Fixed
body: 'agents: the providers job of the workflow agents runs again after its first run. It ran `openshell profile lint`, which refuses a profile that is already in the gateway, so no later run updated the GitHub token and the reviewer got 401 after one hour. It now imports a new profile, updates a changed one (by the sha256 of its file), checks the gateway and the profiles before it asks for a token, and logs one line for each failed step'
