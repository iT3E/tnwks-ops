kind: Added
body: 'Security: the router logs its RouterOS version each hour to the host of homelab-wsl-02 too (a scheduler and a logging rule in Terraform, the syslog relay on WSL-02 and its distro), and the API checks read the version lines of the last 3 hours from that site''s Loki. The lines must agree, and agree with the Prometheus of homelab-wsl when it answers; with no line, that Prometheus decides as before. The aggregators keep the line out of the security stream routeros.'
