kind: Fixed
body: 'security: Trivy Operator keeps the scan cache of each scan in memory, so the containers of one scan job no longer stop on the lock of the file cache ("cache may be in use by another process: timeout") and leave their images with no report; the vulnerability databases stay on the volume. Reports hold critical vulnerabilities only, the ones that image-vulnerabilities counts, so the report of an image with many fixed vulnerabilities fits in one object of the API server ("etcdserver: request is too large")'
