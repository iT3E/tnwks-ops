kind: Added
body: 'security: the converter reads the list of accepted findings (the Secret `security-accepted-findings`, mounted read-only and optional) and serves `homelab_security_accepted_until_timestamp_seconds` with `source`, `check` and `system` for each entry, so the board counts the accepted findings and `SecurityAcceptedFindingExpired` can fire. No reason leaves the Secret. Its parts now run in one loop, and a fault of one part does not stop the others. `security/generate.py` writes the names of the registry for the converter (`registry.json`)'
