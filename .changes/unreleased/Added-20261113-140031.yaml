kind: Added
body: 'security: the list of accepted findings is one JSON array (the key `accepted.json` of the Secret `security-accepted-findings`), with five string fields for each entry. The converter reads it with `json.loads` (the Secret mounted read-only and optional) and serves `homelab_security_accepted_until_timestamp_seconds` with `source`, `check` and `system` for each entry, so the board counts the accepted findings and `SecurityAcceptedFindingExpired` can fire. No reason leaves the Secret. A list that is not one JSON array, or has a key two times in an object, gives no entry, and `homelab_security_converter_accepted_list_read` says so. An entry with a missing or extra key, a value that is not a string, or no reason is skipped. The alerts `SecurityAcceptedListUnread` (no entry for 30 minutes) and `SecurityAcceptedEntriesSkipped` (skipped entries for one hour) make both loud. Its parts now run in one loop, and a fault of one part does not stop the others. `security/generate.py` writes the names of the registry for the converter (`registry.json`)'
