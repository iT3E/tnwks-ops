kind: Added
body: 'security: the host check in each WSL distro (Ansible role `wsl_host_check`, source `host-check`). A systemd timer simulates an upgrade with apt-get every 6 hours and writes the result into a directory of the Windows host for its windows_exporter. An upgrade fails the check after it has waited 14 days. Old package lists or a query that fails give no result, so the late alert fires. Both distros list `host-check` in their sources'
