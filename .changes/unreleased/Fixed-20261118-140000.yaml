kind: Fixed
body: "Windows hosts, the window procedure of the move: the fail line of each step that runs a task of an account (the stop, the unregister and the import of the window, the unregister and the import back of the way back) holds the exit code of the task and the error text of its command from the result of this run, or says that there is no result of this run. Each fail line is one line and bounded, as is the line of a task with its result. The read of the procedure log in the phase checks of the rehearsal takes a group line only by its start. Tests show that a result of an earlier run, a task that starts and never runs, and a start that Task Scheduler refuses each fail their step with that text."
