kind: Added
body: 'Security: the host checks of each Windows host and each WSL distro add the check updates-held, for a held package or a hidden update older than 14 days (severity high). In a distro, each package has one clock whether it waits, is held or is phased; an upgrade that a run sees first is dated by the Date of its package list at the last run with a result, or counts as old with no such Date; and only a run with a result writes the state file.'
