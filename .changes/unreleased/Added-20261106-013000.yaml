kind: Added
body: 'The UniFi controller can move between the WSL sites: homelab-wsl-02 deploys it (and unpoller) at 0 with its own inform VIP and LAN bridge, the router admits the APs to either host, `bin/site-failover` copies both of its volumes, and UniFi metrics are federated to the other site.'
