body: 'Jellyfin can move between the WSL sites: replica toggle, global Service and Service-upstream Ingresses, a transfer-only kopiur policy for its config, a site-failover entry (prebind with its library volume, root restore), and homelab-wsl-02 deploying it at 0. Its media library stays on the desktop.'
