body: "homelab-wsl-02 runs cert-manager (Let's Encrypt DNS-01 issuers, the internal and public wildcard certificates), ingress-nginx-internal on its LoadBalancer IP 10.6.0.200, and the CNPG operator with the barman-cloud plugin. Its Flux key joins the shared `kubernetes/` SOPS rule (every movable app runs on both clusters); the two secrets it needs now are re-keyed."
