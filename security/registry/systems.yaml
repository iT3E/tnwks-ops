---
# The systems that the security platform checks. One line for each system:
# its name, its type, its site and its domain. The form is in schema.json.
#
# A name is the name that this repository uses already: the cluster name, the
# host in the Ansible inventory, the Terraform root. `site` is the cluster name
# of the site, or `none` for a system that is on no site. A system of the type
# `other` is a layer with no check.
#
# `behind_site` names the site whose Windows host or link the results of the
# system pass through on their way to homelab-wsl-02: the host of site 1, its
# distro, and the router, whose version mktxp of site 1 reads. Their late
# alerts carry it, and Alertmanager holds them while homelab-wsl-02 can not
# scrape the host of that site (SecurityHostUnreachable).
#
# `sources` lists the sources that report on the system today. The rule for a
# late result watches each of them. A source joins this list in the pull
# request that starts it, or, when it needs hours for its first result, in
# the one after that result (security/README.md).
#
# The registry names controls, systems and checks. It holds no result.
- name: aws-management
  type: aws-account
  site: none
  domain: infrastructure
  sources: [stream, prowler]
- name: aws-prod
  type: aws-account
  site: none
  domain: infrastructure
  sources: [stream, prowler]
- name: cloudflare
  type: cloudflare-account
  site: none
  domain: infrastructure
- name: iT3E
  type: github-organization
  site: none
  domain: infrastructure
- name: tnwks-ops
  type: terraform-cloud-organization
  site: none
  domain: infrastructure
- name: homelab-wsl
  type: cluster
  site: homelab-wsl
  domain: infrastructure
  sources: [stream, trivy]
- name: homelab-wsl-02
  type: cluster
  site: homelab-wsl-02
  domain: infrastructure
  sources: [stream, trivy]
- name: DESKTOP-HKE05KI
  type: windows-host
  site: homelab-wsl
  domain: infrastructure
  behind_site: homelab-wsl
  sources: [host-check]
- name: WSL-02
  type: windows-host
  site: homelab-wsl-02
  domain: infrastructure
  sources: [host-check]
- name: DESKTOP-HKE05KI-ubuntu
  type: wsl-distro
  site: homelab-wsl
  domain: infrastructure
  behind_site: homelab-wsl
  sources: [host-check]
- name: WSL-02-ubuntu
  type: wsl-distro
  site: homelab-wsl-02
  domain: infrastructure
  sources: [host-check]
- name: sce-rtr01
  type: router
  site: none
  domain: infrastructure
  behind_site: homelab-wsl
  sources: [stream, api-check]
- name: sce-ep01
  type: other
  site: none
  domain: infrastructure
- name: SW03
  type: other
  site: none
  domain: infrastructure
- name: unifi
  type: other
  site: none
  domain: infrastructure
- name: healthchecks
  type: other
  site: none
  domain: infrastructure
