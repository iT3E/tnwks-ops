---
# The systems that the security platform checks. One line for each system:
# its name, its type, its site and its domain. The form is in schema.json.
#
# A name is the name that this repository uses already: the cluster name, the
# host in the Ansible inventory, the Terraform root. `site` is the cluster name
# of the site, or `none` for a system that is on no site. A system of the type
# `other` is a layer with no check.
#
# `sources` lists the sources that report on the system today. The rule for a
# late result watches each of them. A source joins this list in the pull
# request that starts it (security/README.md).
#
# The registry names controls, systems and checks. It holds no result.
- name: aws-management
  type: aws-account
  site: none
  domain: infrastructure
  sources: [stream]
- name: aws-prod
  type: aws-account
  site: none
  domain: infrastructure
  sources: [stream]
- name: cloudflare
  type: cloudflare-account
  site: none
  domain: infrastructure
- name: iT3E
