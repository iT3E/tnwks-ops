---
# The safeguards of CIS Controls v8.1, Implementation Group 1, that apply: 48 lines.
# One line for each safeguard. For each type of system, `checks` lists the checks
# that test it. An empty list means that no check tests it on that type: each
# system of the type then shows "no evidence". The form is in schema.json, and
# security/README.md says how to add a check. Run security/generate.py after a change.
#
# A title is a short label in the words of this repository, not the text of CIS.
# The registry names controls, systems and checks. It holds no result.
- id: "1.1"
  title: Asset inventory
  ig: 1
  function: identify
  checks:
    aws-account:
      - { source: prowler, check: config_recorder_all_regions_enabled }
      - { source: prowler, check: resourceexplorer2_indexes_found }
    cloudflare-account: []
    github-organization: []
    terraform-cloud-organization: []
    cluster: []
    windows-host:
      - { source: wazuh, check: inventory-hardware }
    wsl-distro:
      - { source: wazuh, check: inventory-hardware }
    laptop: []
    router: []
- id: "1.2"
