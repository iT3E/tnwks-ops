---
# Generated by security/generate.py from security/registry. Do not edit.
rule_files:
- rules-for-test.yaml
evaluation_interval: 1m
tests:
- name: with no source, each line of the registry is no evidence
  interval: 1m
  input_series: []
  promql_expr_test:
  - expr: count(homelab:security_safeguard_state == 0)
    eval_time: 5m
    exp_samples:
    - labels: '{}'
      value: 48
  - expr: count(homelab:security_control_state == 0)
    eval_time: 5m
    exp_samples:
    - labels: '{}'
      value: 768
  - expr: homelab:security_control_state != 0
    eval_time: 5m
    exp_samples: []
  - expr: homelab:security_safeguard_state != 0
    eval_time: 5m
    exp_samples: []
  - expr: count(homelab:security_safeguard_has_result == 0)
    eval_time: 5m
    exp_samples:
    - labels: '{}'
      value: 48
- name: a result with no time of the last result is no evidence, and never a pass
  interval: 1m
  input_series:
  - series: homelab_security_check_result{source="prowler",check="config_recorder_all_regions_enabled",system="aws-management"}
    values: 0+0x10
  promql_expr_test:
  - expr: homelab:security_control_state{safeguard="1.1",system="aws-management"}
    eval_time: 5m
    exp_samples:
    - labels: homelab:security_control_state{safeguard="1.1",system="aws-management",system_type="aws-account",k8s_cluster="site"}
      value: 0
- name: a fresh result is a pass at 0 and a fail above 0, and a late one is no evidence
  interval: 1m
  input_series:
  - series: homelab_security_check_result{source="prowler",check="config_recorder_all_regions_enabled",system="aws-management"}
    values: 0+0x9 2+0x2210
  - series: homelab_security_last_result_timestamp_seconds{source="prowler",system="aws-management"}
    values: 0+0x2220
  promql_expr_test:
  - expr: homelab:security_control_state{safeguard="1.1",system="aws-management"}
    eval_time: 5m
    exp_samples:
    - labels: homelab:security_control_state{safeguard="1.1",system="aws-management",system_type="aws-account",k8s_cluster="site"}
      value: 1
  - expr: homelab:security_control_state{safeguard="1.1",system="aws-management"}
    eval_time: 30m
    exp_samples:
    - labels: homelab:security_control_state{safeguard="1.1",system="aws-management",system_type="aws-account",k8s_cluster="site"}
      value: 3
  - expr: homelab:security_control_state{safeguard="1.1",system="aws-management"}
    eval_time: 2190m
    exp_samples:
    - labels: homelab:security_control_state{safeguard="1.1",system="aws-management",system_type="aws-account",k8s_cluster="site"}
      value: 0
  - expr: homelab:security_safeguard_state{safeguard="1.1"}
    eval_time: 30m
    exp_samples:
    - labels: homelab:security_safeguard_state{safeguard="1.1",line="01.01",title="Asset inventory",ig="1",function="identify",k8s_cluster="site"}
      value: 3
- name: a time of the last result in the future is no evidence
  interval: 1m
  input_series:
  - series: homelab_security_check_result{source="prowler",check="config_recorder_all_regions_enabled",system="aws-management"}
    values: 0+0x10
  - series: homelab_security_last_result_timestamp_seconds{source="prowler",system="aws-management"}
    values: 100000+0x10
  promql_expr_test:
  - expr: homelab:security_control_state{safeguard="1.1",system="aws-management"}
    eval_time: 5m
    exp_samples:
    - labels: homelab:security_control_state{safeguard="1.1",system="aws-management",system_type="aws-account",k8s_cluster="site"}
      value: 0
- name: a result of a system that the registry does not name gives no line
  interval: 1m
  input_series:
  - series: homelab_security_check_result{source="prowler",check="config_recorder_all_regions_enabled",system="not-in-the-registry"}
    values: 0+0x10
  - series: homelab_security_last_result_timestamp_seconds{source="prowler",system="not-in-the-registry"}
    values: 0+0x10
  promql_expr_test:
  - expr: homelab:security_control_state{system="not-in-the-registry"}
    eval_time: 5m
    exp_samples: []
  - expr: count(homelab:security_control_state == 0)
    eval_time: 5m
    exp_samples:
    - labels: '{}'
      value: 768
- name: with two sources on one line, a fail wins, and one fresh source is enough
  interval: 1m
  input_series:
  - series: homelab_security_check_result{source="host-check",check="firewall-enabled",system="DESKTOP-HKE05KI"}
    values: 0+0x20
  - series: homelab_security_last_result_timestamp_seconds{source="host-check",system="DESKTOP-HKE05KI"}
    values: 0+0x20
  - series: homelab_security_check_result{source="wazuh",check="26116",system="DESKTOP-HKE05KI"}
    values: _x10 1+0x10
  - series: homelab_security_last_result_timestamp_seconds{source="wazuh",system="DESKTOP-HKE05KI"}
    values: _x10 600+0x10
  promql_expr_test:
  - expr: homelab:security_control_state{safeguard="4.5",system="DESKTOP-HKE05KI"}
    eval_time: 5m
    exp_samples:
    - labels: homelab:security_control_state{safeguard="4.5",system="DESKTOP-HKE05KI",system_type="windows-host",k8s_cluster="site"}
      value: 1
  - expr: homelab:security_control_state{safeguard="4.5",system="DESKTOP-HKE05KI"}
    eval_time: 15m
    exp_samples:
    - labels: homelab:security_control_state{safeguard="4.5",system="DESKTOP-HKE05KI",system_type="windows-host",k8s_cluster="site"}
      value: 3
- name: a stream with a fresh line is a pass, and a silent stream is no evidence
  interval: 1m
  input_series:
  - series: homelab_security_last_result_timestamp_seconds{source="stream",check="routeros",system="sce-rtr01"}
    values: 0+60x5 300+0x45
  promql_expr_test:
  - expr: homelab:security_control_state{safeguard="8.2",system="sce-rtr01"}
    eval_time: 5m
    exp_samples:
    - labels: homelab:security_control_state{safeguard="8.2",system="sce-rtr01",system_type="router",k8s_cluster="site"}
      value: 1
  - expr: homelab:security_control_state{safeguard="8.2",system="sce-rtr01"}
    eval_time: 25m
    exp_samples:
    - labels: homelab:security_control_state{safeguard="8.2",system="sce-rtr01",system_type="router",k8s_cluster="site"}
      value: 0
- name: an accepted finding past its end date raises one alert for its system, with no check in its text
  interval: 1m
  external_labels:
    cluster: site
  input_series:
  - series: homelab_security_accepted_until_timestamp_seconds{source="prowler",check="sample-check",system="aws-management"}
    values: 1800+0x60
  - series: homelab_security_accepted_until_timestamp_seconds{source="prowler",check="other-check",system="aws-management"}
    values: 1200+0x60
  - series: homelab_security_accepted_until_timestamp_seconds{source="prowler",check="later-check",system="aws-management"}
    values: 864000+0x60
  alert_rule_test:
  - eval_time: 15m
    alertname: SecurityAcceptedFindingExpired
    exp_alerts: []
  - eval_time: 45m
    alertname: SecurityAcceptedFindingExpired
    exp_alerts:
    - exp_labels:
        severity: warning
        system: aws-management
      exp_annotations:
        summary: An accepted finding of aws-management has passed its end date
        description: aws-management has an accepted finding whose end date has passed. Renew it or remove it in
          the encrypted list of accepted findings.
        dashboard_url: https://grafana.${INTERNAL_DOMAIN}/d/tnwks-security?var-cluster=site
- name: 'one system passes and a second with a check has no evidence: the line is no evidence, and it has a result'
  interval: 1m
  input_series:
  - series: homelab_security_check_result{source="prowler",check="awslambda_function_using_supported_runtimes",system="aws-management"}
    values: 0+0x10
  - series: homelab_security_last_result_timestamp_seconds{source="prowler",system="aws-management"}
    values: 0+0x10
  promql_expr_test:
  - expr: homelab:security_control_state{safeguard="2.2",system="aws-management"}
    eval_time: 5m
    exp_samples:
    - labels: homelab:security_control_state{safeguard="2.2",system="aws-management",system_type="aws-account",k8s_cluster="site"}
      value: 1
  - expr: homelab:security_control_state{safeguard="2.2",system="aws-prod"}
    eval_time: 5m
    exp_samples:
    - labels: homelab:security_control_state{safeguard="2.2",system="aws-prod",system_type="aws-account",k8s_cluster="site"}
      value: 0
  - expr: homelab:security_safeguard_state{safeguard="2.2"}
    eval_time: 5m
    exp_samples:
    - labels: homelab:security_safeguard_state{safeguard="2.2",line="02.02",title="Supported software only",ig="1",function="identify",k8s_cluster="site"}
      value: 0
  - expr: homelab:security_safeguard_has_result{safeguard="2.2"}
    eval_time: 5m
    exp_samples:
    - labels: homelab:security_safeguard_has_result{safeguard="2.2",ig="1",k8s_cluster="site"}
      value: 1
- name: 'each system with a check passes: the line is a pass, and a system of a type with no check does not count'
  interval: 1m
  input_series:
  - series: homelab_security_check_result{source="prowler",check="awslambda_function_using_supported_runtimes",system="aws-management"}
    values: 0+0x10
  - series: homelab_security_last_result_timestamp_seconds{source="prowler",system="aws-management"}
    values: 0+0x10
  - series: homelab_security_check_result{source="prowler",check="awslambda_function_using_supported_runtimes",system="aws-prod"}
    values: 0+0x10
  - series: homelab_security_last_result_timestamp_seconds{source="prowler",system="aws-prod"}
    values: 0+0x10
  promql_expr_test:
  - expr: homelab:security_control_state{safeguard="2.2",system="aws-management"}
    eval_time: 5m
    exp_samples:
    - labels: homelab:security_control_state{safeguard="2.2",system="aws-management",system_type="aws-account",k8s_cluster="site"}
      value: 1
  - expr: homelab:security_control_state{safeguard="2.2",system="aws-prod"}
    eval_time: 5m
    exp_samples:
    - labels: homelab:security_control_state{safeguard="2.2",system="aws-prod",system_type="aws-account",k8s_cluster="site"}
      value: 1
  - expr: homelab:security_safeguard_state{safeguard="2.2"}
    eval_time: 5m
    exp_samples:
    - labels: homelab:security_safeguard_state{safeguard="2.2",line="02.02",title="Supported software only",ig="1",function="identify",k8s_cluster="site"}
      value: 1
  - expr: homelab:security_safeguard_has_result{safeguard="2.2"}
    eval_time: 5m
    exp_samples:
    - labels: homelab:security_safeguard_has_result{safeguard="2.2",ig="1",k8s_cluster="site"}
      value: 1
- name: 'one system fails: the line is a fail, with or without a result of the others'
  interval: 1m
  input_series:
  - &id001
    series: homelab_security_check_result{source="prowler",check="awslambda_function_using_supported_runtimes",system="aws-management"}
    values: 1+0x10
  - &id002
    series: homelab_security_last_result_timestamp_seconds{source="prowler",system="aws-management"}
    values: 0+0x10
  promql_expr_test:
  - expr: homelab:security_control_state{safeguard="2.2",system="aws-management"}
    eval_time: 5m
    exp_samples:
    - labels: homelab:security_control_state{safeguard="2.2",system="aws-management",system_type="aws-account",k8s_cluster="site"}
      value: 3
  - expr: homelab:security_control_state{safeguard="2.2",system="aws-prod"}
    eval_time: 5m
    exp_samples:
    - labels: homelab:security_control_state{safeguard="2.2",system="aws-prod",system_type="aws-account",k8s_cluster="site"}
      value: 0
  - expr: homelab:security_safeguard_state{safeguard="2.2"}
    eval_time: 5m
    exp_samples:
    - labels: homelab:security_safeguard_state{safeguard="2.2",line="02.02",title="Supported software only",ig="1",function="identify",k8s_cluster="site"}
      value: 3
  - expr: homelab:security_safeguard_has_result{safeguard="2.2"}
    eval_time: 5m
    exp_samples:
    - labels: homelab:security_safeguard_has_result{safeguard="2.2",ig="1",k8s_cluster="site"}
      value: 1
- name: 'one system fails and each other system passes: the line is a fail'
  interval: 1m
  input_series:
  - *id001
  - *id002
  - series: homelab_security_check_result{source="prowler",check="awslambda_function_using_supported_runtimes",system="aws-prod"}
    values: 0+0x10
  - series: homelab_security_last_result_timestamp_seconds{source="prowler",system="aws-prod"}
    values: 0+0x10
  promql_expr_test:
  - expr: homelab:security_safeguard_state{safeguard="2.2"}
    eval_time: 5m
    exp_samples:
    - labels: homelab:security_safeguard_state{safeguard="2.2",line="02.02",title="Supported software only",ig="1",function="identify",k8s_cluster="site"}
      value: 3
  - expr: homelab:security_safeguard_has_result{safeguard="2.2"}
    eval_time: 5m
    exp_samples:
    - labels: homelab:security_safeguard_has_result{safeguard="2.2",ig="1",k8s_cluster="site"}
      value: 1
