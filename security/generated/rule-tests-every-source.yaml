    values: 0+60x3000
  alert_rule_test:
  - eval_time: 1h
    alertname: SecurityResultLate
    exp_alerts: []
- name: a source that serves no time reads as late
  interval: 1m
  external_labels:
    cluster: site
  input_series:
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
  - *id006
  - *id007
  - *id008
  - *id009
  - *id010
  - *id011
  - *id012
  - *id013
  - *id014
  - *id015
  - *id016
  - *id017
  - *id018
  - *id019
  alert_rule_test:
  - eval_time: 5m
    alertname: SecurityResultLate
    exp_alerts: []
  - eval_time: 30m
    alertname: SecurityResultLate
    exp_alerts:
    - exp_labels:
        severity: warning
        source: prowler
        system: aws-management
      exp_annotations:
        summary: A security source is late for aws-management
        description: The newest result of prowler for aws-management is older than its limit, or the source serves
          no time. The board shows no evidence for it.
        dashboard_url: https://grafana.${INTERNAL_DOMAIN}/d/tnwks-security?var-cluster=site
