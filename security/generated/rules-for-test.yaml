- name: homelab.security.alerts
  interval: 1m
  rules:
  - alert: SecurityResultLate
    expr: max by (source, system) (time() - last_over_time(homelab_security_last_result_timestamp_seconds{source="stream",system="homelab-wsl",check="k8s-audit"}[10m])
      > 900) or max by (source, system) (absent_over_time(homelab_security_last_result_timestamp_seconds{source="stream",system="homelab-wsl",check="k8s-audit"}[10m]))
      or max by (source, system) (time() - last_over_time(homelab_security_last_result_timestamp_seconds{source="stream",system="homelab-wsl-02",check="k8s-audit"}[10m])
      > 900) or max by (source, system) (absent_over_time(homelab_security_last_result_timestamp_seconds{source="stream",system="homelab-wsl-02",check="k8s-audit"}[10m]))
      or max by (source, system) (time() - last_over_time(homelab_security_last_result_timestamp_seconds{source="stream",system="sce-rtr01",check="routeros"}[10m])
      > 900) or max by (source, system) (absent_over_time(homelab_security_last_result_timestamp_seconds{source="stream",system="sce-rtr01",check="routeros"}[10m]))
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: A security source is late for {{ $labels.system }}
      description: The newest result of {{ $labels.source }} for {{ $labels.system }} is older than its limit, or
        the source serves no time. The board shows no evidence for it.
      dashboard_url: https://grafana.${INTERNAL_DOMAIN}/d/tnwks-security?var-cluster={{ $externalLabels.cluster
        }}
  - alert: SecurityAcceptedFindingExpired
    expr: count by (system) (max by (source, check, system) (last_over_time(homelab_security_accepted_until_timestamp_seconds[10m]))
      < time())
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: An accepted finding of {{ $labels.system }} has passed its end date
      description: '{{ $labels.system }} has an accepted finding whose end date has passed. Renew it or remove it
        in the encrypted list of accepted findings.'
      dashboard_url: https://grafana.${INTERNAL_DOMAIN}/d/tnwks-security?var-cluster={{ $externalLabels.cluster
        }}
