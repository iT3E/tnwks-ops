---
# The Talos clusters the bootstrap playbooks (01-05) stand up, keyed by the
# talos_target they take as an extra var (`-e talos_target=ms-01`; default
# wsl). Their nodes are addresses here, not inventory hosts: Talos has no SSH.
talos_clusters:
  # Talos in Docker on a WSL distro (talosctl cluster create docker), run on
  # that distro: 01-talos-bootstrap.yml reads the fields below. Sizing notes
  # are in that playbook.
  #   subnet / controlplane_ip  the Docker network and the control plane on it
  #   docker_network            that network's options. 01-talos-bootstrap.yml
  #                             creates it with them when it's missing (talosctl
  #                             then reuses it), and only warns when an existing
  #                             one differs: options are immutable, so changing
  #                             them is talos/wsl/recreate-network.sh, a planned
  #                             outage (docs/wsl/multi-site.md, "Stage B").
  #                             nat-unprotected without masquerading lets routed
  #                             traffic (the site tunnel) reach the nodes with
  #                             real addresses; the distro masquerades only what
  #                             leaves by eth0 (wsl_site_routing_masquerade).
  #                             bridge_name: at most 15 characters (a Linux
  #                             interface name).
  #   config_patches            --config-patch (all nodes), relative to talos/<target>/
  #   controlplane_patches      --config-patch-controlplanes
  #   worker2_augment           rebuild worker-2 with the USB devices and E:
  #                             (DESKTOP-HKE05KI's Coral and Z-Stick)
  #   memory_nodes              a node with a memory limit of its own (node
  #                             name without the cluster: size). talosctl
  #                             gives every worker memory_workers, so
  #                             06-talos-node-memory.yml sets these on the
  #                             node containers, while they run.
  # The two patch lists are read only when 01-talos-bootstrap.yml creates a
  # cluster, which it does only when the cluster has no control plane
  # container. A change to them applies nothing to a running node
  # (talos/README.md, "The audit policy"). CI checks that each YAML file in
  # talos/<target>/ is in one of them or is no patch
  # (infrastructure/ansible/tests/test_talos_patches.py).
  # homelab-wsl on DESKTOP-HKE05KI.
  wsl:
    provisioner: docker
    subnet: 10.5.0.0/24
    controlplane_ip: 10.5.0.2
    docker_network:
      gateway: 10.5.0.1
      mtu: 1500
      bridge_name: br-site1
      gateway_mode_ipv4: nat-unprotected
      enable_ip_masquerade: false
    workers: 2
    cpus_controlplanes: "4.0"
    cpus_workers: "4.0"
    memory_controlplanes: 4GiB
    memory_workers: 13GiB
    # These patches are in the v1alpha1 form. The pinned Talos refuses that
    # form at create (talos/wsl-02/README.md, "Patches need talosctl >=
    # 1.14"), so a rebuild of this cluster needs them in the multi-document
    # form first.
    config_patches: [cluster-config.yaml, patches/kubelet-image-gc.yaml]
    controlplane_patches: [patches/talos-api-access.yaml, patches/audit-policy.yaml]
    worker2_augment: true
  # homelab-wsl-02 on WSL-02 (talos/wsl-02/README.md): Cilium, the
  # multi-document patches (talosctl >= 1.14), no USB. Worker 1 has 18 GiB
  # (memory_nodes), so the limits add to 35 GiB (4 + 18 + 13) inside WSL-02's
  # 45 GB .wslconfig (wsl_memory in host_vars/WSL-02).
  wsl-02:
    provisioner: docker
    subnet: 10.6.0.0/24
    controlplane_ip: 10.6.0.2
    docker_network:
      gateway: 10.6.0.1
      mtu: 1500
      bridge_name: br-site2
      gateway_mode_ipv4: nat-unprotected
      enable_ip_masquerade: false
    workers: 2
    cpus_controlplanes: "4.0"
    cpus_workers: "4.0"
    memory_controlplanes: 4GiB
    memory_workers: 13GiB
    memory_nodes:
      worker-1: 18GiB
    config_patches: [patches/cluster.yaml]
    controlplane_patches: [patches/controlplane.yaml, patches/audit-policy.yaml]
    # Flux from the committed flux-system/ manifests (public repo, HTTPS,
    # no deploy key) instead of `flux bootstrap github` (04-flux-install.yml).
    flux_install: manifests
  # 3x Minisforum MS-01, controlplane + worker each
  # (allowSchedulingOnControlPlanes: true).
  ms-01:
    # TODO: the VIP on 10.10.91.0/24 once Cilium L2 announces it.
    endpoint: https://10.10.91.1:6443
    # TODO: placeholders until the MS-01 nodes are provisioned.
    controlplane:
      - 10.10.91.11
      - 10.10.91.12
      - 10.10.91.13
