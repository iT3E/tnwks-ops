---
# Windows over its built-in OpenSSH server (docs/wsl/windows-ansible.md).
# sshd listens only on the vEthernet (WSL) address and takes only the Ansible
# keys; bootstrap it once with `task wsl-host:sshd`. ansible_host and
# ansible_user are per host (host_vars/<host>/).
ansible_connection: ssh
ansible_shell_type: powershell
# The controller's key: the workstation's by default; a CI runner points
# TNWKS_ANSIBLE_SSH_KEY at its own.
ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'TNWKS_ANSIBLE_SSH_KEY') | default('~/.ssh/id_ed25519_winhost', true) }}"
# The SSH session already has the admin's full token. Only a task that acts on
# a task of the rehearsal account becomes SYSTEM, in its own vars (role
# windows_wsl_rehearsal).
ansible_become: false
# The account that owns the WSL distro. Tasks that call wsl.exe run as it
# (S4U): SYSTEM's wsl.exe can't see the per-user Ubuntu.
windows_desktop_user: "{{ ansible_user }}"
# Start WSL with no elevation (Design Doc 0004, section 5.9). With this on,
# each task that starts a process in the distro runs with no elevation, and
# each step that needs admin rights runs in a task that runs no wsl.exe. The
# services of the distro take the change at the next start of WSL, the start
# step of docs/wsl/windows-ansible.md ("Start WSL with no elevation"). Per
# host, site 2 first; off until then.
wsl_start_unelevated: false
# On, per host, only after the start step of that doc and its read (step 6),
# in a pull request of its own. With it on, the write test of the distro can
# fail the distro play (role wsl_host_check). It needs wsl_start_unelevated.
wsl_start_unelevated_done: false

# The rehearsal of the account change (role windows_wsl_rehearsal, Design Doc
# 0004, section 9, step 0): a temporary standard account with a distro of its
# own. Per host, site 2 only; it gives an account a right, so the owner
# approves the pull request that turns it on.
wsl_rehearsal: false

# The rehearsal of the move of a distro to another account (role
# windows_wsl_move_rehearsal, Design Doc 0004, section 9, step 0). Per host,
# site 2 only. On, a run does nothing but its guards until the lead gives a
# phase (-e wsl_move_rehearsal_phase=<phase>).
wsl_move_rehearsal: false

# Folders under C:\ProgramData that no role owns. The play gives each the
# rules for SYSTEM and the Administrators only (tnwks_win_dir_acl, no writer,
# readers: none): Users get no rule, and each item takes the owner
# Administrators. Per host.
windows_locked_dirs: []

# The keys sshd accepts (role windows_sshd): one per controller, so each can
# be revoked on its own.
windows_sshd_authorized_keys:
  # The workstation (~/.ssh/id_ed25519_winhost).
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOL+VUOfAwSabKaep6ApqaYPG0eY+PqoDP0FbdjDOsXX ansible@wsl to DESKTOP-HKE05KI
  # The tnwks-ansible runners (ssh-key in their SOPS Secret).
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAYekUuwVqJdoise5COwMtb4nWPMSVVgY/8SUIrwHeJl ansible@tnwks-ansible-runner
