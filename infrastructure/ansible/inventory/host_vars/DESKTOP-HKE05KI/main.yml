---
# The Windows host under the homelab-wsl cluster. ansible_user is in
# secrets.sops.yml next to this file.

# The vEthernet (WSL) address: WINDOWS_HOST_IP in
# kubernetes/clusters/wsl/cluster-settings.yaml.
ansible_host: 172.26.80.1

# homelab-wsl-02's Prometheus scrapes the security series of this host's
# windows_exporter over the LAN (from WSL-02's address, where its pods'
# traffic leaves), so the host check of this host and its distro has a
# result on site 2 while this cluster is down (Design Doc 0004, section 5.5).
# WSL-02 admits this site's address in the same way.
windows_monitoring_remote_extra: [10.10.91.112]

# Prometheus sits on its own ext4 VHDX on C:, not the E: distro disk.
observability_storage_enabled: true
# The move of the monitoring data into a file on the distro disk (Design Doc
# 0004, section 5.13; docs/operations/observability-implementation.md): ready,
# the distro makes the file of 19 GiB, its timer stays off, and the VHDX keeps
# the data.
observability_storage_mount: ready

# One tnwks-coral-detector-<id> service per Coral; a second Coral is one more
# line (ports 5556 / 9556). docs/wsl/coral-detector.md.
coral_detector_devices:
  - { id: 0, device: "usb:0" }

# The copies that the clean-up of 2026-11-03 kept (docs/wsl/windows-ansible.md,
# "Cleanup").
windows_locked_dirs:
  - 'C:\ProgramData\tnwks-cleanup-backup'
