---
# The Ubuntu WSL distro on WSL-02: Docker and, later, the homelab-wsl-02 Talos
# nodes.

# The Windows admin account owns the distro (same name inside it).
wsl_distro_user: "{{ hostvars['WSL-02'].ansible_user }}"
wsl_distro_windows_host: WSL-02
# Its sshd from the LAN: windows_lan_bridge on WSL-02 forwards 2222 to it
# (from DESKTOP-HKE05KI only). Host key in inventory/known_hosts.
wsl_distro_ssh_host: 10.10.91.112
ansible_port: 2222

# The Talos bootstrap for homelab-wsl-02 runs here (local Docker), with the
# pinned CLIs from wsl_cluster_tools.
wsl_cluster_tools_enabled: true

# Nothing on this distro for these roles yet; an empty list skips the role
# (playbooks/wsl-distro.yml).
# LAN 80/443 -> homelab-wsl-02's ingress-nginx-internal (Cilium LB IP; the
# Windows half forwards them, host_vars/WSL-02).
wsl_lan_bridge_instances: [http, https]
wsl_lan_bridge_targets:
  INTERNAL_INGRESS_IP: 10.6.0.200
wsl_usb_attach_devices: []
wsl_backups_timers: []
# The tnwks-ansible runners on homelab-wsl (group_vars/site_wsl02.yml). They
# arrive through the 2222 portproxy, so the distro sees them from the
# vEthernet address (the LAN-side scope is the Windows firewall rule), and
# they may forward only to Windows sshd, for the jump in host_vars/WSL-02.
wsl_ci_authorized_keys:
  - key: "{{ wsl_ci_authorized_keys_runner }}"
    from: 172.25.16.1
    permit_open: 172.25.16.1:22

# Site routing (role wsl_site_routing, docs/wsl/multi-site.md): wg-site2, its
# site tunnel to sce-rtr01, FRR peering with the router over it, and the
# forwarding and connmark rules. The router side, and where its public key
# comes from (the mikrotik module's wireguard_public_keys output), is
# infrastructure/terraform/environments/prod/mikrotik/site-tunnels.tf. The
# distro's private key is wsl_site_wireguard_private_key in secrets.sops.yml
# next to this file.
wsl_site_routing_enabled: true
wsl_site_routing_interface: wg-site2
wsl_site_routing_address: 10.10.34.2/30
wsl_site_routing_router_address: 10.10.34.1
wsl_site_routing_router_endpoint: 10.10.91.1:51824
wsl_site_routing_router_public_key: 0qLb7Dr8HHbpQ6c5GBQKIKQ+8/kz0InSp/Gbd3ESCCA=
wsl_site_routing_asn: 64612
wsl_site_routing_cilium_asn: 64602
wsl_site_routing_docker_network: homelab-wsl-02
wsl_site_routing_node_subnet: 10.6.0.0/24
wsl_site_routing_pod_cidr: 10.44.0.0/16
# What the router sends this site: site 1's node subnet and pod CIDRs.
wsl_site_routing_remote_prefixes:
  - prefix: 10.5.0.0/24
  - prefix: 10.42.0.0/16
    le: 24
