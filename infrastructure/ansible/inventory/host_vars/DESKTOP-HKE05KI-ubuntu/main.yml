---
# The Ubuntu WSL distro on DESKTOP-HKE05KI: Docker, the homelab-wsl Talos
# nodes, and the WSL half of the LAN bridge and USB attach.

# The distro account that runs the timers (its kubeconfig, SSH and age keys).
wsl_distro_user: it3e
# The Windows host it runs on: a controller with this hostname is the distro
# itself (WSL takes the Windows computer name) and connects locally.
wsl_distro_windows_host: DESKTOP-HKE05KI
# Where other controllers reach its sshd: the gateway of the homelab-wsl
# Docker network, from the runner pods (host key in inventory/known_hosts).
wsl_distro_ssh_host: 10.5.0.1

# The distro's end of wg-site1, its site tunnel to sce-rtr01 (docs/wsl/multi-site.md,
# "Network"): wsl_site_wireguard_private_key is in secrets.sops.yml next to
# this file. Its public key, tunnel addresses and the router side are in
# infrastructure/terraform/environments/prod/mikrotik/site-tunnels.tf. No role
# reads it yet.
