---
# The Ubuntu WSL distro on DESKTOP-HKE05KI: Docker, the homelab-wsl Talos
# nodes, and the WSL half of the LAN bridge and USB attach.

# The distro account that runs the timers (its kubeconfig, SSH and age keys).
wsl_distro_user: it3e
# The Windows host it runs on: a controller with this hostname is the distro
# itself (WSL takes the Windows computer name) and connects locally.
wsl_distro_windows_host: DESKTOP-HKE05KI
# Where other controllers reach its sshd: the gateway of the homelab-wsl
# Docker network, from the runner pods (host key in inventory/known_hosts).
wsl_distro_ssh_host: 10.5.0.1

# Site routing (role wsl_site_routing, docs/wsl/multi-site.md): wg-site1, its
# site tunnel to sce-rtr01, FRR peering with the router over it, and the
# forwarding and connmark rules. The router side, and where its public key
# comes from (the mikrotik module's wireguard_public_keys output), is
# infrastructure/terraform/environments/prod/mikrotik/site-tunnels.tf. The
# distro's private key is wsl_site_wireguard_private_key in secrets.sops.yml
# next to this file.
wsl_site_routing_enabled: true
wsl_site_routing_interface: wg-site1
wsl_site_routing_address: 10.10.33.2/30
wsl_site_routing_router_address: 10.10.33.1
wsl_site_routing_router_endpoint: 10.10.91.1:51823
wsl_site_routing_router_public_key: YYdSAxhrWWGYBQS2YJ4QN9KK3ZmSONsiI+mVHpKJa2o=
wsl_site_routing_asn: 64611
wsl_site_routing_cilium_asn: 64601
wsl_site_routing_docker_network: homelab-wsl
wsl_site_routing_node_subnet: 10.5.0.0/24
# Stage B: the distro masquerades the node subnet out of eth0 (TNWKS-SR-NAT),
# on before the Docker network goes nat-unprotected without masquerading.
# Until then it overlaps Docker's own MASQUERADE, which rewrites to the same
# eth0 address (rehearsed 2026-11-06: same result, open connections kept).
# Only eth0: after Stage B, traffic into the tunnel keeps the node address.
wsl_site_routing_masquerade: true
wsl_site_routing_pod_cidr: 10.42.0.0/16
# What the router sends this site: site 2's node subnet and pod CIDRs.
wsl_site_routing_remote_prefixes:
  - prefix: 10.6.0.0/24
  - prefix: 10.44.0.0/16
    le: 24
