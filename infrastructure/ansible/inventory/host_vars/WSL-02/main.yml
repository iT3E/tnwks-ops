---
# The second WSL host (site_wsl02). ansible_user, in secrets.sops.yml next
# to this file, is the administrator account (step 4 of the account change,
# Design Doc 0004, section 9). It does not own the WSL distro.

# The account that owns the WSL distro: the present account until the done
# switch of the move, then the account that the move made. Both names are in
# secrets.sops.yml (wsl_move_present_account, wsl_move_new_account).
windows_desktop_user: >-
  {{ wsl_move_new_account if wsl_move_phase == 'done' else wsl_move_present_account }}

# The vEthernet (WSL) address, where Install-TnwksWindowsSshd.ps1 binds sshd.
# Only the distro can reach it, so other controllers jump through the
# distro's sshd (WSL-02-ubuntu: LAN 10.10.91.112:2222, role
# windows_lan_bridge). Re-pin it here and in known_hosts if WSL ever picks
# another subnet.
ansible_host: 172.25.16.1
# Replaces group_vars/all/connection.yml for this host: the same pinned host
# keys, plus the jump. The jump logs in with the distro's key, as the user
# of the distro (wsl_distro_user of WSL-02-ubuntu, from the same value: a
# value of that host that takes hostvars can not be read through hostvars
# here).
ansible_ssh_common_args: >-
  -o UserKnownHostsFile={{ inventory_dir }}/known_hosts
  -o StrictHostKeyChecking=yes
  -o ProxyCommand="ssh -W %h:%p -p {{ hostvars['WSL-02-ubuntu'].ansible_port }}
  -o UserKnownHostsFile={{ inventory_dir }}/known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes
  -i {{ hostvars['WSL-02-ubuntu'].ansible_ssh_private_key_file }}
  {{ wsl_move_present_account }}@{{ hostvars['WSL-02-ubuntu'].wsl_distro_ssh_host }}"

# Not on this host (yet): no Coral, no Z-Stick. An empty list skips the role
# (playbooks/windows-host.yml).
coral_detector_devices: []
usb_attach_bound_devices: []
# One UDP relay: the router's version line of the security platform, to
# homelab-wsl-02's vector-aggregator (Design Doc 0004, section 5.5). The router
# sends nothing else here (its logging rule version_line, Terraform). Only the
# router's address, as on DESKTOP-HKE05KI. No NetFlow relay.
udp_relays:
  - task: tnwks-udp-relay-syslog
    port: 6001
    remote: [10.10.91.1]
# The watchdog only keeps WSL and the distro up here: no OpenClaw gateway, no
# Z-Stick (and so no worker-2 restart after a cold start).
wsl_watchdog_args: -SkipGateway -SkipUsb -KeepAliveTask tnwks-wsl-keepalive
# Nothing else here keeps a wsl.exe client open, so WSL would stop the distro
# a few seconds after the watchdog starts it (seen 2026-11-05).
wsl_keepalive_enabled: true
# Site 2 first (Design Doc 0004, section 5.9): each task that starts a
# process in the distro runs with no elevation. The services of the distro
# take it at the next start of the distro (docs/wsl/windows-ansible.md, "Start
# WSL with no elevation").
wsl_start_unelevated: true
# The rehearsal of the account change ran here (role windows_wsl_rehearsal).
# Its state is absent: the apply removes it.
wsl_rehearsal: true
# The rehearsal of the move of a distro to another account (role
# windows_wsl_move_rehearsal) ended: its switch is off until the next
# rehearsal, which turns it on here again.
wsl_move_rehearsal: false
# Step 3 of the account change (role windows_wsl_move, Design Doc 0004,
# section 9, step 3), with the owner's go: the account that owns the distro,
# its tasks, and the procedure of the move window. No apply starts the window.
# The names of the two accounts, the folder of the disk file today and the
# version of WSL that the rehearsal of the move ran on are in
# secrets.sops.yml next to this file. The play stops before any change while
# one of them is missing.
wsl_move: true
# The done switch of the move (section 9, step 6), only after the check play
# of step 6 passed (playbooks/windows-move-window.yml, -e
# wsl_move_window=check), with the write test from the distro and the relay.
# From it, the account that owns the distro is the new account, the copies of
# the start tasks stay enabled, and the host check reads the rules of the
# moved disk file. A way back turns it off first.
wsl_move_done: true
# The deletion of the tasks of the present account, after the owner took that
# account out of windows_sshd_allow_users in secrets.sops.yml. Its apply is
# the point of no return of the move.
wsl_move_present_removed: true
# Never sleeps: something put it to sleep three times in two weeks (role
# windows_power).
power_no_sleep: true
# The distro's disk, for the on-demand compaction task and the host check:
# the moved file in the folder of the move from the done switch, and before
# it the file where `wsl --install` put it, on C: in the folder of the
# present account. The folder of the move is the default of the role
# windows_wsl_move, here so that the compaction and the host check read it
# too. The role windows_wsl_move stops the play when this is not the file of
# the phase.
wsl_move_disk_dir: 'C:\ProgramData\tnwks-wsl-move\disk'
vhdx_compact_vhdx: >-
  {{ wsl_move_disk_dir if wsl_move_phase == 'done' else wsl_move_present_folder }}\ext4.vhdx

# homelab-wsl's Prometheus scrapes both exporters over the LAN (from
# DESKTOP-HKE05KI's address, where its pods' traffic leaves).
windows_monitoring_remote_extra: [10.10.91.142]

# Only the distro's sshd, and only from DESKTOP-HKE05KI (its controller). It
# replaces the hand-made rule that admitted any address.
lan_bridge_tcp_ports:
  # homelab-wsl-02's internal ingress, from the LAN like homelab-wsl's.
  - { port: 80 }
  - { port: 443 }
  - { port: 2222, wsl_port: 22, remote: [10.10.91.142] }
  # Prometheus federation for homelab-wsl (it watches this site too).
  - { port: 9090, remote: [10.10.91.142] }
  # UniFi inform from the APs (VLAN 900 only), for when the controller runs
  # here. socat listens on 18080, as on DESKTOP-HKE05KI.
  - { port: 8080, wsl_port: 18080, remote: [10.10.90.0/24] }
lan_bridge_replaced_rules:
  - WSL SSH Rule # tcp/2222 from any
  - WSL llama.cpp # tcp/50052 from any, unused
# The hand-made llama.cpp RPC portproxy entry (nothing listens behind it).
lan_bridge_retired_tcp_ports: [50052]

# On wifi for the foreseeable future: no wired NIC to check, and Wi-Fi stays
# on.
host_settings_ethernet: ""
host_settings_disabled_adapters: []
# A larger VM than the role's default: worker 1 of homelab-wsl-02 has a
# limit of 18 GiB (talos_clusters.wsl-02.memory_nodes), and the node limits
# add to 35 GiB.
wsl_memory: 45GB
