---
# Every host Ansible manages, in one inventory (docs/operations/ansible.md). Pick hosts
# with --limit, never with a different inventory file.
#
#   windows_hosts  Windows machines that run a WSL Talos cluster. Named by
#                  their Windows computer name, which is also the `instance`
#                  label Prometheus gives their windows_exporter metrics.
#   wsl_distros    the WSL distro on each of them (Docker + the Talos nodes).
#   mikrotik       RouterOS devices, reached over their REST API.
#   site_<name>    one Windows host and its distro: `--limit site_wsl`.
#
# Talos nodes aren't Ansible hosts (no SSH); the bootstrap playbooks read
# them from talos_clusters in group_vars/all/talos.yml.
#
# A second Windows host is one more host in windows_hosts, its distro in
# wsl_distros, a site_<name> group with both, and host_vars for each.

all:
  children:
    windows_hosts:
      hosts:
        DESKTOP-HKE05KI:
    wsl_distros:
      hosts:
        DESKTOP-HKE05KI-ubuntu:
    mikrotik:
      hosts:
        sce-rtr01:
    site_wsl:
      hosts:
        DESKTOP-HKE05KI:
        DESKTOP-HKE05KI-ubuntu:
