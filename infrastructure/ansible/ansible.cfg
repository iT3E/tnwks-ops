# Relative paths below resolve against this file's directory, so every
# command works from any working directory as long as ANSIBLE_CONFIG points
# here (the taskfiles set it).

[defaults]
inventory                   = inventory/hosts.yml
roles_path                  = roles
library                     = playbooks/library
collections_path            = ~/.ansible/collections-tnwks-ops
nocows                      = True
interpreter_python          = auto_silent
# The `yaml` callback is gone from community.general 12+; this is its
# replacement in ansible-core.
stdout_callback             = default
callback_result_format      = yaml
log_path                    = ~/.ansible/ansible.log
local_tmp                   = ~/.ansible/tmp
fact_caching                = jsonfile
fact_caching_connection     = ~/.ansible/facts_cache
timeout                     = 60
# Host keys are pinned in inventory/known_hosts (group_vars/all/connection.yml).
host_key_checking           = True
vars_plugins_enabled        = host_group_vars,community.sops.sops

[inventory]
unparsed_is_failed          = true

[privilege_escalation]
# Plays that need root say so (`become: true`); Windows hosts never do.
become                      = False

[ssh_connection]
retries                     = 3
pipelining                  = True
ssh_args                    = -o ControlMaster=auto -o ControlPersist=30m -o ServerAliveInterval=15s
