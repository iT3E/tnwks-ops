---
# Phase 4 of bootstrap: install Flux and bootstrap against the GitHub repo
#
# Requires:
#   - kubeconfig at ~/.kube/config-{cluster_name}  (set by 01-talos-bootstrap.yml)
#   - CNI installed                                 (set by 02-cni-bootstrap.yml)
#   - sops-age secret in flux-system namespace     (set by 03-sops-keys.yml)
#   - GITHUB_TOKEN environment variable (or 1Password CLI configured)
#
# Run via:
#   ansible-playbook playbooks/04-flux-install.yml                      # wsl
#   ansible-playbook playbooks/04-flux-install.yml -e talos_target=ms-01

- name: Bootstrap Flux against GitHub repo
  hosts: localhost
  connection: local
  gather_facts: true
  become: false

  vars:
    cluster_target: "{{ talos_target | default('wsl') }}"
    cluster_name: "homelab-{{ cluster_target }}"
    cluster_path: "kubernetes/clusters/{{ cluster_target }}"
    kubeconfig_path: "{{ ansible_env.HOME }}/.kube/config-{{ cluster_name }}"
    github_owner: "iT3E"
    github_repo: "tnwks-ops"
    github_branch: "{{ flux_branch | default('main') }}"
    # `manifests`: apply the committed kubernetes/clusters/<target>/flux-system
    # (homelab-wsl-02: public repo over HTTPS, no deploy key, nothing pushed to
    # main). Otherwise `flux bootstrap github`.
    flux_install: "{{ talos_clusters[cluster_target].flux_install | default('github') }}"
    repo_root: "{{ playbook_dir }}/../../.."

  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
    GITHUB_TOKEN: "{{ lookup('env', 'GITHUB_TOKEN') }}"

  tasks:
    - name: Ensure flux CLI is installed
      ansible.builtin.command: flux version --client
      register: flux_check
      changed_when: false
      failed_when: false

    # The upstream installer script; it picks the release and the binary.
    - name: Install flux CLI if missing  # noqa: command-instead-of-module
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsS https://fluxcd.io/install.sh | sudo bash
      args:
        executable: /bin/bash
      when: flux_check.rc != 0
      changed_when: true

    - name: Verify GITHUB_TOKEN is set
      ansible.builtin.fail:
        msg: |
          GITHUB_TOKEN environment variable is required.
          Try: export GITHUB_TOKEN=$(op read 'op://Private/GitHub Flux Token/credential')
      when:
        - flux_install == 'github'
        - lookup('env', 'GITHUB_TOKEN') | length == 0

    - name: Verify cluster is reachable
      ansible.builtin.command: kubectl cluster-info
      changed_when: false

    # The CRDs and the objects using them are in one build, so the first pass
    # can fail on "no matches for kind" until the CRDs are established.
    - name: Apply the committed flux-system (controllers, GitRepository, Kustomization)
      ansible.builtin.command: >-
        kubectl apply --server-side --force-conflicts
        -k {{ repo_root }}/{{ cluster_path }}/flux-system
      register: flux_manifests
      until: flux_manifests.rc == 0
      retries: 3
      delay: 15
      changed_when: "' serverside-applied' in flux_manifests.stdout"
      when: flux_install == 'manifests'

    - name: Wait for the Flux controllers
      ansible.builtin.command: >-
        kubectl -n flux-system rollout status deploy/{{ item }} --timeout=300s
      loop: [source-controller, kustomize-controller, helm-controller, notification-controller]
      changed_when: false
      when: flux_install == 'manifests'

    - name: Run flux bootstrap github
      ansible.builtin.command: >-
        flux bootstrap github
        --owner={{ github_owner }}
        --repository={{ github_repo }}
        --branch={{ github_branch }}
        --path={{ cluster_path }}
        --personal
        --components-extra=image-reflector-controller,image-automation-controller
      register: flux_bootstrap
      changed_when: "'unchanged' not in flux_bootstrap.stdout"
      when: flux_install == 'github'

    - name: Show flux bootstrap result
      ansible.builtin.debug:
        var: flux_bootstrap.stdout_lines
      when: flux_install == 'github'
