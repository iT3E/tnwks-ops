---
# The WSL distro on each Windows host (inventory group wsl_distros): the WSL
# halves of the LAN bridge and the USB attach, the backup timers, and the CI
# runners' SSH access. The Windows halves are in windows-host.yml.
#
#   task wsl-host:distro-check   # --check --diff, changes nothing
#   task wsl-host:distro-apply
#
# One role with `--tags docker` / `cluster-tools` / `ci-access` / `host-mcp` / `lan-bridge` /
# `site-routing` / `usb-attach` / `backups` / `drift-check` / `host-check`. A distro with
# nothing for a role sets its list empty in host_vars (or leaves its
# `_enabled` off), and the role is skipped.
#
# The site's border router (wg-site<N>, FRR, connmark return routing):
# docs/wsl/multi-site.md.
#
# USB attach needs each dongle `usbipd bind`-ed on Windows, so it is shareable
# and the binding persists across reboots: windows-host.yml does that (role
# windows_usb_attach, docs/wsl/usb-passthrough.md).

- name: WSL distro
  hosts: wsl_distros
  become: true
  gather_facts: false
  roles:
    # Docker Engine, which runs the Talos nodes (docs/wsl/bootstrap.md).
    - role: wsl_docker
      tags: [docker]
    # The pinned CLIs the Talos bootstrap runs on a distro without Homebrew.
    - role: wsl_cluster_tools
      when: wsl_cluster_tools_enabled | bool
      tags: [cluster-tools]
    # The tnwks-ansible runners' key (CI reaches the distro over SSH).
    - role: wsl_ci_access
      tags: [ci-access]
    - role: wsl_time
      tags: [time]
    # Exposes *.internal.tnwks.us services to the LAN with the Windows-side
    # portproxy (docs/wsl/lan-exposure.md).
    - role: wsl_lan_bridge
      when: wsl_lan_bridge_instances | length > 0
      tags: [lan-bridge]
    # The distro as its site's border router: the WireGuard tunnel to the
    # router, FRR (BGP), forwarding and connmark return routing. On where
    # host_vars sets wsl_site_routing_enabled.
    - role: wsl_site_routing
      when: wsl_site_routing_enabled | bool
      tags: [site-routing]
    # The monitoring data of site 1 in a file on the distro disk, mounted by a
    # loop device, in place of the VHDX of windows_observability_storage
    # (Design Doc 0004, section 5.13). Off while that VHDX holds the data.
    - role: wsl_observability_file
      when: hostvars[wsl_distro_windows_host].observability_storage_enabled | default(false) | bool
      tags: [observability-file]
    # Keeps the Z-Stick attached into the WSL VM across WSL restarts.
    - role: wsl_usb_attach
      when: wsl_usb_attach_devices | length > 0
      tags: [usb-attach]
    # UniFi and Aruba backups to Google Drive (docs/operations/backups.md).
    - role: wsl_backups
      when: wsl_backups_timers | length > 0
      tags: [backups]
    # Removes the old nightly drift-check timer: the drift check runs in CI
    # now (.github/workflows/ansible-hosts.yaml).
    - role: wsl_drift_check
      tags: [drift-check]
    # The host check of the security platform: the distro's pending upgrades,
    # as a JSON document in the inbox of its Windows host, whose relay writes
    # the .prom file for windows_exporter (security/README.md, "The host
    # check"). windows-host.yml makes the inbox first (role
    # windows_host_check).
    - role: wsl_host_check
      tags: [host-check]
    # The local user of the host server of the main agent, where the site
    # turns it on (docs/wsl/host-mcp-user.md). Last: without the flag of the
    # owner it checks only, and a difference fails the host for the rest of
    # the run, so no other role of the distro waits on it.
    - role: wsl_host_mcp_user
      when: host_mcp_agent_enabled | bool
      tags: [host-mcp]
