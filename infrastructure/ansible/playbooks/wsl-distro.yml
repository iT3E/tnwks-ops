---
# The WSL distro on each Windows host (inventory group wsl_distros): the WSL
# halves of the LAN bridge and the USB attach, the backup timers and the
# nightly Windows drift check. The Windows halves are in
# windows-host.yml.
#
#   task wsl-host:distro-check   # --check --diff, changes nothing
#   task wsl-host:distro-apply
#
# One role with `--tags lan-bridge` / `usb-attach` / `backups` / `drift-check`.
#
# USB attach needs each dongle `usbipd bind`-ed on Windows, so it is shareable
# and the binding persists across reboots: windows-host.yml does that (role
# windows_usb_attach, docs/wsl/usb-passthrough.md).

- name: WSL distro
  hosts: wsl_distros
  become: true
  gather_facts: false
  roles:
    # Exposes *.internal.tnwks.us services to the LAN with the Windows-side
    # portproxy (docs/wsl/lan-exposure.md).
    - role: wsl_lan_bridge
      tags: [lan-bridge]
    # Keeps the Z-Stick attached into the WSL VM across WSL restarts.
    - role: wsl_usb_attach
      tags: [usb-attach]
    # UniFi and Aruba backups to Google Drive (docs/operations/backups.md).
    - role: wsl_backups
      tags: [backups]
    # The nightly --check of the Windows host, reported to Prometheus.
    - role: wsl_drift_check
      tags: [drift-check]
