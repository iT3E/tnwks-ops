---
# windows_sshd: the OpenSSH server Ansible itself connects through, as
# files/Install-TnwksWindowsSshd.ps1 sets it up (docs/wsl/windows-ansible.md,
# "sshd bootstrap"). The role runs that same script, so the bootstrap and the
# drift check can't disagree.
#
# Check only by default: rewriting sshd_config restarts sshd under the Ansible
# session, so a normal apply never changes it and drift fails the run, like
# windows_host_settings. Fix drift with `task wsl-host:sshd` (UAC prompt), or
# `task wsl-host:windows-apply -- --tags sshd -e windows_sshd_apply=true` when
# losing the session halfway is acceptable.
windows_sshd_apply: false

# The account that Ansible logs in as (also the one that owns the WSL distro).
windows_sshd_admin_user: "{{ ansible_user }}"
# The accounts in AllowUsers: the account above by default. While a host
# moves its distro to another account (Design Doc 0004, section 9, step 2),
# the variables of that host list both accounts. The list must hold the
# account that Ansible logs in as: the role fails before any change when it
# does not.
windows_sshd_allow_users: "{{ [windows_sshd_admin_user] }}"

# administrators_authorized_keys, in this order. The public halves of the
# controllers' Ansible keys; set for windows_hosts in group_vars.
windows_sshd_authorized_keys: []

# The local user of the host server of the main agent (role
# windows_host_mcp_user), where host_mcp_agent_enabled is on: AllowUsers
# lists it after the accounts above, and a Match block of its own names the
# key file of that role (Install-TnwksWindowsSshd.ps1). Empty: no such user,
# and sshd_config is as before.
windows_sshd_agent_user: "{{ host_mcp_agent_user if host_mcp_agent_enabled | bool else '' }}"
