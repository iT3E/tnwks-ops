---
# Runs last in the play: a failed assertion here stops nothing else.

- name: .wslconfig matches the template (written only with wslconfig_write=true)
  ansible.windows.win_copy:
    content: "{{ lookup('ansible.builtin.template', 'wslconfig.j2') }}"
    dest: "{{ wslconfig_path }}"
  check_mode: "{{ ansible_check_mode or not (wslconfig_write | bool) }}"
  register: host_settings_wslconfig

- name: Read NIC and power settings
  ansible.windows.win_powershell:
    parameters:
      Ethernet: "{{ host_settings_ethernet }}"
      Advanced: "{{ host_settings_ethernet_advanced }}"
      AllowTurnOff: "{{ host_settings_ethernet_allow_turn_off }}"
      Disabled: "{{ host_settings_disabled_adapters }}"
      Scheme: "{{ host_settings_power_scheme }}"
      FastStartupOff: "{{ host_settings_fast_startup_off | bool }}"
    script: |
      param([string]$Ethernet, [hashtable]$Advanced, [string]$AllowTurnOff, [string[]]$Disabled, [string]$Scheme, [string]$FastStartupOff)
      $Ansible.Changed = $false
      $drift = @()
      $nic = if ($Ethernet) { Get-NetAdapter -Name $Ethernet -ErrorAction SilentlyContinue }
      if ($Ethernet -and -not $nic) { $drift += "no adapter named $Ethernet" } elseif ($nic) {
          $pm = Get-NetAdapterPowerManagement -Name $Ethernet
          if ("$($pm.AllowComputerToTurnOffDevice)" -ne $AllowTurnOff) {
              $drift += "$Ethernet AllowComputerToTurnOffDevice is $($pm.AllowComputerToTurnOffDevice), want $AllowTurnOff"
          }
          # -RegistryKeyword takes wildcards ('*EEE' would also match AdvancedEEE).
          $props = Get-NetAdapterAdvancedProperty -Name $Ethernet -AllProperties
          foreach ($k in $Advanced.Keys) {
              $p = $props | Where-Object { $_.RegistryKeyword -eq $k } | Select-Object -First 1
              $have = if ($p) { ($p.RegistryValue -join ',') } else { '<missing>' }
              if ($have -ne $Advanced[$k]) { $drift += "$Ethernet $k is $have ($($p.DisplayValue)), want $($Advanced[$k])" }
          }
      }
      foreach ($name in $Disabled) {
          $a = Get-NetAdapter -Name $name -ErrorAction SilentlyContinue
          if ($a -and "$($a.Status)" -ne 'Disabled') { $drift += "$name adapter is $($a.Status), want Disabled" }
      }
      $active = if ((powercfg.exe /getactivescheme) -match '([0-9a-f]{8}-[0-9a-f-]{27})') { $Matches[1] } else { '?' }
      if ($active -ne $Scheme) { $drift += "active power scheme is $active, want $Scheme" }
      if ($FastStartupOff -eq 'True') {
          $hb = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Power' -ErrorAction SilentlyContinue).HiberbootEnabled
          if ("$hb" -ne '0') { $drift += "Fast Startup is on (HiberbootEnabled=$hb), want off" }
      }
      $drift
  check_mode: false
  register: host_settings_read

# One assertion, so a .wslconfig drift doesn't hide a NIC drift.
- name: No drift in .wslconfig, NIC or power settings (Ansible never changes these)
  ansible.builtin.assert:
    that: host_settings_drift | length == 0
    fail_msg: "{{ host_settings_drift }}"
    quiet: true
  vars:
    host_settings_drift: >-
      {{ host_settings_read.output
         + ([wslconfig_path ~ ' differs from templates/wslconfig.j2 (diff above): fix the template, or write it with'
             ~ ' -e wslconfig_write=true; WSL reads it at the next wsl --shutdown']
            if (host_settings_wslconfig is changed and (ansible_check_mode or not (wslconfig_write | bool))) else []) }}
