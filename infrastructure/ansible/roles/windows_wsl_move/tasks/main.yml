---
# Step 3 of the account change (defaults/main.yml). Each part can run again
# on a host where it ran before, and where a window ran: the state file, the
# log, the saved version, the marker and the reads of today are written only
# when they are absent, and the scripts, the configs and the tasks change
# only while no window is started (host_files.yml).
#
# The names of the accounts and the folder of the disk file are in the
# encrypted variables of the host: each task that takes one has no_log, so no
# log of a run (the runners' logs among them) shows it.

- name: The variables of the move are set
  ansible.builtin.assert:
    that:
      - wsl_move_present_account | default('') | length > 0
      - wsl_move_new_account | default('') | length > 0
      - wsl_move_present_folder | default('') | length > 0
      - wsl_move_rehearsed_wsl_version | default('') | length > 0
      - wsl_move_present_account | lower != wsl_move_new_account | lower
      - wsl_move_new_start_tasks | length > 0
    fail_msg: >-
      wsl_move_present_account, wsl_move_new_account, wsl_move_present_folder and wsl_move_rehearsed_wsl_version are set
      in the encrypted variables of the host, the two accounts differ, and wsl_move_new_start_tasks names the start tasks of the new account.
      Nothing is changed.
    quiet: true
  no_log: true

# Window step 8 enables the start tasks of the new account: the copy
# (wsl_move_task_suffix) of each WSL task of the present account, apart from
# the compaction, which has no copy.
- name: The start tasks of the new account are the copies of the tasks of the present account
  ansible.builtin.assert:
    that: >-
      wsl_move_new_start_tasks | sort
      == wsl_move_present_tasks | reject('equalto', 'tnwks-vhdx-compact')
         | map('regex_replace', '$', wsl_move_task_suffix) | sort
    fail_msg: >-
      wsl_move_new_start_tasks is not the list of the copies of the WSL tasks of the present account
      (wsl_move_present_tasks, apart from the compaction). Nothing is changed.
    quiet: true

# The account that owns the distro and the disk file of the compaction and the
# host check follow the phase (host_vars): the present account and the file in
# its folder in the phase move, the new account and the moved file from the
# done switch.
- name: The account that owns the distro and the disk file follow the phase of the move
  ansible.builtin.assert:
    that:
      - >-
        (windows_desktop_user | default('') | lower)
        == ((wsl_move_new_account if wsl_move_phase == 'done' else wsl_move_present_account) | lower)
      - >-
        (vhdx_compact_vhdx | default('') | ansible.builtin.win_dirname | lower)
        == ((wsl_move_disk_dir if wsl_move_phase == 'done' else wsl_move_present_folder) | lower)
      - (vhdx_compact_vhdx | default('') | ansible.builtin.win_basename | lower) == (wsl_move_disk_name | lower)
    fail_msg: >-
      In the phase {{ wsl_move_phase }}, windows_desktop_user is not the {{ 'new' if wsl_move_phase == 'done' else 'present' }}
      account, or vhdx_compact_vhdx is not the disk file in {{ 'the folder of the move' if wsl_move_phase == 'done'
      else 'the folder of today' }}. Nothing is changed.
    quiet: true
  no_log: true

# The deletion of the tasks of the present account (wsl_move_present_removed)
# comes after the done switch, and after the owner took that account out of
# the allow list of sshd, which keeps the account that Ansible logs in as.
# The apply of that list stays the explicit one of the role windows_sshd.
- name: The deletion of the tasks of the present account comes after the done switch and the allow list without that account
  vars:
    wsl_move_allow_list: "{{ windows_sshd_allow_users | default([]) | map('lower') | list }}"
  ansible.builtin.assert:
    that:
      - not (wsl_move_present_removed | bool) or wsl_move_phase == 'done'
      - not (wsl_move_present_removed | bool) or (wsl_move_present_account | lower) not in wsl_move_allow_list
      - not (wsl_move_present_removed | bool) or (ansible_user | lower) in wsl_move_allow_list
    fail_msg: >-
      wsl_move_present_removed needs the phase done, and windows_sshd_allow_users without the present account and with
      the account that Ansible logs in as. Nothing is changed.
    quiet: true
  no_log: true

- name: Each path of the procedure is in the long, normalized form
  ansible.builtin.assert:
    that: wsl_move_paths | reject('match', wsl_move_path_form) | list | length == 0
    fail_msg: >-
      A path of the procedure is not in the long, normalized form (vars/main.yml, wsl_move_paths). Nothing is changed.
    quiet: true
  no_log: true

# The move is a rename in one volume, never a copy (section 4.1.6): the folder
# of the new disk file is on the volume of the disk file today, and each path
# of the procedure is on it too (the scope of the scripts).
- name: The folder of the new disk file is on the volume of the disk file today
  ansible.builtin.assert:
    that:
      - wsl_move_root is match('^[A-Za-z]:\\\\$')
      - (wsl_move_present_folder | lower).startswith(wsl_move_root | lower)
      - >-
        [wsl_move_state_dir, wsl_move_log_dir, wsl_move_dir]
        | reject('match', '(?i)^' ~ (wsl_move_root | regex_escape)) | list | length == 0
      - (wsl_move_present_folder | lower).rstrip('\\') != (wsl_move_disk_dir | lower).rstrip('\\')
    fail_msg: >-
      The folder of the new disk file, {{ wsl_move_disk_dir }}, is not on the volume of the disk file today, or a folder
      of the procedure is not on it, or it is the folder of today. Nothing is changed.
    quiet: true
  no_log: true

- name: The task names of the procedure start with tnwks-
  ansible.builtin.assert:
    that: >-
      (wsl_move_present_tasks + wsl_move_new_start_tasks + wsl_move_window_tasks.present.values() | list
      + wsl_move_window_tasks.new.values() | list) | reject('match', '^tnwks-') | list | length == 0
    fail_msg: Each task that the procedure starts, stops, disables or enables has a name that starts with tnwks-.
    quiet: true

# The way back of the procedure needs the session of the present account for
# none of its steps, but this play registers the three window tasks of that
# account as that account (no password): only while Ansible logs in as it.
- name: Ansible logs in as the present account, or its window tasks are there
  ansible.builtin.set_fact:
    wsl_move_as_present: "{{ ansible_user | lower == wsl_move_present_account | lower }}"
  no_log: true

# The procedure runs only on the version of WSL that its rehearsal ran on
# (section 9, step 3): at every apply, before any write.
- name: The installed WSL is the version of the rehearsal of the move
  ansible.windows.win_powershell:
    parameters:
      Binary: "{{ wsl_move_service_binary }}"
      Rehearsed: "{{ wsl_move_rehearsed_wsl_version }}"
    script: |
      param([string]$Binary, [string]$Rehearsed)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $installed = [Diagnostics.FileVersionInfo]::GetVersionInfo($Binary).FileVersion
      if (-not $installed -or $installed.Trim() -ne $Rehearsed.Trim()) {
          throw 'The installed WSL is not the version of the rehearsal of the move. Nothing is changed.'
      }
  check_mode: false
  no_log: true

# Step 4 makes the administrator account the SSH user. From then on, only an
# apply as the present account (step 3) reads the registry and the profile of
# that account and registers its window tasks: an apply as another account
# needs both kept, and stops before any write without them.
- name: An apply as another account than the present one comes after step 3 ran as the present account
  ansible.windows.win_powershell:
    parameters:
      Registration: "{{ wsl_move_registration_file }}"
      Wslconfig: "{{ wsl_move_wslconfig_file }}"
      Names: "{{ [] if wsl_move_present_removed | bool else wsl_move_window_tasks.present.values() | list }}"
    script: |
      param([string]$Registration, [string]$Wslconfig, [string[]]$Names)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $kept = (Test-Path -LiteralPath $Registration) -and (Test-Path -LiteralPath $Wslconfig)
      $tasks = @($Names | Where-Object { Get-ScheduledTask -TaskName $_ -ErrorAction SilentlyContinue }).Count -eq $Names.Count
      if (-not ($kept -and $tasks)) {
          throw ('Ansible does not log in as the present account, and step 3 has not run as that account: ' +
              'the reads of today or the window tasks of the present account are not there. Nothing is changed.')
      }
  check_mode: false
  when: not wsl_move_as_present | bool
  no_log: true

# Tagged always, with the guard of the done switch below: a run with the tags
# of a WSL role only (they come after this role in the play) still stops
# there.
- name: Read the last marker of the state file
  tags: [always]
  ansible.windows.win_powershell:
    parameters:
      State: "{{ wsl_move_state_file }}"
    script: |
      param([string]$State)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      if (-not (Test-Path -LiteralPath $State)) { return '' }
      $lines = @(Get-Content -LiteralPath $State | Where-Object { $_.Trim() })
      if ($lines.Count) { "$(($lines[-1] -split ' ', 2)[1])".Trim() } else { '' }
  check_mode: false
  register: wsl_move_marker_read

# A window is started from its marker until the marker of the end of its way
# back: no apply in between changes what the window runs.
- name: Whether a window is started
  ansible.builtin.set_fact:
    wsl_move_window_started: "{{ (wsl_move_marker_read.output | last | default('')) not in ['', 'wayback-done'] }}"

# The done switch turns each WSL role to the start tasks of the new account:
# merged before a window ended done, the first apply would leave the host
# with no working start task. The role stops the play for the host here,
# before the WSL roles that come after it.
- name: The done switch comes after a done window
  tags: [always]
  ansible.builtin.assert:
    that: (wsl_move_marker_read.output | last | default('')) == 'window-done'
    fail_msg: wsl_move_done is on, and the last marker of the state file is not window-done. Nothing is changed.
    quiet: true
  when: wsl_move_phase == 'done'

# The deletion of the tasks of the present account only after a forward
# window that ended done: never in a way back, nor in a window that did not
# end.
- name: The deletion of the tasks of the present account comes after a window that ended done
  ansible.builtin.assert:
    that: (wsl_move_marker_read.output | last | default('')) == 'window-done'
    fail_msg: The last marker of the state file is not window-done, and wsl_move_present_removed is on. Nothing is changed.
    quiet: true
  when: wsl_move_present_removed | bool

# Only SYSTEM and the Administrators may change the scripts, the configs and
# the state; Users may read. The folder of the disk file and the log folders
# keep their own rules.
- name: Folder of the procedure
  tnwks_win_dir_acl:
    path: "{{ wsl_move_dir }}"
    items: reset
    keep: "{{ [wsl_move_disk_dir, wsl_move_accounts.present.log_dir, wsl_move_accounts.new.log_dir] }}"
  no_log: true

- name: Folders of the state and the logs
  ansible.windows.win_file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ wsl_move_state_dir }}"
    - "{{ wsl_move_log_dir }}"

- name: The account that owns the distro
  ansible.builtin.include_tasks: account.yml

- name: What step 3 reads of today
  ansible.builtin.include_tasks: read_today.yml

- name: The state file, the log and the saved version of WSL, only when absent
  ansible.windows.win_powershell:
    parameters:
      State: "{{ wsl_move_state_file }}"
      Log: "{{ wsl_move_log_file }}"
      Version: "{{ wsl_move_version_file }}"
      Binary: "{{ wsl_move_service_binary }}"
      Rehearsed: "{{ wsl_move_rehearsed_wsl_version }}"
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param([string]$State, [string]$Log, [string]$Version, [string]$Binary, [string]$Rehearsed)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      # The installed version first: no write on another one.
      $installed = [Diagnostics.FileVersionInfo]::GetVersionInfo($Binary).FileVersion
      if (-not $installed -or $installed.Trim() -ne $Rehearsed.Trim()) {
          throw 'The installed WSL is not the version of the rehearsal of the move. Nothing is changed.'
      }
      foreach ($path in @($State, $Log)) {
          if (-not (Test-Path -LiteralPath $path)) {
              $Ansible.Changed = $true
              if ($PSCmdlet.ShouldProcess($path, 'make the file')) { [IO.File]::WriteAllText($path, '') }
          }
      }
      if (-not (Test-Path -LiteralPath $Version)) {
          $Ansible.Changed = $true
          if ($PSCmdlet.ShouldProcess($Version, 'save the version of WSL')) { [IO.File]::WriteAllText($Version, $installed) }
      }

- name: The scripts, the configs and the tasks of the procedure
  ansible.builtin.include_tasks: host_files.yml

- name: The deletion of the tasks of the present account
  ansible.builtin.include_tasks: remove_present.yml
  when: wsl_move_present_removed | bool

# D21: the Secondary Logon service starts only on demand.
- name: The Secondary Logon service has a manual start
  ansible.windows.win_service:
    name: seclogon
    start_mode: manual

- name: The probe and .wslconfig run tasks, so a check run stops here
  when: not ansible_check_mode
  block:
    - name: The token probe of the new account, which also makes its profile
      ansible.builtin.include_tasks: run_task.yml
      vars:
        wsl_move_run: {key: new, step: probe}

    - name: The probe reads a medium token, no Administrators group, and a profile under Users
      ansible.builtin.assert:
        that:
          - wsl_move_probe.medium
          - not wsl_move_probe.administrators
          - wsl_move_probe.hive
          - wsl_move_probe.profile is match('^[A-Za-z]:\\\\Users\\\\[^\\\\]+$')
        fail_msg: The probe of the new account did not read a medium token with no Administrators group and a profile under Users.
        quiet: true
      vars:
        wsl_move_probe: "{{ wsl_move_runs.probe.result }}"
      no_log: true

    # Only after the probe made the profile: no folder of a profile is made in
    # advance. The keys and values of the .wslconfig of the present account,
    # as step 3 read it. From the done switch, the new account owns the
    # distro, and the role windows_host_settings writes its .wslconfig from
    # its template and checks it byte for byte: one writer.
    - name: .wslconfig of the new account
      ansible.windows.win_copy:
        dest: '{{ wsl_move_runs.probe.result.profile }}\.wslconfig'
        content: "{{ wsl_move_wslconfig }}"
      when: wsl_move_phase != 'done'
      no_log: true
