---
# Only SYSTEM and the Administrators may make or change files here, and
# Users may read (tnwks_win_dir_acl, no writer). The folder inherits no rule.
# Each item in it takes the owner Administrators and the rules of the folder,
# at each run.
- name: LAN bridge directory
  tnwks_win_dir_acl:
    path: "{{ lan_bridge_dir }}"
    items: reset
    # Its own rules: the address task writes there (below).
    keep: ["{{ lan_bridge_ip_dir }}"]

- name: Sync script
  ansible.windows.win_copy:
    src: "{{ lan_bridge_src }}"
    dest: '{{ lan_bridge_dir }}\Sync-TnwksLanBridge.ps1'
  notify: Run the LAN bridge sync

- name: Port list for the sync script
  ansible.windows.win_copy:
    content: "{{ lookup('ansible.builtin.template', 'ports.json.j2') }}"
    dest: '{{ lan_bridge_dir }}\ports.json'
  notify: Run the LAN bridge sync

- name: Firewall rules (inbound TCP per bridged port)
  ansible.windows.win_firewall_rule:
    name: tnwks-lan-bridge-{{ item.port }}
    localport: "{{ item.port }}"
    protocol: tcp
    direction: in
    action: allow
    remoteip: "{{ item.remote | default(['any']) | join(',') }}"
    enabled: true
    state: present
  loop: "{{ lan_bridge_tcp_ports }}"
  loop_control:
    label: "tcp/{{ item.port }} from {{ item.remote | default(['any']) | join(',') }}"

# After the rules above, so the port is never closed in between.
- name: Hand-made rules the bridge's rules replaced are gone
  ansible.windows.win_powershell:
    parameters:
      Names: "{{ lan_bridge_replaced_rules }}"
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param([string[]]$Names)
      $Ansible.Changed = $false
      foreach ($n in $Names) {
          $rules = @(Get-NetFirewallRule -DisplayName $n -ErrorAction SilentlyContinue)
          if (-not $rules.Count) { continue }
          $Ansible.Changed = $true
          if ($PSCmdlet.ShouldProcess($n, 'remove firewall rule')) { $rules | Remove-NetFirewallRule }
      }

- name: Firewall rules of retired ports are gone
  ansible.windows.win_firewall_rule:
    name: tnwks-lan-bridge-{{ item }}
    state: absent
  loop: "{{ lan_bridge_retired_tcp_ports }}"

# The account may make and change files here, but not change the directory
# itself, the script or the port list (tnwks_win_dir_acl). The sync task
# takes from the file only an address of the WSL VM.
- name: Directory of the address file
  tnwks_win_dir_acl:
    path: "{{ lan_bridge_ip_dir }}"
    writer: "{{ lan_bridge_writers }}"
  when: wsl_start_unelevated | bool

# The move of the distro (wsl_move_phase): while it runs, the enabled state
# of each address task is the window's (keep_task_enabled_state), and once
# it is done the play leaves the task of the present account as the window
# left it.
- name: The move of the distro needs the start with no elevation
  ansible.builtin.assert:
    that: wsl_move_phase == 'off' or wsl_start_unelevated | bool
    fail_msg: The tasks of the account that owns the distro run with no elevation, so wsl_move needs wsl_start_unelevated.
    quiet: true

- name: Address task (desktop user, no elevation)
  tnwks_win_scheduled_task:
    name: "{{ lan_bridge_ip_task }}"
    xml: "{{ lookup('ansible.builtin.template', 'lan-bridge-ip.xml.j2') }}"
    keep_task_enabled_state: "{{ wsl_move_phase == 'move' }}"
  when: wsl_start_unelevated | bool and wsl_move_phase != 'done'
  notify: Run the LAN bridge sync

# The copy for the account that owns the distro, registered as SYSTEM, which
# sets a new random password on that account (s4u_user). While the move
# runs, a new copy is disabled, and the window enables it. Once it is done,
# the play keeps it enabled.
- name: Address task of the account that owns the distro
  tnwks_win_scheduled_task:
    name: "{{ lan_bridge_ip_task_account }}"
    xml: >-
      {{ lookup('ansible.builtin.template', 'lan-bridge-ip.xml.j2')
         | regex_replace('<Settings>', '<Settings><Enabled>false</Enabled>' if wsl_move_phase == 'move' else '<Settings>', count=1) }}
    s4u_user: "{{ wsl_move_new_account }}"
    s4u_description: "{{ wsl_move_new_description }}"
    keep_task_enabled_state: "{{ wsl_move_phase == 'move' }}"
  vars:
    lan_bridge_user: "{{ wsl_move_new_account }}"
    ansible_become: true
    ansible_become_method: ansible.builtin.runas
    ansible_become_user: SYSTEM
  when: wsl_move_phase != 'off'
  no_log: true
  notify: Run the LAN bridge sync

- name: No address task while the sync task is elevated
  tnwks_win_scheduled_task:
    name: "{{ lan_bridge_ip_task }}"
    state: absent
  when: not (wsl_start_unelevated | bool)

- name: Sync task (desktop user elevated, or SYSTEM with no wsl.exe)
  tnwks_win_scheduled_task:
    name: "{{ lan_bridge_task }}"
    xml: "{{ lookup('ansible.builtin.template', 'lan-bridge-sync.xml.j2') }}"
  notify: Run the LAN bridge sync
