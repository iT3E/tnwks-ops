---
- name: Require approval for the selected Windows host
  ansible.builtin.assert:
    that:
      - wazuh_rollout_host | default('') == inventory_hostname
      - ansible_play_hosts_all == [inventory_hostname]
      - windows_wazuh_agent_group == 'windows-host'
      - wazuh_agent_state | default('present') in ['present', 'absent']
      - >-
        wazuh_agent_state | default('present') == 'absent'
        or wazuh_agent_name | default('') is match('^[A-Za-z0-9][A-Za-z0-9_.-]{0,62}$')
    quiet: true

- name: Read the Windows agent service state
  ansible.windows.win_service_info:
    name: WazuhSvc
  register: windows_wazuh_service

- name: Check the Windows agent's verified package record
  ansible.windows.win_stat:
    path: '{{ windows_wazuh_agent_dir }}\tnwks-package.sha256'
    checksum_algorithm: sha256
  register: windows_wazuh_package_record

- name: Refuse an existing Windows agent without the current package record
  ansible.builtin.assert:
    that: >-
      windows_wazuh_package_record.stat.checksum | default('') ==
      ((windows_wazuh_agent_package_sha256 ~ '\n') | hash('sha256'))
    fail_msg: An existing Wazuh installation needs a reviewed upgrade or recovery before running this role.
    quiet: true
  when: windows_wazuh_service.exists or windows_wazuh_package_record.stat.exists

- name: Remove the verified Windows agent
  ansible.windows.win_package:
    product_id: "{2DADA9B4-C6FF-4B30-82B4-1E0154289EA2}"
    provider: msi
    state: absent
  when: wazuh_agent_state | default('present') == 'absent'

- name: Install or verify the selected agent
  ansible.builtin.include_tasks: present.yml
  when: wazuh_agent_state | default('present') == 'present'
