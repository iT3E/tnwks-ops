---
# wsl_host_check: the host check of the security platform in the WSL distro
# (security/README.md, "The host check"). A timer runs
# /usr/local/bin/tnwks-host-check every 6 hours, as wsl_distro_user. It
# simulates an upgrade with apt-get and writes a JSON document into the inbox
# that role windows_host_check makes for the distro. The relay of that role,
# as SYSTEM each hour, writes the .prom file of the distro that the Windows
# host's windows_exporter reads (Design Doc 0004, section 5.9).
#
# present: installs and starts the check. absent: stops it and removes its
# units, its script, its state and its document.
wsl_host_check_state: present

wsl_host_check_name: tnwks-host-check

# The distro's path of the inbox host_check_inbox_dir of role
# windows_host_check.
wsl_host_check_inbox_dir: /mnt/c/ProgramData/tnwks-host-check-distro
# The write test (Design Doc 0004, section 5.9): the distro's path of the
# textfile directory of the host, host_check_textfile_dir of role
# windows_host_check. Each run of the check and the last task of this role try
# to make a file there. Only a refusal by Windows is the pass; any other
# answer is the failed query textfile-write, and the run gives no result.
wsl_host_check_write_test_dir: /mnt/c/Program Files/windows_exporter/textfile_inputs
# Whether the answer of the last task of the role can fail the play: on where
# the Windows host of the distro starts WSL with no elevation
# (wsl_start_unelevated, group_vars/windows_hosts.yml), and only there (section
# 5.9 of the design). Between the apply of that switch and the next start of
# the distro, the distro still has the access of its elevated start, so the
# play fails here until the distro is started again.
wsl_host_check_write_test_fails_play: "{{ hostvars[wsl_distro_windows_host].wsl_start_unelevated | default(false) | bool }}"
# The name of the document in the inbox: host_check_inbox_file of role
# windows_host_check.
wsl_host_check_file: tnwks_security_host_check_distro.json

# An upgrade fails the check when it has waited longer than this, the same
# limit as the Windows hosts.
wsl_host_check_updates_max_age_days: 14
# Older package lists give no result.
wsl_host_check_lists_max_age_hours: 72
