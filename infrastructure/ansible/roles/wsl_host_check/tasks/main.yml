---
- name: The host check is in place
  when: wsl_host_check_state == 'present'
  block:
    - name: Host check script
      ansible.builtin.copy:
        src: tnwks-host-check.py
        dest: /usr/local/bin/{{ wsl_host_check_name }}
        owner: root
        group: root
        mode: "0755"
      notify: Run the host check

    - name: Host check service
      ansible.builtin.template:
        src: tnwks-host-check.service.j2
        dest: /etc/systemd/system/{{ wsl_host_check_name }}.service
        owner: root
        group: root
        mode: "0644"
      notify: [Reload systemd, Run the host check]

    - name: Host check timer
      ansible.builtin.copy:
        src: tnwks-host-check.timer
        dest: /etc/systemd/system/{{ wsl_host_check_name }}.timer
        owner: root
        group: root
        mode: "0644"
      register: wsl_host_check_timer_file
      notify: Reload systemd

    - name: Flush the systemd reload before enabling the timer
      ansible.builtin.meta: flush_handlers

    - name: Host check timer is enabled and running
      ansible.builtin.systemd:
        name: "{{ wsl_host_check_name }}.timer"
        enabled: true
        state: started
      # A check run doesn't write a new timer's unit, so systemd can't find it yet.
      when: not (ansible_check_mode and wsl_host_check_timer_file is changed)

    # The write test, last (Design Doc 0004, section 5.9): the effective right,
    # not the entry. One try as root and one as the distro user to make a file
    # in the textfile directory of the host; each prints its uid and its
    # answer, and its exit code is the answer: 0 refused by Windows, 1 the
    # write succeeded, 2 refused by Linux before Windows (no evidence), 3 not
    # done. The script removes a file that it made. A check run skips it,
    # because it would write to the host.
    - name: Write test of the textfile directory
      ansible.builtin.command:
        argv:
          - /usr/local/bin/{{ wsl_host_check_name }}
          - --system
          - "{{ inventory_hostname }}"
          - --write-test-dir
          - "{{ wsl_host_check_write_test_dir }}"
          - --write-test-only
      become: true
      become_user: "{{ item }}"
      loop: [root, "{{ wsl_distro_user }}"]
      register: wsl_host_check_write_test
      changed_when: false
      failed_when: false

    # A fail: root got no refusal by Windows, or a try wrote, or a try could
    # not be done. Only with the switch on (defaults).
    - name: The write test gets a refusal as root and as the distro user
      ansible.builtin.debug:
        msg: "{{ wsl_host_check_write_test.results | map(attribute='stdout') | list }}"
      failed_when: >-
        wsl_host_check_write_test_fails_play | bool
        and ((wsl_host_check_write_test.results | selectattr('item', 'equalto', 'root') | map(attribute='rc') | first) != 0
             or (wsl_host_check_write_test.results | map(attribute='rc') | select('in', [1, 3]) | list | length > 0))
      when: not ansible_check_mode

# The way back: the timer stops first, so no run starts while the files go.
- name: The host check is gone
  when: wsl_host_check_state == 'absent'
  block:
    - name: Host check timer is stopped and disabled
      ansible.builtin.systemd:
        name: "{{ wsl_host_check_name }}.timer"
        enabled: false
        state: stopped
      failed_when: false

    - name: Host check units, script, state and document are gone
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/{{ wsl_host_check_name }}.timer
        - /etc/systemd/system/{{ wsl_host_check_name }}.service
        - /usr/local/bin/{{ wsl_host_check_name }}
        - /var/lib/{{ wsl_host_check_name }}
        - "{{ wsl_host_check_inbox_dir }}/{{ wsl_host_check_file }}"
      register: wsl_host_check_removed

    - name: Reload systemd after removing the units
      ansible.builtin.systemd:
        daemon_reload: true
      when: wsl_host_check_removed is changed  # noqa: no-handler
