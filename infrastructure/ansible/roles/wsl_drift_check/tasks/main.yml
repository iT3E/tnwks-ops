---
- name: Check for the old timer
  ansible.builtin.stat:
    path: /etc/systemd/system/{{ wsl_drift_check_name }}.timer
  register: wsl_drift_check_timer

- name: Old timer is stopped and disabled
  ansible.builtin.systemd:
    name: "{{ wsl_drift_check_name }}.timer"
    enabled: false
    state: stopped
  when: wsl_drift_check_timer.stat.exists

- name: Old timer, service and script are gone
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/{{ wsl_drift_check_name }}.timer
    - /etc/systemd/system/{{ wsl_drift_check_name }}.service
    - /usr/local/bin/{{ wsl_drift_check_name }}
  register: wsl_drift_check_removed

- name: Reload systemd after removing the units
  ansible.builtin.systemd:
    daemon_reload: true
  when: wsl_drift_check_removed is changed  # noqa: no-handler
