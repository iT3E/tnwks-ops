---
- name: Drift check script
  ansible.builtin.copy:
    src: "{{ wsl_drift_check_name }}.sh"
    dest: /usr/local/bin/{{ wsl_drift_check_name }}
    owner: root
    group: root
    mode: "0755"

- name: Drift check service
  ansible.builtin.template:
    src: "{{ wsl_drift_check_name }}.service.j2"
    dest: /etc/systemd/system/{{ wsl_drift_check_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Drift check timer
  ansible.builtin.copy:
    src: "{{ wsl_drift_check_name }}.timer"
    dest: /etc/systemd/system/{{ wsl_drift_check_name }}.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush the systemd reload before enabling the timer
  ansible.builtin.meta: flush_handlers

- name: Timer is enabled and running
  ansible.builtin.systemd:
    name: "{{ wsl_drift_check_name }}.timer"
    enabled: true
    state: started
