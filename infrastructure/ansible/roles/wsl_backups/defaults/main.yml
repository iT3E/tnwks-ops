---
# wsl_backups: the WSL distro's daily copies of the backups nothing else takes
# off the desktop's disk, to the Google Drive for desktop folder (G:)
# (docs/operations/backups.md):
#
#   tnwks-gdrive-sync.timer   02:30  what's new on nfs-server's /gdrive-sync
#                                    export (the UniFi .unf, written there by
#                                    the cluster that runs the controller) into
#                                    G:\My Drive\Backup\nfs-gdrive-sync
#   tnwks-aruba-backup.timer  02:45  the Aruba SW03 running-config, when it
#                                    changed; credentials in /etc/tnwks/aruba.env
#
# tnwks-aruba-backup runs as wsl_distro_user (its G: mount);
# tnwks-gdrive-sync as root inside its own mount namespace (its service unit).

wsl_backups_timers:
  - tnwks-gdrive-sync
  - tnwks-aruba-backup

# The switch credentials, decrypted on the controller.
wsl_backups_aruba_secrets: "{{ tnwks_repo_root }}/infrastructure/aruba/secrets.sops.yaml"
wsl_backups_aruba_env: /etc/tnwks/aruba.env

# Units this role used to install, stopped and removed.
wsl_backups_retired:
  - tnwks-unifi-backup
