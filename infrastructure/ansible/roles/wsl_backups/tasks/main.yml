---
# ArubaOS 7.4 only takes password logins, which ssh does through sshpass.
# nfs-common: tnwks-gdrive-sync's NFSv4 client. From the existing package
# lists: refreshing them fails on these hosts.
- name: Install sshpass and the NFS client
  ansible.builtin.apt:
    name: [sshpass, nfs-common]
    state: present
    install_recommends: false

# NFSv4 needs no rpcbind; keep it from listening on 111.
- name: No rpcbind
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop: [rpcbind.service, rpcbind.socket]
  failed_when: false

- name: Retired backup timers
  ansible.builtin.systemd:
    name: "{{ item }}.timer"
    state: stopped
    enabled: false
  loop: "{{ wsl_backups_retired }}"
  failed_when: false

- name: Retired backup units
  ansible.builtin.file:
    path: /etc/systemd/system/{{ item.0 }}.{{ item.1 }}
    state: absent
  loop: "{{ wsl_backups_retired | product(['timer', 'service']) | list }}"
  notify: Reload systemd

- name: Retired backup scripts
  ansible.builtin.file:
    path: /usr/local/bin/{{ item }}
    state: absent
  loop: "{{ wsl_backups_retired }}"

- name: Backup scripts
  ansible.builtin.copy:
    src: "{{ item }}.sh"
    dest: /usr/local/bin/{{ item }}
    owner: root
    group: root
    mode: "0755"
  loop: "{{ wsl_backups_timers }}"

- name: Backup services
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: /etc/systemd/system/{{ item }}.service
    owner: root
    group: root
    mode: "0644"
  loop: "{{ wsl_backups_timers }}"
  notify: Reload systemd

- name: Backup timers
  ansible.builtin.copy:
    src: "{{ item }}.timer"
    dest: /etc/systemd/system/{{ item }}.timer
    owner: root
    group: root
    mode: "0644"
  loop: "{{ wsl_backups_timers }}"
  register: wsl_backups_timer_files
  notify: Reload systemd

- name: Directory for the switch credentials
  ansible.builtin.file:
    path: "{{ wsl_backups_aruba_env | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Sourced by the script: ARUBA_PASSWORD is always single-quoted (as jq's @sh
# did when a task wrote this file).
- name: Switch credentials
  ansible.builtin.copy:
    content: |
      ARUBA_HOST={{ wsl_backups_aruba.aruba_host }}
      ARUBA_USER={{ wsl_backups_aruba.aruba_user }}
      ARUBA_PASSWORD='{{ wsl_backups_aruba.aruba_password | replace("'", "'\\''") }}'
    dest: "{{ wsl_backups_aruba_env }}"
    owner: "{{ wsl_distro_user }}"
    group: root
    mode: "0600"
  vars:
    wsl_backups_aruba: "{{ lookup('community.sops.sops', wsl_backups_aruba_secrets) | from_yaml }}"
  no_log: true
  # CI has no key for the Aruba secrets (.sops.yaml), so the runner skips this
  # one task (--skip-tags aruba-credentials).
  tags: [aruba-credentials]

- name: Flush the systemd reload before enabling the timers
  ansible.builtin.meta: flush_handlers

- name: Timers are enabled and running
  ansible.builtin.systemd:
    name: "{{ item }}.timer"
    enabled: true
    state: started
  loop: "{{ wsl_backups_timers }}"
  # A check run doesn't write a new timer's unit, so systemd can't find it yet.
  when: >-
    not (ansible_check_mode and
    (wsl_backups_timer_files.results | selectattr('item', 'equalto', item) | map(attribute='changed') | first))
