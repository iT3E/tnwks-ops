---
# windows_wsl_maintenance: two host tasks that keep WSL itself in shape.
#
#   tnwks-wsl-watchdog  every 5 min and at boot: WSL service up, Ubuntu running,
#                       the OpenClaw gateway unit active, the Z-Stick attached;
#                       restarts worker-2 after a cold start of the distro.
#   tnwks-vhdx-compact  on demand: offline compaction of the WSL vhdx on E:
#                       (stops WSL and the cluster; homelab-windows-host notes).
#
# Both run as the desktop user (S4U): WSL distros are per-user. Elevated,
# unless wsl_start_unelevated (group_vars/windows_hosts.yml) is on: then the
# watchdog and the keepalive run with no elevation, tnwks-wsl-service (SYSTEM)
# repairs the WSL service, and the compaction, which stays elevated for
# diskpart, does not start the distro itself.

wsl_maintenance_user: "{{ windows_desktop_user }}"

wsl_watchdog_dir: 'C:\ProgramData\tnwks-watchdog'
wsl_watchdog_task: tnwks-wsl-watchdog
# With wsl_start_unelevated: the log of the watchdog, which the account may
# change (the scripts stay where it may not), and the SYSTEM task that does
# the part of the watchdog that needs admin rights, with no wsl.exe.
wsl_watchdog_log_dir: '{{ wsl_watchdog_dir }}\log'
wsl_service_task: tnwks-wsl-service
# The log of that SYSTEM task: only SYSTEM and the Administrators may change it.
wsl_service_log_dir: '{{ wsl_watchdog_dir }}\service-log'
# Extra arguments for Watch-TnwksWsl.ps1: `-SkipGateway -SkipUsb` on a host
# without the OpenClaw gateway or the Z-Stick.
wsl_watchdog_args: ""
# The arguments of one watchdog task: wsl_watchdog_args, and for the copy of
# the account that owns the distro, wsl_watchdog_args_account.
wsl_watchdog_task_args: "{{ wsl_watchdog_args }}"
# tnwks-wsl-keepalive: one long-running wsl.exe client, so WSL doesn't stop
# the distro for lack of one. Per host (WSL-02); pair it with the watchdog's
# `-KeepAliveTask tnwks-wsl-keepalive`, which restarts it after a WSL restart.
wsl_keepalive_enabled: false
wsl_keepalive_task: tnwks-wsl-keepalive
wsl_keepalive_distro: Ubuntu
vhdx_compact_dir: 'C:\ProgramData\tnwks-vhdx-compact'
vhdx_compact_task: tnwks-vhdx-compact
# The distro's ext4.vhdx; empty = the script's default (E:\WSL\Ubuntu, on
# DESKTOP-HKE05KI).
vhdx_compact_vhdx: ""

# The move of the distro (group_vars/windows_hosts.yml, wsl_move_phase). The
# accounts that may write to the log of the watchdog: the desktop user, both
# accounts while the move runs, and the account that owns the distro once it
# is done.
wsl_maintenance_writers: >-
  {{ [wsl_maintenance_user] if wsl_move_phase == 'off'
     else ([wsl_maintenance_user, wsl_move_new_account] if wsl_move_phase == 'move' else [wsl_move_new_account]) }}
# The copies of the watchdog and the keepalive for the account that owns the
# distro. The copy of the watchdog names the copy of the keepalive.
wsl_watchdog_task_account: "{{ wsl_watchdog_task }}{{ wsl_move_task_suffix }}"
wsl_keepalive_task_account: "{{ wsl_keepalive_task }}{{ wsl_move_task_suffix }}"
wsl_watchdog_args_account: >-
  {{ wsl_watchdog_args | regex_replace('(-KeepAliveTask\s+)' ~ (wsl_keepalive_task | regex_escape) ~ '(?=\s|$)',
     '\g<1>' ~ wsl_keepalive_task_account) }}
# The keepalive that the WSL service task (SYSTEM) starts: the copy, once the
# move is done.
wsl_service_keepalive_task: "{{ wsl_keepalive_task_account if wsl_move_phase == 'done' else wsl_keepalive_task }}"

# Superseded by this role (registration and verification one-offs, their
# output, old backups); removed.
wsl_maintenance_leftovers:
  - '{{ wsl_watchdog_dir }}\Register-Watchdog.ps1'
  - '{{ wsl_watchdog_dir }}\Verify-Watchdog.ps1'
  - '{{ wsl_watchdog_dir }}\Disable-OldTask.ps1'
  - '{{ wsl_watchdog_dir }}\reg-out.txt'
  - '{{ wsl_watchdog_dir }}\verify-out.txt'
  - '{{ wsl_watchdog_dir }}\dis-out.txt'
  - '{{ vhdx_compact_dir }}\Register-CompactTask.ps1'
  - '{{ vhdx_compact_dir }}\Compact-WslVhdx.ps1.bak-20261031'
