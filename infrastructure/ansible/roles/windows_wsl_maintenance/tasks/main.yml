---
# Only SYSTEM and the Administrators may make or change files here, and
# Users may read (tnwks_win_dir_acl, no writer). The folder inherits nothing
# from C:\ProgramData, which lets each user make files. Each item in it takes
# the owner Administrators and the rules of the folder, at each run.
- name: Directories
  tnwks_win_dir_acl:
    path: "{{ item.path }}"
    items: reset
    keep: "{{ item.keep }}"
  loop:
    # The two log directories have their own rules (below).
    - { path: "{{ wsl_watchdog_dir }}", keep: ["{{ wsl_watchdog_log_dir }}", "{{ wsl_service_log_dir }}"] }
    - { path: "{{ vhdx_compact_dir }}", keep: [] }
  loop_control:
    label: "{{ item.path }}"

# Both tasks start their script fresh on every run.
- name: Scripts
  ansible.windows.win_copy:
    src: "{{ item.src }}"
    dest: '{{ item.dir }}\{{ item.src }}'
  loop:
    - { src: Watch-TnwksWsl.ps1, dir: "{{ wsl_watchdog_dir }}" }
    - { src: Compact-WslVhdx.ps1, dir: "{{ vhdx_compact_dir }}" }
  loop_control:
    label: "{{ item.src }}"

# With no elevation, the watchdog can not change a log that an elevated run
# made, so it logs to a directory of its own, where the account may make and
# change files but not change the directory itself (tnwks_win_dir_acl). The
# SYSTEM task logs to a directory that only SYSTEM and the Administrators may
# change.
- name: Log directories of the watchdog and the WSL service task
  tnwks_win_dir_acl:
    path: "{{ item.path }}"
    writer: "{{ item.writer }}"
  loop:
    - { path: "{{ wsl_watchdog_log_dir }}", writer: "{{ wsl_maintenance_user }}" }
    - { path: "{{ wsl_service_log_dir }}", writer: "" }
  loop_control:
    label: "{{ item.path }}"
  when: wsl_start_unelevated | bool

- name: Watchdog task (every 5 min and at boot)
  tnwks_win_scheduled_task:
    name: "{{ wsl_watchdog_task }}"
    xml: "{{ lookup('ansible.builtin.template', 'wsl-watchdog.xml.j2') }}"

# The part of the watchdog that needs admin rights, as SYSTEM. SYSTEM's
# wsl.exe can not see the distro of the user, and the script runs no wsl.exe
# with -ServiceOnly, so this task starts no process in the distro.
- name: WSL service task (SYSTEM, every 5 min and at boot)
  tnwks_win_scheduled_task:
    name: "{{ wsl_service_task }}"
    xml: "{{ lookup('ansible.builtin.template', 'wsl-service.xml.j2') }}"
  when: wsl_start_unelevated | bool

- name: No WSL service task while the watchdog is elevated
  tnwks_win_scheduled_task:
    name: "{{ wsl_service_task }}"
    state: absent
  when: not (wsl_start_unelevated | bool)

# WSL stops a distro soon after its last wsl.exe client exits, Docker and the
# Talos nodes inside or not. DESKTOP-HKE05KI always has one (the UDP relays,
# the OpenClaw gateway, interactive use); a host without them needs this.
# running: an apply starts it when it is not running, also after a register
# of a changed task. A task that a run of the compaction or the start step
# paused (disabled) is registered again, so enabled, and then started: do
# not apply during either (docs/wsl/windows-ansible.md).
- name: Keepalive task (one wsl.exe client from boot)
  tnwks_win_scheduled_task:
    name: "{{ wsl_keepalive_task }}"
    xml: "{{ lookup('ansible.builtin.template', 'wsl-keepalive.xml.j2') }}"
    running: true
  when: wsl_keepalive_enabled | bool

- name: vhdx compaction task (on demand)
  tnwks_win_scheduled_task:
    name: "{{ vhdx_compact_task }}"
    xml: "{{ lookup('ansible.builtin.template', 'vhdx-compact.xml.j2') }}"

- name: Superseded files are gone
  ansible.windows.win_file:
    path: "{{ item }}"
    state: absent
  loop: "{{ wsl_maintenance_leftovers }}"
