---
# Phase after-boot, after the first restart: the boot task ran the way back
# once (its log, mode boot, and the markers boot-run then wayback-done), A
# owns the distro again and B lists none. Then the boot task is started by
# hand: with the marker of a done way back last, it does nothing.
#
# The boot run of the group test (-e wsl_move_rehearsal_boot_group_steps=true,
# as given to the phase interrupt): the boot run's request has the group steps
# and the group test, its log has A's join, the stop of A and the leave, in
# that order, and the boot request is spent. Then, as in the phase wayback: A
# holds its own batch right, the play removes an icon of the shortcut in A's
# folder that A does not own (the import back ran with A in Administrators),
# reads that the count of the VM processes is that of the baseline, starts
# A's start task (the procedure leaves it to the play in the group test), and
# reads the token of
# each WSL process of A: none has the Administrators group enabled. The
# groups at the end read A in Users only.

- name: The live parts at the start
  ansible.builtin.include_tasks: live.yml

- name: The groups at the start
  ansible.builtin.include_tasks: groups.yml

# The SIDs of the accounts (wsl_move_rehearsal_sids), for the read of A's
# disk file after the boot. Only a refresh of the copies reads them too.
- name: Read the accounts of the rehearsal
  ansible.builtin.include_tasks: read_accounts.yml

# The reads run with the copies that the boot run used: a copy that differs
# from the role's stops the phase.
- name: The copies of the scripts, the configs and the tasks on the host (assert)
  ansible.builtin.include_tasks: host_files.yml
  vars:
    wsl_move_rehearsal_host_files: assert

- name: The case of the boot run
  ansible.builtin.set_fact:
    wsl_move_rehearsal_boot_group: "{{ wsl_move_rehearsal_boot_group_steps | default(false) | bool }}"

- name: The reads after the boot
  when: not ansible_check_mode
  block:
    - name: Read the log of the boot runs and the markers
      ansible.windows.win_powershell:
        parameters:
          Log: "{{ wsl_move_rehearsal_log_file }}"
          State: "{{ wsl_move_rehearsal_state_file }}"
          BootRequest: "{{ wsl_move_rehearsal_boot_request_file }}"
        # The runs are lists of lines: win_powershell keeps two levels of
        # output by default, and would give each run as one text.
        depth: 4
        script: &read_boot |
          param([string]$Log, [string]$State, [string]$BootRequest)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          # The runs of the boot task at this boot: an earlier boot of the host
          # may have run it too.
          $since = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime.ToUniversalTime()
          $boot = @(Get-Content -LiteralPath $Log | Where-Object {
              # A line that goes on from the line before has no time: it is not read.
              $f = $_ -split ' ', 3; $when = [DateTime]::MinValue
              $f.Count -eq 3 -and $f[1] -eq 'boot' -and [DateTime]::TryParse($f[0], [Globalization.CultureInfo]::InvariantCulture,
                  [Globalization.DateTimeStyles]::RoundtripKind, [ref]$when) -and $when.ToUniversalTime() -gt $since } |
              ForEach-Object { "$(($_ -split ' ', 3)[2])" })
          # The runs of the boot task: each starts with "start, request".
          $runs = @()
          foreach ($line in $boot) {
              if ($line -like 'start, request:*') { $runs += , @() }
              if ($runs.Count) { $runs[-1] += $line }
          }
          # The request of the first run of this boot, as its first line logs it.
          $first = if ($runs.Count) { "$($runs[0][0])" } else { '' }
          $request = if ($first -like 'start, request: *') { $first.Substring(16) | ConvertFrom-Json } else { $null }
          [pscustomobject]@{
              request = $request
              boot_request = [bool](Test-Path -LiteralPath $BootRequest)
              runs = @($runs | ForEach-Object { , @($_) })
              results = @($runs | ForEach-Object { @($_ | Where-Object { $_ -like 'result: *' }) -join ',' })
              markers = @(Get-Content -LiteralPath $State | Where-Object { $_.Trim() } | ForEach-Object { "$(($_ -split ' ', 2)[1])".Trim() })
          }
      vars:
        ansible_become: true
        ansible_become_method: ansible.builtin.runas
        ansible_become_user: SYSTEM
      register: wsl_move_rehearsal_boot_log

    # The run of the boot task first: after a run that did not end the way
    # back, the phase stops here, before any task of A or B starts.
    # The case of the run (the group test, or none) is that of the switch:
    # its request, its group moments, and who starts A's start task.
    - name: The boot task ran the way back once
      vars:
        boot: "{{ wsl_move_rehearsal_boot_log.output | last }}"
        group: "{{ wsl_move_rehearsal_boot_group }}"
      ansible.builtin.assert:
        that:
          - "boot.results[:1] == ['result: done']"
          - boot.markers[-3:] == ['window-started', 'boot-run', 'wayback-done']
          - boot.request is mapping
          - boot.request.group_steps == group and boot.request.rehearsal_group_test == group
          - >-
            boot.runs[0] | select('string') | select('match', '^group: ') | list
            == (boot.runs[0] | select('string') | select('match', '^group: \\S+ (joined|left) Administrators$') | list)
          - >-
            boot.runs[0] | select('string') | select('match', '^group: ') | map('regex_replace', '^group: \\S+ (\\w+) Administrators$', '\\1')
            | list == (['joined', 'left'] if group else [])
          - >-
            boot.runs[0] | select('string') | select('match', '^no WSL process of .* before it leaves the group$') | list | length
            == (1 if group else 0)
          # In order: the join, the stop of A, then the leave.
          - >-
            boot.runs[0] | select('string')
            | select('match', '^(group: \\S+ (joined|left) Administrators|no WSL process of \\S+ before it leaves the group)$')
            | map('regex_replace', '^group: \\S+ (\\w+) Administrators$', '\\1')
            | map('regex_replace', '^no WSL process of .*$', 'stopped') | list
            == (['joined', 'stopped', 'left'] if group else [])
          - >-
            boot.runs[0] | select('string') | select('match', '^the start tasks of .* are left to the play') | list | length
            == (1 if group else 0)
          - >-
            boot.runs[0] | select('string') | select('match', '^the start tasks of .* run, with [0-9]+ WSL process') | list | length
            == (0 if group else 1)
          - boot.runs[0] | select('string') | select('match', '^would restart') | list | length == 1
          - "boot.runs[0] | select('string') | select('match', '^restart: ') | list | length == 0"
          - not boot.boot_request
        fail_msg: "The run of the boot task did not end the way back: {{ boot }}. No task of A or B started in this phase."
        quiet: true

    # A keeps its own batch right through the phase interrupt and the boot
    # run (the removal runs A's tasks with it). A read: a check of the module.
    - name: A holds its own batch right after the boot
      ansible.windows.win_user_right:
        name: SeBatchLogonRight
        users: ["{{ wsl_move_rehearsal_sids.a }}"]
        action: add
      check_mode: true
      register: wsl_move_rehearsal_boot_batch
      failed_when: wsl_move_rehearsal_boot_batch.changed or wsl_move_rehearsal_boot_batch.failed | default(false)

    - name: The group test of the boot run, the reads after it
      when: wsl_move_rehearsal_boot_group
      block:
        # The import back ran with A in Administrators: an icon that it made
        # then can be the group's (icon.yml says why).
        - name: The icon in the folder of A, after A left the group
          ansible.builtin.include_tasks: icon.yml
          vars:
            wsl_move_rehearsal_icon_action: remove

        # The import back ran with A in Administrators and started A's VM; the
        # procedure ran A's stop task before A left the group. A VM process
        # shows no account, so the wait for no WSL process of A and the read
        # of the tokens can not see it, and a new wsl.exe of A would join it.
        # The VM processes are those of the baseline: after the restart (the
        # baseline is marked), by their count. The script is that of the
        # phase wayback.
        - name: No VM of the rehearsal before the start task of A
          ansible.windows.win_powershell:
            parameters:
              Path: "{{ wsl_move_rehearsal_baseline_file }}"
            script: |
              param([string]$Path)
              $ErrorActionPreference = 'Stop'
              $Ansible.Changed = $false
              $read = Get-Content -LiteralPath $Path -Raw | ConvertFrom-Json
              # win_powershell keeps two levels of the output of the live read, so
              # the baseline holds each VM process as text, "@{id=..; name=..;
              # created=..}". An object (a deeper read) is taken too.
              $base = @(@($read.vm) | Where-Object { $_ } | ForEach-Object {
                  if ($_ -is [string]) {
                      if ($_ -match '\bid=(\d+);.*\bcreated=([^;}]+)') { "$($Matches[1]) $($Matches[2].Trim())" } else { "unread: $_" }
                  } else { "$($_.id) $($_.created)" } } | Sort-Object)
              $by = if ($read.restarted) { 'count' } else { 'process ID and start time' }
              $deadline = (Get-Date).AddMinutes(2)
              do {
                  $now = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -like 'vmmem*' } | ForEach-Object {
                      "$([int]$_.ProcessId) $(if ($_.CreationDate) { $_.CreationDate.ToUniversalTime().ToString('o') })" } | Sort-Object)
                  $same = if ($read.restarted) { $now.Count -eq $base.Count } else { ($now -join ' | ') -eq ($base -join ' | ') }
                  if (-not $same) { Start-Sleep -Seconds 3 }
              } while (-not $same -and (Get-Date) -lt $deadline)
              [pscustomobject]@{ baseline = $base; now = $now; by = $by; same = $same }
          register: wsl_move_rehearsal_vm_count
          failed_when: not (wsl_move_rehearsal_vm_count.output | last).same

        # The procedure leaves the start of A to the play in the group test.
        - name: The start task of A, started by the play
          ansible.windows.win_powershell:
            parameters:
              Task: "{{ wsl_move_rehearsal_prefix }}-a-start"
              Sid: "{{ wsl_move_rehearsal_sids.a }}"
            script: |
              param([string]$Task, [string]$Sid)
              $ErrorActionPreference = 'Stop'
              $Ansible.Changed = $true
              Start-ScheduledTask -TaskName $Task
              $deadline = (Get-Date).AddMinutes(3)
              do {
                  Start-Sleep -Seconds 3
                  $running = "$((Get-ScheduledTask -TaskName $Task).State)" -eq 'Running'
                  $wsl = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -in @('wsl.exe', 'wslhost.exe', 'wslrelay.exe') } | Where-Object {
                      $o = Invoke-CimMethod -InputObject $_ -MethodName GetOwnerSid -ErrorAction SilentlyContinue; $o -and $o.Sid -eq $Sid })
              } while (-not ($running -and $wsl.Count) -and (Get-Date) -lt $deadline)
              [pscustomobject]@{ running = $running; wsl = $wsl.Count }
          vars:
            ansible_become: true
            ansible_become_method: ansible.builtin.runas
            ansible_become_user: SYSTEM
          register: wsl_move_rehearsal_boot_a_started
          failed_when: >-
            not ((wsl_move_rehearsal_boot_a_started.output | last).running and (wsl_move_rehearsal_boot_a_started.output | last).wsl > 0)

        - name: The tokens of the WSL processes of A
          ansible.builtin.include_tasks: tokens.yml

        - name: No WSL process of A holds a token from its time in Administrators
          vars:
            tokens: "{{ wsl_move_rehearsal_tokens.output | last }}"
          ansible.builtin.assert:
            that:
              - tokens.processes > 0
              - tokens.errors | length == 0
              - tokens.admin_enabled == 0
            fail_msg: "The tokens of the WSL processes of A: {{ tokens }}"
            quiet: true

    - name: A reads its distro after the boot
      ansible.builtin.include_tasks: run_task.yml
      vars:
        wsl_move_rehearsal_run: {key: a, step: check}

    - name: B lists no distro after the boot
      ansible.builtin.include_tasks: run_task.yml
      vars:
        wsl_move_rehearsal_run: {key: b, step: check}

    # The saved owner and rules, and a rule of a VM at most for each start
    # since (a stale one after a restart, too).
    - name: The rules of A's disk file after the boot
      ansible.builtin.include_tasks: read_disk.yml
      vars:
        wsl_move_rehearsal_disk_read: {key: a, rule: saved}

    - name: A owns the distro after the boot, and B lists none
      vars:
        disk_a: "{{ wsl_move_rehearsal_disk.output | last }}"
        check_a: "{{ wsl_move_rehearsal_runs.check[-2] }}"
        check_b: "{{ wsl_move_rehearsal_runs.check[-1] }}"
      ansible.builtin.assert:
        that:
          - check_a.result.registered
          - check_a.result.disk | lower == (wsl_move_rehearsal_accounts.a.folder ~ '\\' ~ wsl_move_rehearsal_disk_name) | lower
          - check_a.result.token == wsl_move_rehearsal_data_token
          - not check_b.result.registered
          - disk_a.saved and disk_a.rules_ok
        fail_msg: "After the boot, a read did not pass: {{ check_a }} {{ check_b }} {{ disk_a }}"
        quiet: true

    - name: Start the boot task by hand, with no marker of a started window
      ansible.windows.win_powershell:
        parameters:
          Runner: '{{ wsl_move_rehearsal_dir }}\Invoke-TnwksStartTask.ps1'
          Task: "{{ wsl_move_rehearsal_boot_task }}"
        script: |
          param([string]$Runner, [string]$Task)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $true
          & $Runner -Task $Task -Minutes 5
      vars:
        ansible_become: true
        ansible_become_method: ansible.builtin.runas
        ansible_become_user: SYSTEM
      register: wsl_move_rehearsal_boot_hand

    - name: Read the log of the boot runs again
      ansible.windows.win_powershell:
        parameters:
          Log: "{{ wsl_move_rehearsal_log_file }}"
          State: "{{ wsl_move_rehearsal_state_file }}"
          BootRequest: "{{ wsl_move_rehearsal_boot_request_file }}"
        depth: 4
        script: *read_boot
      vars:
        ansible_become: true
        ansible_become_method: ansible.builtin.runas
        ansible_become_user: SYSTEM
      register: wsl_move_rehearsal_boot_log2

    - name: The run by hand did nothing, and wrote no marker
      vars:
        before: "{{ wsl_move_rehearsal_boot_log.output | last }}"
        after: "{{ wsl_move_rehearsal_boot_log2.output | last }}"
      ansible.builtin.assert:
        that:
          - (wsl_move_rehearsal_boot_hand.output | last).ran
          - (wsl_move_rehearsal_boot_hand.output | last).code == 0
          - after.markers == before.markers
          - after.runs | length == before.runs | length + 1
          - >-
            after.runs[-1] | select('string') | select('match', "^no action: the last marker is 'wayback-done'") | list | length == 1
        fail_msg: "The boot task by hand: {{ wsl_move_rehearsal_boot_hand.output | last }} {{ after.runs[-1] }}"
        quiet: true

- name: The groups at the end
  ansible.builtin.include_tasks: groups.yml

- name: The live parts at the end
  ansible.builtin.include_tasks: live.yml
