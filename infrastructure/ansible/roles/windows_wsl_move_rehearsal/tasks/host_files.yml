---
# The copies on the host of the scripts and the configs of the rehearsal, and
# its tasks, against the role's. Only setup wrote them before, and setup does
# not run again on a host where the rehearsal runs: a later phase ran the
# copies of an earlier release. Each phase that runs a script on the host
# includes this before its first one, with wsl_move_rehearsal_host_files:
#   refresh  Copy each script and write each config that differs, and
#            register each task whose definition differs (the module changes
#            nothing on a task that is equal). Only when no window is started
#            (the last marker is '' or wayback-done): else it stops, with
#            nothing changed. Then each copy must have the role's SHA-256.
#   assert   Change nothing. A copy that differs stops the phase: a phase in
#            the middle of a window never swaps the procedure under the
#            window that started with it.
#   print    Change nothing, and stop on nothing: print each copy that
#            differs. The removal runs with whatever copies are there.
# The phases: setup, window and interrupt refresh; wayback, restart and
# after-boot assert; remove-before-restart prints. The phase remove runs no
# script.
#
# A refresh registers each task of the accounts whose definition differs.
# The module sets a new random password on the account of such a task
# (s4u_user), as setup does: nothing keeps that password, and a phase reads
# the time of the last password of B after this, so the window's check of no
# new password for B stays its own. A task that a later release adds (as
# strip-rules of B) is registered here too.

- name: Read the last marker before the copies on the host
  ansible.windows.win_powershell:
    parameters:
      State: "{{ wsl_move_rehearsal_state_file }}"
    script: |
      param([string]$State)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      if (-not (Test-Path -LiteralPath $State)) { return '' }
      $lines = @(Get-Content -LiteralPath $State | Where-Object { $_.Trim() })
      if ($lines.Count) { "$(($lines[-1] -split ' ', 2)[1])".Trim() } else { '' }
  check_mode: false
  register: wsl_move_rehearsal_files_marker

- name: A refresh of the copies only when no window is started
  vars:
    last: "{{ wsl_move_rehearsal_files_marker.output | last | default('') }}"
  ansible.builtin.assert:
    that:
      - wsl_move_rehearsal_host_files in ['refresh', 'assert', 'print']
      - wsl_move_rehearsal_host_files != 'refresh' or last in ['', 'wayback-done']
    fail_msg: >-
      The last marker is '{{ last }}': a window started, and this phase does not swap the scripts, the configs or the
      tasks of that window ({{ wsl_move_rehearsal_host_files }}). Nothing is changed.
    quiet: true

- name: The copies of the role, when no window is started
  when: wsl_move_rehearsal_host_files == 'refresh'
  block:
    - name: Read the accounts of the rehearsal, for their tasks
      ansible.builtin.include_tasks: read_accounts.yml

    - name: The scripts of the rehearsal
      ansible.windows.win_copy:
        src: "{{ item }}"
        dest: '{{ wsl_move_rehearsal_dir }}\{{ item }}'
      loop: "{{ wsl_move_rehearsal_scripts }}"

    # The text of each config as its SHA-256 counts it (to_nice_json), as
    # base64: a value that is JSON text would reach the host in another form.
    - name: The configs of the scripts
      ansible.windows.win_powershell:
        parameters:
          Path: '{{ wsl_move_rehearsal_dir }}\{{ item.key }}.json'
          Content: "{{ item.value | to_nice_json | b64encode }}"
        script: |
          [CmdletBinding(SupportsShouldProcess)]
          param([string]$Path, [string]$Content)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          $bytes = [Convert]::FromBase64String($Content)
          if ((Test-Path -LiteralPath $Path) -and
              [Convert]::ToBase64String([IO.File]::ReadAllBytes($Path)) -eq [Convert]::ToBase64String($bytes)) { return }
          $Ansible.Changed = $true
          if ($PSCmdlet.ShouldProcess($Path, 'write the config')) { [IO.File]::WriteAllBytes($Path, $bytes) }
      loop: "{{ wsl_move_rehearsal_configs | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    # An administrator registers an S4U task for a different account only
    # with its password, and the account has none that anything keeps: the
    # module sets a new random password at each registration (s4u_user), as
    # SYSTEM. The start task of B keeps the state that the window gives it
    # (keep_task_enabled_state).
    - name: Tasks of the accounts
      tnwks_win_scheduled_task:
        name: "{{ wsl_move_rehearsal_prefix }}-{{ task.key }}-{{ task.step }}"
        xml: "{{ lookup('ansible.builtin.template', 'account-task.xml.j2') }}"
        s4u_user: "{{ wsl_move_rehearsal_accounts[task.key].name }}"
        s4u_description: "{{ wsl_move_rehearsal_accounts[task.key].description }}"
        keep_task_enabled_state: "{{ task.step == 'start' }}"
      vars:
        ansible_become: true
        ansible_become_method: ansible.builtin.runas
        ansible_become_user: SYSTEM
      loop: "{{ wsl_move_rehearsal_task_list }}"
      loop_control:
        loop_var: task
        label: "{{ task.key }}-{{ task.step }}"
      when: wsl_move_rehearsal_sids | default({}) | length == 2

    - name: The window procedure and the boot task of the way back, tasks of SYSTEM
      tnwks_win_scheduled_task:
        name: "{{ wsl_move_rehearsal_window_task if item == 'window' else wsl_move_rehearsal_boot_task }}"
        xml: "{{ lookup('ansible.builtin.template', 'system-task.xml.j2') }}"
      loop: [window, boot]

- name: Read the SHA-256 of each script and config on the host
  ansible.windows.win_powershell:
    parameters:
      Paths: "{{ wsl_move_rehearsal_file_hashes.keys() | list }}"
    script: |
      param([string[]]$Paths)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $out = @{}
      foreach ($path in $Paths) {
          $out[$path] = if (Test-Path -LiteralPath $path) { (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() } else { 'none' }
      }
      $out
  check_mode: false
  register: wsl_move_rehearsal_host_hashes

- name: Each copy on the host that differs from the role's
  vars:
    have: "{{ wsl_move_rehearsal_host_hashes.output | last | default({}, true) }}"
  ansible.builtin.set_fact:
    wsl_move_rehearsal_files_differ: >-
      {%- set out = [] -%}
      {%- for path, sha in wsl_move_rehearsal_file_hashes.items() -%}
      {%- if (have[path] | default('none')) != sha -%}{%- set _ = out.append(path | win_basename) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: The copies that differ from the role's
  ansible.builtin.debug:
    msg: "{{ wsl_move_rehearsal_files_differ if wsl_move_rehearsal_files_differ | length else 'none' }}"

- name: Each copy on the host is the role's
  ansible.builtin.assert:
    that:
      - wsl_move_rehearsal_files_differ | length == 0
    fail_msg: >-
      The copies {{ wsl_move_rehearsal_files_differ | join(', ') }} on the host are not the role's (SHA-256).
      {{ 'A window started with them, and this phase does not swap them: end that window with the phase that
      it needs, then run the phase window or setup again.' if wsl_move_rehearsal_host_files == 'assert' else '' }}
      Nothing more is changed.
    quiet: true
  when: >-
    wsl_move_rehearsal_host_files == 'assert'
    or (wsl_move_rehearsal_host_files == 'refresh' and not ansible_check_mode)
