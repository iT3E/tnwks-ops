---
# Writes the run request (wsl_move_rehearsal_request), starts the window
# procedure as its own SYSTEM task, waits for its end, and keeps its exit code
# and the lines that it logged in this run (wsl_move_rehearsal_procedure).
# wsl_move_rehearsal_procedure_exit: the exit code that passes (default 0).
# wsl_move_rehearsal_last_marker: the last marker that the phase expects
# before the run; with another one (a phase run twice, or out of order), the
# run does not start.
#
# The wait: the task of the procedure has a limit of 2 hours
# (templates/system-task.xml.j2), and a run that the limit ends skips its
# own end (the group step of the group test). The worst case is about 90
# minutes: each task of an account waits up to task_minutes (10), four in the
# forward window and four in the way back of the group test (in another way
# back three, and the start tasks up to 3), and each of the four waits for no
# WSL process up to 2. The play waits past the limit, so it always sees the
# end of the run.
- name: "The window procedure, mode {{ wsl_move_rehearsal_request.mode }}"
  ansible.windows.win_powershell:
    parameters:
      Task: "{{ wsl_move_rehearsal_window_task }}"
      Request: "{{ wsl_move_rehearsal_request_file }}"
      RequestJson: "{{ wsl_move_rehearsal_request | to_json }}"
      Log: "{{ wsl_move_rehearsal_log_file }}"
      State: "{{ wsl_move_rehearsal_state_file }}"
      LastMarker: "{{ wsl_move_rehearsal_last_marker }}"
    script: |
      param([string]$Task, [string]$Request, [string]$RequestJson, [string]$Log, [string]$State, [string]$LastMarker)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $true
      $lines = @(Get-Content -LiteralPath $State | Where-Object { $_.Trim() })
      $last = if ($lines.Count) { ($lines[-1] -split ' ', 2)[1].Trim() } else { '' }
      if ($last -ne $LastMarker) { throw "The last marker is '$last', not '$LastMarker': the phase runs out of order. Nothing is changed." }
      [IO.File]::WriteAllText($Request, $RequestJson)
      $logStart = @(Get-Content -LiteralPath $Log).Count
      $stateStart = @(Get-Content -LiteralPath $State | Where-Object { $_.Trim() }).Count
      $before = (Get-ScheduledTaskInfo -TaskName $Task).LastRunTime
      Start-ScheduledTask -TaskName $Task
      $deadline = (Get-Date).AddMinutes(125)
      do {
          Start-Sleep -Seconds 5
          $info = Get-ScheduledTaskInfo -TaskName $Task
      } while (((Get-ScheduledTask -TaskName $Task).State -eq 'Running' -or $info.LastRunTime -eq $before) -and (Get-Date) -lt $deadline)
      $lines = @(Get-Content -LiteralPath $Log | Select-Object -Skip $logStart)
      $markers = @(Get-Content -LiteralPath $State | Where-Object { $_.Trim() } | Select-Object -Skip $stateStart |
          ForEach-Object { ($_ -split ' ', 2)[1].Trim() })
      # Each line is "<time> <mode> <text>": the text only, with no time.
      $texts = @($lines | ForEach-Object { ($_ -split ' ', 3)[2] })
      [pscustomobject]@{
          ran = ($info.LastRunTime -ne $before)
          code = [int64]$info.LastTaskResult
          markers = $markers
          groups = @($texts | Where-Object { $_ -match '^group: \S+ (joined|left) Administrators$' } | ForEach-Object { $Matches[1] })
          group_lines = @($lines | Where-Object { $_ -match ' group: ' })
          would_restart = @($texts | Where-Object { $_ -like 'would restart*' }).Count
          result = @($texts | Where-Object { $_ -like 'result: *' } | ForEach-Object { $_.Substring(8) }) -join ','
          log = $texts
      }
  vars:
    ansible_become: true
    ansible_become_method: ansible.builtin.runas
    ansible_become_user: SYSTEM
  register: wsl_move_rehearsal_procedure_run

- name: The run of the procedure
  ansible.builtin.set_fact:
    wsl_move_rehearsal_procedure: "{{ wsl_move_rehearsal_procedure_run.output | last }}"

- name: "The procedure ended as it should (mode {{ wsl_move_rehearsal_request.mode }})"
  ansible.builtin.assert:
    that:
      - wsl_move_rehearsal_procedure.ran
      - wsl_move_rehearsal_procedure.code == (wsl_move_rehearsal_procedure_exit | default(0) | int)
    fail_msg: >-
      The procedure exited {{ wsl_move_rehearsal_procedure.code }} with the result
      '{{ wsl_move_rehearsal_procedure.result }}'. Its log of this run:
      {{ wsl_move_rehearsal_procedure.log | join(' / ') }}. The rehearsal stops: run its removal.
    quiet: true
