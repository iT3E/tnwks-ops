---
# Phase wayback: the way back mode, end to end, after the demotion. First the
# import back task of A can not start: A has no batch right of its own and is
# not in Administrators, as the real present account after window step 7.
# Then the procedure, mode wayback: way back step 1 puts A into
# Administrators (logged), the same import back task runs, and the end of the
# run takes A out (logged) before any task of A starts. Then the play gives
# A its own batch right again (for the interruption test and the removal,
# which run A's tasks with no group step) and starts the start task of A, and
# reads the token of each WSL process of A: none has the Administrators group
# enabled.
#
# Before the way back mode, the stated case of a file that grants SYSTEM
# nothing: B, the owner of its disk file, removes SYSTEM and the
# Administrators from its rules. The way back restores the saved owner and
# rules all the same, and the play reads them after it. The case runs by
# default; -e wsl_move_rehearsal_wayback_strip_case=false leaves it out for
# one run.
#
# The group steps (wsl_move_rehearsal_wayback_group_steps, on by default):
# -e wsl_move_rehearsal_wayback_group_steps=false runs the way back with no
# group step and no group test, as a standard A, as the boot run does. Then
# the check that A's import task can not start is left out, the play gives
# A its own batch right first (A holds it after the phase interrupt), and the
# procedure starts A's start task itself. The phase also ends a started
# window that did not end (the last marker window-started or boot-run, as
# after a boot run that did not end the way back), as the way back mode of
# the procedure does. So before any change, the phase reads that no run of
# the window task or of the boot task goes on, and stops with nothing changed
# when one does: the procedure has no lock, and a second way back must not
# run beside the first.
# The check that A's import task can not start runs only after a done window
# (the phase window took A's batch right), with the group steps on.
#
# The icon of the shortcut in A's folder (icon.yml says why): an icon that A
# made while it was in Administrators can stay the group's, and a standard A
# can not replace it at its import. With the group steps off, the play
# removes such an icon before the way back. With them on, it removes it after
# the run, when A has left the group, so the phases after it (the interrupt
# and its boot run, where a standard A imports back) meet no icon of the
# group.

- name: The live parts at the start
  ansible.builtin.include_tasks: live.yml

- name: The groups at the start
  ansible.builtin.include_tasks: groups.yml

- name: Read the accounts of the rehearsal
  ansible.builtin.include_tasks: read_accounts.yml

# The way back runs with the copies that the window started with, never
# others: a copy that differs from the role's stops the phase.
- name: The copies of the scripts, the configs and the tasks on the host (assert)
  ansible.builtin.include_tasks: host_files.yml
  vars:
    wsl_move_rehearsal_host_files: assert

# No run of the procedure goes on: the procedure has no lock, and the boot
# task and the window task are two tasks. A run that a phase restart left
# going (its wait timed out), or a forward run, must end first. A read only,
# also in a check run, before any change of the phase. A task reads as
# running while its state is Running or Queued, or its last result is
# 0x41301 (the task is running), as the waits of the role read it.
- name: Read the runs of the window task and the boot task
  ansible.windows.win_powershell:
    parameters:
      Tasks:
        - "{{ wsl_move_rehearsal_window_task }}"
        - "{{ wsl_move_rehearsal_boot_task }}"
    script: |
      param([string[]]$Tasks)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $states = @()
      $busy = @()
      foreach ($name in $Tasks) {
          $state = "$((Get-ScheduledTask -TaskName $name).State)"
          $code = [int64](Get-ScheduledTaskInfo -TaskName $name).LastTaskResult
          $states += "$name $state $('0x{0:x}' -f $code)"
          if ($state -in @('Running', 'Queued') -or $code -eq 0x41301) { $busy += $name }
      }
      [pscustomobject]@{ states = $states; busy = $busy }
  vars:
    ansible_become: true
    ansible_become_method: ansible.builtin.runas
    ansible_become_user: SYSTEM
  check_mode: false
  register: wsl_move_rehearsal_wayback_runs

- name: No run of the window task or the boot task goes on
  vars:
    runs: "{{ wsl_move_rehearsal_wayback_runs.output | last }}"
  ansible.builtin.assert:
    that:
      - runs.busy | length == 0
    fail_msg: >-
      A run of {{ runs.busy | join(' and ') }} goes on ({{ runs.states | join('; ') }}): a way back may be running.
      Wait for its end and read its log. Nothing is changed.
    quiet: true

- name: The group steps of this way back
  ansible.builtin.set_fact:
    wsl_move_rehearsal_wayback_group: "{{ wsl_move_rehearsal_wayback_group_steps | default(true) | bool }}"

- name: The way back, and the reads after it
  when: not ansible_check_mode
  block:
    - name: Read the last marker before the way back
      ansible.windows.win_powershell:
        parameters:
          State: "{{ wsl_move_rehearsal_state_file }}"
        script: |
          param([string]$State)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          $lines = @(Get-Content -LiteralPath $State | Where-Object { $_.Trim() })
          if ($lines.Count) { "$(($lines[-1] -split ' ', 2)[1])".Trim() } else { '' }
      vars:
        ansible_become: true
        ansible_become_method: ansible.builtin.runas
        ansible_become_user: SYSTEM
      register: wsl_move_rehearsal_wayback_marker

    # The task can not log on: no new run and no result. If it ran all the
    # same, it finds no disk file in the folder of A, and changes nothing.
    # Only after a done window, with the group steps on: after the phase
    # interrupt A holds its own batch right, and the task would run.
    - name: The import back task of A can not start before the way back
      when:
        - wsl_move_rehearsal_wayback_group
        - (wsl_move_rehearsal_wayback_marker.output | last | default('')) == 'window-done'
      ansible.builtin.include_tasks: run_task.yml
      vars:
        wsl_move_rehearsal_run: {key: a, step: import, expect: not-run}

    # The stated case: B owns its disk file, so it may remove SYSTEM and the
    # Administrators from its rules. Way back step 3 must restore the saved
    # owner and rules all the same, with the privileges of SYSTEM. The task
    # is registered here too: it came after the setup of a running rehearsal.
    # The case runs by default. -e wsl_move_rehearsal_wayback_strip_case=false
    # leaves it out for one run: the way back and each other check stay as
    # they are, and the saved owner and rules are checked after it all the
    # same (the rules of A's disk file after the way back).
    - name: The stated case of a file that grants SYSTEM nothing
      when: wsl_move_rehearsal_wayback_strip_case | default(true) | bool
      block:
        - name: The task of B that removes SYSTEM and the Administrators from the rules of its disk file
          tnwks_win_scheduled_task:
            name: "{{ wsl_move_rehearsal_prefix }}-{{ task.key }}-{{ task.step }}"
            xml: "{{ lookup('ansible.builtin.template', 'account-task.xml.j2') }}"
            s4u_user: "{{ wsl_move_rehearsal_accounts[task.key].name }}"
            s4u_description: "{{ wsl_move_rehearsal_accounts[task.key].description }}"
          vars:
            task: {key: b, step: strip-rules}
            ansible_become: true
            ansible_become_method: ansible.builtin.runas
            ansible_become_user: SYSTEM

        - name: B removes SYSTEM and the Administrators from the rules of its disk file
          ansible.builtin.include_tasks: run_task.yml
          vars:
            wsl_move_rehearsal_run: {key: b, step: strip-rules}

        - name: Only B has a rule on its disk file before the way back
          vars:
            strip: "{{ wsl_move_rehearsal_runs['strip-rules'] | last }}"
          ansible.builtin.assert:
            that:
              - strip.result.owner_self
              - strip.result.system_or_admins == 0
              - strip.result.rules == 1
            fail_msg: "B did not remove SYSTEM and the Administrators from the rules of its disk file: {{ strip }}"
            quiet: true

    # With no group step, A imports back as a standard account: it needs its
    # own batch right (it holds it after the phase interrupt), and its folder
    # must hold no icon that it does not own.
    - name: A may log on as a batch job, for a way back with no group step
      when: not wsl_move_rehearsal_wayback_group
      ansible.windows.win_user_right:
        name: SeBatchLogonRight
        users: ["{{ wsl_move_rehearsal_sids.a }}"]
        action: add

    - name: The icon in the folder of A, before a way back with no group step
      when: not wsl_move_rehearsal_wayback_group
      ansible.builtin.include_tasks: icon.yml
      vars:
        wsl_move_rehearsal_icon_action: remove

    - name: The window procedure, way back mode
      ansible.builtin.include_tasks: run_procedure.yml
      vars:
        wsl_move_rehearsal_request:
          mode: wayback
          group_steps: "{{ wsl_move_rehearsal_wayback_group }}"
          stop_after: 0
          rehearsal_group_test: "{{ wsl_move_rehearsal_wayback_group }}"
        wsl_move_rehearsal_last_markers: [window-done, window-started, boot-run]

    - name: A may log on as a batch job again, with no group
      ansible.windows.win_user_right:
        name: SeBatchLogonRight
        users: ["{{ wsl_move_rehearsal_sids.a }}"]
        action: add

    # The import back ran with A in Administrators, and the end of the run
    # took A out: an icon that it made then can be the group's. After the
    # batch right: a removal that fails leaves A with its right.
    - name: The icon in the folder of A, after A left the group
      when: wsl_move_rehearsal_wayback_group
      ansible.builtin.include_tasks: icon.yml
      vars:
        wsl_move_rehearsal_icon_action: remove

    # The import back started A's VM while A was in Administrators; the
    # procedure ran A's stop task before A left the group. A VM process shows
    # no account: the proof is that the VM processes are those of the
    # baseline (the live VM only), each by its process ID and start time,
    # before the start task of A starts. A VM of the rehearsal that ends while
    # another starts keeps the count, not the set. After a restart (the
    # baseline is marked) the live VM is a new one: only the count compares.
    - name: No VM of the rehearsal before the start task of A
      when: wsl_move_rehearsal_wayback_group
      ansible.windows.win_powershell:
        parameters:
          Path: "{{ wsl_move_rehearsal_baseline_file }}"
        script: |
          param([string]$Path)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          $read = Get-Content -LiteralPath $Path -Raw | ConvertFrom-Json
          # win_powershell keeps two levels of the output of the live read, so
          # the baseline holds each VM process as text, "@{id=..; name=..;
          # created=..}". An object (a deeper read) is taken too.
          $base = @(@($read.vm) | Where-Object { $_ } | ForEach-Object {
              if ($_ -is [string]) {
                  if ($_ -match '\bid=(\d+);.*\bcreated=([^;}]+)') { "$($Matches[1]) $($Matches[2].Trim())" } else { "unread: $_" }
              } else { "$($_.id) $($_.created)" } } | Sort-Object)
          $by = if ($read.restarted) { 'count' } else { 'process ID and start time' }
          $deadline = (Get-Date).AddMinutes(2)
          do {
              $now = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -like 'vmmem*' } | ForEach-Object {
                  "$([int]$_.ProcessId) $(if ($_.CreationDate) { $_.CreationDate.ToUniversalTime().ToString('o') })" } | Sort-Object)
              $same = if ($read.restarted) { $now.Count -eq $base.Count } else { ($now -join ' | ') -eq ($base -join ' | ') }
              if (-not $same) { Start-Sleep -Seconds 3 }
          } while (-not $same -and (Get-Date) -lt $deadline)
          [pscustomobject]@{ baseline = $base; now = $now; by = $by; same = $same }
      register: wsl_move_rehearsal_vm_count
      failed_when: not (wsl_move_rehearsal_vm_count.output | last).same

    # The procedure leaves the start of A to the play in the group test.
    # With no group step, the procedure starts it.
    - name: The start task of A, started by the play
      when: wsl_move_rehearsal_wayback_group
      ansible.windows.win_powershell:
        parameters:
          Task: "{{ wsl_move_rehearsal_prefix }}-a-start"
          Sid: "{{ wsl_move_rehearsal_sids.a }}"
        script: |
          param([string]$Task, [string]$Sid)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $true
          Start-ScheduledTask -TaskName $Task
          $deadline = (Get-Date).AddMinutes(3)
          do {
              Start-Sleep -Seconds 3
              $running = "$((Get-ScheduledTask -TaskName $Task).State)" -eq 'Running'
              $wsl = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -in @('wsl.exe', 'wslhost.exe', 'wslrelay.exe') } | Where-Object {
                  $o = Invoke-CimMethod -InputObject $_ -MethodName GetOwnerSid -ErrorAction SilentlyContinue; $o -and $o.Sid -eq $Sid })
          } while (-not ($running -and $wsl.Count) -and (Get-Date) -lt $deadline)
          [pscustomobject]@{ running = $running; wsl = $wsl.Count }
      vars:
        ansible_become: true
        ansible_become_method: ansible.builtin.runas
        ansible_become_user: SYSTEM
      register: wsl_move_rehearsal_a_started
      failed_when: not ((wsl_move_rehearsal_a_started.output | last).running and (wsl_move_rehearsal_a_started.output | last).wsl > 0)

    - name: The tokens of the WSL processes of A
      ansible.builtin.include_tasks: tokens.yml

    - name: No WSL process of A holds a token from its time in Administrators
      vars:
        tokens: "{{ wsl_move_rehearsal_tokens.output | last }}"
      ansible.builtin.assert:
        that:
          - tokens.processes > 0
          - tokens.errors | length == 0
          - tokens.admin_enabled == 0
        fail_msg: "The tokens of the WSL processes of A: {{ tokens }}"
        quiet: true

    - name: A reads its distro after the way back
      ansible.builtin.include_tasks: run_task.yml
      vars:
        wsl_move_rehearsal_run: {key: a, step: check}

    - name: B lists no distro after the way back
      ansible.builtin.include_tasks: run_task.yml
      vars:
        wsl_move_rehearsal_run: {key: b, step: check}

    - name: Read the tasks and the file after the way back
      ansible.windows.win_powershell:
        parameters:
          Prefix: "{{ wsl_move_rehearsal_prefix }}"
          Disk: '{{ wsl_move_rehearsal_accounts.a.folder }}\{{ wsl_move_rehearsal_disk_name }}'
          DiskB: '{{ wsl_move_rehearsal_accounts.b.folder }}\{{ wsl_move_rehearsal_disk_name }}'
        script: |
          param([string]$Prefix, [string]$Disk, [string]$DiskB)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          [pscustomobject]@{
              start_a = "$((Get-ScheduledTask -TaskName "$Prefix-a-start").State)"
              start_b = "$((Get-ScheduledTask -TaskName "$Prefix-b-start").State)"
              start_a_enabled = [bool](Get-ScheduledTask -TaskName "$Prefix-a-start").Settings.Enabled
              start_b_enabled = [bool](Get-ScheduledTask -TaskName "$Prefix-b-start").Settings.Enabled
              disk_a = [bool](Test-Path -LiteralPath $Disk)
              disk_b = [bool](Test-Path -LiteralPath $DiskB)
          }
      vars:
        ansible_become: true
        ansible_become_method: ansible.builtin.runas
        ansible_become_user: SYSTEM
      register: wsl_move_rehearsal_back_read

    # The saved owner and rules, and a rule of a VM at most for each start
    # since the restore (the start task of A).
    - name: The rules of A's disk file after the way back
      ansible.builtin.include_tasks: read_disk.yml
      vars:
        wsl_move_rehearsal_disk_read: {key: a, rule: saved}

    # The group moments, and who starts A's start task, follow the group
    # steps of the run.
    - name: A owns the distro again, with its data; B lists none; the logs show each moment
      vars:
        group_steps: "{{ wsl_move_rehearsal_wayback_group }}"
        check_a: "{{ wsl_move_rehearsal_runs.check[-2] }}"
        check_b: "{{ wsl_move_rehearsal_runs.check[-1] }}"
        back: "{{ wsl_move_rehearsal_back_read.output | last }}"
        disk_a: "{{ wsl_move_rehearsal_disk.output | last }}"
      ansible.builtin.assert:
        that:
          - check_a.result.registered
          - check_a.result.disk | lower == (wsl_move_rehearsal_accounts.a.folder ~ '\\' ~ wsl_move_rehearsal_disk_name) | lower
          - check_a.result.token == wsl_move_rehearsal_data_token
          - check_a.result.mem_total_kib | int <= wsl_move_rehearsal_memory_limit_kib
          - not check_b.result.registered
          - back.disk_a and not back.disk_b and disk_a.saved and disk_a.rules_ok
          - back.start_a_enabled and not back.start_b_enabled
          - back.start_a == 'Running' and back.start_b == 'Disabled'
          - wsl_move_rehearsal_procedure.result == 'done'
          - wsl_move_rehearsal_procedure.markers == ['window-started', 'wayback-done']
          - wsl_move_rehearsal_procedure.groups == (['joined', 'left'] if group_steps else [])
          - wsl_move_rehearsal_procedure.would_restart == 1
          - >-
            wsl_move_rehearsal_procedure.log | select('string') | select('match', '^the start tasks of .* are left to the play')
            | list | length == (1 if group_steps else 0)
          - >-
            wsl_move_rehearsal_procedure.log | select('string') | select('match', '^no WSL process of .* before it leaves the group$')
            | list | length == (1 if group_steps else 0)
          - >-
            wsl_move_rehearsal_procedure.log | select('string') | select('match', '^the start tasks of .* run, with [0-9]+ WSL process')
            | list | length == (0 if group_steps else 1)
          - "wsl_move_rehearsal_procedure.log | select('string') | select('match', '^read: ') | list | length == 1"
          - wsl_move_rehearsal_procedure.log | select('string') | select('match', '^task .*-a-import ended with 0;') | list | length == 1
        fail_msg: "After the way back, a read did not pass: {{ check_a }} {{ check_b }} {{ back }} {{ disk_a }} {{ wsl_move_rehearsal_procedure.log }}"
        quiet: true

- name: The groups at the end
  ansible.builtin.include_tasks: groups.yml

- name: The live parts at the end
  ansible.builtin.include_tasks: live.yml
