---
# Derived from the defaults: the list of tasks of the accounts, and the
# configs that the play writes for the scripts.
wsl_move_rehearsal_task_list: >-
  {%- set out = [] -%}
  {%- for key in ['a', 'b'] -%}
  {%- for step in wsl_move_rehearsal_tasks[key] -%}
  {%- set _ = out.append({'key': key, 'step': step}) -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ out }}

# The rule that the folder of A gives its files, as the drive of an older
# disk file does: Authenticated Users may read (files only). Setup sets it
# with the rules of the folder, and older_disk.yml adds it when it is absent.
wsl_move_rehearsal_older_folder_rule: (A;OIIO;FR;;;AU)

# The scripts of the rehearsal on the host, and the SHA-256 that each copy
# on the host must have (host_files.yml, run_procedure.yml), by its path: the
# bytes of each script of the role, and the text of each config as
# host_files.yml writes it (to_nice_json). The read of the live parts only
# reads: live.yml copies it before each read, at any marker.
wsl_move_rehearsal_scripts:
  - Invoke-TnwksWslAccountTask.ps1
  - Invoke-TnwksMoveWindow.ps1
  - Invoke-TnwksStartTask.ps1
  - Get-TnwksMoveLiveState.ps1
wsl_move_rehearsal_file_hashes: >-
  {%- set out = {} -%}
  {%- for name in wsl_move_rehearsal_scripts -%}
  {%- set _ = out.update({wsl_move_rehearsal_dir ~ '\\' ~ name:
      lookup('ansible.builtin.file', name, rstrip=false) | hash('sha256')}) -%}
  {%- endfor -%}
  {%- for key, value in wsl_move_rehearsal_configs.items() -%}
  {%- set _ = out.update({wsl_move_rehearsal_dir ~ '\\' ~ key ~ '.json': value | to_nice_json | hash('sha256')}) -%}
  {%- endfor -%}
  {{ out }}

# The functions of the procedure that the reads and the shaping of the play
# use, from its copy on the host (host_files.yml makes that copy the role's
# before any of them runs): the read and the write of the rules with the
# privileges of SYSTEM, what a folder gives a file (Windows' own inheritance
# function), and the compare. A script puts it in after its param line and
# gives $Procedure (the path of that copy) and $Capability (the SID of
# wsl_move_rehearsal_vm_capability_sid).
wsl_move_rehearsal_procedure_lib: |
  function Write-Log([string]$Text) { }
  $TnwksVmCapabilitySid = $Capability
  $procedureAst = [Management.Automation.Language.Parser]::ParseFile($Procedure, [ref]$null, [ref]$null)
  foreach ($fd in $procedureAst.FindAll({ $args[0] -is [Management.Automation.Language.FunctionDefinitionAst] }, $false)) {
      if ($fd.Name -in @('Assert-Tnwks', 'Initialize-TnwksSecurity', 'Get-TnwksSddl', 'ConvertTo-TnwksSddlSid', 'ConvertTo-TnwksSddlMask',
              'Get-TnwksSddlParts', 'Get-TnwksFolderGives', 'Get-TnwksFileGives', 'Test-TnwksSddl')) {
          . ([scriptblock]::Create($fd.Extent.Text))
      }
  }
  foreach ($st in $procedureAst.EndBlock.Statements) {
      if ($st -is [Management.Automation.Language.AssignmentStatementAst] -and
          $st.Left -is [Management.Automation.Language.VariableExpressionAst] -and
          $st.Left.VariablePath.UserPath -in @('TnwksSecuritySource', 'TnwksRightNames')) {
          . ([scriptblock]::Create($st.Extent.Text))
      }
  }

# One config for each account (Invoke-TnwksWslAccountTask.ps1), and one for
# the procedure (Invoke-TnwksMoveWindow.ps1).
wsl_move_rehearsal_account_config_common:
  name_pattern: "^{{ wsl_move_rehearsal_prefix }}"
  refused_names: "{{ wsl_move_rehearsal_refused_names }}"
  root: "{{ wsl_move_rehearsal_dir }}"
  distro: "{{ wsl_move_rehearsal_distro }}"
  disk_name: "{{ wsl_move_rehearsal_disk_name }}"
  marker_name: "{{ wsl_move_rehearsal_marker_name }}"
  rootfs: '{{ wsl_move_rehearsal_dir }}\{{ wsl_move_rehearsal_rootfs.url | basename }}'
  rootfs_sha256: "{{ wsl_move_rehearsal_rootfs.sha256 | upper }}"
  linux_user: "{{ wsl_move_rehearsal_linux_user }}"
  data_token: "{{ wsl_move_rehearsal_data_token }}"
  icon_base64: "{{ wsl_move_rehearsal_icon_base64 }}"
  distribution_conf: "{{ wsl_move_rehearsal_distribution_conf }}"
  wsl_conf: "{{ wsl_move_rehearsal_wsl_conf }}"
  registration_values: "{{ wsl_move_rehearsal_registration_values }}"

wsl_move_rehearsal_window_tasks:
  a:
    stop: "{{ wsl_move_rehearsal_prefix }}-a-stop"
    unregister: "{{ wsl_move_rehearsal_prefix }}-a-unregister"
    import: "{{ wsl_move_rehearsal_prefix }}-a-import"
  b:
    stop: "{{ wsl_move_rehearsal_prefix }}-b-stop"
    unregister: "{{ wsl_move_rehearsal_prefix }}-b-unregister"
    import: "{{ wsl_move_rehearsal_prefix }}-b-import"

wsl_move_rehearsal_window_config:
  root: "{{ wsl_move_rehearsal_dir }}"
  account_pattern: "^{{ wsl_move_rehearsal_prefix }}-"
  task_pattern: "^{{ wsl_move_rehearsal_prefix }}-"
  disk_name: "{{ wsl_move_rehearsal_disk_name }}"
  marker_name: "{{ wsl_move_rehearsal_marker_name }}"
  state_file: "{{ wsl_move_rehearsal_state_file }}"
  log_file: "{{ wsl_move_rehearsal_log_file }}"
  acl_file: "{{ wsl_move_rehearsal_acl_file }}"
  version_file: "{{ wsl_move_rehearsal_version_file }}"
  disk_rule:
    owner: "{{ wsl_move_rehearsal_disk_owner }}"
    new_mask: "{{ wsl_move_rehearsal_disk_new_mask }}"
  vm_capability_sid: "{{ wsl_move_rehearsal_vm_capability_sid }}"
  service_binary: "{{ wsl_move_rehearsal_service_binary }}"
  restart: "{{ wsl_move_rehearsal_restart | bool }}"
  # The check for a session of the owner (site 1 only) is not built here.
  session_check: false
  # The read of window step 7 that no WSL VM runs on the host: off in the
  # rehearsal, as the distro of the host runs while the rehearsal does. The
  # procedure reads it as on when the key is not there.
  vm_check: false
  task_minutes: 10
  present:
    account: "{{ wsl_move_rehearsal_accounts.a.name }}"
    folder: "{{ wsl_move_rehearsal_accounts.a.folder }}"
    result_dir: "{{ wsl_move_rehearsal_accounts.a.log_dir }}"
    window_tasks: "{{ wsl_move_rehearsal_window_tasks.a }}"
    disable_tasks: ["{{ wsl_move_rehearsal_prefix }}-a-start"]
    start_tasks: ["{{ wsl_move_rehearsal_prefix }}-a-start"]
  new:
    account: "{{ wsl_move_rehearsal_accounts.b.name }}"
    folder: "{{ wsl_move_rehearsal_accounts.b.folder }}"
    result_dir: "{{ wsl_move_rehearsal_accounts.b.log_dir }}"
    window_tasks: "{{ wsl_move_rehearsal_window_tasks.b }}"
    start_tasks: ["{{ wsl_move_rehearsal_prefix }}-b-start"]
  # The boot task: no temporary account goes into Administrators across a
  # restart. The group steps and the group test are off at boot, unless the
  # boot request (boot_request_file, written by the phase interrupt) turns
  # them on for one boot run: A then joins at way back step 1, after the
  # restart, and leaves at the end of that run.
  boot:
    group_steps: false
    rehearsal_group_test: false
  boot_request_file: "{{ wsl_move_rehearsal_boot_request_file }}"

wsl_move_rehearsal_configs:
  config-a: >-
    {{ wsl_move_rehearsal_account_config_common | combine({'folder': wsl_move_rehearsal_accounts.a.folder,
       'log_dir': wsl_move_rehearsal_accounts.a.log_dir}) }}
  config-b: >-
    {{ wsl_move_rehearsal_account_config_common | combine({'folder': wsl_move_rehearsal_accounts.b.folder,
       'log_dir': wsl_move_rehearsal_accounts.b.log_dir}) }}
  window: "{{ wsl_move_rehearsal_window_config }}"
