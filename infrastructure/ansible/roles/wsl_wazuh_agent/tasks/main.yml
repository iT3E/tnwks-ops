---
- name: Require approval for the selected WSL distro
  ansible.builtin.assert:
    that:
      - wazuh_rollout_host | default('') == inventory_hostname
      - ansible_play_hosts_all == [inventory_hostname]
      - ansible_architecture == 'x86_64'
      - ansible_os_family == 'Debian'
      - wsl_wazuh_agent_group == 'wsl-distro'
      - wazuh_agent_name | default('') is match('^[A-Za-z0-9][A-Za-z0-9_.-]{0,62}$')
    quiet: true

- name: Check whether a Wazuh package is installed
  ansible.builtin.command:
    argv: [dpkg-query, --show, '--showformat=${Status}', wazuh-agent]
  register: wsl_wazuh_package
  changed_when: false
  failed_when: wsl_wazuh_package.rc not in [0, 1]
  check_mode: false

- name: Check the WSL agent's verified package record
  become: true
  ansible.builtin.stat:
    path: /var/ossec/etc/tnwks-package.sha256
    checksum_algorithm: sha256
  register: wsl_wazuh_package_record

- name: Refuse an existing WSL agent without the current package record
  ansible.builtin.assert:
    that: >-
      wsl_wazuh_package_record.stat.checksum | default('') ==
      ((wsl_wazuh_agent_package_sha256 ~ '\n') | hash('sha256'))
    fail_msg: An existing Wazuh installation needs a reviewed upgrade or recovery before running this role.
    quiet: true
  when: wsl_wazuh_package.rc == 0 and wsl_wazuh_package.stdout != 'deinstall ok config-files'

- name: Check whether the WSL agent has enrolled
  become: true
  ansible.builtin.stat:
    path: /var/ossec/etc/client.keys
    get_checksum: false
  register: wsl_wazuh_keys

- name: Require the operator's token file for first enrollment
  ansible.builtin.assert:
    that: wazuh_agent_token_file | default('') | length > 0
    quiet: true
  when:
    - not ansible_check_mode
    - wsl_wazuh_keys.stat.size | default(0) == 0

- name: Install and enroll the WSL agent
  become: true
  when:
    - not ansible_check_mode
    - wsl_wazuh_keys.stat.size | default(0) == 0
  block:
    - name: Create a private install directory
      ansible.builtin.tempfile:
        state: directory
        prefix: tnwks-wazuh-
      register: wsl_wazuh_stage

    - name: Download and check the pinned Wazuh DEB
      ansible.builtin.get_url:
        url: "{{ wsl_wazuh_agent_package_url }}"
        checksum: "sha256:{{ wsl_wazuh_agent_package_sha256 }}"
        dest: "{{ wsl_wazuh_stage.path }}/wazuh-agent.deb"
        mode: "0600"

    - name: Install the verified DEB with service startup held
      ansible.builtin.apt:
        deb: "{{ wsl_wazuh_stage.path }}/wazuh-agent.deb"
        policy_rc_d: 101

    - name: Record the verified package on WSL
      ansible.builtin.copy:
        content: "{{ wsl_wazuh_agent_package_sha256 }}\n"
        dest: /var/ossec/etc/tnwks-package.sha256
        owner: root
        mode: "0600"

    - name: Configure agent identity before enrollment
      ansible.builtin.template:
        src: ossec.conf.j2
        dest: /var/ossec/etc/ossec.conf
        owner: root
        group: wazuh
        mode: "0640"

    - name: Disable remotely configured commands
      ansible.builtin.copy:
        dest: /var/ossec/etc/local_internal_options.conf
        content: |
          logcollector.remote_commands=0
          wazuh_command.remote_commands=0
          sca.remote_commands=0
        owner: root
        group: wazuh
        mode: "0640"

    - name: Copy the one-use token into the protected staging directory
      ansible.builtin.copy:
        src: "{{ wazuh_agent_token_file }}"
        dest: "{{ wsl_wazuh_stage.path }}/enrollment.token"
        owner: root
        mode: "0600"
      no_log: true
      diff: false

    - name: Enroll the WSL agent with the protected token file
      ansible.builtin.command:
        argv:
          - /var/ossec/bin/wazuh-agent-auth
          - --token-file
          - "{{ wsl_wazuh_stage.path }}/enrollment.token"
      changed_when: true
      no_log: true

  always:
    - name: Remove the WSL installer and token
      ansible.builtin.file:
        path: "{{ wsl_wazuh_stage.path }}"
        state: absent
      when: wsl_wazuh_stage.path is defined

- name: Enable and start the enrolled WSL agent
  become: true
  ansible.builtin.systemd_service:
    name: wazuh-agent
    enabled: true
    state: started
  when: not ansible_check_mode or wsl_wazuh_keys.stat.exists
