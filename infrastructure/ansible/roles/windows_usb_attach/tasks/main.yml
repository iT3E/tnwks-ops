---
# Run controller.yml on localhost first (the playbook does).

# --- usbipd-win ----------------------------------------------------------------

- name: Installed usbipd-win version
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      $p = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
          Where-Object { $_.DisplayName -eq 'usbipd-win' } | Select-Object -First 1
      "$($p.DisplayVersion)"
  check_mode: false
  register: usb_attach_usbipd_installed

- name: usbipd-win {{ usb_attach_usbipd_version }}
  when: (usb_attach_usbipd_installed.output | first | default('')) != usb_attach_usbipd_version
  block:
    - name: Stage the usbipd-win MSI
      ansible.windows.win_copy:
        src: "{{ usb_attach_cache }}/{{ usb_attach_usbipd_msi.url | basename }}"
        dest: '{{ usb_attach_staging }}\'

    - name: Install usbipd-win
      ansible.windows.win_package:
        path: '{{ usb_attach_staging }}\{{ usb_attach_usbipd_msi.url | basename }}'
        state: present

# Check mode reports the bind without running it (-WhatIf).
- name: Devices are bound (shared, forced) for usbip
  ansible.windows.win_powershell:
    parameters:
      Exe: "{{ usb_attach_usbipd_exe }}"
      Devices: "{{ usb_attach_bound_devices }}"
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param([string]$Exe, [string[]]$Devices)
      $Ansible.Changed = $false
      if (-not (Test-Path $Exe)) {
          # Only in a check run before usbipd-win is installed.
          $Ansible.Changed = [bool]$Devices
          return
      }
      $state = ((& $Exe state) -join "`n") | ConvertFrom-Json
      if ($LASTEXITCODE -ne 0) { throw "usbipd state failed ($LASTEXITCODE)" }
      foreach ($d in $Devices) {
          $vid, $prod = $d.ToUpper() -split ':'
          $match = @($state.Devices | Where-Object { $_.InstanceId -like "USB\VID_${vid}&PID_${prod}\*" })
          if (@($match | Where-Object { $_.PersistedGuid -and $_.IsForced }).Count) { continue }
          $Ansible.Changed = $true
          if ($PSCmdlet.ShouldProcess($d, 'usbipd bind --force')) {
              $out = & $Exe bind --force --hardware-id $d 2>&1
              if ($LASTEXITCODE -ne 0) { throw "usbipd bind --force --hardware-id $d failed ($LASTEXITCODE): $out" }
          }
      }

# --- the attach task ---------------------------------------------------------

# Only SYSTEM and the Administrators may make or change files here, and
# Users may read (tnwks_win_dir_acl, no writer). The folder inherits no rule.
# Each item in it takes the owner Administrators and the rules of the folder,
# at each run.
- name: USB attach directory
  tnwks_win_dir_acl:
    path: "{{ usb_attach_dir }}"
    items: reset
    # Its own rules: the task with no elevation writes there (below).
    keep: ["{{ usb_attach_log_dir }}"]

# The account may make and change files here, but not change the directory
# itself (tnwks_win_dir_acl).
- name: Log directory of the attach task
  tnwks_win_dir_acl:
    path: "{{ usb_attach_log_dir }}"
    writer: "{{ usb_attach_writers }}"
  when: wsl_start_unelevated | bool

# The task starts the script fresh every run, so a new copy needs no restart.
- name: Sync script
  ansible.windows.win_copy:
    src: "{{ usb_attach_src }}"
    dest: '{{ usb_attach_dir }}\Sync-TnwksUsbAttach.ps1'

# The move of the distro (wsl_move_phase): while it runs, the enabled state
# of the task and of its copy is the window's (keep_task_enabled_state), and
# once it is done the play leaves the task of the present account as the
# window left it. The way back enables that task again: the task of today.
- name: The move of the distro needs the start with no elevation
  ansible.builtin.assert:
    that: wsl_move_phase == 'off' or wsl_start_unelevated | bool
    fail_msg: The tasks of the account that owns the distro run with no elevation, so wsl_move needs wsl_start_unelevated.
    quiet: true

- name: Sync task (desktop user; logon, every 15 min, after a WSL vNIC reset)
  tnwks_win_scheduled_task:
    name: "{{ usb_attach_task }}"
    xml: "{{ lookup('ansible.builtin.template', 'usb-attach.xml.j2') }}"
    keep_task_enabled_state: "{{ wsl_move_phase == 'move' }}"
  when: wsl_move_phase != 'done'

# The copy for the account that owns the distro, registered as SYSTEM, which
# sets a new random password on that account (s4u_user). While the move
# runs, a new copy is disabled, and the window enables it. Once it is done,
# the play keeps it enabled. The task and its copy attach the same device,
# and the window runs one of them only.
- name: Sync task of the account that owns the distro
  tnwks_win_scheduled_task:
    name: "{{ usb_attach_task_account }}"
    xml: >-
      {{ lookup('ansible.builtin.template', 'usb-attach.xml.j2')
         | regex_replace('<Settings>', '<Settings><Enabled>false</Enabled>' if wsl_move_phase == 'move' else '<Settings>', count=1) }}
    s4u_user: "{{ wsl_move_new_account }}"
    s4u_description: "{{ wsl_move_new_description }}"
    keep_task_enabled_state: "{{ wsl_move_phase == 'move' }}"
  vars:
    usb_attach_user: "{{ wsl_move_new_account }}"
    ansible_become: true
    ansible_become_method: ansible.builtin.runas
    ansible_become_user: SYSTEM
  when: wsl_move_phase != 'off'
  no_log: true

- name: Superseded files are gone
  ansible.windows.win_file:
    path: '{{ usb_attach_dir }}\{{ item }}'
    state: absent
  loop: "{{ usb_attach_leftovers }}"
