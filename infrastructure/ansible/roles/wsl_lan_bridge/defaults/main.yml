---
# Which socat instances to install. Each maps to a 'case' arm in
# tnwks-lan-bridge.sh: http→ingress 80, https→ingress 443, mqtt→1883,
# netflow→flow-collector udp/2055 (Windows side: Start-TnwksUdpRelay.ps1),
# syslog→vector-aggregator udp/6001 (the router's remote logging; Windows
# side: a second Start-TnwksUdpRelay.ps1 instance), unifi-inform→the UniFi
# controller's tcp/8080 (socat listens on 18080; Sync-TnwksLanBridge.ps1 maps
# LAN 8080 to it).
# 'dns' is intentionally omitted by default — netsh portproxy is TCP-only,
# so the LAN-side DNS path goes via VyOS, not via this bridge.
# Target addresses for tnwks-lan-bridge.sh, per host (env var -> address). The
# script's defaults are homelab-wsl's MetalLB VIPs (10.5.0.x); another cluster
# sets its own here (WSL-02: INTERNAL_INGRESS_IP 10.6.0.200), and they reach
# the units through a drop-in. Empty: no drop-in, the defaults apply.
wsl_lan_bridge_targets: {}

wsl_lan_bridge_instances:
  - http
  - https
  - mqtt
  - netflow
  - syslog
  - unifi-inform
