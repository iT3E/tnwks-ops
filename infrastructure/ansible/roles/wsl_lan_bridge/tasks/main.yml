---
# wsl_lan_bridge — install socat, the bridge script, and the templated
# systemd unit, then enable+start one instance per LAN-exposed port.
# See docs/wsl/lan-exposure.md for why this chain exists.

- name: Install socat
  ansible.builtin.apt:
    name: socat
    state: present

- name: Install tnwks-lan-bridge script
  ansible.builtin.copy:
    src: tnwks-lan-bridge.sh
    dest: /usr/local/bin/tnwks-lan-bridge
    owner: root
    group: root
    mode: "0755"
  register: bridge_script

- name: Install tnwks-lan-bridge templated systemd unit
  ansible.builtin.copy:
    src: tnwks-lan-bridge@.service
    dest: /etc/systemd/system/tnwks-lan-bridge@.service
    owner: root
    group: root
    mode: "0644"
  register: bridge_unit
  notify: Reload systemd

- name: Drop-in directory for this host's targets
  ansible.builtin.file:
    path: /etc/systemd/system/tnwks-lan-bridge@.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: wsl_lan_bridge_targets | length > 0

- name: This host's targets (wsl_lan_bridge_targets)
  ansible.builtin.copy:
    content: |
      # Managed by tnwks-ops (role wsl_lan_bridge, wsl_lan_bridge_targets).
      [Service]
      {% for k, v in wsl_lan_bridge_targets | dictsort %}
      Environment={{ k }}={{ v }}
      {% endfor %}
    dest: /etc/systemd/system/tnwks-lan-bridge@.service.d/targets.conf
    owner: root
    group: root
    mode: "0644"
  register: bridge_targets
  notify: Reload systemd
  when: wsl_lan_bridge_targets | length > 0

- name: Flush the systemd reload before starting instances
  ansible.builtin.meta: flush_handlers

- name: Enable and start tnwks-lan-bridge instances
  ansible.builtin.systemd:
    name: "tnwks-lan-bridge@{{ item }}.service"
    enabled: true
    state: started
  loop: "{{ wsl_lan_bridge_instances }}"
  # Check mode on a fresh distro: the unit file isn't there yet.
  when: not (ansible_check_mode and bridge_unit is changed)

- name: Restart tnwks-lan-bridge instances if script or unit changed
  ansible.builtin.systemd:
    name: "tnwks-lan-bridge@{{ item }}.service"
    state: restarted
  loop: "{{ wsl_lan_bridge_instances }}"
  when:
    - bridge_script.changed or bridge_unit.changed or (bridge_targets.changed | default(false))
    - not (ansible_check_mode and bridge_unit is changed)
