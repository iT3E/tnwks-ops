---
# Only SYSTEM and the Administrators may make or change files here, and
# Users may read (tnwks_win_dir_acl, no writer). The folder inherits no rule.
# Each item in it takes the owner Administrators and the rules of the folder,
# at each run.
- name: Relay directory
  tnwks_win_dir_acl:
    path: "{{ udp_relay_dir }}"
    items: reset
    # Its own rules: the relays write there (below).
    keep: ["{{ udp_relay_log_dir }}"]

# The account may make and change files here, but not change the directory
# itself (tnwks_win_dir_acl).
- name: Log directory of the relays
  tnwks_win_dir_acl:
    path: "{{ udp_relay_log_dir }}"
    writer: "{{ udp_relay_writers }}"
  when: wsl_start_unelevated | bool

- name: Relay script
  ansible.windows.win_copy:
    src: "{{ udp_relay_src }}"
    dest: '{{ udp_relay_dir }}\Start-TnwksUdpRelay.ps1'
  notify: Restart UDP relays

- name: Firewall rules (inbound UDP from the senders only)
  ansible.windows.win_firewall_rule:
    name: tnwks-udp-relay-{{ item.port }}
    localport: "{{ item.port }}"
    protocol: udp
    direction: in
    action: allow
    remoteip: "{{ item.remote | join(',') }}"
    enabled: true
    state: present
  loop: "{{ udp_relays }}"
  loop_control:
    label: "{{ item.task }} udp/{{ item.port }}"

# The move of the distro (wsl_move_phase): while it runs, the enabled state
# of each relay task is the window's (keep_task_enabled_state), and once it
# is done the play leaves the tasks of the present account as the window
# left them.
- name: The move of the distro needs the start with no elevation
  ansible.builtin.assert:
    that: wsl_move_phase == 'off' or wsl_start_unelevated | bool
    fail_msg: The tasks of the account that owns the distro run with no elevation, so wsl_move needs wsl_start_unelevated.
    quiet: true

- name: Relay tasks (desktop user, at boot and logon, restarted on exit)
  tnwks_win_scheduled_task:
    name: "{{ item.task }}"
    xml: "{{ lookup('ansible.builtin.template', 'udp-relay.xml.j2') }}"
    running: true
    keep_task_enabled_state: "{{ wsl_move_phase == 'move' }}"
  loop: "{{ udp_relays }}"
  loop_control:
    label: "{{ item.task }} udp/{{ item.port }}"
  when: wsl_move_phase != 'done'
  notify: Restart UDP relays

# The copies for the account that owns the distro, registered as SYSTEM,
# which sets a new random password on that account for each registration
# (s4u_user). While the move runs, a new copy is disabled, and the window
# enables it. Once it is done, the play keeps each copy enabled. A relay and
# its copy listen on the same port, and the window runs one of them only.
- name: Relay tasks of the account that owns the distro
  tnwks_win_scheduled_task:
    name: "{{ item.task }}{{ wsl_move_task_suffix }}"
    xml: >-
      {{ lookup('ansible.builtin.template', 'udp-relay.xml.j2')
         | regex_replace('<Settings>', '<Settings><Enabled>false</Enabled>' if wsl_move_phase == 'move' else '<Settings>', count=1) }}
    s4u_user: "{{ wsl_move_new_account }}"
    s4u_description: "{{ wsl_move_new_description }}"
    keep_task_enabled_state: "{{ wsl_move_phase == 'move' }}"
    running: true
  vars:
    udp_relay_user: "{{ wsl_move_new_account }}"
    ansible_become: true
    ansible_become_method: ansible.builtin.runas
    ansible_become_user: SYSTEM
  loop: "{{ udp_relays }}"
  loop_control:
    label: "{{ item.task }}{{ wsl_move_task_suffix }} udp/{{ item.port }}"
  when: wsl_move_phase != 'off'
  no_log: true
  notify: Restart UDP relays
