---
- name: Relay directory
  ansible.windows.win_file:
    path: "{{ udp_relay_dir }}"
    state: directory

- name: Log directory of the relays
  ansible.windows.win_file:
    path: "{{ udp_relay_log_dir }}"
    state: directory
  register: udp_relay_log_dir_result
  when: wsl_start_unelevated | bool

- name: The account may change the log directory of the relays
  ansible.windows.win_acl:
    path: "{{ udp_relay_log_dir }}"
    user: "{{ udp_relay_user }}"
    rights: Modify
    type: allow
    state: present
    inherit: ContainerInherit, ObjectInherit
    propagation: None
  # A check run does not make the directory, so it has no ACL to read yet.
  when: wsl_start_unelevated | bool and not (ansible_check_mode and udp_relay_log_dir_result is changed)

- name: Relay script
  ansible.windows.win_copy:
    src: "{{ udp_relay_src }}"
    dest: '{{ udp_relay_dir }}\Start-TnwksUdpRelay.ps1'
  notify: Restart UDP relays

- name: Firewall rules (inbound UDP from the senders only)
  ansible.windows.win_firewall_rule:
    name: tnwks-udp-relay-{{ item.port }}
    localport: "{{ item.port }}"
    protocol: udp
    direction: in
    action: allow
    remoteip: "{{ item.remote | join(',') }}"
    enabled: true
    state: present
  loop: "{{ udp_relays }}"
  loop_control:
    label: "{{ item.task }} udp/{{ item.port }}"

- name: Relay tasks (desktop user, at boot and logon, restarted on exit)
  tnwks_win_scheduled_task:
    name: "{{ item.task }}"
    xml: "{{ lookup('ansible.builtin.template', 'udp-relay.xml.j2') }}"
    running: true
  loop: "{{ udp_relays }}"
  loop_control:
    label: "{{ item.task }} udp/{{ item.port }}"
  notify: Restart UDP relays
