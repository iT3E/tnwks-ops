---
# A running relay keeps executing the script it started with.
- name: Restart UDP relays
  ansible.windows.win_powershell:
    parameters:
      Tasks: "{{ udp_relay_task_names }}"
      # While the move of the distro runs, the window disables the relays of
      # one account: the handler restarts the ones that are enabled.
      SkipDisabled: "{{ wsl_move_phase == 'move' }}"
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param([string[]]$Tasks, [bool]$SkipDisabled)
      foreach ($t in $Tasks) {
          $task = Get-ScheduledTask -TaskName $t -ErrorAction SilentlyContinue
          if (-not $task) { continue }
          if ($SkipDisabled -and $task.State -eq 'Disabled') { continue }
          if ($PSCmdlet.ShouldProcess($t, 'restart')) {
              Stop-ScheduledTask -TaskName $t
              # Start only once the old relay has let go of its port.
              $deadline = (Get-Date).AddSeconds(30)
              while ((Get-ScheduledTask -TaskName $t).State -eq 'Running' -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
              Start-Sleep -Seconds 2
              Start-ScheduledTask -TaskName $t
          }
      }
