---
# Run controller.yml on localhost first (the playbook does). Each part is in
# the folder of the role or in the profile of the temporary account.

- name: The rehearsal is present
  when: wsl_rehearsal_state == 'present'
  vars:
    # The SID of the account, or empty in a check run before the account exists.
    wsl_rehearsal_sid: "{{ wsl_rehearsal_user.output | default([]) | last | default('') }}"
  block:
    # A local account with no admin group, member of Users. Its password is
    # random, made here, and kept nowhere: an S4U task needs none. No other
    # account changes.
    - name: The temporary account
      ansible.windows.win_powershell:
        parameters:
          Name: "{{ wsl_rehearsal_account }}"
        script: |
          [CmdletBinding(SupportsShouldProcess)]
          param([string]$Name)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          $user = Get-LocalUser -Name $Name -ErrorAction SilentlyContinue
          if (-not $user) {
              $Ansible.Changed = $true
              if ($PSCmdlet.ShouldProcess($Name, 'make the local account')) {
                  $bytes = New-Object byte[] 48
                  [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
                  $secret = ConvertTo-SecureString ([Convert]::ToBase64String($bytes) + 'aA1!') -AsPlainText -Force
                  $user = New-LocalUser -Name $Name -Password $secret -PasswordNeverExpires -AccountNeverExpires `
                      -UserMayNotChangePassword -Description 'tnwks-ops: the rehearsal of the account change (temporary)'
                  $secret.Dispose()
              }
          }
          if ($user) {
              $users = @(Get-LocalGroupMember -SID 'S-1-5-32-545' | ForEach-Object { $_.SID.Value })
              if ($users -notcontains $user.SID.Value) {
                  $Ansible.Changed = $true
                  if ($PSCmdlet.ShouldProcess($Name, 'add to Users')) { Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $user }
              }
              # Never an admin: the rehearsal proves a standard account.
              $admins = @(Get-LocalGroupMember -SID 'S-1-5-32-544' | ForEach-Object { $_.SID.Value })
              if ($admins -contains $user.SID.Value) { throw "$Name is a member of Administrators. Nothing more is changed." }
          }
      no_log: true

    # A read, also in a check run.
    - name: Read the temporary account
      ansible.windows.win_powershell:
        parameters:
          Name: "{{ wsl_rehearsal_account }}"
        script: |
          param([string]$Name)
          $Ansible.Changed = $false
          $user = Get-LocalUser -Name $Name -ErrorAction SilentlyContinue
          if ($user) { $user.SID.Value } else { '' }
      check_mode: false
      register: wsl_rehearsal_user

    # A check run before the first apply has no account to name: the tasks
    # that name it (its rights, the rules of its folders, its tasks) wait for
    # the apply that makes it.
    - name: A check run before the account exists
      ansible.builtin.debug:
        msg: >-
          {{ wsl_rehearsal_account }} does not exist yet. This check run does not
          check its rights, the rules of its two folders or its tasks: the apply
          makes the account first.
      when: wsl_rehearsal_sid | length == 0

    # S4U needs it. Only Administrators, Backup Operators and Performance Log
    # Users hold it before.
    - name: The temporary account may log on as a batch job
      ansible.windows.win_user_right:
        name: SeBatchLogonRight
        users: ["{{ wsl_rehearsal_sid }}"]
        action: add
      when: wsl_rehearsal_sid | length > 0

    # The logons that the account does not need. None of the three is the
    # batch logon of an S4U task (SeDenyBatchLogonRight is that one).
    - name: The temporary account may not log on at the keyboard, by Remote Desktop or from the network
      ansible.windows.win_user_right:
        name: "{{ item }}"
        users: ["{{ wsl_rehearsal_sid }}"]
        action: add
      loop: "{{ wsl_rehearsal_deny_rights }}"
      when: wsl_rehearsal_sid | length > 0

    # No tile for the account on the sign-in screen.
    - name: The temporary account is not on the sign-in screen
      ansible.windows.win_regedit:
        path: '{{ wsl_rehearsal_userlist_key }}'
        name: "{{ wsl_rehearsal_account }}"
        data: 0
        type: dword

    # Only SYSTEM and the Administrators may change the scripts and the root
    # file system; Users may read, and each item takes the owner
    # Administrators. The account writes only to the log folder, and reads
    # and writes the test disk file: those two keep their own rules.
    - name: Folder of the rehearsal
      tnwks_win_dir_acl:
        path: "{{ wsl_rehearsal_dir }}"
        items: reset
        keep: ["{{ wsl_rehearsal_log_dir }}", "{{ wsl_rehearsal_disk_dir }}"]

    - name: Log and disk folders of the rehearsal
      tnwks_win_dir_acl:
        path: "{{ item }}"
        writer: "{{ wsl_rehearsal_account }}"
      loop: ["{{ wsl_rehearsal_log_dir }}", "{{ wsl_rehearsal_disk_dir }}"]
      when: wsl_rehearsal_sid | length > 0

    - name: Scripts of the rehearsal
      ansible.windows.win_copy:
        src: "{{ item }}"
        dest: '{{ wsl_rehearsal_dir }}\{{ item }}'
      loop: [Invoke-TnwksRehearsal.ps1, write-test.sh]

    - name: The root file system
      ansible.windows.win_copy:
        src: "{{ wsl_rehearsal_cache }}/{{ wsl_rehearsal_rootfs.url | basename }}"
        dest: '{{ wsl_rehearsal_dir }}\{{ wsl_rehearsal_rootfs.url | basename }}'

    - name: The root file system has its pinned digest on the host
      ansible.windows.win_stat:
        path: '{{ wsl_rehearsal_dir }}\{{ wsl_rehearsal_rootfs.url | basename }}'
        get_checksum: true
        checksum_algorithm: sha256
      register: wsl_rehearsal_rootfs_stat
      failed_when: >-
        wsl_rehearsal_rootfs_stat.stat.exists and
        wsl_rehearsal_rootfs_stat.stat.checksum | lower != wsl_rehearsal_rootfs.sha256 | lower

    # The one file name that the write test tries (files/write-test.sh). The
    # test removes a file that it made; this removes one that it left.
    - name: No file of the write test
      ansible.windows.win_file:
        path: '{{ wsl_rehearsal_write_test_dir }}\tnwks-rehearsal-write-test.tmp'
        state: absent

    # An empty disk file with no partition and no file system: --bare attaches
    # it to the VM and mounts nothing. diskpart makes it as the administrator,
    # and the account may read and write it by the rules of its folder.
    - name: The test disk file
      ansible.windows.win_powershell:
        parameters:
          Path: "{{ wsl_rehearsal_disk }}"
          SizeMiB: "{{ wsl_rehearsal_disk_mib }}"
        script: |
          [CmdletBinding(SupportsShouldProcess)]
          param([string]$Path, [int]$SizeMiB)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          if (Test-Path -LiteralPath $Path) { return }
          $Ansible.Changed = $true
          if ($PSCmdlet.ShouldProcess($Path, 'make the test disk file')) {
              $script = Join-Path $env:TEMP 'tnwks-rehearsal-disk.txt'
              "create vdisk file=`"$Path`" maximum=$SizeMiB type=expandable" | Set-Content -LiteralPath $script -Encoding ASCII
              $out = diskpart.exe /s $script 2>&1 | Out-String
              Remove-Item -LiteralPath $script -Force
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $Path)) { throw "diskpart did not make $Path ($LASTEXITCODE): $out" }
          }

    - name: Tasks of the temporary account
      tnwks_win_scheduled_task:
        name: "{{ wsl_rehearsal_task_prefix }}-{{ item }}"
        xml: "{{ lookup('ansible.builtin.template', 'rehearsal-task.xml.j2') }}"
      loop: "{{ wsl_rehearsal_steps + ['start'] }}"
      when: wsl_rehearsal_sid | length > 0

    # The rest runs the tasks, so a check run stops here.
    - name: Run the tasks of the account
      when: not ansible_check_mode
      block:
        # The first run of a task of the account makes its profile, where its
        # .wslconfig goes, and gives the first token probe.
        - name: The probe makes the profile of the account
          ansible.windows.win_powershell:
            parameters:
              Task: "{{ wsl_rehearsal_task_prefix }}-probe"
              Account: "{{ wsl_rehearsal_account }}"
            script: &run_task |
              param([string]$Task, [string]$Account)
              $ErrorActionPreference = 'Stop'
              $Ansible.Changed = $true
              $before = (Get-ScheduledTaskInfo -TaskName $Task).LastRunTime
              Start-ScheduledTask -TaskName $Task
              $deadline = (Get-Date).AddMinutes(20)
              do {
                  Start-Sleep -Seconds 3
                  $info = Get-ScheduledTaskInfo -TaskName $Task
              } while (((Get-ScheduledTask -TaskName $Task).State -eq 'Running' -or $info.LastRunTime -eq $before) -and (Get-Date) -lt $deadline)
              if ($info.LastTaskResult -ne 0) { throw "$Task ended with $($info.LastTaskResult)" }
              $sid = (Get-LocalUser -Name $Account).SID.Value
              (Get-CimInstance Win32_UserProfile -Filter "SID = '$sid'").LocalPath
          register: wsl_rehearsal_profile
          # The probe reads. Its first run also makes the profile of the
          # account, which the change of the account task shows.
          changed_when: false

        # WSL keeps the distros of an account in its registry hive, which is
        # loaded while a task of the account runs. No import without it, and
        # no .wslconfig outside a profile under C:\Users.
        - name: The task of the account ran in its own profile
          ansible.windows.win_powershell:
            parameters:
              Path: '{{ wsl_rehearsal_log_dir }}\probe.json'
              Profile: "{{ wsl_rehearsal_profile.output | last | default('') }}"
            script: |
              param([string]$Path, [string]$Profile)
              $ErrorActionPreference = 'Stop'
              $Ansible.Changed = $false
              $probe = Get-Content -LiteralPath $Path -Raw | ConvertFrom-Json
              if (-not $probe.hive) { throw 'The registry hive of the account was not loaded in its task. No import.' }
              if ($Profile -notmatch '^[A-Za-z]:\\Users\\[^\\]+$' -or $probe.profile -ne $Profile) {
                  throw "The profile of the account is not one folder under Users ($Profile, $($probe.profile)). No import."
              }

        - name: .wslconfig of the account
          ansible.windows.win_copy:
            dest: '{{ wsl_rehearsal_profile.output | last }}\.wslconfig'
            content: |
              # Managed by tnwks-ops (role windows_wsl_rehearsal): the VM of the
              # rehearsal stays small. No key for networking.
              [wsl2]
              memory={{ wsl_rehearsal_memory }}
              processors=1
              swap=0

        - name: The import of the distro
          ansible.windows.win_powershell:
            parameters:
              Task: "{{ wsl_rehearsal_task_prefix }}-import"
              Account: "{{ wsl_rehearsal_account }}"
            script: *run_task
          # The next task reads whether it imported anything.
          changed_when: false

        # The task of the import ends with 0 when its step ran, so the play
        # reads its result: the import exited 0 and WSL lists the distro.
        - name: The distro is imported
          ansible.windows.win_powershell:
            parameters:
              Path: '{{ wsl_rehearsal_log_dir }}\import.json'
              Distro: "{{ wsl_rehearsal_distro }}"
            script: |
              param([string]$Path, [string]$Distro)
              $ErrorActionPreference = 'Stop'
              $import = Get-Content -LiteralPath $Path -Raw | ConvertFrom-Json
              if ($import.exit -ne 0 -or @($import.distros) -notcontains $Distro) {
                  throw "The import did not end: exit $($import.exit), distros: $(@($import.distros) -join ','). $($import.output)"
              }
              $Ansible.Changed = -not $import.existed

        - name: The start of the distro, with nobody signed in
          tnwks_win_scheduled_task:
            name: "{{ wsl_rehearsal_task_prefix }}-start"
            xml: "{{ lookup('ansible.builtin.template', 'rehearsal-task.xml.j2') }}"
            running: true
          vars:
            item: start

# The removal (task 10.6). Each part goes, in this order: the distro and the
# VM (as the account), the tasks, the batch right, the profile, the account,
# the folder. A second run finds nothing and changes nothing. No task of the
# play runs wsl.exe: the administrator session never stops WSL.
- name: The rehearsal is absent
  when: wsl_rehearsal_state == 'absent'
  vars:
    # The SID of the account, or empty when it is gone.
    wsl_rehearsal_sid: "{{ wsl_rehearsal_user.output | default([]) | last | default('') }}"
  block:
    - name: Read the temporary account
      ansible.windows.win_powershell:
        parameters:
          Name: "{{ wsl_rehearsal_account }}"
        script: |
          param([string]$Name)
          $Ansible.Changed = $false
          $user = Get-LocalUser -Name $Name -ErrorAction SilentlyContinue
          if ($user) { $user.SID.Value } else { '' }
      check_mode: false
      register: wsl_rehearsal_user

    # As the account: its own task ends the distro, unregisters it (with its
    # disk in the profile), and shuts down the VM of its own session. The
    # play first stops the start task, which ends the wsl.exe client that
    # held the distro.
    - name: The distro and the VM stop, as the account
      when:
        - wsl_rehearsal_sid | length > 0
        - not ansible_check_mode
      block:
        - name: The start task stops
          ansible.windows.win_powershell:
            parameters:
              Task: "{{ wsl_rehearsal_task_prefix }}-start"
            script: |
              param([string]$Task)
              $Ansible.Changed = $false
              $task = Get-ScheduledTask -TaskName $Task -ErrorAction SilentlyContinue
              if ($task -and $task.State -eq 'Running') {
                  $Ansible.Changed = $true
                  Stop-ScheduledTask -TaskName $Task
              }

        # The script with the step remove.
        - name: Script of the removal
          ansible.windows.win_copy:
            src: Invoke-TnwksRehearsal.ps1
            dest: '{{ wsl_rehearsal_dir }}\Invoke-TnwksRehearsal.ps1'

        - name: The task of the removal
          tnwks_win_scheduled_task:
            name: "{{ wsl_rehearsal_task_prefix }}-remove"
            xml: "{{ lookup('ansible.builtin.template', 'rehearsal-task.xml.j2') }}"
          vars:
            item: remove

        - name: The removal runs as the account
          ansible.windows.win_powershell:
            parameters:
              Task: "{{ wsl_rehearsal_task_prefix }}-remove"
              Result: '{{ wsl_rehearsal_log_dir }}\remove.json'
              Distro: "{{ wsl_rehearsal_distro }}"
              Sid: "{{ wsl_rehearsal_sid }}"
            script: |
              param([string]$Task, [string]$Result, [string]$Distro, [string]$Sid)
              $ErrorActionPreference = 'Stop'
              $Ansible.Changed = $true
              $before = (Get-ScheduledTaskInfo -TaskName $Task).LastRunTime
              Start-ScheduledTask -TaskName $Task
              $deadline = (Get-Date).AddMinutes(10)
              do {
                  Start-Sleep -Seconds 3
                  $info = Get-ScheduledTaskInfo -TaskName $Task
              } while (((Get-ScheduledTask -TaskName $Task).State -eq 'Running' -or $info.LastRunTime -eq $before) -and (Get-Date) -lt $deadline)
              if ($info.LastTaskResult -ne 0) { throw "$Task ended with $($info.LastTaskResult)" }
              $out = Get-Content -LiteralPath $Result -Raw | ConvertFrom-Json
              if (@($out.distros) -contains $Distro -or $out.shutdown_exit -ne 0) {
                  throw "The removal of the distro did not end: $($out | ConvertTo-Json -Compress)"
              }
              # No process of the account may hold its profile. A process
              # that is left is a process of the account: it ends here.
              $deadline = (Get-Date).AddMinutes(2)
              do {
                  $left = @(Get-CimInstance Win32_Process | Where-Object {
                      $owner = Invoke-CimMethod -InputObject $_ -MethodName GetOwnerSid -ErrorAction SilentlyContinue
                      $owner -and $owner.Sid -eq $Sid })
                  if ($left.Count -eq 0) { break }
                  Start-Sleep -Seconds 5
              } while ((Get-Date) -lt $deadline)
              foreach ($p in $left) { Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue }
              @{ result = $out; ended = @($left | ForEach-Object { "$($_.Name) $($_.ProcessId)" }) }

    - name: No task of the account
      tnwks_win_scheduled_task:
        name: "{{ wsl_rehearsal_task_prefix }}-{{ item }}"
        state: absent
      loop: "{{ wsl_rehearsal_tasks }}"

    # Each right goes before the account, so no SID with no account stays
    # in the local policy.
    - name: The account may no longer log on as a batch job
      ansible.windows.win_user_right:
        name: SeBatchLogonRight
        users: ["{{ wsl_rehearsal_sid }}"]
        action: remove
      when: wsl_rehearsal_sid | length > 0

    - name: The deny rights of the account go
      ansible.windows.win_user_right:
        name: "{{ item }}"
        users: ["{{ wsl_rehearsal_sid }}"]
        action: remove
      loop: "{{ wsl_rehearsal_deny_rights }}"
      when: wsl_rehearsal_sid | length > 0

    - name: No value for the account on the sign-in screen
      ansible.windows.win_regedit:
        path: '{{ wsl_rehearsal_userlist_key }}'
        name: "{{ wsl_rehearsal_account }}"
        state: absent

    # Its .wslconfig, its hive and what is left of the distro go with it.
    - name: No profile of the account
      ansible.windows.win_powershell:
        parameters:
          Sid: "{{ wsl_rehearsal_sid }}"
        script: |
          [CmdletBinding(SupportsShouldProcess)]
          param([string]$Sid)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          if (-not $Sid) { return }
          $deadline = (Get-Date).AddMinutes(2)
          do {
              $profile = Get-CimInstance Win32_UserProfile -Filter "SID = '$Sid'"
              if (-not $profile -or -not $profile.Loaded) { break }
              Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)
          if (-not $profile) { return }
          if ($profile.Loaded) { throw "The profile of $Sid is still loaded. Nothing is removed." }
          $Ansible.Changed = $true
          if ($PSCmdlet.ShouldProcess($profile.LocalPath, 'remove the profile')) { Remove-CimInstance -InputObject $profile }

    - name: No temporary account
      ansible.windows.win_powershell:
        parameters:
          Name: "{{ wsl_rehearsal_account }}"
        script: |
          [CmdletBinding(SupportsShouldProcess)]
          param([string]$Name)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          if (-not (Get-LocalUser -Name $Name -ErrorAction SilentlyContinue)) { return }
          $Ansible.Changed = $true
          if ($PSCmdlet.ShouldProcess($Name, 'remove the local account')) { Remove-LocalUser -Name $Name }

    # The scripts, the root file system, the test disk file and the results.
    - name: No folder of the rehearsal
      ansible.windows.win_file:
        path: "{{ wsl_rehearsal_dir }}"
        state: absent

    - name: No file of the write test
      ansible.windows.win_file:
        path: '{{ wsl_rehearsal_write_test_dir }}\tnwks-rehearsal-write-test.tmp'
        state: absent
