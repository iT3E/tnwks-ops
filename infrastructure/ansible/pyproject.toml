# The Ansible controller: one pinned ansible-core for every playbook, locked
# with its dependencies in uv.lock. The taskfiles run it as
# `uv run --project infrastructure/ansible --locked ansible-playbook ...`, so a
# workstation and a CI runner get the same versions. Collections are in
# requirements.yml (`task ansible:init`).
[project]
name = "tnwks-ops-ansible"
version = "0"
requires-python = ">=3.13"
dependencies = [
  # Windows over SSH needs ansible-core >= 2.18.
  "ansible-core==2.22.0",
  # community.docker's modules talk to the Docker API through requests.
  "requests==2.34.2",
]

[dependency-groups]
lint = [
  "ansible-lint==26.11.0",
]

[tool.uv]
package = false
