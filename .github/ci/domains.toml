# Which CI jobs a change needs. bin/ci-changes reads this, diffs the event's
# base and head, and writes one output per domain and per group for
# .github/workflows/ci.yaml (docs/operations/ci.md).
#
# Globs follow GitHub's path filters: `*` stays inside one path segment, `**`
# crosses them. A change to anything in `always` turns every domain on and
# lists every group member, so a CI change runs all of CI.
#
# To add a check: a [domains.<name>] entry here, a workflow_call workflow,
# and a job in ci.yaml gated on needs.changes.outputs.<name> that Build
# Success also needs. The conformance job fails if one of those is missing.

always = [
  ".github/ci/**",
  ".github/workflows/ci.yaml",
  "bin/ci-changes",
]

[domains.kubernetes]
paths = [
  "kubernetes/**",
  "bin/images-added",
  ".github/flate/**",
  ".github/scripts/flate-diff-comment.py",
  ".github/workflows/kubernetes.yaml",
]

[domains.observability]
paths = [
  "observability/**",
  # The control registry and its generated rules, scan lists and board input.
  "security/**",
  # security/tests/test_audit_policy.py reads each cluster's audit policy.
  "talos/*/patches/audit-policy.yaml",
  # validate_health.py scans every manifest.
  "kubernetes/**",
  "bin/site-failover-apps.json",
  "infrastructure/ansible/roles/windows_observability_storage/**",
  "infrastructure/ansible/roles/windows_wsl_maintenance/**",
  "infrastructure/ansible/scripts/*monitoring*.py",
  "infrastructure/ansible/tests/test_observability_storage.py",
  ".github/workflows/observability.yaml",
]

# The disposable Garage/Thanos and Grafana rehearsals (about two minutes)
# read only these.
[domains.observability_rehearsals]
paths = [
  "observability/**",
  "kubernetes/apps/monitoring/**",
  ".github/workflows/observability.yaml",
]

[domains.home_assistant]
paths = [
  "kubernetes/apps/home-automation/home-assistant/**",
  ".github/workflows/home-assistant.yaml",
]

[domains.ansible]
paths = [
  "infrastructure/ansible/**",
  # The Talos patches 01-talos-bootstrap.yml reads (tests/test_talos_patches.py).
  "talos/**",
  ".github/workflows/ansible.yaml",
]

[domains.security_regressions]
paths = [
  "infrastructure/edgeos/**",
  "kubernetes/apps/auth/onboard/**",
  "kubernetes/apps/monitoring/flow-collector/**",
  "kubernetes/apps/selfhosted/immich/sync/**",
  "kubernetes/apps/selfhosted/kitchen-screensaver/**",
  "observability/pyproject.toml",
  "observability/uv.lock",
  ".github/workflows/security-regressions.yaml",
]

[domains.dependency_compatibility]
paths = [
  ".github/dependency-compatibility.json",
  ".github/scripts/dependency-compatibility*",
  ".github/scripts/test_dependency_compatibility.py",
  ".github/workflows/dependency-compatibility.yaml",
  ".github/renovate.json5",
]

[domains.workflows]
paths = [
  ".github/workflows/**",
  ".github/actions/**",
  ".github/scripts/**",
  ".github/actionlint.yaml",
  ".github/zizmor.yml",
]

# Groups list which of their members changed, as a JSON array of objects for
# a matrix: each member's fields except `paths`, plus `name`.
#
# Terraform roots, planned in ci.yaml and applied in deploy.yaml through
# .github/workflows/terraform.yaml. Fields:
#   root         path under infrastructure/terraform/environments
#   title        for job names and the PR comment
#   runner       runs-on label
#   backend      local (github-workflows' actions/terraform; state in TFC, run on the
#                runner) or tfc-remote (runs in TFC: workspace)
#   lock         concurrency group shared by plans and applies, for roots
#                where they must never overlap (one device, local state lock).
#                Without one, plans key on the PR and applies on the root.
#   tf_vars      endpoint overrides that only hold on the runner
#   enabled_var  repository variable that must be "true" to run. Not a
#                GITHUB_ name: GitHub reserves the prefix and refuses to set it.
#   mask_sops    SOPS files, relative to root, whose every value is masked in
#                the job log before Terraform runs (.github/scripts/sops-mask.py),
#                for values a Terraform error could quote. local backend only.
# Adding a root is one entry here.

[groups.terraform.aws]
title = "AWS"
root = "prod/aws"
runner = "ubuntu-26.04"
backend = "tfc-remote"
workspace = "tnwks-ops-aws-prod"
paths = [
  "infrastructure/terraform/environments/prod/aws/**",
  "infrastructure/terraform/modules/aws/**",
  ".github/actions/tfc-speculative-plan/**",
  ".github/actions/tfc-apply/**",
  ".github/workflows/terraform.yaml",
]

[groups.terraform.cloudflare]
title = "Cloudflare"
root = "prod/cloudflare"
runner = "tnwks-ops-runner"
backend = "local"
lock = "cloudflare-terraform"
paths = [
  "infrastructure/terraform/environments/prod/cloudflare/**",
  "infrastructure/terraform/modules/cloudflare/**",
  ".github/workflows/terraform.yaml",
]

# The iT3E account's repositories (docs/operations/github.md). Off until
# `task github:enable` sets TERRAFORM_GITHUB_ENABLED (not managed by
# Terraform), which it does only once main has the token and the mask.
[groups.terraform.github]
title = "GitHub"
root = "prod/github"
runner = "tnwks-ops-runner"
backend = "local"
lock = "github-terraform"
enabled_var = "TERRAFORM_GITHUB_ENABLED"
# Private repositories' names and descriptions, the token, and tnwks-ops'
# Flux webhook URL and openclaw-hooks variables.
mask_sops = ["repositories.sops.yaml", "secrets.sops.yaml", "tnwks-ops.sops.yaml"]
paths = [
  "infrastructure/terraform/environments/prod/github/**",
  "infrastructure/terraform/modules/github/**",
  ".github/scripts/sops-mask.py",
  ".github/workflows/terraform.yaml",
]

[groups.terraform.healthchecks]
title = "Healthchecks"
root = "prod/healthchecks"
runner = "tnwks-ops-runner"
backend = "local"
lock = "healthchecks-terraform"
paths = [
  "infrastructure/terraform/environments/prod/healthchecks/**",
  "infrastructure/terraform/modules/healthchecks/**",
  ".github/workflows/terraform.yaml",
]

# The router's REST API is VPN-only: the runner's wireproxy sidecar exposes it
# on 127.0.0.1 (docs/network/ci.md).
[groups.terraform.mikrotik]
title = "MikroTik"
root = "prod/mikrotik"
runner = "tnwks-ops-runner"
backend = "local"
lock = "mikrotik-terraform"
tf_vars = "TF_VAR_routeros_url=https://127.0.0.1:8443"
paths = [
  "infrastructure/terraform/environments/prod/mikrotik/**",
  "infrastructure/terraform/modules/mikrotik/**",
  "infrastructure/mikrotik/**",
  ".github/workflows/terraform.yaml",
]

# The controller is in-cluster on homelab-wsl, so only that site's runner
# reaches its Service.
[groups.terraform.unifi]
title = "UniFi"
root = "prod/unifi"
runner = "tnwks-ops-homelab-wsl"
backend = "local"
lock = "unifi-terraform"
tf_vars = "TF_VAR_unifi_url=https://unifi.networking.svc.cluster.local:8443"
enabled_var = "UNIFI_TERRAFORM_ENABLED"
paths = [
  "infrastructure/terraform/environments/prod/unifi/**",
  "infrastructure/terraform/modules/unifi/**",
  ".github/workflows/terraform.yaml",
]
