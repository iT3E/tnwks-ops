# Semantic Type
- name: type/patch
  color: "FFEC19"
- name: type/minor
  color: "FF9800"
- name: type/major
  color: "F6412D"
- name: type/break
  color: "F6412D"
# Renovate: never automerged, wakes Ori (.github/renovate/autoMerge.json5)
- name: impact/high
  color: "B60205"
# Renovate: a bad merge can't be undone by a revert. Ori prepares it, the owner
# approves it (.github/renovate/autoMerge.json5, docs/operations/renovate.md)
- name: impact/critical
  color: "000000"
# Ori left an impact/high PR open; renovate-review.yaml skips it until a new
# push or the label is removed (docs/operations/renovate.md)
- name: ori/blocked
  color: "5319E7"
# Ori prepared an impact/critical PR and is waiting for owner/approved
- name: ori/awaiting-approval
  color: "FBCA04"
# The owner approves the head commit Ori named in its "ready" comment. Cleared by
# any new push, so an approval never carries over to different code.
- name: owner/approved
  color: "0E8A16"
# Uncategorized
- name: bug
  color: "ee0701"
- name: do-not-merge
  color: "ee0701"
- name: docs
  color: "F4D1B7"
  # Renames GitHub's default label, keeping it on the old issues that use it
  aliases: ["documentation"]
- name: enhancement
  color: "84b6eb"
- name: broken-links
  color: "7B55D7"
- name: question
  color: "cc317c"
- name: community
  color: "0e8a16"
- name: skip-changelog
  color: "c5def5"
  description: "No Changie fragment needed (docs, CI-only, chores)"
