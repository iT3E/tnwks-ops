---
# actions/labeler v5+ requires array of config options per label
# (https://github.com/actions/labeler#match-object). Each entry is a
# match object; `changed-files: any-glob-to-any-file: [...]` is the
# v4-equivalent "any matching file" behavior.
area/ansible:
  - changed-files:
      - any-glob-to-any-file: "infrastructure/ansible/**/*"
area/github:
  - changed-files:
      - any-glob-to-any-file: ".github/**/*"
area/kubernetes:
  - changed-files:
      - any-glob-to-any-file: "kubernetes/**/*"
area/observability:
  - changed-files:
      - any-glob-to-any-file: "observability/**/*"
area/talos:
  - changed-files:
      - any-glob-to-any-file: "talos/**/*"
area/terraform:
  - changed-files:
      - any-glob-to-any-file: "infrastructure/terraform/**/*"
