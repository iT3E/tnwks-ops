---
name: "Meta Sync labels"

# The logic is in the reusable workflow it calls, from
# https://github.com/iT3E/github-workflows (README there documents inputs and
# check names), pinned to a release commit (@<sha> # vX.Y.Z) that Renovate
# moves.
#
# The repo's labels follow .github/labels.yaml; others are deleted.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [".github/labels.yaml"]

permissions: {}

jobs:
  labels:
    name: sync-labels
    permissions:
      contents: read
      issues: write
    uses: iT3E/github-workflows/.github/workflows/sync-labels.yaml@272d2c317d9541e4ff9aead33c5f15049a6dea41 # feat/shared-actions (pre-release)
