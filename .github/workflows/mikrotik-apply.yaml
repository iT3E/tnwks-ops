---
name: "MikroTik Apply"

# Applies the MikroTik root module on merge to main, from the self-hosted
# tnwks-ops-runner (docs/network/ci.md). Plan and apply run in one job, so
# what is applied is exactly the plan computed here.

on:
  push:
    branches:
      - main
    paths:
      - "infrastructure/terraform/environments/prod/mikrotik/**"
      - "infrastructure/terraform/modules/mikrotik/**"
      - "infrastructure/mikrotik/**"
      - ".github/actions/mikrotik-terraform/**"
      - ".github/workflows/mikrotik-*.yaml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mikrotik-terraform
  cancel-in-progress: false

jobs:
  apply:
    name: "MikroTik Apply"
    runs-on: tnwks-ops-runner
    timeout-minutes: 30
    # No reviewer gate: merging to main is the approval. The prod environment
    # only accepts deployments from protected branches.
    environment:
      name: prod
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Plan and apply
        uses: ./.github/actions/mikrotik-terraform
        with:
          mode: apply
          tf-api-token: ${{ secrets.TF_API_TOKEN }}
