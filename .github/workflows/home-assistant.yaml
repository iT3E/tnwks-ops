---
name: "Home Assistant"

# Validates the git-owned Home Assistant config against the exact image and
# custom-integration versions the cluster will run. Runs on any PR touching the
# app, so a Renovate bump of the image or an integration is checked against
# this config before merge (HA routinely renames trigger/condition keys and
# drops YAML options between releases).

on:
  # Called by ci.yaml when its domain in .github/ci/domains.toml changed.
  workflow_call:

permissions:
  contents: read

env:
  APP: kubernetes/apps/home-automation/home-assistant/app

jobs:
  check-config:
    name: check-config
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # configMapGenerator needs every file listed explicitly; a file that's
      # committed but not listed is silently never deployed.
      - name: Every config file is in a ConfigMap
        run: |
          listed="$(yq '.configMapGenerator[].files[]' "$APP/kustomization.yaml" | sort)"
          present="$(cd "$APP" && find config scripts -type f | sort)"
          if ! diff <(echo "$listed") <(echo "$present"); then
            echo "::error::$APP/kustomization.yaml configMapGenerator and the files under config/ + scripts/ differ (< listed only, > on disk only)."
            exit 1
          fi

      - name: Read pinned versions
        id: versions
        run: |
          init='.spec.values.controllers.home-assistant.initContainers.prepare-config'
          {
            echo "IMAGE=$(yq "$init.image | .repository + \":\" + .tag" "$APP/helmrelease.yaml")"
            yq "$init.env | to_entries | .[] | .key + \"=\" + .value" "$APP/helmrelease.yaml"
          } | tee -a "$GITHUB_ENV"
          # Cache key: the pinned versions and the script that installs them.
          echo "key=$({ yq "$init.env" "$APP/helmrelease.yaml"; cat "$APP/scripts/prepare-config.sh"; } | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Copy config
        run: |
          mkdir -p "$RUNNER_TEMP/config"
          cp -r "$APP/config/." "$RUNNER_TEMP/config/"

      # prepare-config.sh skips an integration whose .tnwks-version already
      # matches, so with the cache restored it downloads nothing. GitHub
      # archive and release downloads are the usual reason this job flakes.
      - name: Restore integrations
        id: integrations
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ha-integrations-${{ steps.versions.outputs.key }}
          path: |
            ${{ runner.temp }}/config/custom_components/auth_oidc
            ${{ runner.temp }}/config/custom_components/frigate
            ${{ runner.temp }}/config/custom_components/pacific_power
            ${{ runner.temp }}/config/custom_components/xiaomi_cloud_map_extractor
            ${{ runner.temp }}/config/www/advanced-camera-card
            ${{ runner.temp }}/config/www/kiosk-mode
            ${{ runner.temp }}/config/www/xiaomi-vacuum-map-card

      - name: Prepare config directory
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e HASS_OIDC_AUTH_VERSION -e FRIGATE_INTEGRATION_VERSION -e ADVANCED_CAMERA_CARD_VERSION -e KIOSK_MODE_VERSION \
            -e XIAOMI_MAP_EXTRACTOR_VERSION -e XIAOMI_VACUUM_MAP_CARD_VERSION -e PACIFIC_POWER_VERSION \
            -v "$RUNNER_TEMP/config:/config" \
            -v "$PWD/$APP/scripts/prepare-config.sh:/scripts/prepare-config.sh:ro" \
            --entrypoint /bin/bash "$IMAGE" /scripts/prepare-config.sh /config

      - name: Save integrations
        if: steps.integrations.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ha-integrations-${{ steps.versions.outputs.key }}
          path: |
            ${{ runner.temp }}/config/custom_components/auth_oidc
            ${{ runner.temp }}/config/custom_components/frigate
            ${{ runner.temp }}/config/custom_components/pacific_power
            ${{ runner.temp }}/config/custom_components/xiaomi_cloud_map_extractor
            ${{ runner.temp }}/config/www/advanced-camera-card
            ${{ runner.temp }}/config/www/kiosk-mode
            ${{ runner.temp }}/config/www/xiaomi-vacuum-map-card

      - name: Upstream Pacific Power compatibility
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$RUNNER_TEMP/config:/config:ro" -w /config \
            --entrypoint python3 "$IMAGE" -c \
            'from custom_components.pacific_power.config_flow import PacificPowerConfigFlow; from custom_components.pacific_power.coordinator import PacificPowerCoordinator; assert PacificPowerConfigFlow.VERSION >= 1'

      # check_config exits 0 even when the config is invalid, so fail on its
      # output: schema errors print an "Incorrect config" section, and
      # automations whose triggers can't be set up are logged as ERROR.
      # The env vars stand in for the ones helmrelease.yaml sets.
      - name: check_config
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e TZ=America/Los_Angeles \
            -e HASS_EXTERNAL_URL=https://hass.example.test \
            -e HASS_INTERNAL_URL=https://hass.internal.example.test \
            -e HASS_GRAFANA_URL=https://grafana.internal.example.test/ \
            -e HASS_OIDC_CLIENT_ID=ci \
            -e HASS_OIDC_DISCOVERY_URL=https://idp.example.test/.well-known/openid-configuration \
            -e FRIGATE_UI_URL=https://frigate.example.test \
            -e HASS_RECORDER_DB_URL=sqlite:////tmp/ci.db \
            -e HASS_LATITUDE=0 -e HASS_LONGITUDE=0 -e HASS_ELEVATION=0 \
            -e KITCHEN_ADULT1_NAME=Adult1 -e KITCHEN_ADULT2_NAME=Adult2 \
            -e KITCHEN_KID1_NAME=Kid1 -e KITCHEN_KID2_NAME=Kid2 \
            -v "$RUNNER_TEMP/config:/config" \
            --entrypoint python3 "$IMAGE" -m homeassistant --script check_config --config /config \
            2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee "$RUNNER_TEMP/check_config.log"
          if grep -qE '^(Incorrect config|Failed config)|^(ERROR|CRITICAL)' "$RUNNER_TEMP/check_config.log"; then
            echo "::error::Home Assistant check_config found problems (see log above)."
            exit 1
          fi

      - name: Solar credit integration tests
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/$APP/config/custom_components:/src/custom_components:ro" \
            -v "$PWD/$APP/tests:/tests:ro" \
            --entrypoint /bin/bash "$IMAGE" -c '
              set -euo pipefail
              python3 -m venv --system-site-packages /tmp/test-env
              /tmp/test-env/bin/python -c "import json, subprocess, sys; requirements=json.load(open(\"/src/custom_components/pacific_power_credits/manifest.json\"))[\"requirements\"]; subprocess.run([sys.executable, \"-m\", \"pip\", \"install\", \"--disable-pip-version-check\", *requirements], check=True)"
              cd /src
              PYTHONPATH=/src /tmp/test-env/bin/python -m unittest discover -s /tests -v
            '
