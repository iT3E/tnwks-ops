---
name: "CodeQL"

# Code scanning, advanced setup. It replaces the repository's default setup,
# which analysed seven languages (actions, c-cpp, go, javascript/typescript,
# python) on every PR and every push to main: about 780 runs a month, and
# half of the 10 GB Actions cache in CodeQL databases. The repo is YAML and
# HCL plus ~80 Python files; the C, Go and JS are one shim, one healthcheck
# binary and four small scripts. So: Python and the workflows themselves, on
# changes that touch them, and weekly on main. Default setup must stay off
# (Settings > Code security > CodeQL analysis), or uploads from here fail.
on:
  pull_request:
    paths: &paths
      - "**/*.py"
      - ".github/workflows/**"
      - ".github/actions/**"
  push:
    branches: [main]
    paths: *paths
  schedule:
    - cron: "27 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
