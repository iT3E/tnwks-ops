---
name: "Secret Scan"

# The logic is in the reusable workflow it calls, from
# https://github.com/iT3E/github-workflows (README there documents inputs and
# check names), pinned to a release commit (@<sha> # vX.Y.Z) that Renovate
# moves.
#
# betterleaks over the commits a PR (or a push to main) adds, with
# .betterleaks.toml and .betterleaksignore. The server-side twin of the
# pre-commit hook. Required by the main ruleset (check
# "betterleaks / betterleaks").
on:
  pull_request:
  push:
    branches: ["main"]
    # Release commits (CHANGELOG.md + .changes/ only) carry nothing new to
    # check: their fragments were checked in the PR that added them.
    paths-ignore: [CHANGELOG.md, .changes/**]

permissions: {}

jobs:
  betterleaks:
    name: betterleaks
    permissions:
      contents: read
    uses: iT3E/github-workflows/.github/workflows/secret-scan.yaml@317dd05ec8f5988a9a6f799a2119aba537b4bb16 # v1.4.2
