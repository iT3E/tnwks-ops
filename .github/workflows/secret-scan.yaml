---
name: "Secret Scan"

# Server-side twin of the pre-commit hook: runs whether or not the committer
# installed hooks. Scans only the commits a PR adds (or a push to main), with
# the repo's .betterleaks.toml and .betterleaksignore.

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  betterleaks:
    name: betterleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Determine commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "log_opts=--no-merges ${BASE_SHA}..HEAD" >> "$GITHUB_OUTPUT"
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "log_opts=-1" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=${BEFORE_SHA}..HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD":/repo:ro \
            ghcr.io/betterleaks/betterleaks:v1.9.0 \
            git /repo --config /repo/.betterleaks.toml --redact --no-banner \
            --log-opts="$LOG_OPTS"
