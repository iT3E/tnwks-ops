---
name: "Secret Scan"

# The logic is in the reusable workflow it calls, from
# https://github.com/iT3E/github-workflows (README there documents inputs and
# check names), pinned to a release commit (@<sha> # vX.Y.Z) that Renovate
# moves.
#
# betterleaks over the commits a PR (or a push to main or to a branch of
# the App of the main agent) adds, with .betterleaks.toml and
# .betterleaksignore. The server-side twin of the pre-commit hook. Required
# by the main ruleset (check "betterleaks / betterleaks").
on:
  pull_request:
  push:
    # agent/**: a branch of the App of the main agent is scanned on each
    # push, with or without a PR (the reusable workflow scans each commit
    # that the branch adds to main, with the config of main). No path
    # filter: a push of an agent branch with only fragments is scanned too,
    # and a release commit costs one short run.
    branches: ["main", "agent/**"]

permissions: {}

concurrency:
  # A new push to a PR cancels the run it supersedes. Pushes to main key on
  # the commit, so every one of them is checked.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  betterleaks:
    name: betterleaks
    permissions:
      contents: read
    uses: iT3E/github-workflows/.github/workflows/secret-scan.yaml@1060ac8fcc8d8d2462ca5096698304e64b904663 # v1.9.5
