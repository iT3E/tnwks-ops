---
name: "Actionlint"

# The logic is in the reusable workflow it calls, from
# https://github.com/iT3E/github-workflows (README there documents inputs and
# check names), pinned to a release commit (@<sha> # vX.Y.Z) that Renovate
# moves.
#
# actionlint (with shellcheck on run: blocks, and .github/actionlint.yaml)
# on the workflows, and zizmor (security audit, config in .github/zizmor.yml)
# on the workflows and local actions, and the repo's own workflow conventions
# (.github/scripts/workflow-conformance.py), whenever the workflows domain is
# on.
on:
  # Called by ci.yaml when its domain in .github/ci/domains.toml changed.
  workflow_call:

permissions: {}

jobs:
  actionlint:
    name: actionlint
    permissions:
      contents: read
    uses: iT3E/github-workflows/.github/workflows/actionlint.yaml@317dd05ec8f5988a9a6f799a2119aba537b4bb16 # v1.4.2

  zizmor:
    name: zizmor
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Findings show as annotations on the PR; no code-scanning upload.
          advanced-security: false
          annotations: true
          version: 1.31.1

  conformance:
    name: conformance
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Timeouts, runner labels, SHA pins, permissions, checkout credentials,
      # self-hosted jobs on PRs, and ci.yaml covering every domain.
      - name: Workflow conventions
        run: python3 .github/scripts/workflow-conformance.py
