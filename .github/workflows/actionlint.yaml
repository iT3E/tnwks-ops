---
name: "Actionlint"

# The logic is in the reusable workflow it calls, from
# https://github.com/iT3E/github-workflows (README there documents inputs and
# check names), pinned to a release commit (@<sha> # vX.Y.Z) that Renovate
# moves.
#
# actionlint (with shellcheck on run: blocks, and .github/actionlint.yaml)
# on the workflows, and zizmor (security audit, config in .github/zizmor.yml)
# on the workflows and local actions, and the workflow conventions
# (github-workflows' workflow-conformance action, plus this repo's ci.yaml
# check in .github/scripts/workflow-conformance.py), whenever the workflows
# domain is on.
on:
  # Called by ci.yaml when its domain in .github/ci/domains.toml changed.
  workflow_call:

permissions: {}

jobs:
  actionlint:
    name: actionlint
    permissions:
      contents: read
    uses: iT3E/github-workflows/.github/workflows/actionlint.yaml@447a36cf89cd163004fcf7b574955c6c6deb2f92 # v1.9.2

  zizmor:
    name: zizmor
    permissions:
      contents: read
    uses: iT3E/github-workflows/.github/workflows/zizmor.yaml@447a36cf89cd163004fcf7b574955c6c6deb2f92 # v1.9.2
    with:
      runs-on: ubuntu-26.04

  conformance:
    name: conformance
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Timeouts, runner labels, SHA pins, permissions, checkout credentials
      # and self-hosted jobs on PRs.
      - name: Workflow conventions
        uses: iT3E/github-workflows/actions/workflow-conformance@447a36cf89cd163004fcf7b574955c6c6deb2f92 # v1.9.2

      # This repo's own: ci.yaml covers every domain in .github/ci/domains.toml,
      # and each Terraform job masks SOPS values before Terraform runs and
      # takes the root's lock; a drift job plans only, then reports.
      - name: ci.yaml covers the domains
        run: python3 .github/scripts/workflow-conformance.py

      - name: Test the SOPS mask script
        run: python3 -m unittest discover -s .github/scripts -p test_sops_mask.py

      - name: Test the Terraform drift report
        run: python3 -m unittest discover -s .github/scripts -p test_terraform_drift.py

      - name: Test the privacy denylist edit and sync
        run: python3 -m unittest discover -s .github/scripts -p test_privacy_terms.py
