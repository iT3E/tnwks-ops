---
name: "Renovate review"

# Hands an impact/high Renovate PR to Ori's reviewer agent once the owner asks
# for it with the owner/review label. Nothing is reviewed automatically: each
# review costs model time, so the owner opts each PR in. The agent does
# whatever migration the bump needs and merges it, or leaves it open with a
# comment and the ori/blocked label. impact/critical PRs get the same review,
# but the agent stops at ori/awaiting-approval and merges only after the owner adds
# owner/approved. Everything that decides *whether* a PR gets reviewed lives
# here, in the open; the agent only does the review. See
# docs/operations/renovate.md.
#
#   select  (GitHub-hosted)  which PRs are eligible right now
#   review  (openclaw-hooks) POST /hooks/agent on the WSL gateway, wait for
#                            the run to finish, fail if it didn't end ok
#   review-platform          the same gates, then POST /runs on the run
#           (openclaw-hooks) receiver of the workflow agents; the answer is
#                            one comment on the PR, never a merge or a label
#
# The repository variable RENOVATE_REVIEW_ROUTE picks one review job:
# "platform" runs review-platform, and any other value (or none) runs
# review. Only the owner changes it, in Terraform (docs/operations/renovate.md,
# "The route of a review").
#
# A PR is eligible when it is open, opened by Renovate from this repo, labeled
# impact/high and owner/review, not labeled ori/blocked, not waiting on the
# owner (ori/awaiting-approval without owner/approved), and Build Success
# passed on its head. It is picked up the moment the last of those becomes true:
#   - the owner adds owner/review               (pull_request_target: labeled)
#   - Build Success finishes                    (workflow_run: CI)
#   - the owner removes ori/blocked             (pull_request_target: unlabeled)
#   - the owner adds owner/approved             (pull_request_target: labeled)
# A new push (Renovate's, or a migration commit from the agent) clears
# ori/blocked, ori/awaiting-approval and owner/approved, so each new head gets
# its own review and an approval never carries over to different code.
# A push from Renovate (a rebase or a newer version) also clears owner/review,
# so a PR that churns doesn't buy a review per push; the agent's own migration
# push keeps it, so the review it asked for still happens.
# The daily run re-sends anything still eligible (a review that failed, or
# one missed while the gateway was down).
#
# No job here checks out or runs PR code, so pull_request_target and
# workflow_run are safe: they run this file from main.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no PR code is checked out or run
    types: [labeled, unlabeled, synchronize, reopened]
  workflow_run: # zizmor: ignore[dangerous-triggers] reads only the run's PR number
    workflows: ["CI"]
    types: [completed]
    # Only Renovate's PR branches can be eligible; without this every
    # CI run (all PRs, every push to main) started a run here.
    branches: ["renovate/**"]
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number (empty: every eligible PR)"
        required: false
        type: string

permissions: {}

env:
  # OpenClaw gateway on the WSL host, as seen from the cluster's pod network
  # (the Talos docker bridge gateway).
  OPENCLAW_URL: "http://10.5.0.1:18789"
  # The run receiver of the workflow agents. Its network policy lets in the
  # runner pods of the openclaw-hooks scale set only.
  RUN_RECEIVER_URL: "http://run-receiver.agents-workflows.svc.cluster.local:8080"

jobs:
  select:
    name: "Select"
    runs-on: ubuntu-slim
    timeout-minutes: 10
    if: >-
      (github.event_name == 'pull_request_target' &&
        ((github.event.action == 'labeled' &&
           (github.event.label.name == 'owner/review' || github.event.label.name == 'owner/approved')) ||
         (github.event.action == 'unlabeled' && github.event.label.name == 'ori/blocked') ||
         github.event.action == 'synchronize' || github.event.action == 'reopened')) ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      checks: read
      pull-requests: write
    outputs:
      prs: ${{ steps.select.outputs.prs }}
    steps:
      - name: Clear review state on a new push
        if: >-
          github.event_name == 'pull_request_target' &&
          github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          clear=(ori/blocked ori/awaiting-approval owner/approved)
          # Renovate's pushes need a fresh go-ahead; the agent's (it pushes as
          # the owner) are part of the review the owner already asked for.
          if [[ "$SENDER" == "renovate[bot]" ]]; then clear+=(owner/review); fi
          for l in "${clear[@]}"; do
            if jq -e --arg l "$l" 'index($l)' <<<"$LABELS" >/dev/null; then
              gh api -X DELETE "repos/${REPO}/issues/${PR}/labels/${l/\//%2F}" --silent
              echo "#${PR}: cleared ${l}"
            fi
          done

      - name: Select eligible PRs
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ONE_PR: >-
            ${{ github.event.pull_request.number ||
                github.event.workflow_run.pull_requests[0].number ||
                inputs.pr }}
        run: |
          set -euo pipefail
          if [[ -n "${ONE_PR// /}" ]]; then
            candidates="${ONE_PR// /}"
          else
            candidates="$(gh pr list --repo "$REPO" --state open --label owner/review \
              --limit 100 --json number --jq '.[].number')"
          fi
          prs='[]'
          for n in $candidates; do
            [[ "$n" =~ ^[0-9]+$ ]] || { echo "::error::not a PR number: $n"; exit 1; }
            pr="$(gh api "repos/${REPO}/pulls/${n}")"
            state="$(jq -r .state <<<"$pr")"
            author="$(jq -r .user.login <<<"$pr")"
            head_repo="$(jq -r .head.repo.full_name <<<"$pr")"
            sha="$(jq -r .head.sha <<<"$pr")"
            labels="$(jq -c '[.labels[].name]' <<<"$pr")"
            why=""
            if [[ "$state" != open ]]; then why="state is $state"
            elif [[ "$author" != "renovate[bot]" ]]; then why="author is $author"
            elif [[ "$head_repo" != "$REPO" ]]; then why="head repo is $head_repo"
            elif ! jq -e 'index("impact/high")' <<<"$labels" >/dev/null; then why="no impact/high label"
            elif ! jq -e 'index("owner/review")' <<<"$labels" >/dev/null; then why="no owner/review label"
            elif jq -e 'index("ori/blocked")' <<<"$labels" >/dev/null; then why="labeled ori/blocked"
            elif jq -e 'index("ori/awaiting-approval") and (index("owner/approved") | not)' \
                <<<"$labels" >/dev/null; then why="waiting for owner/approved"
            else
              build="$(gh api "repos/${REPO}/commits/${sha}/check-runs?check_name=Build%20Success" \
                --jq '[.check_runs[] | .conclusion // .status] | first // "missing"')"
              [[ "$build" == success ]] || why="Build Success is $build on ${sha:0:7}"
            fi
            if [[ -n "$why" ]]; then
              echo "#${n}: skipped, ${why}"
              continue
            fi
            echo "#${n}: eligible at ${sha:0:7}"
            prs="$(jq -c --argjson n "$n" --arg sha "$sha" '. + [{pr: $n, sha: $sha}]' <<<"$prs")"
          done
          echo "prs=${prs}" >>"$GITHUB_OUTPUT"

  review:
    name: "Review #${{ matrix.pr }}"
    needs: select
    if: >-
      needs.select.outputs.prs != '[]' && needs.select.outputs.prs != '' &&
      vars.RENOVATE_REVIEW_ROUTE != 'platform'
    runs-on: openclaw-hooks
    # Holds the hook token (secret) and the Telegram destination (variables).
    # Deployments are limited to main, so a PR branch's copy of this file
    # can't read them.
    environment: openclaw-hooks
    permissions:
      pull-requests: read
    # Two events for the same PR (label + CI finishing) queue one review, not
    # two: a newer pending job replaces an older one for the same PR.
    concurrency:
      group: renovate-review-${{ matrix.pr }}
      cancel-in-progress: false
    # The agent's own turn timeout is 3600s; leave room for admission.
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.select.outputs.prs) }}
    steps:
      # The job may have queued behind another review. Skip if the PR moved on
      # in the meantime (merged, closed, new push, blocked, review request
      # withdrawn, or now waiting on the owner).
      - name: Still eligible
        id: still
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ matrix.pr }}
          SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          pr="$(curl -sS --fail-with-body -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/pulls/${PR}")"
          if jq -e --arg sha "$SHA" '.state == "open" and .head.sha == $sha and
              ([.labels[].name] | (index("ori/blocked") | not) and (index("owner/review") != null) and
                (index("ori/awaiting-approval") == null or index("owner/approved") != null))' \
              <<<"$pr" >/dev/null; then
            echo "go=true" >>"$GITHUB_OUTPUT"
          else
            echo "#${PR}: no longer eligible at ${SHA:0:7}, skipping"
            echo "go=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Hand the PR to the reviewer agent
        if: steps.still.outputs.go == 'true'
        env:
          OPENCLAW_HOOK_TOKEN: ${{ secrets.OPENCLAW_HOOK_TOKEN }}
          NOTIFY_CHANNEL: ${{ vars.OPENCLAW_NOTIFY_CHANNEL }}
          NOTIFY_ACCOUNT: ${{ vars.OPENCLAW_NOTIFY_ACCOUNT }}
          NOTIFY_TO: ${{ vars.OPENCLAW_NOTIFY_TO }}
          REPO: ${{ github.repository }}
          PR: ${{ matrix.pr }}
          SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          # The message is data only. The agent's instructions live in its
          # workspace, and it re-checks every gate above before acting.
          body="$(jq -n \
            --arg repo "$REPO" --argjson pr "$PR" --arg sha "$SHA" \
            --arg channel "$NOTIFY_CHANNEL" --arg account "$NOTIFY_ACCOUNT" --arg to "$NOTIFY_TO" \
            '{
              message: ({repo: $repo, pr: $pr, head_sha: $sha} | tojson),
              name: "renovate-review #\($pr)",
              agentId: "renovate",
              channel: $channel, accountId: $account, to: $to,
              waitForCompletion: true,
              timeoutSeconds: 3600
            }')"
          # Same PR and sha = same key, so a re-run replays the first run's
          # result instead of starting a second review.
          resp="$(curl -sS --fail-with-body --max-time 4000 \
            -H "Authorization: Bearer ${OPENCLAW_HOOK_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: renovate-review-${PR}-${SHA}" \
            --data "$body" "${OPENCLAW_URL}/hooks/agent")"
          jq . <<<"$resp"
          status="$(jq -r '.completion.status // "missing"' <<<"$resp")"
          delivered="$(jq -r '.completion.delivered // false' <<<"$resp")"
          if [[ "$status" != ok ]]; then
            echo "::error::#${PR}: review run ended with status ${status}"
            exit 1
          fi
          if [[ "$delivered" != true ]]; then
            echo "::warning::#${PR}: review finished but the Telegram summary was not delivered"
          fi

  review-platform:
    name: "Review #${{ matrix.pr }} (platform)"
    needs: select
    if: >-
      needs.select.outputs.prs != '[]' && needs.select.outputs.prs != '' &&
      vars.RENOVATE_REVIEW_ROUTE == 'platform'
    runs-on: openclaw-hooks
    # Holds the token of the run receiver (secret RUN_RECEIVER_TOKEN). Its
    # deployments are limited to main, so a PR branch's copy of this file
    # can't read it. No other job names this environment.
    environment: run-receiver
    permissions:
      pull-requests: read
    # The same group as the review job, so the two routes never overlap for
    # one PR.
    concurrency:
      group: renovate-review-${{ matrix.pr }}
      cancel-in-progress: false
    # 3 attempts of at most 41 minutes each: the Job deadline of the reviewer
    # (2400 s, agents.yaml) and the 60 s that the receiver adds.
    timeout-minutes: 135
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.select.outputs.prs) }}
    steps:
      - name: Still eligible
        id: still
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ matrix.pr }}
          SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          pr="$(curl -sS --fail-with-body -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/pulls/${PR}")"
          if jq -e --arg sha "$SHA" '.state == "open" and .head.sha == $sha and
              ([.labels[].name] | (index("ori/blocked") | not) and (index("owner/review") != null) and
                (index("ori/awaiting-approval") == null or index("owner/approved") != null))' \
              <<<"$pr" >/dev/null; then
            echo "go=true" >>"$GITHUB_OUTPUT"
          else
            echo "#${PR}: no longer eligible at ${SHA:0:7}, skipping"
            echo "go=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Ask the run receiver for a review
        if: steps.still.outputs.go == 'true'
        env:
          RUN_RECEIVER_TOKEN: ${{ secrets.RUN_RECEIVER_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ matrix.pr }}
          SHA: ${{ matrix.sha }}
        # .github/scripts/test_renovate_review_call.py runs this script against
        # a fake receiver.
        run: |
          set -euo pipefail
          # The retry rule of a caller (docs/apps/agent-platform.md, "Run
          # receiver"): the key of attempt n is renovate-review-<pr>-<sha7>-<n>,
          # a new attempt only after a failed (502) or timed out (504) answer,
          # and 3 attempts at the most for one head. A call with no answer, or
          # 503, goes again with the same key: it gets the same run.
          sha7="${SHA:0:7}"
          answer="${RUNNER_TEMP}/answer.json"
          # The token goes to curl in a header file (mode 0600, from mktemp),
          # never in an argument list or the log. printf is a builtin, so no
          # process gets the token as an argument. The file goes at the end.
          auth="$(mktemp "${RUNNER_TEMP}/receiver-auth.XXXXXX")"
          trap 'rm -f "$auth"' EXIT
          printf 'Authorization: Bearer %s\n' "$RUN_RECEIVER_TOKEN" >"$auth"
          unset RUN_RECEIVER_TOKEN
          # One call; its HTTP code, or 000 when there is no answer. A call
          # with no answer, or 503, goes again, 3 calls at the most.
          call() {
            local c try
            for try in 1 2 3; do
              c="$(curl -sS -o "$answer" -w '%{http_code}' -H "@${auth}" "$@")" || c=000
              [[ "$c" == 000 || "$c" == 503 ]] || break
              echo "#${PR}: no answer (${c}), call ${try} of 3" >&2
              if (( try < 3 )); then sleep 30; fi
            done
            echo "$c"
          }
          get() { call --max-time 30 "${RUN_RECEIVER_URL}/runs/$1"; }
          # One line for the log. The error text of a failed run stays out of
          # it: it is in the annotation workflow-agents/result of the Job.
          show() {
            jq -r --arg code "$1" '"HTTP \($code):", "status \(.status // "-"),",
              "job \(.job // "-"),", "review \(.output.status // "-"),",
              "verdict \(.output.verdict // "-"),", "comment \(.output.comment_url // "-"),",
              "reason \(.output.reason // "-")"' "$answer" 2>/dev/null | paste -sd ' ' ||
              echo "HTTP $1: the answer is not JSON"
          }

          # Where this head is. The Jobs of earlier attempts stay 7 days, so
          # the 3 attempts hold over all the runs of this workflow.
          n=1
          while (( n <= 3 )); do
            key="renovate-review-${PR}-${sha7}-${n}"
            code="$(get "$key")"
            case "$code" in
              404) break ;;
              202) break ;; # running: the call below joins it with the same key
              200) show "$code"; echo "#${PR}: ${key} ended well before; no new run"; exit 0 ;;
              502 | 504) show "$code"; n=$((n + 1)) ;;
              *) echo "::error::#${PR}: GET /runs/${key} answered ${code}"; exit 1 ;;
            esac
          done

          while (( n <= 3 )); do
            key="renovate-review-${PR}-${sha7}-${n}"
            body="$(jq -nc --arg repo "$REPO" --argjson pr "$PR" --arg sha "$SHA" --arg key "$key" \
              '{agent: "renovate-reviewer", input: {repo: $repo, pr: $pr, head_sha: $sha}, key: $key, wait: true}')"
            code="$(call --max-time 2520 -H "Content-Type: application/json" --data "$body" "${RUN_RECEIVER_URL}/runs")"
            # 202: the run has not ended. Read its state until it does, for 10
            # minutes at the most.
            for read in $(seq 1 20); do
              [[ "$code" == 202 ]] || break
              sleep 30
              code="$(get "$key")"
              if [[ "$code" == 000 || "$code" == 503 ]]; then
                echo "#${PR}: ${key}: no answer to read ${read} of 20"
                code=202
              fi
            done
            show "$code"
            case "$code" in
              200) exit 0 ;;
              502 | 504)
                echo "::warning::#${PR}: attempt ${n} of 3 at ${sha7} ended with ${code}"
                n=$((n + 1))
                ;;
              *) echo "::error::#${PR}: ${key} answered ${code}; no new attempt"; exit 1 ;;
            esac
          done
          echo "::error::#${PR}: 3 attempts at ${sha7} failed; no more attempts for this head"
          exit 1
