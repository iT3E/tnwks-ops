---
name: "Owner label"

# A required check of the main ruleset ("Owner label", from GitHub Actions).
# An impact/high PR passes only when the owner added owner/review, and an
# impact/critical PR only when the owner added owner/approved, after the push
# of its head commit. A label from a bot, a GitHub App or a workflow token
# fails it. Every other PR passes at once, so the automerge tiers keep
# merging. The rules and the logic are in .github/scripts/owner-label-check.py
# (docs/operations/renovate.md, docs/operations/ci.md).
#
# "edited" runs it again when the title, the body or the base of a PR
# changes: a PR of an App fails on a base that is not the default branch
# and on a skip instruction in its title or body, and a label of the owner
# counts only when it is newer than the last change of the base.
#
# pull_request_target runs main's copy of this file and of the script, so a
# PR can't change what decides. The job checks out only the script, from
# main, runs no PR code, holds no secret, and its token can only read. PR
# text (title, branch, label names) never reaches a shell: the script reads
# it from the API and prints it filtered.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] only main's script runs; no PR code is checked out or run
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]

permissions: {}

# One run at a time per PR, in event order; each reads the PR as it is then.
concurrency:
  group: owner-label-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  check:
    name: "Owner label"
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read # the script from main, and the activity API
      issues: read # the PR's issue events
      pull-requests: read # the PR
    steps:
      # No ref: pull_request_target checks out the default branch.
      - name: Checkout the script from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/owner-label-check.py
            .github/scripts/owner-label-requirements.txt
          sparse-checkout-cone-mode: false

      # The YAML parser of the content rule, pinned by hash (from main, like
      # the script). If it can not install, the check still runs: with no
      # parser it holds each pull request of the App that touches
      # kubernetes/, and every other pull request is decided as before.
      - name: Install the YAML parser
        continue-on-error: true
        run: |
          python3 -m venv "${RUNNER_TEMP}/owner-label"
          "${RUNNER_TEMP}/owner-label/bin/pip" install --quiet --disable-pip-version-check \
            --require-hashes --only-binary :all: --no-deps -r .github/scripts/owner-label-requirements.txt

      - name: Check who added the label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          python="${RUNNER_TEMP}/owner-label/bin/python"
          [[ -x "${python}" ]] || python=python3
          "${python}" -I .github/scripts/owner-label-check.py
