---
name: Dependency compatibility

on:
  # Called by ci.yaml when its domain in .github/ci/domains.toml changed.
  workflow_call:
  schedule:
    - cron: "17 18 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test compatibility signals and notification routing
        run: python3 -m unittest discover -s .github/scripts -p test_dependency_compatibility.py -v
      # The upstream report and its issues belong to this workflow's own
      # schedule and dispatch. Called from CI, the event is CI's (a push to
      # main included), and only the tests run.
      - name: Inspect current upstream evidence
        if: github.workflow == 'Dependency compatibility'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/dependency-compatibility.py --report compatibility-report.json
      - name: Save report
        if: github.workflow == 'Dependency compatibility'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-compatibility
          path: compatibility-report.json
          retention-days: 7

  notify:
    if: github.workflow == 'Dependency compatibility' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-compatibility
      - name: Publish only privacy-checked review issues
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
        run: >-
          python3 .github/scripts/dependency-compatibility.py
          --publish-report compatibility-report.json --repo "$GITHUB_REPOSITORY"
