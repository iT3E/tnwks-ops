---
name: "Privacy (comments)"

# The logic is in the reusable workflow it calls, from
# https://github.com/iT3E/github-workflows (README there documents inputs and
# check names), pinned to a release commit (@<sha> # vX.Y.Z) that Renovate
# moves.
#
# bin/privacy-check --text on comments, reviews and issues, right after
# they're posted: a comment with a hit is deleted, a review body replaced,
# an issue fails the run. Bots are skipped. PR titles and bodies are
# privacy.yaml; this stays a separate workflow so a skipped run here never
# stands in for the required privacy check on a PR head.
on:
  issue_comment: # zizmor: ignore[dangerous-triggers] no PR code is checked out or run; comment text is only read as data
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  issues:
    types: [opened, edited]

permissions: {}

jobs:
  text:
    name: privacy-text
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: iT3E/github-workflows/.github/workflows/privacy-text.yaml@4968e2ea41429e3b8e9b1e77f41d222a5ea01436 # v1.8.1
    secrets:
      PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
