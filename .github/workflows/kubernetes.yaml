---
name: "Kubernetes"

# Renders every Flux Kustomization and HelmRelease under kubernetes/ with flate
# (charts are fetched and templated, values are schema-checked), and checks
# that every container image a PR adds actually exists in its registry, and
# comments the rendered diff on the PR. Called by ci.yaml, whose Build Success
# needs it: a dependency bump that doesn't render or points at a missing tag
# never merges on its own.
on:
  # Called by ci.yaml when its domain in .github/ci/domains.toml changed.
  workflow_call:

permissions: {}

env:
  # renovate: datasource=github-releases depName=home-operations/flate
  FLATE_VERSION: "0.6.5"

jobs:
  flate:
    name: "Render"
    runs-on: ubuntu-26.04
    # A render takes well under a minute. Without a limit, a hung flate holds
    # the job (and the required check) for GitHub's 6-hour default. 15 leaves
    # room for a couple of hung attempts (flate-guard: 2 minutes each,
    # retried once).
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install flate
        uses: iT3E/github-workflows/actions/setup-flate@6abfc744ca16e7464b47890ccf230e00aa8670cd # v1.8.0
        with:
          version: ${{ env.FLATE_VERSION }}

      # -p kubernetes renders every app once, MS-01-only ones included. When
      # both clusters define a Flux Kustomization with the same name (frigate
      # has a WSL overlay), only one of them renders here, so the live
      # cluster also gets its own run below. flate aliases the flux-system
      # GitRepository to this checkout because its URL matches the origin
      # remote, so a cluster entrypoint renders this PR's tree.
      # flate-guard (installed by setup-flate) caps each attempt at 2 minutes (a render takes 1-10 s)
      # and retries a hang once, printing the process state and the tail of
      # flate's debug log first. A bare 5-minute timeout used to fail the
      # required check about 2% of the time on main with no evidence.
      # .github/flate/all.krmignore keeps out cluster entrypoints that render
      # on their own below (homelab-wsl-02), or their cluster-settings would
      # replace homelab-wsl's in this render.
      - name: Render all Kustomizations and HelmReleases
        run: flate-guard test all --no-progress -p kubernetes --krmignore .github/flate/all.krmignore

      - name: Render the live cluster (wsl) from its entrypoint
        run: flate-guard test all --no-progress -p kubernetes/clusters/wsl

      - name: Render homelab-wsl-02 from its entrypoint
        run: flate-guard test all --no-progress -p kubernetes/clusters/wsl-02

      # A Flux Alert event source only matches one namespace, so every
      # namespace with a HelmRelease needs its own entry, or its failures
      # never page the War Room.
      - name: Every HelmRelease namespace pages on failure
        run: |
          set -euo pipefail
          alert=kubernetes/apps/flux-system/addons/alerts/alertmanager.yaml
          missing=""
          for dir in kubernetes/apps/*/; do
            ns="$(basename "${dir}")"
            grep -rlq '^kind: HelmRelease' "${dir}" || continue
            grep -qE "^\s+namespace: ${ns}$" "${alert}" || missing="${missing} ${ns}"
          done
          if [ -n "${missing}" ]; then
            echo "::error file=${alert}::add HelmRelease event sources for:${missing}"
            exit 1
          fi

      # Per cluster, HEAD's rendered images minus BASE's (bin/images-added).
      # `flate diff images` returned nothing for an image changed inside an
      # existing HelmRelease, so Renovate tag bumps (#1648) and new
      # controllers (#1650) skipped "Image exists". Comparing full
      # `flate get images` lists catches them. Per cluster because -p
      # kubernetes renders the MS-01 frigate Kustomization without postBuild
      # substitution (#1451). MS-01 isn't live and has known render failures,
      # so it is compared on what does render, with a warning; a cluster in
      # BLOCKING_CLUSTERS must render fully. Plain manifest image: lines are
      # added too (#1448).
      - name: Images added by this PR
        id: images
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BLOCKING_CLUSTERS: wsl wsl-02
        run: |
          set -euo pipefail
          images="$(bin/images-added "origin/${BASE_REF}")"
          echo "${images}"
          {
            echo "images<<EOF"
            echo "${images}" | jq -c .
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  images:
    name: "Image exists"
    needs: flate
    if: github.event_name == 'pull_request' && needs.flate.outputs.images != '[]' && needs.flate.outputs.images != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: {}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        image: ${{ fromJSON(needs.flate.outputs.images) }}
    steps:
      # A tag can exist and still not be a container image: Acuvity pushes
      # its Helm chart into the image repo as tag 1.0.0 (#1485), and kubelet
      # can't run that. Reject manifests whose config isn't an image config,
      # and indexes with no platform entries.
      # A registry rate limit (ECR Public returns "toomanyrequests: Data
      # limit exceeded" to shared runner IPs) says nothing about the tag. On a
      # Renovate PR the tag came from Renovate's own lookup in that registry,
      # so a persistent throttle only warns there. Anyone else's PR fails.
      - name: Inspect manifest
        env:
          IMAGE: ${{ matrix.image }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          ref="${IMAGE}"
          # name:tag@sha256:... -> name@sha256:... (the digest is what gets pulled)
          if [[ "${ref}" == *@sha256:* ]]; then
            name="${ref%%@*}"; digest="${ref#*@}"
            [[ "${name##*/}" == *:* ]] && name="${name%:*}"
            ref="${name}@${digest}"
          fi
          throttled=false
          for attempt in 1 2 3 4; do
            if raw="$(skopeo inspect --raw "docker://${ref}" 2>err.txt)"; then
              kind="$(jq -r '
                if (.manifests | type) == "array" then
                  if any(.manifests[]; .platform.architecture? and .platform.architecture != "unknown")
                  then "image" else "index without platforms" end
                elif (.config.mediaType // "") | IN("application/vnd.oci.image.config.v1+json", "application/vnd.docker.container.image.v1+json")
                then "image"
                else "config " + (.config.mediaType // "missing") end' <<<"${raw}")"
              if [[ "${kind}" == image ]]; then
                echo "ok: ${ref}"; exit 0
              fi
              echo "::error::${IMAGE} is not a container image (${kind})"
              exit 1
            fi
            cat err.txt >&2
            grep -q toomanyrequests err.txt && throttled=true
            sleep $((attempt * 20))
          done
          if [[ "${throttled}" == true && "${PR_AUTHOR}" == "renovate[bot]" ]]; then
            echo "::warning::registry rate-limited every attempt; ${IMAGE} not verified (tag comes from Renovate's own registry lookup)"
            exit 0
          fi
          echo "::error::image not found or not pullable: ${IMAGE}"
          exit 1

  # What the PR changes in the rendered manifests, per live cluster, as one
  # sticky PR comment (.github/scripts/flate-diff-comment.py writes it,
  # github-workflows' sticky-comment posts it). Reviewers and the Renovate
  # reviewer read it. It informs and never blocks: both steps are
  # continue-on-error, so a failed diff or comment leaves Build Success green.
  # Fork PRs get a read-only token, so they're skipped.
  diff:
    name: "Rendered diff"
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install flate
        uses: iT3E/github-workflows/actions/setup-flate@6abfc744ca16e7464b47890ccf230e00aa8670cd # v1.8.0
        with:
          version: ${{ env.FLATE_VERSION }}

      - name: Diff
        id: diff
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/flate-diff-comment.py

      # A PR with no rendered changes gets no comment, or has its existing one
      # updated to say so.
      - name: Comment
        if: steps.diff.outcome == 'success'
        continue-on-error: true
        uses: iT3E/github-workflows/actions/sticky-comment@6abfc744ca16e7464b47890ccf230e00aa8670cd # v1.8.0
        with:
          marker: "<!-- flate-diff -->"
          body-file: ${{ runner.temp }}/flate-diff/comment.md
          only-update: ${{ steps.diff.outputs.changes != 'true' }}

      - name: Full diff
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flate-diff
          path: ${{ runner.temp }}/flate-diff
          if-no-files-found: ignore
          retention-days: 7
