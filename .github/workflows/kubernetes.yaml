---
name: "Kubernetes"

# Renders every Flux Kustomization and HelmRelease under kubernetes/ with flate
# (charts are fetched and templated, values are schema-checked), and checks
# that every container image a PR adds actually exists in its registry.
# "Build Success" is the single status Renovate's automerge waits on
# (.github/renovate/autoMerge.json5), so a dependency bump that doesn't render
# or points at a missing tag never merges on its own.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=github-releases depName=home-operations/flate
  FLATE_VERSION: "0.6.5"

jobs:
  flate:
    name: "Render"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install flate
        run: |
          set -euo pipefail
          base="https://github.com/home-operations/flate/releases/download/v${FLATE_VERSION}"
          tarball="flate_${FLATE_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSL "${base}/${tarball}.sha256" | awk '{print $1"  '"${tarball}"'"}' | sha256sum -c -
          tar -xzf "${tarball}" flate
          sudo install -m 0755 flate /usr/local/bin/flate

      # -p kubernetes renders every app once, MS-01-only ones included. When
      # both clusters define a Flux Kustomization with the same name (frigate
      # has a WSL overlay), only one of them renders here, so the live
      # cluster also gets its own run below. flate aliases the flux-system
      # GitRepository to this checkout because its URL matches the origin
      # remote, so a cluster entrypoint renders this PR's tree.
      - name: Render all Kustomizations and HelmReleases
        run: flate test all --no-progress -p kubernetes

      - name: Render the live cluster (wsl) from its entrypoint
        run: flate test all --no-progress -p kubernetes/clusters/wsl

      # A Flux Alert event source only matches one namespace, so every
      # namespace with a HelmRelease needs its own entry, or its failures
      # never page the War Room.
      - name: Every HelmRelease namespace pages on failure
        run: |
          set -euo pipefail
          alert=kubernetes/apps/flux-system/addons/alerts/alertmanager.yaml
          missing=""
          for dir in kubernetes/apps/*/; do
            ns="$(basename "${dir}")"
            grep -rlq '^kind: HelmRelease' "${dir}" || continue
            grep -qE "^\s+namespace: ${ns}$" "${alert}" || missing="${missing} ${ns}"
          done
          if [ -n "${missing}" ]; then
            echo "::error file=${alert}::add HelmRelease event sources for:${missing}"
            exit 1
          fi

      # Diffed per cluster. With -p kubernetes, changed-only mode picked the
      # MS-01 frigate Kustomization, which gets no postBuild substitution, so
      # ${SERVICE_MONITOR_ENABLED} reached the chart as a string and every
      # frigate PR failed here (#1451). MS-01 isn't live and has known render
      # failures, so its diff only warns. Add a cluster to BLOCKING_CLUSTERS
      # once it runs workloads.
      - name: Images added by this PR
        id: images
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BLOCKING_CLUSTERS: wsl
        run: |
          set -euo pipefail
          images='[]'
          for dir in kubernetes/clusters/*/; do
            cluster="$(basename "${dir}")"
            if out="$(flate diff images --no-progress --base "origin/${BASE_REF}" -p "${dir%/}" -o json)"; then
              images="$(jq -c --argjson add "${out}" '. + $add | unique' <<<"${images}")"
            elif [[ " ${BLOCKING_CLUSTERS} " == *" ${cluster} "* ]]; then
              echo "::error::flate diff images failed for cluster ${cluster}"
              exit 1
            else
              echo "::warning::flate diff images failed for cluster ${cluster} (not live, not blocking); its images are unchecked"
            fi
          done
          echo "${images}"
          {
            echo "images<<EOF"
            echo "${images}" | jq -c .
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  images:
    name: "Image exists"
    needs: flate
    if: github.event_name == 'pull_request' && needs.flate.outputs.images != '[]' && needs.flate.outputs.images != ''
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        image: ${{ fromJSON(needs.flate.outputs.images) }}
    steps:
      # A tag can exist and still not be a container image: Acuvity pushes
      # its Helm chart into the image repo as tag 1.0.0 (#1485), and kubelet
      # can't run that. Reject manifests whose config isn't an image config,
      # and indexes with no platform entries.
      # A registry rate limit (ECR Public returns "toomanyrequests: Data
      # limit exceeded" to shared runner IPs) says nothing about the tag. On a
      # Renovate PR the tag came from Renovate's own lookup in that registry,
      # so a persistent throttle only warns there. Anyone else's PR fails.
      - name: Inspect manifest
        env:
          IMAGE: ${{ matrix.image }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          ref="${IMAGE}"
          # name:tag@sha256:... -> name@sha256:... (the digest is what gets pulled)
          if [[ "${ref}" == *@sha256:* ]]; then
            name="${ref%%@*}"; digest="${ref#*@}"
            [[ "${name##*/}" == *:* ]] && name="${name%:*}"
            ref="${name}@${digest}"
          fi
          throttled=false
          for attempt in 1 2 3 4; do
            if raw="$(skopeo inspect --raw "docker://${ref}" 2>err.txt)"; then
              kind="$(jq -r '
                if (.manifests | type) == "array" then
                  if any(.manifests[]; .platform.architecture? and .platform.architecture != "unknown")
                  then "image" else "index without platforms" end
                elif (.config.mediaType // "") | IN("application/vnd.oci.image.config.v1+json", "application/vnd.docker.container.image.v1+json")
                then "image"
                else "config " + (.config.mediaType // "missing") end' <<<"${raw}")"
              if [[ "${kind}" == image ]]; then
                echo "ok: ${ref}"; exit 0
              fi
              echo "::error::${IMAGE} is not a container image (${kind})"
              exit 1
            fi
            cat err.txt >&2
            grep -q toomanyrequests err.txt && throttled=true
            sleep $((attempt * 20))
          done
          if [[ "${throttled}" == true && "${PR_AUTHOR}" == "renovate[bot]" ]]; then
            echo "::warning::registry rate-limited every attempt; ${IMAGE} not verified (tag comes from Renovate's own registry lookup)"
            exit 0
          fi
          echo "::error::image not found or not pullable: ${IMAGE}"
          exit 1

  status:
    name: "Build Success"
    if: ${{ !cancelled() }}
    needs: [flate, images]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Any job failed?
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "${RESULTS}"
          if echo "${RESULTS}" | grep -qE '"(failure|cancelled)"'; then exit 1; fi
