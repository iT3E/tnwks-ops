---
name: "Release"

# Cuts a release from the Changie fragments a merged PR added. Runs when a push
# to main touches .changes/unreleased/, and on demand to override the bump.
on:
  push:
    branches: ["main"]
    paths: [".changes/unreleased/**"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto follows the fragment kinds)"
        type: choice
        default: auto
        options: [auto, patch, minor, major]

permissions: {}

# One release at a time, in merge order.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CHANGIE_VERSION: "v1.26.0"
  # The first release, when no .changes/v*.md exists yet.
  FIRST_VERSION: "v1.0.0"

jobs:
  release:
    name: "Release"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The release commit lands on protected main, which GITHUB_TOKEN cannot
      # push to. A dedicated GitHub App, allowed to bypass the main ruleset,
      # does the push; its token is scoped to contents on this repo only.
      - name: Release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Pending fragments
        id: pending
        run: |
          if compgen -G ".changes/unreleased/*.yaml" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No unreleased fragments; nothing to release."
          fi

      - name: Next version
        id: next-auto
        if: steps.pending.outputs.found == 'true'
        uses: miniscruff/changie-action@3223cb29b92a0972dedc864ace3da01e04780ae4 # v3.0.1
        with:
          version: ${{ env.CHANGIE_VERSION }}
          args: next ${{ inputs.bump || 'auto' }}

      - name: Resolve version
        id: version
        if: steps.pending.outputs.found == 'true'
        env:
          NEXT: ${{ steps.next-auto.outputs.output }}
        run: |
          if compgen -G ".changes/v*.md" > /dev/null; then
            version="$NEXT"
          else
            version="$FIRST_VERSION"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Batch
        if: steps.pending.outputs.found == 'true'
        uses: miniscruff/changie-action@3223cb29b92a0972dedc864ace3da01e04780ae4 # v3.0.1
        with:
          version: ${{ env.CHANGIE_VERSION }}
          args: batch ${{ steps.version.outputs.version }}

      - name: Merge into CHANGELOG.md
        if: steps.pending.outputs.found == 'true'
        uses: miniscruff/changie-action@3223cb29b92a0972dedc864ace3da01e04780ae4 # v3.0.1
        with:
          version: ${{ env.CHANGIE_VERSION }}
          args: merge

      - name: Commit, tag, push
        if: steps.pending.outputs.found == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          bot_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add -A .changes CHANGELOG.md
          git commit -m "chore(release): ${VERSION}"
          # main can move between checkout and push (another merge landing).
          # The release commit only touches .changes/ and CHANGELOG.md, so
          # rebase onto the new tip and retry; tag only what was pushed.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::main kept moving; giving up after $attempt attempts"
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
          git tag -a "${VERSION}" -m "${VERSION}"
          git push origin "${VERSION}"

      - name: GitHub Release
        if: steps.pending.outputs.found == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "${VERSION}" --title "${VERSION}" \
            --notes-file ".changes/${VERSION}.md" --verify-tag
