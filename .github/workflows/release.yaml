---
name: "Release"

# The logic is in the reusable workflow it calls, from
# https://github.com/iT3E/github-workflows (README there documents inputs and
# check names), pinned to a release commit (@<sha> # vX.Y.Z) that Renovate
# moves.
#
# Cuts a release from the Changie fragments a merged PR added: batch them
# into .changes/<version>.md and CHANGELOG.md, commit, tag vX.Y.Z and
# publish a GitHub Release. Runs when a push to main touches
# .changes/unreleased/, and on demand to override the bump.
#
# The release commit lands on protected main, which GITHUB_TOKEN cannot push
# to. A dedicated GitHub App, allowed to bypass the main ruleset, does the
# push; its token is scoped to contents on this repo only. Nothing is built
# from a tag, so nothing is dispatched. The reusable job always requests
# actions: write, so it is granted here even though it goes unused.
on:
  push:
    branches: ["main"]
    paths: [".changes/unreleased/**"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto follows the fragment kinds)"
        type: choice
        default: auto
        options: [auto, patch, minor, major]

permissions: {}

# One release at a time, in merge order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    permissions:
      contents: write
      actions: write
    uses: iT3E/github-workflows/.github/workflows/release.yaml@282008593fefd7f0392c41c3127a630c091c3d1d # v1.4.1
    with:
      bump: ${{ inputs.bump || 'auto' }}
      first-version: v1.0.0
      build-workflow: ""
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
