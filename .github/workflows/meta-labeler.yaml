---
name: "Meta Labeler"

# The logic is in the reusable workflow it calls, from
# https://github.com/iT3E/github-workflows (README there documents inputs and
# check names), pinned to a release commit (@<sha> # vX.Y.Z) that Renovate
# moves.
#
# area/* labels from the paths a PR changes (.github/labeler.yaml).
on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions: {}

concurrency:
  # A new push to a PR cancels the run it supersedes. Pushes to main key on
  # the commit, so every one of them is checked.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  labeler:
    name: labeler
    permissions:
      contents: read
      pull-requests: write
    uses: iT3E/github-workflows/.github/workflows/labeler.yaml@272d2c317d9541e4ff9aead33c5f15049a6dea41 # feat/shared-actions (pre-release)
