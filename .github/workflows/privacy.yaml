---
name: "Privacy"

# The logic is in the reusable workflow it calls, from
# https://github.com/iT3E/github-workflows (README there documents inputs and
# check names), pinned to a release commit (@<sha> # vX.Y.Z) that Renovate
# moves.
#
# bin/privacy-check on every tracked file and path, the commits the event
# adds (messages and identities) and the PR title and body, against the
# PRIVACY_TERMS secret (synced from .github/privacy-terms.sops.yaml with
# `task privacy:sync`). Hits print as "term #N: path:line" without the
# matched text. The repo is public and fork PRs get no secrets, so a missing
# secret warns instead of failing. Comments and reviews are
# privacy-text.yaml. Exceptions: .github/privacy-allow. Required by the main
# ruleset (check "privacy / privacy").
on:
  pull_request:
    # edited: a changed title or body is checked again.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: ["main"]
    # Release commits (CHANGELOG.md + .changes/ only) carry nothing new to
    # check: their fragments were checked in the PR that added them.
    paths-ignore: [CHANGELOG.md, .changes/**]

permissions: {}

jobs:
  privacy:
    name: privacy
    permissions:
      contents: read
    uses: iT3E/github-workflows/.github/workflows/privacy.yaml@317dd05ec8f5988a9a6f799a2119aba537b4bb16 # v1.4.2
    with:
      allow-missing-terms: true
    secrets:
      PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
