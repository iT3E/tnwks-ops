---
name: "Terraform Plan"

on:
  pull_request:
    branches:
      - main
    paths:
      - "infrastructure/terraform/environments/prod/aws/**"
      - "infrastructure/terraform/modules/aws/**"

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

# A newer push to the same PR supersedes an in-flight plan.
concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_CLOUD_ORGANIZATION: "tnwks-ops"
  TF_WORKSPACE: "tnwks-ops-aws-prod"

jobs:
  # Trusted: a PR opened by the owner from a branch in this repo. Keyed on the
  # PR's author and source repo rather than github.actor, which is whoever
  # triggered this particular event.
  terraform:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'iT3E'
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Plan
        uses: ./.github/actions/tfc-speculative-plan
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Everyone else waits for a reviewer in the external-contributions
  # environment. Fork PRs receive no repository secrets under pull_request, so
  # for them this job cannot reach Terraform Cloud even once approved: it gates
  # same-repo branches from other collaborators.
  terraform-manual-approval:
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.user.login != 'iT3E'
    name: "Terraform Plan External User"
    environment:
      name: external-contributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Plan
        uses: ./.github/actions/tfc-speculative-plan
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
