---
name: Observability
on:
  pull_request:
    paths:
      - observability/**
      - kubernetes/**
      - bin/site-failover-apps.json
      - .github/workflows/observability.yaml
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: observability/uv.lock
      - name: Install pinned toolchain
        run: uv sync --project observability --locked --python 3.13
      - name: Generated resources and evidence contracts
        run: |
          uv run --project observability python observability/generate.py --check
          uv run --project observability ruff check observability
          uv run --project observability pytest observability/tests -q
          uv run --project observability python observability/validate.py
          uv run --project observability python observability/validate_health.py
      - name: Schema-check inactive Helm workloads
        run: |
          curl -fsSL https://bjw-s-labs.github.io/helm-charts/other/app-template-3.7.3.tgz \
            -o "$RUNNER_TEMP/observability-app-template.tgz"
          uv run --project observability python observability/validate.py \
            --chart "$RUNNER_TEMP/observability-app-template.tgz"
      - name: Render maintained Grafana and authenticated renderer
        run: |
          curl -fsSL https://github.com/grafana-community/helm-charts/releases/download/grafana-14.4.0/grafana-14.4.0.tgz \
            -o "$RUNNER_TEMP/observability-grafana.tgz"
          uv run --project observability python observability/validate_grafana.py \
            --chart "$RUNNER_TEMP/observability-grafana.tgz"
      - name: Recording rules and failure fixtures
        run: |
          docker run --rm --network none --entrypoint /bin/promtool \
            --mount type=bind,src="$PWD/observability/generated",dst=/rules,readonly \
            prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2 \
            test rules /rules/rule-tests.yaml
      - name: Disposable Garage and Thanos acceptance
        run: uv run --project observability python observability/rehearse_archive.py
      - name: Disposable Grafana provisioning and browser acceptance
        run: |
          uv run --project observability playwright install --with-deps chromium
          uv run --project observability python observability/rehearse_grafana.py --browser --renderer
