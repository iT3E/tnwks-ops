---
name: "Changelog"

# The logic is in the reusable workflow it calls, from
# https://github.com/iT3E/github-workflows (README there documents inputs and
# check names), pinned to a release commit (@<sha> # vX.Y.Z) that Renovate
# moves.
#
# Every PR adds a Changie fragment (`changie new`), unless it is labeled
# skip-changelog, comes from a dependency bot, or changes nothing outside
# exempt-paths. Day-to-day Home Assistant tuning (automations, dashboards,
# helpers under its config/ dir) changes how the house behaves, not the
# platform, so it shouldn't cut a release. Anything else in the PR,
# including HA's helmrelease.yaml or scripts/, still needs a fragment.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

concurrency:
  # A new push to a PR cancels the run it supersedes. Pushes to main key on
  # the commit, so every one of them is checked.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changelog:
    name: changelog
    permissions:
      contents: read
    uses: iT3E/github-workflows/.github/workflows/changelog.yaml@49f998b9ac2a57f441c9380cce88bfcd9abf7ffa # v1.9.3
    with:
      exempt-paths: |
        kubernetes/apps/home-automation/home-assistant/app/config/
