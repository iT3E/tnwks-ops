---
name: "Changelog"

# Every PR adds a Changie fragment (`changie new`), unless it is labeled
# skip-changelog, comes from a dependency bot, or only touches Home
# Assistant's own config (see "Fragment required?").
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  changelog:
    name: "changelog"
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'skip-changelog') &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Day-to-day Home Assistant tuning (automations, dashboards, helpers
      # under its config/ dir) changes how the house behaves, not the
      # platform, so it shouldn't cut a release. Anything else in the PR —
      # including HA's helmrelease.yaml or scripts/ — still needs a fragment.
      - name: Fragment required?
        id: need
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qv '^kubernetes/apps/home-automation/home-assistant/app/config/'; then
            echo "Only Home Assistant config/ changed; no fragment needed."
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fragment present
        if: steps.need.outputs.required == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          added="$(git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD -- '.changes/unreleased/*.yaml')"
          if [ -z "$added" ]; then
            echo "::error::No Changie fragment. Run 'changie new' and commit the file under .changes/unreleased/, or label the PR skip-changelog."
            exit 1
          fi
          echo "Fragments:"; echo "$added"

      - name: Fragments are valid
        if: steps.need.outputs.required == 'true'
        uses: miniscruff/changie-action@3223cb29b92a0972dedc864ace3da01e04780ae4 # v3.0.1
        with:
          version: "v1.26.0"
          args: batch auto --dry-run
