---
name: "Terraform Apply"

on:
  push:
    branches:
      - main
    paths:
      - "infrastructure/terraform/environments/prod/aws/**"
      - "infrastructure/terraform/modules/aws/**"

permissions: {}

# Applies to one workspace run strictly one at a time, in merge order.
concurrency:
  group: terraform-apply-tnwks-ops-aws-prod
  cancel-in-progress: false

env:
  TF_CLOUD_ORGANIZATION: "tnwks-ops"
  TF_WORKSPACE: "tnwks-ops-aws-prod"

jobs:
  terraform:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    # No reviewer gate: merging to main is the approval. The prod environment
    # only accepts deployments from protected branches (main), so its secrets
    # and this apply cannot run from any other ref.
    environment:
      name: prod
    permissions:
      contents: read
    env:
      TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Upload Configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        id: apply-upload
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          directory: "infrastructure/terraform"

      - name: Create Apply Run
        uses: hashicorp/tfc-workflows-github/actions/create-run@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        id: apply-run
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          configuration_version: ${{ steps.apply-upload.outputs.configuration_version_id }}

      - name: Apply
        uses: hashicorp/tfc-workflows-github/actions/apply-run@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        if: fromJSON(steps.apply-run.outputs.payload).data.attributes.actions.IsConfirmable
        id: apply
        with:
          run: ${{ steps.apply-run.outputs.run_id }}
          comment: "Apply Run from GitHub Actions CI ${{ github.sha }}"
