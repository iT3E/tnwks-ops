---
name: Security regressions

on:
  pull_request:
    paths:
      - infrastructure/edgeos/**
      - kubernetes/apps/auth/onboard/**
      - kubernetes/apps/monitoring/flow-collector/**
      - kubernetes/apps/selfhosted/immich/sync/**
      - kubernetes/apps/selfhosted/kitchen-screensaver/**
      - observability/pyproject.toml
      - observability/uv.lock
      - .github/workflows/security-regressions.yaml
  # Saves the observability uv cache on main whenever the lock changes;
  # PR runs here and in Observability restore it.
  push:
    branches: [main]
    paths: [observability/pyproject.toml, observability/uv.lock]
  workflow_dispatch:

permissions: {}

concurrency:
  # A new push to a PR cancels the run it supersedes. Pushes to main key on
  # the commit, so every one of them is checked.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  regressions:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          # PR caches are scoped to their PR and no other PR can read them;
          # saving one per PR evicted the main entries every PR restores from.
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
          cache-dependency-glob: observability/uv.lock
      - name: Install the existing pinned Python and browser toolchain
        run: uv sync --project observability --locked --python 3.13
      - name: Router output and service regressions (synthetic data only)
        run: |
          uv run --project observability python -m unittest discover -s infrastructure/edgeos/tools/tests -v
          uv run --project observability python -m unittest discover -s kubernetes/apps/monitoring/flow-collector/app/tests -v
          uv run --project observability python -m unittest discover -s kubernetes/apps/selfhosted/immich/sync/tests -v
          uv run --project observability python -m unittest discover -s kubernetes/apps/selfhosted/kitchen-screensaver/app/tests -v
      - name: OAuth callback browser regressions
        run: |
          uv run --project observability playwright install --with-deps chromium
          uv run --project observability python -m unittest discover -s kubernetes/apps/auth/onboard/app/tests -v
