---
name: Terraform
description: >-
  Plan (and optionally apply) one root under infrastructure/terraform/environments
  with local execution: state in the root's TFC workspace, secrets from its
  SOPS file via the runner's CI age key. Used for every root except AWS, which
  runs remotely in TFC (.github/actions/tfc-speculative-plan). This repo is
  public, so job logs are too: the plan body is never printed, only counts and
  the addresses that change, and on failure only Terraform's error blocks.
inputs:
  root:
    description: "Root module path under infrastructure/terraform/environments, e.g. prod/cloudflare"
    required: true
  mode:
    description: "plan or apply"
    required: true
  tf-api-token:
    description: Terraform Cloud token (state for the root's workspace)
    required: true
  tf-vars:
    description: >-
      Extra input variables, one TF_VAR_<name>=<value> per line: endpoint
      overrides that only hold on the runner (the wireproxy end of the wg03
      tunnel, an in-cluster Service). Not for secrets.
    required: false
    default: ""
outputs:
  summary:
    description: Markdown summary of the plan
    value: ${{ steps.plan.outputs.summary }}
  changes:
    description: "true if the plan has changes"
    value: ${{ steps.plan.outputs.changes }}
runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: v1.17.1
        terraform_wrapper: false

    - name: Variables
      shell: bash
      env:
        TF_VARS: ${{ inputs.tf-vars }}
      run: |
        # Checked here, read by each step below (no GITHUB_ENV).
        : > "$RUNNER_TEMP/tf-vars"
        while IFS= read -r line; do
          [ -z "$line" ] && continue
          if [[ ! "$line" =~ ^TF_VAR_[A-Za-z0-9_]+=.+$ ]]; then
            echo "::error::tf-vars line is not TF_VAR_<name>=<value>: ${line%%=*}"
            exit 1
          fi
          printf 'export %q\n' "$line" >> "$RUNNER_TEMP/tf-vars"
        done <<< "$TF_VARS"

    - name: Init
      shell: bash
      working-directory: infrastructure/terraform/environments/${{ inputs.root }}
      env:
        TF_TOKEN_app_terraform_io: ${{ inputs.tf-api-token }}
      run: |
        terraform init -input=false -no-color > "$RUNNER_TEMP/init.log" 2>&1 || {
          grep -E '^(│|Error)' "$RUNNER_TEMP/init.log" || tail -5 "$RUNNER_TEMP/init.log"; exit 1; }

    - name: Plan
      id: plan
      shell: bash
      working-directory: infrastructure/terraform/environments/${{ inputs.root }}
      env:
        TF_TOKEN_app_terraform_io: ${{ inputs.tf-api-token }}
        TF_IN_AUTOMATION: "true"
      run: |
        # shellcheck disable=SC1091
        . "$RUNNER_TEMP/tf-vars"
        set +e
        terraform plan -input=false -no-color -lock-timeout=5m -detailed-exitcode \
          -out="$RUNNER_TEMP/tfplan" > "$RUNNER_TEMP/plan.log" 2>&1
        rc=$?
        set -e
        if [ "$rc" -eq 1 ]; then
          grep -E '^(│|Error)' "$RUNNER_TEMP/plan.log" || tail -5 "$RUNNER_TEMP/plan.log"
          exit 1
        fi
        # Moves (moved blocks) are no-op changes with a previous_address; list
        # them too, since a moves-only plan still needs an apply.
        terraform show -json "$RUNNER_TEMP/tfplan" | jq -r '
          [.resource_changes[]? | select(.change.actions != ["no-op"])] as $c
          | [.resource_changes[]? | select(.previous_address != null and .previous_address != .address)] as $m
          | "**Plan:** \($c | map(select(.change.actions | index("create"))) | length) to add, "
            + "\($c | map(select(.change.actions == ["update"])) | length) to change, "
            + "\($c | map(select(.change.actions | index("delete"))) | length) to destroy, "
            + "\($m | length) to move",
            "",
            ($c[] | "- `\(.change.actions | join("/"))` \(.address)"),
            ($m[] | "- `move` \(.previous_address) -> \(.address)")
        ' > "$RUNNER_TEMP/summary.md"
        echo "changes=$([ "$rc" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        {
          echo 'summary<<EOF_SUMMARY'
          cat "$RUNNER_TEMP/summary.md"
          echo 'EOF_SUMMARY'
        } >> "$GITHUB_OUTPUT"
        cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
        cat "$RUNNER_TEMP/summary.md"

    - name: Apply
      if: inputs.mode == 'apply' && steps.plan.outputs.changes == 'true'
      shell: bash
      working-directory: infrastructure/terraform/environments/${{ inputs.root }}
      env:
        TF_TOKEN_app_terraform_io: ${{ inputs.tf-api-token }}
        TF_IN_AUTOMATION: "true"
      run: |
        # shellcheck disable=SC1091
        . "$RUNNER_TEMP/tf-vars"
        terraform apply -input=false -no-color -lock-timeout=5m "$RUNNER_TEMP/tfplan" \
          > "$RUNNER_TEMP/apply.log" 2>&1 || {
          grep -E '^(│|Error)' "$RUNNER_TEMP/apply.log" || tail -5 "$RUNNER_TEMP/apply.log"; exit 1; }
        grep -E '^Apply complete' "$RUNNER_TEMP/apply.log" | tee -a "$GITHUB_STEP_SUMMARY"
