---
name: Set up flate
description: >-
  Installs a pinned flate release (https://github.com/home-operations/flate)
  to /usr/local/bin after checking its published SHA-256.
inputs:
  version:
    description: flate version without the leading v (the caller pins it, with a Renovate comment)
    required: true
runs:
  using: composite
  steps:
    - name: Install flate
      shell: bash
      env:
        FLATE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        base="https://github.com/home-operations/flate/releases/download/v${FLATE_VERSION}"
        tarball="flate_${FLATE_VERSION}_linux_amd64.tar.gz"
        cd "${RUNNER_TEMP}"
        # Release downloads from GitHub occasionally fail (curl 22) in CI.
        curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "${base}/${tarball}"
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 "${base}/${tarball}.sha256" \
          | awk '{print $1"  '"${tarball}"'"}' | sha256sum -c -
        tar -xzf "${tarball}" flate
        sudo install -m 0755 flate /usr/local/bin/flate
