---
# MS-01 only: the TalosUpgrade. WSL nodes are Docker containers, which Talos
# won't upgrade in place.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tuppr-talos
  namespace: flux-system
spec:
  dependsOn:
    - name: tuppr
  path: ./kubernetes/apps/system-upgrade/tuppr/talos
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
