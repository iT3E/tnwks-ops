---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes/clusters/wsl/apps
  prune: true
  wait: false
  dependsOn:
    - name: cluster-meta
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # No cluster-secrets here: this build reads the ks.yaml of the children
  # outside the class, and none of its files needs a key of that Secret.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      # Runtime switchover (docs/wsl/multi-site.md, "Switching an app"): last,
      # so it wins. Never in git: `task failover` creates it, and an alert
      # fires when one lives longer than a day.
      - kind: ConfigMap
        name: site-overrides
        optional: true
  # Each child gets the reduced Secret cluster-secrets-apps (the keys that
  # the children outside the class use, kubernetes/apps/flux-system/
  # substitution); the second patch gives the children of the class the full
  # cluster-secrets. The admission policy flux-child-scope refuses
  # cluster-secrets in a Kustomization outside the class.
  patches:
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          decryption:
            provider: sops
            secretRef:
              name: sops-age
          postBuild:
            substituteFrom:
              - kind: ConfigMap
                name: cluster-settings
              - kind: Secret
                name: cluster-secrets-apps
              # Runtime switchover (docs/wsl/multi-site.md, "Switching an app"): last,
              # so it wins. Never in git: `task failover` creates it, and an alert
              # fires when one lives longer than a day.
              - kind: ConfigMap
                name: site-overrides
                optional: true
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        labelSelector: substitution.flux.home.arpa/disabled notin (true)
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          postBuild:
            substituteFrom:
              - kind: ConfigMap
                name: cluster-settings
              - kind: Secret
                name: cluster-secrets
              - kind: ConfigMap
                name: site-overrides
                optional: true
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        labelSelector: substitution.flux.home.arpa/disabled notin (true)
        # The direct children of the class.
        # BEGIN classlist.py: written by classlist.py write, do not edit by hand.
        name: actions-runner-controller|actions-runner-controller-monitoring|agent-sandbox|agents-admission|agents-finance-agent|agents-finance-checks|agents-finance-firefly-mcp|agents-finance-sandbox-gateway|agents-finance-vault-backup|agents-finance-vault-server|agents-finance-vault-share|agents-main-agent|agents-main-checks|agents-main-cluster-mcp|agents-main-fetch-proxy|agents-main-flux-mcp|agents-main-github-mcp|agents-main-github-token|agents-main-host-mcp|agents-main-read-access|agents-main-sandbox-gateway|agents-main-terraform-mcp|agents-main-vault-backup|agents-main-vault-server|agents-main-vault-share|agents-monitoring|agents-pilot-agent|agents-pilot-checks|agents-pilot-sandbox-gateway|agents-workflows-checks|agents-workflows-run-admission|agents-workflows-run-receiver|agents-workflows-sandbox-gateway|alertmanager|alloy|aws-backup-credentials|blackbox-exporter|cert-manager|cert-manager-issuers|cert-manager-prometheusrules|cilium|cilium-bgp|cilium-clustermesh|cilium-config|cloudflared|cloudnative-pg-app|cloudnative-pg-cluster-prometheusrules|cloudnative-pg-plugin-barman-cloud|coe-runner|descheduler|device-access|finance-sync-db|firefly-db|flow-collector|flux-admission|flux-alerts|flux-substitution|flux-webhooks|frigate|grafana|grafana-db|hajimari|home-assistant-db|ingress-nginx|ingress-nginx-certificates|ingress-nginx-internal|ingress-nginx-internal-shared-vip|k8s-gateway|kopiur|kopiur-agents-finance-repository|kopiur-agents-main-repository|kopiur-agents-repository|kopiur-policies|kopiur-repository|kopiur-standby-repository|kube-prometheus-stack|kube-prometheus-stack-addons|litellm|litellm-db|local-path-provisioner|loki|mcp-gateway|mealie-db|metrics-server|mktxp|model-bridge|nfs-admission|nfs-server|node-exporter|oauth2-proxy|observability-dashboards|observability-evidence|observability-pki|observability-rules|observability-storage-check|onboard|openclaw-hooks-runner|packing-api-db|packing-api-runner|plausible-db|plausible-exporter|playwright-mcp|pushgatewa