---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The admission policies of NFS volumes (docs/apps/agent-platform.md, "NFS
# volumes and admission"): which pods and PersistentVolumes may mount the
# NFS server of this cluster (nfs-server-ks.yaml). Its objects are
# cluster-scoped, so this Kustomization sets no targetNamespace; the
# bindings select each namespace. homelab-wsl only, like the server.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nfs-admission
  namespace: flux-system
spec:
  path: ./kubernetes/apps/storage/nfs-server/admission
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
