---
# Cilium on homelab-wsl, installed next to Flannel for an in-place move
# (research note 2026-11-06-flannel-to-cilium-rehearsal). The shared
# HelmRelease, plus:
#   - its own pod range (cluster-pool IPAM, 10.46.0.0/16), so Flannel's
#     10.42 pods and Cilium's pods coexist;
#   - native routing for that range only. Every pod is on Cilium now, so the
#     migration-only settings are gone and the shared datapath applies:
#     kube-proxy replacement, BPF masquerade and host routing, policy
#     enforcement.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  path: ./kubernetes/apps/kube-system/cilium/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  patches:
    - target:
        kind: HelmRelease
        name: cilium
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: cilium
        spec:
          values:
            ipam:
              mode: cluster-pool
              operator:
                clusterPoolIPv4PodCIDRList: ["10.46.0.0/16"]
                clusterPoolIPv4MaskSize: 24
            ipv4NativeRoutingCIDR: 10.46.0.0/16
