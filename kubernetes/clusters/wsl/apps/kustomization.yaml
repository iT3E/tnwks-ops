---
# WSL cluster apps: shared namespaces, with trimmed overlays for any
# namespace that excludes apps not viable on Docker-mode Talos.
#
# CNI: Cilium, like every cluster (moved in place from Flannel on
# 2026-11-06; cluster-pool IPAM on 10.46.0.0/16 from cluster-settings).
#
# Trimmed (per-namespace overlay below):
#   - home-automation  (zwave-js-ui kept, USB passthrough required)
#   - networking       (cloudflared kept; see overlay for tunnel notes)
#   - production       (frigate kept, USB passthrough required; uisp excluded)
#
# Excluded entirely:
#   - storage          (Rook Ceph needs real disks; WSL uses local-path)
#   - vpn              (replaced with per-pod gluetun sidecars — see
#                       kubernetes/apps/media/qbittorrent for the pattern)
#
# Storage-class portability: app manifests should reference
# ${STORAGE_CLASS_DEFAULT} / ${STORAGE_CLASS_BULK} via cluster-settings,
# not hardcoded ssd-pool / cephfs / s3://. Where Ceph-only features (S3
# backup, RGW buckets) appear, they're gated by per-cluster flags.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Shared namespaces — used as-is
  - ../../../apps/ai
  # The agent platform (docs/apps/agent-platform.md): this cluster only, so it
  # is listed here and not in apps/ai/kustomization.yaml, which MS-01 reads.
  - ../../../apps/ai/agents
  # The model bridge of the agent platform, next to the model gateway. This
  # cluster only, for the same reason.
  - ../../../apps/ai/model-bridge/ks.yaml
  - ../../../apps/auth
  - ../../../apps/cache
  - ../../../apps/cert-manager
  - ../../../apps/databases
  - ../../../apps/default
  # Backup tooling: the Roles Anywhere -> STS refresher for barman-cloud and
  # kopiur (docs/operations/backups.md).
  - ../../../apps/kopiur-system
  # homelab-wsl-02's kopiur repository, read-only: PVCs coming back from it.
  - ../../../apps/kopiur-system/kopiur/peer-repository-ks.yaml
  # Weekly restore of the other site's newest snapshots into this site's standby PVCs.
  - ../../../apps/kopiur-system/standby-restore/ks.yaml
  # Fence a warm app's Postgres when its site lease names this site.
  - ../../../apps/databases/site-lease-fence/ks.yaml
  - ../../../apps/flux-system
  - ../../../apps/kube-system
  # CNI: Cilium (shared HelmRelease; IPAM mode and pool from cluster-settings).
  - ../../../apps/kube-system/cilium/ks.yaml
  # The CA shared with the other WSL cluster, for Cluster Mesh.
  - ../../../apps/kube-system/cilium/clustermesh-ks.yaml
  # LoadBalancer IPs: the LB IPAM pool and L2 announcements (no MetalLB).
  - ../../../apps/kube-system/cilium/config-ks.yaml
  # BGP to the distro's FRR (role wsl_site_routing) and the shared VIP pool.
  - ../../../apps/kube-system/cilium/bgp-ks.yaml
  - ../../../apps/kube-system/local-path-provisioner/ks.yaml
  - ../../../apps/media
  - ../../../apps/monitoring
  # Job pods' logs to Loki (VECTOR_AGENT_POD_SELECTOR in cluster-settings).
  - ../../../apps/monitoring/vector/ks-agent.yaml
  - ../../../apps/monitoring/observability-pki/ks.yaml
  - ../../../apps/monitoring/observability-evidence/ks.yaml
  - ../../../apps/monitoring/observability-evidence/rules-ks.yaml
  - ../../../apps/monitoring/pyrra/ks.yaml
  - ../../../apps/monitoring/grafana/dashboards-ks.yaml
  - ../../../apps/monitoring/thanos-metrics/ks.yaml
  - ../../../apps/monitoring/observability-storage/ks.yaml
  # The security platform's namespace (kubernetes/apps/security/README.md):
  # baseline Pod Security, deny by default. Its apps join one by one.
  - ../../../apps/security/namespace.yaml
  # Trivy Operator (kubernetes/apps/security/trivy-operator/README.md): the
  # checks of this cluster and of its images, with the values of
  # homelab-wsl-02. Its two series of the security registry go to
  # homelab-wsl-02 through peer-federate there.
  - ../../../apps/security/trivy-operator/ks.yaml
  - ../../../apps/selfhosted
  # Immich (photo library for the kitchen screensaver): WSL-only, its library
  # sits on local-path-bulk. See docs/apps/immich.md.
  - ../../../apps/selfhosted/immich/ks.yaml
  # ImmichFrame (the kitchen display's screensaver), next to Immich. See
  # docs/apps/immichframe.md.
  - ../../../apps/selfhosted/immichframe/ks.yaml
  # Kitchen screensaver page (what the display's screensaver shows now;
  # ImmichFrame stays as the fallback). See docs/apps/kitchen-screensaver.md.
  - ../../../apps/selfhosted/kitchen-screensaver/ks.yaml
  - ../../../apps/system-upgrade
  - ../../../apps/tools
  # Sites platform — WSL-only. The NFS server gives nginx + the GHA runner a
  # shared RWX volume on top of WSL's RWO-only local-path. On MS-01 this would
  # be CephFS RWX instead, so it's wired per-cluster rather than in the shared
  # groups. (nginx itself lives in the production overlay below.)
  - ../../../apps/storage/namespace.yaml
  # nfs-server: WSL-specific ks with a nodeSelector pin to worker-2 (the only
  # node local-path can provision on). See nfs-server-ks.yaml.
  - ./nfs-server-ks.yaml
  - ../../../apps/tools/actions-runner-controller/controller/ks.yaml
  - ../../../apps/tools/actions-runner-controller/runner/ks.yaml
  # Network-device Terraform runners for this repo (docs/network/ci.md).
  - ../../../apps/tools/actions-runner-controller/ops-runner/ks.yaml
  # Ansible runners for the Windows host and its WSL distro
  # (docs/operations/ansible.md).
  - ../../../apps/tools/actions-runner-controller/ansible-runner/ks.yaml
  # Hands impact/high Renovate PRs to Ori (docs/operations/renovate.md).
  - ../../../apps/tools/actions-runner-controller/openclaw-runner/ks.yaml
  # Checks of the private docs repo when its CI_RUNNER variable names it.
  - ../../../apps/tools/actions-runner-controller/coe-runner/ks.yaml

  # Trimmed namespaces — per-namespace overlays sit alongside this file
  - ./home-automation
  - ./networking
  - ./production
# The shared `databases/postgres` cluster is retired here: every app has its own
# (kubernetes/components/cnpg-cluster). Its last base backup and WAL stay in S3
# under cnpg/homelab-wsl/. homelab-ms-01 (down) still lists it.
patches:
  # Prometheus on its own disk on C: (docs/operations/observability-implementation.md).
  # The class only exists on worker-1. No subPath: kubelet would create it
  # root-owned, and hostPath volumes ignore fsGroup.
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: kube-prometheus-stack
        namespace: flux-system
      spec:
        patches:
          - target:
              kind: HelmRelease
              name: kube-prometheus-stack
            patch: |-
              - op: add
                path: /spec/values/prometheus/prometheusSpec/nodeSelector
                value:
                  kubernetes.io/hostname: homelab-wsl-worker-1
              - op: replace
                path: /spec/values/prometheus/prometheusSpec/storageSpec
                value:
                  disableMountSubPath: true
                  volumeClaimTemplate:
                    spec:
                      storageClassName: local-path-observability
                      accessModes: [ReadWriteOnce]
                      resources:
                        requests:
                          storage: 19Gi
              - op: replace
                path: /spec/values/prometheus/prometheusSpec/retention
                value: 15d
              - op: replace
                path: /spec/values/prometheus/prometheusSpec/retentionSize
                value: 15GB
  - patch: |-
      $patch: delete
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: cloudnative-pg-cluster
        namespace: flux-system
