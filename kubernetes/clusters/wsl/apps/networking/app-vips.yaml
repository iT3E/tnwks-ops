---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oauth2-ingress-vip
  namespace: flux-system
spec:
  dependsOn:
    - name: oauth2-proxy
    - name: cilium-bgp
    - name: ingress-nginx-internal
  path: ./kubernetes/apps/networking/ingress-nginx-internal/app-vip
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      APP_INGRESS_VIP_NAME: oauth2-ingress-vip
      APP_INGRESS_VIP_IP: "10.10.95.12"
  interval: 30m
  retryInterval: 1m
  timeout: 5m
