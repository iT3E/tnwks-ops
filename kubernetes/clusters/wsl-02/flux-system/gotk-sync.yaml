# Not generated by `flux bootstrap`: the repo is public, so Flux pulls it
# over HTTPS with no deploy key, and nothing writes to main. Applied once by
# infrastructure/ansible/playbooks/04-flux-install.yml; Flux owns it after.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  url: https://github.com/iT3E/tnwks-ops
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/clusters/wsl-02
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
