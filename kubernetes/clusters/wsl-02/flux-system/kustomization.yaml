apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- .gitkeep
- gotk-components.yaml
- gotk-sync.yaml
# Add SOPS decryption to the bootstrap-generated flux-system Kustomization
# so cluster-secrets.sops.yaml gets decrypted before being applied as a Secret
# (otherwise the Secret keeps the ENC[...] strings and substituteFrom in
# downstream Kustomizations templates the encrypted text into manifests).
# The root stays on sops-age in step 2d of docs/operations/flux-lockdown.md:
# it moves to the class key (step 2d-root) once the children of the class
# decrypt with that key, as it must decrypt its own build to apply a revert.
patches:
- patch: |-
    - op: add
      path: /spec/decryption
      value:
        provider: sops
        secretRef:
          name: sops-age
  target:
    group: kustomize.toolkit.fluxcd.io
    kind: Kustomization
    name: flux-system
# The root runs as kustomize-controller, with the rights of today
# (docs/operations/flux-lockdown.md, step 2b). Each Kustomization of the
# class names that account too (observability/tests/test_flux_lockdown.py).
- patch: |-
    - op: add
      path: /spec/serviceAccountName
      value: kustomize-controller
  target:
    group: kustomize.toolkit.fluxcd.io
    kind: Kustomization
    name: flux-system
# The flux-system Namespace is owned by cluster-apps
# (kubernetes/apps/flux-system/namespace.yaml). Two Kustomizations applying it
# would keep relabelling it, so drop it from this build.
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: Namespace
    metadata:
      name: flux-system
# No remote base or resource in any build of kustomize-controller: a URL in
# a kustomization outside the "ask first" class would bring in any manifest,
# an admission object among them, which the admission policy of the Flux
# children can not see (docs/operations/flux-admission.md). No build of the
# clusters uses one (observability/tests/test_flux_admission.py checks it).
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --no-remote-bases=true
  target:
    group: apps
    kind: Deployment
    name: kustomize-controller
# Flux owns its CRDs now. Never let a prune remove them (deleting a CRD
# deletes every object of that kind) if this directory ever drops out of the
# build.
- patch: |-
    - op: add
      path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1prune
      value: disabled
  target:
    kind: CustomResourceDefinition
