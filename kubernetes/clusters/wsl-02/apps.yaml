---
# Not "cluster-apps" like the other clusters: flate (Kubernetes CI) renders
# one Kustomization per name across kubernetes/, and a second cluster-apps
# would replace homelab-wsl's (and its postBuild settings) in that render.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-wsl-02
  namespace: flux-system
spec:
  # Of the class: it runs as kustomize-controller, with the rights of today
  # (docs/operations/flux-lockdown.md, step 2b). So does each of its direct
  # children of the class, by the last patch below.
  serviceAccountName: kustomize-controller
  interval: 30m
  path: ./kubernetes/clusters/wsl-02/apps
  prune: true
  wait: false
  dependsOn:
    - name: cluster-meta-wsl-02
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # No cluster-secrets here: this build reads the ks.yaml of the children
  # outside the class, and none of its files needs a key of that Secret.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      # Runtime switchover (docs/wsl/multi-site.md, "Switching an app"): last,
      # so it wins. Never in git: `task failover` creates it, and an alert
      # fires when one lives longer than a day.
      - kind: ConfigMap
        name: site-overrides
        optional: true
  # Each child gets the reduced Secret cluster-secrets-apps (the keys that
  # the children outside the class use, kubernetes/apps/flux-system/
  # substitution); the second patch gives the children of the class the full
  # cluster-secrets. The admission policy flux-child-scope refuses
  # cluster-secrets in a Kustomization outside the class.
  patches:
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          decryption:
            provider: sops
            secretRef:
              name: sops-age
          postBuild:
            substituteFrom:
              - kind: ConfigMap
                name: cluster-settings
              - kind: Secret
                name: cluster-secrets-apps
              # Runtime switchover (docs/wsl/multi-site.md, "Switching an app"): last,
              # so it wins. Never in git: `task failover` creates it, and an alert
              # fires when one lives longer than a day.
              - kind: ConfigMap
                name: site-overrides
                optional: true
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        labelSelector: substitution.flux.home.arpa/disabled notin (true)
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          postBuild:
            substituteFrom:
              - kind: ConfigMap
                name: cluster-settings
              - kind: Secret
                name: cluster-secrets
              - kind: ConfigMap
                name: site-overrides
                optional: true
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        labelSelector: substitution.flux.home.arpa/disabled notin (true)
        # The direct children of the class.
        # BEGIN classlist.py: written by classlist.py write, do not edit by hand.
        name: actions-runner-controller|actions-runner-controller-monitoring|agents-main-cluster-mcp-site2|agents-main-flux-mcp-site2|agents-main-read-access-site2|agents-main-site2-services|alertmanager|aws-backup-credentials|cert-manager|cert-manager-issuers|cilium|cilium-bgp|cilium-clustermesh|cilium-config|cloudnative-pg-app|cloudnative-pg-plugin-barman-cloud|finance-sync-db|firefly-db|flux-accounts|flux-admission|flux-substitution|grafana|grafana-db|home-assistant-db|ingress-nginx-certificates|ingress-nginx-internal|ingress-nginx-internal-shared-vip|kopiur|kopiur-policies|kopiur-repository|kopiur-standby-repository|kube-prometheus-stack|kube-prometheus-stack-addons|local-path-provisioner|loki|mealie-db|metrics-server|node-exporter|observability-dashboards|observability-evidence|observability-garage|observability-pki|observability-rules|plausible-db|pyrra|pyrra-crds|qbittorrent|reloader|security-api-checks|security-aws-credentials|security-converter|security-loki-proxy|security-prowler|security-registry-rules|security-trail-copy|security-trivy-operator|security-wazuh|security-wazuh-accounts|security-wazuh-server|security-wazuh-settings|site-lease-fence|standby-restore|thanos-metrics|thanos-metrics-archive|tnwks-ops-runner|transcriber-db|unifi|unifi-inform-vip|unpoller|vector-agent|vector-aggregator|vector-audit-reader
