---
# Not "cluster-apps" like the other clusters: flate (Kubernetes CI) renders
# one Kustomization per name across kubernetes/, and a second cluster-apps
# would replace homelab-wsl's (and its postBuild settings) in that render.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-wsl-02
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes/clusters/wsl-02/apps
  prune: true
  wait: false
  dependsOn:
    - name: cluster-meta-wsl-02
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
      # Runtime switchover (docs/wsl/multi-site.md, "Switching an app"): last,
      # so it wins. Never in git: `task failover` creates it, and an alert
      # fires when one lives longer than a day.
      - kind: ConfigMap
        name: site-overrides
        optional: true
  patches:
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          decryption:
            provider: sops
            secretRef:
              name: sops-age
          postBuild:
            substituteFrom:
              - kind: ConfigMap
                name: cluster-settings
              - kind: Secret
                name: cluster-secrets
              # Runtime switchover (docs/wsl/multi-site.md, "Switching an app"): last,
              # so it wins. Never in git: `task failover` creates it, and an alert
              # fires when one lives longer than a day.
              - kind: ConfigMap
                name: site-overrides
                optional: true
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        labelSelector: substitution.flux.home.arpa/disabled notin (true)
