---
# homelab-wsl-02's off-site heartbeat (healthchecks.io check homelab-wsl-02).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: healthchecks-heartbeat
  namespace: flux-system
spec:
  path: ./kubernetes/clusters/wsl-02/apps/heartbeat
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 3m
