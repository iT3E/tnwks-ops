---
# homelab-wsl-02 apps. Starts with the platform only; apps join one by one
# (each a ks.yaml from kubernetes/apps, like the trimmed overlays of
# kubernetes/clusters/wsl/apps). A shared ks.yaml whose app has *.sops.yaml
# files needs this cluster's age key on them first (.sops.yaml).
#
# Public DNS names are Terraform's (environments/prod/cloudflare/public-dns.tf);
# there is no external-dns any more.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Namespaces. flux-system is owned here, not by flux-system/ (its
  # kustomization.yaml drops the Namespace from that build).
  - ../../../apps/flux-system/namespace.yaml
  - ../../../apps/kube-system/namespace.yaml
  # CNI and LoadBalancer IPs (Cilium LB IPAM + L2), instead of Flannel and
  # MetalLB on homelab-wsl.
  - ../../../apps/kube-system/cilium/ks.yaml
  - ../../../apps/kube-system/cilium/config-ks.yaml
  # Storage: this cluster's node names (see the file).
  - ./local-path-provisioner-ks.yaml
  - ../../../apps/kube-system/metrics-server/ks.yaml
  # Monitoring of this cluster: Prometheus (kube-prometheus-stack) and
  # Alertmanager to the War Room, alerts labelled cluster=homelab-wsl-02.
  - ../../../apps/monitoring/namespace.yaml
  - ./alertmanager-ks.yaml
  - ../../../apps/monitoring/kube-prometheus-stack/ks.yaml
  - ../../../apps/monitoring/node-exporter/ks.yaml
  # Certificates: cert-manager with the Let's Encrypt DNS-01 issuers, and the
  # wildcard certificates the ingress controllers use (internal and public).
  - ../../../apps/cert-manager/namespace.yaml
  - ../../../apps/cert-manager/cert-manager/ks.yaml
  - ../../../apps/networking/namespace.yaml
  - ../../../apps/networking/ingress-nginx/ks.yaml
  # *.internal.tnwks.us on ${INGRESS_INTERNAL_ADDR} (10.6.0.200).
  - ../../../apps/networking/ingress-nginx-internal/ks.yaml
  # The CNPG operator and the barman-cloud plugin, for per-app clusters
  # (kubernetes/components/cnpg-cluster).
  - ../../../apps/databases/namespace.yaml
  - ../../../apps/databases/cloudnative-pg/ks.yaml
  # Backup credentials: certificate -> STS session for barman-cloud and kopiur
  # (role tnwks-rolesanywhere-backups-wsl-02: read the bucket, write only
  # homelab-wsl-02's prefixes).
  - ../../../apps/kopiur-system/namespace.yaml
  - ./aws-backup-credentials-ks.yaml
  # kopiur: its own repository (KOPIUR_PREFIX) and homelab-wsl's, read-only.
  - ../../../apps/kopiur-system/kopiur/ks.yaml
  - ./kopiur-standby-ks.yaml
# Parts of those shared ks.yaml files that don't run here (yet):
#   - PrometheusRules: no kube-prometheus-stack on this cluster.
#   - ingress-nginx (public): waits for this cluster's own cloudflared tunnel.
#   - cloudnative-pg-cluster: homelab-wsl's shared `postgres` cluster; apps
#     get their own clusters here.
patches:
  - patch: |-
      $patch: delete
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: cert-manager-prometheusrules
        namespace: flux-system
  # kube-prometheus-stack here: no extra scrape jobs (homelab-wsl scrapes both
  # Windows hosts and alerts on them), a smaller Prometheus, and only the
  # cluster-level addon alerts (monitoring-addons/).
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: kube-prometheus-stack
        namespace: flux-system
      spec:
        patches:
          - target:
              kind: HelmRelease
              name: kube-prometheus-stack
            patch: |-
              - op: replace
                path: /spec/values/prometheus/prometheusSpec/additionalScrapeConfigs
                value: []
              - op: replace
                path: /spec/values/prometheus/prometheusSpec/resources
                value:
                  requests:
                    cpu: 100m
                    memory: 1Gi
                  limits:
                    memory: 2Gi
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: kube-prometheus-stack-addons
        namespace: flux-system
      spec:
        path: ./kubernetes/clusters/wsl-02/apps/monitoring-addons
  # kopiur's snapshot policies are homelab-wsl's apps; they come here with
  # the apps.
  - patch: |-
      $patch: delete
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: kopiur-policies
        namespace: flux-system
  # kopiur's PrometheusRule and ServiceMonitor need the Prometheus operator's
  # CRDs (kube-prometheus-stack), so it waits for them.
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: kopiur
        namespace: flux-system
      spec:
        dependsOn:
          - name: kube-prometheus-stack
  - patch: |-
      $patch: delete
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: ingress-nginx
        namespace: flux-system
  - patch: |-
      $patch: delete
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: cloudnative-pg-cluster
        namespace: flux-system
  - patch: |-
      $patch: delete
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: cloudnative-pg-cluster-prometheusrules
        namespace: flux-system
