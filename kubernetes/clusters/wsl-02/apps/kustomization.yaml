---
# homelab-wsl-02 apps. Starts with the platform only; apps join one by one
# (each a ks.yaml from kubernetes/apps, like the trimmed overlays of
# kubernetes/clusters/wsl/apps). A shared ks.yaml whose app has *.sops.yaml
# files needs this cluster's age key on them first (.sops.yaml).
#
# Public DNS names are Terraform's (environments/prod/cloudflare/public-dns.tf);
# there is no external-dns any more.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Namespaces. flux-system is owned here, not by flux-system/ (its
  # kustomization.yaml drops the Namespace from that build).
  - ../../../apps/flux-system/namespace.yaml
  - ../../../apps/kube-system/namespace.yaml
  # CNI and LoadBalancer IPs (Cilium LB IPAM + L2), instead of Flannel and
  # MetalLB on homelab-wsl.
  - ../../../apps/kube-system/cilium/ks.yaml
  # The CA shared with the other WSL cluster, for Cluster Mesh.
  - ../../../apps/kube-system/cilium/clustermesh-ks.yaml
  - ../../../apps/kube-system/cilium/config-ks.yaml
  # BGP to the distro's FRR (role wsl_site_routing) and the shared VIP pool.
  - ../../../apps/kube-system/cilium/bgp-ks.yaml
  # Storage: this cluster's node names (see the file).
  - ./local-path-provisioner-ks.yaml
  - ../../../apps/kube-system/metrics-server/ks.yaml
  # Restarts workloads annotated reloader.stakater.com/auto when their
  # ConfigMaps or Secrets change (the evidence collector, mosquitto, Grafana).
  - ../../../apps/kube-system/reloader/ks.yaml
  # Apps (one at a time, docs/wsl/multi-site.md). playwright-mcp: stateless,
  # the pilot of moving an app to homelab-wsl-02.
  - ../../../apps/ai/namespace.yaml
  - ../../../apps/ai/playwright-mcp/ks.yaml
  # Monitoring of this cluster: Prometheus (kube-prometheus-stack) and
  # Alertmanager to the War Room, alerts labelled cluster=homelab-wsl-02.
  - ../../../apps/monitoring/namespace.yaml
  - ../../../apps/monitoring/observability-pki/ks.yaml
  - ../../../apps/monitoring/observability-evidence/ks.yaml
  - ../../../apps/monitoring/observability-evidence/rules-ks.yaml
  # The control series and the alerts of the security registry
  # (security/README.md). On this cluster only: the security platform's home.
  - ../../../apps/monitoring/security-registry/ks.yaml
  - ../../../apps/monitoring/pyrra/ks.yaml
  - ../../../apps/monitoring/thanos-metrics/ks.yaml
  - ../../../apps/monitoring/thanos-metrics/archive-ks.yaml
  - ./observability-garage-ks.yaml
  # The TLS proxy in front of this site's Loki, the store of the security
  # streams: the path on which homelab-wsl writes them.
  - ../../../apps/monitoring/security-loki-proxy/ks.yaml
  - ./alertmanager-ks.yaml
  - ../../../apps/monitoring/kube-prometheus-stack/ks.yaml
  - ../../../apps/monitoring/node-exporter/ks.yaml
  # Its own Grafana, so losing site 1 doesn't lose the dashboards (patched below).
  - ../../../apps/monitoring/grafana/ks.yaml
  - ../../../apps/monitoring/grafana/dashboards-ks.yaml
  # Job pods' logs (VECTOR_AGENT_POD_SELECTOR): agent -> vector-aggregator ->
  # this site's Loki, so a failed CronJob's output outlives its pod. Its own
  # Loki, like its own Grafana: site 1 may be the thing that's down.
  - ../../../apps/monitoring/loki/ks.yaml
  - ../../../apps/monitoring/vector/ks.yaml
  - ../../../apps/monitoring/vector/ks-agent.yaml
  # Follows the UniFi controller (UNIFI_REPLICAS).
  - ../../../apps/monitoring/unpoller/ks.yaml
  # Certificates: cert-manager with the Let's Encrypt DNS-01 issuers, and the
  # wildcard certificates the ingress controllers use (internal and public).
  - ../../../apps/cert-manager/namespace.yaml
  - ../../../apps/cert-manager/cert-manager/ks.yaml
  - ../../../apps/networking/namespace.yaml
  - ../../../apps/networking/ingress-nginx/ks.yaml
  # *.internal.tnwks.us on ${INGRESS_INTERNAL_ADDR} (10.6.0.200).
  - ../../../apps/networking/ingress-nginx-internal/ks.yaml
  # The internal ingress on the shared VIPs 10.10.95.10 and .200 (BGP).
  - ../../../apps/networking/ingress-nginx-internal/shared-vip-ks.yaml
  # UniFi controller: deployed here at 0 to move it (bin/site-failover
  # "unifi"). The APs reach whichever site the router's `unifi` record names.
  - ../../../apps/networking/unifi/ks.yaml
  # The CNPG operator and the barman-cloud plugin, for per-app clusters
  # (kubernetes/components/cnpg-cluster).
  - ../../../apps/databases/namespace.yaml
  - ../../../apps/databases/cloudnative-pg/ks.yaml
  # Warm standbys of homelab-wsl's apps: the app at 0 replicas
  # (MEALIE_REPLICAS) and its database a replica cluster (cnpg-standby).
  - ../../../apps/production/namespace.yaml
  - ../../../apps/production/mealie/ks.yaml
  - ../../../apps/production/transcriber/ks.yaml
  - ../../../apps/production/changedetection/ks.yaml
  # Public request/invite apps: at 0 here until they move (bin/site-failover).
  - ../../../apps/production/ombi/ks.yaml
  - ../../../apps/production/ombi-f/ks.yaml
  - ../../../apps/production/wizarr/ks.yaml
  # Jellyfin: at 0 here until it moves; its library here is an empty bulk volume.
  - ../../../apps/production/jellyfin/ks.yaml
  # Plausible: its Postgres as a replica of homelab-wsl's, the app at 0.
  - ../../../apps/selfhosted/plausible/ks.yaml
  # Firefly and finance-sync: warm standby (databases replicas, app at 0).
  - ../../../apps/production/firefly/ks.yaml
  - ../../../apps/production/finance-sync/ks.yaml
  # Home Assistant: warm standby (database replica, the app at 0). No Z-Wave or
  # USB here: a failover runs it without those integrations.
  - ../../../apps/home-automation/namespace.yaml
  - ../../../apps/home-automation/home-assistant/ks.yaml
  # The MQTT broker at 0 (MOSQUITTO_REPLICAS), and MQTT on the shared VIP.
  - ../../../apps/home-automation/mosquitto/ks.yaml
  - ../../../apps/home-automation/mosquitto/shared-vip-ks.yaml
  # The media stack, deployed at 0 to move here (MEDIA_REPLICAS).
  - ../../../apps/media
  # Immich and the kitchen display, deployed at 0 to move here (IMMICH_REPLICAS).
  - ../../../apps/selfhosted/namespace.yaml
  - ../../../apps/selfhosted/immich/ks.yaml
  - ../../../apps/selfhosted/immichframe/ks.yaml
  - ../../../apps/selfhosted/kitchen-screensaver/ks.yaml
  # Backup credentials: certificate -> STS session for barman-cloud and kopiur
  # (role tnwks-rolesanywhere-backups-wsl-02: read the bucket, write only
  # homelab-wsl-02's prefixes).
  - ../../../apps/kopiur-system/namespace.yaml
  - ./aws-backup-credentials-ks.yaml
  # kopiur: its own repository (KOPIUR_PREFIX) and homelab-wsl's, read-only.
  - ../../../apps/kopiur-system/kopiur/ks.yaml
  - ../../../apps/kopiur-system/kopiur/peer-repository-ks.yaml
  # Weekly restore of the other site's newest snapshots into this site's standby PVCs.
  - ../../../apps/kopiur-system/standby-restore/ks.yaml
  # Fence a warm app's Postgres when its site lease names this site.
  - ../../../apps/databases/site-lease-fence/ks.yaml
  # The security platform's namespace (kubernetes/apps/security/README.md):
  # baseline Pod Security, deny by default. Its apps join one by one.
  - ../../../apps/security/namespace.yaml
  # The converter (security/converter/README.md): the time of the newest line
  # of each security stream in this site's Loki, as the time of the last result.
  - ../../../apps/security/converter/ks.yaml
  # CI: the network-device Terraform runner (wg03 sidecar), so those
  # workflows run while homelab-wsl is down.
  - ../../../apps/tools/namespace.yaml
  - ../../../apps/tools/actions-runner-controller/controller/ks.yaml
  - ./ops-runner-ks.yaml
# Parts of those shared ks.yaml files that don't run here (yet):
#   - PrometheusRules: no kube-prometheus-stack on this cluster.
#   - ingress-nginx (public): waits for this cluster's own cloudflared tunnel.
#   - cloudnative-pg-cluster: the shared `postgres` cluster (retired on
#     homelab-wsl too); apps have their own clusters.
patches:
  # Grafana is a warm app (GRAFANA_REPLICAS, cluster-settings): its database is
  # a replica cluster here. The pre-v13 Backup belongs to homelab-wsl's primary.
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: grafana-db
        namespace: flux-system
      spec:
        patches:
          - patch: |-
              $patch: delete
              apiVersion: postgresql.cnpg.io/v1
              kind: Backup
              metadata:
                name: grafana-before-v13
                namespace: databases
  # The media apps at 0 have unbound WaitForFirstConsumer PVCs, which Helm's
  # wait (kstatus) never sees as ready.
  - target:
      kind: Kustomization
      name: "sonarr|radarr|prowlarr|qbittorrent|recyclarr"
    patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: not-used
      spec:
        patches:
          - target:
              kind: HelmRelease
            patch: |-
              - op: add
                path: /spec/install
                value:
                  disableWait: true
              - op: add
                path: /spec/upgrade
                value:
                  disableWait: true
  # The transcriber's mosquitto and Frigate stay on homelab-wsl (reached over
  # the LAN, FRIGATE_RTSP_URL / MQTT_BROKER_HOST), so it can't wait for them here.
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: transcriber
        namespace: flux-system
      spec:
        dependsOn:
          - name: transcriber-db
          - name: kube-prometheus-stack
  - patch: |-
      $patch: delete
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: cert-manager-prometheusrules
        namespace: flux-system
  # kube-prometheus-stack here: no extra scrape jobs (homelab-wsl scrapes both
  # Windows hosts and alerts on them), a smaller Prometheus, and only the
  # cluster-level addon alerts (monitoring-addons/).
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: kube-prometheus-stack
        namespace: flux-system
      spec:
        patches:
          - target:
              kind: HelmRelease
              name: kube-prometheus-stack
            patch: |-
              # Only the other site's federation (peer-rules.yaml).
              - op: replace
                path: /spec/values/prometheus/prometheusSpec/additionalScrapeConfigs
                value:
                  - job_name: peer-federate
                    honor_labels: true
                    metrics_path: /federate
                    scrape_interval: 60s
                    scrape_timeout: 20s
                    params:
                      match[]:
                        - 'cnpg_pg_stat_archiver_last_archived_wal_start_lsn'
                        - 'cnpg_pg_replication_in_recovery'
                    static_configs:
                      - targets:
                          - ${PEER_WINDOWS_HOST_ADDR}:9090
                        labels:
                          source_site: ${PEER_CLUSTER_NAME}
                          k8s_cluster: ${PEER_CLUSTER_NAME}
              # The kubelet's own figure of its node's memory (the working
              # set of the node's root cgroup, which here is the node
              # container), for NodeContainerMemoryNearLimit: one series for
              # each node. cAdvisor's series of that cgroup are dropped by
              # the chart's defaults, with every other cgroup that has no pod.
              - op: add
                path: /spec/values/kubelet/serviceMonitor/resource
                value: true
              - op: add
                path: /spec/values/kubelet/serviceMonitor/resourcePath
                value: /metrics/resource
              - op: add
                path: /spec/values/kubelet/serviceMonitor/resourceInterval
                value: 1m
              - op: add
                path: /spec/values/kubelet/serviceMonitor/resourceMetricRelabelings
                value:
                  - sourceLabels: [__name__]
                    regex: node_memory_working_set_bytes
                    action: keep
              - op: replace
                path: /spec/values/prometheus/prometheusSpec/resources
                value:
                  requests:
                    cpu: 100m
                    memory: 1Gi
                  limits:
                    memory: 2Gi
              # Native ext4 on the roomy C: host. No subPath: kubelet would
              # create it root-owned, and hostPath volumes ignore fsGroup.
              - op: replace
                path: /spec/values/prometheus/prometheusSpec/storageSpec
                value:
                  disableMountSubPath: true
                  volumeClaimTemplate:
                    spec:
                      storageClassName: local-path
                      accessModes: [ReadWriteOnce]
                      resources:
                        requests:
                          storage: 40Gi
              - op: replace
                path: /spec/values/prometheus/prometheusSpec/retention
                value: 15d
              - op: replace
                path: /spec/values/prometheus/prometheusSpec/retentionSize
                value: 30GB
  # Loki here is the long store of the security streams: a stream with the
  # label security_stream stays 90 days, and every other stream keeps the
  # 14 days of retention_period. The compactor applies both
  # (retention_enabled in the shared values); a rule's period can't be under
  # 24h. The chart's ServiceMonitor is on, once a minute, so this site's
  # Prometheus has Loki's own series (what it takes in, per retention period,
  # and the series of loki.rules). clusterLabelOverride: the ServiceMonitor
  # writes a `cluster` label on every series, the release name by default,
  # and an alert that keeps it would name that instead of the cluster.
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: loki
        namespace: flux-system
      spec:
        patches:
          - target:
              kind: HelmRelease
              name: loki
            patch: |-
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: loki
              spec:
                values:
                  clusterLabelOverride: ${CLUSTER_NAME}
                  loki:
                    limits_config:
                      retention_stream:
                        - selector: '{security_stream=~".+"}'
                          priority: 1
                          period: 90d
                  monitoring:
                    serviceMonitor:
                      enabled: true
                      interval: 1m
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: kube-prometheus-stack-addons
        namespace: flux-system
      spec:
        path: ./kubernetes/clusters/wsl-02/apps/monitoring-addons
  # kopiur's snapshot policies: only those of the apps deployed here
  # (kopiur-policies/), their schedules suspended while the app runs on
  # homelab-wsl (<APP>_BACKUP_SUSPEND).
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: kopiur-policies
        namespace: flux-system
      spec:
        path: ./kubernetes/clusters/wsl-02/apps/kopiur-policies
  # kopiur's PrometheusRule and ServiceMonitor need the Prometheus operator's
  # CRDs (kube-prometheus-stack), so it waits for them.
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: kopiur
        namespace: flux-system
      spec:
        dependsOn:
          - name: kube-prometheus-stack
  - patch: |-
      $patch: delete
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: ingress-nginx
        namespace: flux-system
  # Plausible is reached through cloudflared on homelab-wsl, whose ingress has
  # oauth2-proxy; this site has no oauth2-proxy to wait for.
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: plausible
        namespace: flux-system
      spec:
        dependsOn:
          - name: plausible-db
  - patch: |-
      $patch: delete
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: cloudnative-pg-cluster
        namespace: flux-system
  - patch: |-
      $patch: delete
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: cloudnative-pg-cluster-prometheusrules
        namespace: flux-system
