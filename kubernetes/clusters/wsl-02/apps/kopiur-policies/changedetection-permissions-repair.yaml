---
# One-time backup after correcting the mover UID/GID. Remove this manifest
# after success so GFS retention can eventually remove the CR without Flux
# recreating it. Keep the backup when this manifest is removed.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Snapshot
metadata:
  name: changedetection-permissions-repair-20261108
  namespace: production
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  policyRef:
    name: changedetection
  deletionPolicy: Retain
  # Explicit for the first reconcile, even if Flux applies this before the policy.
  mover:
    securityContext:
      runAsUser: 568
      runAsGroup: 568
