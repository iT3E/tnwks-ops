---
# kubernetes/apps/kopiur-system/aws-backup-credentials/ks.yaml for
# homelab-wsl-02: same name and settings, this cluster's directory (its own
# certificate; see aws-backup-credentials/kustomization.yaml).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aws-backup-credentials
  namespace: flux-system
spec:
  path: ./kubernetes/clusters/wsl-02/apps/aws-backup-credentials
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 3m
