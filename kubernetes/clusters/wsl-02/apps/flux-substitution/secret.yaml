---
# The reduced substitution Secret of this cluster: the keys of
# kubernetes/apps/flux-system/substitution/app/secret.yaml that this
# cluster's cluster-secrets has, and no other. A key that this cluster's
# cluster-secrets does not have stays out: a variable with an empty
# default would give a child outside the class an empty value where today
# its build stops. observability/tests/test_flux_admission.py checks that
# each variable here is a key of this cluster's cluster-secrets, and that
# each variable of a child outside the class here is a key here or a
# setting of this cluster.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-secrets-apps
  namespace: flux-system
type: Opaque
stringData:
  COGNITO_OIDC_ISSUER_URL: "${COGNITO_OIDC_ISSUER_URL}"
  OAUTH2_PROXY_CLIENT_ID: "${OAUTH2_PROXY_CLIENT_ID}"
  SECRET_DOMAIN: "${SECRET_DOMAIN}"
  SECRET_PREFIX: "${SECRET_PREFIX}"
  TIMEZONE: "${TIMEZONE}"
