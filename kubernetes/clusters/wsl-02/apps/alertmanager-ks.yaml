---
# kubernetes/apps/monitoring/alertmanager/ks.yaml for homelab-wsl-02: same
# name (kube-prometheus-stack depends on it), this cluster's directory.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alertmanager
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/clusters/wsl-02/apps/alertmanager
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
