---
# Off-site dead-man switch for homelab-wsl-02 (docs/operations/external-monitoring.md):
# a pod that can start and reach the internet pings healthchecks.io every 2
# minutes; healthchecks.io messages Telegram when the pings stop. Stand-in until
# this cluster runs its own Alertmanager, whose Watchdog then pings instead.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: healthchecks-heartbeat
  namespace: kube-system
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 60
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ping
              image: docker.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
              command: ["sh", "-c", 'curl -fsS -m 10 --retry 3 -o /dev/null "$URL"']
              env:
                - name: URL
                  valueFrom:
                    secretKeyRef:
                      name: healthchecks-heartbeat
                      key: url
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
