---
# Flux's own policies (allow-egress) admit ingress to flux-system pods only
# from inside flux-system. Cilium enforces them, so the dashboard needs its
# ingress controllers (and Prometheus, for its metrics) let in explicitly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: weave-gitops-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: weave-gitops
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - port: 9001
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 2112
          protocol: TCP
