---
# Flux error events -> Alertmanager -> War Room (Telegram). This is the
# safety net for Renovate automerge: a merged bump whose HelmRelease or
# Kustomization fails to reconcile pages instead of failing quietly.
# Alertmanager names each alert Flux<Kind><Reason> (for example
# FluxHelmReleaseUpgradeFailed) and puts the error text in the `message`
# annotation, which telegram.tmpl prints.
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Provider
metadata:
  name: alertmanager
  namespace: flux-system
spec:
  type: alertmanager
  address: http://alertmanager.monitoring.svc.cluster.local:9093/api/v2/alerts/
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: alertmanager
  namespace: flux-system
spec:
  providerRef:
    name: alertmanager
  eventSeverity: error
  eventSources:
    - kind: GitRepository
      name: "*"
    - kind: HelmRepository
      name: "*"
    - kind: OCIRepository
      name: "*"
    - kind: HelmChart
      name: "*"
    # Kustomizations and sources all live in flux-system.
    - kind: Kustomization
      name: "*"
    # An event source only matches its own namespace ("*" works for names,
    # not namespaces), so HelmReleases are listed per namespace. CI fails if a
    # kubernetes/apps/<namespace> with a HelmRelease is missing here.
    - kind: HelmRelease
      namespace: ai
      name: "*"
    - kind: HelmRelease
      namespace: auth
      name: "*"
    - kind: HelmRelease
      namespace: cache
      name: "*"
    - kind: HelmRelease
      namespace: cert-manager
      name: "*"
    - kind: HelmRelease
      namespace: databases
      name: "*"
    - kind: HelmRelease
      namespace: default
      name: "*"
    - kind: HelmRelease
      namespace: flux-system
      name: "*"
    - kind: HelmRelease
      namespace: home-automation
      name: "*"
    - kind: HelmRelease
      namespace: kube-system
      name: "*"
    - kind: HelmRelease
      namespace: media
      name: "*"
    - kind: HelmRelease
      namespace: monitoring
      name: "*"
    - kind: HelmRelease
      namespace: networking
      name: "*"
    - kind: HelmRelease
      namespace: production
      name: "*"
    - kind: HelmRelease
      namespace: selfhosted
      name: "*"
    - kind: HelmRelease
      namespace: storage
      name: "*"
    - kind: HelmRelease
      namespace: system-upgrade
      name: "*"
    - kind: HelmRelease
      namespace: tools
      name: "*"
  # Transient source fetch errors retry on their own; don't page for them.
  exclusionList:
    - "error.*lookup.*github"
    - "dial.*tcp.*timeout"
    - "dial.*tcp.*unreachable"
    - "waiting.*socket"
    - "context deadline exceeded"
    - "TLS handshake timeout"
