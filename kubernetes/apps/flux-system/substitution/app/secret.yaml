---
# The keys of cluster-secrets that the Flux children outside the class use,
# and no other, for the cluster of kubernetes/clusters/wsl. The cluster of
# kubernetes/clusters/wsl-02 has a template of its own with the keys of its
# cluster-secrets (kubernetes/clusters/wsl-02/apps/flux-substitution). The
# patch of the parent of the apps
# (kubernetes/clusters/<site>/apps.yaml) gives this Secret to each child
# outside the class, and cluster-secrets to the children of the class.
# observability/tests/test_flux_admission.py checks that each variable here
# is a key of the cluster-secrets of the site (Flux substitutes in strict
# mode), and that each variable of a child outside the class is a key here
# or a setting of the site. A key that a child outside the class starts to
# use is a change of this file, and so of the class.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-secrets-apps
  namespace: flux-system
type: Opaque
stringData:
  COGNITO_OIDC_ISSUER_URL: "${COGNITO_OIDC_ISSUER_URL}"
  OAUTH2_PROXY_CLIENT_ID: "${OAUTH2_PROXY_CLIENT_ID}"
  SECRET_DOMAIN: "${SECRET_DOMAIN}"
  SECRET_PREFIX: "${SECRET_PREFIX}"
  SMTP_PASSWORD: "${SMTP_PASSWORD}"
  SMTP_USER: "${SMTP_USER}"
  TIMEZONE: "${TIMEZONE}"
  VALKEY_PASSWORD: "${VALKEY_PASSWORD}"
