---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The admission policy of the Flux children outside the class
# (docs/operations/flux-admission.md). Its objects are cluster-scoped, so
# this Kustomization sets no targetNamespace. It needs no Secret: no
# decryption and no substitution, so no ${...} of the CEL is ever replaced.
# Both WSL clusters list it in their apps.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-admission
  namespace: flux-system
  labels:
    substitution.flux.home.arpa/disabled: "true"
spec:
  path: ./kubernetes/apps/flux-system/admission/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
