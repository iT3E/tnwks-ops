---
# The daily list of the admission objects that a Flux child outside the
# class owns (scripts/admission_objects.py, docs/operations/flux-admission.md).
# The policy flux-child-scope can not refuse an admission object, so this
# check finds one after the fact. A finding fails the Job: KubeJobFailed on
# each site, and on site 1 the AI board shows the CronJob on its Checks tab
# (observability/inventory.py, AI_SCHEDULES). The account may only get and
# list the admission objects.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-admission-objects
  namespace: flux-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flux-admission-objects
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - validatingwebhookconfigurations
      - mutatingwebhookconfigurations
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
      - mutatingadmissionpolicies
      - mutatingadmissionpolicybindings
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-admission-objects
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-admission-objects
subjects:
  - kind: ServiceAccount
    name: flux-admission-objects
    namespace: flux-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: flux-admission-objects
  namespace: flux-system
  labels:
    app.kubernetes.io/name: flux-admission-objects
spec:
  schedule: "41 5 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: flux-admission-objects
        spec:
          restartPolicy: Never
          serviceAccountName: flux-admission-objects
          # The token of the read-only account, in the pod of the check only.
          automountServiceAccountToken: true
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              image: docker.io/library/python:3.15.2-slim-trixie@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
              command: ["python3", "-I", "/scripts/admission_objects.py"]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: flux-admission-objects
