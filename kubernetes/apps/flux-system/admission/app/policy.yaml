---
# What a Flux child outside the "ask first" class may apply
# (docs/operations/flux-admission.md). The two Flux controllers that apply
# manifests are bound to cluster-admin. A child of the class is a Flux
# Kustomization whose spec.path is under a path of the class of Owner label
# (classPaths), or a HelmRelease that such a child applies. Each other child
# is outside the class.
#
# The policy matches the requests of the two controllers only. It knows the
# child of an object by the owner labels that the controller sets last:
# kustomize.toolkit.fluxcd.io/name and /namespace (after commonMetadata, so
# the rule kustomization-spec refuses those keys there), and
# helm.toolkit.fluxcd.io/name and /namespace (after the post renderers). A
# request of a controller for an object without its owner label is its own
# work (events, leases, finalizers, the storage of a Helm release) and is
# not a child's.
#
# A child outside the class may not:
# - cluster-object: make or change an object with no namespace (cluster
#   RBAC, CRDs, namespaces, volumes, cluster network policies and the rest);
# - class-namespace: make or change an object in a namespace of the class
#   (classNamespaces). The HelmChart that the helm controller makes in the
#   namespace of the chart source is its own work;
# - rbac: make or change a Role or a RoleBinding;
# - flux-kinds: make a Flux Kustomization or an ImageUpdateAutomation;
# - helmrelease-spec: give a HelmRelease a service account, a kubeconfig, a
#   target or storage namespace of the class, or the post render strategy
#   "nohooks" (hooks with no owner labels);
# - privileged-pod: make a pod spec with privileged, a host path, the host
#   network, PID or IPC namespace, a host port or an added capability, in
#   any namespace;
# - operator-pods: make an object that an operator turns into a pod from a
#   template of its own: the runner sets (actions.github.com), the sandboxes
#   (agents.x-k8s.io, extensions.agents.x-k8s.io), and each object of the
#   database operator and its backup plugin (postgresql.cnpg.io,
#   barmancloud.cnpg.io). The database folders of the apps are in the class
#   (D149), so no child outside it needs one;
# - takeover: change an object whose owner labels name a child of the class.
#
# For each request of the controllers:
# - kustomization-spec: a Kustomization outside the class has a path in the
#   form a/b/c that is not in a class path and holds none (so not the root),
#   no service account, no kubeconfig, no commonMetadata key of Flux, and
#   substitutes from cluster-settings, site-overrides and cluster-secrets
#   only;
# - kustomization-class: a Kustomization of the class comes from one of its
#   parents in git, with a path of the class;
# - helmrelease-class: a HelmRelease of the class comes from a Kustomization
#   of the class;
# - parent-objects: a parent of the class whose build reads files outside
#   the class (the aggregators of kubernetes/apps) applies Kustomizations and
#   the objects of its build in git only.
# An update by a controller that keeps the spec of a Kustomization or a
# HelmRelease (a finalizer, an annotation) passes the last three.
#
# Not covered here, and why (docs/operations/flux-admission.md):
# - Admission objects (webhooks and admission policies): the API server
#   runs no admission policy on them. Owner label holds a pull request of
#   the App that adds or changes a Flux object or an admission object, and
#   the Flux lockdown of a later step closes it.
# - A pod that an operator makes from a resource of its own (a database
#   cluster, a runner set): the pod spec is not in the request of Flux.
# - Decryption with the main key: the children outside the class still have
#   it (docs/operations/flux-admission.md, "Not in this step").
#
# failurePolicy Fail: an error of an expression refuses the request of the
# controller, so one child fails its apply and the rest go on. The binding
# starts with Audit and Warn: a refusal is an audit annotation, a warning in
# the log of the controller and a count of the metric
# apiserver_validating_admission_policy_check_total{policy="flux-child-scope"};
# a later change turns it to Deny after a read of both sites.
#
# The lists between the BEGIN and END lines are the class of git: run
# `python3 kubernetes/apps/flux-system/admission/classlist.py write` after a
# change of the class, of a cluster tree or of a namespace;
# observability/tests/test_flux_admission.py fails until it is run.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: flux-child-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["*"]
        scope: "*"
  matchConditions:
    - name: a-flux-controller-that-applies
      expression: >-
        request.userInfo.username in [
          'system:serviceaccount:flux-system:kustomize-controller',
          'system:serviceaccount:flux-system:helm-controller'
        ]
