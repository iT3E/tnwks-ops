    - name: labels
      expression: object.metadata.?labels.orValue({})
    - name: kOwner
      expression: >-
        variables.labels[?'kustomize.toolkit.fluxcd.io/namespace'].orValue('') + '/' +
        variables.labels[?'kustomize.toolkit.fluxcd.io/name'].orValue('')
    - name: hOwner
      expression: >-
        variables.labels[?'helm.toolkit.fluxcd.io/namespace'].orValue('') + '/' +
        variables.labels[?'helm.toolkit.fluxcd.io/name'].orValue('')
    # An object that a child applies carries the owner label of the
    # controller that applies it.
    - name: applied
      expression: >-
        variables.kustomize
          ? 'kustomize.toolkit.fluxcd.io/name' in variables.labels
          : 'helm.toolkit.fluxcd.io/name' in variables.labels
    - name: child
      expression: "variables.kustomize ? 'Kustomization ' + variables.kOwner : 'HelmRelease ' + variables.hOwner"
    - name: inClass
      expression: >-
        variables.kustomize
          ? variables.kOwner in variables.classKustomizations
          : variables.hOwner in variables.classHelmReleases
    - name: outside
      expression: variables.applied && !variables.inClass
    - name: group
      expression: request.kind.group
    - name: kind
      expression: request.kind.kind
    - name: what
      expression: >-
        variables.kind + ' ' + (variables.objNs == '' ? '' : variables.objNs + '/') +
        object.metadata.?name.orValue(object.metadata.?generateName.orValue(''))
    - name: self
      expression: variables.objNs + '/' + object.metadata.?name.orValue('')
    - name: isKustomization
      expression: variables.group == 'kustomize.toolkit.fluxcd.io' && variables.kind == 'Kustomization'
    - name: isHelmRelease
      expression: variables.group == 'helm.toolkit.fluxcd.io' && variables.kind == 'HelmRelease'
    # A finalizer or an annotation of a controller: the spec stays.
    - name: sameSpec
      expression: >-
        request.operation == 'UPDATE' && oldObject != null &&
        oldObject.?spec.orValue({}) == object.?spec.orValue({})
    - name: path
      expression: "variables.isKustomization ? object.spec.?path.orValue('') : ''"
    # A path in the form a/b/c (a leading ./ and a trailing / are allowed):
    # no empty, "." or ".." part, so no root and no way up.
    - name: pathForm
      expression: >-
        variables.path.matches('^(\\./)?[A-Za-z0-9_-][A-Za-z0-9_.-]*(/[A-Za-z0-9_-][A-Za-z0-9_.-]*)*/?$')
    # The path with no leading ./ and one trailing /.
    - name: pathTrim
      expression: "variables.path.startsWith('./') ? variables.path.substring(2) : variables.path"
    - name: pathNorm
      expression: >-
        (variables.pathTrim.endsWith('/')
          ? variables.pathTrim.substring(0, variables.pathTrim.size() - 1)
          : variables.pathTrim) + '/'
    - name: pathInClass
      expression: variables.classPaths.exists(c, variables.pathNorm.startsWith(c))
    - name: pathHoldsClass
      expression: variables.classPaths.exists(c, c.startsWith(variables.pathNorm))
    - name: podSpec
      expression: >-
        variables.group == '' && variables.kind == 'Pod' ? object.?spec.orValue({}) :
        variables.group == '' && variables.kind == 'PodTemplate' ? object.?template.?spec.orValue({}) :
        variables.group == 'batch' && variables.kind == 'CronJob'
          ? object.?spec.?jobTemplate.?spec.?template.?spec.orValue({}) :
        (variables.group == 'apps' && variables.kind in ['Deployment', 'ReplicaSet', 'StatefulSet', 'DaemonSet']) ||
        (variables.group == 'batch' && variables.kind == 'Job') ||
        (variables.group == '' && variables.kind == 'ReplicationController')
          ? object.?spec.?template.?spec.orValue({}) : {}
    - name: containers
      expression: >-
        variables.podSpec.?containers.orValue([]) +
        variables.podSpec.?initContainers.orValue([]) +
        variables.podSpec.?ephemeralContainers.orValue([])
    - name: privileged
      expression: >-
        variables.podSpec.?hostNetwork.orValue(false) == true ||
        variables.podSpec.?hostPID.orValue(false) == true ||
        variables.podSpec.?hostIPC.orValue(false) == true ||
        variables.podSpec.?volumes.orValue([]).exists(v, has(v.hostPath)) ||
        variables.containers.exists(c,
          c.?securityContext.?privileged.orValue(false) == true ||
          c.?securityContext.?capabilities.?add.orValue([]).size() > 0 ||
          c.?ports.orValue([]).exists(p, p.?hostPort.orValue(0) != 0))
    - name: operatorPods
      expression: >-
        variables.group in ['actions.github.com', 'agents.x-k8s.io', 'extensions.agents.x-k8s.io',
          'postgresql.cnpg.io', 'barmancloud.cnpg.io']
    - name: oldLabels
      expression: "oldObject != null ? oldObject.metadata.?labels.orValue({}) : {}"
    - name: oldClass
      expression: >-
        (variables.oldLabels[?'kustomize.toolkit.fluxcd.io/namespace'].orValue('') + '/' +
         variables.oldLabels[?'kustomize.toolkit.fluxcd.io/name'].orValue('')) in variables.classKustomizations ||
        (variables.oldLabels[?'helm.toolkit.fluxcd.io/namespace'].orValue('') + '/' +
         variables.oldLabels[?'helm.toolkit.fluxcd.io/name'].orValue('')) in variables.classHelmReleases
  validations:
    - expression: "!variables.outside || !variables.clusterScoped"
      messageExpression: >-
        'flux-child-scope/cluster-object: ' + variables.child +
        ' is outside the class and may not apply ' + variables.what
      reason: Forbidden
    - expression: >-
        !variables.outside || variables.clusterScoped || !(variables.ns in variables.classNamespaces) ||
        (!variables.kustomize && variables.group == 'source.toolkit.fluxcd.io' && variables.kind == 'HelmChart')
      messageExpression: >-
        'flux-child-scope/class-namespace: ' + variables.child +
        ' is outside the class and may not apply ' + variables.what + ' in a namespace of the class'
      reason: Forbidden
    - expression: "!variables.outside || variables.group != 'rbac.authorization.k8s.io'"
      messageExpression: >-
        'flux-child-scope/rbac: ' + variables.child + ' is outside the class and may not apply ' + variables.what
      reason: Forbidden
    - expression: >-
        !variables.outside || !(variables.isKustomization ||
          (variables.group == 'image.toolkit.fluxcd.io' && variables.kind == 'ImageUpdateAutomation'))
      messageExpression: >-
        'flux-child-scope/flux-kinds: ' + variables.child + ' is outside the class and may not apply ' + variables.what
      reason: Forbidden
    - expression: >-
        !variables.outside || !variables.isHelmRelease || (
          !has(object.spec.serviceAccountName) && !has(object.spec.kubeConfig) &&
          !(object.spec.?targetNamespace.orValue('') in variables.classNamespaces) &&
          !(object.spec.?storageNamespace.orValue('') in variables.classNamespaces) &&
          object.spec.?postRenderStrategy.orValue('') != 'nohooks')
      messageExpression: >-
        'flux-child-scope/helmrelease-spec: ' + variables.child + ' is outside the class, so ' + variables.what +
        ' may have no service account, kubeconfig, target or storage namespace of the class, or post render strategy nohooks'
      reason: Forbidden
    - expression: "!variables.outside || !variables.privileged"
      messageExpression: >-
        'flux-child-scope/privileged-pod: ' + variables.child + ' is outside the class, so the pod spec of ' +
        variables.what + ' may have no privileged container, host path, host network, PID or IPC, host port or added capability'
      reason: Forbidden
    - expression: "!variables.outside || !variables.operatorPods"
      messageExpression: >-
        'flux-child-scope/operator-pods: ' + variables.child + ' is outside the class and may not apply ' +
        variables.what + ', an object from which an operator of the class makes a pod of its own template'
      reason: Forbidden
    - expression: "!variables.outside || !variables.oldClass"
      messageExpression: >-
        'flux-child-scope/takeover: ' + variables.child + ' is outside the class and may not change ' +
        variables.what + ', which a child of the class applies'
      reason: Forbidden
    - expression: >-
        !variables.isKustomization || variables.self in variables.classKustomizations || variables.sameSpec || (
          variables.pathForm && !variables.pathInClass && !variables.pathHoldsClass &&
          !has(object.spec.serviceAccountName) && !has(object.spec.kubeConfig) &&
          !object.spec.?commonMetadata.?labels.orValue({}).exists(k, k.contains('toolkit.fluxcd.io')) &&
          !object.spec.?commonMetadata.?annotations.orValue({}).exists(k, k.contains('toolkit.fluxcd.io')) &&
          object.spec.?postBuild.?substituteFrom.orValue([]).all(s,
            [s.kind, s.name] in [
              ['ConfigMap', 'cluster-settings'], ['ConfigMap', 'site-overrides'], ['Secret', 'cluster-secrets']
            ]))
      messageExpression: >-
        'flux-child-scope/kustomization-spec: ' + variables.what +
        ' is outside the class: its path must be in the form a/b/c, not in or above a path of the class,' +
        ' with no service account, kubeconfig or commonMetadata key of Flux, and substitution from' +
        ' cluster-settings, site-overrides and cluster-secrets only'
      reason: Forbidden
    - expression: >-
        !variables.isKustomization || !(variables.self in variables.classKustomizations) || variables.sameSpec || (
          variables.kustomize && variables.applied &&
          variables.kOwner in variables.classKustomizations[variables.self] &&
          variables.pathForm && variables.pathInClass)
      messageExpression: >-
        'flux-child-scope/kustomization-class: ' + variables.what + ' is in the class, so it must come from ' +
        variables.classKustomizations[variables.self].join(' or ') + ' with a path of the class, not from ' + variables.child
      reason: Forbidden
    - expression: >-
        !variables.isHelmRelease || !(variables.self in variables.classHelmReleases) || variables.sameSpec || (
          variables.kustomize && variables.applied && variables.kOwner in variables.classKustomizations)
      messageExpression: >-
        'flux-child-scope/helmrelease-class: ' + variables.what +
        ' is in the class, so a Kustomization of the class must apply it, not ' + variables.child
      reason: Forbidden
    - expression: >-
        !(variables.kustomize && variables.applied && variables.kOwner in variables.parentObjects) ||
        variables.isKustomization ||
        (variables.kind + '/' + variables.objNs + '/' + object.metadata.?name.orValue('')) in variables.parentObjects[variables.kOwner]
      messageExpression: >-
        'flux-child-scope/parent-objects: ' + variables.child + ' reads files outside the class, so it may apply' +
        ' Kustomizations and the objects of its build in git only, not ' + variables.what
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: flux-child-scope
spec:
  policyName: flux-child-scope
  validationActions: ["Audit", "Warn"]
