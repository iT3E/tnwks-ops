---
apiVersion: v1
kind: Namespace
metadata:
  name: media
  annotations:
    # kopiur restore movers run as root here, so a switchover's restore keeps
    # the original owners and can overwrite whatever the prebind start wrote
    # (bin/site-failover, "media"). The namespace is privileged anyway (gluetun).
    kopiur.home-operations.com/privileged-movers: "true"
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
    routed-gateway: "true"
    # gluetun (qbittorrent VPN sidecar) needs NET_ADMIN, which is
    # forbidden under PSA baseline. Bump to privileged for this ns.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
