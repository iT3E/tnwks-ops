---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
  namespace: networking
spec:
  interval: 15m
  chart:
    spec:
      chart: k8s-gateway
      version: 4.0.1
      sourceRef:
        kind: HelmRepository
        name: k8s-gateway
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: k8s-gateway
    service:
      # Both Cilium LB-IPAM (MS-01) and MetalLB (WSL) honor `loadBalancerIP`
      # in the Service spec. Cilium also accepts the
      # `io.cilium/lb-ipam-ips` annotation; MetalLB ignores it. Using the
      # spec field keeps a single value working across both clusters.
      loadBalancerIP: "${METALLB_K8S_GATEWAY_ADDR}"
      externalTrafficPolicy: Local
    # Chart 4.x takes CoreDNS server blocks instead of domain/ttl/apex values.
    # This reproduces the Corefile chart 2.4.0 generated, so answers are the
    # same: names from Ingress hosts and LoadBalancer Services under
    # CLUSTER_DOMAIN, apex/SOA k8s-gateway.networking, TTL 1, everything else
    # forwarded. (The old `extraArgs: --domain=${INTERNAL_DOMAIN}` never
    # reached the Corefile; on WSL both domains are internal.tnwks.us.)
    servers:
      - zones:
          - zone: .
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: k8s_gateway
            parameters: "${CLUSTER_DOMAIN}"
            configBlock: |-
              apex k8s-gateway.networking
              ttl 1
              resources Ingress Service
          - name: log
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: forward
            parameters: . /etc/resolv.conf
          - name: loop
          - name: reload
          - name: loadbalance
