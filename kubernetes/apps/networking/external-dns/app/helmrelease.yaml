---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns
  namespace: networking
spec:
  interval: 15m
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    provider: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: external-dns-secret
            key: api-token
    extraArgs:
      - --annotation-filter=external-dns.alpha.kubernetes.io/target
      - --annotation-prefix=external-dns.alpha.kubernetes.io/
      - --cloudflare-proxied
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
    # upsert-only: creates and updates records, never deletes. Step 1 of moving
    # the public records to Terraform (environments/prod/cloudflare); it also
    # makes a second external-dns (another cluster, same txtOwnerId) unable to
    # delete this one's records.
    policy: upsert-only
    sources: ["crd", "ingress"]
    txtPrefix: k8s.
    txtOwnerId: default
    domainFilters: ["${SECRET_DOMAIN}"]
    serviceMonitor:
      enabled: ${SERVICE_MONITOR_ENABLED}
    podAnnotations:
      secret.reloader.stakater.com/reload: external-dns-secret
