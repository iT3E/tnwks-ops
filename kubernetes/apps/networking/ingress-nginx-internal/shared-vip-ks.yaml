---
# The internal ingress on the shared VIPs (10.10.95.10, 10.10.95.200). Listed by the WSL
# clusters, which have the shared-vip pool and BGP (cilium-bgp).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ingress-nginx-internal-shared-vip
  namespace: flux-system
spec:
  path: ./kubernetes/apps/networking/ingress-nginx-internal/shared-vip
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: ingress-nginx-internal
    - name: cilium-bgp
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
