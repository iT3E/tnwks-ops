---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: networking
spec:
  interval: 15m
  chart:
    spec:
      chart: ingress-nginx
      version: 4.15.1
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controller:
      replicaCount: 2
      extraEnvs:
        - name: TZ
          value: "${TIMEZONE}"
      service:
        annotations:
          external-dns.alpha.kubernetes.io/hostname: "ingress.${SECRET_DOMAIN}"
        loadBalancerIP: "${METALLB_INGRESS_ADDR}"
        externalTrafficPolicy: Local
      publishService:
        enabled: true
      ingressClassResource:
        default: true
      config:
        client-header-timeout: 120
        client-body-buffer-size: "100M"
        client-body-timeout: 120
        enable-brotli: "true"
        hsts-max-age: "31449600"
        keep-alive: 120
        keep-alive-requests: 10000
        proxy-body-size: "100M"
        ssl-protocols: "TLSv1.3 TLSv1.2"
        # Real client IPs. Public traffic arrives from cloudflared, a pod, so
        # without this every visitor was the cloudflared pod's IP (in
        # X-Forwarded-For and X-Real-IP), and IP-aware apps (Plausible visitor
        # counts, logins/bans, Jellyfin's local/remote split) saw one client.
        # cloudflared already sends the visitor's IP in X-Forwarded-For; trust
        # it only from the pod network. The default proxy-real-ip-cidr is
        # 0.0.0.0/0, which would let anyone reaching the LB IP pick their own
        # client IP. Direct hits on the LB from the WSL host arrive as
        # 10.5.0.1, outside this range, so they keep their real source.
        use-forwarded-headers: "true"
        proxy-real-ip-cidr: "${CLUSTER_CIDR}"
        # ingress-nginx 1.9+ disables snippet annotations by default after
        # CVE-2024-7646. We use server-snippet on ombi/sonarr/radarr for
        # legacy hostname redirects; flip this back on rather than rip
        # them out. Re-evaluate when those apps are reworked.
        allow-snippet-annotations: "true"
        annotations-risk-level: "Critical"
      metrics:
        enabled: ${SERVICE_MONITOR_ENABLED}
        serviceMonitor:
          enabled: ${SERVICE_MONITOR_ENABLED}
          namespace: networking
          namespaceSelector:
            any: true
      extraArgs:
        default-ssl-certificate: "networking/${SECRET_DOMAIN/./-}-production-tls"
      resources:
        requests:
          cpu: 20m
          memory: 500Mi
        limits:
          memory: 1000Mi
    defaultBackend:
      enabled: false
