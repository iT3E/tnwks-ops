---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
# Repo-scoped runner for the Angular sites repo (iT3E/tnwks-sites),
# `runs-on: sites-builder`. Its build-and-publish workflow runs npm ci and
# ng build, then copies dist/ onto the NFS export nginx serves, mounted here
# at /sites.
#
# No Docker: the workflow never uses it, so there is no privileged dind
# sidecar. A workflow that needs containers brings that back as its own
# change. The runner writes /sites as uid 1001, as it always has.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sites-builder
  namespace: tools
spec:
  interval: 30m
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.15.1
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # The controller HelmRelease must be installed first (it owns the
  # AutoscalingRunnerSet CRD this release creates).
  dependsOn:
    - name: gha-runner-scale-set-controller
  values:
    githubConfigUrl: "https://github.com/iT3E/tnwks-sites"
    runnerScaleSetName: sites-builder
    # Pre-defined secret (GitHub App) — see secret.sops.yaml.
    githubConfigSecret: sites-runner-github-app
    # Idle costs nothing (a pod starts in seconds). One runner: the workflow's
    # publish-sites concurrency group runs one publish at a time anyway.
    minRunners: 0
    maxRunners: 1
    # The chart auto-discovers the controller's ServiceAccount for RoleBinding;
    # set it explicitly since the controller HelmRelease is named
    # gha-runner-scale-set-controller (SA = <release>-gha-rs-controller).
    controllerServiceAccount:
      namespace: tools
      name: gha-runner-scale-set-controller-gha-rs-controller
    template:
      spec:
        securityContext:
          # The image's USER is the name `runner`; runAsNonRoot needs the uid.
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.338.2@sha256:759a1d94a15b05941aba5196974ff43fe15b4cbba29b694b35cbc32a1166b232
            command: ["/home/runner/run.sh"]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            volumeMounts:
              # Shared NFS export served by nfs-server (storage namespace);
              # build jobs publish their dist/ output straight onto the volume
              # nginx serves.
              - name: sites
                mountPath: /sites
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                # ng build of a few projects; node's heap is the big user.
                memory: 2Gi
        volumes:
          - name: sites
            nfs:
              # nfs-server (ganesha) fixed ClusterIP — referenced by IP, not
              # DNS: the kubelet-level NFS mount uses the node resolver, which
              # can't resolve cluster service names. See the Service manifest.
              server: 10.43.255.254
              path: /export
