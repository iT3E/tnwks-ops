---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
# Runner for .github/workflows/renovate-review.yaml, `runs-on: openclaw-hooks`.
# Its one job is a curl that waits for a review to finish: to the OpenClaw
# gateway on the WSL host (reached from the pod network at the docker bridge
# gateway, 10.5.0.1), or to the run receiver of the workflow agents, by the
# variable RENOVATE_REVIEW_ROUTE. See docs/operations/renovate.md.
#
# One runner at a time is the review queue: GitHub holds the next job until
# this one finishes, so reviews never overlap. It has no secrets of its own;
# each token comes from the environment of its job (`openclaw-hooks` or
# `run-receiver`).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openclaw-hooks
  namespace: tools
spec:
  interval: 30m
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.15.1
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  dependsOn:
    - name: gha-runner-scale-set-controller
  values:
    githubConfigUrl: "https://github.com/iT3E/tnwks-ops"
    runnerScaleSetName: openclaw-hooks
    # Same GitHub App as sites-builder (one installation, both repos).
    githubConfigSecret: sites-runner-github-app
    minRunners: 0
    maxRunners: 1
    controllerServiceAccount:
      namespace: tools
      name: gha-runner-scale-set-controller-gha-rs-controller
    template:
      spec:
        securityContext:
          # The image's USER is the name `runner`; runAsNonRoot needs the uid.
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.338.2@sha256:6d0b2d80d80f143f77dcb676e50920100bbb547e39e883454d57f45ab8c31300
            command: ["/home/runner/run.sh"]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
