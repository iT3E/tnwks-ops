---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tools
resources:
  - ./podmonitor.yaml
configMapGenerator:
  # ARC's sample dashboard (docs/gha-runner-scale-set-controller/samples/
  # grafana-dashboard, tag gha-runner-scale-set-0.15.1), with its
  # ${DS_PROMETHEUS} import input turned into a data source variable so the
  # sidecar can provision it as is.
  - name: arc-autoscaling-runner-sets-dashboard
    files:
      - arc-autoscaling-runner-sets-dashboard.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
    grafana_folder: Kubernetes
  labels:
    grafana_dashboard: "true"
