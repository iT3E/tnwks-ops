---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: actions-runner-controller
  namespace: flux-system
spec:
  path: ./kubernetes/apps/tools/actions-runner-controller/controller/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # The runner scale set Kustomization installs an AutoscalingRunnerSet CRD
  # provided by this controller, so block until the controller is healthy.
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: gha-runner-scale-set-controller
      namespace: tools
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
# PodMonitors (monitoring.coreos.com CRD from kube-prometheus-stack) and the
# Grafana dashboard for the controller and listener metrics.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: actions-runner-controller-monitoring
  namespace: flux-system
spec:
  dependsOn:
    - name: actions-runner-controller
    - name: kube-prometheus-stack
  path: ./kubernetes/apps/tools/actions-runner-controller/controller/monitoring
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
