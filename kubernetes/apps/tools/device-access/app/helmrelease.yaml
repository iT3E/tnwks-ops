---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# A pod to exec into for the EP-R6 and the two radios behind it, which are
# reachable only over the router's CI tunnel (docs/network/access.md, "Device
# access pod"). The interim until an MCP server does this.
#
# Same tunnel as the tnwks-ops-runner pods: a wireproxy native sidecar
# (userspace WireGuard, no NET_ADMIN or TUN) holds the router's wg03 peer
# 10.10.32.12 and forwards, inside the pod only:
#   127.0.0.1:8022 -> EP-R6 SSH          127.0.0.1:8443 -> LiteAP web UI
#   127.0.0.1:8023 -> LiteAP radio SSH   127.0.0.1:8444 -> LiteBeam web UI
#   127.0.0.1:8024 -> LiteBeam radio SSH
# The router gives that peer these five forwards and nothing else: not its
# REST API, which only the runners' peers reach (generator CI_ZONE_RULES and
# CI_RUNNER_SOURCES). No Service, no Ingress: only kubectl exec and
# port-forward in tools reach it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: device-access
  namespace: tools
spec:
  interval: 30m
  timeout: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      device-access:
        type: deployment
        replicas: 1
        # One wg03 peer, one key: two pods at once would take the tunnel
        # from each other.
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          # The shell sleeps as PID 1 and ignores SIGTERM.
          terminationGracePeriodSeconds: 5
          securityContext:
            runAsNonRoot: true
            # Group of the Secret files, so nobody can read the SSH key.
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
        initContainers:
          # Native sidecar (restartPolicy: Always). /readyz pings the router's
          # wg03 address (CheckAlive) through the tunnel, so the pod is Ready
          # when the tunnel is up; it can't tell whether the EP-R6 or a radio
          # answers. No startup or liveness probe: the shell must start, and
          # stay, while the router is unreachable.
          wireproxy:
            image:
              # The runner's pin (ops-runner/app/helmrelease.yaml): after
              # v1.1.3, with the Landlock fix for TCPClientTunnel.
              repository: ghcr.io/windtf/wireproxy
              tag: 59258176bd8cbdf21602af795e081d3718678b3a@sha256:5d4f6b9e033bdacc218c8b434edb30011549ddf1298313c5193728e7b00bfaff
            args: [--config, /etc/wireproxy/wireproxy.conf, --info, 0.0.0.0:9080]
            restartPolicy: Always
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 9080
                  periodSeconds: 10
                  failureThreshold: 3
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
        containers:
          shell:
            image:
              # Debian's official image with the OpenSSH client and curl (no
              # image the repo pins has both and runs without root).
              repository: docker.io/library/buildpack-deps
              tag: trixie-scm@sha256:4f34e1d673fdb65371de9f88bdd32c4e30152fe692b35604aef5c0b3c0e6da10
            command: [sleep, infinity]
            env:
              HOME: /tmp
            securityContext:
              # nobody: ssh needs a passwd entry for its user.
              runAsUser: 65534
              runAsGroup: 65534
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 128Mi
    persistence:
      tunnel:
        type: secret
        name: device-access
        items:
          - key: wireproxy.conf
            path: wireproxy.conf
        advancedMounts:
          device-access:
            wireproxy:
              - path: /etc/wireproxy
                readOnly: true
      # CI's SSH key for the EP-R6, and no other key of that Secret (it also
      # holds the runner's tunnel and the CI age key). Root-owned, group
      # nobody (fsGroup), 0440: readable by ssh, which checks the mode only
      # of a key its own user owns.
      ssh-key:
        type: secret
        name: tnwks-ops-runner
        defaultMode: 0440
        items:
          - key: edgeos-ssh-key
            path: edgeos-ssh-key
        advancedMounts:
          device-access:
            shell:
              - path: /etc/device-access
                readOnly: true
      ssh-config:
        type: configMap
        name: device-access-ssh
        advancedMounts:
          device-access:
            shell:
              - path: /etc/ssh/ssh_config.d
                readOnly: true
      tmp:
        type: emptyDir
        sizeLimit: 16Mi
        advancedMounts:
          device-access:
            shell:
              - path: /tmp
