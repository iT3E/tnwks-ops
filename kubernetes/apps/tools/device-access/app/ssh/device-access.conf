# The hosts of the device access pod (docs/network/access.md). Each is a
# wireproxy forward on 127.0.0.1 through the router's wg03 tunnel. ssh runs as
# nobody, whose home does not exist, so every path here is absolute.

# The EP-R6, with CI's key and the host key pinned in
# infrastructure/edgeos/ep-r6/device.json. The login name is ssh_user in
# infrastructure/edgeos/ep-r6/secrets.sops.yaml: give it with -l.
Host ep-r6
  HostName 127.0.0.1
  Port 8022
  IdentityFile /etc/device-access/edgeos-ssh-key
  IdentitiesOnly yes
  StrictHostKeyChecking yes
  UserKnownHostsFile /dev/null

# The LiteAP radio (10.60.10.45) and the LiteBeam radio (10.60.10.43).
Host liteap
  HostName 127.0.0.1
  Port 8023

Host litebeam
  HostName 127.0.0.1
  Port 8024

# airOS 8 runs an old dropbear: RSA host and user keys signed with SHA-1.
# Their host keys are not pinned yet: the first login records each in
# /tmp/known_hosts, which goes with the pod. Pin them in known_hosts next to
# this file and set StrictHostKeyChecking yes (docs/network/access.md).
Host liteap litebeam
  HostKeyAlgorithms +ssh-rsa
  PubkeyAcceptedAlgorithms +ssh-rsa
  StrictHostKeyChecking accept-new
  UserKnownHostsFile /tmp/known_hosts

Host *
  GlobalKnownHostsFile /etc/ssh/ssh_config.d/known_hosts
  UpdateHostKeys no
