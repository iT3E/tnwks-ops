---
# The shared Cilium CA for Cluster Mesh (docs/wsl/multi-site.md), written into
# the chart's own cilium-ca Secret. Listed by both WSL clusters; a cluster
# without it (homelab-ms-01) keeps the CA the chart generated. Prune off:
# removing this must never delete the CA Cilium runs on.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-clustermesh
  namespace: flux-system
spec:
  path: ./kubernetes/apps/kube-system/cilium/clustermesh
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
