---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 15m
  chart:
    spec:
      chart: cilium
      version: ${CILIUM_VERSION}
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # Talos lets no pod load kernel modules, and the WSL2 kernel refuses
    # CAP_SYS_MODULE in nested containers (cilium#13768), so the agent and
    # clean-cilium-state run without it, and Cilium uses the cgroup v2 mount
    # Talos already has (Talos' Cilium guide; talos/wsl-02/README.md).
    securityContext:
      capabilities:
        ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
        cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    # LoadBalancer IPs answered over ARP (cilium/config-ks.yaml); per cluster.
    l2announcements:
      enabled: ${CILIUM_L2_ANNOUNCEMENTS_ENABLED:=false}
    # L2 announcements hold a lease per Service; Cilium's docs raise the
    # client rate limit for them.
    k8sClientRateLimit:
      qps: 10
      burst: 20
    bpf:
      masquerade: true
    cluster:
      name: ${CLUSTER_NAME}
      # Unique per cluster for Cluster Mesh (docs/wsl/multi-site.md).
      id: ${CILIUM_CLUSTER_ID:=1}
    hubble:
      enabled: true
      metrics:
        enabled:
          - dns:query;ignoreAAAA
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - http
        serviceMonitor:
          enabled: ${CILIUM_SERVICEMONITOR_ENABLED}
      relay:
        enabled: true
        rollOutPods: true
        prometheus:
          serviceMonitor:
            enabled: ${CILIUM_SERVICEMONITOR_ENABLED}
      ui:
        enabled: true
        rollOutPods: true
        ingress:
          enabled: ${CILIUM_HUBBLE_UI_INGRESS_ENABLED}
          className: nginx
          hosts:
            - &host "hubble.${INTERNAL_DOMAIN}"
          tls:
            - hosts:
                - *host
    ipam:
      # kubernetes: each node's pod CIDR comes from its Node object (Talos
      # podSubnets). A cluster moved from Flannel in place keeps Cilium's own
      # pool instead, so a rebuild (02-cni-bootstrap.yml renders these values)
      # comes up the way it runs: CILIUM_IPAM_MODE "cluster-pool" in its
      # cluster-settings, with CLUSTER_CIDR as the pool. The pool list is only
      # rendered in cluster-pool mode.
      mode: ${CILIUM_IPAM_MODE:=kubernetes}
      operator:
        clusterPoolIPv4PodCIDRList: ["${CLUSTER_CIDR}"]
    # BGP to the site's distro (FRR), which passes pod CIDRs and shared VIPs
    # on to the router (docs/wsl/multi-site.md, "BGP"). Peers and
    # advertisements: ../bgp (cilium-bgp), listed by a cluster that sets
    # CILIUM_BGP_ENABLED.
    bgpControlPlane:
      enabled: ${CILIUM_BGP_ENABLED:=false}
    # Which LoadBalancer Services Cilium's LB IPAM takes when they set no
    # loadBalancerClass. "lbipam" (default): all of them. "none": only those
    # that ask for a Cilium class (io.cilium/bgp-control-plane). For a cluster
    # where MetalLB hands out the LoadBalancer IPs (homelab-wsl): otherwise,
    # once any Cilium pool exists, LB IPAM marks MetalLB's Services "no pool"
    # and clears their status while MetalLB writes it back, hundreds of
    # writes a second (2026-11-06).
    defaultLBServiceIPAM: ${CILIUM_DEFAULT_LB_IPAM:=lbipam}
    # Both clusters use Talos kube-prism (localhost:7445) for pod->apiserver,
    # so no per-cluster KUBE_VIP_ADDR substitution is needed here.
    k8sServiceHost: localhost
    k8sServicePort: 7445
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    operator:
      replicas: 1
      rollOutPods: true
      prometheus:
        enabled: ${CILIUM_SERVICEMONITOR_ENABLED}
        serviceMonitor:
          enabled: ${CILIUM_SERVICEMONITOR_ENABLED}
    prometheus:
      enabled: ${CILIUM_SERVICEMONITOR_ENABLED}
      serviceMonitor:
        enabled: ${CILIUM_SERVICEMONITOR_ENABLED}
    rollOutCiliumPods: true
    autoDirectNodeRoutes: true
    # Pods reached without masquerading: the cluster's own range, or, with
    # Cluster Mesh, a range covering both sites' pods (10.44.0.0/14 holds
    # homelab-wsl-02's 10.44 and homelab-wsl's 10.46).
    ipv4NativeRoutingCIDR: ${CILIUM_NATIVE_ROUTING_CIDR}
    # Cluster Mesh between the WSL sites (docs/wsl/multi-site.md). The CA they
    # share is the cilium-ca Secret itself (cilium/clustermesh), which the
    # chart looks up when tls.ca.cert is unset. Each
    # cluster's clustermesh-apiserver (KVStoreMesh) on a LoadBalancer VIP of
    # its own node network, and the other site's to connect to. The other
    # site's nodes aren't on-link, so their pod CIDRs follow the default
    # route to the distro, which has them from BGP (directRoutingSkipUnreachable).
    directRoutingSkipUnreachable: ${CILIUM_CLUSTERMESH_ENABLED:=false}
    clustermesh:
      useAPIServer: ${CILIUM_CLUSTERMESH_ENABLED:=false}
      apiserver:
        kvstoremesh:
          enabled: true
        service:
          type: LoadBalancer
          loadBalancerIP: "${CLUSTERMESH_APISERVER_IP:=}"
        tls:
          authMode: cluster
          auto:
            enabled: true
            method: helm
      config:
        enabled: ${CILIUM_CLUSTERMESH_ENABLED:=false}
        clusters:
          - name: ${CLUSTERMESH_PEER_NAME:=none}
            port: 2379
            ips: ["${CLUSTERMESH_PEER_IP:=127.0.0.1}"]
    routingMode: native
