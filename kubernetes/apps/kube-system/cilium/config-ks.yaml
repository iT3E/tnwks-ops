---
# Cilium LB IPAM pool and L2 announcements: LoadBalancer IPs from
# CILIUM_LB_POOL_START..STOP (cluster-settings), answered over ARP on the
# nodes' eth0. A cluster lists this next to ks.yaml when Cilium hands out its
# LoadBalancer IPs (homelab-wsl-02; homelab-wsl uses MetalLB).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-config
  namespace: flux-system
spec:
  path: ./kubernetes/apps/kube-system/cilium/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # The CRDs come from the Cilium operator once it runs.
  dependsOn:
    - name: cilium
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
