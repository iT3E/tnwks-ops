---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 15m
  chart:
    spec:
      chart: cert-manager
      version: v1.21.3
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    installCRDs: true
    # The DNS-01 self-check (is the _acme-challenge TXT visible yet?) over
    # DNS-over-HTTPS. Plain DNS to 1.1.1.1:53 is redirected to the MikroTik
    # (Force-DNS), whose static *.internal.tnwks.us record answers
    # _acme-challenge.internal.tnwks.us with NXDOMAIN, so the internal wildcard
    # certificate never got past "not yet propagated" (seen 2026-11-05 on
    # homelab-wsl-02; homelab-wsl's renewal on 2026-11-22 would have failed the
    # same way). DoH (TCP 443) isn't redirected.
    extraArgs:
      - --dns01-recursive-nameservers=https://1.1.1.1/dns-query,https://9.9.9.9/dns-query
      - --dns01-recursive-nameservers-only
    podDnsPolicy: None
    podDnsConfig:
      nameservers:
        - "1.1.1.1"
        - "9.9.9.9"
    prometheus:
      enabled: ${SERVICE_MONITOR_ENABLED}
      servicemonitor:
        enabled: ${SERVICE_MONITOR_ENABLED}
        prometheusInstance: monitoring
