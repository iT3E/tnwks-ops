---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server
  namespace: storage
  labels:
    app.kubernetes.io/name: nfs-server
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # NFS state (the exported tree) lives on a single RWO PVC, so this must stay
  # single-replica — Recreate avoids two pods racing for the volume.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nfs-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nfs-server
    spec:
      # Host network: the `nfs:` volumes are mounted by the node kernel's NFS
      # client, and Cilium's kube-proxy replacement doesn't translate a
      # ClusterIP for in-kernel clients (only kube-proxy's iptables did). So
      # the server listens on its node's own address, 10.5.0.3:2049, and the
      # mounts use that. Only 2049 (NFSv4 over TCP, no rpcbind).
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # The data PVC (local-path) already binds it to worker-1; pinned here too
      # because the consumers mount this node's IP.
      nodeSelector:
        kubernetes.io/hostname: homelab-wsl-worker-1
      initContainers:
        # The gdrive-sync export's root belongs to the squash uid (1000) and
        # nobody else: every client is mapped to it (configmap.yaml).
        - name: gdrive-sync-perms
          image: docker.io/library/busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "chown 1000:1000 /gdrive-sync && chmod 0700 /gdrive-sync"]
          securityContext:
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: gdrive-sync
              mountPath: /gdrive-sync
      containers:
        - name: nfs-server
          # Userspace NFS-Ganesha (vfs FSAL) from the kubernetes-sigs
          # nfs-ganesha image — no host nfsd kernel module (unlike erichough /
          # volume-nfs), which WSL2's Talos-in-Docker kernel can't load.
          image: registry.k8s.io/sig-storage/nfs-provisioner:v4.0.8
          # Bypass the provisioner entrypoint (it only exports a metadata-only
          # PSEUDO root and needs cluster RBAC for dynamic provisioning we don't
          # use). Run ganesha.nfsd directly against our static config instead.
          command:
            - /usr/local/bin/ganesha.nfsd
            - -F # foreground
            - -L
            - /dev/stdout # log to stdout
            - -p
            - /tmp/ganesha.pid # default /usr/local/var/run/ganesha is not writable
            - -f
            - /etc/ganesha/ganesha.conf
          ports:
            - name: nfs
              containerPort: 2049
              protocol: TCP
          securityContext:
            # Userspace ganesha needs no privileged/kernel modules — only:
            #   DAC_READ_SEARCH — traverse/read exported files regardless of
            #                     perms (ganesha does its own NFS access checks)
            #   SYS_RESOURCE    — raise the fd rlimit for many clients
            capabilities:
              add:
                - DAC_READ_SEARCH
                - SYS_RESOURCE
          volumeMounts:
            - name: data
              mountPath: /export
            - name: gdrive-sync
              mountPath: /gdrive-sync
            - name: config
              mountPath: /etc/ganesha
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nfs-server-data
        - name: gdrive-sync
          persistentVolumeClaim:
            claimName: nfs-gdrive-sync
        - name: config
          configMap:
            name: nfs-ganesha-config
