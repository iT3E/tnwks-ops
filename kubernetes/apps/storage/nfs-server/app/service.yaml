---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  namespace: storage
  labels:
    app.kubernetes.io/name: nfs-server
spec:
  type: ClusterIP
  # Not what the mounts use: the `nfs:` volumes mount the server's node
  # address (10.5.0.3, host network; see the Deployment), because the kernel
  # NFS client can't reach a ClusterIP without kube-proxy. Kept, with its
  # fixed IP, for anything in a pod that wants to reach it by Service.
  clusterIP: 10.43.255.254
  selector:
    app.kubernetes.io/name: nfs-server
  # NFSv4-only over TCP: clients reach the server on 2049 alone.
  ports:
    - name: nfs
      port: 2049
      targetPort: nfs
      protocol: TCP
