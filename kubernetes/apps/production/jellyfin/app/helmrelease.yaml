---
# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: production
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 3
  # A standby at 0 (homelab-wsl-02) has PVCs that stay Pending until a pod
  # needs them, which Helm's wait would never see Ready.
  install:
    createNamespace: true
    disableWait: ${JELLYFIN_HELM_DISABLE_WAIT:=false}
    remediation:
      retries: 3
  upgrade:
    disableWait: ${JELLYFIN_HELM_DISABLE_WAIT:=false}
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: "OnRootMismatch"
        supplementalGroups: [44, 109, 10000]
    controllers:
      jellyfin:
        # Which site runs it (docs/wsl/multi-site.md, "Switching an app").
        replicas: ${JELLYFIN_REPLICAS:=1}
        type: statefulset
        containers:
          app:
            image:
              repository: jellyfin/jellyfin
              tag: 10.11.11
            env:
              TZ: "America/Los_Angeles"
            resources:
              requests:
                memory: 512Mi
              limits:
                memory: 6Gi
    service:
      app:
        controller: jellyfin
        # Global across the WSL sites (Cilium Cluster Mesh): the public ingress
        # (cloudflared, on homelab-wsl) and either internal ingress reach it
        # wherever it runs.
        annotations:
          service.cilium.io/global: "true"
          service.cilium.io/affinity: local
        ports:
          http:
            port: 8096
    persistence:
      config:
        enabled: true
        storageClass: ${STORAGE_CLASS_DEFAULT}
        accessMode: ReadWriteOnce
        size: 150Gi
        retain: true
        globalMounts:
          - path: /config
      cephfs:
        existingClaim: cephfs-hdd-subvolume
        globalMounts:
          - path: /cephfs
    ingress:
      app:
        className: nginx
        annotations:
          # Through the Service's ClusterIP: on the site where it's at 0, only
          # Cilium knows the other site's backends.
          nginx.ingress.kubernetes.io/service-upstream: "true"
          hajimari.io/icon: simple-icons:jellyfin
        hosts:
          - host: &host "jellyfin.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
      internal:
        className: nginx-internal
        annotations:
          # Through the Service's ClusterIP: on the site where it's at 0, only
          # Cilium knows the other site's backends.
          nginx.ingress.kubernetes.io/service-upstream: "true"
        hosts:
          - host: &internalHost "jellyfin.${INTERNAL_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
