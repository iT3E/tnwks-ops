---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ombi
  namespace: production
spec:
  interval: 10m
  chart:
    spec:
      chart: ombi
      version: 11.5.2
      sourceRef:
        kind: HelmRepository
        name: k8s-at-home
        namespace: flux-system
      interval: 10m
  # A standby at 0 (homelab-wsl-02) has a PVC that stays Pending until a pod
  # needs it, which Helm's wait would never see Ready.
  install:
    disableWait: ${OMBI_HELM_DISABLE_WAIT:=false}
    remediation:
      retries: 3
  upgrade:
    disableWait: ${OMBI_HELM_DISABLE_WAIT:=false}
    remediation:
      retries: 3
      remediateLastFailure: true
      # cleanupOnFail: true
  rollback:
    timeout: 10m
    recreate: true
    # cleanupOnFail: true
  values:
    image:
      repository: ghcr.io/linuxserver/ombi
      tag: 4.53.10
    env:
      TZ: "${TIMEZONE}"
    # Which site runs it (docs/wsl/multi-site.md, "Switching an app").
    controller:
      replicas: ${OMBI_REPLICAS:=1}
    service:
      main:
        # Global across the WSL sites (Cilium Cluster Mesh): the public ingress
        # (cloudflared, on homelab-wsl) reaches it wherever it runs.
        annotations:
          service.cilium.io/global: "true"
          service.cilium.io/affinity: local
    ingress:
      main:
        enabled: true
        ingressClassName: nginx
        annotations:
          # Through the Service's ClusterIP: on the site where it's at 0, only
          # Cilium knows the other site's backends.
          nginx.ingress.kubernetes.io/service-upstream: "true"
          nginx.ingress.kubernetes.io/server-snippet: |
            if ($host = 'request.${SECRET_DOMAIN}') {
              return 301 https://requests.${SECRET_DOMAIN}$request_uri;
            }
        hosts:
          - host: "requests.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
          - host: "request.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
            - "requests.${SECRET_DOMAIN}"
            - "request.${SECRET_DOMAIN}"
    persistence:
      config:
        enabled: true
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: "${STORAGE_CLASS_DEFAULT}"
