---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      nodeSelector:
        google.feature.node.kubernetes.io/coral: "true"
    controllers:
      frigate:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/blakeblackshear/frigate
              tag: 0.17.2@sha256:d4351369984d4a9e2a49ac59736f6490856a7ea11f7790040746d21496967010
            env:
              TZ: America/Los_Angeles
            envFrom:
              - secretRef:
                  name: frigate-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: &port 5000
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              # FastAPI takes ~25s to come up (DB vacuum + detector init);
              # without a startup probe the liveness window kills the pod
              # mid-boot.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 5
                  timeoutSeconds: 1
                  failureThreshold: 30
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 5000m
              limits:
                memory: 8Gi
    service:
      app:
        controller: frigate
        ports:
          http:
            port: *port
          rtsp:
            port: 8554
          webrtc-tcp:
            port: 8555
            protocol: TCP
      appudp:
        controller: frigate
        ports:
          webrtc-udp:
            port: 8555
            protocol: UDP
    # Frigate's Prometheus endpoint, for the detection/camera alerts in
    # monitoring/kube-prometheus-stack/addons/alerts/frigate.yaml. Only the
    # series those use are kept: the per-process cpu/mem series are labeled by
    # pid and churn on every ffmpeg restart.
    serviceMonitor:
      app:
        enabled: ${SERVICE_MONITOR_ENABLED}
        serviceName: frigate-app
        endpoints:
          - port: http
            scheme: http
            path: /api/metrics
            interval: 30s
            scrapeTimeout: 10s
            metricRelabelings:
              - sourceLabels: [__name__]
                regex: frigate_(camera_fps|process_fps|skipped_fps|detection_fps|detection_total_fps|detection_start|detector_inference_speed_seconds|service_uptime_seconds|service_info|camera_events_total|storage_.+)
                action: keep
    # The ingress fronts port 5000, Frigate's unauthenticated API (its own
    # auth is on 8971), so gate it with oauth2-proxy like grafana: the shared
    # .tnwks.us SSO session gets a browser straight through. Without the gate
    # anyone on the LAN could read /api/config, which includes every camera's
    # RTSP credentials. Home Assistant talks to frigate-app:5000 in-cluster
    # and doesn't pass through here.
    ingress:
      app:
        className: nginx-internal
        annotations:
          nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.auth.svc.cluster.local:80/oauth2/auth"
          nginx.ingress.kubernetes.io/auth-signin: "https://oauth2.${INTERNAL_DOMAIN}/oauth2/start?rd=$scheme://$host$escaped_request_uri"
          # Cognito-backed sessions are split across multiple cookies; the
          # subrequest header chunk overflows nginx's default 4k buffer.
          nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
          nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
        hosts:
          - host: &host "{{ .Release.Name }}.${CLUSTER_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        # The controller's default cert (*.internal.tnwks.us) covers the
        # host; listing it makes nginx redirect plain http to https.
        tls:
          - hosts:
              - *host
    persistence:
      config:
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: "${STORAGE_CLASS_DEFAULT}"
        globalMounts:
          - path: /data
      config-file:
        type: configMap
        name: frigate-configmap
        globalMounts:
          - path: /config/config.yml
            subPath: config.yml
            readOnly: true
      # Frame shared-memory. Frigate keeps decoded frames in /dev/shm; a
      # RAM-backed volume keeps that off disk.
      cache:
        type: emptyDir
        medium: Memory
        sizeLimit: 2Gi
        globalMounts:
          - path: /dev/shm
      # Recording segment cache. Frigate writes every record-role segment to
      # /tmp/cache first, then copies the kept ones to /media. With no volume
      # here it lands on the container overlay (the WSL sdd ext4 vhdx that also
      # backs /var/lib/docker and every local-path PVC), so ~10 cameras of
      # continuous segment write+read churn saturate that one shared disk —
      # NodeDiskIOSaturation on sdd across all three nodes. A RAM-backed mount
      # is Frigate's documented best practice and removes the churn from disk.
      tmp-cache:
        type: emptyDir
        medium: Memory
        sizeLimit: 2Gi
        globalMounts:
          - path: /tmp/cache
      usb:
        type: hostPath
        hostPath: /dev/bus/usb
        hostPathType: Directory
        # HostToContainer (rslave) so Coral re-enumeration on the host —
        # new /dev/bus/usb/<bus>/<dev> node after a usbipd detach/attach or
        # firmware reload — propagates into the pod live. Without this the
        # kubelet mount is None-propagation and libedgetpu keeps scanning a
        # stale tree, failing to find 18d1:9302 → detector death → CrashLoop.
        globalMounts:
          - path: /dev/bus/usb
            mountPropagation: HostToContainer
      media:
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: "${STORAGE_CLASS_DEFAULT}"
        globalMounts:
          - path: /media
