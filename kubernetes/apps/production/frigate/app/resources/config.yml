---
# yaml-language-server: $schema=http://frigate.tnwks.us/api/config/schema.json
logger:
  default: info
  # logs:
  #   frigate.record: debug

mqtt:
  host: mosquitto.home-automation.svc.cluster.local
  topic_prefix: frigate
  user: "{FRIGATE_MQTT_USERNAME}"
  password: "{FRIGATE_MQTT_PASSWORD}"

database:
  path: /data/frigate.db

# The USB Coral on the Windows host, through Frigate's zmq detector
# (docs/wsl/coral-detector.md). The service tnwks-coral-detector-0 serves it at
# the vEthernet (WSL) address (WINDOWS_HOST_IP); usbip and its vhci_hcd seqnum
# overflow, which hung detection every 3-4 days, are out of the path. The
# detector name coral<id> must match the service's id: the alert
# CoralDetectorNoInferences joins on it. A second Coral is coral1 at :5556.
# Back to OpenVINO: `ov: {type: openvino, device: CPU}` plus the 300x300
# `model:` block from PR #1679.
detectors:
  coral0:
    type: zmq
    endpoint: tcp://172.26.80.1:5555

# Frigate's Edge TPU model (the server loads the same file, pinned by
# SHA-256 in the windows_coral_detector role; Frigate only sends its name).
model:
  width: 320
  height: 320
  input_tensor: nhwc
  input_pixel_format: rgb
  path: /edgetpu_model.tflite
  labelmap_path: /labelmap.txt

ffmpeg:
  global_args: ["-hide_banner", "-loglevel", "warning"]
  output_args:
    # The Amcrest/Loryta/SV3C cameras publish pcm_alaw audio. mp4 has no
    # tag for pcm_alaw, so `-c copy` (the -audio-copy preset) fails the
    # header write with "Could not find tag for codec pcm_alaw" and every
    # segment gets discarded by the record maintainer. Transcode to aac
    # instead: video is still `-c:v copy`, so this costs no video re-encode.
    record: preset-record-generic-audio-aac

snapshots:
  enabled: true
  timestamp: false
  bounding_box: true
  retain:
    default: 2

record:
  enabled: true
  alerts:
    retain:
      days: 2
      mode: active_objects
  detections:
    retain:
      days: 2
      mode: active_objects

# Object detection on. Frigate defaults detect.enabled to false, so
# without this the detector loads but no camera ever sends it a frame: no
# tracked objects, no alert/detection review items (so nothing reaches
# frigate/reviews for Home Assistant), and with the active_objects retention
# above, almost no recordings kept. Cameras that set detect.enabled: False
# themselves (the Wyze ones) stay off.
detect:
  enabled: true

objects:
  track: ["person"]
  filters:
    person:
      min_area: 5000
      max_area: 100000
      threshold: 0.7

# Audio detection: off by default, on per camera below for the cameras whose
# streams actually carry an audio track. Only `speech` is listened for: its
# frigate/<camera>/audio/speech ON/OFF topic is what tnwks-transcriber cuts
# clips on (kubernetes/apps/production/transcriber). Runs on the CPU (a small
# YAMNet model), one extra ffmpeg per camera reading the go2rtc restream, so
# no extra connection to the camera.
#
# Kitchen, balcony (Amcrest IP4M-1025E) and pool (Loryta) have no microphone:
# each reports zero audio inputs (devAudioInput getCollect result=0) and
# rejects AudioEnable, and their RTSP offers H264 only (checked 2026-11). Don't
# give them the audio role: on a stream with no audio track the audio ffmpeg
# exits and restarts every 10s (and leaks, see the disabled-camera notes below).
audio:
  enabled: false
  listen:
    - speech

go2rtc:
  streams:
    frigate_wyze_groom: rtsp://{FRIGATE_WYZE_RTSP_USERNAME}:{FRIGATE_WYZE_RTSP_PASSWORD}@10.10.91.109/live
    frigate_wyze_rroom: rtsp://{FRIGATE_WYZE_RTSP_USERNAME}:{FRIGATE_WYZE_RTSP_PASSWORD}@10.10.91.179/live
    frigate_wyze_baby: rtsp://{FRIGATE_WYZE_RTSP_USERNAME}:{FRIGATE_WYZE_RTSP_PASSWORD}@10.10.91.105/live
    frigate_sv3c_east_hq: rtsp://{FRIGATE_SV3C_EAST_RTSP_USERNAME}:{FRIGATE_SV3C_EAST_RTSP_PASSWORD}@10.10.60.35/11
    frigate_sv3c_east_lq: rtsp://{FRIGATE_SV3C_EAST_RTSP_USERNAME}:{FRIGATE_SV3C_EAST_RTSP_PASSWORD}@10.10.60.35/12
    frigate_sv3c_west_hq: rtsp://{FRIGATE_SV3C_WEST_RTSP_USERNAME}:{FRIGATE_SV3C_WEST_RTSP_PASSWORD}@10.10.60.34/11
    frigate_sv3c_west_lq: rtsp://{FRIGATE_SV3C_WEST_RTSP_USERNAME}:{FRIGATE_SV3C_WEST_RTSP_PASSWORD}@10.10.60.34/12
    frigate_reolink_south_hq: rtsp://{FRIGATE_REOLINK_SOUTH_RTSP_USERNAME}:{FRIGATE_REOLINK_SOUTH_RTSP_PASSWORD}@10.10.60.33/
    frigate_reolink_south_lq: rtsp://{FRIGATE_REOLINK_SOUTH_RTSP_USERNAME}:{FRIGATE_REOLINK_SOUTH_RTSP_PASSWORD}@10.10.60.33/h264Preview_01_sub
    frigate_amcrest_kitchen_hq: rtsp://{FRIGATE_AMCREST_KITCHEN_RTSP_USERNAME}:{FRIGATE_AMCREST_KITCHEN_RTSP_PASSWORD}@10.10.60.32/
    frigate_amcrest_kitchen_lq: rtsp://{FRIGATE_AMCREST_KITCHEN_RTSP_USERNAME}:{FRIGATE_AMCREST_KITCHEN_RTSP_PASSWORD}@10.10.60.32/cam/realmonitor?channel=1&subtype=1
    frigate_amcrest_balc_hq: rtsp://{FRIGATE_AMCREST_BALC_RTSP_USERNAME}:{FRIGATE_AMCREST_BALC_RTSP_PASSWORD}@10.10.60.31/
    frigate_amcrest_balc_lq: rtsp://{FRIGATE_AMCREST_BALC_RTSP_USERNAME}:{FRIGATE_AMCREST_BALC_RTSP_PASSWORD}@10.10.60.31/cam/realmonitor?channel=1&subtype=1
    frigate_loryta_pool_hq: rtsp://{FRIGATE_LORYTA_POOL_RTSP_USERNAME}:{FRIGATE_LORYTA_POOL_RTSP_PASSWORD}@10.10.60.30/
    frigate_loryta_pool_lq: rtsp://{FRIGATE_LORYTA_POOL_RTSP_USERNAME}:{FRIGATE_LORYTA_POOL_RTSP_PASSWORD}@10.10.60.30/cam/realmonitor?channel=1&subtype=1
    frigate_loryta_fdoor_hq: rtsp://{FRIGATE_LORYTA_FDOOR_RTSP_USERNAME}:{FRIGATE_LORYTA_FDOOR_RTSP_PASSWORD}@10.10.60.100/cam/realmonitor?channel=1&subtype=0
    frigate_loryta_fdoor_lq: rtsp://{FRIGATE_LORYTA_FDOOR_RTSP_USERNAME}:{FRIGATE_LORYTA_FDOOR_RTSP_PASSWORD}@10.10.60.100/cam/realmonitor?channel=1&subtype=1

  webrtc:
    candidates:
      # The live Service is frigate-app (app-template 3 names it after the
      # controller); the old frigate Service was a leftover with no endpoints.
      - frigate-app.production.svc.cluster.local:8555
      - frigate.${INTERNAL_DOMAIN}:8555
      - stun:8555


cameras:
  frigate_wyze_groom:
    # Disabled 2026-10-22: online, but its RTSP server is off (tcp/554 refused, likely a Wyze firmware update dropped RTSP); dark since at least 2026-09-20.
    # While enabled, Frigate restarts its ffmpeg every 10s, and each restart
    # leaks ~16 kB in the main process (upstream discussion #24001, still in
    # 0.18.2). With 4 dead cameras that was ~600 MB/day until the 8Gi limit.
    # Re-enable once the stream answers again.
    enabled: false
    ffmpeg:
      inputs:
        - path: rtsp://localhost:8554/frigate_wyze_groom
          roles: ["record"]
    detect:
      enabled: False

  frigate_wyze_rroom:
    # Disabled 2026-10-22: not answering on the network; dark since at least 2026-09-20.
    # While enabled, Frigate restarts its ffmpeg every 10s, and each restart
    # leaks ~16 kB in the main process (upstream discussion #24001, still in
    # 0.18.2). With 4 dead cameras that was ~600 MB/day until the 8Gi limit.
    # Re-enable once the stream answers again.
    enabled: false
    ffmpeg:
      inputs:
        - path: rtsp://localhost:8554/frigate_wyze_rroom
          roles: ["record"]
    detect:
      enabled: False

  frigate_wyze_baby:
    # Disabled 2026-10-22: online, but its RTSP server is off (tcp/554 refused, likely a Wyze firmware update dropped RTSP); dark since at least 2026-09-20.
    # While enabled, Frigate restarts its ffmpeg every 10s, and each restart
    # leaks ~16 kB in the main process (upstream discussion #24001, still in
    # 0.18.2). With 4 dead cameras that was ~600 MB/day until the 8Gi limit.
    # Re-enable once the stream answers again.
    enabled: false
    ffmpeg:
      inputs:
        - path: rtsp://localhost:8554/frigate_wyze_baby
          roles: ["record"]
    detect:
      enabled: False

  frigate_sv3c_east:
    # Disabled 2026-10-22: not answering on the network (10.10.60.35, no ARP); dark since at least 2026-09-20.
    # While enabled, Frigate restarts its ffmpeg every 10s, and each restart
    # leaks ~16 kB in the main process (upstream discussion #24001, still in
    # 0.18.2). With 4 dead cameras that was ~600 MB/day until the 8Gi limit.
    # Re-enable once the stream answers again.
    enabled: false
    ffmpeg:
      inputs:
        - path: rtsp://localhost:8554/frigate_sv3c_east_lq
          roles: ["detect"]
        - path: rtsp://localhost:8554/frigate_sv3c_east_hq
          roles: ["record"]

    detect:
      width: 640
      height: 360
      fps: 10
    live:
      streams:
        main: frigate_sv3c_east_hq

  frigate_sv3c_west:
    ffmpeg:
      # Record WITHOUT audio on this camera only. With the global
      # -audio-copy -> -audio-aac change (#1343), `-c:a aac` alongside
      # `-c:v copy` makes ffmpeg hold video packets in the muxing queue
      # while it waits on audio frames to encode. Every other camera on
      # the aac preset sits at ~25 MiB RSS; this one's record process grew
      # +62 MiB/min (~3.6 GiB/hr) until it hit the 8Gi container limit and
      # got OOMKilled roughly every 2h (cgroup showed oom_kill 101).
      # preset-record-generic is the same segmenter with `-an`, so the
      # unbounded queue cannot form. Exterior camera, audio has no value
      # here. Revisit if the upstream aac muxing behaviour changes.
      output_args:
        record: preset-record-generic
      inputs:
        # No audio role: the camera's SDP advertises PCMA on both streams,
        # but it sends no audio packets (go2rtc counted none on either track,
        # 2026-11). That is also the likely cause of the aac OOM above: the
        # muxer waits for audio frames that never come.
        - path: rtsp://localhost:8554/frigate_sv3c_west_lq
          roles: ["detect"]
        - path: rtsp://localhost:8554/frigate_sv3c_west_hq
          roles: ["record"]

    detect:
      width: 640
      height: 360
      fps: 10
    # Night false person alerts (2026-11-04 04:32 and 04:40): at night the
    # camera's clock overlay, which changes every second, and the IR glare on
    # the eave above it count as motion nonstop, so Frigate kept sending the
    # right half of the frame (the playhouse with the baby swing) to the
    # detector all night. The Coral's SSD model scores that playhouse as a
    # person (up to 0.71 on the IR image; OpenVINO's ssdlite doesn't), and
    # after enough tries it cleared the 0.7 threshold.
    motion:
      mask:
        # Eave and the IPCAM / date overlays along the top edge. Nobody can
        # stand up there; people in the yard still make motion below it.
        eave_and_timestamp:
          friendly_name: Eave and timestamp
          coordinates: 0,0,1,0,1,0.18,0.875,0.133,0.47,0.1,0,0.1
    objects:
      filters:
        person:
          mask:
            # Drops a person whose box bottom lands on the playhouse's
            # front wall, where the false positives sat (bottom centre
            # 560,316 and 558,329 in the 640x360 detect frame). Someone
            # walking up to it is detected before and after they cross it.
            playhouse:
              friendly_name: Playhouse
              coordinates: 0.78,0.82,0.97,0.82,0.97,0.93,0.78,0.93
    live:
      streams:
        main: frigate_sv3c_west_hq

  frigate_reolink_south:
    ffmpeg:
      inputs:
        - path: rtsp://localhost:8554/frigate_reolink_south_lq
          roles: ["detect", "audio"]
        - path: rtsp://localhost:8554/frigate_reolink_south_hq
          roles: ["record"]

    audio:
      enabled: true
      # Speech detection only runs above this RMS. Ambient here measured
      # 216 to 270 (median 232, 2026-11), so the default 500 skipped speech
      # that wasn't loud and close: nothing reached the transcriber. Just
      # above ambient keeps the detector running on any voice; its speech
      # threshold (0.8) still filters out noise.
      min_volume: 300
    detect:
      width: 640
      height: 360
      fps: 10
    live:
      streams:
        main: frigate_reolink_south_hq

  frigate_amcrest_kitchen:
    ffmpeg:
      inputs:
        - path: rtsp://localhost:8554/frigate_amcrest_kitchen_lq
          roles: ["detect"]
        - path: rtsp://localhost:8554/frigate_amcrest_kitchen_hq
          roles: ["record"]

    detect:
      width: 640
      height: 480
      fps: 10
    live:
      streams:
        main: frigate_amcrest_kitchen_hq

  frigate_amcrest_balc:
    ffmpeg:
      inputs:
        - path: rtsp://localhost:8554/frigate_amcrest_balc_lq
          roles: ["detect"]
        - path: rtsp://localhost:8554/frigate_amcrest_balc_hq
          roles: ["record"]

    detect:
      width: 640
      height: 480
      fps: 10
    live:
      streams:
        main: frigate_amcrest_balc_hq

  frigate_loryta_pool:
    ffmpeg:
      inputs:
        - path: rtsp://localhost:8554/frigate_loryta_pool_lq
          roles: ["detect"]
        - path: rtsp://localhost:8554/frigate_loryta_pool_hq
          roles: ["record"]

    detect:
      width: 704
      height: 480
      fps: 10
    live:
      streams:
        main: frigate_loryta_pool_hq

  frigate_loryta_fdoor:
    ffmpeg:
      inputs:
        # Only the main stream carries audio (PCMA); the sub stream is video only.
        - path: rtsp://localhost:8554/frigate_loryta_fdoor_hq
          roles: ["record", "audio"]
        - path: rtsp://localhost:8554/frigate_loryta_fdoor_lq
          roles: ["detect"]

    audio:
      enabled: true
      # A quiet mic: ambient RMS 26 to 28 (2026-11), so the default 500
      # never ran the detector. Needs the camera's own audio noise reduction
      # OFF (Setup > Camera > Audio): with it on, the camera sent constant
      # silence (-72.2 dB) and nothing was ever heard. That setting lives on
      # the camera, not here; a factory reset turns it back on.
      min_volume: 50
    detect:
      width: 704
      height: 480
      fps: 10
    live:
      streams:
        main: frigate_loryta_fdoor_hq


