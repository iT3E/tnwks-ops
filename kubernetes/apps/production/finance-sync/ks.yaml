---
# finance-sync's own Postgres (kubernetes/components/cnpg-cluster).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: finance-sync-db
  namespace: flux-system
spec:
  path: ./kubernetes/apps/production/finance-sync/db
  components:
    - ../../../../components/cnpg-cluster
    - ../../../../components/cnpg-standby
  dependsOn:
    - name: cloudnative-pg-plugin-barman-cloud
    - name: aws-backup-credentials
  # The owner role's Secret ships with it (db/).
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  prune: true
  # The Cluster's Ready condition gates the app; kstatus alone calls a
  # Cluster with no status yet Current (components/cnpg-cluster/README.md).
  wait: true
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 30m
  retryInterval: 1m
  timeout: 15m
  postBuild:
    substitute:
      CNPG_APP: finance-sync
      CNPG_USER: finance_sync
      CNPG_SIZE: 1Gi
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: finance-sync
  namespace: flux-system
spec:
  # The jobs write to Firefly, and the alert rule needs the PrometheusRule CRD.
  dependsOn:
    - name: firefly
    - name: finance-sync-db
    - name: kube-prometheus-stack
  path: ./kubernetes/apps/production/finance-sync/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
