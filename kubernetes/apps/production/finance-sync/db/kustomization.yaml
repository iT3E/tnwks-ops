---
# finance-sync's own CNPG cluster, databases/finance-sync-pg, from
# ../../../../components/cnpg-cluster (added by the finance-sync-db Kustomization).
#
# First boot imports `finance_sync` from the shared cluster (CNPG initdb.import,
# microservice) as the owner role: the shared cluster has superuser access
# off, and finance_sync owns every object (including its `amazon` schema). bootstrap is only read when the
# Cluster is created; the shared copy stays as the rollback.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./secret-finance-sync-role.sops.yaml
patches:
  - target:
      kind: Cluster
    patch: |-
      - op: add
        path: /spec/bootstrap/initdb/import
        value:
          type: microservice
          databases: [finance_sync]
          source:
            externalCluster: postgres
      - op: add
        path: /spec/externalClusters
        value:
          - name: postgres
            connectionParameters:
              host: postgres-rw.databases.svc.cluster.local
              user: finance_sync
              dbname: finance_sync
              sslmode: require
            password:
              name: postgres-finance-sync
              key: password
