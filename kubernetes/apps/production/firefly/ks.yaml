---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: firefly
  namespace: flux-system
spec:
  path: ./kubernetes/apps/production/firefly/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false # no flux ks dependents
  # APP_KEY, STATIC_CRON_TOKEN and the Passport RSA keypair ship as a
  # SOPS-encrypted Secret, same as every other app here.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 30m
  retryInterval: 1m
  timeout: 5m
