---
# Reads the scratch copy firefly-pg-restore-test and logs only counts and
# times: the number of tables, of migrations and of rows in transactions,
# transaction_journals and accounts, and the newest created_at of a
# transaction journal. It never prints a value of a record.
# Loki: {namespace="databases", app="firefly-restore-check"}.
#
# It fails (result=failed) on a copy that is empty or partial:
# - it can't connect, or the copy is still in recovery (not promoted);
# - fewer than 59 migrations: the migration files of Firefly 6.5.9, the
#   version in ../../app/helmrelease.yaml, so the schema is not complete;
# - one of the three tables is missing or has no row, or no journal has a
#   created_at.
# It does not read firefly-pg: no read path to it exists without a new
# credential. The owner compares the numbers (docs/apps/firefly.md).
#
# The backup plugin restarts the instance once after the bootstrap, and the
# Cluster can report Ready before that restart. So the check waits for two
# good connects 20 s apart to the same server start, with the copy out of
# recovery, and runs the whole set of queries again once when the first set
# fails. It logs one result= line on every way out. It logs in as the owner
# role, in a read-only session (PGOPTIONS).
apiVersion: batch/v1
kind: Job
metadata:
  # One name for each run: a Job cannot run again.
  name: firefly-restore-check
  namespace: databases
spec:
  backoffLimit: 0
  # Two waits of up to 10 minutes each, and the queries.
  activeDeadlineSeconds: 1500
  template:
    metadata:
      labels:
        app.kubernetes.io/name: firefly-restore-check
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # The postgres user of the image.
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: check
          # The image of firefly-pg (its pod's imageID): psql of the same
          # major version.
          image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:348997438269fddc0e2825e00594367ad61751adb08a7698a0a14f793b0dc2ce
          command: ["sh", "-c"]
          args:
            - |
              set -u
              done=""
              # One result= line on every way out, also on an error this script did
              # not foresee.
              trap '[ -n "$done" ] || echo "restore-check result=failed reason=unexpected-exit"' EXIT
              finish() { done=1; echo "restore-check result=$1${2:+ reason=$2}"; [ "$1" = ok ] && exit 0; exit 1; }
              q() { psql -X -A -t -q -v ON_ERROR_STOP=1 -c "$1" 2>/dev/null; }

              # Two good connects in a row, 20 s apart, to the same server start, with
              # the copy out of recovery. Up to 30 tries.
              stable() {
                good=0; last=""; n=0
                while [ "$n" -lt 30 ]; do
                  n=$((n + 1))
                  now=$(q "select pg_is_in_recovery()::text || ' ' || pg_postmaster_start_time()" || echo down)
                  case "$now" in
                    "false "*)
                      if [ "$now" = "$last" ]; then good=$((good + 1)); else good=1; fi
                      last=$now
                      [ "$good" -ge 2 ] && return 0 ;;
                    *) good=0; last="" ;;
                  esac
                  sleep 20
                done
                return 1
              }

              # The whole set of queries. Sets $bad, empty when the copy is good.
              collect() {
                bad=""
                tables=$(q "select count(*) from information_schema.tables where table_schema = 'public' and table_type = 'BASE TABLE'") || tables=error
                migrations=$(q "select count(*) from migrations") || migrations=error
                echo "restore-check tables=$tables migrations=$migrations"
                case "$migrations" in
                  ''|*[!0-9]*) bad="$bad migrations" ;;
                  *) [ "$migrations" -ge 59 ] || bad="$bad migrations" ;;
                esac
                for t in transactions transaction_journals accounts; do
                  rows=$(q "select count(*) from $t") || rows=error
                  echo "restore-check table=$t rows=$rows"
                  case "$rows" in
                    ''|0|*[!0-9]*) bad="$bad $t" ;;
                  esac
                done
                newest=$(q "select coalesce(to_char(max(created_at), 'YYYY-MM-DD\"T\"HH24:MI:SS'), 'none') from transaction_journals") || newest=error
                echo "restore-check newest-journal-created=$newest (database time, no zone)"
                case "$newest" in
                  none|error|'') bad="$bad newest-journal" ;;
                esac
              }

              stable || finish failed not-stable
              collect
              if [ -n "$bad" ]; then
                # A restart of the instance during the queries looks the same as a
                # partial copy: wait again and run the whole set once more.
                echo "restore-check retry=1 reason=$(echo $bad | tr ' ' ',')"
                stable || finish failed not-stable
                collect
              fi
              [ -z "$bad" ] || finish failed "$(echo $bad | tr ' ' ',')"
              finish ok
          env:
            - name: PGHOST
              value: firefly-pg-restore-test-rw.databases.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: firefly
            - name: PGSSLMODE
              value: require
            - name: PGCONNECT_TIMEOUT
              value: "10"
            # The owner role can write: the session is read-only, as in
            # docs/apps/firefly.md, "Looking at the data directly".
            - name: PGOPTIONS
              value: "-c default_transaction_read_only=on"
            # The owner role of firefly-pg (kubernetes/apps/production/
            # firefly/db/secret-firefly-role.sops.yaml): the role and its
            # password came back with the data.
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-firefly
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-firefly
                  key: password
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
