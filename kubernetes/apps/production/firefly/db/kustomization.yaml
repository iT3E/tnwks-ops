---
# firefly's own CNPG cluster, databases/firefly-pg: ../../../../components/cnpg-cluster
# plus cnpg-standby (both added by the firefly-db Kustomization), the same
# manifest on both sites. FIREFLY_PG_PRIMARY names the primary site; the
# other runs a replica cluster from its WAL archive. It moves together with
# finance-sync's (bin/site-failover-apps.json, "firefly").
#
# Imported from the shared cluster on 2026-11-05 (#1781); that copy stays
# there as the rollback. bootstrap is only read when a Cluster is created,
# and a new one now restores from the peer's archive.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # The owner role's password, the same on both sites.
  - ./secret-firefly-role.sops.yaml
patches:
  - target:
      kind: Cluster
    patch: |-
      # Which site is primary, and on the side being promoted only, the old
      # primary's demotion token (docs/wsl/multi-site.md). The empty default
      # carries its quotes (a bare empty value is null, which the CRD rejects).
      - op: add
        path: /spec/replica/primary
        value: ${FIREFLY_PG_PRIMARY:=homelab-wsl}
      - op: add
        path: /spec/replica/promotionToken
        value: ${FIREFLY_PG_PROMOTION_TOKEN:=""}
