---
# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: changedetection
  namespace: production
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      changedetection:
        # Which site runs it (docs/wsl/multi-site.md, "Switching an app").
        replicas: ${CHANGEDETECTION_REPLICAS:=1}
        type: statefulset
        statefulset:
          volumeClaimTemplates:
            - name: config
              accessMode: ReadWriteOnce
              size: 1Gi
              storageClass: "${STORAGE_CLASS_DEFAULT}"
              globalMounts:
                - path: /datastore
        containers:
          app:
            image:
              repository: ghcr.io/dgtlmoon/changedetection.io
              tag: "0.70.3"
            env:
              TZ: ${TIMEZONE}
              PORT: &port 5000
              PUID: 568
              PGID: 568
              BASE_URL: https://changedetection.${SECRET_DOMAIN}
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
              limits:
                memory: 500Mi
    service:
      app:
        controller: changedetection
        # Global across the WSL sites (Cilium Cluster Mesh): the other site's
        # ingress (the shared VIP) reaches this app wherever it runs.
        annotations:
          service.cilium.io/global: "true"
          service.cilium.io/affinity: local
        ports:
          http:
            port: *port
    ingress:
      internal:
        # Keep the original Ingress name (nameOverride equal to the release
        # name leaves it bare). With a second ingress the chart would rename
        # this one to changedetection-internal, and Helm creates before it
        # deletes, so ingress-nginx's webhook rejects the duplicate host+path.
        nameOverride: changedetection
        className: nginx-internal
        annotations:
          # tnwks-auth login via oauth2-proxy, admins only. changedetection has
          # no login of its own enabled, so this is the only gate on the UI.
          # OAUTH2_PROXY_URL: in-cluster on homelab-wsl; homelab-wsl-02 asks
          # homelab-wsl's over the LAN (it has no oauth2-proxy of its own).
          nginx.ingress.kubernetes.io/auth-url: "${OAUTH2_PROXY_URL:=http://oauth2-proxy.auth.svc.cluster.local:80}/oauth2/auth?allowed_groups=admins"
          nginx.ingress.kubernetes.io/auth-signin: "https://oauth2.${INTERNAL_DOMAIN}/oauth2/start?rd=$scheme://$host$escaped_request_uri"
          # Cognito-backed sessions are split across multiple cookies; the
          # subrequest header chunk overflows nginx's default 4k buffer.
          nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
          nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
          # Through the Service's ClusterIP, not the pod endpoints: on the site
          # where the app is at 0, only Cilium knows the other site's backends.
          nginx.ingress.kubernetes.io/service-upstream: "true"
        hosts:
          - host: &internalHost "changedetection.${INTERNAL_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        # The controller's default cert (*.internal.tnwks.us) covers the
        # host; listing it makes nginx redirect plain http to https.
        tls:
          - hosts:
              - *internalHost
      # /api/v1 skips oauth2-proxy: the REST API (watch management by scripts and
      # Ori) can't do a browser login. changedetection checks its own
      # x-api-key on every call there ("API access token security check"
      # on in Settings > API) and answers 403 without it.
      api:
        className: nginx-internal
        annotations:
          nginx.ingress.kubernetes.io/service-upstream: "true"
        hosts:
          - host: *internalHost
            paths:
              - path: /api/v1
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *internalHost
