---
# things-api's own CNPG cluster, databases/things-api-pg, from
# ../../../../components/cnpg-cluster (added by the things-api-db Kustomization).
#
# First boot imports `raines` from the shared cluster (CNPG initdb.import,
# microservice) as the owner role: the shared cluster has superuser access
# off, and things_api owns every object. bootstrap is only read when the Cluster
# is created; the shared copy stays as the rollback.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./secret-things-api-role.sops.yaml
patches:
  - target:
      kind: Cluster
    patch: |-
      - op: add
        path: /spec/bootstrap/initdb/import
        value:
          type: microservice
          databases: [raines]
          source:
            externalCluster: postgres
      - op: add
        path: /spec/externalClusters
        value:
          - name: postgres
            connectionParameters:
              host: postgres-rw.databases.svc.cluster.local
              user: things_api
              dbname: raines
              sslmode: require
            password:
              name: postgres-things-api
              key: password
