---
# things-api's own Postgres (kubernetes/components/cnpg-cluster).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: things-api-db
  namespace: flux-system
spec:
  path: ./kubernetes/apps/production/raines-things-api/db
  components:
    - ../../../../components/cnpg-cluster
  dependsOn:
    - name: cloudnative-pg-plugin-barman-cloud
    - name: aws-backup-credentials
  # The owner role's Secret ships with it (db/).
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  prune: true
  # The Cluster's Ready condition gates the app; kstatus alone calls a
  # Cluster with no status yet Current (components/cnpg-cluster/README.md).
  wait: true
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 30m
  retryInterval: 1m
  timeout: 15m
  postBuild:
    substitute:
      CNPG_APP: things-api
      CNPG_USER: things_api
      CNPG_DATABASE: raines
      CNPG_SIZE: 1Gi
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: raines-things-api
  namespace: flux-system
spec:
  path: ./kubernetes/apps/production/raines-things-api/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false # no flux ks dependents
  # Gate on the postgres cluster so the raines database and the
  # `things_api` role exist before the pod starts.
  dependsOn:
    - name: things-api-db
  # This app ships its own SOPS-encrypted secret (Stripe keys), so Flux needs
  # the decryption provider — same as plausible et al.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 30m
  retryInterval: 1m
  timeout: 5m
