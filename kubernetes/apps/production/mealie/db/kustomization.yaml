---
# Mealie's own CNPG cluster, databases/mealie-pg, from the component
# (kubernetes/components/cnpg-cluster, added by the mealie-db Kustomization).
#
# First boot imports `mealie` from the shared cluster (CNPG initdb.import,
# microservice). bootstrap is only read when the Cluster is created, so the
# import stays harmless afterwards; the shared copy stays as the rollback.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
patches:
  - target:
      kind: Cluster
      # The component names it ${CNPG_APP}-pg and Flux substitutes after the
      # build, so match by kind (this path has one Cluster).
    patch: |-
      - op: add
        path: /spec/bootstrap/initdb/import
        value:
          type: microservice
          databases: [mealie]
          source:
            externalCluster: postgres
      - op: add
        path: /spec/externalClusters
        value:
          - name: postgres
            connectionParameters:
              host: postgres-rw.databases.svc.cluster.local
              # The owner, not postgres: the shared cluster has superuser
              # access off, and mealie owns every object in the database.
              user: mealie
              dbname: mealie
              sslmode: require
            password:
              name: postgres-mealie
              key: password
