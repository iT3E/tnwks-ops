---
# Mealie's own CNPG cluster, databases/mealie-pg: ../../../../components/cnpg-cluster
# plus cnpg-standby (both added by the mealie-db Kustomization). homelab-wsl is
# the primary; homelab-wsl-02 runs a replica cluster from its WAL archive.
#
# Imported from the shared cluster's `mealie` database on 2026-11-05 (#1756);
# that copy stays there as the rollback. The import patch is gone: bootstrap
# is only read when a Cluster is created, and a new one now restores from the
# peer's archive (cnpg-standby).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # The owner role's password, the same on both sites (a replica gets the
  # role itself from the primary's WAL).
  - ./secret-mealie-role.sops.yaml
patches:
  - target:
      kind: Cluster
    patch: |-
      # Which site is primary. A switchover writes MEALIE_PG_PRIMARY to both
      # sites' site-overrides (bin/site-failover, docs/wsl/multi-site.md).
      - op: add
        path: /spec/replica/primary
        value: ${MEALIE_PG_PRIMARY:=homelab-wsl}
      # The old primary's demotion token, on the side being promoted only
      # (bin/site-failover writes it). The empty default carries its quotes:
      # kustomize drops quotes around a ${...}, and a bare empty value is
      # null, which the CRD rejects. A token (base64 JSON, "ey...") needs none.
      - op: add
        path: /spec/replica/promotionToken
        value: ${MEALIE_PG_PROMOTION_TOKEN:=""}
