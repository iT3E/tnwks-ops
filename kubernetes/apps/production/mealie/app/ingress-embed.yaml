---
# mealie-embed: Mealie for the wall display's frame inside HA, signed in only
# by the kiosk identity's Mealie API token. Like grafana-embed: Cognito's
# login page won't load in a frame (X-Frame-Options: DENY), so the frame
# can't sign in through OIDC itself. The Mealie user `kiosk@...` was created
# by an OIDC login (Cognito group viewers, household Family); its long-lived
# API token is in HA's frame URL (HASS_MEALIE_EMBED_URL, home-assistant-secret).
#
# /kiosk-login?t=<token>&next=<path> sets Mealie's session cookie to the
# token and redirects to <path> (only plain /a/b-c paths, else /g/home); the
# Mealie web app then runs as that user. Mealie checks the token on every API
# call, and deleting it in Mealie (kiosk user → API tokens) locks the frame
# out. The cookie is SameSite=None + Partitioned, the attributes Mealie itself
# uses inside a frame, so its own logout can clear it.
#
# Internal ingress only. Every client reaches it as the same SNAT address, so
# instead of an allowlist the password and OIDC logins are refused here: a
# request without a valid token can't sign in on this host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mealie-embed
  annotations:
    # Through the global Service, so it follows Mealie to either site.
    nginx.ingress.kubernetes.io/service-upstream: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($uri ~* "^/(login|api/auth/(token|oauth|reverse-proxy))") { return 403; }
      set $kiosk_login "";
      if ($uri = "/kiosk-login") { set $kiosk_login "1"; }
      if ($arg_t ~ "^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$") { set $kiosk_login "${kiosk_login}t"; }
      set $kiosk_next "/g/home";
      if ($arg_next ~ "^(/[A-Za-z0-9_-][A-Za-z0-9/_-]*)$") { set $kiosk_next $1; }
      if ($kiosk_login = "1") { return 400; }
      if ($kiosk_login = "1t") {
        add_header Set-Cookie "mealie.access_token=$arg_t; Path=/; Max-Age=31536000; Secure; SameSite=None; Partitioned" always;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        return 302 $kiosk_next;
      }
spec:
  ingressClassName: nginx-internal
  rules:
    - host: &host "mealie-embed.${INTERNAL_DOMAIN}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mealie
                port:
                  number: 9000
  tls:
    - hosts:
        - *host
