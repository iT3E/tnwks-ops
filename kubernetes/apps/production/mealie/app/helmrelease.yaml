---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mealie
spec:
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 30m
  maxHistory: 2
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      mealie:
        containers:
          app:
            image:
              repository: ghcr.io/mealie-recipes/mealie
              tag: v3.30.0
            envFrom:
              # OIDC_CONFIGURATION_URL, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET
              - secretRef:
                  name: mealie-secret
            env:
              - name: TZ
                value: "${TIMEZONE}"
              - name: ALLOW_SIGNUP
                value: "false"
              # Sessions last TOKEN_TIME hours and slide while used. The
              # kitchen wall display signs in once as the local `kitchen`
              # user (password login; Cognito's login page refuses to load
              # in HA's frame), so 48h (the default) would sign it out after
              # a quiet weekend.
              - name: TOKEN_TIME
                value: "720"
              - name: BASE_URL
                value: "https://recipes.${SECRET_DOMAIN}"
              - name: DB_ENGINE
                value: "postgres"
              - name: POSTGRES_USER
                valueFrom:
                  secretKeyRef:
                    name: postgres-app
                    key: username
              - name: POSTGRES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: postgres-app
                    key: password
              - name: POSTGRES_SERVER
                value: "postgres-rw.databases.svc.cluster.local"
              - name: POSTGRES_PORT
                value: "5432"
              - name: POSTGRES_DB
                value: "app"
              # Log in with tnwks-auth (Cognito) through Mealie's own OIDC
              # support (app client `mealie`, infrastructure/terraform/modules/aws/cognito.tf).
              # Not oauth2-proxy: the HA Mealie integration and the apps use
              # Mealie-issued API tokens. cognito:groups admins -> admin,
              # viewers -> user, anyone else is refused. Password login stays
              # on for the break-glass admin account.
              - name: OIDC_AUTH_ENABLED
                value: "true"
              - name: OIDC_PROVIDER_NAME
                value: "tnwks"
              - name: OIDC_SIGNUP_ENABLED
                value: "true"
              - name: OIDC_ADMIN_GROUP
                value: "admins"
              - name: OIDC_USER_GROUP
                value: "viewers"
              - name: OIDC_GROUPS_CLAIM
                value: "cognito:groups"
              - name: OIDC_REMEMBER_ME
                value: "true"
              # Mealie asks for the groups claim as a scope by default, and
              # Cognito rejects "cognito:groups" as invalid_scope. The claim is
              # in the id_token anyway.
              - name: OIDC_SCOPES_OVERRIDE
                value: "openid email profile"
              # Cognito users have no "name" attribute, and Mealie refuses a
              # login with a missing claim.
              - name: OIDC_NAME_CLAIM
                value: "email"
    service:
      app:
        controller: mealie
        ports:
          http:
            port: 9000
    persistence:
      config:
        enabled: true
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: ${STORAGE_CLASS_DEFAULT}
        globalMounts:
          - path: /app/data
    ingress:
      app:
        className: nginx
        annotations:
          external-dns.alpha.kubernetes.io/target: "ingress.${SECRET_DOMAIN}"
          hajimari.io/appName: Recipes
          hajimari.io/group: Home
          hajimari.io/icon: mdi:food
        hosts:
          - host: &host "recipes.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
