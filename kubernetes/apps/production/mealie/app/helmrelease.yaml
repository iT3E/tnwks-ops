---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mealie
spec:
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    createNamespace: true
    # A standby site runs Mealie at 0 replicas, so its WaitForFirstConsumer
    # config PVC stays unbound until a restore or a failover mounts it, and
    # Helm's wait (kstatus: PVC not Bound = in progress) would never finish.
    disableWait: ${MEALIE_HELM_DISABLE_WAIT:=false}
    remediation:
      retries: 3
  interval: 30m
  maxHistory: 2
  upgrade:
    cleanupOnFail: true
    disableWait: ${MEALIE_HELM_DISABLE_WAIT:=false}
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      mealie:
        # Which site runs it (docs/wsl/multi-site.md, "Switching an app").
        replicas: ${MEALIE_REPLICAS:=1}
        initContainers:
          site-lease-gate:
            # Fencing (docs/wsl/multi-site.md): wait while this site is fenced from
            # writing mealie (mealie.lease.tnwks.local names it), or while the lease
            # can't be read. MEALIE_LEASE_GATE=off in site-overrides skips it.
            image:
              repository: docker.io/library/busybox
              tag: 1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
            command: ["sh", "-c"]
            args:
              - |
                [ "$GATE" = off ] && { echo "lease gate off"; exit 0; }
                while true; do
                  t=$(nslookup -type=txt "$LEASE" 2>/dev/null | sed -n 's/.*text = "\(.*\)"/\1/p' | head -1)
                  if [ -z "$t" ]; then echo "lease $LEASE unreadable; waiting"
                  elif [ "$t" = "$SITE" ]; then echo "$SITE is fenced from writing mealie; waiting"
                  else echo "lease $LEASE: $t; not fenced, starting"; exit 0; fi
                  sleep 10
                done
            env:
              LEASE: mealie.lease.tnwks.local.
              SITE: ${CLUSTER_NAME}
              GATE: ${MEALIE_LEASE_GATE:=on}
            securityContext:
              runAsUser: 65534
              runAsGroup: 65534
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 5m
                memory: 8Mi
              limits:
                memory: 32Mi
        containers:
          app:
            image:
              repository: ghcr.io/mealie-recipes/mealie
              tag: v3.30.0
            envFrom:
              # OIDC_CONFIGURATION_URL, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET
              - secretRef:
                  name: mealie-secret
            env:
              - name: TZ
                value: "${TIMEZONE}"
              - name: ALLOW_SIGNUP
                value: "false"
              # Sessions last TOKEN_TIME hours and slide while used (48h by
              # default). The kitchen wall display doesn't depend on it any
              # more: its frame signs in as the kiosk user with an API token
              # through mealie-embed (ingress-embed.yaml).
              - name: TOKEN_TIME
                value: "720"
              - name: BASE_URL
                value: "https://recipes.${SECRET_DOMAIN}"
              - name: DB_ENGINE
                value: "postgres"
              # Own cnpg role (`mealie`) and own database (`mealie`), login in
              # mealie-secret. Until 2026-11 it used `app`, the cluster's
              # first-boot database, which is kept as the rollback copy.
              - name: POSTGRES_USER
                valueFrom:
                  secretKeyRef:
                    name: mealie-secret
                    key: POSTGRES_USER
              - name: POSTGRES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: mealie-secret
                    key: POSTGRES_PASSWORD
              # Its own CNPG cluster since 2026-11-05 (mealie/db); the shared
              # cluster's `mealie` database is the rollback copy.
              - name: POSTGRES_SERVER
                value: "mealie-pg-rw.databases.svc.cluster.local"
              - name: POSTGRES_PORT
                value: "5432"
              - name: POSTGRES_DB
                value: "mealie"
              # Log in with tnwks-auth (Cognito) through Mealie's own OIDC
              # support (app client `mealie`, infrastructure/terraform/modules/aws/cognito.tf).
              # Not oauth2-proxy: the HA Mealie integration and the apps use
              # Mealie-issued API tokens. cognito:groups admins -> admin,
              # viewers -> user, anyone else is refused. Password login stays
              # on for the break-glass admin account.
              - name: OIDC_AUTH_ENABLED
                value: "true"
              - name: OIDC_PROVIDER_NAME
                value: "tnwks"
              - name: OIDC_SIGNUP_ENABLED
                value: "true"
              - name: OIDC_ADMIN_GROUP
                value: "admins"
              - name: OIDC_USER_GROUP
                value: "viewers"
              - name: OIDC_GROUPS_CLAIM
                value: "cognito:groups"
              - name: OIDC_REMEMBER_ME
                value: "true"
              # Mealie asks for the groups claim as a scope by default, and
              # Cognito rejects "cognito:groups" as invalid_scope. The claim is
              # in the id_token anyway.
              - name: OIDC_SCOPES_OVERRIDE
                value: "openid email profile"
              # Cognito users have no "name" attribute, and Mealie refuses a
              # login with a missing claim.
              - name: OIDC_NAME_CLAIM
                value: "email"
    service:
      app:
        controller: mealie
        # Global across the WSL sites (Cilium Cluster Mesh): the other site's
        # ingress (the shared VIP) reaches this app wherever it runs.
        annotations:
          service.cilium.io/global: "true"
          service.cilium.io/affinity: local
        ports:
          http:
            port: 9000
    persistence:
      config:
        enabled: true
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: ${STORAGE_CLASS_DEFAULT}
        globalMounts:
          - path: /app/data
    ingress:
      app:
        className: nginx
        annotations:
          hajimari.io/appName: Recipes
          hajimari.io/group: Home
          hajimari.io/icon: mdi:food
          # Through the Service's ClusterIP, not the pod endpoints: on the site
          # where the app is at 0, only Cilium knows the other site's backends. (Public: cloudflared is on homelab-wsl.)
          nginx.ingress.kubernetes.io/service-upstream: "true"
        hosts:
          - host: &host "recipes.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
