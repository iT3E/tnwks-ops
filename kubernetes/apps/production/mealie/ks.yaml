---
# Mealie's own Postgres (Phase 3, kubernetes/components/cnpg-cluster).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mealie-db
  namespace: flux-system
spec:
  path: ./kubernetes/apps/production/mealie/db
  components:
    - ../../../../components/cnpg-cluster
  dependsOn:
    - name: cloudnative-pg-plugin-barman-cloud
    - name: aws-backup-credentials
    - name: cloudnative-pg-cluster
  prune: true
  # The Cluster's Ready condition gates Mealie. kstatus alone isn't enough: a
  # Cluster with no status yet counts as Current, so Mealie started before
  # mealie-pg existed (2026-11-05). This waits for Ready=True; with no status
  # the expression errors, which Flux also treats as not ready yet.
  wait: true
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 30m
  retryInterval: 1m
  timeout: 15m
  postBuild:
    substitute:
      CNPG_APP: mealie
      CNPG_SIZE: 1Gi
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mealie
  namespace: flux-system
spec:
  dependsOn:
    - name: mealie-db
  path: ./kubernetes/apps/production/mealie/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false # no flux ks dependents
  # The OIDC client secret ships as a SOPS-encrypted Secret.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 30m
  retryInterval: 1m
  timeout: 5m
