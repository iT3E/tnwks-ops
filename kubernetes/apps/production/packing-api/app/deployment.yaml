---
# packing-api — the write-backend for the editable, multi-user packing list on
# the Van Trip page of the sites platform. The site itself is static (nginx off
# NFS); this is the one stateful piece, so it gets its own tiny service +
# Postgres-backed store.
#
# Source + image build: github.com/iT3E/tnwks-packing-api. Pinned to a release
# (<version>@sha256); every release becomes a Renovate PR here that
# automerges behind Build Success (docs/operations/renovate.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: packing-api
  namespace: production
  labels:
    app.kubernetes.io/name: packing-api
  annotations:
    # Roll the pod when packing-api-secret (its Postgres login) rotates.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: packing-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: packing-api
    spec:
      containers:
        - name: packing-api
          # A release, by digest: what runs only changes through git.
          image: ghcr.io/it3e/tnwks-packing-api:0.2.1@sha256:4980fac4c6ab7eb8fad38b488662fb2fd28ca79741a777954d3db709d7503876
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # DB connection as its own cnpg role (`packing_api`), login in
            # packing-api-secret (SOPS).
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: packing-api-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: packing-api-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_SERVER
              value: "postgres-rw.databases.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "vantrip"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
