---
# The transcriber's own CNPG cluster, databases/transcriber-pg:
# ../../../../components/cnpg-cluster plus cnpg-standby (both added by the
# transcriber-db Kustomization), the same manifest on both sites. The site
# named by TRANSCRIBER_PG_PRIMARY runs the primary; the other a replica
# cluster from its WAL archive.
#
# Imported from the shared cluster's `transcriber` database on 2026-11-05
# (#1767); that copy stays there as the rollback. bootstrap is only read when
# a Cluster is created, and a new one now restores from the peer's archive.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # The owner role's password, the same on both sites.
  - ./secret-transcriber-role.sops.yaml
patches:
  - target:
      kind: Cluster
    patch: |-
      # Which site is primary, and on the side being promoted only, the old
      # primary's demotion token (docs/wsl/multi-site.md). Empty is allowed
      # on a replica; a token isn't. The empty default carries its quotes:
      # kustomize drops quotes around a ${...}, and a bare empty value is null,
      # which the CRD rejects. A token (base64 JSON, "ey...") needs none.
      - op: add
        path: /spec/replica/primary
        value: ${TRANSCRIBER_PG_PRIMARY:=homelab-wsl}
      - op: add
        path: /spec/replica/promotionToken
        value: ${TRANSCRIBER_PG_PROMOTION_TOKEN:=""}
