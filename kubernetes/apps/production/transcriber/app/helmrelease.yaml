---
# Speech on the cameras, transcribed and diarized, into Postgres. Fully
# local, on CPU. Code and images: iT3E/tnwks-transcriber and
# iT3E/tnwks-transcriber-web (private repos, public images with no data in
# them). docs/apps/transcriber.md has the flow, the UI and the storage.
#
# Two controllers:
#   transcriber  the capture and transcription service (container app) and
#                the JSON API the UI calls (container web). One pod: web
#                needs the same audio volume, and a ReadWriteOnce PVC can't
#                be shared across pods on another node.
#   frontend     the Angular UI (nginx, static files). Its own pod, so a UI
#                release never restarts capture.
# The ingress serves both on one host: /api -> web, the rest -> frontend,
# behind oauth2-proxy limited to the Cognito group `transcriber`.
# Daily summaries: web calls claude-sonnet through LiteLLM with its own key
# (LITELLM_API_KEY in transcriber-secret, the `transcriber` entry in
# ai/litellm's secret-keys); docs/apps/litellm.md.
#
# Notes on the values below:
# - CAMERAS maps each Frigate camera (its MQTT topic name) to the go2rtc
#   stream that carries its audio. Keep it to the cameras with an `audio`
#   role in frigate/app/resources/config.yml; a stream with no audio track
#   just restarts ffmpeg every few seconds.
# - Singleton (Recreate, 1 replica): the queue claim is safe with more, but
#   two copies would both capture and cut every clip twice.
# - The buffer is RAM: ~3 KB/s per camera for BUFFER_SECONDS, kept off the
#   shared WSL disk (the frigate tmp-cache note explains why that matters).
# - Clip audio on local-path-bulk, ~7 MB per hour of speech, deleted after
#   AUDIO_RETENTION_DAYS; transcripts stay in Postgres. Not backed up by
#   kopiur: the transcripts are (with the database), the audio isn't.
# - Models (~1 GB: whisper, wav2vec2, pyannote) download once into the
#   models PVC on first start. Until then capture runs and clips queue.
# - THREADS / OMP_NUM_THREADS 4 and the 4-core limit: transcription bursts
#   while a clip is processed and is idle otherwise. All three WSL nodes
#   share one 12-thread host with Frigate.
# - Volumes use advancedMounts, not globalMounts: globalMounts would mount
#   the transcriber's PVCs into the frontend pod as well.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: transcriber
spec:
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  interval: 30m
  maxHistory: 2
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      transcriber:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          terminationGracePeriodSeconds: 60
        initContainers:
          selfcheck:
            image: &image
              repository: ghcr.io/it3e/tnwks-transcriber
              tag: 0.3.0@sha256:12cb5fd7e58c50b77a5486b4ebff2924d81b8fccccf24e6561e95163a22ae2f0
            args:
              - selfcheck
            envFrom: &envFrom
              - secretRef:
                  name: transcriber-secret
            env: &env
              TZ: ${TIMEZONE}
              CAMERAS: >-
                frigate_loryta_fdoor=frigate_loryta_fdoor_hq,
                frigate_reolink_south=frigate_reolink_south_lq
              RTSP_BASE_URL: rtsp://frigate-app.production.svc.cluster.local:8554
              MQTT_HOST: mosquitto.home-automation.svc.cluster.local
              AUDIO_RETENTION_DAYS: "90"
              WHISPER_MODEL: small.en
              THREADS: "4"
              OMP_NUM_THREADS: "4"
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image: *image
            args:
              - run
            envFrom: *envFrom
            env: *env
            securityContext: *securityContext
            probes:
              # /healthz is up before the models load and fails only when a
              # capture or worker thread has died or the worker has stalled.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &metricsPort 8080
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 4
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                cpu: "4"
                memory: 6Gi
          # The JSON API for the UI (no models loaded). It shares the pod for
          # the audio volume; it reads clips and caches per-voice cuts in /tmp.
          web:
            image: *image
            args:
              - web
            envFrom: *envFrom
            env:
              TZ: ${TIMEZONE}
              WEB_PORT: "8081"
            securityContext: *securityContext
            probes:
              liveness: &webProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthz
                    port: 8081
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *webProbe
              startup:
                enabled: false
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 512Mi
      frontend:
        replicas: 1
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/it3e/tnwks-transcriber-web
              tag: 9.9.9
            securityContext: *securityContext
            probes:
              liveness: &frontendProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &frontendPort 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *frontendProbe
              startup:
                enabled: false
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
    service:
      app:
        controller: transcriber
        ports:
          http:
            port: *metricsPort
          web:
            port: 8081
      frontend:
        controller: frontend
        ports:
          http:
            port: *frontendPort
    serviceMonitor:
      app:
        enabled: ${SERVICE_MONITOR_ENABLED}
        serviceName: transcriber-app
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 60s
            scrapeTimeout: 10s
    # Internal only (nginx-internal), behind oauth2-proxy with the shared
    # .tnwks.us SSO session, and only for the Cognito group `transcriber`:
    # these are household conversations and their audio.
    ingress:
      app:
        className: nginx-internal
        annotations:
          nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.auth.svc.cluster.local:80/oauth2/auth?allowed_groups=transcriber"
          nginx.ingress.kubernetes.io/auth-signin: "https://oauth2.${INTERNAL_DOMAIN}/oauth2/start?rd=$scheme://$host$escaped_request_uri"
          # Cognito-backed sessions are split across multiple cookies; the
          # subrequest header chunk overflows nginx's default 4k buffer.
          nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
          nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
          # POST /api/days/<day>/summary waits on the LLM (seconds, up to the
          # transcriber's SUMMARY_TIMEOUT_S of 150); nginx's default is 60s.
          nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
        hosts:
          - host: &host "{{ .Release.Name }}.${CLUSTER_DOMAIN}"
            paths:
              - path: /api
                pathType: Prefix
                service:
                  identifier: app
                  port: web
              - path: /
                pathType: Prefix
                service:
                  identifier: frontend
                  port: http
        # The controller's default cert (*.internal.tnwks.us) covers the
        # host; listing it makes nginx redirect plain http to https.
        tls:
          - hosts:
              - *host
    persistence:
      audio:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 20Gi
        storageClass: local-path-bulk
        retain: true
        advancedMounts:
          transcriber:
            selfcheck:
              - path: /audio
            app:
              - path: /audio
            web:
              - path: /audio
                readOnly: true
      models:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: ${STORAGE_CLASS_DEFAULT}
        retain: true
        advancedMounts:
          transcriber:
            selfcheck:
              - path: /models
            app:
              - path: /models
      buffer:
        type: emptyDir
        medium: Memory
        sizeLimit: 64Mi
        advancedMounts:
          transcriber:
            selfcheck:
              - path: /buffer
            app:
              - path: /buffer
      tmp:
        type: emptyDir
        advancedMounts:
          transcriber:
            selfcheck:
              - path: /tmp
            app:
              - path: /tmp
            web:
              - path: /tmp
          frontend:
            app:
              - path: /tmp
      nginx-cache:
        type: emptyDir
        advancedMounts:
          frontend:
            app:
              - path: /var/cache/nginx
