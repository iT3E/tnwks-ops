---
# vaultwarden's own CNPG cluster, databases/vaultwarden-pg, from
# ../../../../components/cnpg-cluster (added by the vaultwarden-db Kustomization).
#
# First boot imports `bitwarden` from the shared cluster (CNPG initdb.import,
# microservice) as the owner role: the shared cluster has superuser access
# off, and vaultwarden owns every object. bootstrap is only read when the Cluster
# is created; the shared copy stays as the rollback.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./secret-vaultwarden-role.sops.yaml
patches:
  - target:
      kind: Cluster
    patch: |-
      - op: add
        path: /spec/bootstrap/initdb/import
        value:
          type: microservice
          databases: [bitwarden]
          source:
            externalCluster: postgres
      - op: add
        path: /spec/externalClusters
        value:
          - name: postgres
            connectionParameters:
              host: postgres-rw.databases.svc.cluster.local
              user: vaultwarden
              dbname: bitwarden
              sslmode: require
            password:
              name: postgres-vaultwarden
              key: password
