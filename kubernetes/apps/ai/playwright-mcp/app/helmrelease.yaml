---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app playwright-mcp
spec:
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 30m
  maxHistory: 2
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      playwright-mcp:
        # homelab-wsl only, beside the central MCP gateway and the fetch proxy
        # of the main agent (docs/apps/playwright-mcp.md). It does not move
        # between the sites.
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            # Microsoft's own image. The Acuvity rebuild it replaced lagged
            # upstream by ~27 releases and pushes its Helm chart into the same
            # repo as tag 1.0.0, which Renovate can't tell apart from an image.
            # The entrypoint already runs headless Chromium with --no-sandbox;
            # these args add the HTTP transport (/mcp, plus legacy /sse). The
            # tool list of this image is in
            # kubernetes/apps/ai/mcp-gateway/tools/browser.json: read it again
            # at each update (docs/apps/playwright-mcp.md, "Updates").
            image:
              repository: mcr.microsoft.com/playwright/mcp
              tag: v0.0.85@sha256:8ca417ff2a3660b770d7dd4a293bd179d0f3c29d0d5fb5bc43d3be617b1566a2
            # The flags of the design (Design Doc of effort 0003, section
            # 4.2.6, "The browser, its rails"), each in the README of this
            # release.
            args:
              - --port=8000
              - --host=0.0.0.0
              # Only the Host that the central MCP gateway, the one caller,
              # sends: the name of the Service with no port. The server
              # matches the whole Host exactly, and agentgateway 1.7.0 sets
              # the host name of the target as Host, without its port.
              - --allowed-hosts=playwright-mcp.ai.svc.cluster.local
              # A browser context of its own, in memory, for each session.
              - --isolated
              - --headless
              # A page can not add tools.
              - --no-webmcp
              - --block-service-workers
              # These values of a URL show as <redacted> in a tool answer.
              - --redact-url-params=access_token,id_token,refresh_token,code,token,key,api_key,apikey,password,secret,signature,sig
              # Each page through the fetch proxy of the main agent, which
              # takes a CONNECT to port 443 of a public address only: so the
              # browser loads HTTPS pages only. The network policy is the
              # wall, not this flag.
              - --proxy-server=http://fetch-proxy.agents-main.svc.cluster.local:8080
            probes:
              # No health endpoint (GET / is a 400), so probe the socket.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8000
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8000
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 12
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false # Playwright needs writable dirs
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
    service:
      app:
        controller: playwright-mcp
        # Local to this cluster: its only caller, the central MCP gateway,
        # runs here too. No ingress: an agent reaches it through the gateway
        # only (networkpolicy.yaml).
        ports:
          http:
            port: 8000
    persistence:
      tmp:
        type: emptyDir
        advancedMounts:
          playwright-mcp:
            app:
              - path: /tmp
      home:
        type: emptyDir
        advancedMounts:
          playwright-mcp:
            app:
              - path: /home/node
