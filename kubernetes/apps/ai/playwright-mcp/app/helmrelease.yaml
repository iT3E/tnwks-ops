---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app playwright-mcp
spec:
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 30m
  maxHistory: 2
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      playwright-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            # Microsoft's own image. The Acuvity rebuild it replaced lagged
            # upstream by ~27 releases and pushes its Helm chart into the same
            # repo as tag 1.0.0, which Renovate can't tell apart from an image.
            # The entrypoint already runs headless Chromium with --no-sandbox;
            # these args add the HTTP transport (/mcp, plus legacy /sse).
            image:
              repository: mcr.microsoft.com/playwright/mcp
              tag: v0.0.83
            args:
              - --port=8000
              - --host=0.0.0.0
              # Requests arrive with the ingress hostname or the Service name
              # as Host; the default only allows localhost.
              - --allowed-hosts=*
              # Fresh in-memory browser profile per session.
              - --isolated
            probes:
              # No health endpoint (GET / is a 400), so probe the socket.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8000
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8000
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 12
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false # Playwright needs writable dirs
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
    service:
      app:
        controller: playwright-mcp
        ports:
          http:
            port: 8000
    ingress:
      app:
        className: nginx-internal
        hosts:
          - host: &host "playwright-mcp.${INTERNAL_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
    persistence:
      tmp:
        type: emptyDir
        advancedMounts:
          playwright-mcp:
            app:
              - path: /tmp
      home:
        type: emptyDir
        advancedMounts:
          playwright-mcp:
            app:
              - path: /home/node
