---
# The metrics of the MCP gateway: the request series by route and status,
# and the connection series (docs/apps/mcp-gateway.md, "Logs and metrics").
# No client key, no argument and no tool name is a label: the gateway makes
# no agentgateway_mcp_requests_total (config.metrics.remove), whose tool
# label a client sets, and the scrape drops it as well, in case a release
# makes it again. The label `method` is the HTTP method that a client
# sends, any word, also on a refused request: the scrape keeps the series of
# the standard methods only and drops the others (mapping them to one value
# would make two series one, which Prometheus refuses as duplicate samples);
# the access log has each request.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mcp-gateway
  namespace: ai
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: agentgateway_mcp_requests_total
          action: drop
        - sourceLabels: [method]
          regex: GET|HEAD|POST|PUT|DELETE|OPTIONS|PATCH
          targetLabel: __tmp_known_method
          replacement: "yes"
        - sourceLabels: [method, __tmp_known_method]
          regex: .+;
          action: drop
        - regex: __tmp_known_method
          action: labeldrop
