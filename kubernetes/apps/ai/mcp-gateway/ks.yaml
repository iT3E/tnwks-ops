---
# The MCP gateway of the agent platform (docs/apps/mcp-gateway.md): each MCP
# call of an agent goes through it, for every trust domain, next to the
# model gateway.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mcp-gateway
  namespace: flux-system
spec:
  path: ./kubernetes/apps/ai/mcp-gateway/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
