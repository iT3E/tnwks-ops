---
# http://model-bridge.ai.svc.cluster.local:8080, for the model gateway only
# (networkpolicy.yaml).
apiVersion: v1
kind: Service
metadata:
  name: model-bridge
  namespace: ai
  labels:
    app.kubernetes.io/name: model-bridge
spec:
  selector:
    app.kubernetes.io/name: model-bridge
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
