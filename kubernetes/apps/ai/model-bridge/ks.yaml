---
# The model bridge of the agent platform (docs/apps/agent-platform.md): the
# Messages API in, the Claude Agent SDK out, next to the model gateway, which
# is its one caller.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: model-bridge
  namespace: flux-system
spec:
  path: ./kubernetes/apps/ai/model-bridge/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false # no flux ks dependents
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 30m
  retryInterval: 1m
  timeout: 5m
