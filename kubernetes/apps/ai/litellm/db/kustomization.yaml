---
# litellm's own CNPG cluster, databases/litellm-pg, from
# ../../../../components/cnpg-cluster (added by the litellm-db Kustomization).
#
# Imported `litellm` from homelab-wsl's shared cluster at first boot (CNPG
# initdb.import). That cluster is retired, and bootstrap is only read when a
# Cluster is created, so the import patch is gone.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./secret-litellm-role.sops.yaml
