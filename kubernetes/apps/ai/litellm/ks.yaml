---
# litellm's own Postgres (kubernetes/components/cnpg-cluster).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm-db
  namespace: flux-system
spec:
  path: ./kubernetes/apps/ai/litellm/db
  components:
    - ../../../../components/cnpg-cluster
  dependsOn:
    - name: cloudnative-pg-plugin-barman-cloud
    - name: aws-backup-credentials
  # The owner role's Secret ships with it (db/).
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  prune: true
  # The Cluster's Ready condition gates the app; kstatus alone calls a
  # Cluster with no status yet Current (components/cnpg-cluster/README.md).
  wait: true
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 30m
  retryInterval: 1m
  timeout: 15m
  postBuild:
    substitute:
      CNPG_APP: litellm
      CNPG_SIZE: 1Gi
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm
  namespace: flux-system
spec:
  path: ./kubernetes/apps/ai/litellm/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false # no flux ks dependents
  # Gate on the CNPG cluster Kustomization: it owns both the `litellm`
  # Database (created by the operator) and the `litellm` role it logs in as.
  # litellm needs both at startup.
  dependsOn:
    - name: litellm-db
    # The PrometheusRule (Bedrock certificate expiry) needs its CRD.
    - name: kube-prometheus-stack
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 30m
  retryInterval: 1m
  timeout: 5m
