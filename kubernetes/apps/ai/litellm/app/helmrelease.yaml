---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app litellm
spec:
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 30m
  maxHistory: 2
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      litellm:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # The Roles Anywhere signing helper isn't in a public image: fetch
          # the pinned release and check it, as aws-backup-credentials does
          # (kubernetes/apps/kopiur-system/aws-backup-credentials).
          fetch-signing-helper:
            image: &python
              repository: docker.io/library/python
              tag: 3.15.2-slim-trixie@sha256:8c13a3f37a6a5b71498228e902c4b9f51c1f7900d49fabf71f9a650c6120e0d0
            command:
              - python3
              - -c
              - |
                import hashlib, os, urllib.request
                data = urllib.request.urlopen(os.environ["HELPER_URL"], timeout=120).read()
                got = hashlib.sha256(data).hexdigest()
                if got != os.environ["HELPER_SHA256"]:
                    raise SystemExit("aws_signing_helper checksum mismatch: " + got)
                path = "/helper/aws_signing_helper"
                with open(path, "wb") as f:
                    f.write(data)
                os.chmod(path, 0o755)
                print("aws_signing_helper", os.environ["HELPER_VERSION"], "ok")
            env:
              # renovate: datasource=github-releases depName=aws/rolesanywhere-credential-helper
              HELPER_VERSION: "1.8.6"
              HELPER_URL: "https://rolesanywhere.amazonaws.com/releases/1.8.5/X86_64/Linux/Amzn2023/aws_signing_helper"
              HELPER_SHA256: "beec9ed1c492d93db809890f16713e3556353294b823c2184ad4e891f1b2b54d"
        containers:
          app:
            image:
              repository: ghcr.io/berriai/litellm
              # Pinned release + digest so Renovate can bump it. Upstream
              # publishes plain `vX.Y.Z` release tags (plus -rc/-dev, the old
              # `-stable` suffix ended at v1.83.14, and moving `main-*` tags);
              # Renovate only follows the plain ones (.github/renovate).
              # Since v1.104 the proxy refuses to start on an unset, empty or
              # public (sk-1234) master key; LITELLM_MASTER_KEY below is fine.
              tag: v1.106.6@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06
            args:
              - --config
              - /etc/litellm/config.yaml
              - --port
              - "4000"
            env:
              # LiteLLM's own cnpg role (`litellm`), password in litellm-secret.
              # Composed into DATABASE_URL via k8s env-var expansion, so the
              # password itself never lands in git.
              - name: DATABASE_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: litellm-secret
                    key: DATABASE_PASSWORD
              - name: DATABASE_URL
                value: "postgresql://litellm:$(DATABASE_PASSWORD)@postgres-rw.databases.svc.cluster.local:5432/litellm"
              - name: LITELLM_MASTER_KEY
                valueFrom:
                  secretKeyRef:
                    name: litellm-secret
                    key: LITELLM_MASTER_KEY
              # Bedrock credentials: boto3 reads them from the aws-credentials
              # sidecar, which serves the EC2 metadata API on localhost.
              - name: AWS_EC2_METADATA_SERVICE_ENDPOINT
                value: http://127.0.0.1:9911/
              - name: AWS_REGION
                value: us-east-1
              - name: AWS_DEFAULT_REGION
                value: us-east-1
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveliness
                    port: 4000
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: 4000
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
          # Roles Anywhere: the client certificate (litellm-roles-anywhere) to
          # short-lived STS credentials, refreshed by the helper, served as an
          # EC2 metadata endpoint on 127.0.0.1:9911 inside the pod only.
          aws-credentials:
            image: *python
            command:
              - /helper/aws_signing_helper
            args:
              - serve
              - --port
              - "9911"
              - --certificate
              - /roles-anywhere/client-cert.pem
              - --private-key
              - /roles-anywhere/client-key.pem
              - --trust-anchor-arn
              - $(TRUST_ANCHOR_ARN)
              - --profile-arn
              - $(PROFILE_ARN)
              - --role-arn
              - $(ROLE_ARN)
            envFrom:
              - secretRef:
                  name: litellm-roles-anywhere
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
          # Makes LiteLLM's virtual keys match litellm-keys (create or update
          # by key value; see scripts/ensure_keys.py), then re-checks every 6 h.
          # Reloader restarts the pod when that Secret changes.
          ensure-keys:
            image:
              repository: ghcr.io/berriai/litellm
              tag: v1.106.6@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06
            command:
              - python3
              - /scripts/ensure_keys.py
            env:
              - name: LITELLM_MASTER_KEY
                valueFrom:
                  secretKeyRef:
                    name: litellm-secret
                    key: LITELLM_MASTER_KEY
              - name: KEYS_FILE
                value: /keys/keys.json
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      app:
        controller: litellm
        ports:
          http:
            port: 4000
    persistence:
      signing-helper:
        type: emptyDir
        advancedMounts:
          litellm:
            fetch-signing-helper:
              - path: /helper
            aws-credentials:
              - path: /helper
                readOnly: true
      roles-anywhere:
        type: secret
        name: litellm-roles-anywhere
        defaultMode: 0400
        advancedMounts:
          litellm:
            aws-credentials:
              - path: /roles-anywhere
                readOnly: true
      keys:
        type: secret
        name: litellm-keys
        defaultMode: 0400
        advancedMounts:
          litellm:
            ensure-keys:
              - path: /keys
                readOnly: true
      ensure-keys-script:
        type: configMap
        name: litellm-ensure-keys
        advancedMounts:
          litellm:
            ensure-keys:
              - path: /scripts
                readOnly: true
      config:
        type: configMap
        name: litellm-config
        advancedMounts:
          litellm:
            app:
              - subPath: config.yaml
                path: /etc/litellm/config.yaml
                readOnly: true
