---
# LiteLLM proxy config. Mounted into the pod at /etc/litellm/config.yaml and
# passed via `--config`. The three local models, and the embedding model of
# the pilot agent, proxy to Ollama running natively on the WSL host (see
# OLLAMA_BASE_URL in cluster-settings; Flux substitutes it). claude-sonnet is
# Bedrock, through the Converse API, with credentials from the aws-credentials sidecar (helmrelease.yaml). The
# claude-opus-* entries and model_group_alias serve the agent platform.
#
# Secrets (master key, DB URL, bridge keys) are NOT in this ConfigMap; litellm
# resolves them at runtime from env vars via the `os.environ/<VAR>`
# indirection, and those env vars are sourced from the sops Secret /
# reflected CNPG secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai
data:
  config.yaml: |
    model_list:
      - model_name: gemma3:12b
        litellm_params:
          model: ollama_chat/gemma3:12b
          api_base: ${OLLAMA_BASE_URL}
      - model_name: llama3.1:8b
        litellm_params:
          model: ollama_chat/llama3.1:8b
          api_base: ${OLLAMA_BASE_URL}
      - model_name: qwen3:8b
        litellm_params:
          model: ollama_chat/qwen3:8b
          api_base: ${OLLAMA_BASE_URL}
      # Claude Sonnet on Bedrock (cross-region inference profile). The
      # transcriber's daily summaries use it; its key is limited to it.
      - model_name: claude-sonnet
        litellm_params:
          model: bedrock/converse/us.anthropic.claude-sonnet-5-5
          aws_region_name: us-east-1
      # The agent platform (docs/apps/litellm.md, "The agent platform").
      # Agents never call these entries by name: each trust domain calls its
      # own name in router_settings.model_group_alias below, and its key
      # lists that name only.
      #
      # Claude Opus on the Claude plan, through the model bridge: one entry
      # for each trust domain, each with the bridge key of that trust domain
      # (sent as x-api-key; the bridge knows the trust domain by it).
      #
      # num_retries: 0 on each bridge entry (a decision of the owner,
      # 2026-11-14): the gateway sends each request to the bridge one time,
      # for every error, a 429 at the usage limit of the plan too. The router
      # default is 2 retries. The value is on the entry, so it goes where the
      # bridge goes: a name moved to Bedrock gets the retries of the Bedrock
      # entry, and every other entry keeps the default.
      - model_name: claude-opus-bridge-main
        litellm_params:
          model: anthropic/claude-opus-5-5
          api_base: http://model-bridge.ai.svc.cluster.local:8080
          api_key: os.environ/BRIDGE_KEY_MAIN
          num_retries: 0
      - model_name: claude-opus-bridge-finance
        litellm_params:
          model: anthropic/claude-opus-5-5
          api_base: http://model-bridge.ai.svc.cluster.local:8080
          api_key: os.environ/BRIDGE_KEY_FINANCE
          num_retries: 0
      - model_name: claude-opus-bridge-workflows
        litellm_params:
          model: anthropic/claude-opus-5-5
          api_base: http://model-bridge.ai.svc.cluster.local:8080
          api_key: os.environ/BRIDGE_KEY_WORKFLOWS
          num_retries: 0
      # Claude Opus on Bedrock (cross-region inference profile), the provider
      # after a move. The invoke route keeps a /v1/messages call in the
      # Messages format end to end; the converse route would translate it.
      - model_name: claude-opus-bedrock
        litellm_params:
          model: bedrock/invoke/us.anthropic.claude-opus-5-5
          aws_region_name: us-east-1
      # The memory search of the pilot agent: embeddings of its memory files
      # and of its search queries, on the Ollama of the host, so no vendor
      # gets that text. Only the pilot's key lists this name. It is an entry,
      # not a name of model_group_alias, and it does not move with a name.
      - model_name: agents-pilot-embeddings
        litellm_params:
          model: ollama/embeddinggemma-300m-q8
          api_base: ${OLLAMA_BASE_URL}
      # The same for the finance agent, on its own name: only the key
      # agents-finance lists it (docs/apps/litellm.md), so no other trust
      # domain can send text to it, and finance text goes to no vendor.
      - model_name: agents-finance-embeddings
        litellm_params:
          model: ollama/embeddinggemma-300m-q8
          api_base: ${OLLAMA_BASE_URL}
      # The same for the main agent, on its own name: only the key
      # agents-main lists it, once the owner adds it to that key.
      - model_name: agents-main-embeddings
        litellm_params:
          model: ollama/embeddinggemma-300m-q8
          api_base: ${OLLAMA_BASE_URL}

    router_settings:
      # The name of each trust domain of the agent platform, and the one
      # entry behind it. Moving a name between the plan and Bedrock is a
      # change of its one line here, by a person, in a pull request; a
      # revert moves it back. There is no fallback anywhere in this file, on
      # purpose: nothing moves a name but that line. The pilot has no bridge
      # key of its own and uses the main one.
      model_group_alias:
        agents-main: claude-opus-bridge-main
        agents-finance: claude-opus-bridge-finance
        agents-workflows: claude-opus-bridge-workflows
        agents-pilot: claude-opus-bridge-main

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL

    litellm_settings:
      drop_params: true
      # Prompt caching for every Claude model (Anthropic, Bedrock, Vertex,
      # Azure AI): LiteLLM marks the system prompt and the last turn as cache
      # points, so a repeated prefix within 5 minutes is read back at a tenth
      # of the input price. It stands down when the client sends its own
      # cache_control. A write costs 1.25x input, so a one-off call that
      # nothing reuses pays 25% more on its prompt; there is no per-request
      # or per-key off switch while this is on.
      enable_anthropic_prompt_caching: true
      # The Prometheus metrics of the gateway (docs/apps/litellm.md,
      # "Metrics"). /metrics asks for a key: the scrape uses the key
      # `metrics-scrape`, which calls no model and reads /metrics only
      # (helmrelease.yaml, serviceMonitor). The keep list below is the only
      # source of the series: each metric that it does not name is not made,
      # and each metric keeps only the labels that it names. Never add
      # end_user, user, user_email, client_ip, user_agent or hashed_api_key
      # (tests/test_model_gateway_metrics.py fails on any label not listed
      # there). No spend metric: the plan is not paid by the call.
      callbacks: ["prometheus"]
      prometheus_metrics_config:
        - group: calls
          metrics:
            - litellm_proxy_total_requests_metric
          include_labels: [api_key_alias, requested_model, api_provider, status_code]
        - group: failed-calls
          metrics:
            - litellm_proxy_failed_requests_metric
          include_labels: [api_key_alias, requested_model, api_provider, exception_status]
        - group: time
          metrics:
            - litellm_request_total_latency_metric
          include_labels: [api_key_alias, requested_model, api_provider]
        - group: tokens
          metrics:
            - litellm_input_tokens_metric
            - litellm_output_tokens_metric
          include_labels: [api_key_alias, requested_model, api_provider]
      # At most 100 label sets for each metric: each further one goes to one
      # series whose labels all read "other". The time histogram makes 20
      # series for each label set, so the worst case is 4 x 100 + 100 x 20
      # = 2,400 series.
      prometheus_metrics_max_series_per_metric: 100
