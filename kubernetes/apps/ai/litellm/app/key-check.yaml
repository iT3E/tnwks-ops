---
# The key of the metrics scrape calls no model (scripts/key_check.py): once a
# day it calls each model name of the gateway with that key, and each call
# must be refused. A later change that gives the key a model fails the Job;
# KubeJobFailed fires, and the AI board shows the CronJob on its Checks tab
# (observability/inventory.py, AI_SCHEDULES). Runs next to the gateway, in
# `ai`, because the Secret of the key is here.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: litellm-key-check
  labels:
    app.kubernetes.io/name: litellm-key-check
spec:
  schedule: "41 5 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # About 16 names, each call 60 s at most.
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: litellm-key-check
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            # The key file is 0440: its group is this one.
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              image: docker.io/library/python:3.15.2-slim-trixie@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
              command:
                - python3
                - /scripts/key_check.py
              env:
                - name: LITELLM_URL
                  value: http://litellm-app.ai.svc.cluster.local:4000
                - name: CONFIG_FILE
                  value: /config/config.yaml
                - name: KEY_FILE
                  value: /key/token
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: key
                  mountPath: /key
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: litellm-key-check
            # The gateway's own config: the check calls each name in it.
            - name: config
              configMap:
                name: litellm-config
            - name: key
              secret:
                secretName: litellm-metrics-scrape
                defaultMode: 0440
