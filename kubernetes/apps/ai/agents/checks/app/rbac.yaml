---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-checks
automountServiceAccountToken: false
---
# The probe reads where the pods of its sandbox run. Nothing more.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-checks
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-checks
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-checks
subjects:
  - kind: ServiceAccount
    name: platform-checks
