---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-checks
automountServiceAccountToken: false
---
# The probe reads the Sandbox record of its sandbox (for its id) and where
# the sandbox's pods run. Nothing more.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-checks
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-checks
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-checks
subjects:
  - kind: ServiceAccount
    name: platform-checks
