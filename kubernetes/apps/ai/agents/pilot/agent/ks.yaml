---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The pilot of a personal agent (docs/apps/agent-platform.md, "The pilot
# agent"): the agent pod, its state volume, its network policy and the
# backup policy of the volume, and the config and scripts of the pod.
# One Flux Kustomization for the pod and its config: the ConfigMaps are
# generated in app/ with a hash in their names, so a merge that changes the
# config and the pod template is one apply and one rollout. With the config
# in a Kustomization of its own, such a merge made two rollouts: Reloader
# for the ConfigMap, then Flux for the template
# (docs/apps/agent-platform.md, "A start of the agent pod").
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agents-pilot-agent
  namespace: flux-system
spec:
  targetNamespace: agents-pilot
  path: ./kubernetes/apps/ai/agents/pilot/agent/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    # The sticky bit on the root of its state volume (OpenClaw 2026.11.10).
    - name: local-path-agent-state
    # The client certificate, and the gateway of the sandboxes.
    - name: agents-pilot-sandbox-gateway
    # The SnapshotPolicy CRD and the repository it names.
    - name: kopiur-agents-repository
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
