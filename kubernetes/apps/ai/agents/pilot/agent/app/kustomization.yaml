---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./pvc.yaml
  - ./deployment.yaml
  - ./networkpolicy.yaml
  - ./backup.yaml
  # Secret agent-secret: the gateway token, the key of the model gateway and
  # the four values of the test chat accounts (docs/apps/agent-platform.md).
  - ./secret.sops.yaml
  # Secret agent-search-secret: BRAVE_API_KEY, the key of the search API, for
  # the agent container only (docs/apps/agent-platform.md, "Web search").
  - ./secret-search.sops.yaml
# The config of the agent and the scripts of its pod (../config). Each name
# gets a hash of its content, and Kustomize puts that name in the
# Deployment, so a change of a file is a change of the pod template: Flux
# applies both at once, and one merge gives one rollout
# (docs/apps/agent-platform.md, "A start of the agent pod"). Reloader
# watches the Secrets only (deployment.yaml). No ${VAR} substitution in
# them: each ${NAME} in openclaw.json is for the product, which reads it
# from an env var of the pod when it loads the config.
configMapGenerator:
  - name: agent-config
    files:
      - openclaw.json=../config/openclaw.json
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: agent-scripts
    files:
      - archive-state.sh=../config/scripts/archive-state.sh
      - daily-backup.sh=../config/scripts/daily-backup.sh
      - memory-index.sh=../config/scripts/memory-index.sh
      - sandbox-start.sh=../config/scripts/sandbox-start.sh
    # The sandbox gateway of this trust domain, for sandbox-start.sh (the
    # same address as the openshell entry of openclaw.json). It is in the
    # same ConfigMap as the script, so both change in one apply.
    literals:
      - sandbox-gateway-endpoint=https://openshell.agents-pilot.svc.cluster.local:8080
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
