---
# The agent pod. No pod comes in: the gateway of the product listens on
# loopback, the probes run in the pod, and default-deny (../../namespace.yaml)
# denies ingress. Out, it reaches the model gateway, the sandbox gateway of
# this trust domain, the Signal daemon, the trace collector and one host
# name, the Telegram Bot API (and DNS, through allow-dns). Nothing else: no
# model vendor, no update or telemetry service, no other trust domain.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agent
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agent
  egress:
    # The model gateway (LiteLLM), with the key of this trust domain.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: litellm
            app.kubernetes.io/instance: litellm
            # Both WSL clusters are one Cilium Cluster Mesh: name this cluster.
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    # The sandbox gateway of this trust domain: the sandboxes, and the SSH
    # path to them (the gateway relays it).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agents-pilot
            app.kubernetes.io/instance: openshell
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The Signal daemon of this trust domain (JSON-RPC and events).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agents-pilot
            app.kubernetes.io/name: signal-daemon
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The traces of the product (OTLP over HTTP) to the collector.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
    # The Telegram channel.
    - toFQDNs:
        - matchName: api.telegram.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
