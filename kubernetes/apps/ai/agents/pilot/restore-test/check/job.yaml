---
# Reads the restored scratch volume, read-only, and logs only safe facts:
# directory names at the top two levels, counts and sizes, the names and
# times of the newest start archive and the newest daily archive, and the
# check of each (checksum, gzip, member count). It never prints the content
# of a file, a config value or the name of an archive member: the volume
# holds credentials. Loki: {namespace="agents-pilot", app="agent-restore-check"}.
apiVersion: batch/v1
kind: Job
metadata:
  name: agent-restore-check
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-restore-check
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      # No nodeSelector: the PV of the scratch volume has the node affinity
      # of the node the restore mover bound it on, and the scheduler follows
      # it. No network: default-deny (../../namespace.yaml) applies.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: check
          # The image of the agent (agent/app/deployment.yaml): the tools
          # the archive scripts use.
          image: ghcr.io/it3e/tnwks-agent-image:0.4.0@sha256:43ee2f3a1a11dff2294795250091c685ac8b7b8b988a9eeb93c1adffef6f971d
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              D=/restore
              fail() { echo "restore-check result=failed reason=$1"; exit 1; }
              test -d "$D/state" || fail no-state
              test -d "$D/archives" || fail no-archives
              # Counts only below the top level: a directory name can say
              # more than a log line should keep.
              top=$(cd "$D" && find . -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l)
              second=$(cd "$D" && find . -mindepth 2 -maxdepth 2 -type d 2>/dev/null | wc -l)
              echo "restore-check directories top=$top second=$second"
              files=$(find "$D" -type f 2>/dev/null | wc -l)
              bytes=$(find "$D" -type f -printf '%s\n' 2>/dev/null | awk '{ s += $1 } END { printf "%d\n", s }')
              unreadable=$(find "$D" ! -readable 2>/dev/null | wc -l)
              echo "restore-check files=$files bytes=$bytes unreadable=$unreadable"
              [ "$files" -gt 0 ] || fail empty
              [ "$unreadable" -eq 0 ] || fail unreadable

              # The newest start archive by the time in its name
              # (openclaw-state-<release>-<time>.tar.gz).
              S="$D/archives/start"
              start=$(cd "$S" 2>/dev/null && ls -1 2>/dev/null | grep -E '^openclaw-state-.*-[0-9]{8}T[0-9]{6}Z\.tar\.gz$' \
                | sed -E 's/^(.*-([0-9]{8}T[0-9]{6}Z)\.tar\.gz)$/\2 \1/' | LC_ALL=C sort | tail -n 1 | cut -d' ' -f2 || true)
              [ -n "$start" ] || fail no-start-archive
              (cd "$S" && sha256sum -c "$start.sha256" > /dev/null 2>&1) || fail start-checksum
              tar -tzf "$S/$start" > /dev/null 2>&1 || fail start-tar
              members=$(tar -tzf "$S/$start" 2>/dev/null | wc -l)
              echo "restore-check start=$start mtime=$(date -u -r "$S/$start" +%Y-%m-%dT%H:%MZ) members=$members checksum=ok"

              # The newest daily archive (openclaw-backup-<day>.tar.gz).
              A="$D/archives/daily"
              daily=$(cd "$A" 2>/dev/null && ls -1 2>/dev/null | grep -E '^openclaw-backup-[0-9]{4}-[0-9]{2}-[0-9]{2}\.tar\.gz$' \
                | LC_ALL=C sort | tail -n 1 || true)
              [ -n "$daily" ] || fail no-daily-archive
              gzip -t "$A/$daily" > /dev/null 2>&1 || fail daily-gzip
              tar -tzf "$A/$daily" > /dev/null 2>&1 || fail daily-tar
              members=$(tar -tzf "$A/$daily" 2>/dev/null | wc -l)
              echo "restore-check daily=$daily mtime=$(date -u -r "$A/$daily" +%Y-%m-%dT%H:%MZ) members=$members gzip=ok"
              echo "restore-check result=ok"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: restored
              mountPath: /restore
              readOnly: true
      volumes:
        - name: restored
          persistentVolumeClaim:
            claimName: agent-state-restore-test
            readOnly: true
