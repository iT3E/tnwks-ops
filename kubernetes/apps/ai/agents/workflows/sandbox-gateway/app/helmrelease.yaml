---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# One sandbox gateway for this trust domain (docs/apps/agent-platform.md).
# Its sandboxes run in this namespace. The images follow the chart version.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openshell
spec:
  chartRef:
    kind: OCIRepository
    name: openshell
  interval: 30m
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    server:
      # The chart's default sends anonymous telemetry from the gateway and the
      # sandbox supervisors.
      telemetryEnabled: false
      # The gateway database (SQLite, 1 GiB) and each sandbox workspace (2 GiB).
      dataStorageClass: ${STORAGE_CLASS_DEFAULT}
      workspaceStorageClass: ${STORAGE_CLASS_DEFAULT}
    # cert-manager makes this gateway's own certificate authority, its server
    # certificate and the client certificate (Secret openshell-client-tls:
    # ca.crt, tls.crt, tls.key), and renews them. The client certificate is
    # what a caller in this namespace mounts to use the gateway.
    # The chart stops the render when the cluster serves no Sandbox API.
    # Flux gives the same order (ks.yaml dependsOn agent-sandbox, which waits
    # for its CRDs), and CI renders offline, where the check always fails.
    agentSandbox:
      preflight:
        enabled: false
    certManager:
      enabled: true
      # The chart always adds this namespace's service names. Its default
      # list also names an `openshell` namespace, which isn't ours.
      serverDnsNames: []
    # The log of this gateway goes to Loki: each sandbox it made or removed
    # and each command it relayed, with no command text (the Vector agent
    # drops the preview of the command on the node,
    # kubernetes/apps/monitoring/vector/agent/config/vector.yaml). Only this
    # trust domain's gateway ships.
    podLabels:
      logs.home.arpa/ship: "true"
    # 40 to 145 MiB in use on a test cluster (the agent platform design,
    # RUN-012). The chart sets nothing.
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
