---
# The providers of the workflow agents: the `providers` command of the image
# of the workflow agents (src/providers/ in iT3E/tnwks-workflow-agents, whose
# CI tests it). Every 15 minutes it imports each new provider profile (providers/) into the sandbox
# gateway and updates each one that changed in git, updates model-gateway
# with the key from the Secret workflow-providers-secret, then gets a new
# installation token of the GitHub App of the reviewer and updates
# github-reviewer with it. A failure logs one line,
# "workflow-providers result=failed step=<step> name=<name>".
#
# Why every 15 minutes: an installation token lives one hour, and a sandbox
# keeps the token of its start for its whole life (the gateway keeps the old
# revision of a credential for a process that has it). A run job lives 40
# minutes at most (agents.yaml). So a token is at most 15 minutes old when a
# run starts, and at most 55 minutes old when it ends: each run has a valid
# token to its end. To run it now:
# `kubectl -n agents-workflows create job --from=cronjob/workflow-providers providers-now`.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: workflow-providers
  labels: &labels
    app.kubernetes.io/name: workflow-providers
spec:
  schedule: "7,22,37,52 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # A finished Job goes after 26 hours, also a failed one. That is a day
      # and room for the next run to end, so the alert and the AI board see
      # a failure until a newer run ends, and KubeJobFailed then clears by
      # itself (docs/apps/agent-platform.md, "A failed Job").
      ttlSecondsAfterFinished: 93600
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels: *labels
        spec:
          restartPolicy: Never
          serviceAccountName: workflow-run
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            # The client certificate (mode 0440) is readable by the group.
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: providers
              # The image of the workflow agents holds the OpenShell CLI and the
              # providers command (release 0.3.0 and later).
              image: ghcr.io/it3e/tnwks-workflow-agents:0.3.3@sha256:4d58fa0d2b68ee220d5c7bc377f90084decef234be77e673d55a39e2cda30f9e
              imagePullPolicy: IfNotPresent
              args: ["providers"]
              env:
                - name: OPENSHELL_GATEWAY_URL
                  value: https://openshell.agents-workflows.svc.cluster.local:8080
                - name: OPENSHELL_MTLS_DIR
                  value: /mtls
                - name: PROVIDER_PROFILES_DIR
                  value: /profiles
                - name: NO_COLOR
                  value: "1"
                # The key of this trust domain at the model gateway (the
                # entry agents-workflows of keys.json in the model gateway).
                - name: MODEL_GATEWAY_KEY
                  valueFrom:
                    secretKeyRef:
                      name: workflow-providers-secret
                      key: MODEL_GATEWAY_KEY
                # The GitHub App of the reviewer, installed on iT3E/tnwks-ops
                # only. Its ID is not a secret; its private key is a file
                # (/github-app), read by openssl only.
                - name: GITHUB_APP_ID
                  value: "5740538"
                - name: GITHUB_APP_KEY_FILE
                  value: /github-app/private-key.pem
                # What the reviewer may do at GitHub, in one place: the one
                # repository and the permissions of each token. A token never
                # has more, whatever the App was granted; the job logs an
                # "app-drift" line when the App or its installation has more,
                # and fails when it has less. A change here goes with the
                # owner's change in the App settings (docs/apps/agent-platform.md).
                - name: GITHUB_REPOSITORY
                  value: iT3E/tnwks-ops
                - name: GITHUB_APP_PERMISSIONS
                  value: contents:read,pull_requests:write,checks:read
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: mtls
                  mountPath: /mtls
                  readOnly: true
                - name: profiles
                  mountPath: /profiles
                  readOnly: true
                - name: github-app
                  mountPath: /github-app
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
            # The client certificate of the sandbox gateway.
            - name: mtls
              secret:
                secretName: openshell-client-tls
                defaultMode: 0440
            - name: profiles
              configMap:
                name: workflow-provider-profiles
            # The private key of the GitHub App, readable by the group only.
            - name: github-app
              secret:
                secretName: workflow-providers-secret
                defaultMode: 0440
                items:
                  - key: GITHUB_APP_PRIVATE_KEY
                    path: private-key.pem
