---
# The sweep: it deletes each run sandbox that is older than one hour, through
# the sandbox gateway, and then checks that its Sandbox record went. A run job
# deletes its own sandbox at its end; the sweep deletes the sandbox of a run
# job that was stopped before that (a node that went away, for example). It
# also lists the run records through the Kubernetes API, and removes each one
# older than one hour that the gateway left or does not list (the gateway can
# answer a delete with success, leave the record and forget the sandbox). It
# deletes only sandboxes and records with the name of a run, so it never
# deletes the sandbox of a check. A run job has a time limit of 40 minutes
# at most (agents.yaml), with 90 s of grace, and the admission policy admits
# one hour at most, so a record older than one hour belongs to no live run.
# A record that the gateway left or forgot fails the Job after its removal
# (AgentPlatformCronJobFailed).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: workflow-sweep
  labels: &labels
    app.kubernetes.io/name: workflow-sweep
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels: *labels
        spec:
          restartPolicy: Never
          # list and delete on Sandbox records (rbac.yaml), and the admission
          # policy workflow-sweep-deletes.
          serviceAccountName: workflow-sweep
          automountServiceAccountToken: true
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            # The client certificate (mode 0440) is readable by the group.
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sweep
              image: ghcr.io/it3e/tnwks-workflow-agents:0.3.1@sha256:542526e1a8efa548beea5a632fa25a682006b0f5483dcce8cfbf9798baae0803
              imagePullPolicy: IfNotPresent
              args: ["sweep"]
              env:
                - name: OPENSHELL_GATEWAY_URL
                  value: https://openshell.agents-workflows.svc.cluster.local:8080
                - name: OPENSHELL_MTLS_DIR
                  value: /etc/openshell/mtls
                - name: SWEEP_MAX_AGE_SECONDS
                  value: "3600"
                # Under the activeDeadlineSeconds above (600), with room for
                # the start of the pod: the sweep starts no removal it has no
                # time to end.
                - name: SWEEP_DEADLINE_SECONDS
                  value: "420"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: mtls
                  mountPath: /etc/openshell/mtls
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
            # The client certificate of the sandbox gateway.
            - name: mtls
              secret:
                secretName: openshell-client-tls
                defaultMode: 0440
