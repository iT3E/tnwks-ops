---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./rbac.yaml
  - ./deployment.yaml
  - ./service.yaml
  - ./sweep.yaml
  - ./providers.yaml
  - ./networkpolicy.yaml
  # Secret run-receiver-secret: RUN_RECEIVER_TOKEN, the token of the callers.
  - ./secret.sops.yaml
  # Secret workflow-providers-secret: MODEL_GATEWAY_KEY, the key of the model
  # gateway, and GITHUB_APP_PRIVATE_KEY, the private key of the GitHub App of
  # the reviewer (providers.yaml).
  - ./secret-providers.sops.yaml
# The names stay fixed (no hash): the Job template names the policy, and
# Reloader starts the receiver again when its list changes.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: run-receiver-agents
    files:
      - agents.yaml=./agents.yaml
  - name: renovate-reviewer-policy
    files:
      - policy.yaml=./policies/renovate-reviewer.yaml
  - name: workflow-provider-profiles
    files:
      - workflow-model-gateway.yaml=./providers/workflow-model-gateway.yaml
      - workflow-github-reviewer.yaml=./providers/workflow-github-reviewer.yaml
  - name: workflow-providers-script
    files:
      - providers.sh=./scripts/providers.sh
      - github_app_token.py=./scripts/github_app_token.py
