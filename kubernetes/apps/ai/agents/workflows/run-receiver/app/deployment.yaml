---
# The run receiver (docs/apps/agent-platform.md, "The run receiver"): the one
# entry for a run of a workflow agent. A caller sends a token, the name of an
# agent, the input and a key; the receiver makes a run job from the template
# of that agent (agents.yaml) and gives back the answer of the run. The image
# contract and the API are in the README of iT3E/tnwks-workflow-agents.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: run-receiver
  labels:
    app.kubernetes.io/name: run-receiver
  annotations:
    # Start the pod again when run-receiver-agents or run-receiver-secret
    # changes: the receiver reads both at the start.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: run-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: run-receiver
    spec:
      serviceAccountName: run-receiver
      # The receiver calls the Kubernetes API with the token of its service
      # account (rbac.yaml).
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: run-receiver
          image: ghcr.io/it3e/tnwks-workflow-agents:0.1.2@sha256:REPLACE-WITH-THE-0.1.2-DIGEST
          imagePullPolicy: IfNotPresent
          args: ["run-receiver"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # The token of the callers. The workflow that calls the receiver
            # holds the same value.
            - name: RUN_RECEIVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: run-receiver-secret
                  key: RUN_RECEIVER_TOKEN
            - name: RUN_RECEIVER_CONFIG
              value: /etc/run-receiver/agents.yaml
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: agents
              mountPath: /etc/run-receiver
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: agents
          configMap:
            name: run-receiver-agents
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
