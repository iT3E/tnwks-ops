---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The admission rules of the agent platform that hold for every trust domain
# (docs/apps/agent-platform.md, "The backup mover and ConfigMaps"). Its
# objects are cluster-scoped, so this Kustomization sets no targetNamespace;
# each binding selects the namespaces of the trust domains by their label.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agents-admission
  namespace: flux-system
spec:
  path: ./kubernetes/apps/ai/agents/admission/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
