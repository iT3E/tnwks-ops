---
# The controller talks to the API server only (watches, leader election).
# Nothing calls it: kubelet probes come from the node, which Cilium allows.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agent-sandbox-controller
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agent-sandbox
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
            # Both WSL clusters are one Cilium Cluster Mesh: name this cluster.
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
