---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-sandbox
spec:
  interval: 30m
  chart:
    spec:
      chart: ./helm
      # The chart keeps one version number across releases, so build it again
      # for each new tag of the GitRepository.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: agent-sandbox
  maxHistory: 2
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    # Helm leaves crds/ alone on upgrade; a new release can change them.
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # namespace.yaml owns the namespace and its Pod Security level.
    namespace:
      create: false
      name: agent-sandbox-system
    image:
      repository: registry.k8s.io/agent-sandbox/agent-sandbox-controller
      # The same release as the GitRepository tag (the chart and the CRDs).
      tag: v1.0.11@sha256:73cb162407cddf73f4cd063b02bdee2dac86aa342bbc40bd99a9f023e69b31ed
    # The `restricted` level of the namespace. The image runs as a non-root
    # user (distroless nonroot).
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    # 25 MiB in use on a test cluster (the agent platform design, RUN-012).
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
  # The chart's common labels put two values in label values that the API
  # server refuses: helm.sh/chart gets the chart version, which Flux makes
  # 0.1.4+<commit> for reconcileStrategy Revision, and
  # app.kubernetes.io/version gets image.tag, which holds the digest. Remove
  # both from each object that has them. Nothing selects on either label (the
  # selectors use name and instance), so the objects are otherwise as the
  # chart renders them. If a chart release drops one of these labels, the
  # remove fails and the upgrade stops: delete that op.
  postRenderers:
    - kustomize:
        patches:
          - target:
              labelSelector: helm.sh/chart
            patch: |-
              - op: remove
                path: /metadata/labels/helm.sh~1chart
              - op: remove
                path: /metadata/labels/app.kubernetes.io~1version
