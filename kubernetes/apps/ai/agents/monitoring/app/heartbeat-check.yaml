---
# The scheduled turn (heartbeat) of each personal agent
# (scripts/heartbeat_check.py): once a day, Tempo must have a completed
# heartbeat run of each service in SERVICES in the last 26 hours. The
# heartbeat of the pilot comes at about 01:40 UTC, of finance at about 01:50
# and of main at about 15:05 (a fixed time of day for each agent); this runs
# at 06:33, so a missed one shows by the next morning. The script asks Tempo up to 3 times,
# 60 seconds apart, and a pod that still fails gets one more try
# (backoffLimit: 1), so one short break of Tempo or of the node does not
# page for a day. Each service gets its own tries and its own log line. One
# missing service fails the Job, its line names the service, and the alerts
# in heartbeat-prometheusrule.yaml read the CronJob.
# SERVICES names the agents that run now, comma separated: add the service
# name (diagnostics.otel.serviceName in its openclaw.json) after the first
# heartbeat of a new agent is in Tempo, so a domain with no agent, or an
# agent before its first heartbeat, never alerts.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-heartbeat-check
  labels:
    app.kubernetes.io/name: agent-heartbeat-check
spec:
  schedule: "33 6 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Two pods at most, each up to about 4 minutes for each service (3
      # tries of up to 30 s, 2 waits of 60 s). With two services that both
      # fail, two pods take up to 14 minutes, inside the deadline.
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: agent-heartbeat-check
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              image: docker.io/library/python:3.15.2-slim-trixie@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
              command:
                - python3
                - /scripts/heartbeat_check.py
              env:
                - name: SERVICES
                  value: openclaw-agents-pilot,openclaw-agents-finance,openclaw-agents-main
                - name: WINDOW_HOURS
                  value: "26"
                - name: ATTEMPTS
                  value: "3"
                - name: WAIT_SECONDS
                  value: "60"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: agent-heartbeat-check
