---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - ./prometheusrule.yaml
  - ./heartbeat-check.yaml
  - ./heartbeat-prometheusrule.yaml
configMapGenerator:
  # The check of the scheduled turn of each personal agent (heartbeat-check.yaml).
  - name: agent-heartbeat-check
    files:
      - heartbeat_check.py=./scripts/heartbeat_check.py
