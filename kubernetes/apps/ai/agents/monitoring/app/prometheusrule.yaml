---
# The alerts of the agent platform (docs/apps/agent-platform.md, "Alerts").
# Most read kube-state-metrics. WorkflowAppDrift, AgentInstructionFileChanged,
# AgentInstructionCheckStale, AgentMemoryIndexFailed, AgentAutomationsSyncFailed
# and ModelBridgeRateLimited
# read the time of the newest line of a kind, a gauge that Vector serves: the
# aggregator for the result lines (kubernetes/apps/monitoring/vector/aggregator),
# the platform log agent for instruction-file and the model bridge
# (kubernetes/apps/monitoring/vector/agent-platform).
# AgentBackupMoverConfigMapDenied reads a counter of the API server that only
# homelab-wsl keeps (kubernetes/clusters/wsl/apps/kustomization.yaml).
# AgentBackupRepositoryNotReady reads the phase gauge of the backup operator.
# ModelPlanNearLimit reads the record homelab:ai_plan_state
# (observability/rules.py): the newest status of each window of the Claude plan.
# Already covered elsewhere, so not here: a failed or late snapshot of a
# state volume (the kopiur chart's rules, KopiurLastBackupFailed and
# KopiurBackupStale, match each SnapshotPolicy), a repository in Failed or
# Degraded (KopiurRepositoryNotReady), a failed run of the refresher of the
# backup session (KubeJobFailed), and a crash loop (the chart rules of
# kube-prometheus-stack).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agent-platform
  namespace: monitoring
spec:
  groups:
    - name: agent-platform
      rules:
        - alert: AgentPlatformWorkloadNotReady
          # Fewer ready pods than wanted, for each Deployment and StatefulSet
          # of a trust domain and of the sandbox controller, and for the model
          # gateway, the model bridge and the MCP gateway in `ai`. A workload scaled to zero by a
          # merge does not fire. 10m: a start of the agent pod (archive and
          # doctor) takes about 2 minutes, a rollout of the bridge less.
          expr: |
            label_replace(
              max by (namespace, deployment) (kube_deployment_spec_replicas{namespace=~"agents-.+|agent-sandbox-system"} or kube_deployment_spec_replicas{namespace="ai", deployment=~"litellm|model-bridge|mcp-gateway"})
              - max by (namespace, deployment) (kube_deployment_status_replicas_ready{namespace=~"agents-.+|agent-sandbox-system"} or kube_deployment_status_replicas_ready{namespace="ai", deployment=~"litellm|model-bridge|mcp-gateway"}),
              "workload", "$1", "deployment", "(.+)")
            > 0
            or
            label_replace(
              max by (namespace, statefulset) (kube_statefulset_replicas{namespace=~"agents-.+"})
              - max by (namespace, statefulset) (kube_statefulset_status_replicas_ready{namespace=~"agents-.+"}),
              "workload", "$1", "statefulset", "(.+)")
            > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.${INTERNAL_DOMAIN}/d/tnwks-ai?var-cluster={{ $externalLabels.cluster }}"
            runbook_url: "https://github.com/iT3E/tnwks-ops/blob/main/docs/apps/agent-platform-runbook.md#agentplatformworkloadnotready"
            summary: "{{ $labels.namespace }}/{{ $labels.workload }} has {{ $value }} pod(s) less ready than wanted."
            description: "kubectl -n {{ $labels.namespace }} describe pod of {{ $labels.workload }}: an init container that failed (archive, doctor) or a lock on the state volume; revert the last image if it came with an update."

        - alert: AgentPlatformCronJobFailed
          # The newest failed Job of a CronJob in a trust domain started after
          # the CronJob's last success: the last run failed and no run passed
          # since. It resolves at the next good run. KubeJobFailed, the chart
          # rule, keeps firing while the failed Job is kept (26 hours after it
          # ended, ttlSecondsAfterFinished), also after a good run, so Alertmanager
          # drops it for these Jobs (its route for KubeJobFailed). Covers the
          # providers job (its `workflow-providers result=failed` line comes
          # with exit 1, the providers command of the image), the sweep and the daily checks.
          # reason!="": kube-state-metrics also reports the failed pods of a
          # Job that still retries (backoffLimit), with reason="". The max by
          # on the right of each join keeps it one-to-one when two
          # kube-state-metrics pods serve the same series in a rollout.
          expr: |
            max by (namespace, cronjob) (
              kube_job_status_start_time{namespace=~"agents-.+"}
              * on (namespace, job_name) group_left (cronjob)
                max by (namespace, job_name, cronjob) (label_replace(kube_job_owner{namespace=~"agents-.+", owner_kind="CronJob"}, "cronjob", "$1", "owner_name", "(.+)"))
              and on (namespace, job_name) (kube_job_status_failed{namespace=~"agents-.+", reason!=""} > 0)
            )
            > on (namespace, cronjob)
            max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{namespace=~"agents-.+"})
            or
            max by (namespace, cronjob) (
              kube_job_status_start_time{namespace=~"agents-.+"}
              * on (namespace, job_name) group_left (cronjob)
                max by (namespace, job_name, cronjob) (label_replace(kube_job_owner{namespace=~"agents-.+", owner_kind="CronJob"}, "cronjob", "$1", "owner_name", "(.+)"))
              and on (namespace, job_name) (kube_job_status_failed{namespace=~"agents-.+", reason!=""} > 0)
            )
            unless on (namespace, cronjob)
            kube_cronjob_status_last_successful_time{namespace=~"agents-.+"}
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.${INTERNAL_DOMAIN}/d/tnwks-ai?var-cluster={{ $externalLabels.cluster }}"
            runbook_url: "https://github.com/iT3E/tnwks-ops/blob/main/docs/apps/agent-platform-runbook.md#agentplatformcronjobfailed"
            summary: "The last run of {{ $labels.namespace }}/{{ $labels.cronjob }} failed."
            description: "Read its log in Loki: {namespace=\"{{ $labels.namespace }}\", app=~\"workflow-.+|platform-checks\"}; a result=failed line names the step. For the providers job, fix it within the hour: a run token lives one hour."

        - alert: WorkflowProvidersStale
          # A dead man's switch: no good run of the providers job in 35
          # minutes (30m plus the `for`), so two runs in a row failed or did
          # not run (suspended, the CronJob gone, an image that does not pull).
          # The App token of the reviewer lives one hour from its last good
          # run, so this leaves about 25 minutes before a review gets 401.
          expr: |
            (time() - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{namespace="agents-workflows", cronjob="workflow-providers"})) > 30 * 60
            or (
              (time() - max by (namespace, cronjob) (kube_cronjob_created{namespace="agents-workflows", cronjob="workflow-providers"})) > 30 * 60
              unless on (namespace, cronjob) kube_cronjob_status_last_successful_time{namespace="agents-workflows", cronjob="workflow-providers"}
            )
            or absent(kube_cronjob_created{namespace="agents-workflows", cronjob="workflow-providers"})
          for: 5m
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.${INTERNAL_DOMAIN}/d/tnwks-ai?var-cluster={{ $externalLabels.cluster }}"
            runbook_url: "https://github.com/iT3E/tnwks-ops/blob/main/docs/apps/agent-platform-runbook.md#workflowprovidersstale"
            summary: "The providers job of agents-workflows has had no good run in 35 minutes."
            description: "kubectl -n agents-workflows get cronjob,jobs; read the last run in Loki ({namespace=\"agents-workflows\", app=\"workflow-providers\"}); after a fix, run it now with create job --from=cronjob/workflow-providers."

        - alert: WorkflowAppDrift
          # The GitHub App of the reviewer, or its installation, has more
          # permissions than the list in git. The providers job logs one
          # `app-drift result=drift detail=<names>` line each run (every 15
          # minutes) and still scopes each token, so this is not an outage.
          # The value is the time of the newest such line. The aggregator
          # serves each sample with the time of its line, so Prometheus holds
          # a sample for 5 minutes only (the lookback): max_over_time bridges
          # the 15 minutes between two lines. It resolves 20 minutes after the
          # last one.
          expr: |
            time() - max by (pod_namespace, app) (max_over_time(homelab_agent_platform_result_timestamp_seconds{check="app-drift", result="drift"}[20m])) < 20 * 60
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.${INTERNAL_DOMAIN}/d/tnwks-ai?var-cluster={{ $externalLabels.cluster }}"
            runbook_url: "https://github.com/iT3E/tnwks-ops/blob/main/docs/apps/agent-platform-runbook.md#workflowappdrift"
            summary: "The GitHub App of the reviewer has more permissions than the list in git."
            description: "The detail= of the app-drift line in Loki ({namespace=\"agents-workflows\", app=\"workflow-providers\"} |= \"app-drift\") names each extra one; set the App back in its settings, or change the list in app/providers.yaml by a pull request."

        - alert: AgentPlatformCheckStale
          # A daily check of a trust domain (platform-check-*: the isolation
          # check, the probe, and the checks of finance and of the gateway of
          # tools), or the daily key check of the model gateway in ai
          # (litellm-key-check, 05:41), has not passed in 26 hours: a day plus
          # room for a slow run. The second part is a check that never passed,
          # once a run was due. Both alerts fire for one cause: a failed Job
          # is AgentPlatformCronJobFailed (trust domains) or KubeJobFailed (ai)
          # while the Job is kept, and from 26 hours after the last success
          # this rule fires as well, until a run passes. With the CronJob
          # suspended, it fires alone once the failed Job is gone.
          expr: |
            (time() - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{namespace=~"agents-.+|ai", cronjob=~"platform-check-.+|litellm-key-check"})) > 26 * 3600
            or (
              (time() - max by (namespace, cronjob) (kube_cronjob_created{namespace=~"agents-.+|ai", cronjob=~"platform-check-.+|litellm-key-check"})) > 26 * 3600
              unless on (namespace, cronjob) kube_cronjob_status_last_successful_time{namespace=~"agents-.+|ai", cronjob=~"platform-check-.+|litellm-key-check"}
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.${INTERNAL_DOMAIN}/d/tnwks-ai?var-cluster={{ $externalLabels.cluster }}"
            runbook_url: "https://github.com/iT3E/tnwks-ops/blob/main/docs/apps/agent-platform-runbook.md#agentplatformcheckstale"
            summary: "{{ $labels.namespace }}/{{ $labels.cronjob }} has not passed in 26 hours."
            description: "kubectl -n {{ $labels.namespace }} get cronjob {{ $labels.cronjob }} (suspended?) and its Jobs; the log of the last run is in Loki ({namespace=\"{{ $labels.namespace }}\", app=~\"platform-checks|litellm-key-check\"})."

        - alert: AgentRunSandboxTooOld
          # A run sandbox of a workflow agent (Sandbox `default--run-*`) that
          # is older than its limit. The run job deletes its own sandbox, and
          # the sweep deletes one older than 1 hour every 15 minutes, so one
          # older than 80 minutes (90 with the `for`) means both failed. A pod
          # of the sandbox carries its age; the Sandbox record has no metric.
          expr: |
            max by (namespace, sandbox) (
              (time() - kube_pod_created{namespace="agents-workflows"})
              * on (namespace, pod) group_left (sandbox)
                max by (namespace, pod, sandbox) (label_replace(kube_pod_owner{namespace="agents-workflows", owner_kind="Sandbox", owner_name=~"default--run-.+"}, "sandbox", "$1", "owner_name", "(.+)"))
            ) > 80 * 60
          for: 10m
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.${INTERNAL_DOMAIN}/d/tnwks-ai?var-cluster={{ $externalLabels.cluster }}"
            runbook_url: "https://github.com/iT3E/tnwks-ops/blob/main/docs/apps/agent-platform-runbook.md#agentrunsandboxtooold"
            summary: "The run sandbox {{ $labels.sandbox }} is {{ $value | humanizeDuration }} old."
            description: "The sweep did not delete it: check the CronJob workflow-sweep in agents-workflows, then delete the sandbox through the sandbox gateway."

        - alert: AgentWorkflowRunFailed
          # A run job of a workflow agent that failed, for 2 hours from its
          # start (a run lives 40 minutes at most). KubeJobFailed fires for the
          # same Job for the 7 days that it stays, and Alertmanager drops it
          # (its route for KubeJobFailed). The caller tries again with
          # a new key (at most 3 attempts), so one alert can come with a
          # review that passed later.
          expr: |
            max by (namespace, job_name) (kube_job_status_failed{namespace="agents-workflows", job_name=~"run-.+", reason!=""} > 0)
            and on (namespace, job_name)
            (time() - kube_job_status_start_time{namespace="agents-workflows", job_name=~"run-.+"}) < 2 * 3600
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.${INTERNAL_DOMAIN}/d/tnwks-ai?var-cluster={{ $externalLabels.cluster }}"
            runbook_url: "https://github.com/iT3E/tnwks-ops/blob/main/docs/apps/agent-platform-runbook.md#agentworkflowrunfailed"
            summary: "The run {{ $labels.job_name }} of a workflow agent failed."
            description: "Its answer is the annotation workflow-agents/result of the Job, and its log is in Loki ({namespace=\"agents-workflows\", app=\"workflow-run\"}); a 502 from the model gateway can be the limit of the Claude plan."

        - alert: AgentDailyArchiveFailed
          # The backup container of an agent pod ends when the daily archive of
          # the product fails (config/scripts/daily-backup.sh, exit 1; set -e
          # ends it with the code of any other failed command). It fires for 2
          # hours after a restart that followed an exit code from 1 to 127.
          # A stop of the node does not count: the kubelet stops the container
          # with SIGTERM (exit 143, reason Error) or the node goes down with it
          # (reason Unknown, exit 255). The reason alone can not tell 143 from
          # a failed archive, so the rule reads the exit code.
          expr: |
            max by (namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace=~"agents-.+", container="backup"}[2h])) > 0
            and on (namespace, pod)
            max by (namespace, pod) (kube_pod_container_status_last_terminated_exitcode{namespace=~"agents-.+", container="backup"} > 0 < 128)
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.${INTERNAL_DOMAIN}/d/tnwks-ai?var-cluster={{ $externalLabels.cluster }}"
            runbook_url: "https://github.com/iT3E/tnwks-ops/blob/main/docs/apps/agent-platform-runbook.md#agentdailyarchivefailed"
            summary: "The daily archive of {{ $labels.namespace }}/{{ $labels.pod }} failed, and its backup container started again."
            description: "kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c backup --previous shows the daily-backup line and the error of the backup command."

        - alert: AgentInstructionFileChanged
          # An instruction file of the workspace of a personal agent (AGENTS.md,
          # SOUL.md, USER.md, IDENTITY.md or a file under skills/) is new,
          # changed or gone since the day before. The backup container checks
          # once a day (config/scripts/daily-backup.sh) and logs one
          # `instruction-check file=<name> change=<change>` line for each.
          # The agent can write these files, so a change it was not asked for
          # can be an instruction it took from what it read. It fires for 20
          # minutes after the line, as WorkflowAppDrift does.
          expr: |
            time() - max by (pod_namespace, result) (max_over_time(homelab_agent_platform_result_timestamp_seconds{pod_namespace=~"agents-.+", check="instruction-file"}[20m])) < 20 * 60
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.${INTERNAL_DOMAIN}/d/tnwks-ai?var-cluster={{ $externalLabels.cluster }}"
            runbook_url: "https://github.com/iT3E/tnwks-ops/blob/main/docs/apps/agent-platform-runbook.md#agentinstructionfilechanged"
            summary: "An instruction file of the agent in {{ $labels.pod_namespace }} is {{ $labels.result }} since the day before."
            description: "The instruction-check lines in Loki ({namespace=\"{{ $labels.pod_namespace }}\", app=\"agent\"} |= \"instruction-check\") name each file; read the change in the daily archive before the agent runs on it."

        - alert: AgentInstructionCheckStale
          # No `instruction-check result=` line from the backup container of
          # the agent pod of a trust domain in 26 hours: a day plus room. Each
          # agent pod ships its log (the pod label logs.home.arpa/ship,
          # docs/apps/agent-platform.md, "Logs"), so an agent pod whose log
          # does not ship fires too: that is a fault of the pod. A trust
          # domain with no agent pod (none yet, or replicas: 0) has no backup
          # container and never fires. The check runs once a day, and not
          # again when a new container finds the archive of the day there, so
          # the rule waits until the backup container has run for 26 hours
          # too. The newest line must be less than 26 hours old by its own
          # time, not only be in the last 26 hours of samples: a restart of
          # the platform log agent reads the backup log again from its start,
          # and an old line comes back with its old time.
          expr: |
            (time() - max by (namespace) (kube_pod_container_state_started{namespace=~"agents-.+", container="backup"})) > 26 * 3600
            unless on (namespace)
            label_replace(max by (pod_namespace) ((max_over_time(homelab_agent_platform_result_timestamp_seconds{pod_namespace=~"agents-.+", check="instruction-check"}[26h]) > time() - 26 * 3600)), "namespace", "$1", "pod_namespace", "(.+)")
          for: 15m
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.${INTERNAL_DOMAIN}/d/tnwks-ai?var-cluster={{ $externalLabels.cluster }}"
            runbook_url: "https://github.com/iT3E/tnwks-ops/blob/main/docs/apps/agent-platform-runbook.md#agentinstructioncheckstale"
            summary: "The instruction check of the agent in {{ $labels.namespace }} has not run in 26 hours."
            description: "kubectl -n {{ $labels.namespace }} logs deploy/agent -c backup shows the last daily-backup and instruction-check lines; a backup that waits on a gateway that is not ready logs nothing."

        - alert: AgentMemoryIndexFailed
          # The newest `memory-index result=` line of the agent pod of a trust
          # domain is result=failed: the init container memory-index
          # (pilot/agent/config/scripts/memory-index.sh) could not bring the
          # memory index up to date at the start of the pod. The pod still
          # starts, and a stale index stays stale (each search returns no
          # result) until a start that ends with result=ok. Each trust domain
          # counts apart, and a domain with no agent pod never fires. Two
          # tests:
          # - the failed line is newer than each ok line, so the ok line of a
          #   later start clears it;
          # - the line is not older than the start of the newest pod with a
          #   memory-index init container. A new pod that has not run its
          #   step yet does not fire on the line of the pod before, and with
          #   no pod (replicas: 0) nothing fires.
          # The aggregator serves each sample with the time of its line, so
          # Prometheus holds a sample for 5 minutes only, and the gauge leaves
          # the aggregator after an hour: max_over_time reads 15 days, the
          # retention of Prometheus on homelab-wsl. The step runs once at each
          # start, so a pod that runs more than 15 days after a failed start
          # stops firing then.
          expr: |
            max by (namespace) (
              label_replace(
                max by (pod_namespace) (max_over_time(homelab_agent_platform_result_timestamp_seconds{pod_namespace=~"agents-.+", check="memory-index", result="failed"}[15d]))
                >= max by (pod_namespace) (max_over_time(homelab_agent_platform_result_timestamp_seconds{pod_namespace=~"agents-.+", check="memory-index"}[15d])),
                "namespace", "$1", "pod_namespace", "(.+)")
            )
            >= on (namespace)
            max by (namespace) (
              kube_pod_start_time{namespace=~"agents-.+"}
              and on (namespace, pod) kube_pod_init_container_info{namespace=~"agents-.+", container="memory-index"}
            )
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.${INTERNAL_DOMAIN}/d/tnwks-ai?var-cluster={{ $externalLabels.cluster }}"
            runbook_url: "https://github.com/iT3E/tnwks-ops/blob/main/docs/apps/agent-platform-runbook.md#agentmemoryindexfailed"
            summary: "The memory index step of the agent pod in {{ $labels.namespace }} failed at its last start."
            description: "kubectl -n {{ $labels.namespace }} logs deploy/agent -c memory-index shows memory-index result=failed; memory search stays as it was until a start that ends ok. Check the model gateway and the model server of the host, then start the pod again."

        - alert: AgentAutomationsSyncFailed
          # The newest `automations-sync result=` line of a trust domain is
          # result=failed: the automations-sync container of the agent pod
          # (pilot/agent/config/scripts/automations-sync.sh) could not make
          # the scheduled jobs of the product equal to automations.json (a
          # list that does not parse, a failed add or remove, no gateway).
          # A pass ends with one such line at the start of the pod and then
          # each hour, so the ok line of a later pass clears it. The window
          # is 3 hours, two passes and room: a pod that stops logging (no
          # pod) stops firing then. The aggregator serves each sample with
          # the time of its line, so max_over_time bridges the hour between
          # two lines.
          expr: |
            max by (namespace) (
              label_replace(
                max by (pod_namespace) (max_over_time(homelab_agent_platform_result_timestamp_seconds{pod_namespace=~"agents-.+", check="automations-sync", result="failed"}[3h]))
                >= max by (pod_namespace) (max_over_time(homelab_agent_platform_result_timestamp_seconds{pod_namespace=~"agents-.+", check="automations-sync"}[3h])),
                "namespace", "$1", "pod_namespace", "(.+)")
            )
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.${INTERNAL_DOMAIN}/d/tnwks-ai?var-cluster={{ $externalLabels.cluster }}"
            runbook_url: "https://github.com/iT3E/tnwks-ops/blob/main/docs/apps/agent-platform-runbook.md#agentautomationssyncfailed"
            summary: "The scheduled jobs of the agent in {{ $labels.namespace }} are not as in git."
            description: "kubectl -n {{ $labels.namespace }} logs deploy/agent -c automations-sync shows the reason= of the last pass and the key of each failed job. The jobs stay as they were until a pass that ends ok."

        - alert: AgentBackupMoverConfigMapDenied
          # The admission policy agents-backup-mover-configmaps
          # (kubernetes/apps/ai/agents/admission) refused a create, change or
          # delete of a ConfigMap by a backup mover ServiceAccount in a trust
          # domain: a mover pod tried to change the config or the scripts of
          # an agent, or a new release of the backup operator writes a
          # ConfigMap there. The API server counts a check of a policy only
          # when it fails, so the series starts at the first denial after a
          # start of the API server. Three parts:
          # - a later denial raises the counter (increase);
          # - the series is there now and was not there at any scrape of the
          #   hour before (the last 2 minutes left out, so that a new series
          #   shows for 2 minutes): the first denial. A gap of the scrape of
          #   less than an hour (a restart of Prometheus or of the host) does
          #   not make the series look new; a gap of more than an hour does,
          #   and fires once;
          # - the series is there now, and the API server started less than 2
          #   hours ago: a denial since that start. This covers the first
          #   denial in the hour after a restart of the API server, when the
          #   series of before the restart is still in the window above.
          # keep_firing_for holds the alert for an hour after the last of
          # these, so each denial fires for one to two hours.
          expr: |
            sum by (policy) (increase(apiserver_validating_admission_policy_check_total{policy="agents-backup-mover-configmaps", enforcement_action="deny"}[1h])) > 0
            or
            sum by (policy) (
              apiserver_validating_admission_policy_check_total{policy="agents-backup-mover-configmaps", enforcement_action="deny"}
              unless max_over_time(apiserver_validating_admission_policy_check_total{policy="agents-backup-mover-configmaps", enforcement_action="deny"}[1h] offset 2m)
            )
            or
            sum by (policy) (
              apiserver_validating_admission_policy_check_total{policy="agents-backup-mover-configmaps", enforcement_action="deny"}
              and on (instance) ((time() - process_start_time_seconds{job="apiserver"}) < 2 * 3600)
            )
          keep_firing_for: 1h
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.${INTERNAL_DOMAIN}/d/tnwks-ai?var-cluster={{ $externalLabels.cluster }}"
            runbook_url: "https://github.com/iT3E/tnwks-ops/blob/main/docs/apps/agent-platform-runbook.md#agentbackupmoverconfigmapdenied"
            summary: "The admission policy refused a ConfigMap write of a backup mover in a trust domain."
            description: "The audit log (security stream k8s-audit) names the namespace, the ConfigMap and the ServiceAccount: an objectRef with resource configmaps, code 422, and the user kopiur-mover, kopiur-snapshot-replication-mover or kopiur-stream-mover of that namespace. Treat it as an attack on the config of an agent until a release of the backup operator explains it."

        - alert: AgentBackupRepositoryNotReady
          # The Kopia repository of the agent trust domains (ClusterRepository
          # agents, or agents-<domain> later) stays Pending or Initializing:
          # it never got Ready, so no snapshot of a trust domain runs. The
          # chart rule KopiurRepositoryNotReady covers Failed and Degraded
          # only, and KopiurBackupStale does not fire for a policy that never
          # ran. A bootstrap takes minutes; 1h leaves room for one refresh of
          # the session (every 30 minutes).
          expr: |
            max by (name, phase) (kopiur_resource_phase{kind="ClusterRepository", name=~"agents(-.+)?", phase=~"Pending|Initializing"}) == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.${INTERNAL_DOMAIN}/d/tnwks-ai?var-cluster={{ $externalLabels.cluster }}"
            runbook_url: "https://github.com/iT3E/tnwks-ops/blob/main/docs/apps/agent-platform-runbook.md#agentbackuprepositorynotready"
            summary: "The backup repository {{ $labels.name }} of the agent trust domains is {{ $labels.phase }} for an hour."
            description: "kubectl get clusterrepository {{ $labels.name }} -o yaml: the Ready condition names the cause. Then the refresher of its session (kubectl -n kopiur-system get cronjob aws-backup-credentials-{{ $labels.name }}) and the discovery Job in kopiur-system."

        - alert: ModelBridgeRateLimited
          # The model bridge in `ai` logged an engine_error line with the kind
          # rate_limit: the limit of the Claude plan stopped a call of a trust
          # domain. The calls of that domain fail until the limit resets. It
          # fires for 20 minutes after the newest such line.
          expr: |
            time() - max by (domain) (max_over_time(homelab_model_bridge_engine_error_timestamp_seconds{kind="rate_limit"}[20m])) < 20 * 60
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.${INTERNAL_DOMAIN}/d/tnwks-ai?var-cluster={{ $externalLabels.cluster }}"
            runbook_url: "https://github.com/iT3E/tnwks-ops/blob/main/docs/apps/agent-platform-runbook.md#modelbridgeratelimited"
            summary: "The limit of the Claude plan stopped a call of the {{ $labels.domain }} trust domain."
            description: "The engine_error lines of the bridge are in Loki ({namespace=\"ai\", app=\"model-bridge\"} |= \"engine_error\"); the calls of that trust domain fail until the limit resets."

        - alert: ModelPlanNearLimit
          # The newest plan_limit line of the model bridge says that a window
          # of the Claude plan is near its limit (allowed_warning: the vendor's
          # own warning threshold) or at it (rejected), and the window did not
          # reset since. The windows are the five hour window and the week
          # windows that stop all calls; the overage windows are not limits.
          # It warns in the chat and never pages: calls still work, and the
          # owner can slow the agents down before the limit stops them. It
          # resolves when the window resets or a newer line says allowed. A
          # stop at the limit itself is ModelBridgeRateLimited.
          expr: |
            max by (window) (homelab:ai_plan_state{window=~"five_hour|seven_day|seven_day_opus|seven_day_sonnet"}) >= 2
          for: 5m
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.${INTERNAL_DOMAIN}/d/tnwks-ai?var-cluster={{ $externalLabels.cluster }}"
            runbook_url: "https://github.com/iT3E/tnwks-ops/blob/main/docs/apps/agent-platform-runbook.md#modelplannearlimit"
            summary: "The {{ $labels.window }} window of the Claude plan is near its limit."
            description: "The AI board, tab Limits and security, shows the use and the reset time of each window. The plan_limit lines of the bridge are in Loki ({namespace=\"ai\", app=\"model-bridge\"} |= \"plan_limit\")."

        - alert: AgentTurnNotEnded
          # A personal agent took a message and did not end its turn for 30
          # minutes: its counter of messages in is higher than its counter of
          # messages that ended (completed, skipped or error), the metrics of
          # the product (docs/apps/agent-platform.md, "Metrics"). The product
          # counts the end when the turn ends: after the model run, the tools,
          # and the streamed parts of the reply that the turn waits for
          # (OpenClaw 2026.11.3, dispatch-from-config). So it catches a turn
          # that never ends. It does not catch a final reply that the channel
          # sends after the turn ended and that then hangs or fails: that
          # message counts as ended. It does not catch a channel whose poll
          # stops either: no message reaches the agent, so no gap. A quiet
          # evening has no message, so no gap, and a group message that needs
          # no reply ends as skipped. A normal turn ends in minutes. Both
          # counters start again at a restart of the pod. A turn that ends in
          # an error is on the board.
          expr: |
            sum by (job, openclaw_channel) (openclaw_message_received_total{job=~"openclaw-agents-.+"})
              - (
                sum by (job, openclaw_channel) (openclaw_message_processed_total{job=~"openclaw-agents-.+"})
                or sum by (job, openclaw_channel) (openclaw_message_received_total{job=~"openclaw-agents-.+"}) * 0
              )
              >= 1
          for: 30m
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.${INTERNAL_DOMAIN}/d/tnwks-ai?var-cluster={{ $externalLabels.cluster }}"
            runbook_url: "https://github.com/iT3E/tnwks-ops/blob/main/docs/apps/agent-platform-runbook.md#agentturnnotended"
            summary: "{{ $labels.job }} took a message on {{ $labels.openclaw_channel }} and has not ended its turn for 30 minutes."
            description: "{{ $value }} messages of this agent have no end of their turn. The AI board, tab Messages, row Messages with no end, shows the gap. The chat may get no reply until the channel or the pod starts again."

        - alert: AgentChannelFailing
          # The Telegram channel of a personal agent logged error lines in the
          # last 30 minutes. The platform Vector counts them on the node from
          # the log of the agent container, as fixed patterns, and only the
          # count leaves the node: the log itself does not ship
          # (docs/apps/agent-platform.md, "Logs"). One line is enough for a
          # reply that did not reach the chat (send_failed: a call to send or
          # edit a message failed after its retries, or it hung until its
          # timeout of 60 seconds, or the final reply failed) and for a
          # restart of the channel by the health monitor of the product
          # (channel_restart: the channel was
          # stuck or its socket stale for 25 to 30 minutes). The poll restarts
          # itself after one stall, so it takes 3 lines of the poll
          # (poll_stall, poll_restart) in 30 minutes: the poll stopped and did
          # not come back after two restarts. This catches what
          # AgentTurnNotEnded does not: a final reply that hangs or fails
          # after the turn ended, and a poll that stops. A reply that the chat
          # API took but did not show, and a failure that the product does
          # not log, are not caught.
          expr: |
            sum by (pod_namespace, pattern) (increase(homelab_agent_channel_error_lines_total{pattern=~"send_failed|channel_restart"}[30m])) > 0
            or
            sum by (pod_namespace, pattern) (increase(homelab_agent_channel_error_lines_total{pattern=~"poll_stall|poll_restart"}[30m])) >= 3
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.${INTERNAL_DOMAIN}/d/tnwks-ai?var-cluster={{ $externalLabels.cluster }}"
            runbook_url: "https://github.com/iT3E/tnwks-ops/blob/main/docs/apps/agent-platform-runbook.md#agentchannelfailing"
            summary: "The Telegram channel of {{ $labels.pod_namespace }} logged {{ $labels.pattern }} lines in the last 30 minutes."
            description: "About {{ $value | humanize }} lines of the pattern {{ $labels.pattern }}. Only the count leaves the node; the runbook says how to read the lines on the pod. The chat may get no reply, or a reply may be lost."
