---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The alert rules of the agent platform (docs/apps/agent-platform.md,
# "Alerts"). homelab-wsl only, as the rest of the platform.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agents-monitoring
  namespace: flux-system
spec:
  # The PrometheusRule needs its CRD.
  dependsOn:
    - name: kube-prometheus-stack
  path: ./kubernetes/apps/ai/agents/monitoring/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
