---
# The read rights of the read servers of main (Design Doc, section 4.2.6):
# the cluster server (../../cluster-mcp). The role view in each namespace
# but agents-finance and ai, and the list of the namespaces. Nothing else.
#
# The role view reads no Secret, gives no exec, no port-forward and no
# attach (it is the aggregated role of Kubernetes). No ClusterRoleBinding
# gives view, so a list or a watch across all namespaces gets a 403 from
# the API server: pods_list and events_list with no namespace, for example.
# agents-finance holds the data of the finance trust domain (R6), and ai
# holds the log of the central MCP gateway, with a line for each tool call
# of finance.
#
# A namespace that comes later gets no binding until a PR adds it here:
# observability/tests/test_main_read_servers.py lists each namespace of
# this cluster (its app list in git) with no binding, and fails for any but
# those two.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agents-main-read-namespaces
rules:
  # namespaces_list: the names and the labels of the namespaces.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agents-main-read-namespaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agents-main-read-namespaces
subjects:
  - kind: ServiceAccount
    name: cluster-mcp
    namespace: agents-main
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
