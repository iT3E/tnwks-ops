---
# The Flux server of main. In: the MCP gateway only
# (kubernetes/apps/ai/mcp-gateway), which checks the key of each client and
# lets through only the tools of its route main-flux; and the kubelet on the
# node, for the probes. Not the agent pod and not a sandbox: the agent calls
# the gateway. Out: the API server only, by its address (no DNS). The
# namespace's default deny holds the rest (../../namespace.yaml).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: flux-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: mcp-gateway
            # Both WSL clusters are one Cilium Cluster Mesh: name this cluster.
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
