---
# The copy of the Flux server of main at site 2. In: the MCP gateway of
# site 1 only, over Cluster Mesh
# (kubernetes/apps/ai/mcp-gateway), which checks the key of each client and
# lets through only the tools of its route main-flux-site2; and the kubelet on the
# node, for the probes. Not the agent pod and not a sandbox: the agent calls
# the gateway. Out: the API server only, by its address (no DNS). The
# namespace's default deny holds the rest (../../../namespace.yaml).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-mcp-site2
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: flux-mcp-site2
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: mcp-gateway
            # Both WSL clusters are one Cilium Cluster Mesh: the central
            # gateway runs in the other cluster (site 1).
            io.cilium.k8s.policy.cluster: ${PEER_CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
