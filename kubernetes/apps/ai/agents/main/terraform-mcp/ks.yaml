---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The Terraform server of main (Design Doc, section 4.2.6): the Terraform
# MCP server of HashiCorp with the registry toolset and no token, behind the
# central MCP gateway (kubernetes/apps/ai/mcp-gateway, route
# main-terraform). It reads the public registry only.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agents-main-terraform-mcp
  namespace: flux-system
spec:
  targetNamespace: agents-main
  path: ./kubernetes/apps/ai/agents/main/terraform-mcp/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Ready only when the server is.
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
