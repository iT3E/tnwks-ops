---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./namespace.yaml
  # The network policy of the backup movers. It selects no pod until the
  # backup policy of agent/app is applied.
  - ./backup-mover.yaml
  - ./sandbox-gateway/ks.yaml
  - ./checks/ks.yaml
  # The main agent: its state volume and the inbox only, so far
  # (agent/app/kustomization.yaml).
  - ./agent/ks.yaml
  # The fetch proxy of the main agent: its one way to a web site that the
  # agent picks (fetch-proxy/ks.yaml).
  - ./fetch-proxy/ks.yaml
  # The share of the vault: its two volumes and two claims
  # (vault-share/ks.yaml).
  - ./vault-share/ks.yaml
  # The vault server of the share, behind the central MCP gateway
  # (vault-server/ks.yaml). No pod of main mounts the share or calls the
  # route yet.
  - ./vault-server/ks.yaml
  # The nightly snapshot of the share (vault-backup/ks.yaml), to the
  # repository of main.
  - ./vault-backup/ks.yaml
