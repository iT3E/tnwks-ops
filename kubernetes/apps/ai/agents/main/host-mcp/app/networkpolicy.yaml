---
# The host server of main. In: the central MCP gateway on port 8080 (the
# proxy), and the kubelet on 8080 and 3000 (the probes of the proxy and of
# the server). Out: port 22 of the SSH address of the Windows
# host of this site and of its WSL distro, and nothing else: no DNS, no pod,
# no other address (Design Doc, section 4.2.6, "The network rule").
#
# WINDOWS_HOST_IP and HOST_MCP_DISTRO_ADDR are in cluster-settings. The second
# is the gateway of the Docker network of the nodes, not a node, so a CIDR
# rule selects it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: host-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: host-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: mcp-gateway
            # Both WSL clusters are one Cilium Cluster Mesh: name this cluster.
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The kubelet: the probe of the proxy, and the TCP probe of the server.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "3000"
              protocol: TCP
  egress:
    - toCIDR:
        - ${WINDOWS_HOST_IP}/32
        - ${HOST_MCP_DISTRO_ADDR}/32
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
