---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The checks of the agent platform in agents-main: the checks of every trust
# domain (kubernetes/apps/ai/agents/checks/app), and the gateway probe of
# the vault route of main (app/mcp-gateway-probe.yaml).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agents-main-checks
  namespace: flux-system
spec:
  targetNamespace: agents-main
  path: ./kubernetes/apps/ai/agents/main/checks/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    # The client certificate, and a gateway to check.
    - name: agents-main-sandbox-gateway
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
