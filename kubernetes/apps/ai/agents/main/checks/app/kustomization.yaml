---
# The checks of the agent platform in agents-main: the checks of every trust
# domain (kubernetes/apps/ai/agents/checks/app), and the gateway probe of
# the vault route of main (mcp-gateway-probe.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../checks/app
  - ./mcp-gateway-probe.yaml
  # The Secret mcp-gateway-probe-secret (PROBE_KEY) is not here yet: the
  # lead makes it at the values step of the key of main, as
  # secret-mcp-gateway-probe.sops.yaml, and lists it here. Until then the
  # probe has no PROBE_KEY and says "skipped: the key is pending" for the
  # checks that need it (mcp-gateway-probe.yaml).
configMapGenerator:
  # The config of the MCP gateway, the same file: the gateway probe reads
  # the tool list of the route main-vault from it.
  - name: mcp-gateway-probe-config
    files:
      - config.yaml=../../../../mcp-gateway/app/config/config.yaml
