---
# The main agent (docs/apps/agent-platform.md): the product (OpenClaw) in the
# agent image, in the form of the finance agent. Listed by step 4 of the
# cutover at replicas 0 (no pod), after the owner put the values of its
# Secrets (R4) and the copy of the state in place; replicas 1 is step 5,
# after the host stopped the Telegram account of the main agent
# (docs/apps/agent-platform-runbook.md, "The cutover of the main agent").
# M7a, the first step: one Telegram account with the direct chat of the
# owner and one group, web search, images through the model, and the
# built-in tools of the product, and the vault of the main trust domain
# (task 3.37): its share, read only at /vault for the index, and the six
# read tools of the vault through the central MCP gateway, with the key of
# this agent (MCP_GATEWAY_KEY). The three write tools come with the seed of
# the share: the seed stops at a share that is not empty. M7b, the read
# step: the read tools of the cluster, Flux, Terraform and code host
# servers, through the same gateway with the same key (Design Doc, section
# 4.2.6). The host approval plugin of the image (task 6.22), with no host
# tool yet (docs/apps/agent-platform-runbook.md, "The host approval plugin
# (main)"). No finance app, no Signal and no scheduled job (the Monday job
# comes with the Signal step). Each command it runs goes to a sandbox of this trust domain,
# through the sandbox gateway; each model call goes to the model gateway,
# with the key of this trust domain.
#
# The image contract is in the README of iT3E/tnwks-agent-image: the user,
# the paths, the read-only root and the steps before the start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  labels:
    app.kubernetes.io/name: agent
  annotations:
    # Start the pod again when a Secret it uses changes: agent-secret,
    # agent-search-secret, agent-telegram-groups or openshell-client-tls (a
    # renewal). Not for a
    # ConfigMap: a change of the config or of a script gives the ConfigMap a
    # new name (app/kustomization.yaml), so Flux changes the pod template
    # and that is the one rollout. Reloader on the ConfigMaps too would make
    # a second one.
    secret.reloader.stakater.com/auto: "true"
spec:
  # One since step 5. In the test run beside the host the pod polls the test
  # bot, which moved here from the pilot, and the host keeps its bot (one
  # poller for each bot token).
  replicas: 1
  revisionHistoryLimit: 2
  # The old pod stops before the new one starts: one process holds the state,
  # and the archive step reads it with no writer.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent
        # The logs of this pod go to Loki, but the agent container's: its
        # log can hold chat content. What ships is the record of the backup,
        # of the instruction check, of the sandbox start and of each start
        # of the pod
        # (kubernetes/apps/monitoring/vector/agent-platform/config/vector.yaml).
        logs.home.arpa/ship: "true"
      annotations:
        vector.dev/exclude-containers: agent
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # One PID namespace for the containers of the pod. The backup command
      # of the product checks that the gateway owns the state before it
      # reads it, and it can only see the gateway process in the same PID
      # namespace ("run this command inside the Gateway container or with a
      # shared PID namespace"). The containers run the same image, as the
      # same user. The backup container has the same secret env as the
      # gateway, so it sees no more than it holds already; the sandbox-start
      # container has none, but it can see the processes of the others. The
      # restricted Pod Security level allows it.
      shareProcessNamespace: true
      # The state volume (local-path) stays on the node of the first start.
      # The node is set at the cutover, by the free memory of each worker
      # then; the pilot runs on the second worker.
      nodeSelector:
        kubernetes.io/hostname: homelab-wsl-worker-2
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The values check: the pod does not start while a value of its
        # Secrets is empty or still the placeholder `pending` of git, while
        # the SHA-256 of MCP_GATEWAY_KEY is not the hash of the client main
        # on the route main-vault in the config of the MCP gateway (the same
        # file, mounted here), or while the file of the Telegram group is not
        # one group: a JSON object with one key, a negative chat id. It also
        # stops the start while TELEGRAM_ALLOW_FROM is not one chat ID (it
        # is the approver of the host approval plugin), or while the config
        # does not hold the approval form that the plugin checks at its
        # load (key=host-approval). With a fault of that form the plugin
        # refuses each tool call of the agent, the vault and the read routes
        # too. The check runs the code of the plugin in the image on the
        # config with the values of the env. It
        # prints `values-check result=ok` or `values-check result=failed
        # key=<name> reason=empty|placeholder|hash|form`, the name of the key
        # only, never a value or a hash, and fails the start. The pod then stays in
        # Init:CrashLoopBackOff, not ready, and AgentPlatformWorkloadNotReady
        # fires after 10 minutes.
        - name: values-check
          image: &image ghcr.io/it3e/tnwks-agent-image:0.5.0@sha256:8839bc84d4286df7627c31f48e3a3e8efdb86bce3b0e152ec96118835d4660be
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              for k in OPENCLAW_GATEWAY_TOKEN LITELLM_API_KEY TELEGRAM_BOT_TOKEN TELEGRAM_ALLOW_FROM MCP_GATEWAY_KEY BRAVE_API_KEY; do
                v=$(printenv "$k" || true)
                if [ -z "$v" ]; then echo "values-check result=failed key=$k reason=empty"; exit 1; fi
                if [ "$v" = pending ]; then echo "values-check result=failed key=$k reason=placeholder"; exit 1; fi
              done
              have=$(printf %s "$MCP_GATEWAY_KEY" | sha256sum | cut -d " " -f 1)
              want=$(awk '/keyHash:/ { k = $NF; gsub(/"/, "", k) } /metadata: \{client: main, route: main-vault\}/ { print k }' /gateway/config.yaml)
              if [ "$want" != "sha256:$have" ]; then echo "values-check result=failed key=MCP_GATEWAY_KEY reason=hash"; exit 1; fi
              k=telegram-groups.json
              g=/home/node/config/telegram-groups.json
              if [ ! -s "$g" ]; then echo "values-check result=failed key=$k reason=empty"; exit 1; fi
              if [ "$(cat "$g")" = pending ]; then echo "values-check result=failed key=$k reason=placeholder"; exit 1; fi
              if ! node -e 'const g = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); const k = Object.keys(g); process.exit(g && typeof g === "object" && !Array.isArray(g) && k.length === 1 && /^-[0-9]+$/.test(k[0]) ? 0 : 1)' "$g" 2> /dev/null; then
                echo "values-check result=failed key=$k reason=form"; exit 1
              fi
              case "$TELEGRAM_ALLOW_FROM" in
                *[!0-9]*) echo "values-check result=failed key=TELEGRAM_ALLOW_FROM reason=form"; exit 1 ;;
              esac
              # No dollar sign before a brace here: Flux substitutes that form
              # in this file. \x24 and \x7b are those two characters.
              if ! node --input-type=module -e '
                import fs from "node:fs";
                const lib = await import("/opt/openclaw/local-plugins/host-approval/lib.js");
                const ref = /\x24\x7b([A-Z_][A-Z0-9_]*)\x7d/g;
                const fill = (v) => typeof v === "string" ? v.replace(ref, (m, n) => process.env[n] ?? m)
                  : Array.isArray(v) ? v.map(fill)
                  : v && typeof v === "object" ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, fill(x)])) : v;
                const c = fill(JSON.parse(fs.readFileSync("/home/node/config/openclaw.json", "utf8")));
                const entry = c.plugins?.entries?.["host-approval"];
                if (!entry || entry.enabled !== true) process.exit(1);
                const parsed = lib.parseConfig(entry.config);
                if (!parsed.ok) process.exit(1);
                if (lib.checkProductConfig(c, parsed.config, process.env).length) process.exit(1);
                const byName = async (host) => [{ address: host }];
                if ((await lib.checkServerRoutes(c.mcp?.servers, parsed.config, byName)).length) process.exit(1);
              ' 2> /dev/null; then
                echo "values-check result=failed key=host-approval reason=form"; exit 1
              fi
              echo "values-check result=ok"
          envFrom:
            - secretRef:
                name: agent-secret
            - secretRef:
                name: agent-search-secret
          volumeMounts:
            - name: config
              mountPath: /home/node/config
              readOnly: true
            - name: mcp-gateway-config
              mountPath: /gateway
              readOnly: true
          securityContext: &containerSecurity
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources: &small
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
        # The two directories of the state volume and /tmp, as uid 1000 with
        # mode 0700, and the client certificate of the sandbox gateway in the
        # directory of the CLI: the gateway address with each ":" and "/" as
        # "_". Each container mounts the volume at its root, with no subPath:
        # on this cluster the kubelet can't reach the local-path directory,
        # so it would make a subPath directory as root (talos/wsl/README.md).
        - name: prepare
          image: *image
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /home/node/data/state /home/node/data/archives /scratch/tmp
              chmod 0700 /home/node/data/state /home/node/data/archives /scratch/tmp
              mkdir -p /home/node/.config/openshell/gateways/https___openshell.agents-main.svc.cluster.local_8080/mtls
              cp /openshell-tls/ca.crt /openshell-tls/tls.crt /openshell-tls/tls.key \
                /home/node/.config/openshell/gateways/https___openshell.agents-main.svc.cluster.local_8080/mtls/
              chmod 0600 /home/node/.config/openshell/gateways/https___openshell.agents-main.svc.cluster.local_8080/mtls/*
          securityContext: *containerSecurity
          resources: *small
          volumeMounts:
            - name: state
              mountPath: /home/node/data
            - name: tmp
              mountPath: /scratch
            - name: user-config
              mountPath: /home/node/.config
            - name: openshell-tls
              mountPath: /openshell-tls
              readOnly: true
        # The archive step (scripts/archive-state.sh in ../config): an archive
        # of the state, named with the release that starts, read back against
        # its checksum. A failed step stops the start.
        - name: archive
          image: *image
          imagePullPolicy: IfNotPresent
          command: ["sh", "/scripts/archive-state.sh"]
          env: &env
            # A change from the vault server comes from another NFS client,
            # so the share gives no file event: the watch of the index polls
            # (Design Doc of effort 0003, section 4.2.5). The other users of
            # this list watch no file.
            - name: CHOKIDAR_USEPOLLING
              value: "1"
            # The state directory of the product (with the workspace in it),
            # on the volume. The archives are next to it, outside it.
            - name: OPENCLAW_STATE_DIR
              value: /home/node/data/state
            # The config from git, a read-only file. The product treats it as
            # managed outside: no command or repair writes to it.
            - name: OPENCLAW_CONFIG_PATH
              value: /home/node/config/openclaw.json
            - name: OPENCLAW_CONFIG_READONLY
              value: "1"
            - name: XDG_CACHE_HOME
              value: /home/node/data/state/.cache
            # No update check, no telemetry call and no download of helper
            # binaries (the network policy has no route for any of them).
            - name: OPENCLAW_NO_AUTO_UPDATE
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
            - name: OPENCLAW_OFFLINE
              value: "1"
          securityContext: *containerSecurity
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: state
              mountPath: /home/node/data
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
              subPath: tmp
            - name: user-config
              mountPath: /home/node/.config
        # The official plugins step of the image (the image README, "The
        # official plugins"): it installs the Brave plugin from the npm cache
        # of the image, with no network, as a verified official install, in
        # the state directory. A sandboxed session uses a search provider
        # only when it is bundled or a verified official install, and each
        # session of this agent is sandboxed. It runs before doctor, which
        # would try to install a missing configured plugin from the npm
        # registry. It installs the plugin again at each start, and stops
        # the start on a plugin in the state that the image did not put
        # there. It prints `official-plugins id=brave version=...
        # result=installed|failed` or `official-plugins result=failed
        # reason=...`, and a failure stops the start.
        # It needs no secret.
        - name: official-plugins
          image: *image
          imagePullPolicy: IfNotPresent
          # The step of the image copies only openclaw.json to its work
          # directory, and the config of main includes the group file of the
          # owner (./telegram-groups.json), which the copy then can not read.
          # So the step gets one file with the include filled in, in a
          # directory of its own in /tmp that goes away at the end.
          command:
            - sh
            - -c
            - |
              set -eu
              d="$(mktemp -d /tmp/plugins-config.XXXXXX)"
              trap 'rm -rf "$d"' EXIT
              node -e '
                const fs = require("fs");
                const c = JSON.parse(fs.readFileSync("/home/node/config/openclaw.json", "utf8"));
                c.channels.telegram.groups = JSON.parse(fs.readFileSync("/home/node/config/telegram-groups.json", "utf8"));
                fs.writeFileSync(process.argv[1], JSON.stringify(c));
              ' "$d/openclaw.json"
              OPENCLAW_CONFIG_PATH="$d/openclaw.json" install-official-plugins
          # The env of the gateway, and OPENCLAW_DEBUG: on a failure the CLI
          # of the product then prints the reason and the stack
          # (`[openclaw] Reason: ...`), not only "The CLI command failed".
          # The flag changes nothing else in this release (it is read only
          # by the failure output of the CLI), and the step has no secret
          # to print.
          env:
            # As the list of the gateway (env above).
            - name: CHOKIDAR_USEPOLLING
              value: "1"
            - name: OPENCLAW_STATE_DIR
              value: /home/node/data/state
            - name: OPENCLAW_CONFIG_PATH
              value: /home/node/config/openclaw.json
            - name: OPENCLAW_CONFIG_READONLY
              value: "1"
            - name: XDG_CACHE_HOME
              value: /home/node/data/state/.cache
            - name: OPENCLAW_NO_AUTO_UPDATE
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
            - name: OPENCLAW_OFFLINE
              value: "1"
            - name: OPENCLAW_DEBUG
              value: "1"
          securityContext: *containerSecurity
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: state
              mountPath: /home/node/data
            - name: config
              mountPath: /home/node/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
              subPath: tmp
            - name: user-config
              mountPath: /home/node/.config
        # Doctor of the product, on a copy of the config (the image README):
        # it migrates the state for a new release.
        - name: doctor
          image: *image
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              mkdir -p /tmp/doctor
              && cp /home/node/config/openclaw.json /home/node/config/telegram-groups.json /tmp/doctor/
              && exec node /app/openclaw.mjs doctor --fix --non-interactive
          env:
            - name: OPENCLAW_STATE_DIR
              value: /home/node/data/state
            - name: OPENCLAW_CONFIG_PATH
              value: /tmp/doctor/openclaw.json
            - name: XDG_CACHE_HOME
              value: /home/node/data/state/.cache
            - name: OPENCLAW_NO_AUTO_UPDATE
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
            - name: OPENCLAW_OFFLINE
              value: "1"
          envFrom: &secrets
            # OPENCLAW_GATEWAY_TOKEN, LITELLM_API_KEY, TELEGRAM_BOT_TOKEN,
            # TELEGRAM_ALLOW_FROM, MCP_GATEWAY_KEY
            # (docs/apps/agent-platform-runbook.md, "The cutover of the main
            # agent").
            - secretRef:
                name: agent-secret
          securityContext: *containerSecurity
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts: &stateMounts
            - name: state
              mountPath: /home/node/data
            # The share of main, read only (../../vault-share), at its root
            # (no subPath): the index reads it, and memory_get. The path is
            # the one of the vault server, so a path from a search works in
            # a vault tool call.
            - name: vault
              mountPath: /vault
              readOnly: true
            - name: config
              mountPath: /home/node/config
              readOnly: true
            # /tmp with mode 0700: the sandbox plugin refuses a temp dir that
            # others can write with no sticky bit, as an emptyDir is.
            - name: tmp
              mountPath: /tmp
              subPath: tmp
            - name: user-config
              mountPath: /home/node/.config
        # The memory index step (scripts/memory-index.sh in ../config): a
        # stale index (a new embedding provider or model) gets a full rebuild,
        # a valid one an incremental pass, before the gateway owns the state.
        # It prints one line, memory-index result=ok|failed, and never stops
        # the start: a failure or the time limit leaves search as it was.
        # Its one secret is the key of the model gateway, for the
        # embeddings.
        - name: memory-index
          image: *image
          imagePullPolicy: IfNotPresent
          command: ["sh", "/scripts/memory-index.sh"]
          env:
            - name: OPENCLAW_STATE_DIR
              value: /home/node/data/state
            - name: OPENCLAW_CONFIG_PATH
              value: /home/node/config/openclaw.json
            - name: OPENCLAW_CONFIG_READONLY
              value: "1"
            - name: XDG_CACHE_HOME
              value: /home/node/data/state/.cache
            - name: OPENCLAW_NO_AUTO_UPDATE
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
            - name: OPENCLAW_OFFLINE
              value: "1"
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-secret
                  key: LITELLM_API_KEY
          securityContext: *containerSecurity
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: state
              mountPath: /home/node/data
            - name: vault
              mountPath: /vault
              readOnly: true
            - name: config
              mountPath: /home/node/config
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
              subPath: tmp
            - name: user-config
              mountPath: /home/node/.config
      containers:
        # The gateway of the product, on loopback only: no pod comes in. It
        # reaches the channels, the model gateway and the sandbox gateway.
        - name: agent
          image: *image
          imagePullPolicy: IfNotPresent
          env: *env
          envFrom:
            - secretRef:
                name: agent-secret
            # BRAVE_API_KEY (the key of main, not a key of another trust
            # domain), for the web search of the gateway. This container only: not the init
            # containers, not the backup container, and no sandbox
            # (autoProviders is off).
            - secretRef:
                name: agent-search-secret
            # HTTPS_PROXY, HTTP_PROXY and NO_PROXY: the fetch proxy for
            # web_fetch (agent-fetch-proxy in kustomization.yaml). This
            # container only: the other steps of the pod make no call out.
            - configMapRef:
                name: agent-fetch-proxy
          ports:
            - name: gateway
              containerPort: 18789
              protocol: TCP
          startupProbe:
            exec:
              command: &healthz
                - node
                - -e
                - "require('http').get('http://127.0.0.1:18789/healthz', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:18789/readyz', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: *healthz
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          # The limit of the Design Doc (section 10.1). The request covers
          # the use that the pilot measured over 24 hours: 1.2 to 1.6 GiB
          # steady, 1.9 GiB at the most.
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              memory: 4Gi
          securityContext: *containerSecurity
          volumeMounts: *stateMounts
        # The backup container (scripts/daily-backup.sh in ../config): once a
        # day, the backup command of the product with its check, then the
        # check of the instruction files.
        #
        # It runs on a copy of the config, as the doctor step does. The
        # backup command captures each file of the config, and it refuses an
        # include file that is a link ("include alias cannot be represented
        # in this archive", src/infra/backup-config-capture.ts at 2026.11.3);
        # in the projected volume each file is a link (..data/), so the group
        # file failed each backup. The copy holds regular files, in a private
        # directory of /tmp, and is made at each start of the container. A
        # change of the config gives the pod a new template, and a change of
        # the group Secret starts the pod again (Reloader), so the copy is
        # never older than the files of the gateway.
        - name: backup
          image: *image
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              d=/tmp/backup-config
              if [ -e "$d" ]; then find "$d" -mindepth 1 -delete; else mkdir "$d"; fi
              chmod 0700 "$d"
              cp /home/node/config/openclaw.json /home/node/config/telegram-groups.json "$d/"
              OPENCLAW_CONFIG_PATH="$d/openclaw.json" exec sh /scripts/daily-backup.sh
          env: *env
          envFrom: *secrets
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext: *containerSecurity
          volumeMounts:
            - name: state
              mountPath: /home/node/data
            - name: config
              mountPath: /home/node/config
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
              subPath: tmp
            - name: user-config
              mountPath: /home/node/.config
        # The sandbox-start container (scripts/sandbox-start.sh in ../config):
        # it starts each sandbox of the product that the sandbox gateway left
        # stopped, when the pod starts and then each minute. The client
        # certificate of the sandbox gateway is all it uses, so it gets no
        # secret env.
        - name: sandbox-start
          image: *image
          imagePullPolicy: IfNotPresent
          command: ["sh", "/scripts/sandbox-start.sh"]
          resources: *small
          securityContext: *containerSecurity
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
              subPath: tmp
            - name: user-config
              mountPath: /home/node/.config
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: agent-state
        # The share of main. readOnly on the claim as well as the option ro
        # of its volume: the kubelet takes the flag from the pod, not from
        # the volume (Design Doc of effort 0003, section 4.2.5). A soft
        # mount: with the NFS server away a read fails after about 30 s, and
        # the chat goes on. The pod does not start while the NFS server is
        # away, and starts when it is back.
        - name: vault
          persistentVolumeClaim:
            claimName: vault-ro
            readOnly: true
        # The config: the ConfigMap of git and, beside it, the file of the
        # Telegram group from the Secret of the owner (openclaw.json
        # includes it: a chat id is a key there, and the product puts an env
        # value in a value only, not in a key).
        - name: config
          projected:
            sources:
              - configMap:
                  name: agent-config
              - secret:
                  name: agent-telegram-groups
                  items:
                    - key: telegram-groups.json
                      path: telegram-groups.json
        - name: scripts
          configMap:
            name: agent-scripts
        # The config of the MCP gateway, for the hash of the client main
        # (kustomization.yaml): hashes and tool rules, no secret.
        - name: mcp-gateway-config
          configMap:
            name: agent-mcp-gateway-config
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: user-config
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        # The client certificate of this trust domain's sandbox gateway
        # (cert-manager, sandbox-gateway/app).
        - name: openshell-tls
          secret:
            secretName: openshell-client-tls
            defaultMode: 0440
