---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The code host server of main (Design Doc, section 4.2.6): the GitHub MCP
# server, read only, behind the central MCP gateway
# (kubernetes/apps/ai/mcp-gateway, route main-github). Its credential is the
# Secret github-mcp-token, in its own pod only.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agents-main-github-mcp
  namespace: flux-system
spec:
  targetNamespace: agents-main
  path: ./kubernetes/apps/ai/agents/main/github-mcp/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Ready only when the server is. The pod needs the Secret github-mcp-token
  # (app/secret.sops.yaml) to start.
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
