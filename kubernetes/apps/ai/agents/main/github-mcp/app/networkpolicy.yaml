---
# The code host server of main. In: the MCP gateway only
# (kubernetes/apps/ai/mcp-gateway), which checks the key of each client and
# lets through only the tools of its route main-github, for one repository;
# and the kubelet on the node, for the probes. Both reach the proxy port
# only: the server listens on the loopback of the pod. Out: the API of the
# code host and its host of raw file content (get_file_contents), on 443,
# and DNS for those two names only. The namespace's default deny holds the
# rest (../../namespace.yaml).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: github-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: github-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: mcp-gateway
            # Both WSL clusters are one Cilium Cluster Mesh: name this cluster.
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toFQDNs:
        - matchName: api.github.com
        - matchName: raw.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: api.github.com
              - matchName: raw.githubusercontent.com
