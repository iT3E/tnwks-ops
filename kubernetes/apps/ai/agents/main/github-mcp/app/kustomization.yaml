---
# The code host server of main: the GitHub MCP server over Streamable HTTP,
# read only, with a proxy container in its pod that sets the token on each
# request (the pattern of the proxy of finance).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./deployment.yaml
  - ./networkpolicy.yaml
  # No Secret here: the token is the Secret github-mcp-app-token of the
  # token job of the App of main (../../github-token).
configMapGenerator:
  - name: github-mcp-proxy
    files:
      - default.conf.template=./proxy/default.conf.template
      - token.js=./proxy/token.js
    options:
      annotations:
        # ${GITHUB_MCP_UPSTREAM} is for the entrypoint of the proxy, and
        # $github_mcp_token for nginx, not Flux.
        kustomize.toolkit.fluxcd.io/substitute: disabled
