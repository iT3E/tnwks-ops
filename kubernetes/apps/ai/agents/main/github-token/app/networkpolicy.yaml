---
# The token job. Nothing comes in. Out: the API of the code host on 443 for
# the JWT and the token, the API server for the update of the one Secret,
# and DNS for the name of the API of the code host only. The namespace's
# default deny holds the rest (../../namespace.yaml).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: github-token
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: github-token
  egress:
    - toFQDNs:
        - matchName: api.github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
            # Both WSL clusters are one Cilium Cluster Mesh: name this cluster.
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: api.github.com
