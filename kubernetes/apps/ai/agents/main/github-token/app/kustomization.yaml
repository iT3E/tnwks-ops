---
# The token job of the App of the main agent (../ks.yaml).
# - cronjob.yaml: each 30 minutes, one installation token of the App for the
#   ops repository and the permissions of the design, written into the
#   Secret github-mcp-app-token.
# - secret-token.yaml: that Secret. Flux makes it once with a placeholder and
#   never writes it again (IfNotPresent), so the job owns its data.
# - secret.sops.yaml: the private key of the App, which the owner put in
#   with bin/main-app-key. Only the job mounts it.
# - rbac.yaml: the account of the job may update the one Secret by name.
# - networkpolicy.yaml: out to the API of the code host and the API server.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./secret.sops.yaml
  - ./secret-token.yaml
  - ./rbac.yaml
  - ./cronjob.yaml
  - ./networkpolicy.yaml
configMapGenerator:
  - name: github-token-script
    files:
      - github_token.py=./scripts/github_token.py
