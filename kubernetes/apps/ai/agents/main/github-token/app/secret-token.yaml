---
# The installation token of the App of the main agent, which the token job
# writes (cronjob.yaml). Flux only makes it (IfNotPresent) and never writes
# it again, so the job owns the data. The placeholder fails each call until
# the first run of the job.
apiVersion: v1
kind: Secret
metadata:
  name: github-mcp-app-token
  labels:
    app.kubernetes.io/name: github-token
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
type: Opaque
stringData:
  GITHUB_MCP_TOKEN: pending
