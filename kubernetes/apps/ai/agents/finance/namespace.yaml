---
# The trust domain of the finance agent. A trust domain shares no
# process, volume or credential with another one (docs/apps/agent-platform.md).
# Pods here meet the `restricted` Pod Security level.
apiVersion: v1
kind: Namespace
metadata:
  name: agents-finance
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    agents.home.arpa/trust-domain: finance
---
# Deny by default. A sandbox has two pods, and its sandbox gateway gives each
# one its own policies when it makes it: the workload pod gets no egress at
# all, DNS included, and the supervisor pod (openshell.ai/managed-by, left out
# here) carries the egress the sandbox policy approves.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: agents-finance
spec:
  podSelector:
    matchExpressions:
      - key: openshell.ai/managed-by
        operator: DoesNotExist
  policyTypes: ["Ingress", "Egress"]
---
# DNS for the pods of the trust domain (gateway, agent, checks), through
# Cilium's DNS proxy, so an egress policy here can name host names (toFQDNs).
# Not for the pods of a sandbox: the workload pod (openshell.ai/boundary-role)
# gets no DNS egress, since its names resolve through its supervisor, and the
# supervisor pod (openshell.ai/managed-by) has its own egress policy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns
  namespace: agents-finance
spec:
  endpointSelector:
    matchExpressions:
      - key: openshell.ai/managed-by
        operator: DoesNotExist
      - key: openshell.ai/boundary-role
        operator: DoesNotExist
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
            # Both WSL clusters are one Cilium Cluster Mesh: name this cluster.
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
