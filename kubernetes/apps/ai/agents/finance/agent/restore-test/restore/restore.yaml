---
# TEMPLATE, not applied: no kustomization.yaml lists this directory. The
# restore test of the finance agent's state, as the pilot's ran on
# 2026-11-16 (two runs of the check; the second mounts the volume at the
# path of the agent pod). To run it: set the snapshot name in
# restore/restore.yaml, then list
# ./agent/restore-test/ks.yaml in ../../kustomization.yaml, in a pull request
# with the owner's go; remove it in the next one.
# Restore one snapshot of the finance policy into the scratch volume. The form of step 4 of "After the loss of the
# volume" in docs/apps/agent-platform-runbook.md: the snapshot by name,
# credentialProjection, and the mover identity of agent/app/backup.yaml.
# Reads the repository only; writes only the scratch volume.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: agent-state-restore-test
spec:
  source:
    snapshotRef:
      # A Succeeded snapshot of the finance policy, by name
      # (kubectl -n agents-finance get snapshots.kopiur.home-operations.com).
      name: agent-state-SET-ME
  target:
    # The claim of pvc.yaml. No pod holds it, so the mover is not pinned to
    # a node.
    pvcRef:
      name: agent-state-restore-test
  # The mover gets the credentials of the repository for the run; the copy
  # is owned by the Restore and goes with it.
  credentialProjection:
    enabled: true
  mover:
    # uid 1000, the owner of the files the agent reads, and the restricted
    # level of the namespace. fsGroup makes a new volume writable for it.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
  failurePolicy:
    # The first snapshot (about 0.5 GB) took under 3 minutes. A stuck restore
    # fails here, and KopiurRestoreFailed fires 10 minutes after.
    activeDeadlineSeconds: 2700
