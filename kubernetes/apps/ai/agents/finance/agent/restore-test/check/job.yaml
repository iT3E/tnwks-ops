---
# LISTED for one run: kubernetes/apps/ai/agents/finance/kustomization.yaml
# lists ./agent/restore-test/ks.yaml, for the restore test of the first nightly
# snapshot with the state (the owner's go of 2026-11-17). The cleanup is two
# changes, not one revert. First the line out of that list, with no other
# edit: Flux deletes the Restore, the scratch volume and the check Job.
# Then, when they are gone, the name of the snapshot back to its
# placeholder (agent-state-SET-ME, in restore/restore.yaml), and this
# directory is a template again. Not both in one change: Flux applies the
# placeholder to the Restore while it prunes, and the deletion then waits
# for the health check (60 minutes).
# Reads the restored scratch volume, read-only, and logs only safe facts:
# counts and sizes, the names, owners and modes of the top-level directories,
# for each path the check user cannot read its type, owner, mode and
# top-level directory (no name below the top level), and the checks of the
# newest start archive and the newest daily archive (checksum, gzip, member
# count). It never prints the content of a file, a config value or the name
# of an archive member: the volume holds credentials.
# Loki: {namespace="agents-finance", app="agent-restore-check"}.
#
# It mounts the volume at the path of the agent pod (/home/node/data), so an
# absolute link resolves as it does for the agent, runs with the pod identity
# of the agent (uid, gid and fsGroup 1000), and reports what it cannot read
# instead of stopping (the lesson of the pilot's first run on 2026-11-16).
apiVersion: batch/v1
kind: Job
metadata:
  # One name for each run: a Job cannot run again.
  name: agent-restore-check
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-restore-check
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      # No nodeSelector: the PV of the scratch volume has the node affinity
      # of the node the restore mover bound it on, and the scheduler follows
      # it. No network: default-deny (../../namespace.yaml) applies.
      # The pod identity of agent/app/deployment.yaml.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: check
          # The image of the agent, the same release and digest as
          # agent/app/deployment.yaml: the tools the archive scripts use.
          # Renovate reads every YAML file under kubernetes/, listed or not,
          # so one update PR moves both lines together.
          image: ghcr.io/it3e/tnwks-agent-image:0.4.1@sha256:d1c0247dbdfb5cb9e9f7e5dfe1bf6cd335032e02acf022e132879cd1695b17dd
          command: ["sh", "-c"]
          env:
            # The copy of the cutover, in archives/: the value of ARCHIVE in
            # agent/app/restore-job.yaml.
            - name: COPY
              value: start/openclaw-state-2026.9.6-20261117T073712Z.tar.gz
          args:
            - |
              set -eu
              D=/home/node/data
              bad=""
              fail() { echo "restore-check result=failed reason=$1"; exit 1; }
              echo "restore-check id=$(id -u):$(id -g) groups=$(id -G | tr ' ' ',')"
              find "$D" -maxdepth 0 -printf 'restore-check root type=%y owner=%U:%G mode=%m\n'
              find "$D" -mindepth 1 -maxdepth 1 -type d -printf 'restore-check top type=d owner=%U:%G mode=%m name=%f\n' | LC_ALL=C sort
              find "$D" -mindepth 1 -maxdepth 1 ! -type d -printf 'restore-check top type=%y owner=%U:%G mode=%m\n' | LC_ALL=C sort
              test -d "$D/state" || fail no-state
              test -d "$D/archives" || fail no-archives
              second=$(cd "$D" && find . -mindepth 2 -maxdepth 2 -type d 2>/dev/null | wc -l)
              files=$(find "$D" -type f 2>/dev/null | wc -l)
              bytes=$(find "$D" -type f -printf '%s\n' 2>/dev/null | awk '{ s += $1 } END { printf "%d\n", s }')
              links=$(find "$D" -type l 2>/dev/null | wc -l)
              echo "restore-check second-level-directories=$second files=$files bytes=$bytes links=$links"

              # Each path that uid 1000 cannot read (find -readable follows a
              # link to its target): its type, the type of a link's target
              # (N: missing, L: loop), owner, mode and top-level directory.
              # Counted by that tuple; no name below the top level.
              find "$D" -mindepth 1 ! -readable -printf '%y %Y %U:%G %m %P\n' 2>/dev/null \
                | awk '{ split($5, p, "/"); print "type=" $1 " target=" $2 " owner=" $3 " mode=" $4 " top=" p[1] }' \
                | LC_ALL=C sort | uniq -c | sed 's/^ */restore-check unreadable count=/'
              unreadable=$(find "$D" -mindepth 1 ! -readable 2>/dev/null | wc -l)
              # A link whose target is missing is not data the restore lost:
              # the snapshot keeps the link as a link. Anything else that
              # uid 1000 cannot read, the agent could not read either.
              dangling=$(find "$D" -mindepth 1 -type l ! -readable 2>/dev/null | wc -l)
              blocked=$((unreadable - dangling))
              echo "restore-check unreadable=$unreadable dangling-links=$dangling blocked=$blocked"
              [ "$files" -gt 0 ] || bad="$bad empty"
              [ "$blocked" -eq 0 ] || bad="$bad unreadable"
              # The notes vault that the owner seeded (docs/apps/agent-platform.md,
              # "The finance agent"): the snapshot holds it with the state, and
              # the agent reads its notes as uid 1000 (the unreadable count
              # above covers it). Counts only, no name. No tool of the agent
              # writes the vault, so vault-notes must equal the vault-notes=
              # of the line of the restore Job of step 4. That count is not
              # in git (a public repository): the reader of this line
              # compares the two.
              if [ -d "$D/vault" ]; then
                notes=$(find "$D/vault" -type f -name '*.md' 2>/dev/null | wc -l)
                echo "restore-check vault-notes=$notes"
                [ "$notes" -gt 0 ] || bad="$bad empty-vault"
              else
                bad="$bad no-vault"
              fi

              # The workspace against the copy of the cutover: the start
              # archive that the restore Job of step 4 put in place (its
              # ARCHIVE, agent/app/restore-job.yaml). The copy held the
              # workspace only, so its plain files are the files= of the
              # line of that Job. The agent writes its workspace, so the
              # count of the snapshot is most often higher; and it may
              # delete a file it no longer needs, so a file of the copy that
              # is not there is a count to read, not a failure:
              # copy-files-missing (no name).
              C="$D/archives/$COPY"
              workspace=$(find "$D/state/workspace" -type f 2>/dev/null | wc -l)
              if [ ! -f "$C" ]; then
                bad="$bad no-copy"
              elif ! tar -tzf "$C" > /dev/null 2>&1; then
                bad="$bad copy-tar"
              else
                copy=$(tar -tvzf "$C" 2>/dev/null | grep -c '^-' || true)
                missing=$(tar -tzf "$C" 2>/dev/null | grep -v '/$' | while IFS= read -r f; do
                  [ -f "$D/state/$f" ] || echo x
                done | wc -l)
                echo "restore-check workspace-files=$workspace copy-files=$copy copy-files-missing=$missing"
              fi

              # The newest start archive by the time in its name
              # (openclaw-state-<release>-<time>.tar.gz).
              S="$D/archives/start"
              start=$(cd "$S" 2>/dev/null && ls -1 2>/dev/null | grep -E '^openclaw-state-.*-[0-9]{8}T[0-9]{6}Z\.tar\.gz$' \
                | sed -E 's/^(.*-([0-9]{8}T[0-9]{6}Z)\.tar\.gz)$/\2 \1/' | LC_ALL=C sort | tail -n 1 | cut -d' ' -f2 || true)
              if [ -z "$start" ]; then
                bad="$bad no-start-archive"
              elif ! (cd "$S" && sha256sum -c "$start.sha256" > /dev/null 2>&1); then
                bad="$bad start-checksum"
              elif ! tar -tzf "$S/$start" > /dev/null 2>&1; then
                bad="$bad start-tar"
              else
                members=$(tar -tzf "$S/$start" 2>/dev/null | wc -l)
                echo "restore-check start=$start mtime=$(date -u -r "$S/$start" +%Y-%m-%dT%H:%MZ) members=$members checksum=ok"
              fi

              # The newest daily archive (openclaw-backup-<day>.tar.gz).
              A="$D/archives/daily"
              daily=$(cd "$A" 2>/dev/null && ls -1 2>/dev/null | grep -E '^openclaw-backup-[0-9]{4}-[0-9]{2}-[0-9]{2}\.tar\.gz$' \
                | LC_ALL=C sort | tail -n 1 || true)
              if [ -z "$daily" ]; then
                bad="$bad no-daily-archive"
              elif ! gzip -t "$A/$daily" > /dev/null 2>&1; then
                bad="$bad daily-gzip"
              elif ! tar -tzf "$A/$daily" > /dev/null 2>&1; then
                bad="$bad daily-tar"
              else
                members=$(tar -tzf "$A/$daily" 2>/dev/null | wc -l)
                echo "restore-check daily=$daily mtime=$(date -u -r "$A/$daily" +%Y-%m-%dT%H:%MZ) members=$members gzip=ok"
              fi

              if [ -n "$bad" ]; then
                echo "restore-check result=failed reason=$(echo $bad | tr ' ' ',')"
                exit 1
              fi
              echo "restore-check result=ok"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            # The path of the agent pod, so an absolute link inside the state
            # resolves as it does for the agent.
            - name: restored
              mountPath: /home/node/data
              readOnly: true
      volumes:
        - name: restored
          persistentVolumeClaim:
            claimName: agent-state-restore-test
            readOnly: true
