---
# The state volume of the finance agent, with two directories: `state` (the
# state of the product, with the workspace in it) and `archives` (the
# archives of the state, outside the workspace, so no sandbox gets them).
# Size: the state x (1 + 7 daily archives + the starts in 14 days); with two
# starts in 14 days, 10 GiB holds a state of 1 GiB. The pilot measures it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-state
  labels:
    app.kubernetes.io/name: agent
  annotations:
    # Flux never deletes this volume, also when a pull request takes this file
    # out (a revert of step 1 of the cutover): the state and its archives
    # stay. To remove it for real, a pull request takes this annotation out
    # first, and the next one takes the file out; Flux then prunes it, and
    # the reclaim policy Delete wipes it on the node. The namespaces of the
    # repository use the same annotation.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ${STORAGE_CLASS_DEFAULT}
  resources:
    requests:
      storage: 10Gi
