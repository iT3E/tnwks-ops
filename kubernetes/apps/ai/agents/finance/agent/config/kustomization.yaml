---
# The config of the finance agent and the scripts of its pod. Flux applies
# this directory with no ${VAR} substitution (../ks.yaml): each ${NAME} in
# openclaw.json is for the product, which reads it from an env var of the pod
# when it loads the config. The scripts are the files of the pilot, so a fix
# there reaches both trust domains. The names stay fixed (no hash), and
# Reloader starts the pod again when one changes (app/deployment.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: agent-config
    files:
      - openclaw.json=./openclaw.json
  - name: agent-scripts
    files:
      - archive-state.sh=../../../pilot/agent/config/scripts/archive-state.sh
      - daily-backup.sh=../../../pilot/agent/config/scripts/daily-backup.sh
      - memory-index.sh=../../../pilot/agent/config/scripts/memory-index.sh
      - sandbox-start.sh=../../../pilot/agent/config/scripts/sandbox-start.sh
