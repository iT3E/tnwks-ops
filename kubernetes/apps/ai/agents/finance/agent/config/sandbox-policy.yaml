---
# The sandbox policy of the finance agent (the policy of the openshell entry
# of openclaw.json; the sandbox gateway uses it at the create of each
# sandbox). The probe of the finance app uses this same file
# (../../checks/app/firefly-probe.yaml).
#
# The default file rules of OpenShell, and one network rule: the proxy of the
# finance app (../../firefly-mcp/app/proxy.yaml), on its read port 8081, over
# plain HTTP in the cluster, for Python only. The proxy lets through reads
# only on that port, and the network policy lets a sandbox reach no other
# port of it. The sandbox holds no credential for it: the proxy
# sets the token, and it lets through only the calls of its allow list. This
# rule is a second wall in front of it: GET under /api/v1 only. The scripts of
# the agent only read; its writes go through the MCP server, whose update of
# a transaction sends each split of it (an update that leaves a split out
# deletes that split in the app). Writes from a sandbox are a question for
# the owner (docs/apps/agent-platform.md, "The finance app"). Nothing else
# leaves the sandbox.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: best_effort
network_policies:
  finance_app:
    name: finance_app
    endpoints:
      - host: firefly-proxy.agents-finance.svc.cluster.local
        port: 8081
        protocol: rest
        tls: ""
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/api/v1/**"}
    binaries:
      - {path: /usr/local/bin/python3.13}
      - {path: /usr/local/bin/python3}
