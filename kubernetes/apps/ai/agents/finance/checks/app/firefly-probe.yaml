---
# The probe of the finance app (scripts/platform_checks.py firefly-probe, in
# kubernetes/apps/ai/agents/checks/app). Both clients of the proxy of the
# app: the MCP server, called as the agent calls it, and a sandbox made with
# the sandbox policy and the image of the agent's sandboxes. An allowed read
# reaches the app (a 401 with the placeholder token, an answer with the real
# one); each delete and each call off the allow list is refused. It holds no
# token and changes no data. A failed run alerts as the other checks do
# (AgentPlatformCronJobFailed, AgentPlatformCheckStale).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: platform-check-firefly-probe
  labels: &labels
    app.kubernetes.io/name: platform-checks
    app.kubernetes.io/component: firefly-probe
spec:
  schedule: "17 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # The worst case, in seconds: the MCP calls 180 (six, 30 each), then
      # as the sandbox probe less its pod reads (1350). That is 1530.
      activeDeadlineSeconds: 1650
      template:
        metadata:
          labels: *labels
        spec:
          restartPolicy: Never
          serviceAccountName: platform-checks
          # Removes a Sandbox record that a run left (rbac.yaml, and the
          # patch of kustomization.yaml).
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # The same as in platform-check-probe.
            - name: fetch-cli
              image: &python docker.io/library/python:3.15.2-slim-trixie@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
              command:
                - python3
                - -c
                - |
                  import hashlib, io, os, tarfile, urllib.request
                  url = ("https://github.com/NVIDIA/OpenShell/releases/download/v%s/"
                         "openshell-x86_64-unknown-linux-musl.tar.gz" % os.environ["CLI_VERSION"])
                  data = urllib.request.urlopen(url, timeout=120).read()
                  got = hashlib.sha256(data).hexdigest()
                  if got != os.environ["CLI_SHA256"]:
                      raise SystemExit("openshell CLI checksum mismatch: " + got)
                  with tarfile.open(fileobj=io.BytesIO(data)) as t:
                      member = t.getmember("openshell")
                      with open("/tools/openshell", "wb") as f:
                          f.write(t.extractfile(member).read())
                  os.chmod("/tools/openshell", 0o755)
                  print("openshell CLI", os.environ["CLI_VERSION"], "ok")
              env:
                - name: CLI_VERSION
                  value: "0.1.7"
                - name: CLI_SHA256
                  value: "5c1adfcae797eac9b2e8b9280c66c1f75e4e84d9e31ce6938c5b994314ef6098"
              securityContext: &containerSecurity
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources: &resources
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: tools
                  mountPath: /tools
          containers:
            - name: check
              image: *python
              command:
                - python3
                - /scripts/platform_checks.py
                - firefly-probe
              env:
                - name: OWN_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: TRUST_DOMAIN_NAMESPACES
                  value: agents-main agents-finance agents-workflows agents-pilot
                - name: HOME
                  value: /tmp/home
                - name: XDG_CONFIG_HOME
                  value: /tmp/home/.config
                - name: XDG_STATE_HOME
                  value: /tmp/home/.local/state
                - name: OPENSHELL_GATEWAY
                  value: own
                - name: NO_COLOR
                  value: "1"
                # Its own sandbox name, so that it never meets the sandbox
                # probe's.
                - name: PROBE_SANDBOX
                  value: firefly-probe
                # The image of the agent's sandboxes (the openshell entry of
                # ../../agent/config/openclaw.json): the binaries of the
                # sandbox policy are its python3.
                - name: PROBE_IMAGE
                  value: docker.io/library/python:3.13-slim@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
                - name: SANDBOX_POLICY
                  value: /policy/sandbox-policy.yaml
                - name: MCP_URL
                  value: http://firefly-mcp.agents-finance.svc.cluster.local:3000/mcp
                - name: APP_PROXY
                  value: http://firefly-proxy.agents-finance.svc.cluster.local:8080
              securityContext: *containerSecurity
              resources: *resources
              volumeMounts:
                - name: tools
                  mountPath: /tools
                  readOnly: true
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: policy
                  mountPath: /policy
                  readOnly: true
                - name: client-tls
                  mountPath: /client-tls
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tools
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: scripts
              configMap:
                name: platform-checks
            - name: policy
              configMap:
                name: firefly-probe-policy
            # The client certificate of this trust domain's sandbox gateway
            # (cert-manager), the one its agent pod uses.
            - name: client-tls
              secret:
                secretName: openshell-client-tls
---
# The checks of this namespace may call the MCP server of the finance app
# (../../firefly-mcp/app/networkpolicy.yaml lets them in). The proxy of the
# app they reach only from the probe's sandbox, through its supervisor.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: platform-checks-firefly
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: platform-checks
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agents-finance
            app.kubernetes.io/name: firefly-mcp
            # Both WSL clusters are one Cilium Cluster Mesh: name this cluster.
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
