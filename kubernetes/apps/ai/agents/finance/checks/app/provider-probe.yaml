---
# The provider probe of the finance app (docs/apps/agent-platform.md, "The
# finance agent"): once a day, a sandbox with a provider of the profile
# finance-firefly and a dummy credential shows that an allowed read reaches
# the app, and that the proxy of the sandbox refuses a write, a read outside
# the rule, a path that leaves the rule with "..", the address of the
# Service in place of its name, and the Service without the proxy. No real
# credential is used: it runs before the token of the agent exists, and
# after. Each result is a JSON line (scripts/platform_checks.py
# provider-probe); a failed one fails the Job, which fires
# AgentPlatformCronJobFailed.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: platform-check-provider-probe
  labels: &labels
    app.kubernetes.io/name: platform-checks
    app.kubernetes.io/component: provider-probe
spec:
  schedule: "17 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # The sandbox probe's 1380 (cronjobs.yaml), and 240 for the profile
      # and the provider: two deletes at the start and two at the end (60
      # each). The import, the create and the last read are short.
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels: *labels
        spec:
          restartPolicy: Never
          serviceAccountName: platform-checks
          # Reads the Sandbox record of the probe (rbac.yaml).
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # The same as in platform-check-probe (cronjobs.yaml).
            - name: fetch-cli
              image: &python docker.io/library/python:3.15.2-slim-trixie@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
              command:
                - python3
                - -c
                - |
                  import hashlib, io, os, tarfile, urllib.request
                  url = ("https://github.com/NVIDIA/OpenShell/releases/download/v%s/"
                         "openshell-x86_64-unknown-linux-musl.tar.gz" % os.environ["CLI_VERSION"])
                  data = urllib.request.urlopen(url, timeout=120).read()
                  got = hashlib.sha256(data).hexdigest()
                  if got != os.environ["CLI_SHA256"]:
                      raise SystemExit("openshell CLI checksum mismatch: " + got)
                  with tarfile.open(fileobj=io.BytesIO(data)) as t:
                      member = t.getmember("openshell")
                      with open("/tools/openshell", "wb") as f:
                          f.write(t.extractfile(member).read())
                  os.chmod("/tools/openshell", 0o755)
                  print("openshell CLI", os.environ["CLI_VERSION"], "ok")
              env:
                - name: CLI_VERSION
                  value: "0.1.7"
                - name: CLI_SHA256
                  value: "5c1adfcae797eac9b2e8b9280c66c1f75e4e84d9e31ce6938c5b994314ef6098"
              securityContext: &containerSecurity
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources: &resources
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: tools
                  mountPath: /tools
          containers:
            - name: check
              image: *python
              command:
                - python3
                - /scripts/platform_checks.py
                - provider-probe
              env:
                - name: OWN_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: TRUST_DOMAIN_NAMESPACES
                  value: agents-main agents-finance agents-workflows agents-pilot
                - name: HOME
                  value: /tmp/home
                - name: XDG_CONFIG_HOME
                  value: /tmp/home/.config
                - name: XDG_STATE_HOME
                  value: /tmp/home/.local/state
                - name: OPENSHELL_GATEWAY
                  value: own
                - name: NO_COLOR
                  value: "1"
                # Its own sandbox name, so it never meets the sandbox probe.
                - name: PROBE_SANDBOX
                  value: provider-probe
                # The sandbox image of the finance agent (the openshell entry
                # of agent/config/openclaw.json): the binaries of the profile
                # are its Python.
                - name: PROBE_IMAGE
                  value: docker.io/library/python:3.13-slim@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
                - name: PROVIDER_PROFILE
                  value: /profiles/finance-firefly.yaml
                - name: PROBE_PROVIDER
                  value: provider-probe
                # The address of the app as the agent uses it (the endpoint of
                # the profile).
                - name: APP_URL
                  value: http://firefly.production.svc.cluster.local:8080
              securityContext: *containerSecurity
              resources: *resources
              volumeMounts:
                - name: tools
                  mountPath: /tools
                  readOnly: true
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: profiles
                  mountPath: /profiles
                  readOnly: true
                - name: client-tls
                  mountPath: /client-tls
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tools
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: scripts
              configMap:
                name: platform-checks
            - name: profiles
              configMap:
                name: provider-probe-profiles
            # The client certificate of this trust domain's sandbox gateway.
            - name: client-tls
              secret:
                secretName: openshell-client-tls
