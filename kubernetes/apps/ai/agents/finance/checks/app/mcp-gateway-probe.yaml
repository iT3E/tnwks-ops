---
# The gateway probe of finance (scripts/platform_checks.py mcp-gateway, in
# kubernetes/apps/ai/agents/checks/app; docs/apps/mcp-gateway.md, "The
# probe"). It calls the route of finance at the MCP gateway, as the agent
# does, with two keys of its own and none of the agent's:
# - no key, and a random key that is not in the config: a 401 each;
# - the probe key (client finance-probe): it lists exactly the tools of the
#   rule of finance (the list in the gateway's config, mounted here), its
#   read (get_about) reaches the app through the MCP server and the proxy (a
#   401 of the app with the placeholder token, an answer with the real one),
#   and a delete, a rule trigger and a write are refused at the gateway, so
#   nothing reaches the MCP server, also with headers that name the client
#   finance (the client is the one of the key);
# - the key with no tool (client no-tools): it lists nothing and its read
#   is refused;
# - a straight connection to the MCP server fails: only the gateway may
#   reach it (../../firefly-mcp/app/networkpolicy.yaml);
# - the vault route of finance with the same checks, and the vault of main:
#   the probe key gets a 401 on its route, and a straight connection to its
#   server fails (R6);
# - a straight connection to each read server of main (cluster, Flux,
#   Terraform, code host, and the copies of the cluster and Flux servers at
#   site 2) times out: this pod is a pod of another namespace, and the
#   policy of each server names the gateway only. No key is used on a read
#   route.
# Until the owner's values step the two keys are placeholders: the checks
# that need them print "skipped: the key is pending" and pass, and the
# values step ends that (docs/apps/agent-platform-runbook.md,
# AgentPlatformCronJobFailed). The checks with no key and with an unknown
# key, and the straight connections, always run. It changes no
# data. A failed run alerts as the other checks do
# (AgentPlatformCronJobFailed, AgentPlatformCheckStale).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: platform-check-mcp-gateway-probe
  labels: &labels
    app.kubernetes.io/name: platform-checks
    app.kubernetes.io/component: mcp-gateway-probe
spec:
  schedule: "37 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # A finished Job goes after 26 hours, also a failed one. That is a day
      # and room for the next run to end, so the alert and the AI board see
      # a failure until a newer run ends, and KubeJobFailed then clears by
      # itself (docs/apps/agent-platform.md, "A failed Job").
      ttlSecondsAfterFinished: 93600
      # The worst case, in seconds: nine straight connections of 5 each
      # (45), then eighteen MCP requests of 30 each (540). That is 585. The
      # deadline only stops a Job that hangs; 900 leaves room for more tries.
      # The probe of main starts 16 minutes later, so the two never meet.
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels: *labels
        spec:
          restartPolicy: Never
          serviceAccountName: platform-checks
          # It calls no API of the cluster.
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              image: docker.io/library/python:3.15.2-slim-trixie@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
              command: ["python3", "/scripts/platform_checks.py", "mcp-gateway"]
              env:
                - name: OWN_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: TRUST_DOMAIN_NAMESPACES
                  value: agents-finance
                # The route of finance, as the agent calls it (the mcp entry
                # of ../../agent/config/openclaw.json).
                - name: MCP_GATEWAY_URL
                  value: http://mcp-gateway.ai.svc.cluster.local:3000/finance/mcp
                # The MCP server behind the route (the target of the route
                # in the gateway's config).
                - name: MCP_SERVER
                  value: firefly-mcp.agents-finance.svc.cluster.local:3000
                - name: GATEWAY_CONFIG
                  value: /gateway/config.yaml
                # The vault route of finance and the vault server behind it
                # (../../vault-server).
                - name: VAULT_GATEWAY_URL
                  value: http://mcp-gateway.ai.svc.cluster.local:3000/finance-vault/mcp
                - name: VAULT_SERVER
                  value: vault-server.agents-finance.svc.cluster.local:8080
                # The vault of the other trust domain: the probe key gets a
                # 401 on its route, and its server is out of reach (R6).
                - name: OTHER_VAULT_GATEWAY_URL
                  value: http://mcp-gateway.ai.svc.cluster.local:3000/main-vault/mcp
                - name: OTHER_VAULT_SERVER
                  value: vault-server.agents-main.svc.cluster.local:8080
                # The read servers of main, straight from another namespace:
                # their own policies must drop that. Only a time out passes;
                # a refusal (no ready backend), an answer and a name that
                # does not resolve fail.
                - name: GATEWAY_ONLY_SERVERS
                  value: cluster-mcp.agents-main.svc.cluster.local:8080,flux-mcp.agents-main.svc.cluster.local:8080,terraform-mcp.agents-main.svc.cluster.local:8080,github-mcp.agents-main.svc.cluster.local:8080,playwright-mcp.ai.svc.cluster.local:8000,host-mcp.agents-main.svc.cluster.local:8080,cluster-mcp-site2.agents-main.svc.cluster.local:8080,flux-mcp-site2.agents-main.svc.cluster.local:8080
              # PROBE_KEY and NO_TOOLS_KEY.
              envFrom:
                - secretRef:
                    name: mcp-gateway-probe-secret
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: gateway
                  mountPath: /gateway
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: platform-checks
            # The config of the gateway, the same file (kustomization.yaml).
            - name: gateway
              configMap:
                name: mcp-gateway-probe-config
---
# The gateway probe may call the MCP gateway, and may try the MCP server
# straight: the policy of the MCP server, not this one, must stop that.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: platform-check-mcp-gateway-probe
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: platform-checks
      app.kubernetes.io/component: mcp-gateway-probe
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: mcp-gateway
            # Both WSL clusters are one Cilium Cluster Mesh: name this cluster.
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
        - matchLabels:
            io.kubernetes.pod.namespace: agents-finance
            app.kubernetes.io/name: firefly-mcp
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # The vault servers of finance and of main, and the read servers of
    # main, straight: their own policies must stop that.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agents-finance
            app.kubernetes.io/name: vault-server
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
        - matchLabels:
            io.kubernetes.pod.namespace: agents-main
            app.kubernetes.io/name: vault-server
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
        - matchLabels:
            io.kubernetes.pod.namespace: agents-main
            app.kubernetes.io/name: cluster-mcp
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
        - matchLabels:
            io.kubernetes.pod.namespace: agents-main
            app.kubernetes.io/name: flux-mcp
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
        - matchLabels:
            io.kubernetes.pod.namespace: agents-main
            app.kubernetes.io/name: terraform-mcp
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
        - matchLabels:
            io.kubernetes.pod.namespace: agents-main
            app.kubernetes.io/name: github-mcp
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
        # The host server of main (../../host-mcp, or
        # ../../../main/host-mcp): its proxy port.
        - matchLabels:
            io.kubernetes.pod.namespace: agents-main
            app.kubernetes.io/name: host-mcp
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
        # The copies of the cluster and Flux servers of main at site 2
        # (agents/main/site2), over Cluster Mesh: their own policy must drop
        # this try, as the policy of each server here does.
        - matchLabels:
            io.kubernetes.pod.namespace: agents-main
            app.kubernetes.io/name: cluster-mcp-site2
            io.cilium.k8s.policy.cluster: ${PEER_CLUSTER_NAME}
        - matchLabels:
            io.kubernetes.pod.namespace: agents-main
            app.kubernetes.io/name: flux-mcp-site2
            io.cilium.k8s.policy.cluster: ${PEER_CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The browser of main, straight: its own policy must stop that.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: playwright-mcp
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
