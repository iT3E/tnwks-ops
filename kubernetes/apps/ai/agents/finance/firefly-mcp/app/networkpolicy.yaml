---
# The proxy of the finance app. Two ports (proxy/default.conf.template): 8080
# lets through the reads and the writes of the allow list, 8081 the reads
# only. In: the MCP server, on 8080 only; the supervisors of the sandboxes of
# this trust domain, on 8081 only; and the probe of the app, on both. A
# sandbox has two pods: the workload pod has no egress at all, and its
# supervisor opens each connection that the sandbox policy approves, from its
# own pod. So the supervisor is the client here, and only for a sandbox whose
# policy names the proxy (the agent's, and the probe's). The probe
# (../../checks/app/firefly-probe.yaml) sends the calls that the proxy must
# refuse straight to it. Out: the app, and DNS for the name of the app only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: firefly-proxy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: firefly-proxy
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agents-finance
            app.kubernetes.io/name: firefly-mcp
            # Both WSL clusters are one Cilium Cluster Mesh: name this cluster.
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agents-finance
            openshell.ai/boundary-role: supervisor
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agents-finance
            app.kubernetes.io/name: platform-checks
            app.kubernetes.io/component: firefly-probe
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8081"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: production
            app.kubernetes.io/name: firefly
            app.kubernetes.io/instance: firefly
            app.kubernetes.io/component: firefly
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Its own DNS rule (the pod is out of the namespace's allow-dns): the name
    # of the app's Service, and no other name.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: firefly.production.svc.cluster.local
---
# The MCP server of the finance app. In: the agent pod (its gateway is the MCP
# client) and the probe of the app (it calls the server as the agent does).
# Out: the proxy only, and DNS for the name of the proxy only. DNS would be a
# way out too, so this pod resolves no other name.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: firefly-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: firefly-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agents-finance
            app.kubernetes.io/name: agent
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
        - matchLabels:
            io.kubernetes.pod.namespace: agents-finance
            app.kubernetes.io/name: platform-checks
            app.kubernetes.io/component: firefly-probe
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agents-finance
            app.kubernetes.io/name: firefly-proxy
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: firefly-proxy.agents-finance.svc.cluster.local
