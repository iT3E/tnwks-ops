---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The finance app as a tool of the finance agent (docs/apps/agent-platform.md,
# "The finance app"): the proxy that holds the token of the agent at the app,
# and the MCP server of the app, which holds no token.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agents-finance-firefly-mcp
  namespace: flux-system
spec:
  targetNamespace: agents-finance
  path: ./kubernetes/apps/ai/agents/finance/firefly-mcp/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
