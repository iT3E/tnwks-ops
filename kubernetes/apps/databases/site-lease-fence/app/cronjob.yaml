---
# Database fence (docs/wsl/multi-site.md, "Fencing"; the script says what it
# does). Every minute on both WSL sites. A newly fenced Cluster fails the Job,
# so KubeJobFailed fires.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: site-lease-fence
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 50
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      activeDeadlineSeconds: 50
      template:
        metadata:
          labels:
            app.kubernetes.io/name: site-lease-fence
        spec:
          serviceAccountName: site-lease-fence
          restartPolicy: Never
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: fence
              image: docker.io/library/python:3.15.2-slim-trixie@sha256:8c13a3f37a6a5b71498228e902c4b9f51c1f7900d49fabf71f9a650c6120e0d0
              command: ["python3", "/app/fence.py"]
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: SITE
                  value: "${CLUSTER_NAME}"
                # The apps with a site lease (dns-sites.tf, site_leases) and a
                # standby, and their Postgres clusters.
                - name: APPS
                  value: >-
                    [{"app": "mealie", "cluster": "mealie-pg"},
                     {"app": "transcriber", "cluster": "transcriber-pg"},
                     {"app": "firefly", "cluster": "firefly-pg"},
                     {"app": "firefly", "cluster": "finance-sync-pg"}]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 5m
                  memory: 24Mi
                limits:
                  memory: 96Mi
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: site-lease-fence-script
