---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg-app
  namespace: flux-system
spec:
  path: ./kubernetes/apps/databases/cloudnative-pg/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cloudnative-pg
      namespace: databases
  interval: 30m
  retryInterval: 1m
  timeout: 3m
---
# Barman Cloud plugin (WAL archive + base backups to S3). The Cluster
# references it, so the Cluster waits for it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg-plugin-barman-cloud
  namespace: flux-system
spec:
  dependsOn:
    - name: cloudnative-pg-app
    - name: cert-manager
  path: ./kubernetes/apps/databases/cloudnative-pg/plugin-barman-cloud
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: plugin-barman-cloud
      namespace: databases
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
# The shared postgres Cluster (3 instances on MS-01 via cluster-settings).
# Fresh-init only. Retired on homelab-wsl and never deployed on
# homelab-wsl-02 (their overlays delete this Kustomization): apps there have
# their own clusters (kubernetes/components/cnpg-cluster).
# Backups: barman-cloud plugin to the AWS S3 bucket, both clusters
# (cluster/objectstore.yaml, cluster/scheduled-backup.yaml).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg-cluster
  namespace: flux-system
spec:
  dependsOn:
    - name: cloudnative-pg-app
    - name: cloudnative-pg-plugin-barman-cloud
    - name: aws-backup-credentials
  path: ./kubernetes/apps/databases/cloudnative-pg/cluster
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 3m
---
# PrometheusRule needs the monitoring.coreos.com CRD which
# kube-prometheus-stack provides; lives in its own Kustomization with
# the right dependency. The rules match every CNPG cluster (one per app), so
# they wait for the operator, not the shared cluster (retired on homelab-wsl).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg-cluster-prometheusrules
  namespace: flux-system
spec:
  dependsOn:
    - name: cloudnative-pg-app
    - name: kube-prometheus-stack
  path: ./kubernetes/apps/databases/cloudnative-pg/cluster-prometheusrules
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 3m
