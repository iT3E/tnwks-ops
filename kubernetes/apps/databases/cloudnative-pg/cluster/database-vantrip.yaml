---
# Declarative database creation for the Van Trip packing-api (production ns).
#
# Sibling of database.yaml (litellm) / database-plausible.yaml. The Database
# CRD reconciles continuously, so adding a database to an already-running
# cluster is pure GitOps. `ensure: present` is idempotent.
# Owned by its own role (managed.roles in cluster.yaml); the app logs in with
# that role's password from its own namespace.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: vantrip
  namespace: databases
spec:
  cluster:
    name: postgres
  name: vantrip
  # Own role since 2026-11 (was the shared `app`).
  owner: packing_api
  ensure: present
  # Keep the database if this resource is ever removed — never let a manifest
  # deletion drop the packing list.
  databaseReclaimPolicy: retain
