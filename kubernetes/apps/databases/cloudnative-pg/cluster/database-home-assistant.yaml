---
# Declarative database creation for Home Assistant's recorder
# (home-assistant, home-automation ns).
#
# Sibling of database-raines.yaml. The Database CRD reconciles continuously,
# so adding a database to an already-running cluster is pure GitOps.
# `ensure: present` is idempotent. Home Assistant connects via the reflected
# `postgres-app` secret — owner `app` matches that credential.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: home-assistant
  namespace: databases
spec:
  cluster:
    name: postgres
  name: home_assistant
  owner: app
  ensure: present
  # Keep the database if this resource is ever removed — never let a manifest
  # deletion drop the recorder history.
  databaseReclaimPolicy: retain
