---
# Declarative database creation for Home Assistant's recorder
# (home-assistant, home-automation ns).
#
# Sibling of the other database-*.yaml files. The Database CRD reconciles continuously,
# so adding a database to an already-running cluster is pure GitOps.
# `ensure: present` is idempotent.
# Owned by its own role (managed.roles in cluster.yaml); the app logs in with
# that role's password from its own namespace.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: home-assistant
  namespace: databases
spec:
  cluster:
    name: postgres
  name: home_assistant
  # Own role since 2026-11 (was the shared `app`).
  owner: home_assistant
  ensure: present
  # Keep the database if this resource is ever removed — never let a manifest
  # deletion drop the recorder history.
  databaseReclaimPolicy: retain
