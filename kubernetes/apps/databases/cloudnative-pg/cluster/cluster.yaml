---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: databases
  annotations:
    kyverno.io/ignore: "true"
spec:
  instances: ${CNPG_INSTANCES}
  primaryUpdateStrategy: unsupervised
  storage:
    size: ${CNPG_INSTANCE_SIZE}
    # Postgres needs Linux permission semantics (initdb chmods
    # postgresql.conf). On WSL, ${STORAGE_CLASS_DEFAULT} (=local-path on
    # /mnt/e Windows DrvFs bind-mount) breaks initdb with EPERM, so we
    # use a separate SC variable that points at an ext4 path on the WSL
    # cluster and still maps to the cluster default elsewhere.
    storageClass: ${STORAGE_CLASS_DATABASE}
  superuserSecret:
    name: postgres-superuser
  # One login role per app, each owning its own database. The standard for
  # every app: add its role here, its password in secret-<role>-role.sops.yaml,
  # and a copy of the login in a Secret in the app's own namespace. Changing
  # this list doesn't restart the instances.
  managed:
    roles:
      # `app` is cnpg's bootstrap owner. Every app used to share it; since
      # 2026-11 each app has its own role and `app` owns nothing (the `app`
      # database belongs to `mealie`). It is kept, with login off, rather than
      # dropped: cnpg created it and expects it. Its old memberships were the
      # temporary bridge while ownership moved (reassign-owner/).
      # The `app` database (Mealie's until 2026-11, then its rollback copy) is
      # dropped by database-app.yaml (`ensure: absent`, 2026-11-05).
      - name: app
        ensure: present
        login: false
        passwordSecret:
          name: postgres-app
        inRoles: []
      - name: home_assistant
        ensure: present
        login: true
        passwordSecret:
          name: postgres-home-assistant
      - name: litellm
        ensure: present
        login: true
        passwordSecret:
          name: postgres-litellm
      - name: things_api
        ensure: present
        login: true
        passwordSecret:
          name: postgres-things-api
      - name: packing_api
        ensure: present
        login: true
        passwordSecret:
          name: postgres-packing-api
      - name: vaultwarden
        ensure: present
        login: true
        passwordSecret:
          name: postgres-vaultwarden
      - name: mealie
        ensure: present
        login: true
        passwordSecret:
          name: postgres-mealie
      - name: finance_sync
        ensure: present
        login: true
        passwordSecret:
          name: postgres-finance-sync
      - name: plausible
        ensure: present
        login: true
        passwordSecret:
          name: postgres-plausible
      - name: grafana
        ensure: present
        login: true
        passwordSecret:
          name: postgres-grafana
      - name: transcriber
        ensure: present
        login: true
        passwordSecret:
          name: postgres-transcriber
      # Firefly III owns the household ledger. Isolated from `app` on purpose:
      # `app` owns bitwarden, litellm, plausible, vantrip and things-api, and a
      # leaked `app` password should not also reach financial data.
      # Password in secret-firefly-role.sops.yaml.
      - name: firefly
        ensure: present
        login: true
        passwordSecret:
          name: postgres-firefly
  monitoring:
    enablePodMonitor: ${SERVICE_MONITOR_ENABLED}
  postgresql:
    parameters:
      # Compress full-page images in WAL. Home Assistant's recorder writes
      # ~1.5 GB of WAL a day, and every byte of it is archived over the home
      # uplink (docs/operations/backups.md).
      wal_compression: zstd
  # Continuous WAL archiving and base backups through the barman-cloud plugin
  # (objectstore.yaml, scheduled-backup.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: s3
        serverName: ${CLUSTER_NAME}
  # Reflection of the shared `postgres-app` Secret into app namespaces is
  # switched OFF: apps now carry their own login in their own namespace.
  # Explicit "false" rather than removing the annotations, so the change
  # reaches the Secret whether or not cnpg removes inherited annotations,
  # and reflector deletes the copies it made.
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "false"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "false"
  bootstrap:
    initdb:
      database: app
      owner: app
      # Extra databases owned by `app`. cnpg's `postInitApplicationSQL`
      # runs once on first cluster boot, creating any per-app databases
      # we want to keep schema-isolated.
      postInitApplicationSQL:
        - CREATE DATABASE bitwarden OWNER app;
        - CREATE DATABASE litellm OWNER app;
