---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: databases
resources:
  - ./cluster.yaml
  - ./database.yaml
  - ./database-plausible.yaml
  - ./database-vantrip.yaml
  - ./database-things-api.yaml
  - ./database-home-assistant.yaml
  - ./secret-grafana-role.sops.yaml
  - ./database-grafana.yaml
  - ./objectstore.yaml
  - ./scheduled-backup.yaml
  - ./secret-firefly-role.sops.yaml
  - ./database-firefly.yaml
# PrometheusRule lives in cluster-prometheusrules/ behind its own
# Kustomization that depends on kube-prometheus-stack so the CRD
# exists before apply.
# Backups: objectstore.yaml + scheduled-backup.yaml (barman-cloud plugin to
# AWS S3, both clusters). See docs/operations/backups.md.
labels:
  - pairs:
      app.kubernetes.io/name: cloudnative-pg-cluster
      app.kubernetes.io/instance: cloudnative-pg-cluster
      app.kubernetes.io/part-of: cloudnative-pg
