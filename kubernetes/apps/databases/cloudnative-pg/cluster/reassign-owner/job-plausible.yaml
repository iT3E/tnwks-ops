---
# One-time move of plausible's tables, sequences, functions and types from the
# shared `app` role to its own `plausible` role. Runs AS `app`, not superuser:
# an owner may hand objects to a role it is a member of, and cnpg makes `app` a
# member of `plausible` (managed.roles inRoles). Waits for that membership,
# then runs reassign-owner.sql. Idempotent: a rerun moves nothing. The
# database itself is handed over by the Database CR (owner: plausible).
#
# Plausible keeps connecting as `app` through the membership until its own
# PR switches it to `plausible`; then `plausible` leaves app's inRoles.
apiVersion: batch/v1
kind: Job
metadata:
  name: reassign-owner-plausible
  namespace: databases
  labels:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  annotations:
    # Jobs are immutable: let Flux recreate it if the spec ever changes.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reassign
          # Same image as the cluster, for psql.
          image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
          command:
            - bash
            - -ec
            - |
              until [ "$(psql -tAc "select pg_has_role('app','plausible','SET')")" = "t" ]; do
                echo "waiting for cnpg to make app a member of plausible"; sleep 10
              done
              psql -v ON_ERROR_STOP=1 -v old_role=app -v new_role=plausible -f /sql/reassign-owner.sql
          env:
            - name: PGHOST
              value: postgres-rw.databases.svc.cluster.local
            - name: PGDATABASE
              value: plausible
            - name: PGSSLMODE
              value: require
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: reassign-owner-sql
