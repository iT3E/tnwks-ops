---
# One-time move of database `bitwarden`'s objects from the shared `app` role to
# its own `vaultwarden` role. Runs as `app`, not superuser: an owner may hand objects to a role it
# belongs to, and cnpg makes `app` a member (managed.roles inRoles). Waits for
# that membership, then runs reassign-owner.sql; exits 0 at once if nothing is
# left owned by `app`. The database itself moves via the Database CR owner.
# The Plausible pilot proved this (#1615); its Job was removed once done.
apiVersion: batch/v1
kind: Job
metadata:
  name: reassign-owner-vaultwarden
  namespace: databases
  labels:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  annotations:
    # Jobs are immutable: let Flux recreate it if the spec ever changes.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reassign
          # Same image as the cluster, for psql.
          image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
          command:
            - bash
            - -ec
            - |
              # Done already (or rerun after a spec change, e.g. an image bump):
              # nothing left for `app` here, and its membership may be gone.
              owned=$(psql -tAc "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where c.relowner = 'app'::regrole and n.nspname not in ('pg_catalog','information_schema') and n.nspname not like 'pg_toast%'")
              if [ "$owned" = "0" ]; then echo "nothing in $PGDATABASE is owned by app: already migrated"; exit 0; fi
              until [ "$(psql -tAc "select pg_has_role('app','vaultwarden','SET')")" = "t" ]; do
                echo "waiting for cnpg to make app a member of vaultwarden"; sleep 10
              done
              psql -v ON_ERROR_STOP=1 -v old_role=app -v new_role=vaultwarden -f /sql/reassign-owner.sql
          env:
            - name: PGHOST
              value: postgres-rw.databases.svc.cluster.local
            - name: PGDATABASE
              value: bitwarden
            - name: PGSSLMODE
              value: require
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: reassign-owner-sql
