---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnative-pg-rules
  namespace: databases
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: cloudnative-pg.rules
      rules:
        - alert: LongRunningTransaction
          annotations:
            description: Pod {{ $labels.pod }} is taking more than 5 minutes (300 seconds) for a query.
            summary: A query is taking longer than 5 minutes.
          expr: |-
            cnpg_backends_max_tx_duration_seconds > 300
          for: 1m
          labels:
            severity: warning
        - alert: BackendsWaiting
          annotations:
            description: Pod {{ $labels.pod  }} has been waiting for longer than 5 minutes
            summary: If a backend is waiting for longer than 5 minutes
          expr: |-
            cnpg_backends_waiting_total > 300
          for: 1m
          labels:
            severity: warning
        - alert: PGDatabase
          annotations:
            description: Over 150,000,000 transactions from frozen xid on pod {{ $labels.pod  }}
            summary: Number of transactions from the frozen XID to the current one
          expr: |-
            cnpg_pg_database_xid_age > 150000000
          for: 1m
          labels:
            severity: warning
        - alert: PGReplication
          annotations:
            description: Standby is lagging behind by over 300 seconds (5 minutes)
            summary: The standby is lagging behind the primary
          expr: |-
            cnpg_pg_replication_lag > 300
          for: 1m
          labels:
            severity: warning
        - alert: LastFailedArchiveTime
          annotations:
            description: Archiving failed for {{ $labels.pod }}
            summary: Checks the last time archiving failed. Will be -1 when it has not failed.
          expr: |-
            delta(cnpg_pg_stat_archiver_last_failed_time[5m]) > 0
          for: 1m
          labels:
            severity: warning
        # Backups (docs/operations/backups.md): the daily 01:00 base backup
        # to S3 should never be more than a day and a bit old. Backups go
        # through the barman-cloud plugin, which reports its own metric; the
        # cnpg_collector_* backup metrics stay 0 (they are for the in-tree
        # barmanObjectStore).
        # Per CNPG cluster (the pod name minus its instance number): with one
        # cluster per app (kubernetes/components/cnpg-cluster) several share a
        # namespace, and a max per namespace let the freshest hide a stale one.
        - alert: PostgresBackupStale
          annotations:
            description: >-
              The newest base backup of {{ $labels.namespace }}/{{ $labels.cluster }}
              is older than 30 hours (or none exists). Check the ScheduledBackup
              {{ $labels.cluster }}-daily, the barman-cloud plugin and the STS
              credentials CronJob kopiur-system/aws-backup-credentials.
            summary: Postgres base backup is stale
          expr: |-
            (time() - max by (namespace, cluster) (
              label_replace(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp, "cluster", "$1", "pod", "(.+)-[0-9]+")
            )) > 30 * 3600
          for: 1h
          labels:
            severity: warning
        # Failing, not idle: an idle database writes no WAL, so "nothing
        # archived for an hour" fired on every quiet per-app cluster at night.
        # The archiver's last failure being newer than its last success means
        # the segment it's on keeps failing.
        - alert: PostgresWALArchivingStalled
          annotations:
            description: >-
              {{ $labels.pod }} has been failing to archive WAL to S3 for 15
              minutes (its last failure is newer than its last success).
              Point-in-time recovery is falling behind. Check the barman-cloud
              sidecar's log and the STS credentials (aws-backup-sts).
            summary: Postgres WAL archiving stalled
          expr: |-
            cnpg_pg_stat_archiver_last_failed_time > cnpg_pg_stat_archiver_last_archived_time
          for: 15m
          labels:
            severity: warning
        - alert: DatabaseDeadlockConflicts
          annotations:
            description: There are over 10 deadlock conflicts in {{ $labels.pod }}
            summary: Checks the number of database conflicts
          expr: |-
            cnpg_pg_stat_database_deadlocks > 10
          for: 1m
          labels:
            severity: warning
