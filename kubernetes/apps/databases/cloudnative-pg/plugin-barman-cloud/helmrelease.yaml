---
# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/helmrelease_v2.json
#
# CloudNativePG Barman Cloud plugin: WAL archiving and base backups to object
# storage for the `postgres` Cluster (docs/operations/backups.md). Must run in
# the operator's namespace. Uses cert-manager for its mTLS with the operator.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: databases
spec:
  interval: 30m
  chart:
    spec:
      chart: plugin-barman-cloud
      version: 0.8.1
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  maxHistory: 3
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    crds:
      create: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
