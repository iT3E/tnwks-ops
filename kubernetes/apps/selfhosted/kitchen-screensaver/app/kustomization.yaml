---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: selfhosted
resources:
  - ./secrets.sops.yaml
  - ./helmrelease.yaml
# The service is src/server.py (standard library only) and the page
# src/index.html, run on the stock Python image. tests/ stays out of the
# ConfigMap: run it locally (python3 -m unittest discover -s tests, here).
configMapGenerator:
  - name: kitchen-screensaver-src
    files:
      - ./src/server.py
      - ./src/index.html
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # Python and JavaScript source; keep Flux's ${VAR} substitution away from it.
    kustomize.toolkit.fluxcd.io/substitute: disabled
labels:
  - pairs:
      app.kubernetes.io/name: kitchen-screensaver
      app.kubernetes.io/instance: kitchen-screensaver
