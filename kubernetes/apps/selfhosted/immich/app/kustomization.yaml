---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: selfhosted
resources:
  - ./secrets.sops.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: immich-config
    files:
      - immich.yaml=./config/immich.yaml
generatorOptions:
  disableNameSuffixHash: true
labels:
  - pairs:
      app.kubernetes.io/name: immich
      app.kubernetes.io/instance: immich
