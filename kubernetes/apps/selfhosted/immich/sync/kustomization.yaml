---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: selfhosted
resources:
  - ./secrets.sops.yaml
  - ./cronjob.yaml
# tests/ stays out of the ConfigMap: run it locally (python3 -m unittest in
# sync/tests).
configMapGenerator:
  - name: immich-sync-scripts
    files:
      - ./scripts/sync.py
      - ./scripts/gphotos.py
      - ./scripts/LICENSE.album_slideshow
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # Python source; keep Flux's ${VAR} substitution away from it.
    kustomize.toolkit.fluxcd.io/substitute: disabled
labels:
  - pairs:
      app.kubernetes.io/name: immich-sync
      app.kubernetes.io/instance: immich-sync
