---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: selfhosted
resources:
  - ./secrets.sops.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: immichframe-config
    files:
      - Settings.yml=./config/Settings.yml
      - custom.css=./config/custom.css
generatorOptions:
  disableNameSuffixHash: true
labels:
  - pairs:
      app.kubernetes.io/name: immichframe
      app.kubernetes.io/instance: immichframe
