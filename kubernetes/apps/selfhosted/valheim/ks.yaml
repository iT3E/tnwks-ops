---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: valheim
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium-bgp
    - name: local-path-provisioner
  path: ./kubernetes/apps/selfhosted/valheim/app
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 25m
