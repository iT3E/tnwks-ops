---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valheim
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valheim
      app.kubernetes.io/instance: valheim
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: "${VALHEIM_CLIENT_CIDR}"
      ports:
        - port: 2456
          protocol: UDP
        - port: 2457
          protocol: UDP
