---
# MQTT on the shared VIP 10.10.95.11. Listed by the WSL clusters (shared-vip
# pool, BGP).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mosquitto-shared-vip
  namespace: flux-system
spec:
  path: ./kubernetes/apps/home-automation/mosquitto/shared-vip
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: mosquitto
    - name: cilium-bgp
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
