---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  # A standby at 0 (homelab-wsl-02) has a PVC that stays Pending until a pod
  # needs it, which Helm's wait would never see Ready.
  install:
    disableWait: ${MOSQUITTO_HELM_DISABLE_WAIT:=false}
    remediation:
      retries: 3
  upgrade:
    disableWait: ${MOSQUITTO_HELM_DISABLE_WAIT:=false}
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      mosquitto:
        # Which site runs the broker (homelab-wsl-02 keeps it at 0: a standby
        # for when HA moves; retained messages are status flags their
        # publishers resend, so nothing is copied).
        replicas: ${MOSQUITTO_REPLICAS:=1}
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-config:
            image:
              repository: docker.io/library/eclipse-mosquitto
              tag: 2.0.22@sha256:81a6193ae693942a3231cd3ac52875b02b7e3a19da671b2fb4b55cc874c5b279
            command: ["/bin/sh", "-c"]
            args: ["cp /tmp/secret/* /mosquitto/external_config/ && mosquitto_passwd -U /mosquitto/external_config/mosquitto_pwd"]
        containers:
          app:
            image:
              repository: docker.io/library/eclipse-mosquitto
              tag: 2.0.22@sha256:81a6193ae693942a3231cd3ac52875b02b7e3a19da671b2fb4b55cc874c5b279
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 16Mi
    service:
      app:
        controller: mosquitto
        type: LoadBalancer
        loadBalancerIP: "${MQTT_LB_ADDR}"
        # Global across the WSL sites (Cluster Mesh): either site's address
        # (and the shared VIP, cilium/shared-vip) reaches the broker wherever
        # it runs; local endpoints win.
        annotations:
          service.cilium.io/global: "true"
          service.cilium.io/affinity: local
        ports:
          http:
            port: 1883
    persistence:
      config:
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: "${STORAGE_CLASS_DEFAULT}"
        # Must match persistence_location in mosquitto.conf. The PVC used to sit
        # at /data while mosquitto wrote to /mosquitto/data on the read-only
        # root filesystem, so every autosave failed with "Permission denied"
        # and retained messages (e.g. frigate/available) were lost on restart.
        globalMounts:
          - path: /mosquitto/data
      config-file:
        type: configMap
        name: mosquitto-configmap
        advancedMounts:
          mosquitto:
            app:
              - path: /mosquitto/config/mosquitto.conf
                subPath: mosquitto.conf
      secret-file:
        type: secret
        name: mosquitto-secrets
        advancedMounts:
          mosquitto:
            init-config:
              - path: /tmp/secret
      external-config:
        type: emptyDir
        globalMounts:
          - path: /mosquitto/external_config
