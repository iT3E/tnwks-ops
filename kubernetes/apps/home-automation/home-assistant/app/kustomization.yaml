---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-automation
resources:
  - ./secrets.sops.yaml
  - ./prometheus.sops.yaml
  - ./helmrelease.yaml
# Home Assistant's own configuration, one ConfigMap per directory it mounts
# into (ConfigMaps are flat). New files under config/packages/ or
# config/dashboards/ (or config/www/) must be listed here too.
configMapGenerator:
  - name: home-assistant-config
    files:
      - config/configuration.yaml
  - name: home-assistant-packages
    files:
      - config/packages/frigate_person_alerts.yaml
      - config/packages/house_systems.yaml
      - config/packages/kitchen_calendar.yaml
      - config/packages/kitchen_display.yaml
      - config/packages/kitchen_rewards.yaml
      - config/packages/kitchen_routines.yaml
      - config/packages/lights.yaml
      - config/packages/robovac.yaml
  - name: home-assistant-dashboards
    files:
      - config/dashboards/house.yaml
      - config/dashboards/kitchen.yaml
      - config/dashboards/monitoring.yaml
      - config/dashboards/security.yaml
  - name: home-assistant-www-kitchen
    files:
      - config/www/tnwks-kitchen/kitchen-cards.js
  - name: home-assistant-www-security
    files:
      - config/www/tnwks-security/person-alerts-card.js
  - name: home-assistant-scripts
    files:
      - scripts/prepare-config.sh
  - name: home-assistant-pacific-power-credits
    files:
      - config/custom_components/pacific_power_credits/__init__.py
      - config/custom_components/pacific_power_credits/bill.py
      - config/custom_components/pacific_power_credits/config_flow.py
      - config/custom_components/pacific_power_credits/const.py
      - config/custom_components/pacific_power_credits/coordinator.py
      - config/custom_components/pacific_power_credits/manifest.json
      - config/custom_components/pacific_power_credits/sensor.py
      - config/custom_components/pacific_power_credits/strings.json
      - config/custom_components/pacific_power_credits/translations/en.json
generatorOptions:
  disableNameSuffixHash: true
  # Jinja and shell, not Flux variables: never envsubst these. Per-cluster
  # values reach HA as container env vars (helmrelease.yaml).
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
labels:
  - pairs:
      app.kubernetes.io/name: home-assistant
      app.kubernetes.io/instance: home-assistant
