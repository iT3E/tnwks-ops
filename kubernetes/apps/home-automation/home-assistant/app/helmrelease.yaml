---
# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-automation
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      home-assistant:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        statefulset:
          volumeClaimTemplates:
            - name: config
              accessMode: ReadWriteOnce
              size: 5Gi
              storageClass: "${STORAGE_CLASS_DEFAULT}"
              globalMounts:
                - path: /config
        initContainers:
          # Creates the UI-owned include files on a fresh volume and installs
          # the pinned custom integrations + cards (scripts/prepare-config.sh).
          # Same image as the app, which already ships bash, curl and unzip.
          prepare-config:
            image: &image
              # onedr0p/home-assistant stopped at 2025.3.3; the images moved to
              # home-operations.
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.10.4@sha256:81271a8bbe2a6019659e9d5cde98b884dd0d67fad6819bb4ab177dceb0c1c5e1
            command: ["/bin/bash", "/scripts/prepare-config.sh", "/config"]
            env:
              # renovate: datasource=github-releases depName=christiaangoossens/hass-oidc-auth
              HASS_OIDC_AUTH_VERSION: v1.2.1
              # renovate: datasource=github-releases depName=blakeblackshear/frigate-hass-integration
              FRIGATE_INTEGRATION_VERSION: v5.15.6
              # renovate: datasource=github-releases depName=dermotduffy/advanced-camera-card
              ADVANCED_CAMERA_CARD_VERSION: v8.1.0
              # renovate: datasource=github-releases depName=NemesisRE/kiosk-mode
              KIOSK_MODE_VERSION: v15.0.0
              # The Map Extractor's maintained line is v3 (config flow; v2 is
              # YAML-only and last released 2025-07), still tagged alpha.
              # renovate: datasource=github-releases depName=PiotrMachowski/Home-Assistant-custom-components-Xiaomi-Cloud-Map-Extractor
              XIAOMI_MAP_EXTRACTOR_VERSION: v3.0.0-alpha-24
              # renovate: datasource=github-releases depName=PiotrMachowski/lovelace-xiaomi-vacuum-map-card
              XIAOMI_VACUUM_MAP_CARD_VERSION: v2.4.1
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image: *image
            # A list, not a map: HASS_RECORDER_DB_URL expands
            # $(POSTGRES_PASSWORD), which Kubernetes only resolves for
            # variables defined earlier in the list.
            env:
              - name: TZ
                value: "${TIMEZONE}"
              # Public (Cloudflare tunnel) and LAN entry points; the Companion
              # app switches to the internal one on the home Wi-Fi.
              - name: HASS_EXTERNAL_URL
                value: "https://hass.${SECRET_DOMAIN}"
              - name: HASS_INTERNAL_URL
                value: "https://hass.${INTERNAL_DOMAIN}"
              # HASS_GRAFANA_URL (the Monitoring dashboard's frame, with the
              # kiosk JWT) comes from home-assistant-secret.
              # Public app-client ID (cognito_home_assistant_client_id output
              # of the AWS workspace), like the onboard client's.
              - name: HASS_OIDC_CLIENT_ID
                value: "6b83l0fm26ccgo8mmblvftsek"
              - name: HASS_OIDC_DISCOVERY_URL
                value: "${COGNITO_OIDC_ISSUER_URL}/.well-known/openid-configuration"
              - name: FRIGATE_UI_URL
                value: "https://frigate.${CLUSTER_DOMAIN}"
              # CNPG app password from the reflected `postgres-app` secret;
              # composed into the recorder URL so it never lands in git.
              - name: POSTGRES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: postgres-app
                    key: password
              - name: HASS_RECORDER_DB_URL
                value: "postgresql://app:$(POSTGRES_PASSWORD)@postgres-rw.databases.svc.cluster.local:5432/home_assistant"
            # HASS_LATITUDE / HASS_LONGITUDE / HASS_ELEVATION
            envFrom:
              - secretRef:
                  name: home-assistant-secret
            probes:
              # /manifest.json is served unauthenticated by the frontend.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /manifest.json
                    port: &port 8123
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              # The first start after an image change rebuilds /config/.venv
              # and pip-installs the custom integrations' requirements.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /manifest.json
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            securityContext: *securityContext
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
    service:
      app:
        controller: home-assistant
        ports:
          http:
            port: *port
    # Public + LAN, like jellyfin. No oauth2-proxy gate on either: HA does
    # its own OIDC (auth_oidc), and the Companion app's native API, websocket
    # and webhook calls can't carry an oauth2-proxy session.
    ingress:
      app:
        className: nginx
        annotations:
          external-dns.alpha.kubernetes.io/target: "ingress.${SECRET_DOMAIN}"
          hajimari.io/icon: mdi:home-assistant
          # The frontend holds one long-lived websocket; don't let nginx's
          # 60s default idle timeout cut it.
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        hosts:
          - host: &host hass.${SECRET_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
      internal:
        className: nginx-internal
        annotations:
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        hosts:
          - host: &internalHost hass.${INTERNAL_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *internalHost
    persistence:
      configuration:
        type: configMap
        name: home-assistant-config
        advancedMounts:
          home-assistant:
            app:
              - path: /config/configuration.yaml
                subPath: configuration.yaml
                readOnly: true
      packages:
        type: configMap
        name: home-assistant-packages
        advancedMounts:
          home-assistant:
            app:
              - path: /config/packages
                readOnly: true
      dashboards:
        type: configMap
        name: home-assistant-dashboards
        advancedMounts:
          home-assistant:
            app:
              - path: /config/dashboards
                readOnly: true
      # Our own frontend cards (the kitchen display's), served as
      # /local/tnwks-kitchen/. Third-party cards are installed onto the PVC by
      # prepare-config.sh instead.
      www-kitchen:
        type: configMap
        name: home-assistant-www-kitchen
        advancedMounts:
          home-assistant:
            app:
              - path: /config/www/tnwks-kitchen
                readOnly: true
      scripts:
        type: configMap
        name: home-assistant-scripts
        advancedMounts:
          home-assistant:
            prepare-config:
              - path: /scripts
                readOnly: true
