    - input_boolean.chore_raine_clean_up_all_toys
    - input_boolean.chore_raine_pick_clothes_for_the_week
    - input_boolean.chore_raine_potty_and_brush_teeth
    - input_boolean.chore_raine_practice_violin_for_5_minutes
    - input_boolean.chore_raine_shower_and_pjs
    - input_boolean.chore_raine_dishes_by_sink
    - input_boolean.chore_raine_piano_for_10_minutes
    - input_boolean.chore_raine_read_for_15_minutes
