---
# Kitchen display routines (chores + stars), the HA replacement for the
# Apolosign Routines screen. Read by the custom cards in
# config/www/tnwks-kitchen/kitchen-cards.js and the Kitchen dashboard
# (config/dashboards/kitchen.yaml).
#
# One input_boolean per chore. Its customize attributes say who it belongs
# to and when it shows up:
#   member        raine | river | megan | ivan
#   period        morning | afternoon | evening | anytime
#   points        stars for checking it off (points_by_day overrides per day)
#   days          sun..sat it appears on
#   emoji, order  how the cards draw and sort it
# To add a chore: add the input_boolean and its customize block, and add the
# entity to both automations' entity lists below (award + reset).
#
# Stars are counters, seeded with the Apolosign totals on 2026-10-30
# (Raine 90, River 54). `initial` only applies when there's no restored
# state, so fix a balance with counter.set_value, not by editing this file.
# Unchecking a chore by hand takes its stars back; the midnight reset doesn't
# (only unchecks that carry a user_id count).
#
# Generated once from the Apolosign chore list (week of 2026-11-01); edit
# this file directly from here on.
