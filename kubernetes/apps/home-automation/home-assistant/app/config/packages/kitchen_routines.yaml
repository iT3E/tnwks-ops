automation:
- id: kitchen_routines_stars
  alias: 'Kitchen routines: award stars'
  description: Adds a chore's stars when it's checked off, takes them back when a person unchecks it. Unchecks without a user (the midnight reset) keep the stars.
  mode: queued
  max: 50
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.chore_raine_brush_teeth_and_hair
    - input_boolean.chore_raine_clean_your_room
    - input_boolean.chore_raine_eat_breakfast
    - input_boolean.chore_raine_get_dressed
    - input_boolean.chore_raine_pack_backpack
    - input_boolean.chore_raine_pack_lunch
    - input_boolean.chore_raine_free_dress
