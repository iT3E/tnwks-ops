  conditions:
  # Only take stars back when a person unchecked it (a dashboard tap carries
  # their user_id). The midnight reset runs from a time trigger, whose context
  # has neither a user_id nor a parent_id, so parent_id can't tell them apart.
  - condition: template
    value_template: "{{ trigger.id == 'done' or trigger.to_state.context.user_id is not none }}"
  variables:
    points: "{% set a = trigger.to_state.attributes %}{{ (a.points_by_day | default({})).get(now().strftime('%a') | lower, a.points | default(0)) | int(0) }}"
    counter_entity: "counter.stars_{{ trigger.to_state.attributes.member }}"
  actions:
  - condition: template
    value_template: "{{ points | int(0) > 0 }}"
  - action: counter.set_value
    target:
      entity_id: "{{ counter_entity }}"
    data:
      value: "{% set cur = states(counter_entity) | int(0) %}{{ cur + points | int(0) if trigger.id == 'done' else [cur - points | int(0), 0] | max }}"
