template:
- sensor:
  - name: Raine routines done
    unique_id: kitchen_routines_raine_done
    icon: mdi:checkbox-marked-circle-outline
    state: "{% set d = states.input_boolean | selectattr('attributes.kitchen_chore', 'defined') | selectattr('attributes.member', 'eq', 'raine') | selectattr('attributes.days', 'contains', now().strftime('%a') | lower) | list %}{{ d | selectattr('state', 'eq', 'on') | list | count }}"
    attributes:
      total: "{{ (states.input_boolean | selectattr('attributes.kitchen_chore', 'defined') | selectattr('attributes.member', 'eq', 'raine') | selectattr('attributes.days', 'contains', now().strftime('%a') | lower) | list) | count }}"
