---
# Kitchen display routines (chores + stars), the HA replacement for the
# Apolosign Routines screen. Read by the custom cards in
# config/www/tnwks-kitchen/kitchen-cards.js and the Kitchen dashboard
# (config/dashboards/kitchen.yaml).
#
# The routines themselves are UI-owned data, so the family can add, change
# and delete them on the display (Routines tab: ＋ Add routine, ✎ Edit,
# long-press). They're the items of the Local To-do list
# todo.kitchen_routines ("Kitchen routines"), one item per routine:
#   summary       the routine's name
#   status        completed = done today
#   description   JSON: {"member": kid1|kid2|adult2|adult1,
#                 "period": morning|afternoon|evening|anytime,
#                 "points": stars, "days": [sun..sat], "emoji": "🪥",
#                 optional "points_by_day": {"mon": 5}}
# The 37 routines that used to be input_booleans here were moved into that
# list on 2026-10-31.
#
# This file keeps the rest: the stars counters, the reward goals,
# sensor.kitchen_routines (the list's items as an attribute, for templates),
# the done/total sensors behind the week grid, script.kitchen_routine_set
# (check or uncheck one and move its stars), and the midnight reset.
#
# Stars are counters, seeded with the Apolosign totals on 2026-10-30
# (kid1 90, kid2 54). `initial` only applies when there's no restored
# state, so fix a balance with counter.set_value, not by editing this file.
# Unchecking a routine on the display takes its stars back; the midnight
# reset doesn't (it reopens the items without going through the script).
counter:
  stars_kid1:
    name: !env_var KITCHEN_KID1_NAME
    icon: mdi:star
    initial: 90
    restore: true
    minimum: 0
    step: 1
  stars_kid2:
    name: !env_var KITCHEN_KID2_NAME
    icon: mdi:star
    initial: 54
    restore: true
    minimum: 0
    step: 1
  stars_adult2:
    name: !env_var KITCHEN_ADULT2_NAME
    icon: mdi:star
    initial: 0
    restore: true
    minimum: 0
    step: 1
  stars_adult1:
    name: !env_var KITCHEN_ADULT1_NAME
    icon: mdi:star
    initial: 0
    restore: true
    minimum: 0
    step: 1
input_text:
  routines_goal_kid1:
    name: Kid1 reward goal
    max: 60
    icon: mdi:gift
  routines_goal_kid2:
    name: Kid2 reward goal
    max: 60
    icon: mdi:gift
input_number:
  routines_goal_stars_kid1:
    name: Kid1 reward goal stars
    min: 0
    max: 1000
    step: 1
    mode: box
    icon: mdi:star-circle
  routines_goal_stars_kid2:
    name: Kid2 reward goal stars
    min: 0
    max: 1000
    step: 1
    mode: box
    icon: mdi:star-circle

script:
  kitchen_routine_set:
    alias: 'Kitchen routines: check or uncheck'
    description: Marks a routine done or not done for today and moves its stars. Called by the Kitchen dashboard.
    icon: mdi:checkbox-marked-circle-outline
    mode: queued
    max: 30
    fields:
      uid:
        description: The routine's to-do item uid in todo.kitchen_routines.
        required: true
        selector:
          text:
      done:
        description: True to check it off, false to uncheck it.
        required: true
        selector:
          boolean:
    sequence:
    - action: todo.get_items
      target:
        entity_id: todo.kitchen_routines
      response_variable: r
    - variables:
        item: "{{ r['todo.kitchen_routines']['items'] | selectattr('uid', 'eq', uid) | first | default(none) }}"
    # Nothing to do for a deleted routine or one already in that state (a double tap).
    - condition: template
      value_template: "{{ item is not none and (item.status == 'completed') != (done | bool) }}"
    - variables:
        meta: "{{ (item.description or '{}') | from_json(default={}) }}"
        points: "{{ (meta.points_by_day | default({})).get(now().strftime('%a') | lower, meta.points | default(0)) | int(0) }}"
        counter_entity: "counter.stars_{{ meta.member | default('none') }}"
    - action: todo.update_item
      target:
        entity_id: todo.kitchen_routines
      data:
        item: "{{ uid }}"
        status: "{{ 'completed' if done | bool else 'needs_action' }}"
    - condition: template
      value_template: "{{ points | int(0) > 0 and states(counter_entity) | is_number }}"
    - action: counter.set_value
      target:
        entity_id: "{{ counter_entity }}"
      data:
        value: "{% set cur = states(counter_entity) | int(0) %}{{ cur + points | int(0) if done | bool else [cur - points | int(0), 0] | max }}"
template:
# The routines list as an attribute, refreshed whenever the list changes (its
# state is the open count, so a check or uncheck triggers it) and every minute
# for edits that don't change the count.
- triggers:
  - trigger: state
    entity_id: todo.kitchen_routines
  - trigger: time_pattern
    minutes: /1
  - trigger: homeassistant
    event: start
  conditions:
  - condition: template
    value_template: "{{ states('todo.kitchen_routines') not in ['unknown', 'unavailable'] }}"
  actions:
  - action: todo.get_items
    target:
      entity_id: todo.kitchen_routines
    response_variable: r
  sensor:
  - name: Kitchen routines
    unique_id: kitchen_routines_items
    icon: mdi:format-list-checks
    state: "{{ r['todo.kitchen_routines']['items'] | count }}"
    attributes:
      items: >-
        {% set ns = namespace(out=[]) %}
        {% for i in r['todo.kitchen_routines']['items'] %}
        {% set m = (i.description or '{}') | from_json(default={}) %}
        {% if m is mapping and m.member is defined %}
        {% set ns.out = ns.out + [{'uid': i.uid, 'title': i.summary, 'member': m.member, 'period': m.period | default('anytime'),
          'days': m.days | default(['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat']), 'done': i.status == 'completed'}] %}
        {% endif %}
        {% endfor %}
        {{ ns.out }}
- sensor:
  - name: Kid1 routines done
    unique_id: kitchen_routines_kid1_done
    icon: mdi:checkbox-marked-circle-outline
    state: "{{ ((state_attr('sensor.kitchen_routines', 'items') or []) | selectattr('member', 'eq', 'kid1') | selectattr('days', 'contains', now().strftime('%a') | lower) | list) | selectattr('done') | list | count }}"
    attributes:
      total: "{{ ((state_attr('sensor.kitchen_routines', 'items') or []) | selectattr('member', 'eq', 'kid1') | selectattr('days', 'contains', now().strftime('%a') | lower) | list) | count }}"
  - name: Kid2 routines done
    unique_id: kitchen_routines_kid2_done
    icon: mdi:checkbox-marked-circle-outline
    state: "{{ ((state_attr('sensor.kitchen_routines', 'items') or []) | selectattr('member', 'eq', 'kid2') | selectattr('days', 'contains', now().strftime('%a') | lower) | list) | selectattr('done') | list | count }}"
    attributes:
      total: "{{ ((state_attr('sensor.kitchen_routines', 'items') or []) | selectattr('member', 'eq', 'kid2') | selectattr('days', 'contains', now().strftime('%a') | lower) | list) | count }}"
  - name: Adult2 routines done
    unique_id: kitchen_routines_adult2_done
    icon: mdi:checkbox-marked-circle-outline
    state: "{{ ((state_attr('sensor.kitchen_routines', 'items') or []) | selectattr('member', 'eq', 'adult2') | selectattr('days', 'contains', now().strftime('%a') | lower) | list) | selectattr('done') | list | count }}"
    attributes:
      total: "{{ ((state_attr('sensor.kitchen_routines', 'items') or []) | selectattr('member', 'eq', 'adult2') | selectattr('days', 'contains', now().strftime('%a') | lower) | list) | count }}"
  - name: Adult1 routines done
    unique_id: kitchen_routines_adult1_done
    icon: mdi:checkbox-marked-circle-outline
    state: "{{ ((state_attr('sensor.kitchen_routines', 'items') or []) | selectattr('member', 'eq', 'adult1') | selectattr('days', 'contains', now().strftime('%a') | lower) | list) | selectattr('done') | list | count }}"
    attributes:
      total: "{{ ((state_attr('sensor.kitchen_routines', 'items') or []) | selectattr('member', 'eq', 'adult1') | selectattr('days', 'contains', now().strftime('%a') | lower) | list) | count }}"
- binary_sensor:
  - name: Kid1 routines am done
    unique_id: kitchen_routines_kid1_am
    icon: mdi:star-check
    state: "{% set d = (state_attr('sensor.kitchen_routines', 'items') or []) | selectattr('member', 'eq', 'kid1') | selectattr('days', 'contains', now().strftime('%a') | lower) | selectattr('period', 'in', ['morning', 'afternoon']) | list %}{{ d | count > 0 and d | rejectattr('done') | list | count == 0 }}"
  - name: Kid1 routines pm done
    unique_id: kitchen_routines_kid1_pm
    icon: mdi:star-check
    state: "{% set d = (state_attr('sensor.kitchen_routines', 'items') or []) | selectattr('member', 'eq', 'kid1') | selectattr('days', 'contains', now().strftime('%a') | lower) | selectattr('period', 'in', ['evening']) | list %}{{ d | count > 0 and d | rejectattr('done') | list | count == 0 }}"
  - name: Kid2 routines am done
    unique_id: kitchen_routines_kid2_am
    icon: mdi:star-check
    state: "{% set d = (state_attr('sensor.kitchen_routines', 'items') or []) | selectattr('member', 'eq', 'kid2') | selectattr('days', 'contains', now().strftime('%a') | lower) | selectattr('period', 'in', ['morning', 'afternoon']) | list %}{{ d | count > 0 and d | rejectattr('done') | list | count == 0 }}"
  - name: Kid2 routines pm done
    unique_id: kitchen_routines_kid2_pm
    icon: mdi:star-check
    state: "{% set d = (state_attr('sensor.kitchen_routines', 'items') or []) | selectattr('member', 'eq', 'kid2') | selectattr('days', 'contains', now().strftime('%a') | lower) | selectattr('period', 'in', ['evening']) | list %}{{ d | count > 0 and d | rejectattr('done') | list | count == 0 }}"
  - name: Adult2 routines am done
    unique_id: kitchen_routines_adult2_am
    icon: mdi:star-check
    state: "{% set d = (state_attr('sensor.kitchen_routines', 'items') or []) | selectattr('member', 'eq', 'adult2') | selectattr('days', 'contains', now().strftime('%a') | lower) | selectattr('period', 'in', ['morning', 'afternoon']) | list %}{{ d | count > 0 and d | rejectattr('done') | list | count == 0 }}"
  - name: Adult2 routines pm done
    unique_id: kitchen_routines_adult2_pm
    icon: mdi:star-check
    state: "{% set d = (state_attr('sensor.kitchen_routines', 'items') or []) | selectattr('member', 'eq', 'adult2') | selectattr('days', 'contains', now().strftime('%a') | lower) | selectattr('period', 'in', ['evening']) | list %}{{ d | count > 0 and d | rejectattr('done') | list | count == 0 }}"
  - name: Adult1 routines am done
    unique_id: kitchen_routines_adult1_am
    icon: mdi:star-check
    state: "{% set d = (state_attr('sensor.kitchen_routines', 'items') or []) | selectattr('member', 'eq', 'adult1') | selectattr('days', 'contains', now().strftime('%a') | lower) | selectattr('period', 'in', ['morning', 'afternoon']) | list %}{{ d | count > 0 and d | rejectattr('done') | list | count == 0 }}"
  - name: Adult1 routines pm done
    unique_id: kitchen_routines_adult1_pm
    icon: mdi:star-check
    state: "{% set d = (state_attr('sensor.kitchen_routines', 'items') or []) | selectattr('member', 'eq', 'adult1') | selectattr('days', 'contains', now().strftime('%a') | lower) | selectattr('period', 'in', ['evening']) | list %}{{ d | count > 0 and d | rejectattr('done') | list | count == 0 }}"
automation:
- id: kitchen_routines_reset
  alias: 'Kitchen routines: midnight reset'
  description: Reopens every routine at midnight. Stars stay.
  triggers:
  - trigger: time
    at: 00:00:00
  actions:
  - action: todo.get_items
    target:
      entity_id: todo.kitchen_routines
    data:
      status: completed
    response_variable: r
  - repeat:
      for_each: "{{ r['todo.kitchen_routines']['items'] | map(attribute='uid') | list }}"
      sequence:
      - action: todo.update_item
        target:
          entity_id: todo.kitchen_routines
        data:
          item: "{{ repeat.item }}"
          status: needs_action
