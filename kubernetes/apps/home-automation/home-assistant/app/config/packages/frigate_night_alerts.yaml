---
# Night-time person alerts from Frigate.
#
# Frigate groups activity into review items and publishes every change to one
# on frigate/reviews (type new / update / end). A review is an "alert" when it
# contains a label from review.alerts.labels — person, with the default
# Frigate config. This sends one Telegram photo per review, the first time it
# becomes a person alert, on an exterior camera, inside the night window.
#
# Delivery goes through the Telegram bot integration (UI-configured, see
# docs/home-assistant.md). With one bot and no recipient set, send_photo goes
# to the bot's first allow-listed chat. HA downloads the snapshot itself, so
# Frigate's API never has to be reachable from Telegram.
#
# The switch and the window are helpers so they can be flipped from the
# Security dashboard, but `initial` makes this file the source of truth: a
# restart puts them back to the values below. Change them here to make a
# change stick. The switch defaulting to on is deliberate — a restart should
# never silently leave alerting off.

input_boolean:
  night_person_alerts:
    name: Night person alerts
    icon: mdi:shield-moon
    initial: true

input_datetime:
  night_person_alerts_start:
    name: Night alerts start
    has_date: false
    has_time: true
    initial: "23:00:00"
  night_person_alerts_end:
    name: Night alerts end
    has_date: false
    has_time: true
    initial: "06:00:00"

automation:
  - id: frigate_night_person_alert
    alias: "Security: person at night"
    description: >-
      Telegram photo when Frigate raises a person alert on an exterior camera
      between the night alerts start and end times.
    mode: parallel
    max: 10
    triggers:
      - trigger: mqtt
        topic: frigate/reviews
    variables:
      # Exterior cameras only; the interior ones see the household at night.
      watched_cameras:
        - frigate_loryta_fdoor
        - frigate_reolink_south
        - frigate_sv3c_east
        - frigate_sv3c_west
        - frigate_amcrest_balc
        - frigate_loryta_pool
      # In-cluster API for the snapshot (HA fetches it), and the browser-facing
      # UI for the button in the message.
      frigate_api: !env_var FRIGATE_API_URL
      frigate_ui: !env_var FRIGATE_UI_URL
      review: "{{ trigger.payload_json }}"
      camera: "{{ review.after.camera }}"
      # A review lists the tracked-object events in it; the first one's
      # snapshot is the alert image.
      event_id: "{{ review.after.data.detections | first | default('') }}"
    conditions:
      - condition: state
        entity_id: input_boolean.night_person_alerts
        state: "on"
      # Spans midnight: after 23:00 OR before 06:00.
      - condition: time
        after: input_datetime.night_person_alerts_start
        before: input_datetime.night_person_alerts_end
      - condition: template
        value_template: "{{ camera in watched_cameras and event_id != '' }}"
      # Fire once per review: on the message where it first becomes a person
      # alert — a new review, or an update that adds the person or upgrades
      # the review from detection to alert. Later updates and the end message
      # for the same review stay quiet.
      - condition: template
        value_template: >-
          {% set after = review.after %}
          {% set before = review.before %}
          {{ review.type in ['new', 'update']
             and after.severity == 'alert'
             and 'person' in after.data.objects
             and not (review.type == 'update'
                      and before.severity == 'alert'
                      and 'person' in before.data.objects) }}
    actions:
      - action: telegram_bot.send_photo
        data:
          url: "{{ frigate_api }}/api/events/{{ event_id }}/snapshot.jpg?bbox=1"
          caption: >-
            Person at {{ camera | replace('frigate_', '') | replace('_', ' ') | title }}
            — {{ now().strftime('%-I:%M %p') }}
          inline_keyboard:
            - "Open in Frigate:{{ frigate_ui }}/review?id={{ review.after.id }}"
