---
# Kitchen display settings the whole house shares (every screen showing the
# Kitchen dashboard follows these). See config/www/tnwks-kitchen/kitchen-cards.js
# ("themes").
#
# kitchen_theme: the display's look. "default" is the everyday dark theme;
# the rest are holidays. The Home tab offers each holiday's theme in the days
# before it, the 🎨 button next to the tabs picks one any time, and a holiday
# theme switches itself back to default in the week after its holiday.
# No `initial`, so the choice survives restarts.
#
# kitchen_mode: dark, light or auto (dark from sunset to sunrise, by sun.sun).
# Light keeps each theme's accent on light cards. The Android status and
# navigation bars follow it on the wall display. No `initial` either.
#
# kitchen_theme_answered: which holiday offers were already answered (yes or
# no), as "<holiday>-<year>" tokens, so each one is asked once.
input_select:
  kitchen_theme:
    name: Kitchen display theme
    icon: mdi:palette
    options:
      - default
      - newyear
      - valentines
      - stpatricks
      - easter
      - july4
      - halloween
      - thanksgiving
      - christmas
  kitchen_mode:
    name: Kitchen display dark or light
    icon: mdi:theme-light-dark
    options:
      - auto
      - dark
      - light
input_text:
  kitchen_theme_answered:
    name: Kitchen theme offers answered
    icon: mdi:party-popper
    max: 255
