---
# Monitoring dashboard (YAML mode, git-owned): Grafana, full height, inside
# HA. It opens Grafana's own home page with its navigation, so every Grafana
# dashboard and folder is reachable from here without listing them in HA.
# It's signed in as the kiosk identity, a Grafana Viewer, on every device:
# the URL is grafana-embed with the kiosk JWT (auth_token), from the
# HASS_GRAFANA_URL env var (home-assistant-secret). Cognito's login page
# won't load in a frame, so the oauth2-proxy route can't be used here. To
# edit dashboards, open Grafana itself.
title: Monitoring
strategy:
  type: iframe
  url: !env_var HASS_GRAFANA_URL
