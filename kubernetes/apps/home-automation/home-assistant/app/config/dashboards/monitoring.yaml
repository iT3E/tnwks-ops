---
# Monitoring dashboard (YAML mode, git-owned): Grafana, full height, inside
# HA. It opens Grafana's own home page with its navigation, so every Grafana
# dashboard and folder is reachable from here without listing them in HA.
# Grafana allows embedding (security.allow_embedding) and sits behind
# oauth2-proxy, whose session cookie (.tnwks.us, SameSite=Lax, 30 days,
# refreshed daily) is same-site here, so it works in the frame. What can't
# work in the frame is Cognito's login page (it refuses framing,
# ERR_BLOCKED_BY_RESPONSE). A device gets its oauth2-proxy session silently
# while its Cognito session is fresh: sign in to HA with tnwks, then open
# this dashboard within the hour. Everyone sees it; what they can do in
# Grafana is their Grafana role (Viewer unless promoted; the wall display is
# the kiosk identity, a Viewer).
# The URL comes from the HASS_GRAFANA_URL env var (helmrelease.yaml).
title: Monitoring
strategy:
  type: iframe
  url: !env_var HASS_GRAFANA_URL
