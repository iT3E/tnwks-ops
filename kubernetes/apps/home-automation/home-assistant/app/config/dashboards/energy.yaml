---
# The Energy sidebar landing page. The flow card uses the UI-owned energy
# preferences, so adding a meter in Energy settings also adds it here.
title: Energy
views:
  - title: Distribution
    path: distribution
    icon: mdi:home-lightning-bolt
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:tnwks-energy-flow-card
            title: Energy distribution
            max_devices: 8
            grid_options: { columns: full, rows: auto }
          - type: button
            name: Energy history and settings
            icon: mdi:chart-timeline-variant
            tap_action:
              { action: navigate, navigation_path: /energy/electricity }
            grid_options: { columns: full, rows: 1 }
