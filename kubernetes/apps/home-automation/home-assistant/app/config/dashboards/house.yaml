---
# Home dashboard (YAML mode, git-owned; URL /home-hub, HA's default dashboard
# via frontend system data `default_panel` = home-hub, which is UI-owned). The everyday
# view of the house on phones: who's home, weather, power, appliances,
# cameras. The built-in Overview (areas) is hidden from the sidebar but still
# at /home; the tablet has its own dashboard (Wall display).
#
# Entities: Sense (power, detected devices), SolarEdge (external statistics,
# hourly and delayed, so solar is a daily bar chart rather than a live tile),
# Frigate (cameras), the kitchen display helpers (packages/kitchen_display.yaml).
# person.adult1 / person.adult2 are the two adults' persons, renamed in the
# entity registry (UI-owned) so no names live here; HA shows their names.
# Robovac: Xiaomi Miio (vacuum.roborock_vacuum_s5, added with host + token)
# and Xiaomi Cloud Map Extractor (image.robovac_live_map, with the rooms and
# calibration as attributes); both UI-owned. The rooms are the app's
# (segment ids from the map's `rooms` attribute, outlines from its
# x0/y0/x1/y1 boxes): 17 Playroom, 18 Kitchen, 16 Living room, the same ids
# as the scripts in packages/robovac.yaml.
# Lights (LIFX), media (Google Cast, Denon, Sonos) and the Tesla Wall
# Connector are local integrations, UI-owned except Sonos (configuration.yaml).
title: Home
views:
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Family
            icon: mdi:account-group
          - { type: tile, entity: person.adult1 }
          - { type: tile, entity: person.adult2 }
          - type: weather-forecast
            entity: weather.forecast_home
            forecast_type: daily
            grid_options: { columns: full }

      - type: grid
        cards:
          - type: heading
            heading: Power
            icon: mdi:flash
            badges:
              - type: entity
                entity: sensor.sense_264601_daily_energy
                name: Today
                show_name: true
          - type: tile
            entity: sensor.sense_264601_energy
            name: House now
            icon: mdi:home-lightning-bolt
            grid_options: { columns: full }
            features:
              - type: trend-graph
                hours_to_show: 6
          - { type: tile, entity: sensor.electric_vehicle_power, name: EV charging, icon: mdi:car-electric }
          - { type: tile, entity: sensor.always_on_power, name: Always on, icon: mdi:power-plug }
          - { type: tile, entity: sensor.water_heater_power, name: Water heater, icon: mdi:water-boiler }
          - { type: tile, entity: sensor.ac_2_power, name: AC 2, icon: mdi:air-conditioner }
          - type: statistics-graph
            title: Last two weeks (kWh)
            chart_type: bar
            period: day
            days_to_show: 14
            stat_types: [change]
            entities:
              - entity: sensor.sense_264601_daily_energy
                name: House
              - entity: solaredge:2242194_74068c8e_94
                name: Solar, inverter 1
              - entity: solaredge:2242194_7500e34f_a7
                name: Solar, inverter 2
            grid_options: { columns: full }
          - type: button
            name: Energy dashboard
            icon: mdi:chart-bar
            tap_action: { action: navigate, navigation_path: /energy }
            grid_options: { columns: full, rows: 1 }

      - type: grid
        cards:
          - type: heading
            heading: Appliances
            icon: mdi:washing-machine
          - { type: tile, entity: binary_sensor.dishwasher_power, name: Dishwasher, icon: mdi:dishwasher }
          - { type: tile, entity: binary_sensor.washer_power, name: Washer, icon: mdi:washing-machine }
          - { type: tile, entity: binary_sensor.dryer_power, name: Dryer, icon: mdi:tumble-dryer }
          - type: heading
            heading: Wall display
            icon: mdi:tablet-dashboard
            badges:
              - type: entity
                entity: sensor.apolosign_calendar_screen_brightness
                name: Brightness
                show_name: true
          - { type: tile, entity: input_select.kitchen_theme, name: Theme, features: [{ type: select-options }], grid_options: { columns: full } }
          - { type: tile, entity: input_select.kitchen_mode, name: Dark or light, features: [{ type: select-options }], grid_options: { columns: full } }

      - type: grid
        cards:
          - type: heading
            heading: Lights
            icon: mdi:lightbulb-group
          - &light { type: tile, entity: light.pool1_lifx_mini_318ee9_pump_room, features: [{ type: light-brightness }], grid_options: { columns: full } }
          - { <<: *light, entity: light.pool1_lifx_mini_31589a_middle_left }
          - { <<: *light, entity: light.pool1_lifx_mini_318e9a_middle_right }
          - { <<: *light, entity: light.pool1_lifx_mini_3189f4_far_right }
          - type: heading
            heading: EV charger
            icon: mdi:ev-station
          - { type: tile, entity: sensor.tesla_wall_connector_status, name: Status }
          - { type: tile, entity: sensor.tesla_wall_connector_total_power, name: Power }
          - { type: tile, entity: sensor.tesla_wall_connector_session_energy, name: This session }
          - { type: tile, entity: sensor.tesla_wall_connector_energy, name: Lifetime }

      - type: grid
        cards:
          - type: heading
            heading: Media
            icon: mdi:speaker-multiple
          - &media { type: tile, entity: media_player.denon_avr_s750h, name: Receiver, features: [{ type: media-player-volume-slider }], grid_options: { columns: full } }
          - { <<: *media, entity: media_player.living_room_tv_2, name: Living room TV }
          - { <<: *media, entity: media_player.kitchen_speaker, name: Kitchen speaker }
          - { <<: *media, entity: media_player.kitchen_display, name: Kitchen display }
          - { <<: *media, entity: media_player.kitchen_sonos_kitchen_sonos, name: Kitchen Sonos }
          - { <<: *media, entity: media_player.patio_sonos_patio_sonos, name: Patio Sonos }

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Robovac
            icon: mdi:robot-vacuum
            badges:
              - type: entity
                entity: sensor.roborock_vacuum_s5_battery
                name: Battery
                show_name: false
          - type: custom:xiaomi-vacuum-map-card
            entity: vacuum.roborock_vacuum_s5
            vacuum_platform: default
            map_source: { camera: image.robovac_live_map }
            calibration_source: { camera: true }
            map_locked: true
            two_finger_pan: true
            # Tap rooms, then Start: app_segment_clean with their ids.
            map_modes:
              - template: vacuum_clean_segment
                predefined_selections:
                  - { id: "17", outline: [[22050, 28450], [30400, 28450], [30400, 34800], [22050, 34800]], label: { text: "Playroom", x: 26225, y: 31625, offset_y: 30 }, icon: { name: "mdi:broom", x: 26225, y: 31625 } }
                  - { id: "18", outline: [[19150, 24750], [28700, 24750], [28700, 29250], [19150, 29250]], label: { text: "Kitchen", x: 23925, y: 27000, offset_y: 30 }, icon: { name: "mdi:broom", x: 23925, y: 27000 } }
                  - { id: "16", outline: [[18100, 11950], [29000, 11950], [29000, 24950], [18100, 24950]], label: { text: "Living room", x: 23550, y: 18450, offset_y: 30 }, icon: { name: "mdi:broom", x: 23550, y: 18450 } }
              - template: vacuum_clean_zone
              - template: vacuum_goto
            grid_options: { columns: full }
          # The app's rooms (packages/robovac.yaml): one tap cleans that room.
          - &room { type: tile, entity: script.robovac_clean_playroom, name: Clean playroom, icon: mdi:toy-brick, tap_action: { action: perform-action, perform_action: script.turn_on, target: { entity_id: script.robovac_clean_playroom } }, grid_options: { columns: 4 } }
          - { <<: *room, entity: script.robovac_clean_kitchen, name: Clean kitchen, icon: mdi:countertop, tap_action: { action: perform-action, perform_action: script.turn_on, target: { entity_id: script.robovac_clean_kitchen } } }
          - { <<: *room, entity: script.robovac_clean_living_room, name: Clean living room, icon: mdi:sofa, tap_action: { action: perform-action, perform_action: script.turn_on, target: { entity_id: script.robovac_clean_living_room } } }
          - type: tile
            entity: vacuum.roborock_vacuum_s5
            name: Robovac
            features:
              - type: vacuum-commands
                commands: [start_pause, stop, return_home, locate]
            grid_options: { columns: full }

      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Cameras
            icon: mdi:cctv
            badges:
              - type: entity
                entity: camera.frigate_loryta_fdoor
                show_state: false
                show_icon: true
                tap_action: { action: navigate, navigation_path: /home-security }
          # Snapshots refresh every few seconds; a tap opens the Security dashboard.
          - &cam { type: picture-entity, entity: camera.frigate_loryta_fdoor, name: Front door, show_state: false, camera_view: auto, tap_action: { action: navigate, navigation_path: /home-security }, grid_options: { columns: 6, rows: 3 } }
          - { <<: *cam, entity: camera.frigate_reolink_south, name: South }
          - { <<: *cam, entity: camera.frigate_sv3c_east, name: East }
          - { <<: *cam, entity: camera.frigate_sv3c_west, name: West }
          - { <<: *cam, entity: camera.frigate_loryta_pool, name: Pool }
          - { <<: *cam, entity: camera.frigate_amcrest_balc, name: Balcony }
          - { <<: *cam, entity: camera.frigate_amcrest_kitchen, name: Kitchen }
