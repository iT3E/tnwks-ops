---
# Home Assistant configuration — the git-owned half.
#
# Mounted read-only from the home-assistant-config ConfigMap; packages/ and
# dashboards/ sit next to it from their own ConfigMaps. Any change here rolls
# the pod (reloader), and .github/workflows/home-assistant.yaml runs
# check_config against the pinned image on every PR.
#
# Everything ADR-0010 makes UI-only — integrations that talk to a device or
# service (MQTT broker, Frigate, Telegram, Z-Wave JS), the entity/device/area
# registries, users — lives in /config/.storage on the PVC and is backed up
# with HA's own backups, not git. See docs/apps/home-assistant.md for which
# settings are owned where and the one-time UI steps.
#
# Flux variable substitution is OFF for these files (the ConfigMaps carry
# kustomize.toolkit.fluxcd.io/substitute: disabled) so Jinja templates can
# never be mangled. Per-cluster values arrive as container env vars instead
# and are read with !env_var.

homeassistant:
  name: Home
  latitude: !env_var HASS_LATITUDE
  longitude: !env_var HASS_LONGITUDE
  elevation: !env_var HASS_ELEVATION
  time_zone: !env_var TZ
  unit_system: us_customary
  country: US
  currency: USD
  internal_url: !env_var HASS_INTERNAL_URL
  external_url: !env_var HASS_EXTERNAL_URL
  packages: !include_dir_named packages

default_config:

# No http: block. Since 2026.8 the HTTP settings are UI-owned: a YAML block
# is imported once, as an unconfirmed trial that reverts to defaults (no
# proxy trust) unless an admin confirms it within 5 minutes, and is ignored
# from then on. Proxy trust (Trust X-Forwarded-For + the pod CIDR) is set
# once under Settings > System > Network, over a port-forward — see
# docs/apps/home-assistant.md. Leave login attempts before a ban at
# unlimited (the default): every LAN client arrives as the Windows
# portproxy, so a ban would lock out the whole LAN.

recorder:
  db_url: !env_var HASS_RECORDER_DB_URL
  purge_keep_days: 14

# SSO against the tnwks-auth Cognito pool (hass-oidc-auth; app client in
# infrastructure/terraform/modules/aws/cognito.tf). Public client + PKCE.
# Cognito has no `groups` scope and puts membership in `cognito:groups`.
# The login page shows a small welcome screen: "Login with tnwks", plus a
# link to the local HA login, used by the owner account from onboarding (the
# break-glass admin; it's internet-facing, so it carries TOTP MFA — see
# docs/apps/home-assistant.md).
#
# Deliberately not set:
#   - force_https: URLs follow the request scheme. Behind ingress-nginx HA
#     reads X-Forwarded-Proto: https (once proxy trust is on), so callbacks
#     are https anyway; forcing it broke plain-http access over a
#     port-forward (http://localhost:8123 → https://localhost:8123).
#   - default_redirect: skipping the welcome screen sends every login
#     straight to Cognito, a dead end over the port-forward (no localhost
#     callback is registered) and it hides the local login.
auth_oidc:
  client_id: !env_var HASS_OIDC_CLIENT_ID
  discovery_url: !env_var HASS_OIDC_DISCOVERY_URL
  display_name: tnwks
  additional_scopes:
    - email
  claims:
    username: email
    display_name: email
    groups: cognito:groups
  roles:
    admin: admins
    user: viewers
  features:
    include_groups_scope: false

lovelace:
  # Frontend resources are git-owned too; the card files themselves are
  # installed by scripts/prepare-config.sh.
  resource_mode: yaml
  resources:
    - url: /local/advanced-camera-card/advanced-camera-card.js
      type: module
    # /local is cached for weeks: the ?v= is what makes browsers (and the
    # kitchen display) fetch a new copy. Bump it with every change to the file.
    - url: /local/tnwks-kitchen/kitchen-cards.js?v=1.0.0
      type: module
    - url: /local/kiosk-mode/kiosk-mode.js?v=15.0.0
      type: module
  dashboards:
    home-security:
      mode: yaml
      filename: dashboards/security.yaml
      title: Security
      icon: mdi:cctv
    kitchen-display:
      mode: yaml
      filename: dashboards/kitchen.yaml
      title: Kitchen
      icon: mdi:countertop

# Automations, scripts and scenes are split by owner: the ones under
# packages/ are git-owned (read-only in the UI), and these three files on
# the PVC are what the UI editors write to.
automation ui: !include automations.yaml
script ui: !include scripts.yaml
scene ui: !include scenes.yaml
