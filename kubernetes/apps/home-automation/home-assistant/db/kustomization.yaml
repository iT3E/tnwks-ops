---
# Home Assistant's own CNPG cluster, databases/home-assistant-pg (the
# recorder), from ../../../../components/cnpg-cluster (added by the
# home-assistant-db Kustomization).
#
# Plus ../../../../components/cnpg-standby: the same manifest on both sites;
# HOME_ASSISTANT_PG_PRIMARY names the primary, the other site runs a replica
# cluster from its WAL archive. Imported from the shared cluster on
# 2026-11-05 (#1785); that copy stays there as the rollback. bootstrap is only
# read when a Cluster is created, and a new one now restores from the peer.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./secret-home-assistant-role.sops.yaml
patches:
  - target:
      kind: Cluster
    patch: |-
      # Which site is primary, and on the side being promoted only, the old
      # primary's demotion token (docs/wsl/multi-site.md). The empty default
      # carries its quotes (a bare empty value is null, which the CRD rejects).
      - op: add
        path: /spec/replica/primary
        value: ${HOME_ASSISTANT_PG_PRIMARY:=homelab-wsl}
      - op: add
        path: /spec/replica/promotionToken
        value: ${HOME_ASSISTANT_PG_PROMOTION_TOKEN:=""}
