---
# Home Assistant's own Postgres, the recorder (kubernetes/components/cnpg-cluster).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant-db
  namespace: flux-system
spec:
  path: ./kubernetes/apps/home-automation/home-assistant/db
  components:
    - ../../../../components/cnpg-cluster
  dependsOn:
    - name: cloudnative-pg-plugin-barman-cloud
    - name: aws-backup-credentials
  # The owner role's Secret ships with it (db/).
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  prune: true
  # The Cluster's Ready condition gates Home Assistant; kstatus alone calls a
  # Cluster with no status yet Current (components/cnpg-cluster/README.md).
  wait: true
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 30m
  retryInterval: 1m
  timeout: 15m
  postBuild:
    substitute:
      CNPG_APP: home-assistant
      CNPG_USER: home_assistant
      # The recorder writes all day (379 MB on 2026-11-05): room to grow, and
      # more than the small-cluster defaults of buffers and memory.
      CNPG_SIZE: 5Gi
      CNPG_SHARED_BUFFERS: 128MB
      CNPG_MEMORY_REQUEST: 256Mi
      CNPG_MEMORY_LIMIT: 1Gi
---
# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant
  namespace: flux-system
spec:
  # Its own Postgres cluster (the recorder) must be Ready first.
  dependsOn:
    - name: home-assistant-db
  path: ./kubernetes/apps/home-automation/home-assistant/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
