---
# MS-01 only (bare metal). tuppr upgrades one node at a time from a healthy
# peer: drain, `talosctl upgrade`, reboot, wait Ready. Talos in Docker refuses
# in-place upgrades, so the WSL cluster rolls its node containers instead
# (talos/wsl/versions.yaml, `task talos:upgrade:wsl`). Renovate keeps both
# pins on the same version in one PR.
#
# Upgrade one minor at a time (1.13 -> 1.14, not 1.13 -> 1.15).
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: cluster
spec:
  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/talos
    version: v1.14.5
  healthChecks:
    - apiVersion: v1
      kind: Node
      expr: status.conditions.exists(c, c.type == "Ready" && c.status == "True")
      timeout: 10m
