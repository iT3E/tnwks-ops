---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  interval: 30m
  chart:
    spec:
      chart: tuppr
      version: 0.5.10
      sourceRef:
        kind: HelmRepository
        name: home-operations
        namespace: flux-system
  maxHistory: 2
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # The controller and its upgrade Jobs reach the Talos API through the
  # talos.dev ServiceAccount this chart creates. That needs
  # machine.features.kubernetesTalosAPIAccess on every node, allowing os:admin
  # from this namespace (talos/wsl/cluster-config.yaml, talos/ms-01/*.yaml).
  values:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    monitoring:
      serviceMonitor:
        enabled: ${SERVICE_MONITOR_ENABLED}
      prometheusRule:
        enabled: true
