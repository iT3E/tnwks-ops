---
# The finance repository in two steps, so that it never bootstraps with the
# placeholder session (docs/operations/backups.md, "Credentials"): first the
# credentials and the refresher, and after one good refresh the
# ClusterRepository.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./secret-certificate.sops.yaml
  - ./secret-sts.yaml
  - ./secret-password.sops.yaml
  - ./rbac.yaml
  - ./cronjob.yaml
  # Listed in a later change, after the first refresh wrote a real session
  # to aws-backup-sts-agents-finance.
  # - ./clusterrepository.yaml
labels:
  - pairs:
      app.kubernetes.io/name: kopiur-agents-finance-repository
      app.kubernetes.io/instance: kopiur-agents-finance-repository
    includeSelectors: false
