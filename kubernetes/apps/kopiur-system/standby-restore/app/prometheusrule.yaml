---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: standby-restore
  namespace: kopiur-system
spec:
  groups:
    - name: standby-restore
      rules:
        # Failed runs are KubeJobFailed. This catches the drill not running
        # (or never succeeding since its last success). kube-state-metrics has
        # no last-success series until the first success, so a drill that has
        # never succeeded counts from the CronJob's creation.
        - alert: StandbyRestoreDrillStale
          expr: >-
            (time() - kube_cronjob_status_last_successful_time{namespace="kopiur-system", cronjob="standby-restore"} > 8 * 86400)
            or
            ((time() - kube_cronjob_created{namespace="kopiur-system", cronjob="standby-restore"} > 8 * 86400)
              unless on (namespace, cronjob) kube_cronjob_status_last_successful_time{namespace="kopiur-system", cronjob="standby-restore"})
          for: 1h
          labels:
            severity: warning
          annotations:
            dashboard_url: "https://grafana.${INTERNAL_DOMAIN}/d/tnwks-data?var-cluster={{ $externalLabels.cluster }}"
            summary: "The weekly standby restore hasn't succeeded for 8 days."
            description: >-
              CronJob kopiur-system/standby-restore restores the other site's
              newest snapshot of each warm app's PVC here. Check its last Job's
              log and the Restores it left (label app.kubernetes.io/name=standby-restore).
