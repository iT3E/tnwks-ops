---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No kustomization-wide namespace: it would move the flux-system Role and
# RoleBinding (site-overrides) into kopiur-system too, so each resource names
# its own.
resources:
  - ./rbac.yaml
  - ./cronjob.yaml
  - ./prometheusrule.yaml
configMapGenerator:
  - name: standby-restore-script
    namespace: kopiur-system
    files:
      - ./scripts/restore_drill.py
generatorOptions:
  disableNameSuffixHash: true
