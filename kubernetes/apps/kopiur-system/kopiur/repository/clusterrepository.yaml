---
# One Kopia repository for every opted-in PVC, in the AWS S3 backup bucket under
# kopiur/. Kopia encrypts client-side with KOPIA_PASSWORD (kopiur-repository,
# SOPS; a copy belongs with the off-site keys, see docs/operations/bcp.md).
# S3 auth is the STS session in aws-backup-sts, refreshed every 30 minutes
# from the Roles Anywhere certificate; projection copies it into each app
# namespace before every mover run, so a rotated session is always picked up.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: s3
spec:
  backend:
    s3:
      bucket: "${BACKUP_S3_BUCKET}"
      # Each cluster writes its own kopia repository: homelab-wsl kopiur/
      # (the default), homelab-wsl-02 kopiur-homelab-wsl-02/. One shared prefix
      # would mix snapshot identities and maintenance ownership. The other
      # site's repository is mounted read-only for restores (wsl-02:
      # kubernetes/clusters/wsl-02/apps/kopiur-standby).
      prefix: ${KOPIUR_PREFIX:=kopiur/}
      endpoint: s3.us-west-2.amazonaws.com
      region: us-west-2
      auth:
        secretRef:
          name: aws-backup-sts
          namespace: kopiur-system
  encryption:
    passwordSecretRef:
      name: kopiur-repository
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  allowedNamespaces:
    list:
      # kopiur-system: the repository's own Maintenance runs here.
      - kopiur-system
      - home-automation
      - networking
      - production
  credentialProjection:
    allowed: true
  identityDefaults:
    hostnameExpr: "namespace"
    usernameExpr: "namespace + '-' + policyName"
  maintenance:
    namespace: kopiur-system
    schedule:
      quick:
        cron: "0 */6 * * *"
        jitter: 10m
      full:
        cron: "30 4 * * *"
        jitter: 30m
  moverDefaults:
    cache:
      contentCacheSizeMb: 256
      metadataCacheSizeMb: 256
  scheduleDefaults:
    timezone: "${TIMEZONE}"
