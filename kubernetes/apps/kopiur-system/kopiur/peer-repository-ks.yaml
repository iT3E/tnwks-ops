---
# The other site's kopiur repository, read-only here (see the file). Both WSL
# sites list it; the name is kept from when only homelab-wsl-02 had one.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopiur-standby-repository
  namespace: flux-system
spec:
  dependsOn:
    - name: kopiur-repository
  path: ./kubernetes/apps/kopiur-system/kopiur/peer-repository
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 3m
