---
# The other site's kopia repository, read-only: restores of its snapshots onto
# this cluster (a switchover's PVC copy, the weekly drill). Named after that
# site (PEER_CLUSTER_NAME), at its prefix (PEER_KOPIUR_PREFIX: kopiur/ for
# homelab-wsl, kopiur-homelab-wsl-02/ for homelab-wsl-02). Not "s3": kopiur
# names the maintenance owner after the repository, and this one must never
# run maintenance or retention on the other site's snapshots (adoption
# Ignore). homelab-wsl-02's IAM role can't write kopiur/ anyway.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: ${PEER_CLUSTER_NAME}
spec:
  mode: ReadOnly
  create:
    enabled: false
  maintenance:
    enabled: false
  catalog:
    adoption: Ignore
    periodicRefresh: true
    refreshInterval: 6h
  backend:
    s3:
      bucket: "${BACKUP_S3_BUCKET}"
      prefix: ${PEER_KOPIUR_PREFIX}
      endpoint: s3.us-west-2.amazonaws.com
      region: us-west-2
      auth:
        secretRef:
          name: aws-backup-sts
          namespace: kopiur-system
  # Same password as homelab-wsl's repository (one secret for both sites).
  encryption:
    passwordSecretRef:
      name: kopiur-repository
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  allowedNamespaces:
    list:
      - kopiur-system
      - home-automation
      - networking
      - production
  credentialProjection:
    allowed: true
