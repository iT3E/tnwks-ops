---
# Immich's Postgres data directory (data-immich-postgres-0). Not backed up (docs/operations/backups.md,
# "Deliberately not backed up"): no SnapshotSchedule. The policy is only for
# moving the PVC between sites: a switchover (bin/site-failover) takes a
# one-off snapshot here, restores it on the other site, then deletes it.
# Unprivileged mover (999): its files belong to postgres (999), the user that reads and restores them. kopiur refuses a root mover unless
# the namespace opts in, which isn't needed.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: immich-postgres
  namespace: selfhosted
spec:
  repository:
    kind: ClusterRepository
    name: s3
  copyMethod: Direct
  compression:
    compressor: zstd
  credentialProjection:
    enabled: true
  mover:
    securityContext:
      runAsUser: 999
      runAsGroup: 999
  retention:
    keepLatest: 1
  sources:
    - pvc:
        name: data-immich-postgres-0
