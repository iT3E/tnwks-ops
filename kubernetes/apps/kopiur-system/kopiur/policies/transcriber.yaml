---
# The transcriber's clip audio (transcriber-audio): nightly, on the site that
# runs it (homelab-wsl-02 since 2026-11-05). Transcripts are in Postgres;
# models aren't backed up (they download again). A switchover
# (bin/site-failover) also takes a one-off snapshot here to copy the PVC.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: transcriber
  namespace: production
spec:
  repository:
    kind: ClusterRepository
    name: s3
  copyMethod: Direct
  compression:
    compressor: zstd
  credentialProjection:
    enabled: true
  mover:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
  retention:
    keepLatest: 3
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 6
  sources:
    - pvc:
        name: transcriber-audio
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: transcriber
  namespace: production
spec:
  policyRef:
    name: transcriber
  schedule:
    cron: "H 2 * * *"
    runOnCreate: true
    # Only where the transcriber runs: suspended on the standby site
    # (TRANSCRIBER_BACKUP_SUSPEND in its cluster-settings; a switchover flips
    # it in site-overrides).
    suspend: ${TRANSCRIBER_BACKUP_SUSPEND:=false}
