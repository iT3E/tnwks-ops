---
# Mealie /app/data: recipe images and the app secrets. Recipes themselves are in Postgres (database app).
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: mealie
  namespace: production
spec:
  repository:
    kind: ClusterRepository
    name: s3
  # local-path has no CSI snapshots: the mover reads the live PVC read-only,
  # co-located on the app's node (crash-consistent). Fine for config volumes.
  copyMethod: Direct
  compression:
    compressor: zstd
  credentialProjection:
    enabled: true
  mover:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
  retention:
    keepLatest: 3
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 6
  sources:
    - pvc:
        name: mealie-config
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: mealie
  namespace: production
spec:
  policyRef:
    name: mealie
  schedule:
    # Nightly, spread across 02:00-03:00 (H), after the 01:00 Postgres base backup.
    cron: "H 2 * * *"
    # Only where Mealie runs: suspended on the standby site (MEALIE_BACKUP_SUSPEND
    # in its cluster-settings; a switchover flips it in site-overrides).
    suspend: ${MEALIE_BACKUP_SUSPEND:=false}
    runOnCreate: true
