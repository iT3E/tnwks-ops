---
# Home Assistant /config: .storage (integrations, devices, entity registry, auth), dashboards, custom components. Recorder history is in Postgres.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: home-assistant
  namespace: home-automation
spec:
  repository:
    kind: ClusterRepository
    name: s3
  # local-path has no CSI snapshots: the mover reads the live PVC read-only,
  # co-located on the app's node (crash-consistent). Fine for config volumes.
  copyMethod: Direct
  compression:
    compressor: zstd
  credentialProjection:
    enabled: true
  mover:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
  retention:
    keepLatest: 3
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 6
  sources:
    - pvc:
        name: config-home-assistant-0
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: home-assistant
  namespace: home-automation
spec:
  policyRef:
    name: home-assistant
  schedule:
    # Nightly, spread across 02:00-03:00 (H), after the 01:00 Postgres base backup.
    cron: "H 2 * * *"
    runOnCreate: true
