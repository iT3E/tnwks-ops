---
# Immich's library (photos, thumbnails, encoded video) (immich-library). Not backed up (docs/operations/backups.md,
# "Deliberately not backed up"): no SnapshotSchedule. The policy is only for
# moving the PVC between sites: a switchover (bin/site-failover) takes a
# one-off snapshot here, restores it on the other site, then deletes it.
# Unprivileged mover (1000): every file in the library is world-readable, so an unprivileged mover reads them all; restored files belong to it, which Immich (root) reads fine. kopiur refuses a root mover unless
# the namespace opts in, which isn't needed.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: immich-library
  namespace: selfhosted
spec:
  repository:
    kind: ClusterRepository
    name: s3
  copyMethod: Direct
  compression:
    compressor: zstd
  credentialProjection:
    enabled: true
  mover:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
  retention:
    keepLatest: 1
  sources:
    - pvc:
        name: immich-library
