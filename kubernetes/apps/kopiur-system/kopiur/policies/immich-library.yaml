---
# Immich's library (photos, thumbnails, encoded video) (immich-library). Not backed up (docs/operations/backups.md,
# "Deliberately not backed up"): no SnapshotSchedule. The policy is only for
# moving the PVC between sites: a switchover (bin/site-failover) takes a
# one-off snapshot here, restores it on the other site, then deletes it.
# Immich runs as root and so does its Postgres, so the mover does too.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: immich-library
  namespace: selfhosted
spec:
  repository:
    kind: ClusterRepository
    name: s3
  copyMethod: Direct
  compression:
    compressor: zstd
  credentialProjection:
    enabled: true
  mover:
    securityContext:
      runAsUser: 0
      runAsGroup: 0
  retention:
    keepLatest: 1
  sources:
    - pvc:
        name: immich-library
