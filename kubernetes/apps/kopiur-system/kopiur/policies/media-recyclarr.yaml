---
# recyclarr's config (root-owned, all world-readable) (config-recyclarr-0). Not backed up (docs/operations/backups.md,
# "Deliberately not backed up": the media stack): no SnapshotSchedule. The
# policy only moves the PVC between sites (bin/site-failover "media"), with a
# one-off snapshot that's deleted after the restore.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: media-recyclarr
  namespace: media
spec:
  repository:
    kind: ClusterRepository
    name: s3
  copyMethod: Direct
  compression:
    compressor: zstd
  credentialProjection:
    enabled: true
  mover:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
  retention:
    keepLatest: 1
  sources:
    - pvc:
        name: config-recyclarr-0
