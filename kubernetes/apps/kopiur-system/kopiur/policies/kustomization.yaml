  - ./mealie.yaml
  - ./transcriber.yaml
  # Transfer only, no schedule (the files say why).
  - ./immich-library.yaml
  - ./immich-postgres.yaml
  - ./media-sonarr.yaml
  - ./media-radarr.yaml
  - ./media-prowlarr.yaml
  - ./media-qbittorrent.yaml
  - ./media-recyclarr.yaml
  - ./unifi.yaml
  - ./unifi-mongo.yaml
  - ./changedetection.yaml
  - ./ombi.yaml
  - ./ombi-f.yaml
  - ./wizarr.yaml
  - ./jellyfin.yaml
  - ./plausible-clickhouse.yaml
  - ./firefly.yaml
  - ./finance-sync.yaml
