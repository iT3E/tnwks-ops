---
# The STS session the refresher writes (refresh.py). Flux only creates these
# (IfNotPresent) and never overwrites them, so the refresher owns the data.
# The placeholders fail auth until the first refresh, which the CronJob runs
# within 30 minutes of a fresh install (or trigger it: see the docs).
apiVersion: v1
kind: Secret
metadata:
  name: aws-backup-sts
  namespace: databases
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: pending
  AWS_SECRET_ACCESS_KEY: pending
  AWS_SESSION_TOKEN: pending
  AWS_REGION: us-west-2
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-backup-sts
  namespace: kopiur-system
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: pending
  AWS_SECRET_ACCESS_KEY: pending
  AWS_SESSION_TOKEN: pending
  AWS_REGION: us-west-2
