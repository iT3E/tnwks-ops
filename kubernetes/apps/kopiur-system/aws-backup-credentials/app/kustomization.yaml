---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./secret-certificate.sops.yaml
  - ./secret-sts.yaml
  - ./rbac.yaml
  - ./cronjob.yaml
configMapGenerator:
  - name: aws-backup-credentials-scripts
    namespace: kopiur-system
    files:
      - ./scripts/refresh.py
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
labels:
  - pairs:
      app.kubernetes.io/name: aws-backup-credentials
      app.kubernetes.io/instance: aws-backup-credentials
