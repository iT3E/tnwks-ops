---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-backup-credentials
  namespace: kopiur-system
---
# Patch only the one Secret, in each namespace that consumes it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aws-backup-credentials
  namespace: kopiur-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["aws-backup-sts"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-backup-credentials
  namespace: kopiur-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aws-backup-credentials
subjects:
  - kind: ServiceAccount
    name: aws-backup-credentials
    namespace: kopiur-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aws-backup-credentials
  namespace: databases
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["aws-backup-sts"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-backup-credentials
  namespace: databases
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aws-backup-credentials
subjects:
  - kind: ServiceAccount
    name: aws-backup-credentials
    namespace: kopiur-system
