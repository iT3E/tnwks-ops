---
# The S3 session of the agents repository, which its refresher writes
# (cronjob.yaml). Flux only creates it (IfNotPresent) and never overwrites it,
# so the refresher owns the data. The placeholders fail auth until the first
# refresh, within 30 minutes of the merge.
apiVersion: v1
kind: Secret
metadata:
  name: aws-backup-sts-agents
  namespace: kopiur-system
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: pending
  AWS_SECRET_ACCESS_KEY: pending
  AWS_SESSION_TOKEN: pending
  AWS_REGION: us-west-2
