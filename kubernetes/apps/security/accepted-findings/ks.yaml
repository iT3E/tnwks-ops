---
# The list of accepted findings (security/README.md, "Accepted findings"):
# Flux decrypts app/accepted.sops.yaml to the Secret security-accepted-findings
# in the namespace security. No cluster lists this file until the owner has
# made the first list.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: security-accepted-findings
  namespace: flux-system
spec:
  path: ./kubernetes/apps/security/accepted-findings/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 30m
  retryInterval: 1m
  timeout: 5m
