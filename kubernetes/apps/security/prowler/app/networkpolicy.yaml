---
# What a Prowler run for AWS may reach, on top of default-deny
# (../../namespace.yaml): DNS, and the API endpoints of AWS on 443. Nothing
# calls it, and it calls no API server. No host of the vendor of Prowler: the
# runs have no --push-to-cloud and no version check. The names are the ones
# that the AWS SDK of Prowler 5.49.0 resolves for the clients of the checks of
# config/checks-aws.json (../README.md, "What a run can reach"). One `*` is
# one label of the name.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prowler-aws
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prowler
      security.tnwks.us/prowler-provider: aws
  egress:
    # DNS through Cilium's DNS proxy, so that the rule below can name hosts.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
            # Both WSL clusters are one Cilium Cluster Mesh: name this cluster.
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        # The global services: iam, cloudfront, waf, s3 (us-east-1), and the
        # public list of AWS IP ranges.
        - matchPattern: "*.amazonaws.com"
        # A service in a Region: ec2.us-west-2.amazonaws.com, and a bucket of
        # us-east-1: <bucket>.s3.amazonaws.com.
        - matchPattern: "*.*.amazonaws.com"
        # ECR: api.ecr.<region>.amazonaws.com.
        - matchPattern: "api.ecr.*.amazonaws.com"
        # A bucket in a Region: <bucket>.s3.<region>.amazonaws.com.
        - matchPattern: "*.s3.*.amazonaws.com"
        # S3 Control puts the account in the name:
        # <account>.s3-control.<region>.amazonaws.com.
        - matchPattern: "*.s3-control.*.amazonaws.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# A run for Cloudflare: DNS, and the API of Cloudflare. Nothing else.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prowler-cloudflare
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prowler
      security.tnwks.us/prowler-provider: cloudflare
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: api.cloudflare.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
