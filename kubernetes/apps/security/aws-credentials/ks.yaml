---
# The AWS sessions of the security platform (README.md): a CronJob turns each
# IAM Roles Anywhere certificate into a 4-hour session in a Secret of the
# namespace security. homelab-wsl-02 only (README.md, "How it started").
# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: security-aws-credentials
  namespace: flux-system
spec:
  path: ./kubernetes/apps/security/aws-credentials/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 3m
