---
# The sessions that the refresher writes (scripts/refresh.py), one Secret for
# each tool. Flux only creates them (IfNotPresent) and never overwrites them,
# so the refresher owns the data. The placeholders fail auth until the first
# refresh, which the CronJob runs within 30 minutes.
#
# Prowler reads this one: read-only on the prod account, and from there the
# audit role of the management account.
apiVersion: v1
kind: Secret
metadata:
  name: aws-security-audit-sts
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: pending
  AWS_SECRET_ACCESS_KEY: pending
  AWS_SESSION_TOKEN: pending
  AWS_REGION: us-west-2
---
# The trail copy job reads this one: read and list on the trail bucket only.
apiVersion: v1
kind: Secret
metadata:
  name: aws-security-trail-sts
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: pending
  AWS_SECRET_ACCESS_KEY: pending
  AWS_SESSION_TOKEN: pending
  AWS_REGION: us-west-2
