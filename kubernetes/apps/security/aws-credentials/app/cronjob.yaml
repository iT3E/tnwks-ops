---
# Every 30 minutes: each certificate -> a 4-hour session -> its Secret, in the
# form of the backups (kubernetes/apps/kopiur-system/aws-backup-credentials).
# A failed run raises KubeJobFailed; the sessions it already wrote stay valid
# for up to 4 hours.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aws-credentials
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 7200
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: aws-credentials
        spec:
          serviceAccountName: aws-credentials
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: ${SECURITY_NODE}
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            # The certificate Secrets are mounted root-owned; fsGroup plus
            # 0440 makes them readable by this non-root user.
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresh
              # Debian (glibc): aws_signing_helper is a dynamically linked
              # glibc binary and won't run on Alpine.
              image: docker.io/library/python:3.15.2-slim-trixie@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
              command: ["python3", "/app/refresh.py"]
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                # renovate: datasource=github-releases depName=aws/rolesanywhere-credential-helper
                - name: HELPER_VERSION
                  value: "1.8.5"
                - name: HELPER_URL
                  value: "https://rolesanywhere.amazonaws.com/releases/1.8.5/X86_64/Linux/Amzn2023/aws_signing_helper"
                - name: HELPER_SHA256
                  value: "beec9ed1c492d93db809890f16713e3556353294b823c2184ad4e891f1b2b54d"
                # From environments/prod/aws: the shared trust anchor, and the
                # outputs rolesanywhere_security_* (cluster-settings).
                - name: TRUST_ANCHOR_ARN
                  value: "${RA_TRUST_ANCHOR_ARN}"
                - name: SESSION_SECONDS
                  value: "14400"
                - name: AWS_REGION
                  value: us-west-2
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                # One entry for each certificate: where it is mounted, the
                # profile and the role of its session, the Secret that gets the
                # session, and the Lease that gets the certificate's end.
                - name: SESSIONS
                  value: |
                    [
                      {
                        "name": "audit",
                        "certificate": "/certs/audit",
                        "profile_arn": "${RA_SECURITY_AUDIT_PROFILE_ARN}",
                        "role_arn": "${RA_SECURITY_AUDIT_ROLE_ARN}",
                        "secret": "aws-security-audit-sts",
                        "lease": "aws-security-audit-certificate"
                      },
                      {
                        "name": "trail",
                        "certificate": "/certs/trail",
                        "profile_arn": "${RA_SECURITY_TRAIL_PROFILE_ARN}",
                        "role_arn": "${RA_SECURITY_TRAIL_ROLE_ARN}",
                        "secret": "aws-security-trail-sts",
                        "lease": "aws-security-trail-certificate"
                      }
                    ]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: scripts
                  mountPath: /app
                  readOnly: true
                - name: certificate-audit
                  mountPath: /certs/audit
                  readOnly: true
                - name: certificate-trail
                  mountPath: /certs/trail
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: aws-credentials-scripts
            - name: certificate-audit
              secret:
                secretName: aws-security-audit-certificate
                defaultMode: 0440
            - name: certificate-trail
              secret:
                secretName: aws-security-trail-certificate
                defaultMode: 0440
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
