---
# One Lease for each certificate. The refresher sets its renew time to the end
# of the certificate's validity (scripts/refresh.py), and kube-state-metrics
# serves that as kube_lease_renew_time: the series behind the alert
# SecurityCertificateExpiring (observability/rules.py). A CronJob has no
# endpoint to scrape, and this needs no exporter. Flux only creates them
# (IfNotPresent), so the refresher owns the time. Nothing holds these leases.
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: aws-security-audit-certificate
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec: {}
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: aws-security-trail-certificate
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec: {}
