---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: security
resources:
  # The two certificates for IAM Roles Anywhere, made by the owner
  # (../README.md has their form and the renewal).
  - ./secret-certificate-audit.sops.yaml
  - ./secret-certificate-trail.sops.yaml
  - ./secret-sts.yaml
  - ./lease.yaml
  - ./rbac.yaml
  - ./networkpolicy.yaml
  - ./cronjob.yaml
configMapGenerator:
  - name: aws-credentials-scripts
    files:
      - ./scripts/refresh.py
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
labels:
  - pairs:
      app.kubernetes.io/name: aws-credentials
      app.kubernetes.io/instance: aws-credentials
