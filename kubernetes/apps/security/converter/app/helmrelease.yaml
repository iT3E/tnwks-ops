---
# The converter (security/converter/README.md), in the form of the evidence
# collector (monitoring/observability-evidence): the pinned Python image, with
# its code and the map of the streams from a ConfigMap. Reloader restarts it
# when one of them changes.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: security-converter
  namespace: security
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      # The converter asks Loki, and never the API server: no token.
      automountServiceAccountToken: false
      # Placement and memory: ../../README.md.
      nodeSelector:
        kubernetes.io/hostname: ${SECURITY_NODE}
    controllers:
      converter:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: docker.io/library/python
              tag: 3.15-alpine@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
            command: [python3, -u, /config/converter.py]
            env:
              PYTHONDONTWRITEBYTECODE: "1"
              # This site's Loki, through its gateway, as Grafana reads it.
              # Loki asks for no login inside the cluster (auth_enabled: false).
              LOKI_URL: http://loki-gateway.monitoring.svc.cluster.local
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            probes:
              # /healthz fails when the loop of the stream source has stopped.
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 9877
                  timeoutSeconds: 2
              readiness: *probe
    service:
      app:
        controller: converter
        ports:
          http:
            port: 9877
    persistence:
      code:
        type: configMap
        name: security-converter-code
        globalMounts:
          - path: /config
            readOnly: true
    serviceMonitor:
      app:
        enabled: true
        serviceName: security-converter
        endpoints:
          - port: http
            interval: 1m
            scrapeTimeout: 10s
