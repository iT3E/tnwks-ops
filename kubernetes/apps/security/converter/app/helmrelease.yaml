---
# The converter (security/converter/README.md), in the form of the evidence
# collector (monitoring/observability-evidence): the pinned Python image, with
# its code and its maps from a ConfigMap, the list of accepted findings from
# its Secret, and the volume of results. Reloader restarts it when the
# ConfigMap or the Secret changes.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: security-converter
  namespace: security
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      # The converter asks Loki, and never the API server: no token.
      automountServiceAccountToken: false
      # Placement and memory: ../../README.md.
      nodeSelector:
        kubernetes.io/hostname: ${SECURITY_NODE}
    controllers:
      converter:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: docker.io/library/python
              tag: 3.15-alpine@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
            command: [python3, -u, /config/converter.py]
            env:
              PYTHONDONTWRITEBYTECODE: "1"
              # This site's Loki, through its gateway, as Grafana reads it.
              # Loki asks for no login inside the cluster (auth_enabled: false).
              LOKI_URL: http://loki-gateway.monitoring.svc.cluster.local
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            probes:
              # /healthz fails when the loop of the stream source has stopped.
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 9877
                  timeoutSeconds: 2
              readiness: *probe
    service:
      app:
        controller: converter
        ports:
          http:
            port: 9877
    persistence:
      code:
        type: configMap
        name: security-converter-code
        globalMounts:
          - path: /config
            readOnly: true
      # The list of accepted findings (security/README.md, "Accepted
      # findings"): the Secret that Flux decrypts, with the JSON array in its
      # key accepted.json, read at /accepted/accepted.json. Optional: before the owner
      # makes the first list, the Secret does not exist and the list is empty.
      # The chart's secret type has no `optional`, so the volume is custom.
      accepted:
        type: custom
        volumeSpec:
          secret:
            secretName: security-accepted-findings
            optional: true
        globalMounts:
          - path: /accepted
            readOnly: true
      # The volume of results (security/converter/README.md, "The files of
      # results"): the OCSF files of Prowler and the result file of the API
      # checks. The whole volume, read-only: the converter never writes to it.
      # The claim is ./pvc.yaml. The class puts the volume on the node of its
      # first pod, and the node selector above keeps each pod on that node.
      results:
        type: persistentVolumeClaim
        existingClaim: security-results
        globalMounts:
          - path: /results
            readOnly: true
    serviceMonitor:
      app:
        enabled: true
        serviceName: security-converter
        endpoints:
          - port: http
            interval: 1m
            scrapeTimeout: 10s
            metricRelabelings:
              # The series of the converter carry the labels of the contract
              # only. The pod and its address change at each restart, and an
              # alert that compares a series with the day before
              # (SecurityFindingNew) matches on all labels. No rule or board
              # reads these four. One pod runs (Recreate), so two series can
              # not meet after the drop.
              - regex: pod|instance|container|endpoint
                action: labeldrop
