---
# The converter. In: Prometheus scrapes its metrics port, and the kubelet's
# probes come from the host. Out: this site's Loki gateway (the queries of the
# stream source, and the push of the stream findings), and DNS through
# Cilium's DNS proxy. Nothing else: no API server, no other namespace, no
# host outside the cluster. default-deny (../../namespace.yaml) denies the rest.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: security-converter
  namespace: security
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: security-converter
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
            # Both WSL clusters are one Cilium Cluster Mesh: name this cluster.
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "9877"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9877"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # The gateway pods of the loki HelmRelease: the Service loki-gateway is
    # port 80, and its pods listen on 8080.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: loki
            app.kubernetes.io/component: gateway
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
