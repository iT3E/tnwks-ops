---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: security
resources:
  - ./helmrelease.yaml
  - ./networkpolicy.yaml
# security/generate.py writes both files: the copy of
# security/converter/converter.py, and the map of the streams from the
# registry. Never edit them here.
configMapGenerator:
  - name: security-converter-code
    files:
      - config/converter.py
      - config/streams.json
      # The names of the registry that the converter reads, also from
      # security/generate.py.
      - config/registry.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
