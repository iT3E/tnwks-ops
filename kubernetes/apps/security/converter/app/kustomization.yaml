---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: security
resources:
  - ./helmrelease.yaml
  - ./networkpolicy.yaml
  - ./pvc.yaml
# security/generate.py writes these files: the copy of
# security/converter/converter.py, the map of the streams, and the names of
# the registry that the converter reads. Never edit them here.
configMapGenerator:
  - name: security-converter-code
    files:
      - config/converter.py
      - config/streams.json
      - config/registry.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
