---
# Trivy Operator (README.md): the images and the settings of each workload of
# this cluster, and the controls of the CIS Kubernetes Benchmark. The same
# checks on each cluster that lists this file.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: security-trivy-operator
  namespace: flux-system
spec:
  dependsOn:
    # The ServiceMonitor of the chart needs its CRD.
    - name: kube-prometheus-stack
  path: ./kubernetes/apps/security/trivy-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
