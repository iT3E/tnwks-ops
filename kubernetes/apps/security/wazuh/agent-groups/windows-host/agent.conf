<agent_config>
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
  </sca>
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>no</hardware>
    <os>yes</os>
    <network>no</network>
    <packages>yes</packages>
    <hotfixes>yes</hotfixes>
    <ports all="yes">yes</ports>
    <processes>yes</processes>
    <users>yes</users>
    <groups>no</groups>
    <services>no</services>
    <browser_extensions>no</browser_extensions>
  </wodle>
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <!-- System executables, drivers, and shared and per-profile startup. -->
    <directories recursion_level="0" restrict="regedit.exe$|system.ini$|win.ini$">%WINDIR%</directories>
    <directories recursion_level="0" restrict="cmd.exe$|lsass.exe$|netsh.exe$|reg.exe$|sc.exe$|schtasks.exe$">%WINDIR%\System32</directories>
    <directories recursion_level="0">%WINDIR%\System32\drivers\etc</directories>
    <directories realtime="yes">%PROGRAMDATA%\Microsoft\Windows\Start Menu\Programs\Startup</directories>
    <directories realtime="yes">C:\Users\*\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup</directories>
    <!-- File metadata and hashes only. Keep report_changes off. -->
    <directories realtime="yes">C:\Users\*\Downloads</directories>
  </syscheck>
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[(EventID &gt;= 4624 and EventID &lt;= 4625) or EventID=4634 or EventID=4647 or EventID=4648 or EventID=4672 or (EventID &gt;= 4704 and EventID &lt;= 4719) or (EventID &gt;= 4720 and EventID &lt;= 4739) or (EventID &gt;= 4740 and EventID &lt;= 4767) or (EventID &gt;= 4780 and EventID &lt;= 4794) or EventID=4902 or EventID=4904 or EventID=4905 or EventID=4907 or EventID=4912 or EventID=1102]</query>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=1006 or EventID=1007 or EventID=1116 or EventID=1117 or EventID=1118 or EventID=1119 or EventID=1120]</query>
  </localfile>
  <active-response>
    <disabled>yes</disabled>
  </active-response>
</agent_config>
