---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wazuh-dashboard
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "${OAUTH2_PROXY_URL:=http://oauth2-proxy.auth.svc.cluster.local:80}/oauth2/auth?allowed_groups=wazuh-readers"
    nginx.ingress.kubernetes.io/auth-signin: "https://oauth2.${INTERNAL_DOMAIN}/oauth2/start?rd=$scheme://$host$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: Authorization
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/server-snippet: |
      # The RC2 button uses the basic-auth path for its JWT logout request.
      location = /auth/logout {
        if ($request_method != POST) {
          return 405;
        }
        rewrite ^ /api/v1/auth/logout last;
      }
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # The JWT handler clears its own cookies. Clear the manager session too.
      if ($request_uri ~ "^/auth/logout([?]|$)") {
        add_header Set-Cookie "wz-token=; Path=/; Max-Age=0; HttpOnly; Secure" always;
        add_header Set-Cookie "wz-user=; Path=/; Max-Age=0; HttpOnly; Secure" always;
        add_header Set-Cookie "wz-api=; Path=/; Max-Age=0; HttpOnly; Secure" always;
      }
spec:
  ingressClassName: nginx-internal
  tls:
    - hosts:
        - &host wazuh.${INTERNAL_DOMAIN}
  rules:
    - host: *host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  name: dashboard
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: wazuh-dashboard-ingress
spec:
  endpointSelector:
    matchLabels:
      app: wazuh-dashboard
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            k8s:app.kubernetes.io/instance: ingress-nginx-internal
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
