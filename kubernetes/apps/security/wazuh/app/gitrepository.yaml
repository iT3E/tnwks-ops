---
# The manifests of the Wazuh server, at the release tag. Flux reads them from
# the vendor repository (it publishes no chart), as for agent-sandbox, and
# ../ks.yaml (security-wazuh-server) builds the folder wazuh/ with the patches
# of this repository. The tag v5.0.0-rc2 points to the commit
# ceacd20b73fbe5252cc0af1a5429916c4e980fa9 (read 2026-11-22); the tests in
# security/tests/test_wazuh_manifests.py hold the tag and the kept files.
#
# Only the files of one manager node, one indexer node and the dashboard
# stay. The rest is ignored, so it never reaches the cluster:
#   - wazuh/kustomization.yml makes the Secrets from local files and sets
#     the namespace wazuh. Without it Flux makes a kustomization of all the
#     manifests under the path.
#   - wazuh/base/ holds the namespace, a storage class, the Traefik routes
#     and a deny-all and DNS policy for the whole namespace. The namespace
#     security has its own (../../namespace.yaml), and this app brings its DNS
#     rule (networkpolicy.yaml).
#   - The worker node, its Service of port 1514 and its policy: one manager
#     node only.
#   - The Service of port 1515: legacy enrollment is off (config/).
#   - manager-egress-external.yaml: egress to any address on port 443. The
#     manager reads its feed from the indexer, not from the internet
#     (README.md, "Network").
#   - The agents Service: service-agents.yaml replaces it.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: wazuh-kubernetes
spec:
  interval: 30m
  url: https://github.com/wazuh/wazuh-kubernetes
  ref:
    tag: v5.0.0-rc2
  ignore: |
    # exclude all
    /*
    # include the manifests of the server
    !/wazuh/
    # the Secrets from local files, the namespace and the base objects
    /wazuh/kustomization.yml
    /wazuh/base/
    # one manager node: no worker
    /wazuh/wazuh_managers/wazuh-worker-sts.yaml
    /wazuh/wazuh_managers/wazuh-events-svc.yaml
    /wazuh/wazuh_managers/network-policies/wazuh-worker-egress.yaml
    # legacy enrollment is off
    /wazuh/wazuh_managers/wazuh-registration-svc.yaml
    # egress to any address
    /wazuh/wazuh_managers/network-policies/manager-egress-external.yaml
    # replaced by service-agents.yaml
    /wazuh/wazuh_managers/wazuh-agents-svc.yaml
