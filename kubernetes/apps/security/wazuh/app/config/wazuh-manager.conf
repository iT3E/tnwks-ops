<!--
  The configuration of the Wazuh manager on homelab-wsl-02 (../../README.md).

  The file is strict XML: the manager checks it against its schema before any
  daemon starts, and refuses an unknown option (wazuh v5.0.0-rc2,
  docs/ref/configuration/manager/reference.md). The image copies this file
  over /etc/wazuh-manager/wazuh-manager.conf at each start (it is mounted at
  /wazuh-config-mount/etc/), and then writes the indexer hosts, the node name,
  the node type, the bind addresses, the node list and the cluster key from
  the environment of the pod (wazuh-docker v5.0.0-rc2,
  build-docker-images/wazuh-manager/config/etc/cont-init.d/0-wazuh-init).
  A change here takes effect at the next start of the pod.
-->
<wazuh_config>
  <global>
    <agents_disconnection_time>15m</agents_disconnection_time>
  </global>

  <logging>
    <log_format>plain</log_format>
  </logging>

  <!--
    One listener: HTTPS on 1517 for 5.x agents, enrollment and reports.
    No <legacy> block: the schema reads an absent block as disabled, so the
    classic listener of 4.x agents (1514) does not start.
  -->
  <remote>
    <https>
      <port>1517</port>
      <bind_addr>0.0.0.0</bind_addr>
      <global_prefix>/wazuh-manager/</global_prefix>
      <certificate>/etc/wazuh-manager/certs/remoted.pem</certificate>
      <key>/etc/wazuh-manager/certs/remoted-key.pem</key>
      <ca_certificate>/etc/wazuh-manager/certs/root-ca.pem</ca_certificate>
    </https>
    <agents>
      <allow_higher_versions>no</allow_higher_versions>
    </agents>
  </remote>

  <!--
    Enrollment through the HTTPS listener only. legacy_enrollment no keeps
    port 1515 closed. use_password stays yes: with no, an agent can enroll
    with no secret. The agent roles enroll with a token of the manager API,
    and the password of authd.pass is never handed out.
    The two certificate paths must exist even when the legacy listener is off.
  -->
  <auth>
    <disabled>no</disabled>
    <use_source_ip>no</use_source_ip>
    <purge>yes</purge>
    <use_password>yes</use_password>
    <ciphers>TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256</ciphers>
    <ssl_verify_host>no</ssl_verify_host>
    <ssl_manager_cert>/etc/wazuh-manager/certs/remoted.pem</ssl_manager_cert>
    <ssl_manager_key>/etc/wazuh-manager/certs/remoted-key.pem</ssl_manager_key>
    <remote_enrollment>yes</remote_enrollment>
    <legacy_enrollment>no</legacy_enrollment>
  </auth>

  <!--
    The manager reads the CVE feed from the indexer, not from the internet
    (wazuh v5.0.0-rc2, docs/guide/migration/vulnerability-detection-cti-feeds.md).
    The test cluster of task 8.2 turns it off with a patch of its own, for
    disk; site 2 runs it.
  -->
  <vulnerability-detection>
    <enabled>yes</enabled>
    <feed-update-interval>60m</feed-update-interval>
  </vulnerability-detection>

  <!--
    The agent roles install a pinned package, so the manager serves no remote
    upgrade, and needs no route to a package repository.
  -->
  <task-manager>
    <upgrade_enabled>no</upgrade_enabled>
  </task-manager>

  <!-- The image replaces the hosts from WAZUH_INDEXER_HOSTS. -->
  <indexer>
    <hosts>
      <host>https://wazuh-indexer-0.wazuh-indexer:9200</host>
    </hosts>
    <ssl>
      <certificate_authorities>
        <ca>/etc/wazuh-manager/certs/indexer-ca.pem</ca>
      </certificate_authorities>
      <certificate>/etc/wazuh-manager/certs/indexer-connector.pem</certificate>
      <key>/etc/wazuh-manager/certs/indexer-connector-key.pem</key>
    </ssl>
  </indexer>

  <!--
    One master node. The image writes node_name, node_type, bind_addr, nodes
    and key from the environment. The key here is not a valid key on
    purpose: if the image does not replace it from the Secret
    wazuh-cluster-key, the schema refuses it and the manager does not start.
  -->
  <cluster>
    <name>wazuh</name>
    <node_name>master</node_name>
    <node_type>master</node_type>
    <key>set-at-start-from-the-secret</key>
    <port>1516</port>
    <bind_addr>0.0.0.0</bind_addr>
    <nodes>
      <node>wazuh-manager-master-0.wazuh-cluster</node>
    </nodes>
    <hidden>no</hidden>
  </cluster>
</wazuh_config>
