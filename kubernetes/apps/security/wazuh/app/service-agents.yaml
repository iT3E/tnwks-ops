---
# The one port of the agents: a 5.x agent enrolls and reports over HTTPS on
# 1517 (wazuh-kubernetes v5.0.0-rc2, docs/ref/getting-started/requirements.md,
# "Network ports"). It replaces the vendor's wazuh-agents Service, which
# ../server does not keep. The manager pod serves the TLS itself, with the
# certificate wazuh-manager-remoted (certificates.yaml).
#
# WAZUH_AGENTS_LB_ADDR, a key of the cluster-settings of homelab-wsl-02, is an
# address of the shared VIP pool, in the half that the router prefers on
# site 2 (docs/wsl/multi-site.md, "Shared VIPs"). The label puts it in that
# pool and in the BGP advertisement of the nodes
# (kubernetes/apps/kube-system/cilium/bgp), so a host reaches it over the
# routed network, with no LAN bridge. Only homelab-wsl-02 lists this app, so
# only its nodes announce the address. Any node may receive it, so the
# traffic policy is Cluster, as for the other shared VIPs.
apiVersion: v1
kind: Service
metadata:
  name: wazuh-agents
  labels:
    app: wazuh-manager
    tnwks.us/shared-vip: "true"
spec:
  type: LoadBalancer
  loadBalancerIP: "${WAZUH_AGENTS_LB_ADDR}"
  externalTrafficPolicy: Cluster
  selector:
    app: wazuh-manager
    node-type: master
  ports:
    - name: agents-https
      port: 1517
      targetPort: 1517
      protocol: TCP
