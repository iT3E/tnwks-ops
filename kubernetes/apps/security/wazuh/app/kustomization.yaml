---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: security
resources:
  # The Secrets of the server, as SOPS files (../README.md, "Secrets").
  - ./secret-indexer-credentials.sops.yaml
  - ./secret-manager-credentials.sops.yaml
  - ./secret-dashboard-credentials.sops.yaml
  - ./secret-cluster-key.sops.yaml
  - ./certificates.yaml
  - ./networkpolicy.yaml
  - ./service-agents.yaml
  - ./dashboard-access.yaml
configMapGenerator:
  # Mounted by the patch of the manager in ../ks.yaml, by this name.
  - name: wazuh-manager-config
    files:
      - ./config/wazuh-manager.conf
  - name: wazuh-dashboard-access
    files:
      - ./config/dashboard/indexer-oidc.yaml
      - ./config/dashboard/indexer-auth.sh
      - ./config/dashboard/manager-rbac.py
      - ./config/dashboard/admin-enabled
    literals:
      - enabled=true
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: enabled
  - name: wazuh-notifications
    files:
      - ./config/notifications-enabled
      - ./config/indexer-notifications.sh
  - name: wazuh-dashboard-logout
    literals:
      - "url=https://auth.${SECRET_DOMAIN}/logout?client_id=${OAUTH2_PROXY_CLIENT_ID}&logout_uri=https%3A%2F%2Foauth2.${INTERNAL_DOMAIN}%2Foauth2%2Fsign_out"
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: enabled
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
