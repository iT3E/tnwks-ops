---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: security
# Step 1 of the settings of the Wazuh indexer, the accounts
# (../../wazuh/README.md, "Accounts"), and the network rule of both steps.
# security-wazuh-accounts applies it with wait: true, and
# security-wazuh-settings (../app) depends on it (../ks.yaml), so step 2 runs
# after the Job of step 1 completes. The files of the step stay in ../app with
# those of step 2, because both steps share ../app/scripts/indexer.py.
resources:
  # The Secrets of step 1, as SOPS files (../../wazuh/README.md, "Secrets").
  # The hashes carry kustomize.toolkit.fluxcd.io/substitute: disabled in
  # their plain metadata, so Flux substitutes nothing in them.
  - ./secret-accounts-user.sops.yaml
  - ./secret-accounts-hashes.sops.yaml
  - ./networkpolicy.yaml
  - ./accounts-job.yaml
configMapGenerator:
  # The files of step 1, which the hash in the name of its Job covers.
  # Tests: security/tests/test_wazuh_settings.py.
  - name: wazuh-accounts-files
    files:
      - ../app/config/accounts.json
      - ../app/scripts/indexer.py
      - ../app/scripts/accounts.py
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
