---
# The settings job. Out: the indexer on 9200, and DNS through Cilium's DNS
# proxy. Nothing else: no API server, no internet. Nothing calls it. The
# ingress side of 9200 is in ../../wazuh/app/networkpolicy.yaml
# (wazuh-indexer-readers). default-deny (../../namespace.yaml) denies the rest.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: wazuh-settings
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: wazuh-settings
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
            # Both WSL clusters are one Cilium Cluster Mesh: name this cluster.
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: security
            app: wazuh-indexer
      toPorts:
        - ports:
            - port: "9200"
              protocol: TCP
