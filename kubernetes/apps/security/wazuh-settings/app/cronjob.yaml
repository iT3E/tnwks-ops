---
# The settings job of the Wazuh indexer (scripts/apply.py, ../../wazuh/README.md): the
# accounts and the retention of config/, each day. After a change of config/,
# a person starts a run at once:
#   kubectl -n security create job --from=cronjob/wazuh-settings wazuh-settings-now
# A failed run raises KubeJobFailed; the next run is the next day.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wazuh-settings
spec:
  # UTC. After the API checks (06:47), one job at a time on the node.
  schedule: "17 7 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      # The wait for ISM (--wait, 900 seconds) and the calls before it.
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: wazuh-settings
        spec:
          restartPolicy: Never
          # The job calls the indexer only, never the API server: no token.
          automountServiceAccountToken: false
          enableServiceLinks: false
          # Placement and memory: ../../README.md.
          nodeSelector:
            kubernetes.io/hostname: ${SECURITY_NODE}
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: wazuh-settings
              # The image of the converter and the API checks: the script uses
              # the Python standard library only.
              image: docker.io/library/python:3.15-alpine@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
              command: ["python3", "-u", "/app/apply.py"]
              args:
                - --indexer=https://wazuh-indexer.security.svc.cluster.local:9200
                - --ca=/ca/ca.crt
                - --config=/config
                - --accounts=/secrets/accounts
                - --wait=900
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: scripts
                  mountPath: /app
                  readOnly: true
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: ca
                  mountPath: /ca
                  readOnly: true
                - name: accounts
                  mountPath: /secrets/accounts
                  readOnly: true
                - name: settings
                  mountPath: /secrets/settings
                  readOnly: true
                - name: converter
                  mountPath: /secrets/converter
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: wazuh-settings-scripts
            - name: config
              configMap:
                name: wazuh-settings-config
            # The certificate of the CA of the server, and not its key.
            - name: ca
              secret:
                secretName: wazuh-ca
                items:
                  - key: ca.crt
                    path: ca.crt
            # The Secrets that the owner makes (../../wazuh/README.md, "Secrets").
            - name: accounts
              secret:
                secretName: wazuh-settings-accounts
                items:
                  - key: username
                    path: username
                  - key: password
                    path: password
            - name: settings
              secret:
                secretName: wazuh-settings-user
                items:
                  - key: password
                    path: password
            - name: converter
              secret:
                secretName: wazuh-converter-reader
                items:
                  - key: password
                    path: password
