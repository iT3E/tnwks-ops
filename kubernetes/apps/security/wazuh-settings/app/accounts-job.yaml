---
# Step 1 of the settings of the Wazuh indexer: the accounts of
# config/accounts.json (scripts/accounts.py, ../../wazuh/README.md,
# "Accounts"). It runs only when its files change, never each day: the name
# carries the first 10 hex digits of the sha256 of config/accounts.json,
# scripts/indexer.py and scripts/accounts.py, one after another, so a change
# of one of them makes a new Job, Flux runs it, and prune removes the old one.
# security/tests/test_wazuh_settings.py checks the name, and names the right
# one when it differs.
#
# No ttlSecondsAfterFinished: Flux would make a deleted Job again and run it.
# The finished Job stays until its name changes. To run it again (after a
# failure, or after the owner changes a hash in wazuh-accounts-hashes),
# delete it: Flux makes it again at its next reconcile. The force annotation
# lets Flux replace the Job when an edit of this file changes its template,
# which a Job can not take in place.
#
# This pod is the only one that mounts the Secret of the account user and the
# Secret of the hashes. It holds no password of the users that it makes.
apiVersion: batch/v1
kind: Job
metadata:
  name: wazuh-accounts-2774c231d8
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh-accounts
    spec:
      restartPolicy: Never
      # The job calls the indexer only, never the API server: no token.
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Placement and memory: ../../README.md.
      nodeSelector:
        kubernetes.io/hostname: ${SECURITY_NODE}
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wazuh-accounts
          # The image of the converter and the API checks: the script uses
          # the Python standard library only.
          image: docker.io/library/python:3.15-alpine@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
          command: ["python3", "-u", "/app/accounts.py"]
          args:
            - --indexer=https://wazuh-indexer.security.svc.cluster.local:9200
            - --ca=/ca/ca.crt
            - --accounts=/app/accounts.json
            - --user=/secrets/user
            - --hashes=/secrets/hashes
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: files
              mountPath: /app
              readOnly: true
            - name: ca
              mountPath: /ca
              readOnly: true
            - name: user
              mountPath: /secrets/user
              readOnly: true
            - name: hashes
              mountPath: /secrets/hashes
              readOnly: true
      volumes:
        - name: files
          configMap:
            name: wazuh-accounts-files
        # The certificate of the CA of the server, and not its key.
        - name: ca
          secret:
            secretName: wazuh-ca
            items:
              - key: ca.crt
                path: ca.crt
        # The Secrets that the owner makes (../../wazuh/README.md, "Secrets").
        - name: user
          secret:
            secretName: wazuh-accounts-user
            items:
              - key: username
                path: username
              - key: password
                path: password
        # One key for each user of config/accounts.json: its bcrypt hash.
        - name: hashes
          secret:
            secretName: wazuh-accounts-hashes
