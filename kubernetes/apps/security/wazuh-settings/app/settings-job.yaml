---
# Step 2 of the settings of the Wazuh indexer, at each merge that changes its
# files (scripts/settings.py, ../../wazuh/README.md, "Retention"). The name
# carries the first 10 hex digits of the SHA-256 of the ConfigMap input files
# in generator order. A change creates a new Job and Flux prunes the old one.
# security/tests/test_wazuh_settings.py checks the name, and names the right
# one when it differs. The CronJob of settings-cronjob.yaml runs the same pod
# once a day.
#
# No ttlSecondsAfterFinished: Flux would make a deleted Job again and run it.
# The finished Job stays until its name changes. To run it again (after a
# failure), delete it: Flux makes it again at its next reconcile. The force
# annotation lets Flux replace the Job when an edit of this file changes its
# template, which a Job can not take in place.
apiVersion: batch/v1
kind: Job
metadata:
  name: wazuh-settings-git-5173a29574
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 0
  # The wait for the login (300 seconds), the wait for ISM (1200 seconds)
  # and the calls around them.
  activeDeadlineSeconds: 2100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh-settings
    spec:
      restartPolicy: Never
      # The job calls the indexer only, never the API server: no token.
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Placement and memory: ../../README.md.
      nodeSelector:
        kubernetes.io/hostname: ${SECURITY_NODE}
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wazuh-settings
          # The image of the converter and the API checks: the script uses
          # the Python standard library only.
          image: docker.io/library/python:3.15-alpine@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
          command: ["python3", "-u", "/app/settings.py"]
          args:
            - --indexer=https://wazuh-indexer.security.svc.cluster.local:9200
            - --ca=/ca/ca.crt
            - --retention=/app/retention.json
            - --notifications-enabled=/notifications/notifications-enabled
            - --monitor-cluster=${CLUSTER_NAME}
            - --user=tnwks-settings
            - --secret=/secrets/settings
            - --results=/results
            - --login-wait=300
            - --wait=1200
            # The renewBefore of the certificates of ../../wazuh/app/certificates.yaml.
            - --renew-before=720h
            - --margin=3600
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: files
              mountPath: /app
              readOnly: true
            - name: notifications
              mountPath: /notifications
              readOnly: true
            - name: ca
              mountPath: /ca
              readOnly: true
            - name: settings
              mountPath: /secrets/settings
              readOnly: true
            # The whole volume, not a subPath (security/converter/README.md).
            - name: results
              mountPath: /results
      volumes:
        - name: files
          configMap:
            name: wazuh-settings-files
        - name: notifications
          configMap:
            name: wazuh-notifications
            items:
              - key: notifications-enabled
                path: notifications-enabled
        # The certificate of the CA of the server, and not its key.
        - name: ca
          secret:
            secretName: wazuh-ca
            items:
              - key: ca.crt
                path: ca.crt
        # The password of tnwks-settings, and no other secret
        # (../../wazuh/README.md, "Secrets").
        - name: settings
          secret:
            secretName: wazuh-settings-user
            items:
              - key: password
                path: password
        - name: results
          persistentVolumeClaim:
            claimName: security-results
