---
# The settings of the Wazuh indexer from git (../wazuh/README.md): step 1, the
# accounts, at a change of its files, and step 2, the retention, at a change of
# its files and each day. homelab-wsl-02 only, with the server (../wazuh),
# which lists this file.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: security-wazuh-accounts
  namespace: flux-system
spec:
  dependsOn:
    # The CA Secret wazuh-ca, and the indexer it calls.
    - name: security-wazuh-server
  path: ./kubernetes/apps/security/wazuh-settings/accounts
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Ready only when the Job of step 1 completes, so security-wazuh-settings
  # applies step 2 after the rights of the current accounts.json. A failed
  # Job keeps this Kustomization not ready until the Job is deleted or a
  # merge renames it.
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 15m # more than the activeDeadlineSeconds of the Job (600)
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: security-wazuh-settings
  namespace: flux-system
spec:
  dependsOn:
    # The CA Secret wazuh-ca, and the indexer it calls.
    - name: security-wazuh-server
    # The claim security-results, where step 2 writes its counts.
    - name: security-converter
    # Step 1: the user tnwks-settings and its rights, and the network rule.
    - name: security-wazuh-accounts
    - name: alertmanager
  path: ./kubernetes/apps/security/wazuh-settings/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 3m
