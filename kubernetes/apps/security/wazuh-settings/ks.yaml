---
# The settings job of the Wazuh indexer (../wazuh/README.md): the accounts and the
# retention from git, each day. homelab-wsl-02 only, with the server
# (../wazuh). No cluster lists this file yet.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: security-wazuh-settings
  namespace: flux-system
spec:
  dependsOn:
    # The CA Secret wazuh-ca, and the indexer it calls.
    - name: security-wazuh-server
  path: ./kubernetes/apps/security/wazuh-settings/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 3m
