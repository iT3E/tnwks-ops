---
# Every 15 minutes, the cycle of the stream in security/registry/sources.yaml:
# the new files of the trail bucket -> the volume -> this site's Loki
# (scripts/trail_copy.py). A failed run raises KubeJobFailed. After a failure of
# S3 or Loki, or a 400 of Loki for the request, the next run takes the same
# files again, in their order. A file with a line that Loki refused for its
# time, or that can't be read, gets the name .bad: the run that found it fails
# one time, and the next runs pass it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trail-copy
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 7200
      # The script stops taking files after RUN_SECONDS, well before this.
      activeDeadlineSeconds: 840
      template:
        metadata:
          labels:
            app.kubernetes.io/name: trail-copy
        spec:
          # The job calls S3 and Loki, and never the API server: no token.
          automountServiceAccountToken: false
          restartPolicy: Never
          # Placement and memory: ../../README.md.
          nodeSelector:
            kubernetes.io/hostname: ${SECURITY_NODE}
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            # The volume is writable by this non-root user.
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: trail-copy
              # The image of the converter (../../converter): the script uses
              # the Python standard library only.
              image: docker.io/library/python:3.15-alpine@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
              command: ["python3", "-u", "/app/trail_copy.py"]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                # The output security_trail_bucket of environments/prod/aws
                # (cluster-settings).
                - name: TRAIL_BUCKET
                  value: "${SECURITY_TRAIL_BUCKET}"
                # This site's Loki, through its gateway, as the converter
                # reads it. Loki asks for no login inside the cluster.
                - name: LOKI_URL
                  value: http://loki-gateway.monitoring.svc.cluster.local
                - name: DATA_DIR
                  value: /data
                # Local copies stay 7 days.
                - name: KEEP_DAYS
                  value: "7"
                # The first run, and a run after a long stop, start 6 days
                # back: Loki refuses a line that is older than 7 days.
                - name: START_HOURS
                  value: "144"
                # The S3 requests (../README.md, "The cost"): a prefix with no
                # file in the last hour is listed each 4 hours, and the list of
                # prefixes is read again each hour, so a new account or Region
                # is found within about an hour.
                - name: QUIET_MINUTES
                  value: "240"
                - name: PREFIX_HOURS
                  value: "1"
              # The session of the trail reader role (../../aws-credentials):
              # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN and
              # AWS_REGION. A new pod each run, so it has the newest session.
              envFrom:
                - secretRef:
                    name: aws-security-trail-sts
              resources:
                requests:
                  cpu: 10m
                  memory: 48Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: scripts
                  mountPath: /app
                  readOnly: true
                - name: data
                  mountPath: /data
          volumes:
            - name: scripts
              configMap:
                name: trail-copy-scripts
            - name: data
              persistentVolumeClaim:
                claimName: trail-copy
