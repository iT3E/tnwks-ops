---
# What a run of the API checks may reach, on top of default-deny
# (../../namespace.yaml): DNS, the Prometheus of homelab-wsl on the address of
# its Windows host (the target of peer-federate), the release feed of the
# router's vendor, and the API of Terraform Cloud, on 443. Nothing calls it,
# and it calls no API server.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: api-checks
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: api-checks
  egress:
    # DNS through Cilium's DNS proxy, so that the rule below can name hosts.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
            # Both WSL clusters are one Cilium Cluster Mesh: name this cluster.
            io.cilium.k8s.policy.cluster: ${CLUSTER_NAME}
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toCIDR:
        - ${PEER_WINDOWS_HOST_ADDR}/32
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - toFQDNs:
        - matchName: cdn.mikrotik.com
        - matchName: app.terraform.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
