---
# Continuous WAN latency/loss probing (SuperQ/smokeping_prober). Unlike the
# blackbox `ping-cloudflare` probe (one ping every 30s), this sends 1 ping/s
# per target and exports histograms, so short bufferbloat episodes are
# actually captured. Alerts: kube-prometheus-stack/addons/alerts/wan-latency.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: smokeping-prober
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      smokeping-prober:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            # Unprivileged ICMP (SOCK_DGRAM), so no NET_RAW needed.
            sysctls:
              - name: net.ipv4.ping_group_range
                value: "0 2147483647"
        containers:
          app:
            image:
              repository: quay.io/superq/smokeping-prober
              tag: v0.12.0@sha256:2524b895bdae244984e937ecb8fdd755baedbf2bb108204bd1a1dc6732706303
            args:
              - --config.file=/etc/smokeping/smokeping.yaml
              # Fine buckets through 10-100ms (the default doubles 25.6 -> 51.2
              # -> 102.4ms), so quantiles can resolve "2x a 20ms baseline".
              - --buckets=0.0005,0.001,0.002,0.005,0.01,0.015,0.02,0.025,0.03,0.035,0.04,0.045,0.05,0.06,0.07,0.08,0.09,0.1,0.125,0.15,0.2,0.3,0.5,1,2
            env:
              GOMAXPROCS: "1"
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /-/healthy
                    port: 9374
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /-/healthy
                    port: 9374
            resources:
              requests:
                cpu: 10m
                memory: 20Mi
              limits:
                memory: 64Mi
    service:
      app:
        controller: smokeping-prober
        ports:
          http:
            port: 9374
    persistence:
      config:
        type: configMap
        name: smokeping-prober-config
        globalMounts:
          - path: /etc/smokeping
            readOnly: true
    serviceMonitor:
      app:
        enabled: ${SERVICE_MONITOR_ENABLED}
        serviceName: smokeping-prober
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 10s # 3 samples per 30s window for the fast latency rule
            scrapeTimeout: 5s
