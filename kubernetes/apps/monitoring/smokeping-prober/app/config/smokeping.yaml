---
# Continuous 1/s ICMP probes, recorded as Prometheus histograms.
# `role` drives the WAN latency alerts in
# kube-prometheus-stack/addons/alerts/wan-latency.yaml:
#   lan      the router (sce-rtr01): first hop, and the last one we own
#            before the ISP. Isolates WSL/docker/router trouble.
#   internet public anycast resolvers. >=2 of 3 must degrade to alert,
#            so one provider having a bad day stays quiet.
# protocol udp = unprivileged ICMP echo via SOCK_DGRAM; needs
# net.ipv4.ping_group_range (set on the pod) and no capabilities.
targets:
  - hosts: ["10.10.91.1"]
    interval: 1s
    network: ip4
    protocol: udp
    labels:
      role: lan
      name: sce-rtr01
  - hosts: ["1.1.1.1"]
    interval: 1s
    network: ip4
    protocol: udp
    labels:
      role: internet
      name: cloudflare
  - hosts: ["8.8.8.8"]
    interval: 1s
    network: ip4
    protocol: udp
    labels:
      role: internet
      name: google
  - hosts: ["9.9.9.9"]
    interval: 1s
    network: ip4
    protocol: udp
    labels:
      role: internet
      name: quad9
