---
# Continuous 1/s ICMP probes, recorded as Prometheus histograms.
# `role` drives the WAN latency alerts in
# kube-prometheus-stack/addons/alerts/wan-latency.yaml:
#   lan      the router (sce-rtr01): first hop, and the last one we own
#            before the ISP. Isolates WSL/docker/router trouble.
#   internet public anycast resolvers. >=2 of 3 must degrade to alert,
#            so one provider having a bad day stays quiet.
#   ap       the UniFi APs' management addresses (VLAN 900), named like
#            unpoller's `name` label. Alert: WifiAPUnreachable in
#            kube-prometheus-stack/addons/alerts/wifi.yaml.
#   switch   SW03, the switch every AP hangs off. Tells "one AP
#            is down" apart from "the path to the management VLANs is down".
#   edge     the EP-R6 (sce-ep01, VLAN 140), the gateway of the radio network
#            10.60.10.0/24. Alert: RadioGatewayUnreachable in
#            kube-prometheus-stack/addons/alerts/radio-gateway.yaml.
#   radio    the two ends of the radio link behind the EP-R6, in path order:
#            liteap-gps (LiteAP GPS, 10.60.10.45, the AP end beside the
#            EP-R6) and litebeam-5ac (LiteBeam 5AC, 10.60.10.43, the station
#            end). Its own role, so nothing that selects edge, ap or switch
#            picks them up. Alerts: RadioAPUnreachable and
#            RadioStationUnreachable in radio-gateway.yaml. The airCube
#            (10.60.10.46) isn't a target: it rejects pings on its WAN side
#            (ICMP port unreachable), so it would read as 100% lost.
# The ap/switch/edge/radio pings leave as the desktop (10.10.91.142); the
# router allows ICMP from it to the 3 APs, SW03, the EP-R6 and the devices
# behind it (mikrotik MONITORING_ZONE_RULES). With the desktop's wg01-home
# tunnel up, the WSL host routes them through it.
# protocol udp = unprivileged ICMP echo via SOCK_DGRAM; needs
# net.ipv4.ping_group_range (set on the pod) and no capabilities.
targets:
  - hosts: ["10.10.91.1"]
    interval: 1s
    network: ip4
    protocol: udp
    labels:
      role: lan
      name: sce-rtr01
  - hosts: ["1.1.1.1"]
    interval: 1s
    network: ip4
    protocol: udp
    labels:
      role: internet
      name: cloudflare
  - hosts: ["8.8.8.8"]
    interval: 1s
    network: ip4
    protocol: udp
    labels:
      role: internet
      name: google
  - hosts: ["9.9.9.9"]
    interval: 1s
    network: ip4
    protocol: udp
    labels:
      role: internet
      name: quad9
  - hosts: ["10.10.90.11"]
    interval: 1s
    network: ip4
    protocol: udp
    labels:
      role: ap
      name: AP Kitchen
  - hosts: ["10.10.90.12"]
    interval: 1s
    network: ip4
    protocol: udp
    labels:
      role: ap
      name: AP Master
  - hosts: ["10.10.90.13"]
    interval: 1s
    network: ip4
    protocol: udp
    labels:
      role: ap
      name: AP Living Room
  - hosts: ["10.98.0.251"]
    interval: 1s
    network: ip4
    protocol: udp
    labels:
      role: switch
      name: sw03
  - hosts: ["10.10.140.140"]
    interval: 1s
    network: ip4
    protocol: udp
    labels:
      role: edge
      name: sce-ep01
  - hosts: ["10.60.10.45"]
    interval: 1s
    network: ip4
    protocol: udp
    labels:
      role: radio
      name: liteap-gps
  - hosts: ["10.60.10.43"]
    interval: 1s
    network: ip4
    protocol: udp
    labels:
      role: radio
      name: litebeam-5ac
