---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - ./secret.sops.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: mktxp-config
    files:
      - mktxp.conf=./config/mktxp.conf
      - _mktxp.conf=./config/_mktxp.conf
generatorOptions:
  disableNameSuffixHash: true
