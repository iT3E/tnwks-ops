---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: alloy
      version: 1.16.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 30m
  values:
    # Central collector for browser RUM, not a per-node agent — run a single
    # Deployment replica rather than the chart's default DaemonSet.
    controller:
      type: deployment
      replicas: 1

    alloy:
      # WAL/data is ephemeral (Faro telemetry is forwarded straight through to
      # Tempo/Loki, nothing is buffered long-term), so the default emptyDir at
      # /tmp/alloy is fine.
      configMap:
        create: true
        content: |-
          // ---------------------------------------------------------------
          // Faro receiver — the HTTP endpoint browser JS (the Faro SDK) POSTs
          // RUM payloads to. Split into traces -> Tempo and logs/exceptions ->
          // Loki below. uiPathPrefix-style routing isn't needed; the ingress
          // sends the whole host to this port.
          // ---------------------------------------------------------------
          faro.receiver "frontend" {
            server {
              listen_address           = "0.0.0.0"
              listen_port              = 12347
              cors_allowed_origins     = ["https://sites.${SECRET_DOMAIN}"]
              max_allowed_payload_size = "10MiB"
            }

            output {
              logs   = [loki.write.faro.receiver]
              traces = [otelcol.exporter.otlp.tempo.input]
            }
          }

          // Frontend logs + exceptions -> Loki gateway. The receiver attaches
          // app/session/page labels from the Faro payload.
          loki.write "faro" {
            endpoint {
              url = "http://loki-gateway.monitoring.svc.cluster.local:80/loki/api/v1/push"
            }
          }

          // ---------------------------------------------------------------
          // OTLP/HTTP receiver for the agent platform's traces
          // (docs/apps/agent-platform.md). Each span goes through
          // drop_text first, so no prompt, model output, tool input or
          // output, or memory text reaches Tempo. The receiver has no
          // ingress; its network rule (networkpolicy.yaml) admits the agent
          // pods, the sandbox supervisors of agents-workflows and the test
          // span only, and each agent reaches it through its egress policy.
          // ---------------------------------------------------------------
          otelcol.receiver.otlp "agents" {
            http {
              endpoint = "0.0.0.0:4318"
            }

            output {
              traces  = [otelcol.processor.transform.drop_text.input]
              metrics = [otelcol.processor.filter.agent_metrics.input]
            }
          }

          // ---------------------------------------------------------------
          // The metrics of the product (step 3 of the AI board, Design Doc
          // 0003 section 4.2.8, "The keep list of step 3";
          // docs/apps/agent-platform.md, "Metrics"). Each other instrument
          // is dropped here, then agent_metrics keeps only the listed labels
          // of each instrument, writes "other" for a value that is not
          // declared, and cuts the resource to service.name. Prometheus
          // takes the result on its OTLP path, which its network rule opens
          // to this pod only.
          // ---------------------------------------------------------------
          otelcol.processor.filter "agent_metrics" {
            error_mode = "propagate"

            metrics {
              metric = [
                `not IsMatch(name, "^openclaw\\.(message\\.received|message\\.processed|message\\.delivery\\.started|message\\.delivery\\.duration_ms|tokens|session\\.turn\\.created|session\\.stuck|model\\.failover)$")`,
              ]
            }

            output {
              metrics = [otelcol.processor.transform.agent_metrics.input]
            }
          }

          // propagate: a statement that fails drops the whole batch, so a
          // value that a statement can not read never passes unchecked.
          otelcol.processor.transform "agent_metrics" {
            error_mode = "propagate"

            // The resource: service.name only (openclaw-agents-<domain>, set
            // in the config of each agent), or "undeclared". So target_info
            // gets no label, and job names the trust domain.
            metric_statements {
              context    = "resource"
              statements = [
                `keep_keys(attributes, ["service.name"])`,
                `set(attributes["service.name"], "undeclared") where attributes["service.name"] == nil`,
                `set(attributes["service.name"], "undeclared") where not IsMatch(attributes["service.name"], "^openclaw-agents-(pilot|finance|main)$")`,
              ]
            }

            // The scope: no attribute, and no version.
            metric_statements {
              context    = "scope"
              statements = [
                `keep_keys(attributes, [])`,
                `set(version, "")`,
              ]
            }

            // The labels that each instrument keeps (the table of the
            // design), then the declared values of each label. The site is
            // set here, as the scrape class does for each scrape.
            metric_statements {
              context    = "datapoint"
              statements = [
                `keep_keys(attributes, ["openclaw.channel", "openclaw.source"]) where metric.name == "openclaw.message.received"`,
                `keep_keys(attributes, ["openclaw.channel", "openclaw.outcome"]) where metric.name == "openclaw.message.processed"`,
                `keep_keys(attributes, ["openclaw.channel", "openclaw.delivery.kind"]) where metric.name == "openclaw.message.delivery.started"`,
                `keep_keys(attributes, ["openclaw.channel", "openclaw.delivery.kind", "openclaw.outcome", "openclaw.errorCategory"]) where metric.name == "openclaw.message.delivery.duration_ms"`,
                `keep_keys(attributes, ["openclaw.agent", "openclaw.channel", "openclaw.provider", "openclaw.model", "openclaw.token"]) where metric.name == "openclaw.tokens"`,
                `keep_keys(attributes, ["openclaw.agent", "openclaw.channel", "openclaw.trigger"]) where metric.name == "openclaw.session.turn.created"`,
                `keep_keys(attributes, ["openclaw.state"]) where metric.name == "openclaw.session.stuck"`,
                `keep_keys(attributes, ["openclaw.provider", "openclaw.model", "openclaw.failover.to_provider", "openclaw.failover.to_model"]) where metric.name == "openclaw.model.failover"`,
                `set(attributes["openclaw.channel"], "other") where attributes["openclaw.channel"] != nil and not IsMatch(attributes["openclaw.channel"], "^(telegram|signal|webchat|unknown)$")`,
                `set(attributes["openclaw.source"], "other") where attributes["openclaw.source"] != nil and not IsMatch(attributes["openclaw.source"], "^(dispatchInboundMessage|message|missing|unknown)$")`,
                `set(attributes["openclaw.outcome"], "other") where attributes["openclaw.outcome"] != nil and not IsMatch(attributes["openclaw.outcome"], "^(completed|skipped|error|unknown)$")`,
                `set(attributes["openclaw.delivery.kind"], "other") where attributes["openclaw.delivery.kind"] != nil and not IsMatch(attributes["openclaw.delivery.kind"], "^(text|media|other)$")`,
                `set(attributes["openclaw.errorCategory"], "other") where attributes["openclaw.errorCategory"] != nil and not IsMatch(attributes["openclaw.errorCategory"], "^(Error|TypeError|RangeError|AggregateError|unknown)$")`,
                `set(attributes["openclaw.agent"], "other") where attributes["openclaw.agent"] != nil and not IsMatch(attributes["openclaw.agent"], "^(main|unknown)$")`,
                `set(attributes["openclaw.provider"], "other") where attributes["openclaw.provider"] != nil and not IsMatch(attributes["openclaw.provider"], "^(litellm|unknown)$")`,
                `set(attributes["openclaw.failover.to_provider"], "other") where attributes["openclaw.failover.to_provider"] != nil and not IsMatch(attributes["openclaw.failover.to_provider"], "^(litellm|unknown)$")`,
                `set(attributes["openclaw.model"], "other") where attributes["openclaw.model"] != nil and not IsMatch(attributes["openclaw.model"], "^(agents-pilot|agents-finance|agents-main|unknown)$")`,
                `set(attributes["openclaw.failover.to_model"], "other") where attributes["openclaw.failover.to_model"] != nil and not IsMatch(attributes["openclaw.failover.to_model"], "^(agents-pilot|agents-finance|agents-main|unknown)$")`,
                `set(attributes["openclaw.token"], "other") where attributes["openclaw.token"] != nil and not IsMatch(attributes["openclaw.token"], "^(input|output|cache_read|cache_write|prompt|total)$")`,
                `set(attributes["openclaw.trigger"], "other") where attributes["openclaw.trigger"] != nil and not IsMatch(attributes["openclaw.trigger"], "^(user|heartbeat|event|cron|unknown)$")`,
                `set(attributes["openclaw.state"], "other") where attributes["openclaw.state"] != nil and not IsMatch(attributes["openclaw.state"], "^(idle|processing|waiting|unknown)$")`,
                `set(attributes["k8s_cluster"], "${CLUSTER_NAME}")`,
              ]
            }

            output {
              metrics = [otelcol.exporter.otlphttp.prometheus.input]
            }
          }

          // The OTLP path of this site's Prometheus (enableOTLPReceiver in
          // kube-prometheus-stack/app/helmrelease.yaml). The exporter adds
          // /v1/metrics: /api/v1/otlp/v1/metrics.
          otelcol.exporter.otlphttp "prometheus" {
            client {
              endpoint = "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/otlp"
              tls {
                insecure = true
              }
            }
          }

          // Removes the text attributes of the OpenTelemetry conventions for
          // generative AI (old and new names), of OpenInference, and of agent
          // memory, from spans and span events. Every attribute of an event
          // named gen_ai.* or memory.* goes too: those events carry messages.
          // Token counts, model names, timings and tool names stay. The
          // CronJob trace-filter-check sends a span with a marker text in
          // each of these places every day and fails if Tempo has it.
          otelcol.processor.transform "drop_text" {
            error_mode = "ignore"

            trace_statements {
              context    = "span"
              statements = [
                `delete_matching_keys(attributes, "^(gen_ai\\.(prompt|completion|input\\.messages|output\\.messages|system_instructions|tool\\.call\\.arguments|tool\\.call\\.result)|input\\.value|output\\.value|llm\\.(input|output)_messages|memory\\.(query|results|content))(\\..*)?$")`,
              ]
            }

            trace_statements {
              context    = "spanevent"
              statements = [
                `delete_matching_keys(attributes, "^(gen_ai\\.(prompt|completion|input\\.messages|output\\.messages|system_instructions|tool\\.call\\.arguments|tool\\.call\\.result)|input\\.value|output\\.value|llm\\.(input|output)_messages|memory\\.(query|results|content))(\\..*)?$")`,
                `delete_matching_keys(attributes, ".*") where IsMatch(name, "^(gen_ai|memory)\\.")`,
              ]
            }

            output {
              traces = [otelcol.exporter.otlp.tempo.input]
            }
          }

          // Frontend and agent traces -> Tempo over OTLP gRPC. tls.insecure
          // because this is an in-cluster plaintext hop.
          otelcol.exporter.otlp "tempo" {
            client {
              endpoint = "tempo.monitoring.svc.cluster.local:4317"
              tls {
                insecure = true
              }
            }
          }

      # Expose the Faro receiver port on the container + Service so the ingress
      # below (and in-cluster clients) can reach it. 12345 (UI/metrics) is
      # exposed automatically by enableHttpServerPort.
      extraPorts:
        - name: faro
          port: 12347
          targetPort: 12347
          protocol: TCP
        # The agent platform's traces (otelcol.receiver.otlp "agents").
        - name: otlp-http
          port: 4318
          targetPort: 4318
          protocol: TCP

      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi

    # PUBLIC ingress for the Faro port. Browser JS on sites.${SECRET_DOMAIN}
    # POSTs telemetry here, so it must be reachable from the LAN/internet, not
    # just internally — hence the `nginx` (external, cloudflared-fronted) class
    # and the public ${SECRET_DOMAIN}, matching the sites it serves. The chart
    # points this Ingress at faroPort automatically.
    ingress:
      enabled: true
      ingressClassName: nginx
      faroPort: 12347
      hosts:
        - faro.${SECRET_DOMAIN}
      path: /
      pathType: Prefix
      tls:
        - hosts:
            - faro.${SECRET_DOMAIN}

    serviceMonitor:
      enabled: ${SERVICE_MONITOR_ENABLED}
