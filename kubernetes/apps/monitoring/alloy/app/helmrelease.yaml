---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: alloy
      version: 1.15.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 30m
  values:
    # Central collector for browser RUM, not a per-node agent — run a single
    # Deployment replica rather than the chart's default DaemonSet.
    controller:
      type: deployment
      replicas: 1

    alloy:
      # WAL/data is ephemeral (Faro telemetry is forwarded straight through to
      # Tempo/Loki, nothing is buffered long-term), so the default emptyDir at
      # /tmp/alloy is fine.
      configMap:
        create: true
        content: |-
          // ---------------------------------------------------------------
          // Faro receiver — the HTTP endpoint browser JS (the Faro SDK) POSTs
          // RUM payloads to. Split into traces -> Tempo and logs/exceptions ->
          // Loki below. uiPathPrefix-style routing isn't needed; the ingress
          // sends the whole host to this port.
          // ---------------------------------------------------------------
          faro.receiver "frontend" {
            server {
              listen_address           = "0.0.0.0"
              listen_port              = 12347
              cors_allowed_origins     = ["https://sites.${SECRET_DOMAIN}"]
              max_allowed_payload_size = "10MiB"
            }

            output {
              logs   = [loki.write.faro.receiver]
              traces = [otelcol.exporter.otlp.tempo.input]
            }
          }

          // Frontend logs + exceptions -> Loki gateway. The receiver attaches
          // app/session/page labels from the Faro payload.
          loki.write "faro" {
            endpoint {
              url = "http://loki-gateway.monitoring.svc.cluster.local:80/loki/api/v1/push"
            }
          }

          // ---------------------------------------------------------------
          // OTLP/HTTP receiver for the agent platform's traces
          // (docs/apps/agent-platform.md). Each span goes through
          // drop_text first, so no prompt, model output, tool input or
          // output, or memory text reaches Tempo. The receiver has no
          // ingress; agent pods reach it through their own egress policy.
          // ---------------------------------------------------------------
          otelcol.receiver.otlp "agents" {
            http {
              endpoint = "0.0.0.0:4318"
            }

            output {
              traces = [otelcol.processor.transform.drop_text.input]
            }
          }

          // Removes the text attributes of the OpenTelemetry conventions for
          // generative AI (old and new names), of OpenInference, and of agent
          // memory, from spans and span events. Every attribute of an event
          // named gen_ai.* or memory.* goes too: those events carry messages.
          // Token counts, model names, timings and tool names stay. The
          // CronJob trace-filter-check sends a span with a marker text in
          // each of these places every day and fails if Tempo has it.
          otelcol.processor.transform "drop_text" {
            error_mode = "ignore"

            trace_statements {
              context    = "span"
              statements = [
                `delete_matching_keys(attributes, "^(gen_ai\\.(prompt|completion|input\\.messages|output\\.messages|system_instructions|tool\\.call\\.arguments|tool\\.call\\.result)|input\\.value|output\\.value|llm\\.(input|output)_messages|memory\\.(query|results|content))(\\..*)?$")`,
              ]
            }

            trace_statements {
              context    = "spanevent"
              statements = [
                `delete_matching_keys(attributes, "^(gen_ai\\.(prompt|completion|input\\.messages|output\\.messages|system_instructions|tool\\.call\\.arguments|tool\\.call\\.result)|input\\.value|output\\.value|llm\\.(input|output)_messages|memory\\.(query|results|content))(\\..*)?$")`,
                `delete_matching_keys(attributes, ".*") where IsMatch(name, "^(gen_ai|memory)\\.")`,
              ]
            }

            output {
              traces = [otelcol.exporter.otlp.tempo.input]
            }
          }

          // Frontend and agent traces -> Tempo over OTLP gRPC. tls.insecure
          // because this is an in-cluster plaintext hop.
          otelcol.exporter.otlp "tempo" {
            client {
              endpoint = "tempo.monitoring.svc.cluster.local:4317"
              tls {
                insecure = true
              }
            }
          }

      # Expose the Faro receiver port on the container + Service so the ingress
      # below (and in-cluster clients) can reach it. 12345 (UI/metrics) is
      # exposed automatically by enableHttpServerPort.
      extraPorts:
        - name: faro
          port: 12347
          targetPort: 12347
          protocol: TCP
        # The agent platform's traces (otelcol.receiver.otlp "agents").
        - name: otlp-http
          port: 4318
          targetPort: 4318
          protocol: TCP

      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi

    # PUBLIC ingress for the Faro port. Browser JS on sites.${SECRET_DOMAIN}
    # POSTs telemetry here, so it must be reachable from the LAN/internet, not
    # just internally — hence the `nginx` (external, cloudflared-fronted) class
    # and the public ${SECRET_DOMAIN}, matching the sites it serves. The chart
    # points this Ingress at faroPort automatically.
    ingress:
      enabled: true
      ingressClassName: nginx
      faroPort: 12347
      hosts:
        - faro.${SECRET_DOMAIN}
      path: /
      pathType: Prefix
      tls:
        - hosts:
            - faro.${SECRET_DOMAIN}

    serviceMonitor:
      enabled: ${SERVICE_MONITOR_ENABLED}
