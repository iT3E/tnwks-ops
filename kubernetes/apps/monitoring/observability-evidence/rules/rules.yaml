---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-observability
  namespace: monitoring
spec:
  groups:
  - name: homelab.evidence
    interval: 1m
    rules:
    - record: homelab:site_reporting
      expr: (max by (k8s_cluster) (homelab_collection_success{collector="workloads"}) == bool 1) * on (k8s_cluster)
        (time() - max by (k8s_cluster) (homelab_collection_last_success_timestamp_seconds{collector="workloads"})
        < bool 180) * on (k8s_cluster) (time() - max by (k8s_cluster) (homelab_collection_last_success_timestamp_seconds{collector="workloads"})
        >= bool 0)
    - record: homelab:site_state
      expr: (homelab:site_reporting == 1) or on (k8s_cluster) (0 * max by (k8s_cluster) (homelab_expected_site_info))
    - record: homelab:database_in_recovery
      expr: max by (k8s_cluster, namespace, db_cluster) (label_replace(cnpg_pg_replication_in_recovery{source_site=""},
        "db_cluster", "$1", "pod", "(.+)-[0-9]+"))
    - record: homelab:database_replay_lag_seconds
      expr: max by (k8s_cluster, namespace, db_cluster) (label_replace(cnpg_pg_replication_lag{source_site=""},
        "db_cluster", "$1", "pod", "(.+)-[0-9]+"))
    - record: homelab:database_connections
      expr: sum by (k8s_cluster, namespace, db_cluster) (label_replace(cnpg_backends_total{source_site=""}, "db_cluster",
        "$1", "pod", "(.+)-[0-9]+"))
    - record: homelab:database_backup_age_seconds
      expr: time() - max by (k8s_cluster, namespace, db_cluster) (label_replace(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{source_site=""},
        "db_cluster", "$1", "pod", "(.+)-[0-9]+"))
    - record: homelab:database_backup_state
      expr: ((homelab:database_backup_age_seconds >= bool 0) * (homelab:database_backup_age_seconds <= bool 108000)
        + 3 * (homelab:database_backup_age_seconds > bool 108000)) or on (k8s_cluster, namespace, db_cluster) (0
        * max by (k8s_cluster, namespace, db_cluster) (homelab_expected_database_info))
    - record: homelab:recovery_state
      expr: (3 * max by (k8s_cluster, app) ((homelab_recovery_prerequisite_state and (time() - timestamp(homelab_recovery_prerequisite_state)
        < 180)) == 3) / 3) or on (k8s_cluster, app) ((count by (k8s_cluster, app) (max by (k8s_cluster, app, prerequisite)
        ((homelab_recovery_prerequisite_state{prerequisite=~"database|backup|restore|fence"} and (time() - timestamp(homelab_recovery_prerequisite_state{prerequisite=~"database|backup|restore|fence"})
        < 180))) == 1) == 4) / 4) or on (k8s_cluster, app) (0 * max by (k8s_cluster, app) (homelab_expected_workload_info{tier="warm"}))
    - record: homelab:local_history_seconds
      expr: time() - min by (k8s_cluster) (prometheus_tsdb_lowest_timestamp_seconds)
    - record: homelab:slo_window_coverage_ratio
      expr: clamp_max(homelab:local_history_seconds / 1209600, 1)
    - record: homelab:archive_lag_seconds
      expr: time() - max by (k8s_cluster) ((homelab_archive_newest_sample_timestamp_seconds and (time() - timestamp(homelab_archive_newest_sample_timestamp_seconds)
        < 180)))
    - record: homelab:archive_history_seconds
      expr: time() - min by (k8s_cluster) ((homelab_archive_oldest_sample_timestamp_seconds and (time() - timestamp(homelab_archive_oldest_sample_timestamp_seconds)
        < 180)))
    - record: homelab:archive_free_ratio
      expr: min by (k8s_cluster) (garage_local_disk_avail{volume="data"} / garage_local_disk_total{volume="data"})
    - record: homelab:unuploaded_block_age_seconds
      expr: time() - max by (k8s_cluster) (thanos_objstore_bucket_last_successful_upload_time{job=~".*thanos-discovery"}
        > 0)
    - record: homelab:archive_state
      expr: (3 - 2 * min by (k8s_cluster) (probe_success{observability_target="archive"} and (time() - timestamp(probe_success{observability_target="archive"}))
        < 180)) or on (k8s_cluster) (0 * max by (k8s_cluster) (homelab_observer_info))
    - record: homelab:mqtt_state
      expr: (3 - 2 * min by (k8s_cluster) (probe_success{observability_target="mqtt"} and (time() - timestamp(probe_success{observability_target="mqtt"}))
        < 180)) or on (k8s_cluster) (0 * max by (k8s_cluster) (homelab_observer_info))
    - record: homelab:internet_state
      expr: (3 - 2 * min by (k8s_cluster) (probe_success{observability_target="internet"} and (time() - timestamp(probe_success{observability_target="internet"}))
        < 180)) or on (k8s_cluster) (0 * max by (k8s_cluster) (homelab_observer_info))
    - record: homelab:workload_state
      expr: 0 * max by (k8s_cluster, app) (homelab_workload_present == 0) or (sum by (k8s_cluster, app) (max by
        (k8s_cluster, app, kind, workload) ((homelab_workload_desired_replicas and (time() - timestamp(homelab_workload_desired_replicas)
        < 180)))) == 0) + 4 or (((sum by (k8s_cluster, app) (max by (k8s_cluster, app, kind, workload) ((homelab_workload_ready_replicas
        and (time() - timestamp(homelab_workload_ready_replicas) < 180)))) >= sum by (k8s_cluster, app) (max by
        (k8s_cluster, app, kind, workload) ((homelab_workload_desired_replicas and (time() - timestamp(homelab_workload_desired_replicas)
        < 180))))) * 0) + 1) or (((sum by (k8s_cluster, app) (max by (k8s_cluster, app, kind, workload) ((homelab_workload_ready_replicas
        and (time() - timestamp(homelab_workload_ready_replicas) < 180)))) < sum by (k8s_cluster, app) (max by (k8s_cluster,
        app, kind, workload) ((homelab_workload_desired_replicas and (time() - timestamp(homelab_workload_desired_replicas)
        < 180))))) > 0) * 0 + 2) or ((sum by (k8s_cluster, app) (max by (k8s_cluster, app, kind, workload) ((homelab_workload_ready_replicas
        and (time() - timestamp(homelab_workload_ready_replicas) < 180)))) < sum by (k8s_cluster, app) (max by (k8s_cluster,
        app, kind, workload) ((homelab_workload_desired_replicas and (time() - timestamp(homelab_workload_desired_replicas)
        < 180))))) * 0 + 3) or on (k8s_cluster, app) (0 * max by (k8s_cluster, app) (homelab_expected_workload_info))
    - record: homelab:app_pvc_backup_age_seconds
      expr: ((time() - max by (k8s_cluster, namespace, policy) (kopiur_policy_last_backup_success_timestamp_seconds))
        >= 0) * on (k8s_cluster, namespace, policy) group_right max by (k8s_cluster, namespace, policy, app, pvc)
        ((homelab_app_backup_scheduled and (time() - timestamp(homelab_app_backup_scheduled) < 180)) == 1)
    - record: homelab:app_backup_age_seconds
      expr: max by (k8s_cluster, app) (homelab:app_pvc_backup_age_seconds or ((homelab:database_backup_age_seconds
        >= 0) * on (k8s_cluster, namespace, db_cluster) group_right max by (k8s_cluster, namespace, db_cluster,
        app) (max by (k8s_cluster, namespace, db_cluster, app) (homelab_expected_database_info) and on (k8s_cluster,
        namespace, db_cluster) (homelab:database_in_recovery == 0))))
    - record: homelab:app_rpo_state
      expr: (0 * (max by (k8s_cluster, app) (max by (k8s_cluster, namespace, policy, app, pvc) ((homelab_app_backup_scheduled
        and (time() - timestamp(homelab_app_backup_scheduled) < 180)) == 1) unless on (k8s_cluster, app, pvc) homelab:app_pvc_backup_age_seconds)
        or max by (k8s_cluster, app) (max by (k8s_cluster, namespace, db_cluster, app) (homelab_expected_database_info)
        and on (k8s_cluster, namespace, db_cluster) (homelab:database_in_recovery == 0) unless on (k8s_cluster,
        namespace, db_cluster) (homelab:database_backup_age_seconds >= 0)))) or ((homelab:app_backup_age_seconds
        <= bool on (k8s_cluster, app) max by (k8s_cluster, app) (homelab_app_recovery_objective_seconds{objective="rpo"}))
        + 3 * (homelab:app_backup_age_seconds > bool on (k8s_cluster, app) max by (k8s_cluster, app) (homelab_app_recovery_objective_seconds{objective="rpo"})))
    - record: homelab:app_rto_state
      expr: ((max by (k8s_cluster, app) ((homelab_restore_last_duration_seconds and (time() - timestamp(homelab_restore_last_duration_seconds)
        < 180))) <= bool on (k8s_cluster, app) max by (k8s_cluster, app) (homelab_app_recovery_objective_seconds{objective="rto"}))
        + 3 * (max by (k8s_cluster, app) ((homelab_restore_last_duration_seconds and (time() - timestamp(homelab_restore_last_duration_seconds)
        < 180))) > bool on (k8s_cluster, app) max by (k8s_cluster, app) (homelab_app_recovery_objective_seconds{objective="rto"})))
        or on (k8s_cluster, app) (0 * max by (k8s_cluster, app) (homelab_app_recovery_objective_seconds{objective="rto"}))
    - record: homelab:other_database_state
      expr: (max by (k8s_cluster, namespace, workload, engine, app) (homelab_expected_other_database_info) * 0 +
        4) and on (k8s_cluster, namespace, workload) (max by (k8s_cluster, namespace, workload) (label_replace(kube_statefulset_replicas,
        "workload", "$1", "statefulset", "(.+)") or label_replace(kube_deployment_spec_replicas, "workload", "$1",
        "deployment", "(.+)")) == 0) or (max by (k8s_cluster, namespace, workload, engine, app) (homelab_expected_other_database_info)
        * 0 + 1) and on (k8s_cluster, namespace, workload) ((max by (k8s_cluster, namespace, workload) (label_replace(kube_statefulset_status_replicas_ready,
        "workload", "$1", "statefulset", "(.+)") or label_replace(kube_deployment_status_replicas_available, "workload",
        "$1", "deployment", "(.+)")) >= max by (k8s_cluster, namespace, workload) (label_replace(kube_statefulset_replicas,
        "workload", "$1", "statefulset", "(.+)") or label_replace(kube_deployment_spec_replicas, "workload", "$1",
        "deployment", "(.+)"))) > 0) or (max by (k8s_cluster, namespace, workload, engine, app) (homelab_expected_other_database_info)
        * 0 + 3) and on (k8s_cluster, namespace, workload) (max by (k8s_cluster, namespace, workload) (label_replace(kube_statefulset_status_replicas_ready,
        "workload", "$1", "statefulset", "(.+)") or label_replace(kube_deployment_status_replicas_available, "workload",
        "$1", "deployment", "(.+)")) < max by (k8s_cluster, namespace, workload) (label_replace(kube_statefulset_replicas,
        "workload", "$1", "statefulset", "(.+)") or label_replace(kube_deployment_spec_replicas, "workload", "$1",
        "deployment", "(.+)"))) or (max by (k8s_cluster, namespace, workload, engine, app) (homelab_expected_other_database_info)
        * 0)
    - record: homelab:network_path_state
      expr: (label_replace(label_replace(3 - 2 * (min(mktxp_last_handshake{interface="wg-site1"}) < bool 180), "k8s_cluster",
        "homelab-wsl", "", "") or label_replace(3 - 2 * (min(mktxp_last_handshake{interface="wg-site2"}) < bool
        180), "k8s_cluster", "homelab-wsl-02", "", ""), "hop", "tunnel", "", "") or label_replace(label_replace((3
        - 2 * max(mktxp_bgp_established{name=~"wsl-site1(-[0-9]+)?"})) or (0 * max(mktxp_system_uptime) + 3), "k8s_cluster",
        "homelab-wsl", "", "") or label_replace((3 - 2 * max(mktxp_bgp_established{name=~"wsl-site2(-[0-9]+)?"}))
        or (0 * max(mktxp_system_uptime) + 3), "k8s_cluster", "homelab-wsl-02", "", ""), "hop", "router-bgp", "",
        "") or label_replace(3 - (min by (k8s_cluster) (cilium_bgp_control_plane_session_state{source_site=""})
        == bool 1) - (max by (k8s_cluster) (cilium_bgp_control_plane_session_state{source_site=""}) == bool 1),
        "hop", "node-bgp", "", "") or label_replace(3 - 2 * (((min by (k8s_cluster) (label_replace(cilium_clustermesh_remote_cluster_readiness_status{source_site=""},
        "reader", "agent", "", "") or label_replace(cilium_kvstoremesh_remote_cluster_readiness_status{source_site=""},
        "reader", "kvstoremesh", "", "")) == bool 1) * on (k8s_cluster) min by (k8s_cluster) (label_replace(homelab_peer_probe_success{source_site=""},
        "k8s_cluster", "$1", "observer_cluster", "(.+)"))) or (min by (k8s_cluster) (label_replace(cilium_clustermesh_remote_cluster_readiness_status{source_site=""},
        "reader", "agent", "", "") or label_replace(cilium_kvstoremesh_remote_cluster_readiness_status{source_site=""},
        "reader", "kvstoremesh", "", "")) == bool 1)), "hop", "mesh", "", "")) or on (k8s_cluster, hop) (label_replace(0
        * max by (k8s_cluster) (homelab_expected_site_info), "hop", "tunnel", "", "") or label_replace(0 * max by
        (k8s_cluster) (homelab_expected_site_info), "hop", "router-bgp", "", "") or label_replace(0 * max by (k8s_cluster)
        (homelab_expected_site_info), "hop", "node-bgp", "", "") or label_replace(0 * max by (k8s_cluster) (homelab_expected_site_info),
        "hop", "mesh", "", ""))
    - record: homelab:router_bgp_prefixes
      expr: label_replace(sum(mktxp_bgp_prefix_count{name=~"wsl-site1(-[0-9]+)?"}), "k8s_cluster", "homelab-wsl",
        "", "") or label_replace(sum(mktxp_bgp_prefix_count{name=~"wsl-site2(-[0-9]+)?"}), "k8s_cluster", "homelab-wsl-02",
        "", "")
    - record: homelab:shared_vip_route
      expr: label_replace(label_replace(((min(homelab:network_path_state{hop="router-bgp",k8s_cluster="homelab-wsl"}
        > 0) == bool 1) * (sum(mktxp_bgp_prefix_count{name=~"wsl-site1(-[0-9]+)?"}) > bool 0)), "k8s_cluster", "homelab-wsl",
        "", ""), "vip", "10.10.95.10", "", "") or label_replace(label_replace(((min(homelab:network_path_state{hop="router-bgp",k8s_cluster="homelab-wsl-02"}
        > 0) == bool 1) * (sum(mktxp_bgp_prefix_count{name=~"wsl-site2(-[0-9]+)?"}) > bool 0)) * (((min(homelab:network_path_state{hop="router-bgp",k8s_cluster="homelab-wsl"}
        > 0) == bool 1) * (sum(mktxp_bgp_prefix_count{name=~"wsl-site1(-[0-9]+)?"}) > bool 0)) != bool 1), "k8s_cluster",
        "homelab-wsl-02", "", ""), "vip", "10.10.95.10", "", "") or label_replace(label_replace(((min(homelab:network_path_state{hop="router-bgp",k8s_cluster="homelab-wsl-02"}
        > 0) == bool 1) * (sum(mktxp_bgp_prefix_count{name=~"wsl-site2(-[0-9]+)?"}) > bool 0)), "k8s_cluster", "homelab-wsl-02",
        "", ""), "vip", "10.10.95.200", "", "") or label_replace(label_replace(((min(homelab:network_path_state{hop="router-bgp",k8s_cluster="homelab-wsl"}
        > 0) == bool 1) * (sum(mktxp_bgp_prefix_count{name=~"wsl-site1(-[0-9]+)?"}) > bool 0)) * (((min(homelab:network_path_state{hop="router-bgp",k8s_cluster="homelab-wsl-02"}
        > 0) == bool 1) * (sum(mktxp_bgp_prefix_count{name=~"wsl-site2(-[0-9]+)?"}) > bool 0)) != bool 1), "k8s_cluster",
        "homelab-wsl", "", ""), "vip", "10.10.95.200", "", "")
    - record: homelab:ingress_state
      expr: (3 - 2 * min by (k8s_cluster, name) (probe_success{observability_target="ingress"} and (time() - timestamp(probe_success{observability_target="ingress"}))
        < 180)) or on (k8s_cluster, name) (0 * max by (k8s_cluster, name) (homelab_expected_ingress_info))
    - record: homelab:ingress_cert_remaining_seconds
      expr: min by (k8s_cluster, name) (homelab_ingress_cert_expiry_timestamp_seconds) - time()
    - record: homelab:service_state
      expr: (3 - 2 * min by (k8s_cluster, app) (probe_success{observability_target="service"} and (time() - timestamp(probe_success{observability_target="service"}))
        < 180)) or on (k8s_cluster, app) (homelab:workload_state == 4) or on (k8s_cluster, app) (0 * max by (k8s_cluster,
        app) (homelab_expected_workload_info))
    - record: homelab:house_apps_rank
      expr: max((((homelab:service_state != 4 and on (k8s_cluster) (max by (k8s_cluster) (homelab_observer_info))))
        == bool 3) * 4 + (((homelab:service_state != 4 and on (k8s_cluster) (max by (k8s_cluster) (homelab_observer_info))))
        == bool 2) * 3 + (((homelab:service_state != 4 and on (k8s_cluster) (max by (k8s_cluster) (homelab_observer_info))))
        == bool 0) * 2 + (((homelab:service_state != 4 and on (k8s_cluster) (max by (k8s_cluster) (homelab_observer_info))))
        == bool 1)) or (0 * max(homelab_observer_info) + 1)
    - record: homelab:house_state
      expr: label_replace(max(homelab:internet_state and on (k8s_cluster) (max by (k8s_cluster) (homelab_observer_info))),
        "domain", "internet", "", "") or label_replace((((count(max by (name) (unpoller_device_uptime_seconds >
        0))) >= bool (count(max by (name) (max_over_time(unpoller_device_uptime_seconds[1d]) > 0)))) + 2 * ((count(max
        by (name) (unpoller_device_uptime_seconds > 0))) < bool (count(max by (name) (max_over_time(unpoller_device_uptime_seconds[1d])
        > 0)))) or (0 * (count(max by (name) (max_over_time(unpoller_device_uptime_seconds[1d]) > 0))) + 3)) and
        on () (count(unpoller_device_uptime_seconds)), "domain", "wifi", "", "") or label_replace(max(homelab:service_state{app="home-assistant"}
        != 4 and on (k8s_cluster) (max by (k8s_cluster) (homelab_observer_info))), "domain", "automation", "", "")
        or label_replace((((count(frigate_camera_fps > 0)) >= bool (count(max_over_time(frigate_camera_fps[1d])
        > 0))) + 2 * ((count(frigate_camera_fps > 0)) < bool (count(max_over_time(frigate_camera_fps[1d]) > 0)))
        or (0 * (count(max_over_time(frigate_camera_fps[1d]) > 0)) + 3)) and on () (count(frigate_camera_fps)),
        "domain", "cameras", "", "") or label_replace((homelab:house_apps_rank == bool 4) * 3 + (homelab:house_apps_rank
        == bool 3) * 2 + (homelab:house_apps_rank == bool 1), "domain", "apps", "", "") or label_replace(3 - 2 *
        max(homelab:site_reporting and on (k8s_cluster) (max by (k8s_cluster) (homelab_observer_info))), "domain",
        "monitoring", "", "")
    - alert: ObservabilityEvidenceStale
      expr: (homelab_collection_success == 0) or (time() - homelab_collection_last_success_timestamp_seconds > 180)
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: A monitoring collector is no longer observing its upstream
        dashboard_url: https://grafana.${INTERNAL_DOMAIN}/d/tnwks-observability?var-cluster={{ $labels.k8s_cluster
          }}
        description: Scrape success does not establish fresh upstream evidence. Check the collector source and network
          access.
    - alert: ObservabilityExpectedDatabaseBackupMissing
      expr: homelab:database_backup_state{k8s_cluster="${CLUSTER_NAME}"} == 0 unless on (k8s_cluster, namespace,
        db_cluster) (homelab:database_in_recovery == 1)
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: Expected database has no backup evidence
        dashboard_url: https://grafana.${INTERNAL_DOMAIN}/d/tnwks-data?var-cluster={{ $labels.k8s_cluster }}
        description: No Barman plugin timestamp is available for this expected database. Another database's fresh
          backup cannot satisfy its recovery requirement.
    - alert: ObservabilityArchiveUnavailable
      expr: probe_success{observability_target="archive"} == 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: The WSL-02 metrics archive is unavailable
        dashboard_url: https://grafana.${INTERNAL_DOMAIN}/d/tnwks-observability?var-cluster={{ $labels.k8s_cluster
          }}
        description: Local metrics and alerts remain available. Restore archive uploads before retained local blocks
          expire.
    - alert: ObservabilityIngressNameFailing
      expr: homelab:ingress_state == 3
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: 'A shared-VIP name fails from {{ $labels.k8s_cluster }}: {{ $labels.name }}'
        dashboard_url: https://grafana.${INTERNAL_DOMAIN}/d/tnwks-apps?var-cluster={{ $labels.k8s_cluster }}
        description: 'That site''s collector couldn''t use the name as a client would: the router''s DNS answer,
          the certificate, or the site''s ingress routing the host. homelab_ingress_dns_match and homelab_ingress_http_status
          say which.'
    - alert: ObservabilityIngressCertificateExpiring
      expr: homelab:ingress_cert_remaining_seconds < 14 * 86400
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: The certificate for {{ $labels.name }} on {{ $labels.k8s_cluster }} expires within 14 days
        dashboard_url: https://grafana.${INTERNAL_DOMAIN}/d/tnwks-apps?var-cluster={{ $labels.k8s_cluster }}
        description: cert-manager renews at 30 days left. Check that site's Certificate and its ACME challenge.
    - alert: ObservabilityArchiveBehind
      expr: homelab:archive_lag_seconds > 14400
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: The metrics archive's newest data for a site is over 4 hours old
        dashboard_url: https://grafana.${INTERNAL_DOMAIN}/d/tnwks-observability?var-cluster={{ $labels.k8s_cluster
          }}
        description: Normal is 1-3 hours. Check that site's Thanos sidecar uploads (thanos_shipper_upload_failures_total)
          and the Compactor's bucket sync.
    - alert: ObservabilityArchiveSpaceLow
      expr: homelab:archive_free_ratio < 0.1
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: The metrics archive has under 10% free space
        dashboard_url: https://grafana.${INTERNAL_DOMAIN}/d/tnwks-observability?var-cluster={{ $labels.k8s_cluster
          }}
        description: Garage shares its disk with the WSL-02 node. Shorten the Compactor's retention or free space
          before uploads fail.
