---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-rules
  namespace: flux-system
spec:
  dependsOn:
    - name: kube-prometheus-stack
    - name: observability-evidence
  path: ./kubernetes/apps/monitoring/observability-evidence/rules
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 30m
  retryInterval: 1m
  timeout: 5m
