---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-evidence
  namespace: flux-system
spec:
  dependsOn:
    - name: kube-prometheus-stack
    - name: cloudnative-pg-app
    # The collector mounts the CA from a Secret it issues.
    - name: observability-pki
  path: ./kubernetes/apps/monitoring/observability-evidence/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 30m
  retryInterval: 1m
  timeout: 5m
