---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: observability-evidence
  namespace: monitoring
---
# Namespaced workload/catalogue reads; no Secret access and no writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observability-evidence
rules:
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [list]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [list]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [list]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    verbs: [list]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, backups]
    verbs: [list]
  # Recovery evidence: the fence CronJob's last success, and the standby
  # restore drills' Restores.
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [list]
  - apiGroups: [kopiur.home-operations.com]
    resources: [restores]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: observability-evidence
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: observability-evidence
subjects:
  - kind: ServiceAccount
    name: observability-evidence
    namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: observability-site-overrides
  namespace: flux-system
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [site-overrides]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observability-site-overrides
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: observability-site-overrides
subjects:
  - kind: ServiceAccount
    name: observability-evidence
    namespace: monitoring
