---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./rbac.yaml
  - ./rules.yaml
configMapGenerator:
  - name: observability-evidence-code
    namespace: monitoring
    files:
      - config/collector.py
      - config/inventory.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
