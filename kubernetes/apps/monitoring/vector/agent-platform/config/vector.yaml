# The log agent of the agent platform (../README.md, docs/apps/agent-platform.md
# "Logs"). homelab-wsl only. It reads the logs of the long-running pods on an
# allowlist and of the sandbox supervisors of agents-workflows, drops what can
# hold content before a line leaves the node, and sends the rest to the
# aggregator, as the pod-log agent does. It also serves the gauges of the
# alerts of the platform and the use of the Claude plan, and a count of
# fixed error patterns of the chat channel of the agents and of the one
# refuse line of the approval plugin (agent_channel): that log never leaves
# the node, only the count. The tests are in
# observability/vector-tests/agent-platform-logs.yaml.
data_dir: /vector-data-dir
# Vector's own metrics (internal_metrics) stay for an hour after their last
# change, as on the aggregator. This does not hold for the metrics of the
# exporter: it drops a metric that no event changed in its flush period (60 s;
# it looks on each event, so after 1 to 2 minutes). A gauge of a line also
# carries the time of the line, so Prometheus shows it for 5 minutes (its
# lookback) and no longer. The token counter is kept alive by token_zero.
expire_metrics_secs: 3600

api:
  enabled: false

sources:
  # A long-running pod ships only when its pod template has the label
  # logs.home.arpa/ship=true; nothing ships by default. Never a Job pod (the
  # pod-log agent has them) and never the workload pod of a sandbox, whatever
  # its labels.
  allowlist:
    type: kubernetes_logs
    use_apiserver_cache: true
    extra_label_selector: "logs.home.arpa/ship=true,!batch.kubernetes.io/job-name,openshell.ai/boundary-role!=workload"
    # Look for new files every 2s, not the default 60s.
    glob_minimum_cooldown_ms: 2000

  # The sandbox supervisors of a namespace labelled
  # logs.home.arpa/ship-supervisors=true (agents-workflows only). The gateway
  # makes these pods, so their labels can't carry the allowlist label. Two
  # labels pin the supervisor, so one label alone never takes a workload pod.
  supervisors:
    type: kubernetes_logs
    use_apiserver_cache: true
    extra_namespace_label_selector: "logs.home.arpa/ship-supervisors=true"
    extra_label_selector: "openshell.ai/component=supervisor,openshell.ai/boundary-role=supervisor"
    glob_minimum_cooldown_ms: 2000

  # The log of the agent container of the agents with a Telegram channel
  # (main, finance), read from the files of the node, only to count the
  # error lines of the channel and the refuse line of the approval plugin
  # (agent_channel_count). Its lines go to no sink:
  # the count is the only thing that leaves the node. The pods exclude this
  # container from kubernetes_logs (vector.dev/exclude-containers: agent), so
  # a file source is the one way to read it, and the paths pin the namespace
  # and the container. At the start of Vector it reads from the end of each
  # file, so old lines are not counted again; a file that comes later (a new
  # pod) is read from its start, and a restart resumes at the checkpoint.
  agent_channel:
    type: file
    include:
      - /var/log/pods/agents-main_agent-*/agent/*.log
      - /var/log/pods/agents-finance_agent-*/agent/*.log
    read_from: end
    glob_minimum_cooldown_ms: 2000

  internal_metrics:
    type: internal_metrics

  # The token counter of each declared trust domain, model and kind of token,
  # at 0 from the start of the pod and again every 30 seconds. So the series
  # is there before the first call (increase() counts the first call), and the
  # exporter never drops it while the pod runs (a dropped counter starts again
  # at the next call, and increase() loses what it had). The lists are the
  # ones of platform_gauges (observability/tests/test_plan_usage.py). A value
  # that reads other has no zero series: its counter lives from its first line
  # to the flush period after its last one.
  token_zero:
    type: static_metrics
    namespace: homelab
    interval_secs: 30
    metrics:
      - {name: model_bridge_tokens_total, kind: incremental, value: {counter: {value: 0}}, tags: {domain: main, model: claude-opus-5-5, token: input}}
      - {name: model_bridge_tokens_total, kind: incremental, value: {counter: {value: 0}}, tags: {domain: main, model: claude-opus-5-5, token: output}}
      - {name: model_bridge_tokens_total, kind: incremental, value: {counter: {value: 0}}, tags: {domain: main, model: claude-opus-5-5, token: cache_read}}
      - {name: model_bridge_tokens_total, kind: incremental, value: {counter: {value: 0}}, tags: {domain: main, model: claude-opus-5-5, token: cache_write}}
      - {name: model_bridge_tokens_total, kind: incremental, value: {counter: {value: 0}}, tags: {domain: finance, model: claude-opus-5-5, token: input}}
      - {name: model_bridge_tokens_total, kind: incremental, value: {counter: {value: 0}}, tags: {domain: finance, model: claude-opus-5-5, token: output}}
      - {name: model_bridge_tokens_total, kind: incremental, value: {counter: {value: 0}}, tags: {domain: finance, model: claude-opus-5-5, token: cache_read}}
      - {name: model_bridge_tokens_total, kind: incremental, value: {counter: {value: 0}}, tags: {domain: finance, model: claude-opus-5-5, token: cache_write}}
      - {name: model_bridge_tokens_total, kind: incremental, value: {counter: {value: 0}}, tags: {domain: workflows, model: claude-opus-5-5, token: input}}
      - {name: model_bridge_tokens_total, kind: incremental, value: {counter: {value: 0}}, tags: {domain: workflows, model: claude-opus-5-5, token: output}}
      - {name: model_bridge_tokens_total, kind: incremental, value: {counter: {value: 0}}, tags: {domain: workflows, model: claude-opus-5-5, token: cache_read}}
      - {name: model_bridge_tokens_total, kind: incremental, value: {counter: {value: 0}}, tags: {domain: workflows, model: claude-opus-5-5, token: cache_write}}

  # The counter of each agent and pattern of agent_channel_count, at 0 from the
  # start of the pod and again every 30 seconds, as token_zero: increase()
  # then sees the first line, and the series lives while no line comes.
  # plugin_refuse only for the agents that load the approval plugin (main;
  # observability/tests/test_agent_channel_count.py reads their configs).
  channel_zero:
    type: static_metrics
    namespace: homelab
    interval_secs: 30
    metrics:
      - {name: agent_channel_error_lines_total, kind: incremental, value: {counter: {value: 0}}, tags: {pod_namespace: agents-main, pattern: send_failed}}
      - {name: agent_channel_error_lines_total, kind: incremental, value: {counter: {value: 0}}, tags: {pod_namespace: agents-main, pattern: poll_stall}}
      - {name: agent_channel_error_lines_total, kind: incremental, value: {counter: {value: 0}}, tags: {pod_namespace: agents-main, pattern: poll_restart}}
      - {name: agent_channel_error_lines_total, kind: incremental, value: {counter: {value: 0}}, tags: {pod_namespace: agents-main, pattern: channel_restart}}
      - {name: agent_channel_error_lines_total, kind: incremental, value: {counter: {value: 0}}, tags: {pod_namespace: agents-main, pattern: plugin_refuse}}
      - {name: agent_channel_error_lines_total, kind: incremental, value: {counter: {value: 0}}, tags: {pod_namespace: agents-finance, pattern: send_failed}}
      - {name: agent_channel_error_lines_total, kind: incremental, value: {counter: {value: 0}}, tags: {pod_namespace: agents-finance, pattern: poll_stall}}
      - {name: agent_channel_error_lines_total, kind: incremental, value: {counter: {value: 0}}, tags: {pod_namespace: agents-finance, pattern: poll_restart}}
      - {name: agent_channel_error_lines_total, kind: incremental, value: {counter: {value: 0}}, tags: {pod_namespace: agents-finance, pattern: channel_restart}}

transforms:
  # The gateway's lines lose, in order: colour codes; a whole OCSF JSON
  # record (any prefix), which becomes a marker; everything from the first
  # field that can hold a command or its input or output to the end of the
  # line (a key that ends in "preview", "stdin", "stdout", "stderr",
  # "input", "output" or "body", or cmd, cmd_line, cmdline, command, args,
  # argv or env, with = or :, in any case, or "[cmd:"); and the query string
  # of each word with a "/" or "." before its "?". An error= or detail=
  # field ships: the gateway writes its own error text there. The other pods on the allowlist (run
  # receiver, model bridge, MCP gateway, pilot agent pod) pass as they are:
  # their code writes no content, and the lines of the bridge and of the MCP
  # gateway are JSON that a text rule would break.
  # No regex replacement here uses a capture group: Flux and Vector would
  # both read its dollar sign as a variable.
  allowlist_redact:
    type: remap
    inputs:
      - allowlist
    source: |
      if (string(.kubernetes.container_name) ?? "") == "openshell-gateway" {
        msg = replace(string(.message) ?? "", r'\x1b\[[0-9;]*[A-Za-z]', "")
        if match(msg, r'\{.*"class_uid"') {
          msg = "(dropped: OCSF JSON record)"
        } else {
          cut, err = parse_regex(msg, r'(?is)\A(?P<head>.*?)(?P<key>\[cmd:|\b(?:[a-z0-9_]*(?:preview|stdin|stdout|stderr|input|output|body)|cmd|cmd_line|cmdline|command|args|argv|env)"?\s*[=:])')
          if err == null {
            head = string(cut.head) ?? ""
            key = string(cut.key) ?? ""
            msg = if starts_with(key, "[") { head + "[cmd:(dropped)]" } else { head + replace(key, r'\s', "") + "(dropped)" }
          }
          words = map_values(split(msg, r'\s+')) -> |word| {
            parts = split(word, "?", limit: 2)
            if length(parts) == 2 && match(string!(parts[0]), r'[/.]') {
              end = if ends_with(string!(parts[1]), "]") { "]" } else { "" }
              string!(parts[0]) + "?(dropped)" + end
            } else {
              word
            }
          }
          msg = join(words, " ")
        }
        .message = msg
      }

  # A supervisor's line ships only when it is one of the line types below,
  # after the gateway's rules for command fields and query strings. Each other
  # line becomes a fixed marker, so its count stays in Loki. The types: an
  # SSH session event; a network event by host and port, with its policy; an
  # HTTP request by method, host and path, with its policy; a policy or
  # config change with a short text and the fields of the 0.1.8 format
  # (version, hash, source and the like, never rejection_reason); an SSH
  # relay opened or closed; a lifecycle event of an openshell program; a
  # process event by name and pid; and a log line of the supervisor with a
  # short text (letters only, no fields). By design the host and port of a
  # connection, the path of an HTTP request (a token inside a path ships)
  # and those short texts ship. The line types come from the OpenShell
  # 0.1.8 shorthand format (crates/openshell-ocsf, format/shorthand.rs) and
  # from the logs of the pilot's supervisors.
  supervisor_filter:
    type: remap
    inputs:
      - supervisors
    source: |
      msg = replace(string(.message) ?? "", r'\x1b\[[0-9;]*[A-Za-z]', "")
      if match(msg, r'\{.*"class_uid"') {
        msg = "(dropped: OCSF JSON record)"
      } else {
        cut, err = parse_regex(msg, r'(?is)\A(?P<head>.*?)(?P<key>\[cmd:|\b(?:[a-z0-9_]*(?:preview|stdin|stdout|stderr|input|output|body)|cmd|cmd_line|cmdline|command|args|argv|env)"?\s*[=:])')
        if err == null {
          head = string(cut.head) ?? ""
          key = string(cut.key) ?? ""
          msg = if starts_with(key, "[") { head + "[cmd:(dropped)]" } else { head + replace(key, r'\s', "") + "(dropped)" }
        }
        words = map_values(split(msg, r'\s+')) -> |word| {
          parts = split(word, "?", limit: 2)
          if length(parts) == 2 && match(string!(parts[0]), r'[/.]') {
            end = if ends_with(string!(parts[1]), "]") { "]" } else { "" }
            string!(parts[0]) + "?(dropped)" + end
          } else {
            word
          }
        }
        msg = join(words, " ")
        known = match_any(msg, [
          r'\A(?:\d{4}-\d\d-\d\dT[0-9:.]+Z )?OCSF SSH:[A-Z_]+ \[[A-Z]+\](?: [A-Z]+)?(?: [A-Za-z0-9.:_-]+)?(?: \[auth:(?:NSSH1|Unknown|Certificate Based|GSSAPI|Host Based|Keyboard Interactive|Password|Public Key|Other)\])?\z',
          r'\A(?:\d{4}-\d\d-\d\dT[0-9:.]+Z )?OCSF NET:[A-Z_]+ \[[A-Z]+\](?: [A-Z]+)?(?: [A-Za-z0-9._-]+\(\d+\))?(?: (?:-> )?[A-Za-z0-9.:_-]+(?:/[A-Za-z0-9]+)?)?(?: \[policy:[A-Za-z0-9._:-]+ engine:[A-Za-z0-9._-]+\])?(?: \[reason:[A-Za-z0-9_.-]+\])?\z',
          r'\A(?:\d{4}-\d\d-\d\dT[0-9:.]+Z )?OCSF HTTP:[A-Z]+ \[[A-Z]+\](?: [A-Z]+)?(?: [A-Za-z0-9._-]+\(\d+\) ->)? [A-Z]+ [a-z]+://[A-Za-z0-9.:_-]+(?:/[A-Za-z0-9._~%!&()*+,;=:@/-]*)?(?:\?\(dropped\))?(?: \[policy:[A-Za-z0-9._:-]+ engine:[A-Za-z0-9._-]+\])?(?: \[reason:[A-Za-z0-9_.-]+\])?\z',
          r'\A(?:\d{4}-\d\d-\d\dT[0-9:.]+Z )?OCSF CONFIG:[A-Z_]+ \[[A-Z]+\] [A-Za-z][A-Za-z0-9 ,;:._()/-]{0,120}(?: \[(?:auto|source|prover_delta|resolved_from|chunk_id|actor|version|hash|require_binary_identity):[A-Za-z0-9._:/-]+(?: (?:auto|source|prover_delta|resolved_from|chunk_id|actor|version|hash|require_binary_identity):[A-Za-z0-9._:/-]+)*\])*\z',
          r'\A(?:\d{4}-\d\d-\d\dT[0-9:.]+Z )?OCSF EVENT \[[A-Z]+\] ssh relay [a-z]+ \(channel_id=[0-9a-f-]+, target=unix:[A-Za-z0-9/._-]+\)\z',
          r'\A(?:\d{4}-\d\d-\d\dT[0-9:.]+Z )?OCSF LIFECYCLE:[A-Z_]+ \[[A-Z]+\] openshell[a-z0-9-]* [a-z_]*\z',
          r'\A(?:\d{4}-\d\d-\d\dT[0-9:.]+Z )?OCSF PROC:[A-Z_]+ \[[A-Z]+\] [A-Za-z0-9._-]+\(-?\d+\)(?: \[exit:-?\d+\])?(?: \[cmd:\(dropped\)\])?\z',
          r'\A(?:\d{4}-\d\d-\d\dT[0-9:.]+Z )?(?:INFO|WARN|ERROR) [a-z_]+(?:::[a-z_]+)*: [A-Za-z][A-Za-z ,-]{0,120}\z'
        ])
        if !known {
          msg = "(dropped: unknown line type)"
        }
      }
      .message = msg

  # The gauges of the alerts (docs/apps/agent-platform.md, "Alerts"), each the
  # time of the newest line of its kind. Only short names become labels.
  #   - homelab_agent_platform_result_timestamp_seconds{check="instruction-file"}:
  #     a line `instruction-check file=<name> change=<new|changed|gone>` of the
  #     backup container of an agent pod; the change is the result, and the
  #     file name stays in Loki. (The aggregator serves the other checks of
  #     the same series.)
  #   - homelab_model_bridge_engine_error_timestamp_seconds{domain, kind}: a
  #     JSON line of the model bridge with event engine_error. A kind or
  #     domain that is not a short lowercase name becomes "other".
  # The use of the Claude plan (docs/apps/agent-platform.md, "Plan use"),
  # from the lines of the model bridge:
  #   - a plan_limit line gives four gauges for its window:
  #     homelab_model_bridge_plan_utilization_ratio (the share used, 1 is
  #     the limit), _plan_reset_timestamp_seconds (when the window resets),
  #     _plan_status (0 allowed, 1 allowed_warning, 2 rejected, -1 other) and
  #     _plan_observed_timestamp_seconds (the time of the line). A value that
  #     the line does not give, or that is out of range, is -1. The plan is
  #     one account for each trust domain, so the window is the only label:
  #     the newest line of any domain sets the gauges, and the domain stays
  #     in Loki.
  #   - a call line with an answer adds its token counts to
  #     homelab_model_bridge_tokens_total{domain, model, token}.
  # Each label has a list of values, and each other value becomes "other".
  platform_gauges:
    type: remap
    inputs:
      - allowlist
    source: |
      ns = string(.kubernetes.pod_namespace) ?? ""
      container = string(.kubernetes.container_name) ?? ""
      msg = string(.message) ?? ""
      ts = to_unix_timestamp(timestamp(.timestamp) ?? parse_timestamp(string(.timestamp) ?? "", "%+") ?? now())
      if starts_with(ns, "agents-") && container == "backup" {
        line, err = parse_regex(msg, r'\Ainstruction-check file=.+ change=(?P<result>new|changed|gone)\z')
        if err != null { abort }
        . = {"gauge": "instruction", "pod_namespace": ns, "app": "agent", "check": "instruction-file", "result": string(line.result) ?? "other", "time": ts}
      } else if ns == "ai" && container == "model-bridge" {
        parsed, err = parse_json(msg)
        if err != null { abort }
        line = object(parsed) ?? {}
        event = string(line.event) ?? ""
        if event == "engine_error" {
          kind = string(line.kind) ?? ""
          if !match(kind, r'\A[a-z_]{1,32}\z') { kind = "other" }
          domain = string(line.domain) ?? ""
          if !match(domain, r'\A[a-z0-9-]{1,32}\z') { domain = "other" }
          . = {"gauge": "bridge", "domain": domain, "kind": kind, "time": ts}
        } else if event == "plan_limit" {
          window = string(line.window) ?? ""
          if !includes(["five_hour", "seven_day", "seven_day_opus", "seven_day_sonnet", "seven_day_overage_included", "overage"], window) { window = "other" }
          state = string(line.status) ?? ""
          status = if state == "allowed" { 0 } else if state == "allowed_warning" { 1 } else if state == "rejected" { 2 } else { -1 }
          used = -1.0
          if is_float(line.utilization) || is_integer(line.utilization) {
            u = to_float(line.utilization) ?? -1.0
            if u >= 0.0 && u <= 10.0 { used = u }
          }
          reset = -1
          if is_integer(line.resets_at) || is_float(line.resets_at) {
            r = to_int(line.resets_at) ?? -1
            if r >= 1000000000 && r <= 9999999999 { reset = r }
          }
          . = {"gauge": "plan", "window": window, "status": status, "utilization": used, "reset": reset, "time": ts}
        } else if event == "call" {
          domain = string(line.domain) ?? ""
          if !includes(["main", "finance", "workflows"], domain) { domain = "other" }
          model = string(line.model) ?? ""
          if !includes(["claude-opus-5-5"], model) { model = "other" }
          # A count is a whole number from 0 to 100 million, or it is not counted.
          input = int(line.input_tokens) ?? -1
          if input > 100000000 { input = -1 }
          output = int(line.output_tokens) ?? -1
          if output > 100000000 { output = -1 }
          cache_read = int(line.cache_read_tokens) ?? -1
          if cache_read > 100000000 { cache_read = -1 }
          cache_write = int(line.cache_write_tokens) ?? -1
          if cache_write > 100000000 { cache_write = -1 }
          # A call line with no answer has no token counts: no sample.
          if input < 0 && output < 0 && cache_read < 0 && cache_write < 0 { abort }
          if input < 0 { input = 0 }
          if output < 0 { output = 0 }
          if cache_read < 0 { cache_read = 0 }
          if cache_write < 0 { cache_write = 0 }
          . = {"gauge": "tokens", "domain": domain, "model": model, "input": input, "output": output,
               "cache_read": cache_read, "cache_write": cache_write}
        } else {
          abort
        }
      } else {
        abort
      }

  # The error lines of the Telegram channel of an agent, from the product's
  # source at the pinned release (OpenClaw 2026.11.3, agent image 0.4.1),
  # as fixed patterns:
  #   - send_failed: a reply that did not reach the chat. Each call of the
  #     chat API that fails after its retries logs `telegram <method> failed:`
  #     (extensions/telegram/src/api-logging.ts); a send that hangs ends at
  #     its timeout (60 s for sendMessage, request-timeouts.ts) with the same
  #     line. Also the final delivery of a reply that failed (`telegram
  #     fallback delivery failed:`), and a final reply or a block of it that
  #     failed, also before the call to the chat API (`telegram final reply
  #     failed:`, `telegram block reply failed:`, bot-message-dispatch-reply.ts;
  #     logged with the default error policy `always`, which the agents keep).
  #     Not the typing cue (`sendChatAction`),
  #     and not an edit that changed nothing (the product does not log it).
  #   - poll_stall: the watchdog of the poll saw no completed getUpdates for
  #     2 minutes (`Polling stall detected (`, polling-session.ts).
  #   - poll_restart: the poll ended and restarts after a wait
  #     (`Telegram isolated polling ingress failed|stopped|restart requested;
  #     restarting in`).
  #   - channel_restart: the health monitor of the product restarted the
  #     Telegram channel, its restart failed, or it hit its limit of restarts
  #     an hour (`[telegram:<account>] health-monitor: restarting|restart
  #     failed|hit`, channel-health-monitor.ts).
  # And one line of the host approval plugin of the agent image (0.5.0,
  # plugins/host-approval/index.js of iT3E/tnwks-agent-image):
  #   - plugin_refuse: the plugin refuses each tool call of the agent,
  #     because its form is not valid or a server entry failed its check
  #     (`host-approval: refusing each tool call: <errors>`, an error line,
  #     live as `[plugins] host-approval: ...`). It logs it once for each
  #     fault, not for each call. Not its start line (`host-approval:
  #     loaded, <n> read lines`) and not the refusal of one call
  #     (`host-approval: refused <tool> (<reason>)`).
  # The console logger of the product drops the word "telegram" at the
  # start of a message of its telegram subsystem and writes "[telegram] "
  # before it (src/logging/subsystem.ts; the live line `[telegram] outbound
  # send ok` is the message `telegram outbound send ok`), so a pattern takes
  # both forms, with or without the tag of the account ([default]) after
  # "[telegram] ", as the start line of the channel has it.
  # The event becomes only {pod_namespace, pattern}: the namespace from the path
  # of the file (a fixed list), the pattern a fixed name. No word of the line
  # stays, and any other line is dropped.
  agent_channel_count:
    type: remap
    inputs:
      - agent_channel
    # The program has no call that can fail at run time, but if a later edit
    # adds one, the event is dropped and goes to no output.
    drop_on_error: true
    reroute_dropped: false
    source: |
      path = string(.file) ?? ""
      ns = if starts_with(path, "/var/log/pods/agents-main_agent-") {
        "agents-main"
      } else if starts_with(path, "/var/log/pods/agents-finance_agent-") {
        "agents-finance"
      } else {
        ""
      }
      if ns == "" || !contains(path, "/agent/") { abort }
      msg = replace(string(.message) ?? "", r'\x1b\[[0-9;]*m', "")
      pattern = if match(msg, r'(?:\[telegram\] (?:\[[A-Za-z0-9_-]+\] )?|\btelegram )(?:send|edit)[A-Za-z]* failed: ') && !match(msg, r'(?:\[telegram\] (?:\[[A-Za-z0-9_-]+\] )?|\btelegram )sendChatAction failed: ') {
        "send_failed"
      } else if match(msg, r'(?:\[telegram\] (?:\[[A-Za-z0-9_-]+\] )?|\btelegram )(?:fallback delivery|final reply|block reply) failed: ') {
        "send_failed"
      } else if match(msg, r'\bPolling stall detected \((?:active getUpdates stuck|no completed getUpdates) for ') {
        "poll_stall"
      } else if match(msg, r'(?:\[telegram\] (?:\[[A-Za-z0-9_-]+\] )?|\bTelegram )isolated polling ingress (?:failed|stopped|restart requested); restarting in ') {
        "poll_restart"
      } else if match(msg, r'\[telegram:[A-Za-z0-9_-]+\] health-monitor: (?:restarting \(reason: |restart failed: |hit \d+ restarts/hour limit)') {
        "channel_restart"
      } else if match(msg, r'\bhost-approval: refusing each tool call: ') {
        "plugin_refuse"
      } else {
        ""
      }
      if pattern == "" { abort }
      . = {"pod_namespace": ns, "pattern": pattern}

  agent_channel_metrics:
    type: log_to_metric
    inputs:
      - agent_channel_count
    metrics:
      - type: counter
        namespace: homelab
        name: agent_channel_error_lines_total
        field: pattern
        tags:
          pod_namespace: "{{ pod_namespace }}"
          pattern: "{{ pattern }}"

  platform_gauge_route:
    type: route
    inputs:
      - platform_gauges
    # platform_gauges passes only these four kinds, so no _unmatched output.
    reroute_unmatched: false
    route:
      instruction: '.gauge == "instruction"'
      bridge: '.gauge == "bridge"'
      plan: '.gauge == "plan"'
      tokens: '.gauge == "tokens"'

  instruction_metrics:
    type: log_to_metric
    inputs:
      - platform_gauge_route.instruction
    metrics:
      - type: gauge
        field: time
        namespace: homelab
        name: agent_platform_result_timestamp_seconds
        tags:
          pod_namespace: "{{ pod_namespace }}"
          app: "{{ app }}"
          check: "{{ check }}"
          result: "{{ result }}"

  bridge_metrics:
    type: log_to_metric
    inputs:
      - platform_gauge_route.bridge
    metrics:
      - type: gauge
        field: time
        namespace: homelab
        name: model_bridge_engine_error_timestamp_seconds
        tags:
          domain: "{{ domain }}"
          kind: "{{ kind }}"

  # One line sets each gauge of its window; the exporter keeps the newest
  # value. The panels and the alert read the recording rules
  # homelab:ai_plan_* (observability/rules.py), which keep the newest reading
  # after the gauges expire (one hour after the last line).
  plan_metrics:
    type: log_to_metric
    inputs:
      - platform_gauge_route.plan
    metrics:
      - type: gauge
        field: utilization
        namespace: homelab
        name: model_bridge_plan_utilization_ratio
        tags:
          window: "{{ window }}"
      - type: gauge
        field: reset
        namespace: homelab
        name: model_bridge_plan_reset_timestamp_seconds
        tags:
          window: "{{ window }}"
      - type: gauge
        field: status
        namespace: homelab
        name: model_bridge_plan_status
        tags:
          window: "{{ window }}"
      - type: gauge
        field: time
        namespace: homelab
        name: model_bridge_plan_observed_timestamp_seconds
        tags:
          window: "{{ window }}"

  # The tokens of the calls of each trust domain, as the bridge counts them.
  # token_zero keeps each declared series alive; token_now gives each sample
  # the time it was counted, so a sample is never older than the one before.
  token_metrics:
    type: log_to_metric
    inputs:
      - platform_gauge_route.tokens
    metrics:
      - type: counter
        increment_by_value: true
        field: input
        namespace: homelab
        name: model_bridge_tokens_total
        tags:
          domain: "{{ domain }}"
          model: "{{ model }}"
          token: input
      - type: counter
        increment_by_value: true
        field: output
        namespace: homelab
        name: model_bridge_tokens_total
        tags:
          domain: "{{ domain }}"
          model: "{{ model }}"
          token: output
      - type: counter
        increment_by_value: true
        field: cache_read
        namespace: homelab
        name: model_bridge_tokens_total
        tags:
          domain: "{{ domain }}"
          model: "{{ model }}"
          token: cache_read
      - type: counter
        increment_by_value: true
        field: cache_write
        namespace: homelab
        name: model_bridge_tokens_total
        tags:
          domain: "{{ domain }}"
          model: "{{ model }}"
          token: cache_write

  token_now:
    type: remap
    inputs:
      - token_metrics
    source: |
      .timestamp = now()

sinks:
  # To the kubernetes source of the aggregator, as the pod-log agent sends.
  # The scheme must be there: from Vector 0.61 on, an address with no scheme
  # means https, and the aggregator listens in plain HTTP/2, so each request
  # fails to connect (src/sinks/vector/config.rs, "If no scheme is
  # specified, https is used"). The audit reader writes it the same way.
  # Small batches, one request at a time and a small buffer, as on the audit
  # reader, keep the memory flat: when the aggregator can't take lines, the
  # buffer holds 200 events and then blocks. A read position moves when a
  # line is read, not when the aggregator took it: kubernetes_logs has no
  # acknowledgements (src/sources/kubernetes_logs/mod.rs, can_acknowledge,
  # false at v0.61.0; with them on, Vector warns of silent data loss). So a
  # pod that is killed while the aggregator is away loses the lines it read
  # and did not send. Acknowledgements are a later step, when the source
  # has them.
  aggregator:
    type: vector
    compression: gzip
    inputs:
      - allowlist_redact
      - supervisor_filter
    address: "http://vector-aggregator.monitoring.svc.cluster.local:6000"
    version: "2"
    batch:
      max_events: 200
      timeout_secs: 1
    request:
      concurrency: 1
    buffer:
      type: memory
      max_events: 200
      when_full: block

  # The metrics port, scraped by the PodMonitor next to this config.
  prometheus:
    type: prometheus_exporter
    inputs:
      - internal_metrics
      - instruction_metrics
      - bridge_metrics
      - plan_metrics
      - token_now
      - token_zero
      - agent_channel_metrics
      - channel_zero
    address: 0.0.0.0:9598
