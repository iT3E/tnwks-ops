---
# The account of the load. It has no Role: each of its requests asks for a
# Secret that it may not read, and RBAC refuses it. The audit policy keeps
# each request on a Secret, a refused one too, so each request is one marked
# line of the audit stream.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector-planned-stop-load
---
# RATE requests a second for DURATION_SECONDS: 12 a second for 3 hours is
# 129,600 requests. load.py has the rules that stop it. activeDeadlineSeconds
# is only a backstop, past the time of the script and its grace.
apiVersion: batch/v1
kind: Job
metadata:
  name: vector-planned-stop-load
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 11400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector-planned-stop-load
    spec:
      serviceAccountName: vector-planned-stop-load
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: load
          image: docker.io/library/python:3.15.2-slim-trixie@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
          command: ["python3", "-I", "/script/load.py"]
          env:
            - name: CLUSTER
              value: "${CLUSTER_NAME}"
            - name: RATE
              value: "12"
            - name: DURATION_SECONDS
              value: "10800"
            - name: GRACE_SECONDS
              value: "300"
            - name: TROUBLE_LIMIT
              value: "30"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /script
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: vector-planned-stop-load
