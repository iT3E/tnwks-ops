data_dir: /vector-data-dir

api:
  enabled: true
  address: 0.0.0.0:8686

# An internal metric stays for an hour after its last change, not the default
# five minutes. A counter that changes rarely, such as the errors of one sink,
# is then still there when a rule compares it with its value of minutes before.
expire_metrics_secs: 3600

# Sources
sources:
  # Vector's own metrics: the events and the errors of each component below,
  # by component_id. Served by the prometheus sink at the end of this file.
  internal_metrics:
    type: internal_metrics

  # Pod logs from vector-agent (MS-01 only; see ../ks-agent.yaml).
  kubernetes_source:
    address: 0.0.0.0:6000
    type: vector
    version: "2"

  # RB5009 remote logging (BSD syslog, ISO 8601 timestamps), UDP: one message
  # per datagram. RouterOS's TCP syslog has no framing. On WSL: router ->
  # Windows host udp/6001 (tnwks-udp-relay-syslog) -> WSL socat
  # (tnwks-lan-bridge@syslog) -> this service's LoadBalancer VIP.
  routeros_syslog:
    type: syslog
    mode: udp
    address: 0.0.0.0:6001

  # The API server audit log, from the audit reader on the control plane node
  # (../../audit-reader), through the Service vector-aggregator-audit. A
  # source of its own: its only sink waits for the store of the security
  # streams, and a sink that waits holds its source. No other log is on it.
  audit_source:
    type: vector
    address: 0.0.0.0:6010
    version: "2"

# Transformations
transforms:
  kubernetes_remap:
    type: remap
    inputs:
      - kubernetes_source
    source: |
      # The 'app' label. kubernetes_logs puts pod labels under .kubernetes,
      # not at the top level (reading .pod_labels made every stream "unknown").
      .custom_app_name = .kubernetes.pod_labels."app.kubernetes.io/name" || .kubernetes.pod_labels.app || .kubernetes.pod_labels."k8s-app" || "unknown"
      # Drop the label maps: they repeat on every line. The pod name stays
      # (.kubernetes.pod_name), and a Job pod's name starts with its Job's.
      del(.kubernetes.pod_labels)
      del(.kubernetes.node_labels)
      del(.kubernetes.namespace_labels)

  # The result lines of the agent platform, for its alerts
  # (docs/apps/agent-platform.md, "Alerts"). A line of a pod in a namespace
  # `agents-*` that starts with `<check> result=<result>` (for example
  # `app-drift result=drift detail=...`) becomes the gauge
  # homelab_agent_platform_result_timestamp_seconds: the time of the newest
  # line for each check and result. Only these two words go on as labels,
  # never the rest of the line. A line `instruction-check file=<name>
  # change=<new|changed|gone>` of the backup container of an agent pod
  # becomes the check instruction-file with the change as its result: the
  # name of the file stays in Loki. The other events end here; the Loki sink
  # gets every line from kubernetes_remap.
  agent_platform_results:
    type: remap
    inputs:
      - kubernetes_remap
    source: |
      ns = string(.kubernetes.pod_namespace) ?? ""
      if !starts_with(ns, "agents-") { abort }
      msg = string(.message) ?? ""
      line, err = parse_regex(msg, r'^(?P<check>[a-z][a-z0-9-]{0,39}) result=(?P<result>[a-z]{1,20})(?: |$)')
      if err != null {
        line, err = parse_regex(msg, r'^instruction-check file=.+ change=(?P<result>new|changed|gone)$')
        if err != null { abort }
        line.check = "instruction-file"
      }
      # The time of the line; the time it got here if it has none.
      ts = to_unix_timestamp(timestamp(.timestamp) ?? parse_timestamp(string(.timestamp) ?? "", "%+") ?? now())
      . = {
        "pod_namespace": ns,
        "app": string(.custom_app_name) ?? "unknown",
        "check": line.check,
        "result": line.result,
        "time": ts
      }

  agent_platform_result_metrics:
    type: log_to_metric
    inputs:
      - agent_platform_results
    metrics:
      - type: gauge
        field: time
        namespace: homelab
        name: agent_platform_result_timestamp_seconds
        tags:
          pod_namespace: "{{ pod_namespace }}"
          app: "{{ app }}"
          check: "{{ check }}"
          result: "{{ result }}"

  # The errors of the model bridge in `ai`, for its alert
  # (docs/apps/agent-platform.md, "Alerts"). The bridge writes one JSON line
  # for each event; a line with event engine_error becomes the gauge
  # homelab_model_bridge_engine_error_timestamp_seconds: the time of the
  # newest error for each trust domain and kind (rate_limit when the plan
  # limit stops a call). A kind or domain outside a short lowercase name
  # goes on as "other", so a label never holds more than a name.
  model_bridge_errors:
    type: remap
    inputs:
      - kubernetes_remap
    source: |
      if (string(.kubernetes.pod_namespace) ?? "") != "ai" || (string(.custom_app_name) ?? "") != "model-bridge" { abort }
      parsed, err = parse_json(string(.message) ?? "")
      if err != null { abort }
      line = object(parsed) ?? {}
      if (string(line.event) ?? "") != "engine_error" { abort }
      kind = string(line.kind) ?? ""
      if !match(kind, r'^[a-z_]{1,32}$') { kind = "other" }
      domain = string(line.domain) ?? ""
      if !match(domain, r'^[a-z0-9-]{1,32}$') { domain = "other" }
      ts = to_unix_timestamp(timestamp(.timestamp) ?? parse_timestamp(string(.timestamp) ?? "", "%+") ?? now())
      . = {"domain": domain, "kind": kind, "time": ts}

  model_bridge_error_metrics:
    type: log_to_metric
    inputs:
      - model_bridge_errors
    metrics:
      - type: gauge
        field: time
        namespace: homelab
        name: model_bridge_engine_error_timestamp_seconds
        tags:
          domain: "{{ domain }}"
          kind: "{{ kind }}"

  # The time of an audit line is the time of its event (stageTimestamp), not
  # the time it got here: a line that waited on the node rests at its own
  # time. The line itself goes on as the API server wrote it.
  audit_time:
    type: remap
    inputs:
      - audit_source
    source: |
      event, err = parse_json(.message)
      if err == null {
        ts, err = parse_timestamp(event.stageTimestamp, "%+")
        if err == null {
          .timestamp = ts
        }
      }

# Sinks
sinks:
  loki_kubernetes:
    type: loki
    inputs:
      - kubernetes_remap
    endpoint: http://loki-gateway.monitoring.svc.cluster.local
    encoding:
      codec: json
    out_of_order_action: rewrite_timestamp
    remove_label_fields: true
    remove_timestamp: true
    labels:
      app: "{{ custom_app_name }}"
      namespace: "{{ kubernetes.pod_namespace }}"
      node: "{{ kubernetes.pod_node_name }}"

  loki_routeros:
    type: loki
    inputs:
      - routeros_syslog
    endpoint: http://loki-gateway.monitoring.svc.cluster.local
    encoding:
      codec: json
    out_of_order_action: rewrite_timestamp
    labels:
      job: routeros
      hostname: "{{ host }}"
      severity: "{{ severity }}"

  # The security streams (../README.md). Both sinks write to the Loki that
  # keeps a stream with the label security_stream for 90 days: the Loki of
  # this cluster by default, and on a cluster that sets SECURITY_LOKI_ENDPOINT
  # the TLS path to it (../../security-loki-proxy). The client certificate is
  # for that path. A sink with a plain http address does not use it.

  # The audit log. Acknowledgements go from Loki back to the reader, so the
  # reader moves its position in the audit file only for a line that Loki
  # took. When Loki is away, this sink waits, and the files wait on the node.
  loki_security_audit:
    type: loki
    inputs:
      - audit_time
    endpoint: "${SECURITY_LOKI_ENDPOINT:=http://loki-gateway.monitoring.svc.cluster.local}"
    tls: &security_loki_tls
      ca_file: /etc/vector/security-loki-client/ca.crt
      crt_file: /etc/vector/security-loki-client/tls.crt
      key_file: /etc/vector/security-loki-client/tls.key
    encoding:
      codec: text
    # Loki takes a line that is out of order, so the time of the event stays.
    out_of_order_action: accept
    acknowledgements:
      enabled: true
    labels:
      security_stream: k8s-audit
      k8s_cluster: "${CLUSTER_NAME}"

  # A second copy of the router log. This sink never makes loki_routeros
  # wait: when its buffer is full, it drops the newest event.
  loki_security_routeros:
    type: loki
    inputs:
      - routeros_syslog
    endpoint: "${SECURITY_LOKI_ENDPOINT:=http://loki-gateway.monitoring.svc.cluster.local}"
    tls: *security_loki_tls
    encoding:
      codec: json
    out_of_order_action: rewrite_timestamp
    buffer:
      type: memory
      max_events: 500
      when_full: drop_newest
    labels:
      security_stream: routeros
      k8s_cluster: "${CLUSTER_NAME}"

  # The metrics port (9598), scraped by the PodMonitor next to the
  # HelmRelease. It is a port of the pod only: no Service carries it.
  # A result series carries the time of its line, so Prometheus holds each
  # sample for 5 minutes (its lookback); a rule bridges the gap between two
  # lines with max_over_time.
  prometheus:
    type: prometheus_exporter
    inputs:
      - internal_metrics
      - agent_platform_result_metrics
      - model_bridge_error_metrics
    address: 0.0.0.0:9598
