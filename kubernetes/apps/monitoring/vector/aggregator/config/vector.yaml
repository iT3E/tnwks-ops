data_dir: /vector-data-dir

api:
  enabled: true
  address: 0.0.0.0:8686

# Sources
sources:
  # Pod logs from vector-agent (MS-01 only; see ../ks-agent.yaml).
  kubernetes_source:
    address: 0.0.0.0:6000
    type: vector
    version: "2"

  # RB5009 remote logging (BSD syslog over TCP, ISO 8601 timestamps). On WSL:
  # router -> Windows host :6001 (portproxy) -> WSL socat
  # (tnwks-lan-bridge@syslog) -> this service's LoadBalancer VIP.
  routeros_syslog:
    type: syslog
    mode: tcp
    address: 0.0.0.0:6001

# Transformations
transforms:
  kubernetes_remap:
    type: remap
    inputs:
      - kubernetes_source
    source: |
      # Standardize 'app' index
      .custom_app_name = .pod_labels."app.kubernetes.io/name" || .pod_labels.app || .pod_labels."k8s-app" || "unknown"
      # Drop pod_labels
      del(.pod_labels)

# Sinks
sinks:
  loki_kubernetes:
    type: loki
    inputs:
      - kubernetes_remap
    endpoint: http://loki-gateway.monitoring.svc.cluster.local
    encoding:
      codec: json
    out_of_order_action: rewrite_timestamp
    remove_label_fields: true
    remove_timestamp: true
    labels:
      app: "{{ custom_app_name }}"
      namespace: "{{ kubernetes.pod_namespace }}"
      node: "{{ kubernetes.pod_node_name }}"

  loki_routeros:
    type: loki
    inputs:
      - routeros_syslog
    endpoint: http://loki-gateway.monitoring.svc.cluster.local
    encoding:
      codec: json
    out_of_order_action: rewrite_timestamp
    labels:
      job: routeros
      hostname: "{{ host }}"
      severity: "{{ severity }}"
