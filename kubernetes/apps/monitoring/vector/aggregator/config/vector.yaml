data_dir: /vector-data-dir

api:
  enabled: true
  address: 0.0.0.0:8686

# An internal metric stays for an hour after its last change, not the default
# five minutes. A counter that changes rarely, such as the errors of one sink,
# is then still there when a rule compares it with its value of minutes before.
expire_metrics_secs: 3600

# Sources
sources:
  # Vector's own metrics: the events and the errors of each component below,
  # by component_id. Served by the prometheus sink at the end of this file.
  internal_metrics:
    type: internal_metrics

  # Pod logs from vector-agent (MS-01 only; see ../ks-agent.yaml).
  kubernetes_source:
    address: 0.0.0.0:6000
    type: vector
    version: "2"

  # RB5009 remote logging (BSD syslog, ISO 8601 timestamps), UDP: one message
  # per datagram. RouterOS's TCP syslog has no framing. On WSL: router ->
  # Windows host udp/6001 (tnwks-udp-relay-syslog) -> WSL socat
  # (tnwks-lan-bridge@syslog) -> this service's LoadBalancer VIP.
  routeros_syslog:
    type: syslog
    mode: udp
    address: 0.0.0.0:6001

# Transformations
transforms:
  kubernetes_remap:
    type: remap
    inputs:
      - kubernetes_source
    source: |
      # The 'app' label. kubernetes_logs puts pod labels under .kubernetes,
      # not at the top level (reading .pod_labels made every stream "unknown").
      .custom_app_name = .kubernetes.pod_labels."app.kubernetes.io/name" || .kubernetes.pod_labels.app || .kubernetes.pod_labels."k8s-app" || "unknown"
      # Drop the label maps: they repeat on every line. The pod name stays
      # (.kubernetes.pod_name), and a Job pod's name starts with its Job's.
      del(.kubernetes.pod_labels)
      del(.kubernetes.node_labels)
      del(.kubernetes.namespace_labels)

# Sinks
sinks:
  loki_kubernetes:
    type: loki
    inputs:
      - kubernetes_remap
    endpoint: http://loki-gateway.monitoring.svc.cluster.local
    encoding:
      codec: json
    out_of_order_action: rewrite_timestamp
    remove_label_fields: true
    remove_timestamp: true
    labels:
      app: "{{ custom_app_name }}"
      namespace: "{{ kubernetes.pod_namespace }}"
      node: "{{ kubernetes.pod_node_name }}"

  loki_routeros:
    type: loki
    inputs:
      - routeros_syslog
    endpoint: http://loki-gateway.monitoring.svc.cluster.local
    encoding:
      codec: json
    out_of_order_action: rewrite_timestamp
    labels:
      job: routeros
      hostname: "{{ host }}"
      severity: "{{ severity }}"

  # The metrics port (9598), scraped by the PodMonitor next to the
  # HelmRelease. It is a port of the pod only: no Service carries it.
  prometheus:
    type: prometheus_exporter
    inputs:
      - internal_metrics
    address: 0.0.0.0:9598
