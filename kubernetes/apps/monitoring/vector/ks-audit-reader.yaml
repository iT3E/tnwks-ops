---
# The audit reader (README.md): a DaemonSet on the control plane node that
# sends the audit log of the API server to vector-aggregator-audit:6010. A
# cluster lists this file when its audit stream starts.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vector-audit-reader
  namespace: flux-system
spec:
  interval: 10m
  path: "./kubernetes/apps/monitoring/vector/audit-reader"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false # no flux ks dependents
  dependsOn:
    - name: vector-aggregator
