data_dir: /vector-data-dir

api:
  enabled: false

# Sources
sources:
  kubernetes_logs:
    type: kubernetes_logs
    use_apiserver_cache: true
    # Which pods to ship. Empty (MS-01) is every pod. The WSL clusters set
    # VECTOR_AGENT_POD_SELECTOR to batch.kubernetes.io/job-name, Job pods
    # only: their nodes and PVCs share one virtual disk, and
    # terminated-pod-gc-threshold=1 (talos/wsl/cluster-config.yaml) deletes a
    # finished pod and its logs within about 20s, so Loki is the only place a
    # failed CronJob's output survives. Long-running pods keep `kubectl logs`.
    extra_label_selector: "${VECTOR_AGENT_POD_SELECTOR:=}"
    # Look for new log files every 2s, not the default 60s: a Job pod can
    # start, fail and be collected inside a minute. Vector keeps reading a
    # file it has open after the kubelet deletes it.
    glob_minimum_cooldown_ms: 2000

  # Long-running pods of a namespace that opts in with the label
  # logs.home.arpa/ship=true (on the WSL clusters: the trust domains of the
  # agent platform, whose gateways, run receiver and sandbox supervisors
  # leave the record of what an agent did). A label selector can't say "Job
  # pods or these pods", so this is a second source. Not taken here:
  #   - Job pods: the source above has them;
  #   - the workload pod of a sandbox (openshell.ai/boundary-role=workload):
  #     the code an agent runs;
  #   - a pod named agent or signal-daemon (app.kubernetes.io/name): the log
  #     of a personal agent can hold chat content, and shipping it is the
  #     owner's call (docs/apps/agent-platform.md, "Logs").
  # A cluster whose source above takes every pod (MS-01) labels no namespace.
  kubernetes_logs_opt_in:
    type: kubernetes_logs
    use_apiserver_cache: true
    extra_namespace_label_selector: "logs.home.arpa/ship=true"
    extra_label_selector: "!batch.kubernetes.io/job-name,openshell.ai/boundary-role!=workload,app.kubernetes.io/name notin (agent,signal-daemon)"
    glob_minimum_cooldown_ms: 2000

# Sinks
sinks:
  kubernetes_sink:
    type: vector
    compression: true
    inputs:
      - kubernetes_logs
      - kubernetes_logs_opt_in
    address: "vector-aggregator.monitoring.svc.cluster.local:6000"
    version: "2"
