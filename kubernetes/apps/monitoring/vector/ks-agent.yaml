---
# Pod-log agent (DaemonSet -> vector-aggregator:6000). Every pod on MS-01. On the
# WSL clusters only Job pods (VECTOR_AGENT_POD_SELECTOR): every node and PVC
# there shares one virtual disk, so all pod logs cost more IO than they are
# worth, but a finished Job pod is garbage-collected with its logs in seconds.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vector-agent
  namespace: flux-system
spec:
  interval: 10m
  path: "./kubernetes/apps/monitoring/vector/agent"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false # no flux ks dependents
  dependsOn:
    - name: vector-aggregator
