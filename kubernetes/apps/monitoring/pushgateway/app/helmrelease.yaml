---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Holds the last result a CI job on the in-cluster ops runner pushed, for
# Prometheus to scrape: the in-cluster counterpart of windows_exporter's
# textfile directory, which the Ansible host drift check writes to. Today one
# group per Terraform root with `drift = true` (job terraform_drift, label
# root), from terraform.yaml's drift job; alerts in
# kube-prometheus-stack/addons/alerts/terraform-drift.yaml.
#
# Nothing on disk: Prometheus keeps what it scraped, and the alerts read the
# last value within a window, so a restart loses nothing they need.
# networkpolicy.yaml limits who can connect; the ServiceMonitor below limits
# what a push can become in Prometheus.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pushgateway
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus-pushgateway
      version: 3.11.2
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 30m
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: pushgateway
    automountServiceAccountToken: false
    securityContext:
      fsGroup: 65534
      runAsUser: 65534
      runAsGroup: 65534
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 64Mi
    # A push can't put anything else into Prometheus. The target's labels
    # win: a pushed job, namespace, k8s_cluster and the like arrive as
    # exported_<name> (the grouping key's job as exported_job). Then only the
    # four drift gauges pushed under job terraform_drift are kept (not even
    # the Pushgateway's own series), and of their labels only the target's,
    # root and exported_job; any other label a pusher sends is dropped.
    # pod and instance go too: they change
    # when the pod is replaced, and without them a root stays one series, so
    # "the last value" means the last push. up and scrape_* aren't scraped
    # samples and keep their labels.
    serviceMonitor:
      enabled: true
      namespace: monitoring
      interval: 1m
      honorLabels: false
      metricRelabelings:
        - action: keep
          sourceLabels: [__name__, exported_job, root]
          separator: ";"
          regex: tnwks_terraform_drift_check_(timestamp_seconds|drifted|changed|failed);terraform_drift;[a-z0-9][a-z0-9_-]*
        - action: labelkeep
          regex: __name__|job|namespace|service|endpoint|container|k8s_cluster|root|exported_job
