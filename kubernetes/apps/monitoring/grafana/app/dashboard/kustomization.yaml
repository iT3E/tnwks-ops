---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
configMapGenerator:
  - name: grafana-dashboard
    files:
      - homelab-classic.json
      - unms_overview.json
      - wan-latency.json
      - wan-traffic.json
      - home-wifi.json
  # grafana.com 14694 rev 2, vendored because its queries use metrics that
  # windows_exporter 0.30+ removed (cs collector, windows_os_* memory gauges).
  - name: grafana-dashboard-windows
    files:
      - windows-exporter.json
# Mounted by the legacy and windows providers (../helmrelease.yaml), not the
# sidecar: no grafana_dashboard label. Removing a file retires its board.
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
