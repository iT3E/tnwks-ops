---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: grafana
      version: 14.4.0
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    # A standby site has an unbound WaitForFirstConsumer data PVC at 0, which
    # Helm's wait (kstatus) never sees as ready.
    disableWait: ${GRAFANA_HELM_DISABLE_WAIT:=false}
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    disableWait: ${GRAFANA_HELM_DISABLE_WAIT:=false}
    remediation:
      # Schema migration is forward-only; never automatically start v12 on
      # a database already migrated by v13. Recovery requires the DB backup.
      remediateLastFailure: false
      retries: 0
  uninstall:
    keepHistory: false
  dependsOn:
    - name: local-path-provisioner
      namespace: kube-system
    - name: ingress-nginx-internal
      namespace: networking
  values:
    image:
      repository: grafana/grafana
      tag: 13.3.0
      sha: 488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    # Which site runs it (docs/wsl/multi-site.md, "Switching an app"). A warm
    # app: homelab-wsl at 1, homelab-wsl-02 at 0 with a replica of grafana-pg.
    replicas: ${GRAFANA_REPLICAS:=1}
    # Fencing (docs/wsl/multi-site.md): wait while this site is fenced from
    # writing Grafana's database (grafana.lease.tnwks.local names it), or while
    # the lease can't be read. GRAFANA_LEASE_GATE=off skips it.
    extraInitContainers:
      - name: site-lease-gate
        image: docker.io/library/busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        command: ["sh", "-c"]
        args:
          - |
            [ "$GATE" = gate-off ] && { echo "lease gate off"; exit 0; }
            while true; do
              t=$(nslookup -type=txt "$LEASE" 2>/dev/null | sed -n 's/.*text = "\(.*\)"/\1/p' | head -1)
              if [ -z "$t" ]; then echo "lease $LEASE unreadable; waiting"
              elif [ "$t" = "$SITE" ]; then echo "$SITE is fenced from writing grafana; waiting"
              else echo "lease $LEASE: $t; not fenced, starting"; exit 0; fi
              sleep 10
            done
        env:
          - name: LEASE
            value: grafana.lease.tnwks.local.
          - name: SITE
            value: "${CLUSTER_NAME}"
          # Prefixed: a bare on/off would reach the chart as a YAML boolean.
          - name: GATE
            value: gate-${GRAFANA_LEASE_GATE:=on}
        securityContext:
          runAsUser: 65534
          runAsGroup: 65534
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 1m
            memory: 4Mi
          limits:
            memory: 16Mi
      # The Angular panels #1882 dropped from `plugins` stay on each site's
      # volume, and Grafana 13 can't load them. Nothing provisioned uses them.
      # A no-op once they're gone.
      - name: remove-angular-plugins
        image: docker.io/library/busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        command: ["sh", "-c"]
        args:
          - >-
            cd /var/lib/grafana/plugins 2>/dev/null || exit 0;
            rm -rf grafana-piechart-panel grafana-worldmap-panel natel-discrete-panel
            pr0ps-trackmap-panel vonage-status-panel
        securityContext:
          runAsUser: 472
          runAsGroup: 472
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 1m
            memory: 4Mi
          limits:
            memory: 16Mi
        volumeMounts:
          - name: storage
            mountPath: /var/lib/grafana
    deploymentStrategy:
      type: Recreate
    # init-chown-data runs busybox chown as root over the PVC. On WSL
    # local-path PVCs that EPERMs against existing files owned by the
    # grafana uid (472), and the pod CrashLoops. Modern grafana sets
    # its own ownership via fsGroup; we don't need the init container.
    initChownData:
      enabled: false
    admin:
      existingSecret: grafana-admin-secret
    env:
      GF_EXPLORE_ENABLED: true
      GF_SERVER_ROOT_URL: "https://grafana.${INTERNAL_DOMAIN}"

    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          # Removing a provider orphans its dashboards, which Grafana deletes on
          # startup; that is how retired dashboards leave the PVC-backed store.
          - name: network
            disableDeletion: false
            editable: true
            folder: "Network"
            options:
              path: /var/lib/grafana/dashboards/network
            orgId: 1
            type: file
          - name: unpoller
            disableDeletion: false
            editable: true
            folder: "UniFi Poller"
            options:
              path: /var/lib/grafana/dashboards/unpoller
            orgId: 1
            type: file
          - name: nginx
            disableDeletion: false
            editable: true
            folder: "NGINX"
            options:
              path: /var/lib/grafana/dashboards/nginx
            orgId: 1
            type: file
          - name: plausible
            disableDeletion: false
            editable: true
            folder: "Plausible"
            options:
              path: /var/lib/grafana/dashboards/plausible
            orgId: 1
            type: file

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - access: proxy
            isDefault: true
            name: Prometheus
            uid: PBFA97CFB590B2093
            type: prometheus
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
          # Dashboards default to Global. Local and the per-site entries answer
          # when Thanos does not; each site's Prometheus is a mesh global Service.
          - access: proxy
            name: Global
            uid: prometheus-global
            type: prometheus
            url: http://thanos-query.monitoring.svc.cluster.local:10902
            jsonData:
              prometheusType: Thanos
              timeInterval: 1m
          - access: proxy
            name: Local
            uid: prometheus-local
            type: prometheus
            url: http://kube-prometheus-stack-prometheus.monitoring:9090
            jsonData:
              timeInterval: 1m
          - access: proxy
            name: Site 1
            uid: prometheus-wsl
            type: prometheus
            url: http://prometheus-homelab-wsl.monitoring.svc.cluster.local:9090
            jsonData:
              timeInterval: 1m
          - access: proxy
            name: Site 2
            uid: prometheus-wsl-02
            type: prometheus
            url: http://prometheus-homelab-wsl-02.monitoring.svc.cluster.local:9090
            jsonData:
              timeInterval: 1m
          - access: proxy
            name: Loki
            type: loki
            uid: loki
            url: http://loki-gateway.monitoring.svc.cluster.local:80
          - access: proxy
            name: Tempo
            type: tempo
            uid: tempo
            url: http://tempo.monitoring.svc.cluster.local:3200
            jsonData:
              # Trace -> Logs correlation: jump from a Tempo span to the Faro
              # logs Alloy wrote to Loki for the same trace.
              tracesToLogsV2:
                datasourceUid: loki
                filterByTraceID: true
          # A fixed UID: deleteDatasources recreates it on every start, and
          # without one each start gave it a new identity.
          - name: Alertmanager
            uid: alertmanager
            type: alertmanager
            access: proxy
            url: http://alertmanager.monitoring.svc.cluster.local:9093
            jsonData:
              implementation: prometheus
        deleteDatasources:
          - name: Loki
            orgId: 1
          - name: Alertmanager
            orgId: 1

    # Same providers, folders, filenames and UIDs; no startup downloads.
    # Exact revisions and source hashes are in ../upstream/catalogue.json.
    dashboardsConfigMaps:
      network: grafana-upstream-network
      unpoller: grafana-upstream-unpoller
      nginx: grafana-upstream-nginx
      plausible: grafana-upstream-plausible

    # Grafana's own data (users, preferences, alert state, UI-made
    # dashboards) lives in Postgres on the CNPG cluster. A Grafana 13 rollback
    # requires restoring grafana-before-v13; the old SQLite file is stale.
    envFromSecrets:
      - name: grafana-database
    grafana.ini:
      database:
        type: postgres
        host: grafana-pg-rw.databases.svc.cluster.local:5432
        name: grafana
        ssl_mode: require
        # user/password: GF_DATABASE_USER / GF_DATABASE_PASSWORD from
        # grafana-database (secret-database.sops.yaml).
      analytics:
        check_for_updates: false
        check_for_plugin_updates: false
        reporting_enabled: false
      dashboards:
        # The sidecar writes it under its grafana_folder annotation. Grafana 13
        # takes the v2 file here and redirects to /d/default-home-dashboard/.
        default_home_dashboard_path: /tmp/dashboards/Overview/home.json
      date_formats:
        use_browser_locale: true
      explore:
        enabled: true
      grafana_net:
        url: https://grafana.net
      log:
        mode: console
      news:
        news_feed_enabled: false
      panels:
        disable_sanitize_html: false
      paths:
        data: /var/lib/grafana/data
        logs: /var/log/grafana
        plugins: /var/lib/grafana/plugins
        provisioning: /etc/grafana/provisioning
      security:
        allow_embedding: true
        # Lax: the frame inside HA (hass.internal) is same-site.
        cookie_samesite: lax
      server:
        root_url: https://grafana.${INTERNAL_DOMAIN}
      # The kiosk identity (the kitchen wall display's Monitoring frame in HA).
        # Cognito's login page refuses to load in a frame, so the frame signs
        # in with a JWT in the URL (?auth_token=, kept in the SPA for its API
        # calls) on grafana-embed (ingress-embed.yaml, no oauth2-proxy).
        # Ori mints the token with a key only it holds; Grafana checks it
        # against the public key below. sub/email = the Cognito kiosk user's
        # email, so it's the same Grafana user either way; role comes from
        # the token (Viewer) and strict means no role, no access.
      auth.jwt:
        enabled: true
        header_name: X-JWT-Assertion
        url_login: true
        username_claim: email
        email_claim: email
        jwk_set_file: /etc/grafana/kiosk-jwks/kiosk-jwks.json
        expect_claims: '{"iss": "tnwks-kiosk", "aud": "grafana"}'
        auto_sign_up: true
        role_attribute_path: role
        role_attribute_strict: true
        allow_assign_grafana_admin: false
      auth.proxy:
        enabled: true
        # X-Auth-Request-User from oauth2-proxy is the Cognito `sub` (a GUID).
        # Use the email header as the Grafana login instead so accounts have a
        # human-readable handle.
        header_name: X-Auth-Request-Email
        header_property: email
        headers: "Email:X-Auth-Request-Email Groups:X-Auth-Request-Groups"
        auto_sign_up: true
        enable_login_token: true
      auth:
        # Keep local admin login as fallback while oauth2-proxy is being rolled out.
        disable_login_form: false
        # With auth.proxy enabled, Grafana never owns the session — oauth2-proxy
        # re-injects X-Auth-Request-Email on the next request, so the in-app
        # sign-out button silently re-creates the user. Send logout to Cognito's
        # /logout endpoint, which ends the SSO session and then redirects to the
        # client's registered logout_url (oauth2-proxy /oauth2/sign_out), which
        # in turn clears the proxy cookie. End-to-end logout in one hop.
        signout_redirect_url: https://auth.tnwks.us/logout?client_id=${OAUTH2_PROXY_CLIENT_ID}&logout_uri=https%3A%2F%2Foauth2.${INTERNAL_DOMAIN}%2Foauth2%2Fsign_out
      users:
        auto_assign_org: true
        # Everyone signing in through oauth2-proxy (Cognito) starts as a
        # Viewer: read-only, including the shared kiosk identity on the
        # kitchen wall display. Admins are promoted in Grafana (Server Admin /
        # org Admin); the role only applies at first sign-in, so existing
        # admins keep theirs.
        auto_assign_org_role: Viewer

    imageRenderer:
      enabled: true
      # Runs on both sites, idle on the standby: the chart can't set 0 replicas
      # (it drops a zero and falls back to 1).
      existingSecret: grafana-renderer-auth
      image:
        tag: v5.12.10
        sha: a7970b826f6e477461e02bf5463d92634e9ad27d525e4e50296978a2e592d2d7
        pullPolicy: IfNotPresent
      env:
        SERVER_ADDR: "0.0.0.0:8081"
        RATE_LIMIT_MAX_LIMIT: "1"
        RATE_LIMIT_MIN_LIMIT: "1"
        RATE_LIMIT_MAX_AVAILABLE: "536870912"
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 768Mi

    plugins:
      - grafana-clock-panel@3.2.5

    podAnnotations:
      # Not the grafana ConfigMap: the chart's checksum/* annotations already
      # restart the pod when it changes, and Reloader doing the same at once
      # raced two Recreate rollouts and stalled the Deployment with no pod.
      secret.reloader.stakater.com/reload: grafana-secrets

    rbac:
      pspEnabled: false

    resources:
      # 219M was far too low: Grafana's working set (binary + multiple
      # datasources + dashboard/datasource sidecars + image-renderer) exceeds
      # it, so the kernel evicted its file-backed pages the moment they loaded
      # and re-read them from disk on the next access. That thrash showed up as
      # sustained multi-GB/s reads on the shared WSL vhdx (sdd) — 3 TB of
      # read_bytes against only 276 MB of actual read syscalls, with
      # workingset_refault_file in the hundreds of millions and memory.max hit
      # 16M times. Give it real headroom so its working set stays resident.
      limits:
        memory: 1Gi
      requests:
        cpu: 23m
        memory: 384Mi

    serviceMonitor:
      enabled: true

    # Global over Cluster Mesh: either site's ingress reaches Grafana wherever
    # it runs (docs/wsl/multi-site.md, "Shared VIPs").
    service:
      annotations:
        service.cilium.io/global: "true"
        service.cilium.io/affinity: local

    sidecar:
      dashboards:
        enabled: true
        labelValue: ""
        label: grafana_dashboard
        folderAnnotation: grafana_folder
        searchNamespace: ALL
        provider:
          disableDelete: true
          foldersFromFilesStructure: true
      datasources:
        enabled: true
        labelValue: ""
        searchNamespace: ALL
      logLevel: INFO

    ingress:
      enabled: true
      ingressClassName: nginx-internal
      annotations:
        hajimari.io/icon: simple-icons:grafana
        # OAUTH2_PROXY_URL: in-cluster on homelab-wsl; homelab-wsl-02 asks
        # homelab-wsl's over the LAN.
        nginx.ingress.kubernetes.io/auth-url: "${OAUTH2_PROXY_URL:=http://oauth2-proxy.auth.svc.cluster.local:80}/oauth2/auth"
        # Through the Service, not EndpointSlices, which have no remote backends.
        nginx.ingress.kubernetes.io/service-upstream: "true"
        nginx.ingress.kubernetes.io/auth-signin: "https://oauth2.${INTERNAL_DOMAIN}/oauth2/start?rd=$scheme://$host$escaped_request_uri"
        nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Groups,X-Auth-Request-Email"
        # Cognito-backed sessions are split across multiple cookies; the
        # subrequest header chunk overflows nginx's default 4k buffer.
        nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
        nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
      hosts:
        - &host "grafana.${INTERNAL_DOMAIN}"
      tls:
        - hosts:
            - *host
    extraConfigmapMounts:
      - name: kiosk-jwks
        mountPath: /etc/grafana/kiosk-jwks
        configMap: grafana-kiosk-jwks
        readOnly: true
    persistence:
      enabled: true
      storageClassName: "${STORAGE_CLASS_DEFAULT}"

