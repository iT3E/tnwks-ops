---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Pre Flux-Kustomizations
  - ./namespace.yaml
  # Flux-Kustomizations
  - ./alertmanager/ks.yaml
  - ./blackbox-exporter/ks.yaml
  - ./grafana/ks.yaml
  - ./kube-prometheus-stack/ks.yaml
  - ./node-exporter/ks.yaml
  - ./unpoller/ks.yaml
  - ./unms-exporter/ks.yaml
  - ./snmp-exporter/ks.yaml
  - ./smokeping-prober/ks.yaml
  - ./flow-collector/ks.yaml
  - ./mktxp/ks.yaml
  - ./plausible-exporter/ks.yaml
  # Faro frontend-observability stack — runs on every cluster. loki now uses
  # the filesystem backend (single-binary) instead of Rook S3, so it's viable
  # on WSL too; tempo is filesystem-backed single-binary; alloy receives Faro
  # SDK telemetry and fans it out to tempo (traces) + loki (logs).
  - ./loki/ks.yaml
  - ./tempo/ks.yaml
  - ./alloy/ks.yaml
  # vector-aggregator: receives the router's syslog (and, on MS-01, the pod-log
  # agent) and writes to loki.
  - ./vector/ks.yaml
# thanos and the vector pod-log agent remain MS-01 only (thanos needs a Rook
# Ceph S3 bucket; see vector/ks-agent.yaml for the agent). Added back via
# kubernetes/clusters/ms-01/apps/kustomization.yaml.
