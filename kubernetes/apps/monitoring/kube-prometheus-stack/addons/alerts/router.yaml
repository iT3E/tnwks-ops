---
# RB5009 (sce-rtr01), via mktxp (monitoring/mktxp). mktxp answers /metrics even
# when it cannot reach the router, so "router unreachable" is the absence of
# router metrics, not up == 0.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: router-alerts
spec:
  groups:
    - name: router
      rules:
        - alert: RouterUnreachable
          expr: absent(mktxp_system_uptime{routerboard_name="sce-rtr01"})
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Router metrics missing"
            description: >-
              No metrics from sce-rtr01 for 3 minutes: the router, its api-ssl
              service, or mktxp is down. If the internet still works, check the
              mktxp pod and the router's `monitoring` address list.

        - alert: RouterWANDown
          expr: mktxp_interface_running{routerboard_name="sce-rtr01",name="ether1"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Router WAN port (ether1) is down"
            description: "ether1 on sce-rtr01 has no link: internet is down."

        - alert: RouterTrunkDown
          expr: mktxp_interface_running{routerboard_name="sce-rtr01",name="ether2"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Router trunk (ether2) is down"
            description: "ether2 on sce-rtr01 is the trunk to the switch; every VLAN is cut off."

        - alert: RouterHighCPU
          expr: max(mktxp_system_cpu_load{routerboard_name="sce-rtr01"}) > 85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Router CPU above 85% for 15m"
            description: "sce-rtr01 CPU at {{ $value }}%."

        - alert: RouterCriticalCPU
          expr: max(mktxp_system_cpu_load{routerboard_name="sce-rtr01"}) > 95
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Router CPU above 95%"
            description: "sce-rtr01 CPU at {{ $value }}%: forwarding is likely degraded."

        - alert: RouterHighMemory
          expr: |
            1 - (
              max(mktxp_system_free_memory{routerboard_name="sce-rtr01"})
              / max(mktxp_system_total_memory{routerboard_name="sce-rtr01"})
            ) > 0.85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Router memory above 85%"
            description: "sce-rtr01 memory at {{ $value | humanizePercentage }}. The DNS adlists live in RAM."

        # Adlist names are stored in the DNS cache. When an import hits
        # cache-size, RouterOS logs "adlist read: max cache size reached",
        # stops that list, and the list stays stuck even after the cache grows
        # (fix: raise cache_size, then terraform apply -replace the adlists).
        # Healthy is ~63% (205 of 320 MiB); the broken 10 MiB cache sat at
        # 99%, dipping to ~80% only right after a refresh.
        - alert: RouterDNSCacheNearFull
          expr: |
            max(mktxp_dns_info{routerboard_name="sce-rtr01",property="cache_used"})
            / max(mktxp_dns_info{routerboard_name="sce-rtr01",property="cache_size"}) > 0.8
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Router DNS cache above 80%: adlist imports at risk"
            description: >-
              sce-rtr01 DNS cache is {{ $value | humanizePercentage }} full
              ({{ with query "round(max(mktxp_dns_info{routerboard_name=\"sce-rtr01\",property=\"cache_used\"}) / 1048576)" }}{{ . | first | value }}{{ end }}
              of {{ with query "round(max(mktxp_dns_info{routerboard_name=\"sce-rtr01\",property=\"cache_size\"}) / 1048576)" }}{{ . | first | value }}{{ end }} MiB).
              The adlists live in this cache; once it fills, list imports stop and
              those lists stay stuck. Raise dns.cache_size in the mikrotik
              Terraform, then check /ip dns adlist print for lists stuck at a
              few names and terraform apply -replace them.

        - alert: RouterStorageLow
          expr: |
            max(mktxp_system_free_hdd_space{routerboard_name="sce-rtr01"})
            / max(mktxp_system_total_hdd_space{routerboard_name="sce-rtr01"}) < 0.15
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Router storage below 15% free"
            description: "sce-rtr01 flash at {{ $value | humanizePercentage }} free."

        - alert: RouterInterfaceErrors
          expr: |
            rate(mktxp_interface_rx_error_total{routerboard_name="sce-rtr01"}[5m])
            + rate(mktxp_interface_tx_error_total{routerboard_name="sce-rtr01"}[5m]) > 10
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Router interface {{ $labels.name }} seeing errors"
            description: "{{ $labels.name }} averaging {{ $value | humanize }} errors/sec."
