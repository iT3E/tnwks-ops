---
# Home Wi-Fi: the three UniFi APs, their SW03 uplink ports and the exporter
# that feeds most of this (unpoller, 2 min refresh). Dashboard: "Home Wi-Fi"
# (grafana/app/dashboard/home-wifi.json).
#
# Every unpoller expression aggregates by (name[, radio]) first: after an
# unpoller restart the old and new pod's series overlap for a while and
# would otherwise count twice. It also drops the essid/bssid/mac labels,
# which must never reach an alert (the War Room is a group chat).
#
# Thresholds come from 48h of history (2026-11-02..04), when the busiest
# 30-minute channel use was 51% (Kitchen 2.4 GHz), the busiest AP's retry
# ratio 32% and the lowest 30-minute VAP satisfaction 0.88.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: wifi-alerts
spec:
  groups:
    - name: wifi
      rules:
        # unpoller keeps answering scrapes (up == 1) when its controller calls
        # fail; then only unpoller_prometheus_* series exist. A refresh runs
        # every 2 minutes, ~15 per 30 minutes, so >10 failures means most fail.
        - alert: UnifiExporterBlind
          expr: |
            sum(increase(unpoller_prometheus_refresh_failures_total[30m])) > 10
            or
            absent(unpoller_device_info)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "unpoller gets no data from the UniFi controller"
            description: >-
              {{ with query "absent(unpoller_device_info)" }}unpoller exports no AP metrics at all
              (not scraped, or no successful controller refresh since it started).{{ else }}unpoller
              failed {{ with query "round(sum(increase(unpoller_prometheus_refresh_failures_total[30m])))" }}{{ . | first | value }}{{ end }}
              of ~15 controller refreshes in the last 30m.{{ end }}
              Every other Wi-Fi alert is blind until this clears.
              Check `kubectl -n monitoring logs deploy/unpoller --tail=20` and the
              controller (networking/unifi).

        # 1000 Mbps on all three APs for the whole 48h baseline. 100 Mbps (or
        # 10) is the classic symptom of one bad pair in the cable run.
        - alert: WifiAPUplinkDegraded
          expr: max by (name) (unpoller_device_uplink_speed_mbps) < 1000
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "AP uplink below 1 Gbps"
            description: >-
              {{ $labels.name }} negotiated {{ $value }} Mbps on its uplink instead
              of 1000. Usually a bad pair in the patch lead, keystone or run.
              SW03 ports: Kitchen 0/0/0, Master 0/0/1, Living Room 0/0/12
              (`show interface gigabitethernet 0/0/<n>`: speed, link flaps, CRC).

        # smokeping-prober pings each AP's management address once a second.
        # Gated on the router hop (role lan) and on SW03 (role switch): if
        # those drop too, the problem is the path from the cluster (e.g. the
        # WSL host's wg01-home tunnel being down), not the AP. An upgrade
        # reboot takes ~1-3 min and stays under `for`.
        - alert: WifiAPUnreachable
          expr: |
            max by (host, name) (smokeping:loss_ratio:rate1m{role="ap"}) > 0.5
            and on ()
            max(smokeping:loss_ratio:rate1m{role="lan"}) < 0.1
            and on ()
            max(smokeping:loss_ratio:rate1m{role="switch"}) < 0.1
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "AP not answering pings"
            description: >-
              {{ $labels.name }} ({{ $labels.host }}) lost {{ $value | humanizePercentage }}
              of its pings over the last minute while the router and SW03 answer.
              The AP is down, rebooting for longer than an upgrade takes, or its
              uplink is flapping (see WifiAPPortFlapping, SW03 `show log all`).

        # SW03 port link changes, from ifLastChange (snmp-exporter, 30s
        # scrape): it jumps forward on every link state change. ifOperStatus
        # alone misses a down/up that falls between two scrapes. ArubaOS
        # computes ifLastChange on the fly and it wobbles by 1s (100 ticks)
        # from one read to the next, so a change is a jump of more than 3s;
        # plain changes() would count every wobble. Still at most one change
        # per 30s interval.
        # A normal AP reboot or firmware upgrade gives 3-4 down/up cycles
        # (6-8 changes); the Master AP's bad night (2026-11-02) gave 10-12 per
        # hour.
        - alert: WifiAPPortFlapping
          expr: |
            max by (ap, ifName) (
              count_over_time(
                (
                  (
                    ifLastChange{job="snmp-exporter-prometheus-snmp-exporter",ap!=""}
                    - ifLastChange{job="snmp-exporter-prometheus-snmp-exporter",ap!=""} offset 30s
                  ) > 300
                )[1h:30s]
              )
            ) > 10
          labels:
            severity: warning
          annotations:
            summary: "AP switch port flapping"
            description: >-
              SW03 {{ $labels.ifName }} ({{ $labels.ap }}) changed link state in
              {{ $value }} scrape intervals over the last hour, more than an AP
              reboot or upgrade causes. Suspect the cable, keystone or run; check
              `show interface {{ $labels.ifName }}` (link flaps, CRC, giants) and
              `show log all` on SW03 (its clock runs fast).

        # 30-minute average, so the 5-minute 86-89% spikes (a client at the
        # 1 Mbps floor) don't page.
        - alert: WifiChannelBusy
          expr: |
            avg_over_time(
              (max by (name, radio) (unpoller_device_radio_channel_utilization_total_ratio))[30m:2m]
            ) > 0.7
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Wi-Fi channel airtime above 70%"
            description: >-
              {{ $labels.name }} radio {{ $labels.radio }} (ng = 2.4 GHz, na = 5 GHz)
              averaged {{ $value | humanizePercentage }} channel use over 30 minutes.
              Clients on that radio get slow. Look at the Home Wi-Fi dashboard's
              airtime split: high self-RX/TX is our own clients (a slow client at
              a low rate), high "other" is neighbours or interference.

        # Per AP, from the device-level counters (retries / attempts). The
        # per-VAP counters reset whenever clients churn and are unusable.
        # Volume gate: >50 attempts/s, so the Master AP's permanent ~64%
        # (a few weak IoT bulbs at ~7 attempts/s) stays a dashboard item.
        - alert: WifiRetriesHigh
          expr: |
            (
              sum by (name) (rate(unpoller_device_stat_retries_tx_total[1h]))
              /
              sum by (name) (rate(unpoller_device_stat_wifi_transmit_attempts_total[1h]))
              > 0.4
            )
            and
            sum by (name) (rate(unpoller_device_stat_wifi_transmit_attempts_total[1h])) > 50
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "AP retrying over 40% of transmissions"
            description: >-
              {{ $labels.name }} retried {{ $value | humanizePercentage }} of its
              transmit attempts over the last hour, at a real traffic volume.
              Usually a busy client stuck on a far AP (e.g. after a firmware
              upgrade night) or interference. Check the dashboard's top retry
              clients and weak clients tables.

        # VAPs without clients report -0.01; `>= 0` drops them.
        - alert: WifiSatisfactionLow
          expr: |
            avg_over_time(
              (max by (name, radio) (unpoller_device_vap_satisfaction_ratio) >= 0)[30m:2m]
            ) < 0.8
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Wi-Fi client satisfaction below 80%"
            description: >-
              {{ $labels.name }} radio {{ $labels.radio }} (ng = 2.4 GHz, na = 5 GHz)
              averaged {{ $value | humanizePercentage }} satisfaction over 30 minutes
              (UniFi's score from retries, latency and signal). Lowest 30-minute
              average in the 48h baseline was 88%. Check channel use, retries and
              weak clients on the dashboard.

        # Firmware auto-upgrade runs at 03:00 local (unifi_setting.site). The
        # window is UTC 09:00-13:00 so it covers 03:00-04:00 local both in PST
        # (01:00-05:00) and PDT (02:00-06:00); Prometheus has no time zones.
        # resets() looks back 10 minutes, so the alert clears ~10 minutes after
        # the reboot. An AP that stays offline longer than that and comes back
        # isn't seen (its subquery window holds only the new uptime).
        - alert: WifiAPRebootedOutsideUpgradeWindow
          expr: |
            resets((max by (name) (unpoller_device_uptime_seconds))[10m:2m]) > 0
            unless on ()
            (hour() >= 9 and hour() < 13)
          labels:
            severity: warning
          annotations:
            summary: "AP rebooted outside the firmware upgrade window"
            description: >-
              {{ $labels.name }} restarted (uptime went back to
              {{ with query (printf "round(max by (name) (unpoller_device_uptime_seconds{name=%q}))" $labels.name) }}{{ . | first | value | humanizeDuration }}{{ end }})
              outside the 03:00 auto-upgrade window. Suspect power or PoE (SW03
              `show poe interface brief`), a crash, or someone power-cycling it.
