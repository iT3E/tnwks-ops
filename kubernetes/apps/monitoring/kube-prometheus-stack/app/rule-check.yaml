---
# The daily check of the network rule of Prometheus
# (scripts/prometheus_rule_check.py): a reader may query, and may not write
# on the OTLP path or the remote write path. Its pod has labels of its own,
# never the labels of Grafana (it would join the Service of Grafana), and
# networkpolicy.yaml names it in the block of the readers, next to Grafana,
# so it gets the requests that Grafana gets. A failed run raises
# KubeJobFailed, and the AI board shows the CronJob on its Checks tab
# (observability/inventory.py, AI_SCHEDULES). No request changes anything in
# Prometheus, with or without the rule.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: prometheus-rule-check
  labels:
    app.kubernetes.io/name: prometheus-rule-check
spec:
  schedule: "53 5 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: prometheus-rule-check
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              image: docker.io/library/python:3.15.2-slim-trixie@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
              command:
                - python3
                - /scripts/prometheus_rule_check.py
              env:
                - name: PROMETHEUS_URL
                  value: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: prometheus-rule-check
