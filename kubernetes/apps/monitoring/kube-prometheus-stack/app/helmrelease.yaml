---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  maxHistory: 2
  timeout: 20m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 93.1.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 30m
  values:
    defaultRules:
      disabled:
        # Counts process_start_time_seconds changes, which WSL-02's drifting
        # clock produces without any restart. Replaced by AlertmanagerCrashlooping
        # (addons/alerts/alertmanager.yaml), from kube-state-metrics' restarts.
        AlertmanagerClusterCrashlooping: true
    crds:
      enabled: true
      # Helm itself never upgrades CRDs. Chart 60+ ships an opt-in
      # CRD upgrade Job that runs as a helm hook so prometheus-operator
      # CRDs actually move when the chart version moves; without it
      # the operator pod crashloops on schema mismatches after big
      # jumps (e.g. 54 → 85).
      upgradeJob:
        enabled: true
        forceConflicts: true

    ###
    ### Component values
    ###
    alertmanager:
      enabled: false

    kubeApiServer:
      enabled: true
      serviceMonitor:
        metricRelabelings:
          # Remove duplicate metrics
          - sourceLabels: ["__name__"]
            regex: "(aggregator_openapi|aggregator_unavailable|apiextensions_openapi|apiserver_admission|apiserver_audit|apiserver_cache|apiserver_cel|apiserver_client|apiserver_crd|apiserver_current|apiserver_envelope|apiserver_flowcontrol|apiserver_init|apiserver_kube|apiserver_longrunning|apiserver_request|apiserver_requested|apiserver_response|apiserver_selfrequest|apiserver_storage|apiserver_terminated|apiserver_tls|apiserver_watch|apiserver_webhooks|authenticated_user|authentication|disabled_metric|etcd_bookmark|etcd_lease|etcd_request|field_validation|get_token|go|grpc_client|hidden_metric|kube_apiserver|kubernetes_build|kubernetes_feature|node_authorizer|pod_security|process_cpu|process_max|process_open|process_resident|process_start|process_virtual|registered_metric|rest_client|scrape_duration|scrape_samples|scrape_series|serviceaccount_legacy|serviceaccount_stale|serviceaccount_valid|watch_cache|workqueue)_(.+)"
            action: keep
          - sourceLabels: ["__name__"]
            regex: (apiserver|etcd|rest_client)_request(|_sli|_slo)_duration_seconds_bucket
            action: drop
          - sourceLabels: ["__name__"]
            regex: (apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket)
            action: drop

    kubeControllerManager:
      enabled: false

    kubeEtcd:
      enabled: false

    kubelet:
      enabled: true
      serviceMonitor:
        metricRelabelings:
          # Remove duplicate metrics
          - sourceLabels: ["__name__"]
            regex: "(apiserver_audit|apiserver_client|apiserver_delegated|apiserver_envelope|apiserver_storage|apiserver_webhooks|authentication_token|cadvisor_version|container_blkio|container_cpu|container_fs|container_last|container_memory|container_network|container_oom|container_processes|container|csi_operations|disabled_metric|get_token|go|hidden_metric|kubelet_certificate|kubelet_cgroup|kubelet_container|kubelet_containers|kubelet_cpu|kubelet_device|kubelet_graceful|kubelet_http|kubelet_lifecycle|kubelet_managed|kubelet_node|kubelet_pleg|kubelet_pod|kubelet_run|kubelet_running|kubelet_runtime|kubelet_server|kubelet_started|kubelet_volume|kubernetes_build|kubernetes_feature|machine_cpu|machine_memory|machine_nvm|machine_scrape|node_namespace|plugin_manager|prober_probe|process_cpu|process_max|process_open|process_resident|process_start|process_virtual|registered_metric|rest_client|scrape_duration|scrape_samples|scrape_series|storage_operation|volume_manager|volume_operation|workqueue)_(.+)"
            action: keep
          - sourceLabels: ["node"]
            targetLabel: instance
            action: replace

    kubeProxy:
      enabled: false

    kubeScheduler:
      enabled: false

    kubeStateMetrics:
      enabled: true
    kube-state-metrics:
      metricLabelsAllowlist:
        - "persistentvolumeclaims=[*]"
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
      resources:
        requests:
          cpu: 15m
          memory: 127M
        limits:
          memory: 153M

    nodeExporter:
      enabled: false

    grafana:
      enabled: false
      forceDeployDashboards: true
      sidecar:
        dashboards:
          multicluster:
            etcd:
              enabled: true

    ###
    ### Prometheus operator values
    ###
    prometheusOperator:
      resources:
        requests:
          cpu: 35m
          memory: 273M
        limits:
          memory: 326M

      prometheusConfigReloader:
        # resource config for prometheusConfigReloader
        resources:
          requests:
            cpu: 5m
            memory: 64M
          limits:
            memory: 64M

    ###
    ### Prometheus instance values
    ###
    prometheus:
      # The sidecar's HTTP metrics (upload age, for homelab:unuploaded_block_age_seconds).
      thanosService:
        enabled: true
      thanosServiceMonitor:
        enabled: true
      ingress:
        enabled: true
        ingressClassName: nginx-internal
        pathType: Prefix
        hosts:
          - &host_prometheus prometheus.${INTERNAL_DOMAIN}
        tls:
          - hosts:
              - *host_prometheus

      prometheusSpec:
        additionalAlertManagerConfigs:
          - static_configs:
              - targets:
                  - alertmanager.monitoring.svc.cluster.local:9093
            api_version: v2
        additionalScrapeConfigs:

          # The other WSL site's Prometheus, through its LAN bridge (port 9090):
          # just what this site alerts on (peer-rules.yaml). source_site marks
          # the federated series; honor_labels keeps their own labels.
          - job_name: peer-federate
            honor_labels: true
            metrics_path: /federate
            scrape_interval: 60s
            scrape_timeout: 20s
            params:
              match[]:
                - 'cnpg_pg_stat_archiver_last_archived_wal_start_lsn'
                - 'cnpg_pg_replication_in_recovery'
                # UniFi (unpoller runs where the controller runs), so the
                # dashboards on either site see the APs.
                - '{__name__=~"unpoller_.*"}'
            static_configs:
              - targets:
                  - ${PEER_WINDOWS_HOST_ADDR}:9090
                labels:
                  source_site: ${PEER_CLUSTER_NAME}
                  k8s_cluster: ${PEER_CLUSTER_NAME}

          # This site's Windows host over vEthernet, and the other site's over
          # the LAN (docs/wsl/multi-site.md: each site watches the other).
          # instance = the Windows computer name (cluster-settings).
          - job_name: windows-exporter
            scrape_interval: 30s
            scrape_timeout: 10s
            static_configs:
              - targets:
                  - ${WINDOWS_HOST_IP}:9182
                labels:
                  instance: ${WINDOWS_HOST_NAME}
                  k8s_cluster: ${CLUSTER_NAME}
              - targets:
                  - ${PEER_WINDOWS_HOST_ADDR}:9182
                labels:
                  instance: ${PEER_WINDOWS_HOST_NAME}
                  k8s_cluster: ${PEER_CLUSTER_NAME}

          # SMART disk health on the Windows host. smartctl_exporter runs there as the
          # SYSTEM scheduled task \Prometheus\smartctl_exporter and re-reads the drives
          # every 120s, so scraping faster than 60s only returns cached values. Both
          # Windows exporters are installed by the Ansible role
          # infrastructure/ansible/roles/windows_monitoring (task wsl-host:monitoring).
          - job_name: smartctl-exporter
            scrape_interval: 60s
            scrape_timeout: 20s
            static_configs:
              - targets:
                  - ${WINDOWS_HOST_IP}:9633
                labels:
                  instance: ${WINDOWS_HOST_NAME}
                  k8s_cluster: ${CLUSTER_NAME}
              - targets:
                  - ${PEER_WINDOWS_HOST_ADDR}:9633
                labels:
                  instance: ${PEER_WINDOWS_HOST_NAME}
                  k8s_cluster: ${PEER_CLUSTER_NAME}

          # Coral detector services on the Windows host (docs/wsl/coral-detector.md),
          # one target per Coral: tnwks-coral-detector-<id> serves /metrics on
          # 9555 + id. honor_labels keeps the server's own `device` label, which is
          # the same id as the target label (that one also lands on `up`).
          - job_name: coral-detector
            scrape_interval: 30s
            scrape_timeout: 10s
            honor_labels: true
            static_configs:
              - targets:
                  - ${WINDOWS_HOST_IP}:9555
                labels:
                  instance: ${WINDOWS_HOST_NAME}
                  device: "0"
                  k8s_cluster: ${CLUSTER_NAME}

          - job_name: unms_exporter
            # for a static target "unms.example.org", rewrite it to
            # "exporter.example.org:9806/metrics?target=unms.example.org",
            # but keep "unms.example.org" as instance label
            relabel_configs:
              - source_labels: [__address__]
                target_label: instance
              - source_labels: [__address__]
                target_label: __param_target
              - replacement: 'unms-exporter.monitoring.svc.cluster.local:9806'
                target_label: __address__
            static_configs:
              - targets:
                - uisp.tnwks.us
                labels:
                  k8s_cluster: ${CLUSTER_NAME}


        enableAdminAPI: true
        # On every alert too, so the War Room shows which cluster sent it.
        externalLabels:
          cluster: ${CLUSTER_NAME}
        # The global Services select one site's Prometheus by this label.
        podMetadata:
          labels:
            k8s_cluster: ${CLUSTER_NAME}
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        replicas: 1
        replicaExternalLabelName: "__replica__" # must match with thanos value `.query.replicaLabel[0]`
        resources:
          requests:
            cpu: 257m
            memory: 3760M
          limits:
            memory: 3760M
        retention: 2d
        retentionSize: "6GB"
        ruleSelectorNilUsesHelmValues: false
        scrapeInterval: 1m
        # Which site a series describes, on every target. External labels are
        # invisible to local queries, and `cluster` already names the CNPG
        # cluster on database series. additionalScrapeConfigs set it per target.
        scrapeClasses:
          - name: site
            default: true
            relabelings:
              - targetLabel: k8s_cluster
                replacement: ${CLUSTER_NAME}
        serviceMonitorSelectorNilUsesHelmValues: false
        # storageSpec: empty {} = emptyDir. On WSL kubelet doesn't honor
        # fsGroupChangePolicy on local-path PVCs (the prometheus container
        # uid:gid 1000:2000 hits `permission denied:
        # /prometheus/queries.active` and crashloops). EmptyDir works.
        # Both WSL sites patch this to a claim with 15d retention in their
        # overlays. MS-01 should patch it to ceph-block when it is bootstrapped.
        storageSpec: {}
        # StoreAPI for the global view (mutual TLS over the mesh) and block
        # upload to Garage. Keep the image equal to versions.py.
        thanos:
          image: quay.io/thanos/thanos:v0.42.5@sha256:0a546b98a8dd47735456ab389983675ee363d68127e334937a9fceeea10da5e7
          objectStorageConfig:
            existingSecret:
              name: observability-thanos-objstore
              key: objstore.yaml
          grpcServerTlsConfig:
            certFile: /tls/tls.crt
            keyFile: /tls/tls.key
            caFile: /tls/ca.crt
          volumeMounts:
            - name: observability-store-server
              mountPath: /tls
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
        volumes:
          - name: observability-store-server
            secret:
              secretName: observability-store-server
        walCompression: true

  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: ConfigMap
              labelSelector: grafana_dashboard in (1)
            patch: |-
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: not-used
                namespace: not-used
                annotations:
                  grafana_folder: Kubernetes
