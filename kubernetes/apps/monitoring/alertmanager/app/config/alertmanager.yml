templates:
  - /etc/alertmanager/*.tmpl

receivers:
  - name: "null"
  - name: "telegram"
    telegram_configs:
      # Token lives in secrets.sops.yaml (key: telegram_bot_token) and is mounted
      # at /etc/secrets by the HelmRelease `persistence.secrets` volume.
      # NEVER inline the token here: this repository is public.
      - bot_token_file: /etc/secrets/telegram_bot_token
        chat_id: -5257099089
        send_resolved: true
        parse_mode: HTML
        # Template: telegram.tmpl (same ConfigMap). Shows per-alert labels
        # and runbook/graph links so grouped alerts are distinguishable.
        message: '{{ template "telegram.message" . }}'
  # Off-site dead man's switch. Watchdog always fires while Prometheus and
  # Alertmanager work; healthchecks.io messages Telegram when these pings stop
  # (power cut, WAN down, desktop or cluster not back up). The check is
  # `homelab-wsl` in infrastructure/terraform/environments/prod/healthchecks;
  # see docs/operations/external-monitoring.md.
  - name: "healthchecks"
    webhook_configs:
      # https://hc-ping.com/<ping key>/homelab-wsl, from secrets.sops.yaml
      # (key: healthchecks_watchdog_url). The ping key is secret.
      - url_file: /etc/secrets/healthchecks_watchdog_url
        send_resolved: false
        timeout: 10s
  # Telegram delivery heartbeat (AlertDeliveryHeartbeat, kube-prometheus-stack
  # addons/alerts/heartbeats.yaml) -> check `alert-delivery`. It has to bypass
  # Telegram, the path it vouches for.
  - name: "healthchecks-delivery"
    webhook_configs:
      # https://hc-ping.com/<ping key>/alert-delivery, from secrets.sops.yaml
      # (key: healthchecks_delivery_url).
      - url_file: /etc/secrets/healthchecks_delivery_url
        send_resolved: false
        timeout: 10s

route:
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 6h
  receiver: "telegram"
  routes:
    # Every 2 minutes: a repeat goes out on the first group_interval tick
    # after repeat_interval, and with both at 1m that is every other tick
    # (measured on v0.34.2). The check alerts after 3m + 4m grace of silence.
    - receiver: "healthchecks"
      matchers:
        - alertname = "Watchdog"
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - receiver: "healthchecks-delivery"
      matchers:
        - alertname = "AlertDeliveryHeartbeat"
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - receiver: "null"
      matchers:
        - alertname = "InfoInhibitor"
    # Pushed by the finance-sync CronJob after it has already corrected the
    # balance. It fires on timing (a bank balance moves before its
    # transactions reach Simplifi, then the correction reverses next run) and
    # looks the same as real drift, so nobody can act on it. Dropped here;
    # FinanceSyncStale, FinanceBankConnectionBroken, FinanceRefreshTimeout and
    # KubeJobFailed cover the failures that need a person.
    - receiver: "null"
      matchers:
        - alertname = "FinanceReconciliationDrift"
    # Pushed by the finance-sync CronJob; a broken bank connection stays
    # firing while it is broken (often for weeks), so remind once a day
    # instead of every 6h. Silence one connection by its `connection` label.
    - receiver: "telegram"
      matchers:
        - alertname = "FinanceBankConnectionBroken"
      repeat_interval: 24h
    - receiver: "telegram"
      matchers:
        - severity = critical
      continue: true

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["alertname", "namespace"]
