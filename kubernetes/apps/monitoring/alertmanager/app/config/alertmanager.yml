templates:
  - /etc/alertmanager/*.tmpl

receivers:
  - name: "null"
  - name: "telegram"
    telegram_configs:
      # Token lives in secrets.sops.yaml (key: telegram_bot_token) and is mounted
      # at /etc/secrets by the HelmRelease `persistence.secrets` volume.
      # NEVER inline the token here: this repository is public.
      - bot_token_file: /etc/secrets/telegram_bot_token
        chat_id: -5257099089
        send_resolved: true
        parse_mode: HTML
        # Template: telegram.tmpl (same ConfigMap). Shows per-alert labels
        # and runbook/graph links so grouped alerts are distinguishable.
        message: '{{ template "telegram.message" . }}'

route:
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 6h
  receiver: "telegram"
  routes:
    - receiver: "null"
      matchers:
        - alertname =~ "InfoInhibitor|Watchdog"
    # Pushed by the finance-sync CronJob after it has already corrected the
    # balance. It fires on timing (a bank balance moves before its
    # transactions reach Simplifi, then the correction reverses next run) and
    # looks the same as real drift, so nobody can act on it. Dropped here;
    # FinanceSyncStale, FinanceBankConnectionBroken, FinanceRefreshTimeout and
    # KubeJobFailed cover the failures that need a person.
    - receiver: "null"
      matchers:
        - alertname = "FinanceReconciliationDrift"
    # Pushed by the finance-sync CronJob; a broken bank connection stays
    # firing while it is broken (often for weeks), so remind once a day
    # instead of every 6h. Silence one connection by its `connection` label.
    - receiver: "telegram"
      matchers:
        - alertname = "FinanceBankConnectionBroken"
      repeat_interval: 24h
    - receiver: "telegram"
      matchers:
        - severity = critical
      continue: true

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["alertname", "namespace"]
