---
# Pyrra's operator: read the SLOs and write the PrometheusRules it generates
# (upstream examples/kubernetes/manifests/pyrra-kubernetesClusterRole.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pyrra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pyrra-kubernetes
rules:
  - apiGroups: [monitoring.coreos.com]
    resources: [prometheusrules]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [monitoring.coreos.com]
    resources: [prometheusrules/status]
    verbs: [get]
  - apiGroups: [pyrra.dev]
    resources: [servicelevelobjectives]
    verbs: [get, list, watch]
  - apiGroups: [pyrra.dev]
    resources: [servicelevelobjectives/status]
    verbs: [get, patch, update]
  - apiGroups: [pyrra.dev]
    resources: [servicelevelobjectives/finalizers]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pyrra-kubernetes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pyrra-kubernetes
subjects:
  - kind: ServiceAccount
    name: pyrra
    namespace: monitoring
