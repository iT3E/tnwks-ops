---
# Exists on both sites; the only Garage backend lives on WSL-02.
apiVersion: v1
kind: Service
metadata:
  name: observability-archive
  annotations:
    service.cilium.io/global: "true"
spec:
  ports:
    - name: https
      port: 443
      targetPort: 8443
  selector:
    app.kubernetes.io/name: observability-garage
    app.kubernetes.io/instance: observability-garage
    app.kubernetes.io/component: garage
