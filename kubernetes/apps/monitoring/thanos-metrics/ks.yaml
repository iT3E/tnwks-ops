---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: thanos-metrics
  namespace: flux-system
spec:
  dependsOn:
    - name: observability-pki
    - name: kube-prometheus-stack
  path: ./kubernetes/apps/monitoring/thanos-metrics/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 30m
  retryInterval: 1m
  timeout: 10m
