---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thanos-store
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      app:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: 'true'
        pod:
          automountServiceAccountToken: false
          labels:
            k8s_cluster: ${CLUSTER_NAME}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          nodeSelector:
            kubernetes.io/hostname: ${OBSERVABILITY_ARCHIVE_NODE}
        containers:
          app:
            image:
              repository: quay.io/thanos/thanos
              tag: v0.42.5@sha256:0a546b98a8dd47735456ab389983675ee363d68127e334937a9fceeea10da5e7
            args:
            - store
            - --http-address=0.0.0.0:10902
            - --grpc-address=0.0.0.0:10901
            - --grpc-server-tls-cert=/tls/tls.crt
            - --grpc-server-tls-key=/tls/tls.key
            - --grpc-server-tls-client-ca=/tls/ca.crt
            - --objstore.config-file=/objstore/objstore.yaml
            - --data-dir=/data
            - --index-cache-size=128MB
            - --chunk-pool-size=256MB
            - --store.grpc.series-max-concurrency=4
            - --store.limits.request-series=50000
            - --store.limits.request-samples=5000000
            - --block-sync-concurrency=4
            env:
              GOMEMLIMIT: '858993459'
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /-/healthy
                    port: 10902
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /-/ready
                    port: 10902
                  timeoutSeconds: 5
                  failureThreshold: 6
    service:
      app:
        controller: app
        ports:
          http:
            port: 10902
          grpc:
            port: 10901
    persistence:
      tls:
        type: secret
        name: observability-store-server
        globalMounts:
        - path: /tls
          readOnly: true
      objstore:
        type: secret
        name: observability-thanos-objstore
        globalMounts:
        - path: /objstore
          readOnly: true
      data:
        type: persistentVolumeClaim
        storageClass: ${OBSERVABILITY_STORAGE_CLASS}
        accessMode: ReadWriteOnce
        size: 4Gi
        globalMounts:
        - path: /data
    serviceMonitor:
      app:
        enabled: true
        serviceName: thanos-store
        endpoints:
        - port: http
          interval: 1m
          relabelings:
          - targetLabel: k8s_cluster
            replacement: ${CLUSTER_NAME}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thanos-compactor
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      app:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: 'true'
        pod:
          automountServiceAccountToken: false
          labels:
            k8s_cluster: ${CLUSTER_NAME}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          nodeSelector:
            kubernetes.io/hostname: ${OBSERVABILITY_ARCHIVE_NODE}
        containers:
          app:
            image:
              repository: quay.io/thanos/thanos
              tag: v0.42.5@sha256:0a546b98a8dd47735456ab389983675ee363d68127e334937a9fceeea10da5e7
            args:
            - compact
            - --http-address=0.0.0.0:10902
            - --objstore.config-file=/objstore/objstore.yaml
            - --data-dir=/data
            - --wait
            - --compact.concurrency=1
            - --compact.blocks-fetch-concurrency=1
            - --downsample.concurrency=1
            - --retention.resolution-raw=35d
            - --retention.resolution-5m=35d
            - --retention.resolution-1h=35d
            - --downsampling.disable
            env:
              GOMEMLIMIT: '3435973836'
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /-/healthy
                    port: 10902
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /-/ready
                    port: 10902
                  timeoutSeconds: 5
                  failureThreshold: 6
    service:
      app:
        controller: app
        ports:
          http:
            port: 10902
    persistence:
      tls:
        type: secret
        name: observability-store-client
        globalMounts:
        - path: /tls
          readOnly: true
      objstore:
        type: secret
        name: observability-thanos-objstore
        globalMounts:
        - path: /objstore
          readOnly: true
      data:
        type: persistentVolumeClaim
        storageClass: ${OBSERVABILITY_STORAGE_CLASS}
        accessMode: ReadWriteOnce
        size: 64Gi
        globalMounts:
        - path: /data
    serviceMonitor:
      app:
        enabled: true
        serviceName: thanos-compactor
        endpoints:
        - port: http
          interval: 1m
          relabelings:
          - targetLabel: k8s_cluster
            replacement: ${CLUSTER_NAME}
