---
# WSL-02 only; never select this singleton from both clusters.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: thanos-metrics-compactor
  namespace: flux-system
spec:
  dependsOn:
    - name: observability-pki
    - name: observability-garage
  path: ./kubernetes/apps/monitoring/thanos-metrics/compactor
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 30m
  retryInterval: 1m
  timeout: 10m
