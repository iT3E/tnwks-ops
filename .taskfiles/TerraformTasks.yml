---
version: "3"

## ---------------------------------------------------------------------------------------------------------------------
## Cloudflare (environments/prod/cloudflare).
##
## CI plans on the PR and applies on merge (cloudflare-{plan,apply}.yaml on the
## self-hosted runner). These tasks are break-glass, against the same TFC state
## (tnwks-cloudflare-prod, execution mode local).
## ---------------------------------------------------------------------------------------------------------------------

tasks:

  init:
    desc: Initialize terraform dependencies
    dir: "{{.TERRAFORM_DIR}}/environments/prod/cloudflare"
    cmds:
      - terraform init {{.CLI_ARGS}}

  plan:
    desc: Show the changes terraform will make
    dir: "{{.TERRAFORM_DIR}}/environments/prod/cloudflare"
    cmds:
      - terraform plan {{.CLI_ARGS}}

  apply:
    desc: Apply the changes to Cloudflare
    dir: "{{.TERRAFORM_DIR}}/environments/prod/cloudflare"
    cmds:
      - terraform apply {{.CLI_ARGS}}
