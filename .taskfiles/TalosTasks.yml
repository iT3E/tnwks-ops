---
version: "3"

tasks:
  reset:wsl:
    desc: Destroy and recreate the WSL Talos Docker cluster
    cmds:
      - talosctl cluster destroy --name homelab-wsl || true
      - "{{.ANSIBLE}} ansible-playbook {{.ANSIBLE_DIR}}/playbooks/01-talos-bootstrap.yml -e talos_target=wsl"

  status:wsl:
    desc: Show status of the WSL Talos cluster
    cmds:
      - talosctl cluster show --name homelab-wsl

  destroy:wsl:
    desc: Destroy the WSL Talos Docker cluster (no recreate)
    cmds:
      - talosctl cluster destroy --name homelab-wsl

  status:wsl-02:
    desc: Show the homelab-wsl-02 Talos-in-Docker cluster (run on WSL-02's distro)
    cmds:
      - talosctl cluster show --name homelab-wsl-02

  upgrade:wsl-02:
    desc: Roll the homelab-wsl-02 node containers onto talos/wsl-02/versions.yaml (run on WSL-02's distro)
    cmds:
      - "{{.ANSIBLE}} ansible-playbook {{.ANSIBLE_DIR}}/playbooks/05-talos-upgrade.yml -e talos_target=wsl-02"

  upgrade:wsl:
    desc: Roll the WSL Talos node containers onto talos/wsl/versions.yaml (one node at a time)
    cmds:
      - "{{.ANSIBLE}} ansible-playbook {{.ANSIBLE_DIR}}/playbooks/05-talos-upgrade.yml -e talos_target=wsl"

  upgrade:wsl:dry-run:
    desc: Print the docker run each WSL node would get from talos/wsl/roll-node.sh (USERDATA hidden)
    vars:
      VERSION:
        sh: yq -r .talos {{.ROOT_DIR}}/talos/wsl/versions.yaml
    cmds:
      - for: [homelab-wsl-controlplane-1, homelab-wsl-worker-1, homelab-wsl-worker-2]
        cmd: DRY_RUN=1 {{.ROOT_DIR}}/talos/wsl/roll-node.sh {{.ITEM}} ghcr.io/siderolabs/talos:{{.VERSION}} | sed -E 's/USERDATA=[^ ]+/USERDATA=<hidden>/'

  # Stage B (docs/wsl/multi-site.md): move a cluster's node containers onto its
  # Docker network recreated with talos_clusters' docker_network options. A
  # planned outage of about 90 s. Run on that cluster's distro, e.g.
  # `task talos:network:wsl -- --dry-run`, `-- --rollback`.
  network:wsl:
    desc: Stage B, homelab-wsl onto a nat-unprotected Docker network (about 90 s down; -- --dry-run | --rollback)
    interactive: true
    vars:
      BRIDGE:
        sh: yq -r .talos_clusters.wsl.docker_network.bridge_name {{.ANSIBLE_DIR}}/inventory/group_vars/all/talos.yml
    cmds:
      - "{{.ROOT_DIR}}/talos/wsl/recreate-network.sh {{.CLI_ARGS}} homelab-wsl {{.BRIDGE}}"

  network:wsl-02:
    desc: Stage B, homelab-wsl-02 onto a nat-unprotected Docker network (run on WSL-02's distro; -- --dry-run | --rollback)
    interactive: true
    vars:
      BRIDGE:
        sh: yq -r '.talos_clusters["wsl-02"].docker_network.bridge_name' {{.ANSIBLE_DIR}}/inventory/group_vars/all/talos.yml
    cmds:
      - "{{.ROOT_DIR}}/talos/wsl/recreate-network.sh {{.CLI_ARGS}} homelab-wsl-02 {{.BRIDGE}}"
