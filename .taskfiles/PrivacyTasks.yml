---
version: "3"

# Denylist for family names and personal emails: .github/privacy-terms.sops.yaml.
# CI reads a copy from each repository's PRIVACY_TERMS Actions secret;
# `edit` syncs it when the list changes, `sync` is the manual retry
# (bin/privacy-terms).

tasks:
  check:
    desc: Check tracked files and paths against the privacy denylist
    cmds:
      - "{{.ROOT_DIR}}/bin/privacy-check {{.CLI_ARGS}}"

  edit:
    desc: "Edit the privacy denylist; syncs every PRIVACY_TERMS secret if it changed (-- --dry-run)"
    dir: "{{.ROOT_DIR}}"
    interactive: true
    cmds:
      - bin/privacy-terms edit {{.CLI_ARGS}}

  sync:
    desc: "Copy the privacy denylist into every repository's PRIVACY_TERMS secret (-- --dry-run)"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bin/privacy-terms sync {{.CLI_ARGS}}
