---
version: "3"

# The Ansible controller itself (docs/operations/ansible.md). Playbook runs are in the
# taskfiles of what they configure: bootstrap:*, talos:*, wsl-host:*,
# mikrotik:bootstrap.

tasks:
  init:
    desc: Install the pinned Ansible controller (uv) and its collections
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - uv sync --locked --all-groups
      - "{{.ANSIBLE}} ansible-galaxy collection install -r requirements.yml {{.CLI_ARGS}}"
    preconditions:
      - sh: command -v uv
        msg: "uv is required (task init, or https://docs.astral.sh/uv/)"

  hosts:
    desc: Show the inventory as a tree of groups and hosts
    cmds:
      - "{{.ANSIBLE}} ansible-inventory --graph"

  ping:
    desc: Check Ansible can reach the Windows hosts and WSL distros
    cmds:
      - "{{.ANSIBLE}} ansible windows_hosts -m ansible.windows.win_ping"
      - "{{.ANSIBLE}} ansible wsl_distros -m ansible.builtin.ping"

  lint:
    desc: Syntax-check every playbook and run ansible-lint (what CI runs)
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - for: { var: PLAYBOOKS }
        cmd: "{{.ANSIBLE}} ansible-playbook --syntax-check {{.ITEM}}"
      - "{{.ANSIBLE}} ansible-lint {{.CLI_ARGS}}"
    vars:
      PLAYBOOKS:
        sh: cd {{.ANSIBLE_DIR}} && ls playbooks/*.yml
