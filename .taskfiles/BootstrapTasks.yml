---
version: "3"

# Cluster bootstrap: playbooks 01-04 on the controller, for the Talos cluster
# named by talos_target (inventory/group_vars/all/talos.yml).

tasks:
  wsl:
    desc: Bootstrap the WSL Talos cluster (Talos → CNI → SOPS → Flux → WSL distro units)
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - for: &bootstrap [01-talos-bootstrap, 02-cni-bootstrap, 03-sops-keys, 04-flux-install]
        cmd: "{{.ANSIBLE}} ansible-playbook playbooks/{{.ITEM}}.yml -e talos_target=wsl"
      - task: :wsl-host:distro-apply

  wsl-02:
    desc: Bootstrap homelab-wsl-02 (Talos → Cilium → SOPS → Flux), run on WSL-02's distro (talos/wsl-02/README.md)
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - for: *bootstrap
        cmd: "{{.ANSIBLE}} ansible-playbook playbooks/{{.ITEM}}.yml -e talos_target=wsl-02"

  ms-01:
    desc: Bootstrap the MS-01 Talos cluster (Talos → CNI → SOPS → Flux)
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - for: *bootstrap
        cmd: "{{.ANSIBLE}} ansible-playbook playbooks/{{.ITEM}}.yml -e talos_target=ms-01"
