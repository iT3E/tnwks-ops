---
version: "3"

# The hosts under a WSL cluster: the Windows host (playbooks/windows-host.yml,
# docs/wsl/windows-ansible.md) and its WSL distro (playbooks/wsl-distro.yml).
# Every playbook run takes --limit and --tags through CLI_ARGS, e.g.
# `task wsl-host:windows-check -- --tags monitoring`. The sshd bootstrap runs
# elevated through invoke-elevated.sh, so expect a UAC prompt there.

vars:
  WSL_HOST_DIR: "{{.ROOT_DIR}}/infrastructure/wsl-host"
  WINDOWS_SSH_KEY: "{{.HOME}}/.ssh/id_ed25519_winhost"
  # The Windows host the sshd bootstrap runs on: this workstation's own.
  WINDOWS_HOST: DESKTOP-HKE05KI

tasks:
  check:
    desc: Show what the Windows host and WSL distro playbooks would change (--check --diff); changes nothing
    cmds:
      - task: windows-check
      - task: distro-check

  apply:
    desc: Apply the Windows host and WSL distro playbooks
    cmds:
      - task: windows-apply
      - task: distro-apply

  windows-check:
    desc: Show what the Windows host playbook would change (--check --diff); changes nothing on the host
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - "{{.ANSIBLE}} ansible-playbook playbooks/windows-host.yml --check --diff {{.CLI_ARGS}}"
    preconditions: &windows_pre
      - sh: test -f "{{.WINDOWS_SSH_KEY}}"
        msg: "no {{.WINDOWS_SSH_KEY}}; run task wsl-host:sshd first"
      - sh: test -d "{{.HOME}}/.ansible/collections-tnwks-ops/ansible_collections/ansible/windows"
        msg: "collections missing; run task ansible:init first"
      - sh: command -v x86_64-w64-mingw32-gcc && command -v 7z && command -v unzip
        msg: "the Coral detector role builds on the controller: sudo apt-get install -y gcc-mingw-w64-x86-64 p7zip-full unzip"

  windows-apply:
    desc: Apply the Windows host playbook (Coral detector service, monitoring agents, ...)
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - "{{.ANSIBLE}} ansible-playbook playbooks/windows-host.yml --diff {{.CLI_ARGS}}"
    preconditions: *windows_pre

  distro-check:
    desc: Show what the WSL distro playbook would change (--check --diff); changes nothing
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - "{{.ANSIBLE}} ansible-playbook playbooks/wsl-distro.yml --check --diff {{.CLI_ARGS}}"

  distro-apply:
    desc: Apply the WSL distro playbook (LAN bridge socat units, USB attach units)
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - "{{.ANSIBLE}} ansible-playbook playbooks/wsl-distro.yml --diff {{.CLI_ARGS}}"

  lan-bridge:
    desc: Apply both halves of the LAN bridge (WSL socat units, Windows portproxy sync, its task, firewall rules)
    cmds:
      - task: distro-apply
        vars: { CLI_ARGS: "--tags lan-bridge" }
      - task: windows-apply
        vars: { CLI_ARGS: "--tags lan-bridge" }

  usb-attach:
    desc: Apply both halves of the USB attach (WSL attach units, the Windows backup task)
    cmds:
      - task: distro-apply
        vars: { CLI_ARGS: "--tags usb-attach" }
      - task: windows-apply
        vars: { CLI_ARGS: "--tags usb-attach" }

  udp-relays:
    desc: The Windows UDP relays for NetFlow (2055) and router syslog (6001) (role windows_udp_relay)
    cmds:
      - task: windows-apply
        vars: { CLI_ARGS: "--tags udp-relay" }

  monitoring:
    desc: Install/update the Windows host's monitoring agents (windows_exporter, smartctl_exporter) and their firewall rules (role windows_monitoring)
    cmds:
      - task: windows-apply
        vars: { CLI_ARGS: "--tags monitoring" }

  monitoring-check:
    desc: Show drift of the Windows host's monitoring agents (--check --diff, role windows_monitoring); changes nothing
    cmds:
      - task: windows-check
        vars: { CLI_ARGS: "--tags monitoring" }

  qmd:
    desc: Install QMD as an HTTP MCP server on the WSL distro (opt-in; playbooks/wsl-qmd.yml)
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - "{{.ANSIBLE}} ansible-playbook playbooks/wsl-qmd.yml --diff {{.CLI_ARGS}}"

  sshd:
    desc: Bootstrap the Windows OpenSSH server for Ansible (WSL-only listener, key-only, UAC prompt)
    vars: &sshd_vars
      ADMIN_USER:
        sh: "{{.ANSIBLE}} ansible-inventory --host {{.WINDOWS_HOST}} | jq -r .ansible_user"
      WINDOWS_ADDR:
        sh: "{{.ANSIBLE}} ansible-inventory --host {{.WINDOWS_HOST}} | jq -r .ansible_host"
    cmds:
      - test -f "{{.WINDOWS_SSH_KEY}}" || ssh-keygen -q -t ed25519 -N '' -C 'ansible@wsl to {{.WINDOWS_HOST}}' -f "{{.WINDOWS_SSH_KEY}}"
      - chmod 600 "{{.WINDOWS_SSH_KEY}}"
      - '{{.WSL_HOST_DIR}}/invoke-elevated.sh {{.WSL_HOST_DIR}}/Install-TnwksWindowsSshd.ps1 -PublicKeyFile "$(wslpath -w "{{.WINDOWS_SSH_KEY}}.pub")" -AdminUser {{.ADMIN_USER}}'
      # Key login works (password logins are refused by sshd_config), against
      # the host key pinned in inventory/known_hosts.
      - ssh -o BatchMode=yes -o UserKnownHostsFile={{.ANSIBLE_DIR}}/inventory/known_hosts -i "{{.WINDOWS_SSH_KEY}}" "{{.ADMIN_USER}}@{{.WINDOWS_ADDR}}" whoami

  sshd-check:
    desc: Report drift of the Windows OpenSSH server setup; changes nothing (UAC prompt)
    vars: *sshd_vars
    cmds:
      # The script exits 2 when something differs.
      - '{{.WSL_HOST_DIR}}/invoke-elevated.sh {{.WSL_HOST_DIR}}/Install-TnwksWindowsSshd.ps1 -PublicKeyFile "$(wslpath -w "{{.WINDOWS_SSH_KEY}}.pub")" -AdminUser {{.ADMIN_USER}} -Check || [ $? -eq 2 ]'

  windows-drift-check:
    desc: Install the nightly Ansible --check of the Windows host (systemd timer, 04:30, result in Prometheus)
    cmds:
      - sudo install -m 0755 "{{.WSL_HOST_DIR}}/tnwks-windows-drift-check.sh" /usr/local/bin/tnwks-windows-drift-check
      - sudo install -m 0644 "{{.WSL_HOST_DIR}}/tnwks-windows-drift-check.service" "{{.WSL_HOST_DIR}}/tnwks-windows-drift-check.timer" /etc/systemd/system/
      - sudo systemctl daemon-reload
      - sudo systemctl enable --now tnwks-windows-drift-check.timer
      - systemctl list-timers tnwks-windows-drift-check.timer --no-pager
    preconditions: *windows_pre

  unifi-backup:
    desc: Install the daily copy of the UniFi controller backup to Google Drive (systemd timer, 02:30)
    cmds:
      - sudo install -m 0755 "{{.WSL_HOST_DIR}}/tnwks-unifi-backup.sh" /usr/local/bin/tnwks-unifi-backup
      - sudo install -m 0644 "{{.WSL_HOST_DIR}}/tnwks-unifi-backup.service" "{{.WSL_HOST_DIR}}/tnwks-unifi-backup.timer" /etc/systemd/system/
      - sudo systemctl daemon-reload
      - sudo systemctl enable --now tnwks-unifi-backup.timer
      - systemctl list-timers tnwks-unifi-backup.timer --no-pager

  aruba-backup:
    desc: Install the daily Aruba SW03 running-config backup to Google Drive (systemd timer, 02:45)
    cmds:
      - sudo install -d -m 0755 /etc/tnwks
      - |
        sops -d --output-type json "{{.ROOT_DIR}}/infrastructure/aruba/secrets.sops.yaml" |
          jq -r '"ARUBA_HOST=\(.aruba_host)\nARUBA_USER=\(.aruba_user)\nARUBA_PASSWORD=\(.aruba_password | @sh)"' |
          sudo install -m 0600 -o "$(id -un)" /dev/stdin /etc/tnwks/aruba.env
      - sudo install -m 0755 "{{.WSL_HOST_DIR}}/tnwks-aruba-backup.sh" /usr/local/bin/tnwks-aruba-backup
      - sudo install -m 0644 "{{.WSL_HOST_DIR}}/tnwks-aruba-backup.service" "{{.WSL_HOST_DIR}}/tnwks-aruba-backup.timer" /etc/systemd/system/
      - sudo systemctl daemon-reload
      - sudo systemctl enable --now tnwks-aruba-backup.timer
      - systemctl list-timers tnwks-aruba-backup.timer --no-pager
    preconditions:
      - sh: command -v sshpass
        msg: "sshpass is required (sudo apt-get install -y sshpass)"
