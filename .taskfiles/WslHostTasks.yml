---
version: "3"

# Host-side plumbing that lets the LAN reach the WSL cluster
# (docs/wsl/lan-exposure.md). Each task is idempotent. The Windows steps run
# elevated through invoke-elevated.sh, so expect a UAC prompt.

vars:
  WSL_HOST_DIR: "{{.ROOT_DIR}}/infrastructure/wsl-host"

tasks:
  lan-bridge:
    desc: Install the WSL socat bridges and sync the Windows TCP portproxy rules (UAC prompt)
    dir: "{{.ANSIBLE_DIR}}"
    cmds:
      - ansible-playbook -i inventory/wsl.yml playbooks/wsl-lan-bridge.yml
      - "{{.WSL_HOST_DIR}}/invoke-elevated.sh {{.WSL_HOST_DIR}}/Sync-TnwksLanBridge.ps1"

  udp-relays:
    desc: Register the Windows UDP relays for NetFlow (2055) and router syslog (6001) (UAC prompt)
    cmds:
      - "{{.WSL_HOST_DIR}}/invoke-elevated.sh {{.WSL_HOST_DIR}}/Register-TnwksUdpRelays.ps1"

  monitoring:
    desc: Install/update the Windows host's monitoring agents (windows_exporter, smartctl_exporter) and scope their firewall rules (UAC prompt)
    cmds:
      - "{{.WSL_HOST_DIR}}/invoke-elevated.sh {{.WSL_HOST_DIR}}/Install-TnwksWindowsMonitoring.ps1"

  monitoring-check:
    desc: Report drift between the Windows host's monitoring agents and the repo; changes nothing (UAC prompt)
    cmds:
      # The script exits 2 when something differs.
      - "{{.WSL_HOST_DIR}}/invoke-elevated.sh {{.WSL_HOST_DIR}}/Install-TnwksWindowsMonitoring.ps1 -Check || [ $? -eq 2 ]"

  unifi-backup:
    desc: Install the daily copy of the UniFi controller backup to Google Drive (systemd timer, 02:30)
    cmds:
      - sudo install -m 0755 "{{.WSL_HOST_DIR}}/tnwks-unifi-backup.sh" /usr/local/bin/tnwks-unifi-backup
      - sudo install -m 0644 "{{.WSL_HOST_DIR}}/tnwks-unifi-backup.service" "{{.WSL_HOST_DIR}}/tnwks-unifi-backup.timer" /etc/systemd/system/
      - sudo systemctl daemon-reload
      - sudo systemctl enable --now tnwks-unifi-backup.timer
      - systemctl list-timers tnwks-unifi-backup.timer --no-pager

  aruba-backup:
    desc: Install the daily Aruba SW03 running-config backup to Google Drive (systemd timer, 02:45)
    cmds:
      - sudo install -d -m 0755 /etc/tnwks
      - |
        sops -d --output-type json "{{.ROOT_DIR}}/infrastructure/aruba/secrets.sops.yaml" |
          jq -r '"ARUBA_HOST=\(.aruba_host)\nARUBA_USER=\(.aruba_user)\nARUBA_PASSWORD=\(.aruba_password | @sh)"' |
          sudo install -m 0600 -o "$(id -un)" /dev/stdin /etc/tnwks/aruba.env
      - sudo install -m 0755 "{{.WSL_HOST_DIR}}/tnwks-aruba-backup.sh" /usr/local/bin/tnwks-aruba-backup
      - sudo install -m 0644 "{{.WSL_HOST_DIR}}/tnwks-aruba-backup.service" "{{.WSL_HOST_DIR}}/tnwks-aruba-backup.timer" /etc/systemd/system/
      - sudo systemctl daemon-reload
      - sudo systemctl enable --now tnwks-aruba-backup.timer
      - systemctl list-timers tnwks-aruba-backup.timer --no-pager
    preconditions:
      - sh: command -v sshpass
        msg: "sshpass is required (sudo apt-get install -y sshpass)"
