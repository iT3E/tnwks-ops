# The platform agent (kubernetes/apps/monitoring/vector/agent-platform):
# what it drops from the gateway's and the supervisors' lines, what it
# passes unchanged, and its two gauges. Each line is made up here, in the
# formats seen on the cluster and in the OpenShell 0.1.8 source; SECRET
# stands for content that must not reach Loki.
config: kubernetes/apps/monitoring/vector/agent-platform/config/vector.yaml
tests:
- name: 'gateway: the command preview goes, with its colour codes'
  inputs:
  - insert_at: allowlist_redact
    type: log
    log_fields:
      message: "\e[2m2026-11-14T04:47:14.504246Z\e[0m \e[32m INFO\e[0m \e[2mopenshell_server::grpc::sandbox\e[0m\e[2m:\e[0m ExecSandbox (relay): command started \e[3msandbox_id\e[0m\e[2m=\e[0m11111111-2222-3333-4444-555555555555 \e[3mcommand_len\e[0m\e[2m=\e[0m42 \e[3mstdin_len\e[0m\e[2m=\e[0m0 \e[3mcommand_preview\e[0m\e[2m=\e[0mcat /secret/file && echo SECRET words"
      kubernetes.container_name: openshell-gateway
      kubernetes.pod_namespace: agents-workflows
  outputs:
  - extract_from: allowlist_redact
    conditions:
    - type: vrl
      source: 'assert_eq!(.message, "2026-11-14T04:47:14.504246Z INFO openshell_server::grpc::sandbox: ExecSandbox (relay): command started sandbox_id=11111111-2222-3333-4444-555555555555 command_len=42 stdin_len=0 command_preview=(dropped)")

        assert!(!contains(string!(.message), "SECRET"))

        assert!(!match(string!(.message), r''\x1b''))

        '
