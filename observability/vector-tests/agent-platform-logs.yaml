- name: 'tokens: the counter has only domain, model and token'
  inputs:
  - insert_at: platform_gauges
    type: log
    log_fields:
      message: '{"event":"call","domain":"finance","model":"claude-opus-5-5","input_tokens":11,"output_tokens":22,"cache_read_tokens":33,"cache_write_tokens":44}'
      kubernetes.container_name: model-bridge
      kubernetes.pod_namespace: ai
  outputs:
  - extract_from: token_metrics
    conditions:
    - type: vrl
      source: 'assert_eq!(.name, "model_bridge_tokens_total")

        assert_eq!(.namespace, "homelab")

        assert_eq!(.kind, "incremental")

        assert!(includes(["input", "output", "cache_read", "cache_write"], .tags.token))

        assert_eq!(keys(object!(.tags)), ["domain", "model", "token"])

        assert_eq!(.tags.domain, "finance")

        assert_eq!(.tags.model, "claude-opus-5-5")

        '
- name: 'plan: a plan line of another container is not counted'
  inputs:
  - insert_at: platform_gauges
    type: log
    log_fields:
      message: '{"event":"plan_limit","window":"five_hour","status":"allowed","utilization":0.4}'
      kubernetes.container_name: agent
      kubernetes.pod_namespace: agents-main
  no_outputs_from:
  - platform_gauges
- name: 'channel count: a send of a reply that hung until its timeout, with a chat ID and content'
  inputs:
  - insert_at: agent_channel_count
    type: log
    log_fields:
      message: '2026-11-21T03:00:00.000000000Z stderr F 2026-11-21T03:00:00.000Z telegram sendMessage failed: network request failed transport={"code":"ETIMEDOUT"} chat=-1009876543210 SECRET'
      file: /var/log/pods/agents-main_agent-6d9f-abcde_11111111-2222-3333-4444-555555555555/agent/0.log
  outputs:
  - extract_from: agent_channel_count
    conditions:
    - type: vrl
      source: 'assert_eq!(., {"pod_namespace": "agents-main", "pattern": "send_failed"})

        assert!(!contains(encode_json(.), "SECRET"))

        '
