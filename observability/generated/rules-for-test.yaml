      bool 0.95) + 3 * ((homelab:host_usage{resource="WSL CPU"}) > bool 0.95)) or on (k8s_cluster, instance) (0
      * label_replace(max by (k8s_cluster) (up{job="node-exporter",k8s_cluster="one"}), "instance",
      "one", "", "")), "resource", "WSL CPU", "", "") or label_replace((((homelab:host_usage{resource="WSL
