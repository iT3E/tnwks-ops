      disk space"}) >= bool 0.05) + 3 * ((homelab:host_usage{resource="WSL disk space"}) < bool 0.05)) or on (k8s_cluster,
      instance) (0 * label_replace(max by (k8s_cluster) (up{job="node-exporter",k8s_cluster="one"}),
      "instance", "one", "", "")), "resource", "WSL disk space", "", "") or label_replace((((homelab:host_usage{resource="WSL
      I/O stall"}) <= bool 0.1) + 2 * ((homelab:host_usage{resource="WSL I/O stall"}) > bool 0.1) * ((homelab:host_usage{resource="WSL
      I/O stall"}) <= bool 0.25) + 3 * ((homelab:host_usage{resource="WSL I/O stall"}) > bool 0.25)) or on (k8s_cluster,
      instance) (0 * label_replace(max by (k8s_cluster) (up{job="node-exporter",k8s_cluster="one"}),
