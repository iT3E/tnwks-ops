      > bool 0.97)) or on (k8s_cluster, instance) (0 * max by (k8s_cluster, instance) (up{job="windows-exporter"})),
      "resource", "Memory", "", "") or label_replace((((homelab:host_usage{resource="Disk latency"}) <= bool 0.05)
      + 2 * ((homelab:host_usage{resource="Disk latency"}) > bool 0.05) * ((homelab:host_usage{resource="Disk latency"})
      <= bool 0.2) + 3 * ((homelab:host_usage{resource="Disk latency"}) > bool 0.2)) or on (k8s_cluster, instance)
      (0 * max by (k8s_cluster, instance) (up{job="windows-exporter"})), "resource", "Disk latency", "", "") or
      label_replace((((homelab:host_usage{resource="Disk space"}) >= bool 0.1) + 2 * ((homelab:host_usage{resource="Disk
