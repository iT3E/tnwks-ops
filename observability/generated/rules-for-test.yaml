      "resource", "Disk latency", "", "") or label_replace(min by (k8s_cluster, instance) (windows_logical_disk_free_bytes{volume!~"HarddiskVolume.+"}
      / windows_logical_disk_size_bytes), "resource", "Disk space", "", "") or label_replace(label_replace(max by
      (k8s_cluster) (1 - avg by (k8s_cluster, instance) (rate(node_cpu_seconds_total{mode="idle",k8s_cluster="one"}[15m]))),
      "instance", "one", "", ""), "resource", "WSL CPU", "", "") or label_replace(label_replace(max
      by (k8s_cluster) (1 - avg_over_time(node_memory_MemAvailable_bytes{k8s_cluster="one"}[15m]) /
      node_memory_MemTotal_bytes{k8s_cluster="one"}), "instance", "one", "", ""), "resource",
      "WSL memory", "", "") or label_replace(label_replace(min by (k8s_cluster) (node_filesystem_avail_bytes{mountpoint="/var",k8s_cluster="one"}
      / node_filesystem_size_bytes{mountpoint="/var",k8s_cluster="one"}), "instance", "one",
      "", ""), "resource", "WSL disk space", "", "") or label_replace(label_replace(max by (k8s_cluster) (rate(node_pressure_io_stalled_seconds_total{k8s_cluster="one"}[15m])),
      "instance", "one", "", ""), "resource", "WSL I/O stall", "", "")
  - record: homelab:host_state
    expr: label_replace((((homelab:host_usage{resource="CPU"}) <= bool 0.85) + 2 * ((homelab:host_usage{resource="CPU"})
