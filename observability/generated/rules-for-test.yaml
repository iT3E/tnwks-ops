      and (time() - timestamp(homelab_app_backup_scheduled) < 180)) == 1) unless on (k8s_cluster, app, pvc) homelab:app_pvc_backup_age_seconds)
      or max by (k8s_cluster, app) (max by (k8s_cluster, namespace, db_cluster, app) (homelab_expected_database_info)
      and on (k8s_cluster, namespace, db_cluster) (homelab:database_in_recovery == 0) unless on (k8s_cluster, namespace,
      db_cluster) (homelab:database_backup_age_seconds >= 0)))) or ((homelab:app_backup_age_seconds <= bool on (k8s_cluster,
      app) max by (k8s_cluster, app) (homelab_app_recovery_objective_seconds{objective="rpo"})) + 3 * (homelab:app_backup_age_seconds
      > bool on (k8s_cluster, app) max by (k8s_cluster, app) (homelab_app_recovery_objective_seconds{objective="rpo"})))
  - record: homelab:app_rto_state
    expr: (0 * (sum by (k8s_cluster, app) (max by (k8s_cluster, app, kind, workload) ((homelab_workload_desired_replicas
      and (time() - timestamp(homelab_workload_desired_replicas) < 180)))) > 0) + 5) and on (k8s_cluster, app) max
      by (k8s_cluster, app) (homelab_app_recovery_objective_seconds{objective="rto"}) or on (k8s_cluster, app) ((max
      by (k8s_cluster, app) ((homelab_restore_last_duration_seconds and (time() - timestamp(homelab_restore_last_duration_seconds)
      < 180))) <= bool on (k8s_cluster, app) max by (k8s_cluster, app) (homelab_app_recovery_objective_seconds{objective="rto"}))
      + 3 * (max by (k8s_cluster, app) ((homelab_restore_last_duration_seconds and (time() - timestamp(homelab_restore_last_duration_seconds)
      < 180))) > bool on (k8s_cluster, app) max by (k8s_cluster, app) (homelab_app_recovery_objective_seconds{objective="rto"})))
      or on (k8s_cluster, app) (0 * max by (k8s_cluster, app) (homelab_app_recovery_objective_seconds{objective="rto"}))
  - record: homelab:other_database_state
