  - alert: ObservabilityEvidenceStale
    expr: (homelab_collection_success == 0) or (time() - homelab_collection_last_success_timestamp_seconds > 180)
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: A monitoring collector is no longer observing its upstream
      dashboard_url: https://grafana.${INTERNAL_DOMAIN}/d/tnwks-observability?var-cluster={{ $labels.k8s_cluster
        }}
      description: Scrape success does not establish fresh upstream evidence. Check the collector source and network
        access.
  - alert: ObservabilityExpectedDatabaseBackupMissing
    expr: homelab:database_backup_state{k8s_cluster="one"} == 0 unless on (k8s_cluster, namespace, db_cluster)
      (homelab:database_in_recovery == 1)
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: Expected database has no backup evidence
      dashboard_url: https://grafana.${INTERNAL_DOMAIN}/d/tnwks-data?var-cluster={{ $labels.k8s_cluster }}
      description: No Barman plugin timestamp is available for this expected database. Another database's fresh
        backup cannot satisfy its recovery requirement.
  - alert: ObservabilityArchiveUnavailable
    expr: probe_success{observability_target="archive"} == 0
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: The WSL-02 metrics archive is unavailable
      dashboard_url: https://grafana.${INTERNAL_DOMAIN}/d/tnwks-observability?var-cluster={{ $labels.k8s_cluster
        }}
      description: Local metrics and alerts remain available. Restore archive uploads before retained local blocks
        expire.
  - alert: ObservabilityIngressNameFailing
    expr: homelab:ingress_state == 3
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: 'A shared-VIP name fails from {{ $labels.k8s_cluster }}: {{ $labels.name }}'
      dashboard_url: https://grafana.${INTERNAL_DOMAIN}/d/tnwks-apps?var-cluster={{ $labels.k8s_cluster }}
      description: 'That site''s collector couldn''t use the name as a client would: the router''s DNS answer, the
        certificate, or the site''s ingress routing the host. homelab_ingress_dns_match and homelab_ingress_http_status
        say which.'
  - alert: ObservabilityIngressCertificateExpiring
    expr: homelab:ingress_cert_remaining_seconds < 14 * 86400
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: The certificate for {{ $labels.name }} on {{ $labels.k8s_cluster }} expires within 14 days
      dashboard_url: https://grafana.${INTERNAL_DOMAIN}/d/tnwks-apps?var-cluster={{ $labels.k8s_cluster }}
      description: cert-manager renews at 30 days left. Check that site's Certificate and its ACME challenge.
  - alert: ObservabilityArchiveBehind
    expr: homelab:archive_lag_seconds > 14400
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: The metrics archive's newest data for a site is over 4 hours old
      dashboard_url: https://grafana.${INTERNAL_DOMAIN}/d/tnwks-observability?var-cluster={{ $labels.k8s_cluster
        }}
      description: Normal is 1-3 hours. Check that site's Thanos sidecar uploads (thanos_shipper_upload_failures_total)
        and the Compactor's bucket sync.
  - alert: ObservabilityArchiveSpaceLow
    expr: homelab:archive_free_ratio < 0.1
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: The metrics archive has under 10% free space
      dashboard_url: https://grafana.${INTERNAL_DOMAIN}/d/tnwks-observability?var-cluster={{ $labels.k8s_cluster
        }}
      description: Garage shares its disk with the WSL-02 node. Shorten the Compactor's retention or free space
        before uploads fail.
- name: homelab.capacity
  interval: 1m
  rules:
  - alert: NodeContainerMemoryNearLimit
    expr: max by (k8s_cluster, node) (node_memory_working_set_bytes{node="homelab-wsl-02-worker-1"}) > 0.9 * 18
      * 1024^3
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.node }} is above 90% of the memory limit of its node container'
      dashboard_url: https://grafana.${INTERNAL_DOMAIN}/d/tnwks-kubernetes?var-cluster={{ $labels.k8s_cluster }}
      description: The node container has a memory limit of 18 GiB. The scheduler does not see it, because the node
        reports the memory of the whole WSL VM. Find the largest pods of the node, and move or shrink one. The limit
        is memory_nodes of talos_clusters in the Ansible inventory.
  - alert: LokiSecurityIngestAbovePlan
    expr: sum by (k8s_cluster) (increase(loki_distributor_bytes_received_total{retention_hours="2160"}[1d])) > 2
      * 1.2e9
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: Loki on {{ $labels.k8s_cluster }} took in more than twice the planned bytes of its 90-day streams
        in a day
      dashboard_url: https://grafana.${INTERNAL_DOMAIN}/d/tnwks-observability?var-cluster={{ $labels.k8s_cluster
        }}
      description: The streams that Loki keeps for 90 days took in more than 2.4 GB of lines in 24 hours, before
        compression. The plan is 1.2 GB a day. Find the stream that grew (the label security_stream), then lower
        its volume at the source or its retention.
  - alert: WslDriveSpaceLow
    expr: min by (k8s_cluster, instance, volume) (windows_logical_disk_free_bytes{instance="WSL-02",volume="C:"})
      < 100e9
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: The drive under the WSL disk of {{ $labels.instance }} has less than 100 GB free
      dashboard_url: https://grafana.${INTERNAL_DOMAIN}/d/tnwks-hosts?var-cluster={{ $labels.k8s_cluster }}
      description: '{{ $labels.volume }} of {{ $labels.instance }} holds the WSL disk file of its cluster, and WSL
        stops when that drive is full. The stores of the cluster delete at a set age: lower the age of the largest
        one, or free space on the drive.'
- name: homelab.security
