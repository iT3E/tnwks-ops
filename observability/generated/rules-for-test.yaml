      / windows_logical_disk_size_bytes) and on (k8s_cluster) (max by (k8s_cluster) (homelab_observer_info)))) <
      bool 0.1) * ((min((windows_logical_disk_free_bytes{volume=~"C:|E:"} / windows_logical_disk_size_bytes) and
      on (k8s_cluster) (max by (k8s_cluster) (homelab_observer_info)))) >= bool 0.05) + 3 * ((min((windows_logical_disk_free_bytes{volume=~"C:|E:"}
      / windows_logical_disk_size_bytes) and on (k8s_cluster) (max by (k8s_cluster) (homelab_observer_info)))) <
      bool 0.05), "domain", "storage", "", "") or label_replace(((max(cloudflared_tunnel_ha_connections and on (k8s_cluster)
      (max by (k8s_cluster) (homelab_observer_info)))) >= bool 4) + 2 * ((max(cloudflared_tunnel_ha_connections
      and on (k8s_cluster) (max by (k8s_cluster) (homelab_observer_info)))) < bool 4) * ((max(cloudflared_tunnel_ha_connections
      and on (k8s_cluster) (max by (k8s_cluster) (homelab_observer_info)))) >= bool 1) + 3 * ((max(cloudflared_tunnel_ha_connections
      and on (k8s_cluster) (max by (k8s_cluster) (homelab_observer_info)))) < bool 1), "domain", "away", "", "")
  - record: homelab:host_usage
    expr: label_replace(1 - avg by (k8s_cluster, instance) (rate(windows_cpu_time_total{mode="idle"}[15m])), "resource",
      "CPU", "", "") or label_replace(1 - max by (k8s_cluster, instance) (avg_over_time(windows_memory_available_bytes[15m]))
      / max by (k8s_cluster, instance) (windows_memory_physical_total_bytes), "resource", "Memory", "", "") or label_replace(max
