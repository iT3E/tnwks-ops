---
groups:
- name: homelab.evidence
  interval: 1m
  rules:
  - record: homelab:site_reporting
    expr: (max by (k8s_cluster) (homelab_collection_success{collector="workloads"}) == bool 1) * on (k8s_cluster)
      (time() - max by (k8s_cluster) (homelab_collection_last_success_timestamp_seconds{collector="workloads"})
      < bool 180) * on (k8s_cluster) (time() - max by (k8s_cluster) (homelab_collection_last_success_timestamp_seconds{collector="workloads"})
      >= bool 0)
  - record: homelab:site_state
    expr: (homelab:site_reporting == 1) or on (k8s_cluster) (0 * max by (k8s_cluster) (homelab_expected_site_info))
  - record: homelab:database_in_recovery
    expr: max by (k8s_cluster, namespace, db_cluster) (label_replace(cnpg_pg_replication_in_recovery{source_site=""},
      "db_cluster", "$1", "pod", "(.+)-[0-9]+"))
  - record: homelab:database_replay_lag_seconds
    expr: max by (k8s_cluster, namespace, db_cluster) (label_replace(cnpg_pg_replication_lag{source_site=""}, "db_cluster",
      "$1", "pod", "(.+)-[0-9]+"))
  - record: homelab:database_connections
    expr: sum by (k8s_cluster, namespace, db_cluster) (label_replace(cnpg_backends_total{source_site=""}, "db_cluster",
      "$1", "pod", "(.+)-[0-9]+"))
  - record: homelab:database_backup_age_seconds
    expr: time() - max by (k8s_cluster, namespace, db_cluster) (label_replace(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{source_site=""},
      "db_cluster", "$1", "pod", "(.+)-[0-9]+"))
  - record: homelab:database_backup_state
    expr: ((homelab:database_backup_age_seconds >= bool 0) * (homelab:database_backup_age_seconds <= bool 108000)
      + 3 * (homelab:database_backup_age_seconds > bool 108000)) or on (k8s_cluster, namespace, db_cluster) (0 *
      max by (k8s_cluster, namespace, db_cluster) (homelab_expected_database_info))
  - record: homelab:recovery_state
    expr: (0 * (sum by (k8s_cluster, app) (max by (k8s_cluster, app, kind, workload) ((homelab_workload_desired_replicas
      and (time() - timestamp(homelab_workload_desired_replicas) < 180)))) > 0) + 5) and on (k8s_cluster, app) (max
      by (k8s_cluster, app) (homelab_expected_workload_info{tier="warm"})) or on (k8s_cluster, app) (3 * max by
      (k8s_cluster, app) ((homelab_recovery_prerequisite_state and (time() - timestamp(homelab_recovery_prerequisite_state)
      < 180)) == 3) / 3) or on (k8s_cluster, app) ((count by (k8s_cluster, app) (max by (k8s_cluster, app, prerequisite)
      ((homelab_recovery_prerequisite_state{prerequisite=~"database|backup|restore|fence"} and (time() - timestamp(homelab_recovery_prerequisite_state{prerequisite=~"database|backup|restore|fence"})
      < 180))) == 1) == 4) / 4) or on (k8s_cluster, app) (0 * max by (k8s_cluster, app) (homelab_expected_workload_info{tier="warm"}))
  - record: homelab:local_history_seconds
    expr: time() - min by (k8s_cluster) (prometheus_tsdb_lowest_timestamp_seconds)
  - record: homelab:slo_window_coverage_ratio
    expr: clamp_max(homelab:local_history_seconds / 1209600, 1)
  - record: homelab:archive_lag_seconds
    expr: time() - max by (k8s_cluster) ((homelab_archive_newest_sample_timestamp_seconds and (time() - timestamp(homelab_archive_newest_sample_timestamp_seconds)
      < 180)))
  - record: homelab:archive_history_seconds
    expr: time() - min by (k8s_cluster) ((homelab_archive_oldest_sample_timestamp_seconds and (time() - timestamp(homelab_archive_oldest_sample_timestamp_seconds)
      < 180)))
  - record: homelab:archive_free_ratio
    expr: min by (k8s_cluster) (garage_local_disk_avail{volume="data"} / garage_local_disk_total{volume="data"})
  - record: homelab:unuploaded_block_age_seconds
    expr: time() - max by (k8s_cluster) (thanos_objstore_bucket_last_successful_upload_time{job=~".*thanos-discovery"}
      > 0)
  - record: homelab:archive_state
    expr: (3 - 2 * min by (k8s_cluster) (probe_success{observability_target="archive"} and (time() - timestamp(probe_success{observability_target="archive"}))
      < 180)) or on (k8s_cluster) (0 * max by (k8s_cluster) (homelab_observer_info))
  - record: homelab:mqtt_state
    expr: (3 - 2 * min by (k8s_cluster) (probe_success{observability_target="mqtt"} and (time() - timestamp(probe_success{observability_target="mqtt"}))
      < 180)) or on (k8s_cluster) (0 * max by (k8s_cluster) (homelab_observer_info))
  - record: homelab:internet_state
    expr: (3 - 2 * min by (k8s_cluster) (probe_success{observability_target="internet"} and (time() - timestamp(probe_success{observability_target="internet"}))
      < 180)) or on (k8s_cluster) (0 * max by (k8s_cluster) (homelab_observer_info))
  - record: homelab:workload_state
    expr: 0 * max by (k8s_cluster, app) (homelab_workload_present == 0) or (sum by (k8s_cluster, app) (max by (k8s_cluster,
      app, kind, workload) ((homelab_workload_desired_replicas and (time() - timestamp(homelab_workload_desired_replicas)
      < 180)))) == 0) + 4 or (((sum by (k8s_cluster, app) (max by (k8s_cluster, app, kind, workload) ((homelab_workload_ready_replicas
      and (time() - timestamp(homelab_workload_ready_replicas) < 180)))) >= sum by (k8s_cluster, app) (max by (k8s_cluster,
      app, kind, workload) ((homelab_workload_desired_replicas and (time() - timestamp(homelab_workload_desired_replicas)
      < 180))))) * 0) + 1) or (((sum by (k8s_cluster, app) (max by (k8s_cluster, app, kind, workload) ((homelab_workload_ready_replicas
      and (time() - timestamp(homelab_workload_ready_replicas) < 180)))) < sum by (k8s_cluster, app) (max by (k8s_cluster,
      app, kind, workload) ((homelab_workload_desired_replicas and (time() - timestamp(homelab_workload_desired_replicas)
      < 180))))) > 0) * 0 + 2) or ((sum by (k8s_cluster, app) (max by (k8s_cluster, app, kind, workload) ((homelab_workload_ready_replicas
      and (time() - timestamp(homelab_workload_ready_replicas) < 180)))) < sum by (k8s_cluster, app) (max by (k8s_cluster,
      app, kind, workload) ((homelab_workload_desired_replicas and (time() - timestamp(homelab_workload_desired_replicas)
      < 180))))) * 0 + 3) or on (k8s_cluster, app) (0 * max by (k8s_cluster, app) (homelab_expected_workload_info))
  - record: homelab:app_pvc_backup_age_seconds
    expr: ((time() - max by (k8s_cluster, namespace, policy) (kopiur_policy_last_backup_success_timestamp_seconds))
      >= 0) * on (k8s_cluster, namespace, policy) group_right max by (k8s_cluster, namespace, policy, app, pvc)
      ((homelab_app_backup_scheduled and (time() - timestamp(homelab_app_backup_scheduled) < 180)) == 1)
  - record: homelab:app_backup_age_seconds
    expr: max by (k8s_cluster, app) (homelab:app_pvc_backup_age_seconds or ((homelab:database_backup_age_seconds
      >= 0) * on (k8s_cluster, namespace, db_cluster) group_right max by (k8s_cluster, namespace, db_cluster, app)
      (max by (k8s_cluster, namespace, db_cluster, app) (homelab_expected_database_info) and on (k8s_cluster, namespace,
      db_cluster) (homelab:database_in_recovery == 0))))
  - record: homelab:app_rpo_state
