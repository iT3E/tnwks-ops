      space"}) < bool 0.05)) or on (k8s_cluster, instance) (0 * max by (k8s_cluster, instance) (up{job="windows-exporter"})),
      "resource", "Disk space", "", "") or label_replace((((homelab:host_usage{resource="WSL CPU"}) <= bool 0.85)
