---
rule_files:
- rules-for-test.yaml
evaluation_interval: 1m
tests:
- name: header counts distinct selected sites, not observers
  interval: 1m
  input_series:
  - series: homelab_expected_site_info{k8s_cluster="one",observer="a"}
    values: 1+0x10
  - series: homelab_expected_site_info{k8s_cluster="one",observer="b"}
    values: 1+0x10
  - series: homelab_expected_site_info{k8s_cluster="two",observer="a"}
    values: 1+0x10
  - series: homelab_expected_site_info{k8s_cluster="two",observer="b"}
    values: 1+0x10
  - series: homelab:site_reporting{k8s_cluster="one",observer="a"}
    values: 1+0x10
  - series: homelab:site_reporting{k8s_cluster="one",observer="b"}
    values: 1+0x10
  - series: homelab:site_reporting{k8s_cluster="two",observer="a"}
    values: 1+0x10
  - series: homelab:site_reporting{k8s_cluster="two",observer="b"}
    values: 1+0x10
  promql_expr_test:
  - expr: count(max by (k8s_cluster) (homelab_expected_site_info{k8s_cluster=~"one"}))
    eval_time: 5m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(max by (k8s_cluster) (homelab_expected_site_info{k8s_cluster=~".*"}))
    eval_time: 5m
    exp_samples:
    - labels: '{}'
      value: 2
  - expr: count(max by (k8s_cluster) (homelab:site_reporting{k8s_cluster=~"one"}) == 1) or vector(0)
    eval_time: 5m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(max by (k8s_cluster) (homelab:site_reporting{k8s_cluster=~".*"}) == 1) or vector(0)
    eval_time: 5m
    exp_samples:
    - labels: '{}'
      value: 2
- name: future observer timestamps are not current evidence
  interval: 1m
  input_series:
  - series: homelab_expected_site_info{k8s_cluster="one"}
    values: 1+0x10
  - series: homelab_collection_success{k8s_cluster="one",collector="workloads"}
    values: 1+0x10
  - series: homelab_collection_last_success_timestamp_seconds{k8s_cluster="one",collector="workloads"}
    values: 10000+0x10
  promql_expr_test:
  - expr: homelab:site_state
    eval_time: 5m
    exp_samples:
    - labels: homelab:site_state{k8s_cluster="one"}
      value: 0
- name: stale complete prerequisites cannot certify recovery
  interval: 1m
  input_series:
  - series: homelab_expected_workload_info{k8s_cluster="one",app="test",tier="warm"}
    values: 1+0x10
  - series: homelab_recovery_prerequisite_state{k8s_cluster="one",app="test",prerequisite="database"}
    values: 1 _ _ _ _ _
  - series: homelab_recovery_prerequisite_state{k8s_cluster="one",app="test",prerequisite="backup"}
    values: 1 _ _ _ _ _
  - series: homelab_recovery_prerequisite_state{k8s_cluster="one",app="test",prerequisite="restore"}
    values: 1 _ _ _ _ _
  - series: homelab_recovery_prerequisite_state{k8s_cluster="one",app="test",prerequisite="fence"}
    values: 1 _ _ _ _ _
  promql_expr_test:
  - expr: homelab:recovery_state
    eval_time: 4m
    exp_samples:
    - labels: homelab:recovery_state{k8s_cluster="one",app="test"}
      value: 0
- name: one missing component does not leave a multi-workload app healthy
  interval: 1m
  input_series:
  - series: homelab_expected_workload_info{k8s_cluster="one",app="test"}
    values: 1+0x10
  - series: homelab_workload_present{k8s_cluster="one",app="test",workload="missing"}
    values: 0+0x10
  - series: homelab_workload_desired_replicas{k8s_cluster="one",app="test",workload="running"}
    values: 1+0x10
  - series: homelab_workload_ready_replicas{k8s_cluster="one",app="test",workload="running"}
    values: 1+0x10
  promql_expr_test:
  - expr: homelab:workload_state
    eval_time: 5m
    exp_samples:
    - labels: homelab:workload_state{k8s_cluster="one",app="test"}
      value: 0
- name: duplicate collectors do not invent desired replicas
  interval: 1m
  input_series:
  - series: homelab_expected_workload_info{k8s_cluster="one",app="test"}
    values: 1+0x10
  - series: homelab_workload_desired_replicas{k8s_cluster="one",app="test",workload="running",pod="old"}
    values: 1+0x10
  - series: homelab_workload_desired_replicas{k8s_cluster="one",app="test",workload="running",pod="new"}
    values: 1+0x10
  - series: homelab_workload_ready_replicas{k8s_cluster="one",app="test",workload="running",pod="new"}
    values: 1+0x10
  promql_expr_test:
  - expr: homelab:workload_state
    eval_time: 5m
    exp_samples:
    - labels: homelab:workload_state{k8s_cluster="one",app="test"}
      value: 1
- name: same database name and missing backup remain distinct
  interval: 1m
  input_series:
  - series: homelab_expected_database_info{k8s_cluster="one",namespace="databases",db_cluster="app-pg"}
    values: 1+0x10
  - series: homelab_expected_database_info{k8s_cluster="two",namespace="databases",db_cluster="app-pg"}
    values: 1+0x10
  - series: barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{k8s_cluster="one",namespace="databases",pod="app-pg-1"}
    values: 30+0x10
  promql_expr_test:
  - expr: homelab:database_backup_state
    eval_time: 5m
    exp_samples:
    - labels: homelab:database_backup_state{k8s_cluster="one",namespace="databases",db_cluster="app-pg"}
      value: 1
    - labels: homelab:database_backup_state{k8s_cluster="two",namespace="databases",db_cluster="app-pg"}
      value: 0
- name: successful scrape cannot refresh a stale upstream
  interval: 1m
  input_series:
  - series: homelab_expected_site_info{k8s_cluster="one"}
    values: 1+0x10
  - series: homelab_collection_success{k8s_cluster="one",collector="workloads"}
    values: 1+0x10
  - series: homelab_collection_last_success_timestamp_seconds{k8s_cluster="one",collector="workloads"}
    values: 1+0x10
  promql_expr_test:
  - expr: homelab:site_state
    eval_time: 5m
    exp_samples:
    - labels: homelab:site_state{k8s_cluster="one"}
      value: 0
- name: absent fencing or restore evidence cannot certify readiness
  interval: 1m
  input_series:
  - series: homelab_expected_workload_info{k8s_cluster="one",app="test",tier="warm"}
    values: 1+0x10
  - series: homelab_recovery_prerequisite_state{k8s_cluster="one",app="test",prerequisite="database"}
    values: 1+0x10
  promql_expr_test:
  - expr: homelab:recovery_state
    eval_time: 5m
    exp_samples:
    - labels: homelab:recovery_state{k8s_cluster="one",app="test"}
      value: 0
- name: stale probes cannot certify current paths
  interval: 1m
  input_series:
  - series: homelab_observer_info{k8s_cluster="one"}
    values: 1+0x10
  - series: probe_success{k8s_cluster="one",observability_target="archive"}
    values: 1 _ _ _ _ _
  promql_expr_test:
  - expr: homelab:archive_state
    eval_time: 4m
    exp_samples:
    - labels: homelab:archive_state{k8s_cluster="one"}
      value: 0
- name: archive lag is per source site, and Unknown once the index goes stale
  interval: 1m
  input_series:
  - series: homelab_archive_newest_sample_timestamp_seconds{k8s_cluster="one",observer_cluster="a"}
    values: 0+0x2
  - series: homelab_archive_newest_sample_timestamp_seconds{k8s_cluster="one",observer_cluster="b"}
    values: -60+0x2
  promql_expr_test:
  - expr: homelab:archive_lag_seconds
    eval_time: 2m
    exp_samples:
    - labels: homelab:archive_lag_seconds{k8s_cluster="one"}
      value: 120
  - expr: homelab:archive_lag_seconds
    eval_time: 6m
    exp_samples: []
- name: 'network path by hop: stale tunnel, missing router session, partial node sessions'
  interval: 1m
  input_series:
  - series: homelab_expected_site_info{k8s_cluster="homelab-wsl"}
    values: 1+0x10
  - series: homelab_expected_site_info{k8s_cluster="homelab-wsl-02"}
    values: 1+0x10
  - series: mktxp_system_uptime{k8s_cluster="homelab-wsl"}
    values: 100+60x10
  - series: mktxp_last_handshake{interface="wg-site1"}
    values: 30+0x10
  - series: mktxp_last_handshake{interface="wg-site2"}
    values: 400+0x10
  - series: mktxp_bgp_established{name="wsl-site1-1"}
    values: 1+0x10
  - series: cilium_bgp_control_plane_session_state{k8s_cluster="homelab-wsl",node="a"}
    values: 1+0x10
  - series: cilium_bgp_control_plane_session_state{k8s_cluster="homelab-wsl",node="b"}
    values: 0+0x10
  promql_expr_test:
  - expr: homelab:network_path_state
    eval_time: 5m
    exp_samples:
    - labels: homelab:network_path_state{k8s_cluster="homelab-wsl",hop="tunnel"}
      value: 1
    - labels: homelab:network_path_state{k8s_cluster="homelab-wsl-02",hop="tunnel"}
      value: 3
    - labels: homelab:network_path_state{k8s_cluster="homelab-wsl",hop="router-bgp"}
      value: 1
    - labels: homelab:network_path_state{k8s_cluster="homelab-wsl-02",hop="router-bgp"}
      value: 3
    - labels: homelab:network_path_state{k8s_cluster="homelab-wsl",hop="node-bgp"}
      value: 2
    - labels: homelab:network_path_state{k8s_cluster="homelab-wsl-02",hop="node-bgp"}
      value: 0
- name: shared VIPs follow the preferred site's session, else the other's
  interval: 1m
  input_series:
  - series: mktxp_system_uptime{k8s_cluster="homelab-wsl"}
    values: 100+60x10
  - series: mktxp_bgp_established{name="wsl-site2-1"}
    values: 1+0x10
  promql_expr_test:
  - expr: homelab:shared_vip_route
    eval_time: 5m
    exp_samples:
    - labels: homelab:shared_vip_route{k8s_cluster="homelab-wsl",vip="10.10.95.10"}
      value: 0
    - labels: homelab:shared_vip_route{k8s_cluster="homelab-wsl-02",vip="10.10.95.10"}
      value: 1
    - labels: homelab:shared_vip_route{k8s_cluster="homelab-wsl",vip="10.10.95.200"}
      value: 0
    - labels: homelab:shared_vip_route{k8s_cluster="homelab-wsl-02",vip="10.10.95.200"}
      value: 1
- name: 'ingress names: passing, failing, unobserved'
  interval: 1m
  input_series:
  - series: homelab_expected_ingress_info{k8s_cluster="one",name="a"}
    values: 1+0x10
  - series: homelab_expected_ingress_info{k8s_cluster="one",name="b"}
    values: 1+0x10
  - series: homelab_expected_ingress_info{k8s_cluster="two",name="a"}
    values: 1+0x10
  - series: homelab_expected_ingress_info{k8s_cluster="two",name="b"}
    values: 1+0x10
  - series: probe_success{k8s_cluster="one",name="a",observability_target="ingress"}
    values: 1+0x10
  - series: probe_success{k8s_cluster="one",name="b",observability_target="ingress"}
    values: 0+0x10
  promql_expr_test:
  - expr: homelab:ingress_state
    eval_time: 5m
    exp_samples:
    - labels: homelab:ingress_state{k8s_cluster="one",name="a"}
      value: 1
    - labels: homelab:ingress_state{k8s_cluster="one",name="b"}
      value: 3
    - labels: homelab:ingress_state{k8s_cluster="two",name="a"}
      value: 0
    - labels: homelab:ingress_state{k8s_cluster="two",name="b"}
      value: 0
- name: an unobserved router leaves the router hops Unknown
  interval: 1m
  input_series:
  - series: homelab_expected_site_info{k8s_cluster="homelab-wsl"}
    values: 1+0x10
  promql_expr_test:
  - expr: homelab:network_path_state{hop=~"tunnel|router-bgp"}
    eval_time: 5m
    exp_samples:
    - labels: homelab:network_path_state{k8s_cluster="homelab-wsl",hop="tunnel"}
      value: 0
    - labels: homelab:network_path_state{k8s_cluster="homelab-wsl",hop="router-bgp"}
      value: 0
- name: 'service state: probed, failing, standby, unobserved'
  interval: 1m
  input_series:
  - series: homelab_expected_workload_info{k8s_cluster="one",app="up"}
    values: 1+0x10
  - series: homelab_expected_workload_info{k8s_cluster="one",app="broken"}
    values: 1+0x10
  - series: homelab_expected_workload_info{k8s_cluster="one",app="parked"}
    values: 1+0x10
  - series: homelab_expected_workload_info{k8s_cluster="one",app="unseen"}
    values: 1+0x10
  - series: probe_success{k8s_cluster="one",app="up",observability_target="service"}
    values: 1+0x10
  - series: probe_success{k8s_cluster="one",app="broken",observability_target="service"}
    values: 0+0x10
  - series: homelab_workload_desired_replicas{k8s_cluster="one",app="parked"}
    values: 0+0x10
  - series: homelab_workload_ready_replicas{k8s_cluster="one",app="parked"}
    values: 0+0x10
  promql_expr_test:
  - expr: homelab:service_state
    eval_time: 5m
    exp_samples:
    - labels: homelab:service_state{k8s_cluster="one",app="up"}
      value: 1
    - labels: homelab:service_state{k8s_cluster="one",app="broken"}
      value: 3
    - labels: homelab:service_state{k8s_cluster="one",app="parked"}
      value: 4
    - labels: homelab:service_state{k8s_cluster="one",app="unseen"}
      value: 0
- name: duplicate observations of one prerequisite are not four prerequisites
  interval: 1m
  input_series:
  - series: homelab_expected_workload_info{k8s_cluster="one",app="test",tier="warm"}
    values: 1+0x10
  - series: homelab_recovery_prerequisite_state{k8s_cluster="one",app="test",prerequisite="database",observer="0"}
    values: 1+0x10
  - series: homelab_recovery_prerequisite_state{k8s_cluster="one",app="test",prerequisite="database",observer="1"}
    values: 1+0x10
  - series: homelab_recovery_prerequisite_state{k8s_cluster="one",app="test",prerequisite="database",observer="2"}
    values: 1+0x10
  - series: homelab_recovery_prerequisite_state{k8s_cluster="one",app="test",prerequisite="database",observer="3"}
    values: 1+0x10
  promql_expr_test:
  - expr: homelab:recovery_state
    eval_time: 5m
    exp_samples:
    - labels: homelab:recovery_state{k8s_cluster="one",app="test"}
      value: 0
- name: workload state tells standby from failed and keeps missing apps Unknown
  interval: 1m
  input_series:
  - series: homelab_expected_workload_info{k8s_cluster="one",app="up"}
    values: 1+0x10
  - series: homelab_expected_workload_info{k8s_cluster="one",app="partial"}
    values: 1+0x10
  - series: homelab_expected_workload_info{k8s_cluster="one",app="down"}
    values: 1+0x10
  - series: homelab_expected_workload_info{k8s_cluster="one",app="parked"}
    values: 1+0x10
  - series: homelab_expected_workload_info{k8s_cluster="one",app="missing"}
    values: 1+0x10
  - series: homelab_workload_desired_replicas{k8s_cluster="one",app="up"}
    values: 2+0x10
  - series: homelab_workload_ready_replicas{k8s_cluster="one",app="up"}
    values: 2+0x10
  - series: homelab_workload_desired_replicas{k8s_cluster="one",app="partial"}
    values: 2+0x10
  - series: homelab_workload_ready_replicas{k8s_cluster="one",app="partial"}
    values: 1+0x10
  - series: homelab_workload_desired_replicas{k8s_cluster="one",app="down"}
    values: 1+0x10
  - series: homelab_workload_ready_replicas{k8s_cluster="one",app="down"}
    values: 0+0x10
  - series: homelab_workload_desired_replicas{k8s_cluster="one",app="parked"}
    values: 0+0x10
  - series: homelab_workload_ready_replicas{k8s_cluster="one",app="parked"}
    values: 0+0x10
  promql_expr_test:
  - expr: homelab:workload_state
    eval_time: 5m
    exp_samples:
    - labels: homelab:workload_state{k8s_cluster="one",app="up"}
      value: 1
    - labels: homelab:workload_state{k8s_cluster="one",app="partial"}
      value: 2
    - labels: homelab:workload_state{k8s_cluster="one",app="down"}
      value: 3
    - labels: homelab:workload_state{k8s_cluster="one",app="parked"}
      value: 4
    - labels: homelab:workload_state{k8s_cluster="one",app="missing"}
      value: 0
- name: only a local primary without backup evidence alerts
  interval: 1m
  input_series:
  - series: homelab_expected_database_info{k8s_cluster="one",namespace="databases",db_cluster="missing-pg"}
    values: 1+0x40
  - series: homelab_expected_database_info{k8s_cluster="one",namespace="databases",db_cluster="replica-pg"}
    values: 1+0x40
  - series: homelab_expected_database_info{k8s_cluster="two",namespace="databases",db_cluster="peer-pg"}
    values: 1+0x40
  - series: cnpg_pg_replication_in_recovery{k8s_cluster="one",namespace="databases",pod="replica-pg-1"}
    values: 1+0x40
  alert_rule_test:
  - alertname: ObservabilityExpectedDatabaseBackupMissing
    eval_time: 35m
    exp_alerts:
    - exp_labels:
        severity: warning
        k8s_cluster: one
        namespace: databases
        db_cluster: missing-pg
      exp_annotations:
        summary: Expected database has no backup evidence
        dashboard_url: https://grafana.${INTERNAL_DOMAIN}/d/tnwks-data?var-cluster=one
        description: No Barman plugin timestamp is available for this expected database. Another database's fresh
          backup cannot satisfy its recovery requirement.
- name: future backup evidence is unknown and peer federation is not counted twice
  interval: 1m
  input_series:
  - series: homelab_expected_database_info{k8s_cluster="one",namespace="databases",db_cluster="app-pg"}
    values: 1+0x10
  - series: barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{k8s_cluster="one",namespace="databases",pod="app-pg-1"}
    values: 1000+0x10
  - series: cnpg_pg_replication_in_recovery{k8s_cluster="one",namespace="databases",pod="app-pg-1"}
    values: 0+0x10
  - series: cnpg_pg_replication_in_recovery{k8s_cluster="one",namespace="databases",pod="app-pg-1",source_site="one"}
    values: 1+0x10
  promql_expr_test:
  - expr: homelab:database_backup_state
    eval_time: 5m
    exp_samples:
    - labels: homelab:database_backup_state{k8s_cluster="one",namespace="databases",db_cluster="app-pg"}
      value: 0
  - expr: homelab:database_in_recovery
    eval_time: 5m
    exp_samples:
    - labels: homelab:database_in_recovery{k8s_cluster="one",namespace="databases",db_cluster="app-pg"}
      value: 0
