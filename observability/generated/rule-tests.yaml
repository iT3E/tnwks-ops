  - alertname: SecurityAuditLinesRefused
    eval_time: 19m
    exp_alerts: []
  - alertname: SecurityAuditLinesRefused
    eval_time: 20m
    exp_alerts: &id002
    - exp_labels:
        severity: warning
        k8s_cluster: homelab-wsl
        component_id: loki_security_audit
      exp_annotations:
        summary: Loki refused audit lines of homelab-wsl
        dashboard_url: https://grafana.${INTERNAL_DOMAIN}/d/tnwks-observability?var-cluster=homelab-wsl
        description: The sink loki_security_audit of the Vector aggregator on homelab-wsl dropped a request in the
          last 15 minutes, and Vector does not send it again. Loki refuses a line that is older than 7 days, or
          more than one hour older than the newest line of its stream. The log of the aggregator pod has the answer
          of Loki, and vector_component_discarded_events_total has the number of lines.
  - alertname: SecurityAuditLinesRefused
    eval_time: 34m
    exp_alerts: *id002
  - alertname: SecurityAuditLinesRefused
    eval_time: 36m
