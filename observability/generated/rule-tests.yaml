- name: a node container past 90% of its memory limit alerts; another node at the same figure does not
  interval: 1m
  input_series:
  - series: node_memory_working_set_bytes{k8s_cluster="homelab-wsl-02",node="homelab-wsl-02-worker-1"}
    values: 17716740096+0x30
  - series: node_memory_working_set_bytes{k8s_cluster="homelab-wsl-02",node="homelab-wsl-02-worker-2"}
    values: 17716740096+0x30
  alert_rule_test:
  - alertname: NodeContainerMemoryNearLimit
    eval_time: 10m
    exp_alerts: []
  - alertname: NodeContainerMemoryNearLimit
    eval_time: 20m
    exp_alerts:
    - exp_labels:
        severity: warning
        k8s_cluster: homelab-wsl-02
        node: homelab-wsl-02-worker-1
      exp_annotations:
        summary: homelab-wsl-02-worker-1 is above 90% of the memory limit of its node container
        dashboard_url: https://grafana.${INTERNAL_DOMAIN}/d/tnwks-kubernetes?var-cluster=homelab-wsl-02
        description: The node container has a memory limit of 18 GiB. The scheduler does not see it, because the
          node reports the memory of the whole WSL VM. Find the largest pods of the node, and move or shrink one.
          The limit is memory_nodes of talos_clusters in the Ansible inventory.
