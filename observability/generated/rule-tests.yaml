  alert_rule_test:
  - alertname: NodeContainerMemoryNearLimit
    eval_time: 20m
    exp_alerts: []
- name: the 90-day streams above twice their plan alert, whatever the other streams take in
  interval: 1m
  input_series:
  - series: loki_distributor_bytes_received_total{k8s_cluster="homelab-wsl-02",tenant="fake",retention_hours="2160"}
    values: 0+2000000x1560
  - series: loki_distributor_bytes_received_total{k8s_cluster="homelab-wsl-02",tenant="fake",retention_hours="336"}
    values: 0+20000000x1560
  alert_rule_test:
  - alertname: LokiSecurityIngestAbovePlan
    eval_time: 26h
    exp_alerts:
    - exp_labels:
        severity: warning
        k8s_cluster: homelab-wsl-02
      exp_annotations:
        summary: Loki on homelab-wsl-02 took in more than twice the planned bytes of its 90-day streams in a day
        dashboard_url: https://grafana.${INTERNAL_DOMAIN}/d/tnwks-observability?var-cluster=homelab-wsl-02
        description: The streams that Loki keeps for 90 days took in more than 2.4 GB of lines in 24 hours, before
          compression. The plan is 1.2 GB a day. Find the stream that grew (the label security_stream), then lower
          its volume at the source or its retention.
