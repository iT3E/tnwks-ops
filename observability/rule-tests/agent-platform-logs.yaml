# Cases for the alerts that read the lines the Vector aggregator turns into
# gauges. The aggregator serves each sample with the time of its line, so a
# series holds one sample for each line and nothing between them.
rule_files:
  - kubernetes/apps/ai/agents/monitoring/app/prometheusrule.yaml
evaluation_interval: 1m
tests:
  - name: a changed instruction file fires for 20 minutes; an ok summary never
    interval: 1m
    input_series:
      # One line at 5m.
      - series: homelab_agent_platform_result_timestamp_seconds{pod_namespace="agents-pilot", app="agent", check="instruction-file", result="changed"}
        values: _x5 300 _x40
      - series: homelab_agent_platform_result_timestamp_seconds{pod_namespace="agents-pilot", app="agent", check="instruction-check", result="ok"}
        values: _x5 300 _x40
    alert_rule_test:
      - alertname: AgentInstructionFileChanged
        eval_time: 4m
        exp_alerts: []
      - alertname: AgentInstructionFileChanged
        eval_time: 6m
        exp_alerts:
          - exp_labels: {severity: warning, pod_namespace: agents-pilot, result: changed}
      - alertname: AgentInstructionFileChanged
        eval_time: 24m
        exp_alerts:
          - exp_labels: {severity: warning, pod_namespace: agents-pilot, result: changed}
      - alertname: AgentInstructionFileChanged
        eval_time: 26m
        exp_alerts: []

  - name: a line re-read with an old time does not fire
    interval: 1m
    input_series:
      # The line came in at 60m with the time of 10m (an agent that read a
      # file again from its start).
      - series: homelab_agent_platform_result_timestamp_seconds{pod_namespace="agents-pilot", app="agent", check="instruction-file", result="new"}
        values: _x60 600 _x10
    alert_rule_test:
      - alertname: AgentInstructionFileChanged
        eval_time: 61m
        exp_alerts: []

  - name: no instruction check in 26 hours fires, once the container has run that long
    # A 2m step, as kube-state-metrics is scraped often: a series with a
    # longer step drops out between its samples.
    interval: 2m
    input_series:
      # The backup container started at 0; its check lines came at 1h and
      # 25h, then none.
      - series: kube_pod_container_state_started{namespace="agents-pilot", pod="agent-1", container="backup"}
        values: 0x1700
      - series: homelab_agent_platform_result_timestamp_seconds{pod_namespace="agents-pilot", app="agent", check="instruction-check", result="ok"}
        values: _x30 3600 _x719 90000 _x900
    alert_rule_test:
      - alertname: AgentInstructionCheckStale
        eval_time: 50h
        exp_alerts: []
      - alertname: AgentInstructionCheckStale
        eval_time: 52h
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-pilot}

  - name: a new backup container waits 26 hours before the check counts as late
    interval: 2m
    input_series:
      # The pod started again at 10h; the old lines are out of the window.
      - series: kube_pod_container_state_started{namespace="agents-pilot", pod="agent-3", container="backup"}
        values: _x300 36000x1000
    alert_rule_test:
      - alertname: AgentInstructionCheckStale
        eval_time: 35h
        exp_alerts: []
      - alertname: AgentInstructionCheckStale
        eval_time: 37h
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-pilot}

  - name: a rate limit of the bridge fires for 20 minutes, for its trust domain only
    interval: 1m
    input_series:
      - series: homelab_model_bridge_engine_error_timestamp_seconds{domain="workflows", kind="rate_limit"}
        values: _x5 300 _x40
      - series: homelab_model_bridge_engine_error_timestamp_seconds{domain="pilot", kind="success"}
        values: _x5 300 _x40
    alert_rule_test:
      - alertname: ModelBridgeRateLimited
        eval_time: 6m
        exp_alerts:
          - exp_labels: {severity: warning, domain: workflows}
      - alertname: ModelBridgeRateLimited
        eval_time: 26m
        exp_alerts: []

  # A restart of the platform log agent reads the backup log again from its
  # start, so an old line comes back as a new sample with its old time.
  - name: an old line read again does not hide a check that stopped
    interval: 2m
    input_series:
      - series: kube_pod_container_state_started{namespace="agents-pilot", pod="agent-1", container="backup"}
        values: 0x1700
      # The check ran at 1h, then stopped. The same line is read again at 40h.
      - series: homelab_agent_platform_result_timestamp_seconds{pod_namespace="agents-pilot", app="agent", check="instruction-check", result="ok"}
        values: _x30 3600 _x1169 3600 _x500
    alert_rule_test:
      - alertname: AgentInstructionCheckStale
        eval_time: 52h
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-pilot}

  - name: a check at 1h and again at 25h is late only at 51h
    interval: 2m
    input_series:
      - series: kube_pod_container_state_started{namespace="agents-pilot", pod="agent-1", container="backup"}
        values: 0x1700
      - series: homelab_agent_platform_result_timestamp_seconds{pod_namespace="agents-pilot", app="agent", check="instruction-check", result="ok"}
        values: _x30 3600 _x719 90000 _x900
    alert_rule_test:
      - alertname: AgentInstructionCheckStale
        eval_time: 50h
        exp_alerts: []
      - alertname: AgentInstructionCheckStale
        eval_time: 52h
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-pilot}

  - name: a failed memory index fires until the next start, and an ok start keeps it clear
    interval: 1m
    input_series:
      # Pod agent-1 started at 1m and logged result=failed at 3m. It ran
      # until 10h; pod agent-2 started at 10h and logged result=ok at 10h3m.
      - series: kube_pod_start_time{namespace="agents-pilot", pod="agent-1"}
        values: 60x599 _x200
      - series: kube_pod_init_container_info{namespace="agents-pilot", pod="agent-1", container="memory-index"}
        values: 1x599 _x200
      - series: kube_pod_start_time{namespace="agents-pilot", pod="agent-2"}
        values: _x600 36000x200
      - series: kube_pod_init_container_info{namespace="agents-pilot", pod="agent-2", container="memory-index"}
        values: _x600 1x200
      - series: homelab_agent_platform_result_timestamp_seconds{pod_namespace="agents-pilot", app="agent", check="memory-index", result="failed"}
        values: _x3 180 _x797
      - series: homelab_agent_platform_result_timestamp_seconds{pod_namespace="agents-pilot", app="agent", check="memory-index", result="ok"}
        values: _x603 36180 _x197
    alert_rule_test:
      # The pod runs, and its step has not logged yet.
      - alertname: AgentMemoryIndexFailed
        eval_time: 2m
        exp_alerts: []
      - alertname: AgentMemoryIndexFailed
        eval_time: 4m
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-pilot}
      # Long after the sample left the 5-minute lookback.
      - alertname: AgentMemoryIndexFailed
        eval_time: 9h
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-pilot}
      # The new pod started and has not logged yet: the old line is older
      # than its start.
      - alertname: AgentMemoryIndexFailed
        eval_time: 601m
        exp_alerts: []
      - alertname: AgentMemoryIndexFailed
        eval_time: 605m
        exp_alerts: []
      - alertname: AgentMemoryIndexFailed
        eval_time: 13h
        exp_alerts: []

  - name: a new start that fails again fires again
    interval: 1m
    input_series:
      - series: kube_pod_start_time{namespace="agents-pilot", pod="agent-1"}
        values: 60x59 _x100
      - series: kube_pod_init_container_info{namespace="agents-pilot", pod="agent-1", container="memory-index"}
        values: 1x59 _x100
      - series: kube_pod_start_time{namespace="agents-pilot", pod="agent-2"}
        values: _x60 3600x100
      - series: kube_pod_init_container_info{namespace="agents-pilot", pod="agent-2", container="memory-index"}
        values: _x60 1x100
      - series: homelab_agent_platform_result_timestamp_seconds{pod_namespace="agents-pilot", app="agent", check="memory-index", result="failed"}
        values: _x3 180 _x59 3780 _x97
    alert_rule_test:
      - alertname: AgentMemoryIndexFailed
        eval_time: 61m
        exp_alerts: []
      - alertname: AgentMemoryIndexFailed
        eval_time: 64m
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-pilot}

  - name: a failed memory index does not fire with no agent pod, nor when an old line comes back
    interval: 1m
    input_series:
      # A failed start at 3m, then replicas 0 from 30m.
      - series: kube_pod_start_time{namespace="agents-pilot", pod="agent-1"}
        values: 60x29 _x100
      - series: kube_pod_init_container_info{namespace="agents-pilot", pod="agent-1", container="memory-index"}
        values: 1x29 _x100
      - series: homelab_agent_platform_result_timestamp_seconds{pod_namespace="agents-pilot", app="agent", check="memory-index", result="failed"}
        values: _x3 180 _x126
    alert_rule_test:
      - alertname: AgentMemoryIndexFailed
        eval_time: 20m
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-pilot}
      - alertname: AgentMemoryIndexFailed
        eval_time: 40m
        exp_alerts: []

  - name: an old failed line read again after an ok start does not fire
    interval: 1m
    input_series:
      # Pod agent-1 failed at 3m; pod agent-2 started at 20m and logged ok
      # at 22m. At 60m a restart of the log agent sends the old failed line
      # again, with its old time.
      - series: kube_pod_start_time{namespace="agents-pilot", pod="agent-1"}
        values: 60x19 _x100
      - series: kube_pod_start_time{namespace="agents-pilot", pod="agent-2"}
        values: _x20 1200x100
      - series: kube_pod_init_container_info{namespace="agents-pilot", pod="agent-1", container="memory-index"}
        values: 1x19 _x100
      - series: kube_pod_init_container_info{namespace="agents-pilot", pod="agent-2", container="memory-index"}
        values: _x20 1x100
      - series: homelab_agent_platform_result_timestamp_seconds{pod_namespace="agents-pilot", app="agent", check="memory-index", result="failed"}
        values: _x3 180 _x56 180 _x60
      - series: homelab_agent_platform_result_timestamp_seconds{pod_namespace="agents-pilot", app="agent", check="memory-index", result="ok"}
        values: _x22 1320 _x98
    alert_rule_test:
      - alertname: AgentMemoryIndexFailed
        eval_time: 10m
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-pilot}
      - alertname: AgentMemoryIndexFailed
        eval_time: 61m
        exp_alerts: []

  # Each trust domain with an agent pod counts apart. agents-finance has its
  # namespace and no agent pod yet, or one at replicas: 0, so it has no
  # backup container, no memory-index init container and no line.
  - name: each trust domain counts apart, and a domain with no agent pod never fires
    interval: 2m
    input_series:
      # The pilot: its check ran at 1h and 25h, so it is late only at 51h.
      - series: kube_pod_container_state_started{namespace="agents-pilot", pod="agent-1", container="backup"}
        values: 0x1700
      - series: homelab_agent_platform_result_timestamp_seconds{pod_namespace="agents-pilot", app="agent", check="instruction-check", result="ok"}
        values: _x30 3600 _x719 90000 _x900
      # A second trust domain with an agent pod whose log does not ship: no
      # line at all, so it is late once its container has run 26 hours.
      - series: kube_pod_container_state_started{namespace="agents-main", pod="agent-2", container="backup"}
        values: 0x1700
      # agents-finance: a namespace with checks and no agent pod.
      - series: kube_pod_container_state_started{namespace="agents-finance", pod="platform-check-probe-1", container="probe"}
        values: 0x1700
    alert_rule_test:
      - alertname: AgentInstructionCheckStale
        eval_time: 26h
        exp_alerts: []
      - alertname: AgentInstructionCheckStale
        eval_time: 27h
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-main}
      - alertname: AgentInstructionCheckStale
        eval_time: 52h
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-main}
          - exp_labels: {severity: warning, namespace: agents-pilot}

  - name: a failed memory index fires for its own trust domain only, and never with no agent pod
    interval: 1m
    input_series:
      # agents-main: a failed start at 3m, and its pod runs.
      - series: kube_pod_start_time{namespace="agents-main", pod="agent-9"}
        values: 60x129
      - series: kube_pod_init_container_info{namespace="agents-main", pod="agent-9", container="memory-index"}
        values: 1x129
      - series: homelab_agent_platform_result_timestamp_seconds{pod_namespace="agents-main", app="agent", check="memory-index", result="failed"}
        values: _x3 180 _x126
      # The pilot: an ok start at 3m.
      - series: kube_pod_start_time{namespace="agents-pilot", pod="agent-1"}
        values: 60x129
      - series: kube_pod_init_container_info{namespace="agents-pilot", pod="agent-1", container="memory-index"}
        values: 1x129
      - series: homelab_agent_platform_result_timestamp_seconds{pod_namespace="agents-pilot", app="agent", check="memory-index", result="ok"}
        values: _x3 180 _x126
      # agents-finance: a failed line and no agent pod (replicas: 0).
      - series: homelab_agent_platform_result_timestamp_seconds{pod_namespace="agents-finance", app="agent", check="memory-index", result="failed"}
        values: _x3 180 _x126
    alert_rule_test:
      - alertname: AgentMemoryIndexFailed
        eval_time: 20m
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-main}
