# Cases for the alerts of the agent platform
# (kubernetes/apps/ai/agents/monitoring/app/prometheusrule.yaml). Each case
# that guards a fix was checked to fail on the rule before the fix.
rule_files:
  - kubernetes/apps/ai/agents/monitoring/app/prometheusrule.yaml
evaluation_interval: 1m
tests:
  - name: a workload with fewer ready pods than wanted, and one scaled to zero
    interval: 1m
    input_series:
      - series: kube_deployment_spec_replicas{namespace="agents-pilot", deployment="agent"}
        values: 1x30
      - series: kube_deployment_status_replicas_ready{namespace="agents-pilot", deployment="agent"}
        values: 0x30
      - series: kube_deployment_spec_replicas{namespace="ai", deployment="model-bridge"}
        values: 0x30
      - series: kube_deployment_status_replicas_ready{namespace="ai", deployment="model-bridge"}
        values: 0x30
      - series: kube_deployment_spec_replicas{namespace="ai", deployment="mcp-gateway"}
        values: 1x30
      - series: kube_deployment_status_replicas_ready{namespace="ai", deployment="mcp-gateway"}
        values: 1x12 0x18
      - series: kube_deployment_spec_replicas{namespace="ai", deployment="other"}
        values: 1x30
      - series: kube_deployment_status_replicas_ready{namespace="ai", deployment="other"}
        values: 0x30
      - series: kube_statefulset_replicas{namespace="agents-main", statefulset="openshell"}
        values: 1x30
      - series: kube_statefulset_status_replicas_ready{namespace="agents-main", statefulset="openshell"}
        values: 1x5 0x25
    alert_rule_test:
      - alertname: AgentPlatformWorkloadNotReady
        eval_time: 9m
        exp_alerts: []
      - alertname: AgentPlatformWorkloadNotReady
        eval_time: 11m
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-pilot, deployment: agent, workload: agent}
      - alertname: AgentPlatformWorkloadNotReady
        eval_time: 17m
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-pilot, deployment: agent, workload: agent}
          - exp_labels: {severity: warning, namespace: agents-main, statefulset: openshell, workload: openshell}
      - alertname: AgentPlatformWorkloadNotReady
        eval_time: 25m
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-pilot, deployment: agent, workload: agent}
          - exp_labels: {severity: warning, namespace: agents-main, statefulset: openshell, workload: openshell}
          - exp_labels: {severity: warning, namespace: ai, deployment: mcp-gateway, workload: mcp-gateway}

  - name: the last run of the providers job failed, then a good run resolves it
    interval: 1m
    input_series:
      # A failed Job that started at 10m; the last success was at 0.
      - series: kube_job_status_start_time{namespace="agents-workflows", job_name="workflow-providers-2"}
        values: 600x40
      - series: kube_job_owner{namespace="agents-workflows", job_name="workflow-providers-2", owner_kind="CronJob", owner_name="workflow-providers"}
        values: 1x40
      - series: kube_job_status_failed{namespace="agents-workflows", job_name="workflow-providers-2", reason="BackoffLimitExceeded"}
        values: _x10 1x30
      # A good run at 25m.
      - series: kube_cronjob_status_last_successful_time{namespace="agents-workflows", cronjob="workflow-providers"}
        values: 0x24 1500x15
      # A failed check Job of a CronJob that never passed.
      - series: kube_job_status_start_time{namespace="agents-main", job_name="platform-check-probe-1"}
        values: 60x40
      - series: kube_job_owner{namespace="agents-main", job_name="platform-check-probe-1", owner_kind="CronJob", owner_name="platform-check-probe"}
        values: 1x40
      - series: kube_job_status_failed{namespace="agents-main", job_name="platform-check-probe-1", reason="BackoffLimitExceeded"}
        values: 1x40
    alert_rule_test:
      - alertname: AgentPlatformCronJobFailed
        eval_time: 5m
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-main, cronjob: platform-check-probe}
      - alertname: AgentPlatformCronJobFailed
        eval_time: 15m
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-main, cronjob: platform-check-probe}
          - exp_labels: {severity: warning, namespace: agents-workflows, cronjob: workflow-providers}
      - alertname: AgentPlatformCronJobFailed
        eval_time: 30m
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-main, cronjob: platform-check-probe}

  - name: no good run of the providers job in 35 minutes
    interval: 1m
    input_series:
      - series: kube_cronjob_created{namespace="agents-workflows", cronjob="workflow-providers"}
        values: 0x60
      - series: kube_cronjob_status_last_successful_time{namespace="agents-workflows", cronjob="workflow-providers"}
        values: 0x60
    alert_rule_test:
      - alertname: WorkflowProvidersStale
        eval_time: 34m
        exp_alerts: []
      - alertname: WorkflowProvidersStale
        eval_time: 37m
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-workflows, cronjob: workflow-providers}

  - name: a providers CronJob that never passed, and one that is gone
    interval: 1m
    input_series:
      - series: kube_cronjob_created{namespace="agents-workflows", cronjob="workflow-providers"}
        values: 0x60
    alert_rule_test:
      - alertname: WorkflowProvidersStale
        eval_time: 40m
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-workflows, cronjob: workflow-providers}
  - name: the providers CronJob is gone
    interval: 1m
    input_series:
      - series: kube_cronjob_created{namespace="agents-workflows", cronjob="workflow-sweep"}
        values: 0x20
    alert_rule_test:
      - alertname: WorkflowProvidersStale
        eval_time: 4m
        exp_alerts: []
      - alertname: WorkflowProvidersStale
        eval_time: 6m
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-workflows, cronjob: workflow-providers}

  - name: a drift line fires for 20 minutes; an ok line never
    interval: 1m
    input_series:
      # The newest drift line came at 1m.
      - series: homelab_agent_platform_result_timestamp_seconds{pod_namespace="agents-workflows", app="workflow-providers", check="app-drift", result="drift"}
        values: _ 60x40
      - series: homelab_agent_platform_result_timestamp_seconds{pod_namespace="agents-workflows", app="workflow-providers", check="app-drift", result="ok"}
        values: 60x40
    alert_rule_test:
      - alertname: WorkflowAppDrift
        eval_time: 10m
        exp_alerts:
          - exp_labels: {severity: warning, pod_namespace: agents-workflows, app: workflow-providers}
      - alertname: WorkflowAppDrift
        eval_time: 22m
        exp_alerts: []

  - name: no good run of the token job of main in 35 minutes
    interval: 1m
    input_series:
      - series: kube_cronjob_created{namespace="agents-main", cronjob="github-token"}
        values: 0x60
      - series: kube_cronjob_status_last_successful_time{namespace="agents-main", cronjob="github-token"}
        values: 0x60
      # The providers job of workflows, also old, fires its own alert only.
      - series: kube_cronjob_created{namespace="agents-workflows", cronjob="workflow-providers"}
        values: 0x60
      - series: kube_cronjob_status_last_successful_time{namespace="agents-workflows", cronjob="workflow-providers"}
        values: 0x60
    alert_rule_test:
      - alertname: MainGithubTokenStale
        eval_time: 34m
        exp_alerts: []
      - alertname: MainGithubTokenStale
        eval_time: 37m
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-main, cronjob: github-token}

  - name: a healthy token job of main, created long ago, never fires
    interval: 1m
    input_series:
      # Created at 0; a good run at 13m, 43m, 73m, 103m and 133m (the value
      # is the time of the last success, in seconds).
      - series: kube_cronjob_created{namespace="agents-main", cronjob="github-token"}
        values: 0x180
      - series: kube_cronjob_status_last_successful_time{namespace="agents-main", cronjob="github-token"}
        values: _x12 780x29 2580x29 4380x29 6180x29 7980x47
    alert_rule_test:
      - alertname: MainGithubTokenStale
        eval_time: 40m
        exp_alerts: []
      - alertname: MainGithubTokenStale
        eval_time: 70m
        exp_alerts: []
      - alertname: MainGithubTokenStale
        eval_time: 100m
        exp_alerts: []
      - alertname: MainGithubTokenStale
        eval_time: 160m
        exp_alerts: []

  - name: a token job of main that never passed
    interval: 1m
    input_series:
      - series: kube_cronjob_created{namespace="agents-main", cronjob="github-token"}
        values: 0x60
    alert_rule_test:
      - alertname: MainGithubTokenStale
        eval_time: 34m
        exp_alerts: []
      - alertname: MainGithubTokenStale
        eval_time: 40m
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-main, cronjob: github-token}

  - name: the token job of main is gone
    interval: 1m
    input_series:
      - series: kube_cronjob_created{namespace="agents-main", cronjob="platform-check-isolation"}
        values: 0x20
    alert_rule_test:
      - alertname: MainGithubTokenStale
        eval_time: 4m
        exp_alerts: []
      - alertname: MainGithubTokenStale
        eval_time: 6m
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-main, cronjob: github-token}

  - name: a drift line of the token job of main fires across the 30 minutes to the next run, and resolves 40 minutes after it
    interval: 1m
    input_series:
      # One drift line at 1m; Prometheus holds the sample for 5 minutes.
      - series: homelab_agent_platform_result_timestamp_seconds{pod_namespace="agents-main", app="github-token", check="github-token", result="drift"}
        values: _ 60x4 _x50
      - series: homelab_agent_platform_result_timestamp_seconds{pod_namespace="agents-main", app="github-token", check="github-token", result="ok"}
        values: 60x55
      # The drift line of the reviewer of workflows is not this alert.
      - series: homelab_agent_platform_result_timestamp_seconds{pod_namespace="agents-workflows", app="workflow-providers", check="app-drift", result="drift"}
        values: 60x55
    alert_rule_test:
      - alertname: MainGithubAppDrift
        eval_time: 2m
        exp_alerts:
          - exp_labels: {severity: warning, pod_namespace: agents-main, app: github-token}
      - alertname: MainGithubAppDrift
        eval_time: 30m
        exp_alerts:
          - exp_labels: {severity: warning, pod_namespace: agents-main, app: github-token}
      - alertname: MainGithubAppDrift
        eval_time: 42m
        exp_alerts: []

  - name: an ok line and a failed line of the token job of main are not drift
    interval: 1m
    input_series:
      - series: homelab_agent_platform_result_timestamp_seconds{pod_namespace="agents-main", app="github-token", check="github-token", result="ok"}
        values: 60x20
      - series: homelab_agent_platform_result_timestamp_seconds{pod_namespace="agents-main", app="github-token", check="github-token", result="failed"}
        values: 60x20
    alert_rule_test:
      - alertname: MainGithubAppDrift
        eval_time: 10m
        exp_alerts: []

  - name: a daily check that has not passed in 26 hours
    interval: 2m
    input_series:
      - series: kube_cronjob_created{namespace="agents-finance", cronjob="platform-check-isolation"}
        values: 0x900
      - series: kube_cronjob_status_last_successful_time{namespace="agents-finance", cronjob="platform-check-isolation"}
        values: 0x900
    alert_rule_test:
      - alertname: AgentPlatformCheckStale
        eval_time: 26h
        exp_alerts: []
      - alertname: AgentPlatformCheckStale
        eval_time: 26h20m
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-finance, cronjob: platform-check-isolation}

  - name: the key check of the model gateway that has not passed in 26 hours, and another CronJob of ai that does not count
    interval: 2m
    input_series:
      # The key check passed at 0 and never again (the failed Job is gone,
      # or the CronJob is suspended).
      - series: kube_cronjob_created{namespace="ai", cronjob="litellm-key-check"}
        values: 0x900
      - series: kube_cronjob_status_last_successful_time{namespace="ai", cronjob="litellm-key-check"}
        values: 0x900
      # Another CronJob of ai, also old: not a check of this rule.
      - series: kube_cronjob_created{namespace="ai", cronjob="other-job"}
        values: 0x900
      - series: kube_cronjob_status_last_successful_time{namespace="ai", cronjob="other-job"}
        values: 0x900
    alert_rule_test:
      - alertname: AgentPlatformCheckStale
        eval_time: 26h
        exp_alerts: []
      - alertname: AgentPlatformCheckStale
        eval_time: 26h20m
        exp_alerts:
          - exp_labels: {severity: warning, namespace: ai, cronjob: litellm-key-check}

  - name: a key check that never passed fires once a run was due
    interval: 2m
    input_series:
      - series: kube_cronjob_created{namespace="ai", cronjob="litellm-key-check"}
        values: 0x900
    alert_rule_test:
      - alertname: AgentPlatformCheckStale
        eval_time: 26h20m
        exp_alerts:
          - exp_labels: {severity: warning, namespace: ai, cronjob: litellm-key-check}

  - name: a run sandbox older than 90 minutes; the pilot's long-lived sandbox and the probe do not count
    interval: 1m
    input_series:
      - series: kube_pod_created{namespace="agents-workflows", pod="os-supervisor-1"}
        values: 0x120
      - series: kube_pod_owner{namespace="agents-workflows", pod="os-supervisor-1", owner_kind="Sandbox", owner_name="default--run-abc1234-xyz"}
        values: 1x120
      - series: kube_pod_created{namespace="agents-workflows", pod="default--platform-probe"}
        values: 0x120
      - series: kube_pod_owner{namespace="agents-workflows", pod="default--platform-probe", owner_kind="Sandbox", owner_name="default--platform-probe"}
        values: 1x120
      - series: kube_pod_created{namespace="agents-pilot", pod="default--oc-1"}
        values: 0x120
      - series: kube_pod_owner{namespace="agents-pilot", pod="default--oc-1", owner_kind="Sandbox", owner_name="default--oc-1"}
        values: 1x120
    alert_rule_test:
      - alertname: AgentRunSandboxTooOld
        eval_time: 85m
        exp_alerts: []
      - alertname: AgentRunSandboxTooOld
        eval_time: 91m
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-workflows, sandbox: default--run-abc1234-xyz}

  - name: a failed run fires for two hours from its start
    interval: 5m
    input_series:
      - series: kube_job_status_failed{namespace="agents-workflows", job_name="run-abc", reason="BackoffLimitExceeded"}
        values: _x2 1x40
      - series: kube_job_status_start_time{namespace="agents-workflows", job_name="run-abc"}
        values: 0x42
    alert_rule_test:
      - alertname: AgentWorkflowRunFailed
        eval_time: 1h
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-workflows, job_name: run-abc}
      - alertname: AgentWorkflowRunFailed
        eval_time: 2h5m
        exp_alerts: []

  - name: a restart of the backup container fires for two hours
    interval: 5m
    input_series:
      - series: kube_pod_container_status_restarts_total{namespace="agents-pilot", pod="agent-1", container="backup"}
        values: 0x6 1x40
      - series: kube_pod_container_status_restarts_total{namespace="agents-pilot", pod="agent-1", container="agent"}
        values: 0x6 1x40
      # daily-backup.sh ends with exit 1 (reason Error).
      - series: kube_pod_container_status_last_terminated_exitcode{namespace="agents-pilot", pod="agent-1", container="backup"}
        values: _x6 1x40
      - series: kube_pod_container_status_last_terminated_reason{namespace="agents-pilot", pod="agent-1", container="backup", reason="Error"}
        values: _x6 1x40
    alert_rule_test:
      - alertname: AgentDailyArchiveFailed
        eval_time: 20m
        exp_alerts: []
      - alertname: AgentDailyArchiveFailed
        eval_time: 1h
        exp_alerts:
          - exp_labels: {severity: warning, namespace: agents-pilot, pod: agent-1}
      - alertname: AgentDailyArchiveFailed
        eval_time: 2h40m
        exp_alerts: []

  - name: review fixture, one drift line at 10m holds 20 minutes
    interval: 1m
    input_series:
      - series: homelab_agent_platform_result_timestamp_seconds{pod_namespace="agents-workflows", app="workflow-providers", check="app-drift", result="drift"}
        values: _x10 600 _x40
    alert_rule_test:
      - {alertname: WorkflowAppDrift, eval_time: 25m, exp_alerts: [{exp_labels: {severity: warning, pod_namespace: agents-workflows, app: workflow-providers}}]}
      - {alertname: WorkflowAppDrift, eval_time: 31m, exp_alerts: []}

  - name: drift lines every 15 minutes, one sample each, fire without a gap
    interval: 1m
    input_series:
      - series: homelab_agent_platform_result_timestamp_seconds{pod_namespace="agents-workflows", app="workflow-providers", check="app-drift", result="drift"}
        values: _x10 600 _x14 1500 _x14 2400 _x30
    alert_rule_test:
      - {alertname: WorkflowAppDrift, eval_time: 9m, exp_alerts: []}
      - {alertname: WorkflowAppDrift, eval_time: 17m, exp_alerts: [{exp_labels: {severity: warning, pod_namespace: agents-workflows, app: workflow-providers}}]}
      - {alertname: WorkflowAppDrift, eval_time: 24m, exp_alerts: [{exp_labels: {severity: warning, pod_namespace: agents-workflows, app: workflow-providers}}]}
      - {alertname: WorkflowAppDrift, eval_time: 33m, exp_alerts: [{exp_labels: {severity: warning, pod_namespace: agents-workflows, app: workflow-providers}}]}
      - {alertname: WorkflowAppDrift, eval_time: 48m, exp_alerts: [{exp_labels: {severity: warning, pod_namespace: agents-workflows, app: workflow-providers}}]}
      - {alertname: WorkflowAppDrift, eval_time: 61m, exp_alerts: []}

  - name: a Job that fails one pod, retries and passes, does not fire
    interval: 1m
    input_series:
      - series: kube_job_status_start_time{namespace="agents-workflows", job_name="workflow-providers-3"}
        values: 600x30
      - series: kube_job_owner{namespace="agents-workflows", job_name="workflow-providers-3", owner_kind="CronJob", owner_name="workflow-providers"}
        values: 1x30
      # kube-state-metrics counts the failed pod with reason="" while the Job retries.
      - series: kube_job_status_failed{namespace="agents-workflows", job_name="workflow-providers-3", reason=""}
        values: _x10 1x20
      - series: kube_cronjob_status_last_successful_time{namespace="agents-workflows", cronjob="workflow-providers"}
        values: 0x14 900x15
      - series: kube_job_status_failed{namespace="agents-workflows", job_name="run-def", reason=""}
        values: 1x30
      - series: kube_job_status_start_time{namespace="agents-workflows", job_name="run-def"}
        values: 0x30
    alert_rule_test:
      - {alertname: AgentPlatformCronJobFailed, eval_time: 12m, exp_alerts: []}
      - {alertname: AgentPlatformCronJobFailed, eval_time: 20m, exp_alerts: []}
      - {alertname: AgentWorkflowRunFailed, eval_time: 10m, exp_alerts: []}

  # A stop of the node: the kubelet stops the container with SIGTERM (exit
  # 143, reason Error, as seen at the planned stop of 2026-11-21), or the node
  # goes down with it (exit 255, reason Unknown). Neither is a failed archive.
  # The case with exit 143 fired on the rule that read reason="Error".
  - name: a stop of the node (exit 143 or 255) does not count as a failed archive
    interval: 5m
    input_series:
      - series: kube_pod_container_status_restarts_total{namespace="agents-pilot", pod="agent-2", container="backup"}
        values: 0x6 1x40
      - series: kube_pod_container_status_last_terminated_exitcode{namespace="agents-pilot", pod="agent-2", container="backup"}
        values: _x6 255x40
      - series: kube_pod_container_status_last_terminated_reason{namespace="agents-pilot", pod="agent-2", container="backup", reason="Unknown"}
        values: _x6 1x40
      - series: kube_pod_container_status_restarts_total{namespace="agents-main", pod="agent-3", container="backup"}
        values: 0x6 1x40
      - series: kube_pod_container_status_last_terminated_exitcode{namespace="agents-main", pod="agent-3", container="backup"}
        values: _x6 143x40
      - series: kube_pod_container_status_last_terminated_reason{namespace="agents-main", pod="agent-3", container="backup", reason="Error"}
        values: _x6 1x40
    alert_rule_test:
      - {alertname: AgentDailyArchiveFailed, eval_time: 1h, exp_alerts: []}

  - name: two kube-state-metrics pods in a rollout serve the same series
    interval: 1m
    input_series:
      - series: kube_job_status_start_time{namespace="agents-main", job_name="platform-check-probe-9", instance="ksm-a"}
        values: 600x20
      - series: kube_job_status_start_time{namespace="agents-main", job_name="platform-check-probe-9", instance="ksm-b"}
        values: 600x20
      - series: kube_job_owner{namespace="agents-main", job_name="platform-check-probe-9", owner_kind="CronJob", owner_name="platform-check-probe", instance="ksm-a"}
        values: 1x20
      - series: kube_job_owner{namespace="agents-main", job_name="platform-check-probe-9", owner_kind="CronJob", owner_name="platform-check-probe", instance="ksm-b"}
        values: 1x20
      - series: kube_job_status_failed{namespace="agents-main", job_name="platform-check-probe-9", reason="BackoffLimitExceeded", instance="ksm-a"}
        values: 1x20
      - series: kube_job_status_failed{namespace="agents-main", job_name="platform-check-probe-9", reason="BackoffLimitExceeded", instance="ksm-b"}
        values: 1x20
      - series: kube_cronjob_status_last_successful_time{namespace="agents-main", cronjob="platform-check-probe", instance="ksm-a"}
        values: 0x20
      - series: kube_cronjob_status_last_successful_time{namespace="agents-main", cronjob="platform-check-probe", instance="ksm-b"}
        values: 0x20
      - series: kube_pod_created{namespace="agents-workflows", pod="os-supervisor-9", instance="ksm-a"}
        values: 0x120
      - series: kube_pod_created{namespace="agents-workflows", pod="os-supervisor-9", instance="ksm-b"}
        values: 0x120
      - series: kube_pod_owner{namespace="agents-workflows", pod="os-supervisor-9", owner_kind="Sandbox", owner_name="default--run-9999999-abc", instance="ksm-a"}
        values: 1x120
      - series: kube_pod_owner{namespace="agents-workflows", pod="os-supervisor-9", owner_kind="Sandbox", owner_name="default--run-9999999-abc", instance="ksm-b"}
        values: 1x120
    alert_rule_test:
      - {alertname: AgentPlatformCronJobFailed, eval_time: 15m, exp_alerts: [{exp_labels: {severity: warning, namespace: agents-main, cronjob: platform-check-probe}}]}
      - {alertname: AgentRunSandboxTooOld, eval_time: 91m, exp_alerts: [{exp_labels: {severity: warning, namespace: agents-workflows, sandbox: default--run-9999999-abc}}]}

  - name: the first denial of the mover ConfigMap policy fires for an hour
    interval: 1m
    input_series:
      # The API server started long before the test. It counts a failed
      # check only, so the series starts at its first denial (10m).
      - series: process_start_time_seconds{instance="10.0.0.1:6443", job="apiserver"}
        values: -100000x200
      - series: apiserver_validating_admission_policy_check_total{instance="10.0.0.1:6443", job="apiserver", policy="agents-backup-mover-configmaps", policy_binding="agents-backup-mover-configmaps", enforcement_action="deny", error_type="invalid_error"}
        values: _x10 1x190
      # The denials of another policy never fire this alert.
      - series: apiserver_validating_admission_policy_check_total{instance="10.0.0.1:6443", job="apiserver", policy="workflow-run-jobs", policy_binding="workflow-run-jobs", enforcement_action="deny", error_type="invalid_error"}
        values: _x10 1x10 2x180
    alert_rule_test:
      - {alertname: AgentBackupMoverConfigMapDenied, eval_time: 9m, exp_alerts: []}
      - {alertname: AgentBackupMoverConfigMapDenied, eval_time: 11m, exp_alerts: [{exp_labels: {severity: warning, policy: agents-backup-mover-configmaps}}]}
      - {alertname: AgentBackupMoverConfigMapDenied, eval_time: 1h5m, exp_alerts: [{exp_labels: {severity: warning, policy: agents-backup-mover-configmaps}}]}
      - {alertname: AgentBackupMoverConfigMapDenied, eval_time: 1h15m, exp_alerts: []}

  - name: a later denial, a restart of the API server, and a first denial 100 minutes after it
    interval: 1m
    input_series:
      # Denials before the test, one more at 100m. The API server starts
      # again at 130m: its scrape no longer has the series, so Prometheus
      # marks it stale. A new denial at 230m starts it again at 1.
      - series: process_start_time_seconds{instance="10.0.0.1:6443", job="apiserver"}
        values: -100000x129 7800x200
      - series: apiserver_validating_admission_policy_check_total{instance="10.0.0.1:6443", job="apiserver", policy="agents-backup-mover-configmaps", policy_binding="agents-backup-mover-configmaps", enforcement_action="deny", error_type="invalid_error"}
        values: 1x99 2x29 stale _x100 1x100
    alert_rule_test:
      - {alertname: AgentBackupMoverConfigMapDenied, eval_time: 90m, exp_alerts: []}
      - {alertname: AgentBackupMoverConfigMapDenied, eval_time: 101m, exp_alerts: [{exp_labels: {severity: warning, policy: agents-backup-mover-configmaps}}]}
      - {alertname: AgentBackupMoverConfigMapDenied, eval_time: 225m, exp_alerts: []}
      - {alertname: AgentBackupMoverConfigMapDenied, eval_time: 231m, exp_alerts: [{exp_labels: {severity: warning, policy: agents-backup-mover-configmaps}}]}
      - {alertname: AgentBackupMoverConfigMapDenied, eval_time: 330m, exp_alerts: []}

  - name: a first denial 20 minutes after a restart of the API server fires
    interval: 1m
    input_series:
      # The series of before the restart (130m) is still in the hour that
      # the second part reads, so the third part fires.
      - series: process_start_time_seconds{instance="10.0.0.1:6443", job="apiserver"}
        values: -100000x129 7800x200
      - series: apiserver_validating_admission_policy_check_total{instance="10.0.0.1:6443", job="apiserver", policy="agents-backup-mover-configmaps", policy_binding="agents-backup-mover-configmaps", enforcement_action="deny", error_type="invalid_error"}
        values: 1x128 stale _x20 1x180
    alert_rule_test:
      - {alertname: AgentBackupMoverConfigMapDenied, eval_time: 149m, exp_alerts: []}
      - {alertname: AgentBackupMoverConfigMapDenied, eval_time: 151m, exp_alerts: [{exp_labels: {severity: warning, policy: agents-backup-mover-configmaps}}]}

  - name: a gap of the scrape of 20 minutes does not fire again
    interval: 1m
    input_series:
      # A denial at 0m, then no scrape from 300m to 320m (a restart of
      # Prometheus or of the host). The review found that the form
      # `unless ... offset 1h` fired at 6h15m here.
      - series: process_start_time_seconds{instance="10.0.0.1:6443", job="apiserver"}
        values: -100000x299 _x20 -100000x200
      - series: apiserver_validating_admission_policy_check_total{instance="10.0.0.1:6443", job="apiserver", policy="agents-backup-mover-configmaps", policy_binding="agents-backup-mover-configmaps", enforcement_action="deny", error_type="invalid_error"}
        values: 1x299 _x20 1x200
    alert_rule_test:
      - {alertname: AgentBackupMoverConfigMapDenied, eval_time: 2h, exp_alerts: []}
      - {alertname: AgentBackupMoverConfigMapDenied, eval_time: 321m, exp_alerts: []}
      - {alertname: AgentBackupMoverConfigMapDenied, eval_time: 6h15m, exp_alerts: []}
      - {alertname: AgentBackupMoverConfigMapDenied, eval_time: 7h, exp_alerts: []}

  - name: the agents repository stays Initializing; Ready, Failed and another repository do not fire
    interval: 1m
    input_series:
      # Initializing from 0 to 90m, then Ready.
      - series: kopiur_resource_phase{kind="ClusterRepository", name="agents", phase="Initializing"}
        values: 1x90
      - series: kopiur_resource_phase{kind="ClusterRepository", name="agents", phase="Ready"}
        values: _x90 1x30
      # A repository of one trust domain, Pending for 30 minutes only.
      - series: kopiur_resource_phase{kind="ClusterRepository", name="agents-finance", phase="Pending"}
        values: 1x30
      - series: kopiur_resource_phase{kind="ClusterRepository", name="agents-finance", phase="Ready"}
        values: _x30 1x90
      # Failed is the chart rule's, and s3 is not a repository of the agents.
      - series: kopiur_resource_phase{kind="ClusterRepository", name="agents-main", phase="Failed"}
        values: 1x120
      - series: kopiur_resource_phase{kind="ClusterRepository", name="s3", phase="Initializing"}
        values: 1x120
    alert_rule_test:
      - {alertname: AgentBackupRepositoryNotReady, eval_time: 59m, exp_alerts: []}
      - {alertname: AgentBackupRepositoryNotReady, eval_time: 61m, exp_alerts: [{exp_labels: {severity: warning, name: agents, phase: Initializing}}]}
      - {alertname: AgentBackupRepositoryNotReady, eval_time: 100m, exp_alerts: []}

  - name: a message with no end of its turn for 30 minutes fires, a quiet evening does not
    interval: 1m
    input_series:
      # main: two messages ended (one completed, one skipped in a group),
      # then a third came at 10m and its turn never ended.
      - series: openclaw_message_received_total{job="openclaw-agents-main", openclaw_channel="telegram", openclaw_source="dispatchInboundMessage"}
        values: 2x9 3x60
      - series: openclaw_message_processed_total{job="openclaw-agents-main", openclaw_channel="telegram", openclaw_outcome="completed"}
        values: 1x70
      - series: openclaw_message_processed_total{job="openclaw-agents-main", openclaw_channel="telegram", openclaw_outcome="skipped"}
        values: 1x70
      # finance: a quiet evening, no message at all; only the heartbeat turn
      # of the day, which ended.
      - series: openclaw_message_received_total{job="openclaw-agents-finance", openclaw_channel="unknown", openclaw_source="dispatchInboundMessage"}
        values: 1x70
      - series: openclaw_message_processed_total{job="openclaw-agents-finance", openclaw_channel="unknown", openclaw_outcome="completed"}
        values: 1x70
      # pilot: a long turn of 20 minutes that ends.
      - series: openclaw_message_received_total{job="openclaw-agents-pilot", openclaw_channel="telegram", openclaw_source="dispatchInboundMessage"}
        values: 0x4 1x65
      - series: openclaw_message_processed_total{job="openclaw-agents-pilot", openclaw_channel="telegram", openclaw_outcome="completed"}
        values: 0x24 1x45
    alert_rule_test:
      - alertname: AgentTurnNotEnded
        eval_time: 39m
        exp_alerts: []
      - alertname: AgentTurnNotEnded
        eval_time: 41m
        exp_alerts:
          - exp_labels: {severity: warning, job: openclaw-agents-main, openclaw_channel: telegram}

  - name: the first message after a start of the pod hangs, before any message ended
    interval: 1m
    input_series:
      # The counter of ended messages does not exist until the first end.
      - series: openclaw_message_received_total{job="openclaw-agents-main", openclaw_channel="telegram", openclaw_source="dispatchInboundMessage"}
        values: _x5 1x60
    alert_rule_test:
      - alertname: AgentTurnNotEnded
        eval_time: 34m
        exp_alerts: []
      - alertname: AgentTurnNotEnded
        eval_time: 36m
        exp_alerts:
          - exp_labels: {severity: warning, job: openclaw-agents-main, openclaw_channel: telegram}

  - name: a restart of the pod starts both counters again and does not fire
    interval: 1m
    input_series:
      # 5 messages ended, the pod starts again at 20m (no series for 2
      # minutes), then one message comes at 30m and ends at 33m.
      - series: openclaw_message_received_total{job="openclaw-agents-main", openclaw_channel="telegram", openclaw_source="dispatchInboundMessage"}
        values: 5x19 _x2 0x7 1x60
      - series: openclaw_message_processed_total{job="openclaw-agents-main", openclaw_channel="telegram", openclaw_outcome="completed"}
        values: 5x19 _x10 _x3 1x60
    alert_rule_test:
      - alertname: AgentTurnNotEnded
        eval_time: 80m
        exp_alerts: []

  - name: one failed send of a reply fires, and the alert ends 30 minutes after the last line
    interval: 1m
    input_series:
      # The zero series of the platform Vector, then one send_failed line at 10m.
      - series: homelab_agent_channel_error_lines_total{namespace="monitoring", pod="vector-agent-platform-a", pod_namespace="agents-main", pattern="send_failed"}
        values: 0x9 1x60
      - series: homelab_agent_channel_error_lines_total{namespace="monitoring", pod="vector-agent-platform-a", pod_namespace="agents-finance", pattern="send_failed"}
        values: 0x70
    alert_rule_test:
      - alertname: AgentChannelFailing
        eval_time: 9m
        exp_alerts: []
      - alertname: AgentChannelFailing
        eval_time: 11m
        exp_alerts:
          - exp_labels: {severity: warning, pod_namespace: agents-main, pattern: send_failed}
      - alertname: AgentChannelFailing
        eval_time: 41m
        exp_alerts: []

  - name: a restart of the channel by the health monitor fires
    interval: 1m
    input_series:
      - series: homelab_agent_channel_error_lines_total{namespace="monitoring", pod="vector-agent-platform-a", pod_namespace="agents-finance", pattern="channel_restart"}
        values: 0x19 1x30
    alert_rule_test:
      - alertname: AgentChannelFailing
        eval_time: 21m
        exp_alerts:
          - exp_labels: {severity: warning, pod_namespace: agents-finance, pattern: channel_restart}

  - name: a poll that stalls once and comes back does not fire, a poll that stops does
    interval: 1m
    input_series:
      # One stall and one restart at 5m (the poll came back), then from 61m
      # a stall and a restart every 6 minutes: 2 in the 30 minutes up to
      # 68m, 3 up to 75m.
      - series: homelab_agent_channel_error_lines_total{namespace="monitoring", pod="vector-agent-platform-a", pod_namespace="agents-main", pattern="poll_stall"}
        values: 0x4 1x55 2x5 3x5 4x5 5x30
      - series: homelab_agent_channel_error_lines_total{namespace="monitoring", pod="vector-agent-platform-a", pod_namespace="agents-main", pattern="poll_restart"}
        values: 0x4 1x55 2x5 3x5 4x5 5x30
    alert_rule_test:
      - alertname: AgentChannelFailing
        eval_time: 10m
        exp_alerts: []
      - alertname: AgentChannelFailing
        eval_time: 68m
        exp_alerts: []
      - alertname: AgentChannelFailing
        eval_time: 75m
        exp_alerts:
          - exp_labels: {severity: warning, pod_namespace: agents-main, pattern: poll_stall}
          - exp_labels: {severity: warning, pod_namespace: agents-main, pattern: poll_restart}

  - name: a restart of the platform Vector starts the count again and does not fire
    interval: 1m
    input_series:
      - series: homelab_agent_channel_error_lines_total{namespace="monitoring", pod="vector-agent-platform-a", pod_namespace="agents-main", pattern="send_failed"}
        values: 3x40 _x2 0x30
    alert_rule_test:
      - alertname: AgentChannelFailing
        eval_time: 65m
        exp_alerts: []

  - name: one refuse line of the approval plugin fires at once, holds for the hour, and is no channel failure
    interval: 1m
    input_series:
      # The zero series of main, then one line at 10m.
      - series: homelab_agent_channel_error_lines_total{namespace="monitoring", pod="vector-agent-platform-a", pod_namespace="agents-main", pattern="plugin_refuse"}
        values: 0x9 1x80
    alert_rule_test:
      - alertname: AgentPluginRefusingTools
        eval_time: 9m
        exp_alerts: []
      - alertname: AgentPluginRefusingTools
        eval_time: 10m
        exp_alerts:
          - exp_labels: {severity: warning, pod_namespace: agents-main}
      # The range of the hour leaves out its start: at 69m the zero at 9m
      # is out of it.
      - alertname: AgentPluginRefusingTools
        eval_time: 68m
        exp_alerts:
          - exp_labels: {severity: warning, pod_namespace: agents-main}
      - alertname: AgentPluginRefusingTools
        eval_time: 69m
        exp_alerts: []
      - alertname: AgentChannelFailing
        eval_time: 11m
        exp_alerts: []

  - name: a restart of the platform Vector after a refuse line does not fire again
    interval: 1m
    input_series:
      - series: homelab_agent_channel_error_lines_total{namespace="monitoring", pod="vector-agent-platform-a", pod_namespace="agents-main", pattern="plugin_refuse"}
        values: 1x80 _x2 0x60
    alert_rule_test:
      - alertname: AgentPluginRefusingTools
        eval_time: 140m
        exp_alerts: []

  - name: a refuse line of an agent with no zero series of it is not seen
    interval: 1m
    input_series:
      # Finance does not load the plugin and has no zero series of the
      # pattern: a series that starts at 1 has no increase.
      - series: homelab_agent_channel_error_lines_total{namespace="monitoring", pod="vector-agent-platform-a", pod_namespace="agents-finance", pattern="plugin_refuse"}
        values: _x10 1x60
    alert_rule_test:
      - alertname: AgentPluginRefusingTools
        eval_time: 20m
        exp_alerts: []
