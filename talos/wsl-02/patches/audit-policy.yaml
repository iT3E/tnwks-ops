# homelab-wsl-02: the audit policy of the API server. Control plane only.
#
# The API server writes one line for each event that the policy keeps, to
# /var/log/audit/kube/ on the control plane node. The audit reader sends
# those lines on as the security stream "k8s-audit"
# (kubernetes/apps/monitoring/vector/README.md). The rules are the same on
# each cluster: talos/README.md, "The audit policy", says what they keep.
#
# A change of this file reaches the running cluster only when it is patched
# in. It needs no reboot: Talos writes the policy file, and the API server
# starts again with it. Run on WSL-02's distro, from a clone of this repo.
# Look at the change first:
#   talosctl --talosconfig ~/.talos/config-homelab-wsl-02 \
#     -n 10.6.0.2 patch mc --mode=no-reboot --dry-run \
#     --patch @talos/wsl-02/patches/audit-policy.yaml
# Then apply it, with the same command without --dry-run.
#
# The way back is the policy that Talos has with no document, one line for
# each request:
#   talosctl --talosconfig ~/.talos/config-homelab-wsl-02 \
#     -n 10.6.0.2 patch mc --mode=no-reboot \
#     --patch '{"apiVersion":"v1alpha1","kind":"KubeAuditPolicyConfig","configuration":{"apiVersion":"audit.k8s.io/v1","kind":"Policy","rules":[{"level":"Metadata"}]}}'
apiVersion: v1alpha1
kind: KubeAuditPolicyConfig
configuration:
  apiVersion: audit.k8s.io/v1
  kind: Policy
  # One line for each request, when its answer is complete.
  omitStages:
    - RequestReceived
  rules:
    # 1. Each request on a Secret, a read too, by each user: a person, a
    # service account, a kubelet, a part of the control plane.
    - level: Metadata
      resources:
        - group: ""
          resources: ["secrets"]
    # 2. Each command in a pod, each attach, each forwarded port and each
    # request through the proxy of a pod, a Service or a node.
    - level: Metadata
      resources:
        - group: ""
          resources:
            - pods/exec
            - pods/attach
            - pods/portforward
            - pods/proxy
            - services/proxy
            - nodes/proxy
    # 3. Not kept: the writes of leases and of events: the heartbeat of each
    # component, and the notes that each component writes about its work.
    - level: None
      verbs: ["create", "update", "patch"]
      resources:
        - group: coordination.k8s.io
          resources: ["leases"]
        - group: ""
          resources: ["events"]
        - group: events.k8s.io
          resources: ["events"]
    # 4. Not kept: the health and the version of the API server.
    - level: None
      nonResourceURLs:
        - /healthz*
        - /livez*
        - /readyz*
        - /version
    # 5. Not kept: the reads of the control plane itself.
    - level: None
      verbs: ["get", "list", "watch"]
      users:
        - system:apiserver
        - system:kube-controller-manager
        - system:kube-scheduler
    # 6. Not kept: the reads of a kubelet and of a service account. The rules
    # 1 and 2 are before this one, so their reads of a Secret stay.
    - level: None
      verbs: ["get", "list", "watch"]
      userGroups:
        - system:nodes
        - system:serviceaccounts
    # 7. Each other request: each write, and each read of a person.
    - level: Metadata
