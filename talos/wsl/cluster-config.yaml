# talosctl cluster create configuration for the WSL Docker-mode cluster
#
# Usage:
#   talosctl cluster create docker \
#     --name homelab-wsl \
#     --workers 2 \
#     --cpus-controlplanes 4.0 --cpus-workers 4.0 \
#     --memory-controlplanes 4GiB --memory-workers 13GiB \
#     --kubernetes-version <kubernetes from talos/wsl/versions.yaml> \
#     --image ghcr.io/siderolabs/talos:<talos from talos/wsl/versions.yaml> \
#     --config-patch @talos/wsl/cluster-config.yaml \
#     --config-patch @talos/wsl/patches/kubelet-image-gc.yaml \
#     --config-patch-controlplanes @talos/wsl/patches/talos-api-access.yaml
#
# WSL2 VM ceiling: needs to accommodate ~20GiB Talos + Docker + WSL
# services. Set `memory=24GB` in C:\Users\<user>\.wslconfig and run
# `wsl --shutdown` from PowerShell before recreating.
#
# This creates a 3-node cluster (1 CP + 2 workers) in Docker containers.
#
# CNI is disabled so Flannel is installed via the bootstrap playbook
# post-cluster-create. (Cilium's default values ask for CAP_SYS_MODULE, which
# the WSL2 kernel rejects in nested containers; without it Cilium runs here,
# and homelab-wsl-02 uses it. docs/wsl/bootstrap.md.)
#
# This file is in the v1alpha1 form, which Talos rejects when the config comes
# from talosctl >= 1.14 ("cluster network config is already set in the
# v1alpha1 config"): recreate homelab-wsl with talosctl < 1.14, or move it to
# the multi-document form of talos/wsl-02/patches/.
#
# kube-proxy is kept enabled on WSL because Flannel doesn't replace it.
# (MS-01 disables kube-proxy because Cilium does the replacement there.)

cluster:
  controllerManager:
    extraArgs:
      # Delete finished pods promptly. Graceful node shutdowns (every WSL
      # restart) leave pods Succeeded/Failed, and the default threshold
      # (12500) means they are never collected. A Recreate Deployment waits
      # for its pod count to reach zero, finished pods included, before
      # starting the new pod, so leftovers stall its next rollout with no pod
      # (seen on Grafana). 1 is the lowest value that keeps the collector on.
      terminated-pod-gc-threshold: "1"
  network:
    cni:
      name: none
    podSubnets:
      - 10.42.0.0/16
    serviceSubnets:
      - 10.43.0.0/16
  discovery:
    enabled: true
    registries:
      kubernetes:
        disabled: false
      service:
        disabled: true

machine:
  features:
    kubePrism:
      enabled: true
      port: 7445
