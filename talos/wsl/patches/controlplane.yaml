# homelab-wsl: control plane only (Talos refuses these on workers), in the
# multi-document form of patches/cluster.yaml. The live node has the same
# settings in v1alpha1 form (cluster-config.yaml, patches/talos-api-access.yaml).
#
# Finished pods are deleted at once (cluster-config.yaml has the history).
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  terminated-pod-gc-threshold: "1"
---
# tuppr (system-upgrade) drives the Talos API from inside the cluster
# (patches/talos-api-access.yaml). The v1alpha1 key, as homelab-wsl-02 and the
# live node have it. Talos 1.14 also has the document KubeTalosAPIAccessConfig,
# the form for the conversion of the live node.
machine:
  features:
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles: [os:admin]
      allowedKubernetesNamespaces: [system-upgrade]
