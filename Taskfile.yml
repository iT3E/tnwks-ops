---
version: "3"

vars:
  KUBERNETES_DIR: "{{.ROOT_DIR}}/kubernetes"
  ANSIBLE_DIR: "{{.ROOT_DIR}}/infrastructure/ansible"
  # The pinned Ansible controller (infrastructure/ansible/pyproject.toml and
  # uv.lock): `{{.ANSIBLE}} ansible-playbook ...` from any directory.
  ANSIBLE: uv run --project {{.ROOT_DIR}}/infrastructure/ansible --locked
  TERRAFORM_DIR: "{{.ROOT_DIR}}/infrastructure/terraform"

dotenv: [".config.env"]

env:
  KUBECONFIG: "{{.ROOT_DIR}}/kubeconfig"
  SOPS_AGE_KEY_FILE: "{{.HOME}}/.config/sops/age/keys.txt"
  ANSIBLE_CONFIG: "{{.ROOT_DIR}}/infrastructure/ansible/ansible.cfg"

includes:
  ansible: .taskfiles/AnsibleTasks.yml
  aws: .taskfiles/AwsTasks.yml
  bootstrap: .taskfiles/BootstrapTasks.yml
  cluster: .taskfiles/ClusterTasks.yml
  edgeos: .taskfiles/EdgeosTasks.yml
  healthchecks: .taskfiles/HealthchecksTasks.yml
  mikrotik: .taskfiles/MikrotikTasks.yml
  precommit: .taskfiles/PrecommitTasks.yml
  privacy: .taskfiles/PrivacyTasks.yml
  talos: .taskfiles/TalosTasks.yml
  terraform: .taskfiles/TerraformTasks.yml
  unifi: .taskfiles/UnifiTasks.yml
  wsl-host: .taskfiles/WslHostTasks.yml

tasks:
  # Move an app between the WSL sites (docs/wsl/multi-site.md, bin/site-failover).
  # homelab-wsl-02's API is reached over SSH: set FAILOVER_SSH_HOMELAB_WSL_02
  # ("user@host -p 2222") when running from homelab-wsl's side.
  failover:
    desc: "Planned switchover of an app to a site: task failover APP=mealie TO=homelab-wsl-02"
    requires:
      vars: [APP, TO]
    cmds:
      - bin/site-failover switchover {{.APP}} --to {{.TO}} {{.CLI_ARGS}}
  failover:status:
    desc: "Where an app runs and its overrides: task failover:status APP=mealie"
    requires:
      vars: [APP]
    cmds:
      - bin/site-failover status {{.APP}}
  failover:clear:
    desc: "Drop an app's site-overrides once git matches them: task failover:clear APP=mealie"
    requires:
      vars: [APP]
    cmds:
      - bin/site-failover clear {{.APP}} {{.CLI_ARGS}}

  init:
    desc: Initialize workstation dependencies with Brew
    cmds:
      - brew install {{.DEPS}} {{.CLI_ARGS}}
    preconditions:
      - sh: command -v brew
        msg: |
          Homebrew is not installed. Using MacOS, Linux or WSL?
          Head over to https://brew.sh to get up and running.
    vars:
      DEPS: >-
        age
        awscli
        betterleaks
        changie
        cilium-cli
        cloudflare/cloudflare/cloudflared
        direnv
        fluxcd/tap/flux
        go-task/tap/go-task
        helm
        ipcalc
        jq
        kubernetes-cli
        kustomize
        pre-commit
        prettier
        rolesanywhere-credential-helper
        sops
        stern
        terraform
        tflint
        uv
        weaveworks/tap/gitops
        yamllint
        yq

  verify:
    desc: Verify env settings
    cmds:
      - ./configure --verify

  configure:
    desc: Configure repository from env settings
    cmds:
      - ./configure
